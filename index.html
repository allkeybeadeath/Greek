<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ἑλληνικὴ Παιδεία — 고전 그리스어 학습</title>

<!-- ===== PWA ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1612">
<meta name="application-name" content="Παιδεία">
<meta name="description" content="고전 그리스어 학습기 — 어휘·문법·원문·형태분석·라이브 순위">
<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Παιδεία">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   적색상 도기(red-figure) 미학 — terracotta / black-glaze / ivory
   ============================================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --terracotta:#C44536;
  --terracotta-d:#9E3528;
  --terracotta-l:#D87060;
  --black-glaze:#1a1612;
  --black-glaze-l:#2a241e;
  --ivory:#F4E8D8;
  --ivory-d:#E5D5BC;
  --ivory-w:#FBF6EC;
  --clay:#C4986A;
  --clay-d:#8B6B45;
  --gold:#B8945B;
  --shadow:rgba(26,22,18,0.18);
  --shadow-s:rgba(26,22,18,0.08);
  --ok:#5C8A4A;
  --bad:#A1342B;
  --warn:#C49849;
  --font-display:'Cormorant Garamond',serif;
  --font-grk:'Gentium Book Plus','GFS Didot',Georgia,serif;
  --font-ko:'Noto Sans KR',-apple-system,sans-serif;
  --r:8px;
  --r-l:14px;
  --t:.2s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;background:var(--ivory);color:var(--black-glaze);font-family:var(--font-ko);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.grk{font-family:var(--font-grk)}
.lat{font-family:var(--font-display);font-style:italic}

/* iOS safe-area 노치·홈바 대응 */
@supports (padding: env(safe-area-inset-top)){
  .app-header{ padding-top: calc(18px + env(safe-area-inset-top)) }
  .bottom-nav{ padding-bottom: env(safe-area-inset-bottom) }
}

/* Baked-clay texture overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 60% 80% at 20% 20%,rgba(196,134,86,.10),transparent 60%),
    radial-gradient(ellipse 70% 90% at 80% 90%,rgba(196,69,54,.08),transparent 60%),
    repeating-linear-gradient(45deg,transparent 0 7px,rgba(139,107,69,.018) 7px 8px);
}

/* Meander border (Greek key) — used as decorative divider */
.meander{
  height:18px;background-repeat:repeat-x;background-position:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='18' viewBox='0 0 40 18'><path d='M0 14h6V4h14v6h-6v4h12V4h6v10h6' fill='none' stroke='%231a1612' stroke-width='1.2'/></svg>");
  opacity:.55;
}

#app{min-height:100vh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--ivory);position:relative;box-shadow:0 0 40px rgba(0,0,0,.05)}

/* ============================================================================
   상단 헤더 — 도기의 어깨 부분처럼
   ============================================================================ */
.app-header{
  background:linear-gradient(180deg,var(--black-glaze) 0%,var(--black-glaze-l) 100%);
  color:var(--ivory);padding:18px 18px 12px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 12px var(--shadow);
}
.app-header h1{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.app-header h1 .grk{font-family:var(--font-grk);color:var(--terracotta-l);font-size:.85em}
.app-header h1 .sub{font-family:var(--font-ko);font-weight:400;font-size:13px;color:var(--clay);margin-left:auto;opacity:.85}
.level-banner{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(244,232,216,.15)}
.level-banner .lvl-name{font-family:var(--font-grk);font-size:18px;color:var(--terracotta-l);font-weight:700}
.level-banner .lvl-name .ko{font-family:var(--font-ko);font-size:11px;color:var(--clay);font-weight:400;margin-left:4px}
.xp-bar{flex:1;height:6px;background:rgba(244,232,216,.12);border-radius:3px;overflow:hidden;margin-left:auto;max-width:180px}
.xp-bar .fill{height:100%;background:linear-gradient(90deg,var(--terracotta),var(--terracotta-l));transition:width .6s ease-out}
.xp-num{font-size:11px;color:var(--clay);font-variant-numeric:tabular-nums;min-width:60px;text-align:right}

/* ============================================================================
   하단 네비게이션 — 도기 굽처럼
   ============================================================================ */
.bottom-nav{
  display:grid;grid-template-columns:repeat(5,1fr);
  background:linear-gradient(180deg,var(--ivory) 0%,var(--ivory-d) 100%);
  border-top:1px solid var(--clay-d);position:sticky;bottom:0;z-index:50;
  box-shadow:0 -2px 12px var(--shadow-s);
}
.nav-btn{
  border:none;background:none;padding:10px 4px 8px;font-family:var(--font-ko);
  color:var(--black-glaze-l);cursor:pointer;transition:all var(--t);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
.nav-btn .ic{font-family:var(--font-grk);font-size:18px;line-height:1;color:var(--black-glaze);font-weight:700}
.nav-btn .lb{font-size:10px;letter-spacing:.05em}
.nav-btn.active{color:var(--terracotta)}
.nav-btn.active .ic{color:var(--terracotta)}
.nav-btn.active::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--terracotta);border-radius:1px}
.nav-btn:active{transform:scale(.95)}

/* ============================================================================
   메인 콘텐츠
   ============================================================================ */
main#view{flex:1;padding:16px 16px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--black-glaze);margin-bottom:4px;letter-spacing:.01em}
.view-title .grk{color:var(--terracotta-d);font-weight:600;margin-right:8px}
.view-sub{font-size:13px;color:var(--clay-d);margin-bottom:18px}

/* 카드 — 도기 패널 */
.card{
  background:var(--ivory-w);border:1px solid var(--clay);border-radius:var(--r-l);
  padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow-s);
  position:relative;overflow:hidden;
}
.card.warm{background:linear-gradient(135deg,var(--ivory-w) 0%,var(--clay) 200%);border-color:var(--terracotta-d)}
.card.dark{background:var(--black-glaze);color:var(--ivory);border-color:var(--black-glaze)}
.card.dark .grk{color:var(--terracotta-l)}

/* 통계 띠 */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat-cell{background:var(--ivory-w);border:1px solid var(--clay);border-radius:var(--r);padding:10px 6px;text-align:center}
.stat-cell .v{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--terracotta-d);line-height:1.1}
.stat-cell .l{font-size:10px;color:var(--clay-d);margin-top:2px;letter-spacing:.02em}

/* 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{
  background:var(--ivory-w);border:1px solid var(--clay);border-radius:var(--r-l);
  padding:16px 14px;text-align:left;cursor:pointer;transition:transform var(--t),box-shadow var(--t);
  display:flex;flex-direction:column;gap:6px;font-family:inherit;color:inherit;
}
.tile:active{transform:scale(.97)}
.tile:hover{box-shadow:0 4px 14px var(--shadow)}
.tile .grk{font-size:24px;color:var(--terracotta-d);font-weight:600;line-height:1}
.tile .title{font-size:15px;font-weight:600;color:var(--black-glaze)}
.tile .desc{font-size:11px;color:var(--clay-d)}

/* 일일 인용구 */
.quote-card{background:linear-gradient(135deg,var(--black-glaze) 0%,#0f0c09 100%);color:var(--ivory);padding:18px;border-radius:var(--r-l);margin-bottom:16px;border:1px solid var(--terracotta-d);position:relative}
.quote-card .grk{font-family:var(--font-grk);font-size:18px;line-height:1.5;color:var(--ivory);font-style:italic}
.quote-card .src{font-size:11px;color:var(--terracotta-l);margin-top:8px;letter-spacing:.05em;text-transform:uppercase}

/* 버튼 — 도기 표면 같은 매트 톤 */
.btn{
  border:none;background:var(--terracotta);color:var(--ivory-w);
  padding:11px 18px;border-radius:var(--r);font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:all var(--t);letter-spacing:.02em;
}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--terracotta-d)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:var(--black-glaze);color:var(--ivory)}
.btn-g:hover{background:var(--black-glaze-l)}
.btn-o{background:transparent;color:var(--terracotta-d);border:1px solid var(--terracotta-d)}
.btn-o:hover{background:var(--terracotta);color:var(--ivory-w)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* 필터 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{
  background:var(--ivory-w);border:1px solid var(--clay);color:var(--black-glaze);
  padding:5px 11px;border-radius:14px;font-size:12px;cursor:pointer;transition:all var(--t);
  font-family:inherit;white-space:nowrap;
}
.chip:hover{border-color:var(--terracotta)}
.chip.active{background:var(--terracotta);color:var(--ivory-w);border-color:var(--terracotta)}

/* 퀴즈 카드 */
.quiz-card{background:var(--ivory-w);border:2px solid var(--clay);border-radius:var(--r-l);padding:22px 18px;margin-bottom:12px;text-align:center}
.quiz-prompt{font-family:var(--font-grk);font-size:32px;color:var(--black-glaze);margin-bottom:6px;line-height:1.2;font-weight:600}
.quiz-prompt.ko{font-family:var(--font-ko);font-size:20px;font-weight:600}
.quiz-sub{font-size:12px;color:var(--clay-d);margin-bottom:18px}

.options{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.opt{
  background:var(--ivory-w);border:1.5px solid var(--clay);border-radius:var(--r);
  padding:12px 14px;text-align:left;font-family:inherit;font-size:14px;color:var(--black-glaze);
  cursor:pointer;transition:all var(--t);
}
.opt:hover{border-color:var(--terracotta);background:var(--ivory-d)}
.opt.right{background:#E8F0DD;border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:#F4D8D4;border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.4}
.opt .grk{font-size:18px}

.feedback{margin:14px 0;padding:12px;border-radius:var(--r);font-size:14px;text-align:left}
.feedback.ok{background:#E8F0DD;color:var(--ok);border:1px solid var(--ok)}
.feedback.bad{background:#F4D8D4;color:var(--bad);border:1px solid var(--bad)}
.feedback .grk{font-size:17px;font-weight:600}

input.input{
  width:100%;padding:12px 14px;border:1.5px solid var(--clay);border-radius:var(--r);
  font-family:var(--font-grk);font-size:18px;background:var(--ivory-w);color:var(--black-glaze);
}
input.input:focus{outline:none;border-color:var(--terracotta)}
textarea.input{font-family:var(--font-ko);font-size:14px;line-height:1.5;min-height:80px;resize:vertical}

/* 문법 — 패러다임 테이블 */
.paradigm{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
.paradigm th,.paradigm td{padding:7px 9px;border:1px solid var(--clay);text-align:left}
.paradigm th{background:var(--black-glaze);color:var(--ivory);font-family:var(--font-display);font-weight:600;letter-spacing:.02em;font-size:13px}
.paradigm td.lbl{background:var(--ivory-d);font-weight:600;color:var(--black-glaze-l);font-size:13px}
.paradigm td.grk{font-family:var(--font-grk);font-size:15px;color:var(--terracotta-d);font-weight:600}
.paradigm caption{font-family:var(--font-display);font-size:17px;color:var(--black-glaze);font-style:italic;text-align:left;padding:6px 0;font-weight:600}
.paradigm .section-row td{background:var(--clay);color:var(--ivory-w);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase}

/* 원문 뷰어 */
.passage{font-family:var(--font-grk);font-size:18px;line-height:2.2;color:var(--black-glaze);padding:18px 4px;text-align:left}
.passage .w{cursor:pointer;border-radius:3px;padding:1px 2px;transition:background var(--t)}
.passage .w:hover{background:var(--terracotta-l);color:var(--ivory-w)}
.passage .pn{display:inline-block;width:34px;color:var(--clay-d);font-family:var(--font-display);font-style:italic;font-size:14px;user-select:none}
.cite-line{font-family:var(--font-display);font-style:italic;color:var(--clay-d);font-size:13px;margin-bottom:6px;letter-spacing:.02em}

/* 명예의 전당 */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.badge{
  aspect-ratio:1;background:var(--ivory-w);border:2px solid var(--clay);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;
  transition:all var(--t);position:relative;
}
.badge.got{border-color:var(--terracotta);background:linear-gradient(135deg,var(--ivory-w),var(--clay));box-shadow:0 2px 8px var(--shadow)}
.badge.locked{opacity:.35;filter:grayscale(.8)}
.badge .ic{font-family:var(--font-grk);font-size:22px;color:var(--terracotta-d);line-height:1;margin-bottom:2px}
.badge .nm{font-size:9px;line-height:1.1;color:var(--black-glaze-l)}

.ladder{margin:10px 0}
.ladder-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);margin-bottom:4px;background:var(--ivory-w);border:1px solid var(--clay)}
.ladder-row.current{background:linear-gradient(90deg,var(--terracotta-l) 0%,var(--ivory-w) 80%);border-color:var(--terracotta)}
.ladder-row.passed{opacity:.55}
.ladder-row .grk{font-family:var(--font-grk);font-size:16px;color:var(--terracotta-d);font-weight:700;min-width:80px}
.ladder-row .ko{font-size:12px;color:var(--clay-d);flex:1}
.ladder-row .xp-need{font-size:11px;color:var(--clay-d);font-variant-numeric:tabular-nums}

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:var(--black-glaze);color:var(--ivory-w);padding:10px 18px;border-radius:20px;
  font-size:13px;box-shadow:0 4px 16px var(--shadow);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.toast.show{opacity:1}
.toast.xp{background:var(--terracotta);font-weight:600}

/* 메모 영역 */
.memo-block{margin-top:14px}
.memo-block label{display:block;font-size:12px;color:var(--clay-d);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}

/* 도움말·작은 텍스트 */
.hint{font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic}
.divider{height:1px;background:var(--clay);margin:18px 0;opacity:.4}

/* 빈 상태 */
.empty{text-align:center;padding:32px 20px;color:var(--clay-d)}
.empty .grk{font-size:32px;color:var(--terracotta-l);margin-bottom:10px;font-family:var(--font-grk)}

/* 동적 요소 */
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse .5s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* 미니 링크 */
.minlink{color:var(--terracotta-d);text-decoration:none;font-size:12px;border-bottom:1px dotted var(--terracotta-d);font-weight:500}
.minlink:hover{color:var(--terracotta)}

/* 진행률 */
.progress{height:5px;background:var(--ivory-d);border-radius:3px;overflow:hidden;margin:8px 0}
.progress .fill{height:100%;background:var(--terracotta);transition:width .4s}

/* 큰 그리스어 표시 */
.big-grk{font-family:var(--font-grk);font-size:28px;color:var(--terracotta-d);font-weight:600;line-height:1.3;margin:8px 0}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(26,22,18,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--ivory-w);border-radius:var(--r-l);padding:22px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--clay)}
.modal h3{font-family:var(--font-display);font-size:20px;color:var(--terracotta-d);margin-bottom:10px;font-weight:600}
.modal-close{float:right;cursor:pointer;font-size:20px;color:var(--clay-d);border:none;background:none}

/* 데스크탑 너비 적응 */
@media(min-width:560px){
  #app{max-width:520px;margin:20px auto;border-radius:var(--r-l);overflow:hidden;min-height:calc(100vh - 40px)}
  body{background:var(--clay-d)}
  body::before{background:
    radial-gradient(ellipse 60% 80% at 20% 20%,rgba(196,134,86,.20),transparent 60%),
    radial-gradient(ellipse 70% 90% at 80% 90%,rgba(196,69,54,.18),transparent 60%),
    repeating-linear-gradient(45deg,transparent 0 7px,rgba(0,0,0,.025) 7px 8px)}
}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>
      <span class="grk">Ἑλληνικὴ Παιδεία</span>
      <span class="sub">CIM Lab</span>
    </h1>
    <div class="level-banner" id="lvl-banner"></div>
  </header>
  <div class="meander"></div>

  <main id="view"><div class="empty"><div class="grk">⏳</div>로딩 중…</div></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home"><span class="ic">Ἑ</span><span class="lb">홈</span></button>
    <button class="nav-btn" data-tab="vocab"><span class="ic">Λ</span><span class="lb">어휘</span></button>
    <button class="nav-btn" data-tab="grammar"><span class="ic">Γ</span><span class="lb">문법</span></button>
    <button class="nav-btn" data-tab="read"><span class="ic">Ἀ</span><span class="lb">원문</span></button>
    <button class="nav-btn" data-tab="hall"><span class="ic">Τ</span><span class="lb">명예</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<!-- ===== PWA: 서비스 워커 등록 ===== -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // 새 버전 감지 시 알림
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        if (!newSW) return;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // 새 버전이 대기 중 — 토스트 표시
            const t = document.getElementById('toast');
            if (t) {
              t.innerHTML = '새 버전 사용 가능 — <button style="background:none;border:none;color:#D87060;text-decoration:underline;cursor:pointer;font:inherit" onclick="navigator.serviceWorker.controller.postMessage(\'skipWaiting\');location.reload()">새로고침</button>';
              t.classList.add('show');
              setTimeout(() => t.classList.remove('show'), 8000);
            }
          }

ναγκαῖον ἐδόκει εἶναι τὸ τοῦ θεοῦ περὶ πλείστου ποιεῖσθαι—ἰτέον οὖν, σκοποῦντι τὸν χρησμὸν τί λέγει, ἐπὶ ἅπαντας τούς τι δοκοῦντας εἰδέναι."

        text: "ταῦτα ἐγώ σοι οὐ πείθομαι, ὦ Μέλητε, οἶμαι δὲ οὐδὲ ἄλλον ἀνθρώπων οὐδένα· ἀλλʼ ἢ οὐ διαφθείρω, ἢ εἰ διαφθείρω, ἄκων, ὥστε σύ γε κατʼ ἀμφότερα ψεύδῃ. εἰ δὲ ἄκων διαφθείρω, τῶν τοιούτων ἁμαρτημάτων οὐ δεῦρο νόμος εἰσάγειν ἐστίν, ἀλλὰ ἰδίᾳ λαβόντα διδάσκειν καὶ νουθετεῖν· δῆλον γὰρ ὅτι ἐὰν μάθω, παύσομαι ὅ γε ἄκων ποιῶ. σὺ δὲ συγγενέσθαι μέν μοι καὶ διδάξαι ἔφυγες καὶ οὐκ ἠθέλησας, δεῦρο δὲ εἰσάγεις, οἷ νόμος ἐστὶν εἰσάγειν τοὺς κολάσεως δεομένους ἀλλʼ οὐ μαθήσεως. ἀλλὰ γάρ, ὦ ἄνδρες Ἀθηναῖοι, τοῦτο μὲν ἤδη δῆλον οὑγὼ ἔλεγον, ὅτι Μελήτῳ τούτων οὔτε μέγα οὔτε μικρὸν πώποτε ἐμέλησεν. ὅμως δὲ δὴ λέγε ἡμῖν, πῶς με φῂς διαφθείρειν, ὦ Μέλητε, τοὺς νεωτέρους; ἢ δῆλον δὴ ὅτι κατὰ τὴν γραφὴν ἣν ἐγράψω θεοὺς διδάσκοντα μὴ νομίζειν οὓς ἡ πόλις νομίζει, ἕτερα δὲ δαιμόνια καινά; οὐ ταῦτα λέγεις ὅτι διδάσκων διαφθείρω;πάνυ μὲν οὖν σφόδρα ταῦτα λέγω.πρὸς αὐτῶν τοίνυν, ὦ Μέλητε, τούτων τῶν θεῶν ὧν νῦν ὁ λόγος ἐστίν, εἰπὲ ἔτι σαφέστερον καὶ ἐμοὶ καὶ τοῖς ἀνδράσιν τουτοισί. ἐγὼ γὰρ οὐ δύναμαι μαθεῖν πότερον λέγεις διδάσκειν με νομίζειν εἶναί τινας θεούς—καὶ αὐτὸς ἄρα νομίζω εἶναι θεοὺς καὶ οὐκ εἰμὶ τὸ παράπαν ἄθεος οὐδὲ ταύτῃ ἀδικῶ —οὐ μέντοι οὕσπερ γε ἡ πόλις ἀλλὰ ἑτέρους, καὶ τοῦτʼ ἔστιν ὅ μοι ἐγκαλεῖς, ὅτι ἑτέρους, ἢ παντάπασί με φῂς οὔτε αὐτὸν νομίζειν θεοὺς τούς τε ἄλλους ταῦτα διδάσκειν.ταῦτα λέγω, ὡς τὸ παράπαν οὐ νομίζεις θεούς. ὦ θαυμάσιε Μέλητε, ἵνα τί ταῦτα λέγεις; οὐδὲ ἥλιον οὐδὲ σελήνην ἄρα νομίζω θεοὺς εἶναι, ὥσπερ οἱ ἄλλοι ἄνθρωποι;μὰ Δίʼ, ὦ ἄνδρες δικασταί, ἐπεὶ τὸν μὲν ἥλιον λίθον φησὶν εἶναι, τὴν δὲ σελήνην γῆν.Ἀναξαγόρου οἴει κατηγορεῖν, ὦ φίλε Μέλητε; καὶ οὕτω καταφρονεῖς τῶνδε καὶ οἴει αὐτοὺς ἀπείρους γραμμάτων εἶναι ὥστε οὐκ εἰδέναι ὅτι τὰ Ἀναξαγόρου βιβλία τοῦ Κλαζομενίου γέμει τούτων τῶν λόγων; καὶ δὴ καὶ οἱ νέοι ταῦτα παρʼ ἐμοῦ μανθάνουσιν, ἃ ἔξεστιν ἐνίοτε εἰ πάνυ πολλοῦ δραχμῆς ἐκ τῆς ὀρχήστρας πριαμένοις Σωκράτους καταγελᾶν, ἐὰν προσποιῆται ἑαυτοῦ εἶναι, ἄλλως τε καὶ οὕτως ἄτοπα ὄντα; ἀλλʼ, ὦ πρὸς Διός, οὑτωσί σοι δοκῶ; οὐδένα νομίζω θεὸν εἶναι;οὐ μέντοι μὰ Δία οὐδʼ ὁπωστιοῦν.ἄπιστός γʼ εἶ, ὦ Μέλητε, καὶ ταῦτα μέντοι, ὡς ἐμοὶ δοκεῖς, σαυτῷ. ἐμοὶ γὰρ δοκεῖ οὑτοσί, ὦ ἄνδρες Ἀθηναῖοι, πάνυ εἶναι ὑβριστὴς καὶ ἀκόλαστος, καὶ ἀτεχνῶς τὴν γραφὴν ταύτην ὕβρει τινὶ καὶ ἀκολασίᾳ καὶ νεότητι γράψασθαι."
      },
      {
        n: "27",
        label: "§27",
        text: "ἔοικεν γὰρ ὥσπερ αἴνιγμα συντιθέντι διαπειρωμένῳ ἆρα γνώσεται Σωκράτης ὁ σοφὸς δὴ ἐμοῦ χαριεντιζομένου καὶ ἐναντίʼ ἐμαυτῷ λέγοντος, ἢ ἐξαπατήσω αὐτὸν καὶ τοὺς ἄλλους τοὺς ἀκούοντας; οὗτος γὰρ ἐμοὶ φαίνεται τὰ ἐναντία λέγειν αὐτὸς ἑαυτῷ ἐν τῇ γραφῇ ὥσπερ ἂν εἰ εἴποι· ἀδικεῖ Σωκράτης θεοὺς οὐ νομίζων, ἀλλὰ θεοὺς νομίζων. καίτοι τοῦτό ἐστι παίζοντος.συνεπισκέψασθε δή, ὦ ἄνδρες, ᾗ μοι φαίνεται ταῦτα λέγειν· σὺ δὲ ἡμῖν ἀπόκριναι, ὦ Μέλητε. ὑμεῖς δέ, ὅπερ κατʼ ἀρχὰς ὑμᾶς παρῃτησάμην, μέμνησθέ μοι μὴ θορυβεῖν ἐὰν ἐν τῷ εἰωθότι τρόπῳ τοὺς λόγους ποιῶμαι.ἔστιν ὅστις ἀνθρώπων, ὦ Μέλητε, ἀνθρώπεια μὲν νομίζει πράγματʼ εἶναι, ἀνθρώπους δὲ οὐ νομίζει; ἀποκρινέσθω, ὦ ἄνδρες, καὶ μὴ ἄλλα καὶ ἄλλα θορυβείτω· ἔσθʼ ὅστις ἵππους μὲν οὐ νομίζει, ἱππικὰ δὲ πράγματα; ἢ αὐλητὰς μὲν οὐ νομίζει εἶναι, αὐλητικὰ δὲ πράγματα; οὐκ ἔστιν, ὦ ἄριστε ἀνδρῶν· εἰ μὴ σὺ βούλει ἀποκρίνεσθαι, ἐγὼ σοὶ λέγω καὶ τοῖς ἄλλοις τουτοισί. ἀλλὰ τὸ ἐπὶ τούτῳ γε ἀπόκριναι· ἔσθʼ ὅστις δαιμόνια μὲν νομίζει πράγματʼ εἶναι, δαίμονας δὲ οὐ νομίζει;οὐκ ἔστιν.ὡς ὤνησας ὅτι μόγις ἀπεκρίνω ὑπὸ τουτωνὶ ἀναγκαζόμενος. οὐκοῦν δαιμόνια μὲν φῄς με καὶ νομίζειν καὶ διδάσκειν, εἴτʼ οὖν καινὰ εἴτε παλαιά, ἀλλʼ οὖν δαιμόνιά γε νομίζω κατὰ τὸν σὸν λόγον, καὶ ταῦτα καὶ διωμόσω ἐν τῇ ἀντιγραφῇ. εἰ δὲ δαιμόνια νομίζω, καὶ δαίμονας δήπου πολλὴ ἀνάγκη νομίζειν μέ ἐστιν· οὐχ οὕτως ἔχει; ἔχει δή· τίθημι γάρ σε ὁμολογοῦντα, ἐπειδὴ οὐκ ἀποκρίνῃ. τοὺς δὲ δαίμονας οὐχὶ ἤτοι θεούς γε ἡγούμεθα ἢ θεῶν παῖδας; φῂς ἢ οὔ;πάνυ γε.οὐκοῦν εἴπερ δαίμονας ἡγοῦμαι, ὡς σὺ φῄς, εἰ μὲν θεοί τινές εἰσιν οἱ δαίμονες, τοῦτʼ ἂν εἴη ὃ ἐγώ φημί σε αἰνίττεσθαι καὶ χαριεντίζεσθαι, θεοὺς οὐχ ἡγούμενον φάναι με θεοὺς αὖ ἡγεῖσθαι πάλιν, ἐπειδήπερ γε δαίμονας ἡγοῦμαι· εἰ δʼ αὖ οἱ δαίμονες θεῶν παῖδές εἰσιν νόθοι τινὲς ἢ ἐκ νυμφῶν ἢ ἔκ τινων ἄλλων ὧν δὴ καὶ λέγονται, τίς ἂν ἀνθρώπων θεῶν μὲν παῖδας ἡγοῖτο εἶναι, θεοὺς δὲ μή; ὁμοίως γὰρ ἂν ἄτοπον εἴη ὥσπερ ἂν εἴ τις ἵππων μὲν παῖδας ἡγοῖτο ἢ καὶ ὄνων, τοὺς ἡμιόνους, ἵππους δὲ καὶ ὄνους μὴ ἡγοῖτο εἶναι. ἀλλʼ, ὦ Μέλητε, οὐκ ἔστιν ὅπως σὺ ταῦτα οὐχὶ ἀποπειρώμενος ἡμῶν ἐγράψω τὴν γραφὴν ταύτην ἢ ἀπορῶν ὅτι ἐγκαλοῖς ἐμοὶ ἀληθὲς ἀδίκημα· ὅπως δὲ σύ τινα πείθοις ἂν καὶ σμικρὸν νοῦν ἔχοντα ἀνθρώπων, ὡς οὐ τοῦ αὐτοῦ ἔστιν καὶ δαιμόνια καὶ θεῖα ἡγεῖσθαι, καὶ αὖ τοῦ αὐτοῦ μήτε δαίμονας μήτε θεοὺς μήτε ἥρωας, οὐδεμία μηχανή ἐστιν."
      },
      {
        n: "28",
        label: "§28",
        text: "ἀλλὰ γάρ, ὦ ἄνδρες Ἀθηναῖοι, ὡς μὲν ἐγὼ οὐκ ἀδικῶ κατὰ τὴν Μελήτου γραφήν, οὐ πολλῆς μοι δοκεῖ εἶναι ἀπολογίας, ἀλλὰ ἱκανὰ καὶ ταῦτα· ὃ δὲ καὶ ἐν τοῖς ἔμπροσθεν ἔλεγον, ὅτι πολλή μοι ἀπέχθεια γέγονεν καὶ πρὸς πολλούς, εὖ ἴστε ὅτι ἀληθές ἐστιν. καὶ τοῦτʼ ἔστιν ὃ ἐμὲ αἱρεῖ, ἐάνπερ αἱρῇ, οὐ Μέλητος οὐδὲ Ἄνυτος ἀλλʼ ἡ τῶν πολλῶν διαβολή τε καὶ φθόνος. ἃ δὴ πολλοὺς καὶ ἄλλους καὶ ἀγαθοὺς ἄνδρας ᾕρηκεν, οἶμαι δὲ καὶ αἱρήσει· οὐδὲν δὲ δεινὸν μὴ ἐν ἐμοὶ στῇ. ἴσως ἂν οὖν εἴποι τις· εἶτʼ οὐκ αἰσχύνῃ, ὦ Σώκρατες, τοιοῦτον ἐπιτήδευμα ἐπιτηδεύσας ἐξ οὗ κινδυνεύεις νυνὶ ἀποθανεῖν; ἐγὼ δὲ τούτῳ ἂν δίκαιον λόγον ἀντείποιμι, ὅτι οὐ καλῶς λέγεις, ὦ ἄνθρωπε, εἰ οἴει δεῖν κίνδυνον ὑπολογίζεσθαι τοῦ ζῆν ἢ τεθνάναι ἄνδρα ὅτου τι καὶ σμικρὸν ὄφελός ἐστιν, ἀλλʼ οὐκ ἐκεῖνο μόνον σκοπεῖν ὅταν πράττῃ, πότερον δίκαια ἢ ἄδικα πράττει, καὶ ἀνδρὸς ἀγαθοῦ ἔργα ἢ κακοῦ. φαῦλοι γὰρ ἂν τῷ γε σῷ λόγῳ εἶεν τῶν ἡμιθέων ὅσοι ἐν Τροίᾳ τετελευτήκασιν οἵ τε ἄλλοι καὶ ὁ τῆς Θέτιδος υἱός, ὃς τοσοῦτον τοῦ κινδύνου κατεφρόνησεν παρὰ τὸ αἰσχρόν τι ὑπομεῖναι ὥστε, ἐπειδὴ εἶπεν ἡ μήτηρ αὐτῷ προθυμουμένῳ Ἕκτορα ἀποκτεῖναι, θεὸς οὖσα, οὑτωσί πως, ὡς ἐγὼ οἶμαι· ὦ παῖ, εἰ τιμωρήσεις Πατρόκλῳ τῷ ἑταίρῳ τὸν φόνον καὶ Ἕκτορα ἀποκτενεῖς, αὐτὸς ἀποθανῇ—αὐτίκα γάρ τοι, φησί, μεθʼ Ἕκτορα πότμος ἑτοῖμος —ὁ δὲ τοῦτο ἀκούσας τοῦ μὲν θανάτου καὶ τοῦ κινδύνου ὠλιγώρησε, πολὺ δὲ μᾶλλον δείσας τὸ ζῆν κακὸς ὢν καὶ τοῖς φίλοις μὴ τιμωρεῖν, αὐτίκα, φησί, τεθναίην, δίκην ἐπιθεὶς τῷ ἀδικοῦντι, ἵνα μὴ ἐνθάδε μένω καταγέλαστος παρὰ νηυσὶ κορωνίσιν ἄχθος ἀρούρης. ὴ αὐτὸν οἴει φροντίσαι θανάτου καὶ κινδύνου;οὕτω γὰρ ἔχει, ὦ ἄνδρες Ἀθηναῖοι, τῇ ἀληθείᾳ· οὗ ἄν τις ἑαυτὸν τάξῃ ἡγησάμενος βέλτιστον εἶναι ἢ ὑπʼ ἄρχοντος ταχθῇ, ἐνταῦθα δεῖ, ὡς ἐμοὶ δοκεῖ, μένοντα κινδυνεύειν, μηδὲν ὑπολογιζόμενον μήτε θάνατον μήτε ἄλλο μηδὲν πρὸ τοῦ αἰσχροῦ. ἐγὼ οὖν δεινὰ ἂν εἴην εἰργασμένος, ὦ ἄνδρες Ἀθηναῖοι, εἰ ὅτε μέν με οἱ ἄρχοντες ἔταττον, οὓς ὑμεῖς εἵλεσθε ἄρχειν μου, καὶ ἐν Ποτειδαίᾳ καὶ ἐν Ἀμφιπόλει καὶ ἐπὶ Δηλίῳ, τότε μὲν οὗ ἐκεῖνοι ἔταττον ἔμενον ὥσπερ καὶ ἄλλος τις καὶ ἐκινδύνευον ἀποθανεῖν, τοῦ δὲ θεοῦ τάττοντος, ὡς ἐγὼ ᾠήθην τε καὶ ὑπέλαβον, φιλοσοφοῦντά με δεῖν ζῆν καὶ ἐξετάζοντα ἐμαυτὸν καὶ τοὺς ἄλλους, ἐνταῦθα δὲ φοβηθεὶς ἢ θάνατον ἢ ἄλλʼ ὁτιοῦν πρᾶγμα λίποιμι τὴν τάξιν."
      },
      {
        n: "29",
        label: "§29",
        text: "δεινόν τἂν εἴη, καὶ ὡς ἀληθῶς τότʼ ἄν με δικαίως εἰσάγοι τις εἰς δικαστήριον, ὅτι οὐ νομίζω θεοὺς εἶναι ἀπειθῶν τῇ μαντείᾳ καὶ δεδιὼς θάνατον καὶ οἰόμενος σοφὸς εἶναι οὐκ ὤν. τὸ γάρ τοι θάνατον δεδιέναι, ὦ ἄνδρες, οὐδὲν ἄλλο ἐστὶν ἢ δοκεῖν σοφὸν εἶναι μὴ ὄντα· δοκεῖν γὰρ εἰδέναι ἐστὶν ἃ οὐκ οἶδεν. οἶδε μὲν γὰρ οὐδεὶς τὸν θάνατον οὐδʼ εἰ τυγχάνει τῷ ἀνθρώπῳ πάντων μέγιστον ὂν τῶν ἀγαθῶν, δεδίασι δʼ ὡς εὖ εἰδότες ὅτι μέγιστον τῶν κακῶν ἐστι. καίτοι πῶς οὐκ ἀμαθία ἐστὶν αὕτη ἡ ἐπονείδιστος, ἡ τοῦ οἴεσθαι εἰδέναι ἃ οὐκ οἶδεν; ἐγὼ δʼ, ὦ ἄνδρες, τούτῳ καὶ ἐνταῦθα ἴσως διαφέρω τῶν πολλῶν ἀνθρώπων, καὶ εἰ δή τῳ σοφώτερός του φαίην εἶναι, τούτῳ ἄν, ὅτι οὐκ εἰδὼς ἱκανῶς περὶ τῶν ἐν Ἅιδου οὕτω καὶ οἴομαι οὐκ εἰδέναι· τὸ δὲ ἀδικεῖν καὶ ἀπειθεῖν τῷ βελτίονι καὶ θεῷ καὶ ἀνθρώπῳ, ὅτι κακὸν καὶ αἰσχρόν ἐστιν οἶδα. πρὸ οὖν τῶν κακῶν ὧν οἶδα ὅτι κακά ἐστιν, ἃ μὴ οἶδα εἰ καὶ ἀγαθὰ ὄντα τυγχάνει οὐδέποτε φοβήσομαι οὐδὲ φεύξομαι· ὥστε οὐδʼ εἴ με νῦν ὑμεῖς ἀφίετε Ἀνύτῳ ἀπιστήσαντες, ὃς ἔφη ἢ τὴν ἀρχὴν οὐ δεῖν ἐμὲ δεῦρο εἰσελθεῖν ἤ, ἐπειδὴ εἰσῆλθον, οὐχ οἷόν τʼ εἶναι τὸ μὴ ἀποκτεῖναί με, λέγων πρὸς ὑμᾶς ὡς εἰ διαφευξοίμην ἤδη ὑμῶν οἱ ὑεῖς ἐπιτηδεύοντες ἃ Σωκράτης διδάσκει πάντες παντάπασι διαφθαρήσονται, —εἴ μοι πρὸς ταῦτα εἴποιτε· ὦ Σώκρατες, νῦν μὲν Ἀνύτῳ οὐ πεισόμεθα ἀλλʼ ἀφίεμέν σε, ἐπὶ τούτῳ μέντοι, ἐφʼ ᾧτε μηκέτι ἐν ταύτῃ τῇ ζητήσει διατρίβειν μηδὲ φιλοσοφεῖν· ἐὰν δὲ ἁλῷς ἔτι τοῦτο πράττων, ἀποθανῇ —εἰ οὖν με, ὅπερ εἶπον, ἐπὶ τούτοις ἀφίοιτε, εἴποιμʼ ἂν ὑμῖν ὅτι ἐγὼ ὑμᾶς, ὦ ἄνδρες Ἀθηναῖοι, ἀσπάζομαι μὲν καὶ φιλῶ, πείσομαι δὲ μᾶλλον τῷ θεῷ ἢ ὑμῖν, καὶ ἕωσπερ ἂν ἐμπνέω καὶ οἷός τε ὦ, οὐ μὴ παύσωμαι φιλοσοφῶν καὶ ὑμῖν παρακελευόμενός τε καὶ ἐνδεικνύμενος ὅτῳ ἂν ἀεὶ ἐντυγχάνω ὑμῶν, λέγων οἷάπερ εἴωθα, ὅτι ὦ ἄριστε ἀνδρῶν, Ἀθηναῖος ὤν, πόλεως τῆς μεγίστης καὶ εὐδοκιμωτάτης εἰς σοφίαν καὶ ἰσχύν, χρημάτων μὲν οὐκ αἰσχύνῃ ἐπιμελούμενος ὅπως σοι ἔσται ὡς πλεῖστα, καὶ δόξης καὶ τιμῆς, φρονήσεως δὲ καὶ ἀληθείας καὶ τῆς ψυχῆς ὅπως ὡς βελτίστη ἔσται οὐκ ἐπιμελῇ οὐδὲ φροντίζεις;"

      {
        n: "30",
        label: "§30",
        text: "καὶ ἐάν τις ὑμῶν ἀμφισβητήσῃ καὶ φῇ ἐπιμελεῖσθαι, οὐκ εὐθὺς ἀφήσω αὐτὸν οὐδʼ ἄπειμι, ἀλλʼ ἐρήσομαι αὐτὸν καὶ ἐξετάσω καὶ ἐλέγξω, καὶ ἐάν μοι μὴ δοκῇ κεκτῆσθαι ἀρετήν, φάναι δέ, ὀνειδιῶ ὅτι τὰ πλείστου ἄξια περὶ ἐλαχίστου ποιεῖται, τὰ δὲ φαυλότερα περὶ πλείονος. ταῦτα καὶ νεωτέρῳ καὶ πρεσβυτέρῳ ὅτῳ ἂν ἐντυγχάνω ποιήσω, καὶ ξένῳ καὶ ἀστῷ, μᾶλλον δὲ τοῖς ἀστοῖς, ὅσῳ μου ἐγγυτέρω ἐστὲ γένει. ταῦτα γὰρ κελεύει ὁ θεός, εὖ ἴστε, καὶ ἐγὼ οἴομαι οὐδέν πω ὑμῖν μεῖζον ἀγαθὸν γενέσθαι ἐν τῇ πόλει ἢ τὴν ἐμὴν τῷ θεῷ ὑπηρεσίαν. οὐδὲν γὰρ ἄλλο πράττων ἐγὼ περιέρχομαι ἢ πείθων ὑμῶν καὶ νεωτέρους καὶ πρεσβυτέρους μήτε σωμάτων ἐπιμελεῖσθαι μήτε χρημάτων πρότερον μηδὲ οὕτω σφόδρα ὡς τῆς ψυχῆς ὅπως ὡς ἀρίστη ἔσται, λέγων ὅτι οὐκ ἐκ χρημάτων ἀρετὴ γίγνεται, ἀλλʼ ἐξ ἀρετῆς χρήματα καὶ τὰ ἄλλα ἀγαθὰ τοῖς ἀνθρώποις ἅπαντα καὶ ἰδίᾳ καὶ δημοσίᾳ. εἰ μὲν οὖν ταῦτα λέγων διαφθείρω τοὺς νέους, ταῦτʼ ἂν εἴη βλαβερά· εἰ δέ τίς μέ φησιν ἄλλα λέγειν ἢ ταῦτα, οὐδὲν λέγει. πρὸς ταῦτα, φαίην ἄν, ὦ ἄνδρες Ἀθηναῖοι, ἢ πείθεσθε Ἀνύτῳ ἢ μή, καὶ ἢ ἀφίετέ με ἢ μή, ὡς ἐμοῦ οὐκ ἂν ποιήσαντος ἄλλα, οὐδʼ εἰ μέλλω πολλάκις τεθνάναι.μὴ θορυβεῖτε, ὦ ἄνδρες Ἀθηναῖοι, ἀλλʼ ἐμμείνατέ μοι οἷς ἐδεήθην ὑμῶν, μὴ θορυβεῖν ἐφʼ οἷς ἂν λέγω ἀλλʼ ἀκούειν· καὶ γάρ, ὡς ἐγὼ οἶμαι, ὀνήσεσθε ἀκούοντες. μέλλω γὰρ οὖν ἄττα ὑμῖν ἐρεῖν καὶ ἄλλα ἐφʼ οἷς ἴσως βοήσεσθε· ἀλλὰ μηδαμῶς ποιεῖτε τοῦτο. εὖ γὰρ ἴστε, ἐάν με ἀποκτείνητε τοιοῦτον ὄντα οἷον ἐγὼ λέγω, οὐκ ἐμὲ μείζω βλάψετε ἢ ὑμᾶς αὐτούς· ἐμὲ μὲν γὰρ οὐδὲν ἂν βλάψειεν οὔτε Μέλητος οὔτε Ἄνυτος—οὐδὲ γὰρ ἂν δύναιτο—οὐ γὰρ οἴομαι θεμιτὸν εἶναι ἀμείνονι ἀνδρὶ ὑπὸ χείρονος βλάπτεσθαι. ἀποκτείνειε μεντἂν ἴσως ἢ ἐξελάσειεν ἢ ἀτιμώσειεν· ἀλλὰ ταῦτα οὗτος μὲν ἴσως οἴεται καὶ ἄλλος τίς που μεγάλα κακά, ἐγὼ δʼ οὐκ οἴομαι, ἀλλὰ πολὺ μᾶλλον ποιεῖν ἃ οὑτοσὶ νῦν ποιεῖ, ἄνδρα ἀδίκως ἐπιχειρεῖν ἀποκτεινύναι. νῦν οὖν, ὦ ἄνδρες Ἀθηναῖοι, πολλοῦ δέω ἐγὼ ὑπὲρ ἐμαυτοῦ ἀπολογεῖσθαι, ὥς τις ἂν οἴοιτο, ἀλλὰ ὑπὲρ ὑμῶν, μή τι ἐξαμάρτητε περὶ τὴν τοῦ θεοῦ δόσιν ὑμῖν ἐμοῦ καταψηφισάμενοι. ἐὰν γάρ με ἀποκτείνητε, οὐ ῥᾳδίως ἄλλον τοιοῦτον εὑρήσετε, ἀτεχνῶς—εἰ καὶ γελοιότερον εἰπεῖν—προσκείμενον τῇ πόλει ὑπὸ τοῦ θεοῦ ὥσπερ ἵππῳ μεγάλῳ μὲν καὶ γενναίῳ, ὑπὸ μεγέθους δὲ νωθεστέρῳ καὶ δεομένῳ ἐγείρεσθαι ὑπὸ μύωπός τινος, οἷον δή μοι δοκεῖ ὁ θεὸς ἐμὲ τῇ πόλει προστεθηκέναι τοιοῦτόν τινα, ὃς ὑμᾶς ἐγείρων καὶ πείθων καὶ ὀνειδίζων ἕνα ἕκαστον οὐδὲν παύομαι τὴν ἡμέραν ὅλην πανταχοῦ προσκαθίζων."

        text: "εἰ οὖν ὑμῶν οἱ δοκοῦντες διαφέρειν εἴτε σοφίᾳ εἴτε ἀνδρείᾳ εἴτε ἄλλῃ ᾑτινιοῦν ἀρετῇ τοιοῦτοι ἔσονται, αἰσχρὸν ἂν εἴη· οἵουσπερ ἐγὼ πολλάκις ἑώρακά τινας ὅταν κρίνωνται, δοκοῦντας μέν τι εἶναι, θαυμάσια δὲ ἐργαζομένους, ὡς δεινόν τι οἰομένους πείσεσθαι εἰ ἀποθανοῦνται, ὥσπερ ἀθανάτων ἐσομένων ἂν ὑμεῖς αὐτοὺς μὴ ἀποκτείνητε· οἳ ἐμοὶ δοκοῦσιν αἰσχύνην τῇ πόλει περιάπτειν, ὥστʼ ἄν τινα καὶ τῶν ξένων ὑπολαβεῖν ὅτι οἱ διαφέροντες Ἀθηναίων εἰς ἀρετήν, οὓς αὐτοὶ ἑαυτῶν ἔν τε ταῖς ἀρχαῖς καὶ ταῖς ἄλλαις τιμαῖς προκρίνουσιν, οὗτοι γυναικῶν οὐδὲν διαφέρουσιν. ταῦτα γάρ, ὦ ἄνδρες Ἀθηναῖοι, οὔτε ὑμᾶς χρὴ ποιεῖν τοὺς δοκοῦντας καὶ ὁπῃοῦν τι εἶναι, οὔτʼ, ἂν ἡμεῖς ποιῶμεν, ὑμᾶς ἐπιτρέπειν, ἀλλὰ τοῦτο αὐτὸ ἐνδείκνυσθαι, ὅτι πολὺ μᾶλλον καταψηφιεῖσθε τοῦ τὰ ἐλεινὰ ταῦτα δράματα εἰσάγοντος καὶ καταγέλαστον τὴν πόλιν ποιοῦντος ἢ τοῦ ἡσυχίαν ἄγοντος.χωρὶς δὲ τῆς δόξης, ὦ ἄνδρες, οὐδὲ δίκαιόν μοι δοκεῖ εἶναι δεῖσθαι τοῦ δικαστοῦ οὐδὲ δεόμενον ἀποφεύγειν, ἀλλὰ διδάσκειν καὶ πείθειν. οὐ γὰρ ἐπὶ τούτῳ κάθηται ὁ δικαστής, ἐπὶ τῷ καταχαρίζεσθαι τὰ δίκαια, ἀλλʼ ἐπὶ τῷ κρίνειν ταῦτα· καὶ ὀμώμοκεν οὐ χαριεῖσθαι οἷς ἂν δοκῇ αὐτῷ, ἀλλὰ δικάσειν κατὰ τοὺς νόμους. οὔκουν χρὴ οὔτε ἡμᾶς ἐθίζειν ὑμᾶς ἐπιορκεῖν οὔθʼ ὑμᾶς ἐθίζεσθαι· οὐδέτεροι γὰρ ἂν ἡμῶν εὐσεβοῖεν. μὴ οὖν ἀξιοῦτέ με, ὦ ἄνδρες Ἀθηναῖοι, τοιαῦτα δεῖν πρὸς ὑμᾶς πράττειν ἃ μήτε ἡγοῦμαι καλὰ εἶναι μήτε δίκαια μήτε ὅσια, ἄλλως τε μέντοι νὴ Δία πάντως καὶ ἀσεβείας φεύγοντα ὑπὸ Μελήτου τουτουΐ. σαφῶς γὰρ ἄν, εἰ πείθοιμι ὑμᾶς καὶ τῷ δεῖσθαι βιαζοίμην ὀμωμοκότας, θεοὺς ἂν διδάσκοιμι μὴ ἡγεῖσθαι ὑμᾶς εἶναι, καὶ ἀτεχνῶς ἀπολογούμενος κατηγοροίην ἂν ἐμαυτοῦ ὡς θεοὺς οὐ νομίζω. ἀλλὰ πολλοῦ δεῖ οὕτως ἔχειν· νομίζω τε γάρ, ὦ ἄνδρες Ἀθηναῖοι, ὡς οὐδεὶς τῶν ἐμῶν κατηγόρων, καὶ ὑμῖν ἐπιτρέπω καὶ τῷ θεῷ κρῖναι περὶ ἐμοῦ ὅπῃ μέλλει ἐμοί τε ἄριστα εἶναι καὶ ὑμῖν."

        text: "εἰ οὖν δεῖ με κατὰ τὸ δίκαιον τῆς ἀξίας τιμᾶσθαι, τούτου τιμῶμαι, ἐν πρυτανείῳ σιτήσεως. ἴσως οὖν ὑμῖν καὶ ταυτὶ λέγων παραπλησίως δοκῶ λέγειν ὥσπερ περὶ τοῦ οἴκτου καὶ τῆς ἀντιβολήσεως, ἀπαυθαδιζόμενος· τὸ δὲ οὐκ ἔστιν, ὦ ἄνδρες Ἀθηναῖοι, τοιοῦτον ἀλλὰ τοιόνδε μᾶλλον. πέπεισμαι ἐγὼ ἑκὼν εἶναι μηδένα ἀδικεῖν ἀνθρώπων, ἀλλὰ ὑμᾶς τοῦτο οὐ πείθω· ὀλίγον γὰρ χρόνον ἀλλήλοις διειλέγμεθα. ἐπεί, ὡς ἐγᾦμαι, εἰ ἦν ὑμῖν νόμος, ὥσπερ καὶ ἄλλοις ἀνθρώποις, περὶ θανάτου μὴ μίαν ἡμέραν μόνον κρίνειν ἀλλὰ πολλάς, ἐπείσθητε ἄν· νῦν δʼ οὐ ῥᾴδιον ἐν χρόνῳ ὀλίγῳ μεγάλας διαβολὰς ἀπολύεσθαι. πεπεισμένος δὴ ἐγὼ μηδένα ἀδικεῖν πολλοῦ δέω ἐμαυτόν γε ἀδικήσειν καὶ κατʼ ἐμαυτοῦ ἐρεῖν αὐτὸς ὡς ἄξιός εἰμί του κακοῦ καὶ τιμήσεσθαι τοιούτου τινὸς ἐμαυτῷ. τί δείσας; ἦ μὴ πάθω τοῦτο οὗ Μέλητός μοι τιμᾶται, ὅ φημι οὐκ εἰδέναι οὔτʼ εἰ ἀγαθὸν οὔτʼ εἰ κακόν ἐστιν; ἀντὶ τούτου δὴ ἕλωμαι ὧν εὖ οἶδά τι κακῶν ὄντων τούτου τιμησάμενος; πότερον δεσμοῦ; καὶ τί με δεῖ ζῆν ἐν δεσμωτηρίῳ, δουλεύοντα τῇ ἀεὶ καθισταμένῃ ἀρχῇ, τοῖς ἕνδεκα; ἀλλὰ χρημάτων καὶ δεδέσθαι ἕως ἂν ἐκτείσω; ἀλλὰ ταὐτόν μοί ἐστιν ὅπερ νυνδὴ ἔλεγον· οὐ γὰρ ἔστι μοι χρήματα ὁπόθεν ἐκτείσω. ἀλλὰ δὴ φυγῆς τιμήσωμαι; ἴσως γὰρ ἄν μοι τούτου τιμήσαιτε. πολλὴ μεντἄν με φιλοψυχία ἔχοι, ὦ ἄνδρες Ἀθηναῖοι, εἰ οὕτως ἀλόγιστός εἰμι ὥστε μὴ δύνασθαι λογίζεσθαι ὅτι ὑμεῖς μὲν ὄντες πολῖταί μου οὐχ οἷοί τε ἐγένεσθε ἐνεγκεῖν τὰς ἐμὰς διατριβὰς καὶ τοὺς λόγους, ἀλλʼ ὑμῖν βαρύτεραι γεγόνασιν καὶ ἐπιφθονώτεραι, ὥστε ζητεῖτε αὐτῶν νυνὶ ἀπαλλαγῆναι· ἄλλοι δὲ ἄρα αὐτὰς οἴσουσι ῥᾳδίως; πολλοῦ γε δεῖ, ὦ ἄνδρες Ἀθηναῖοι. καλὸς οὖν ἄν μοι ὁ βίος εἴη ἐξελθόντι τηλικῷδε ἀνθρώπῳ ἄλλην ἐξ ἄλλης πόλεως ἀμειβομένῳ καὶ ἐξελαυνομένῳ ζῆν. εὖ γὰρ οἶδʼ ὅτι ὅποι ἂν ἔλθω, λέγοντος ἐμοῦ ἀκροάσονται οἱ νέοι ὥσπερ ἐνθάδε· κἂν μὲν τούτους ἀπελαύνω, οὗτοί με αὐτοὶ ἐξελῶσι πείθοντες τοὺς πρεσβυτέρους· ἐὰν δὲ μὴ ἀπελαύνω, οἱ τούτων πατέρες δὲ καὶ οἰκεῖοι διʼ αὐτοὺς τούτους. ἴσως οὖν ἄν τις εἴποι· σιγῶν δὲ καὶ ἡσυχίαν ἄγων, ὦ Σώκρατες, οὐχ οἷός τʼ ἔσῃ ἡμῖν ἐξελθὼν ζῆν; τουτὶ δή ἐστι πάντων χαλεπώτατον πεῖσαί τινας ὑμῶν."

        text: "ἐάντε γὰρ λέγω ὅτι τῷ θεῷ ἀπειθεῖν τοῦτʼ ἐστὶν καὶ διὰ τοῦτʼ ἀδύνατον ἡσυχίαν ἄγειν, οὐ πείσεσθέ μοι ὡς εἰρωνευομένῳ· ἐάντʼ αὖ λέγω ὅτι καὶ τυγχάνει μέγιστον ἀγαθὸν ὂν ἀνθρώπῳ τοῦτο, ἑκάστης ἡμέρας περὶ ἀρετῆς τοὺς λόγους ποιεῖσθαι καὶ τῶν ἄλλων περὶ ὧν ὑμεῖς ἐμοῦ ἀκούετε διαλεγομένου καὶ ἐμαυτὸν καὶ ἄλλους ἐξετάζοντος, ὁ δὲ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ, ταῦτα δʼ ἔτι ἧττον πείσεσθέ μοι λέγοντι. τὰ δὲ ἔχει μὲν οὕτως, ὡς ἐγώ φημι, ὦ ἄνδρες, πείθειν δὲ οὐ ῥᾴδιον. καὶ ἐγὼ ἅμα οὐκ εἴθισμαι ἐμαυτὸν ἀξιοῦν κακοῦ οὐδενός. εἰ μὲν γὰρ ἦν μοι χρήματα, ἐτιμησάμην ἂν χρημάτων ὅσα ἔμελλον ἐκτείσειν, οὐδὲν γὰρ ἂν ἐβλάβην· νῦν δὲ οὐ γὰρ ἔστιν, εἰ μὴ ἄρα ὅσον ἂν ἐγὼ δυναίμην ἐκτεῖσαι, τοσούτου βούλεσθέ μοι τιμῆσαι. ἴσως δʼ ἂν δυναίμην ἐκτεῖσαι ὑμῖν που μνᾶν ἀργυρίου· τοσούτου οὖν τιμῶμαι.Πλάτων δὲ ὅδε, ὦ ἄνδρες Ἀθηναῖοι, καὶ Κρίτων καὶ Κριτόβουλος καὶ Ἀπολλόδωρος κελεύουσί με τριάκοντα μνῶν τιμήσασθαι, αὐτοὶ δʼ ἐγγυᾶσθαι· τιμῶμαι οὖν τοσούτου, ἐγγυηταὶ δὲ ὑμῖν ἔσονται τοῦ ἀργυρίου οὗτοι ἀξιόχρεῳ. οὐ πολλοῦ γʼ ἕνεκα χρόνου, ὦ ἄνδρες Ἀθηναῖοι, ὄνομα ἕξετε καὶ αἰτίαν ὑπὸ τῶν βουλομένων τὴν πόλιν λοιδορεῖν ὡς Σωκράτη ἀπεκτόνατε, ἄνδρα σοφόν—φήσουσι γὰρ δὴ σοφὸν εἶναι, εἰ καὶ μή εἰμι, οἱ βουλόμενοι ὑμῖν ὀνειδίζειν— εἰ γοῦν περιεμείνατε ὀλίγον χρόνον, ἀπὸ τοῦ αὐτομάτου ἂν ὑμῖν τοῦτο ἐγένετο· ὁρᾶτε γὰρ δὴ τὴν ἡλικίαν ὅτι πόρρω ἤδη ἐστὶ τοῦ βίου θανάτου δὲ ἐγγύς. λέγω δὲ τοῦτο οὐ πρὸς πάντας ὑμᾶς, ἀλλὰ πρὸς τοὺς ἐμοῦ καταψηφισαμένους θάνατον. λέγω δὲ καὶ τόδε πρὸς τοὺς αὐτοὺς τούτους. ἴσως με οἴεσθε, ὦ ἄνδρες Ἀθηναῖοι, ἀπορίᾳ λόγων ἑαλωκέναι τοιούτων οἷς ἂν ὑμᾶς ἔπεισα, εἰ ᾤμην δεῖν ἅπαντα ποιεῖν καὶ λέγειν ὥστε ἀποφυγεῖν τὴν δίκην. πολλοῦ γε δεῖ. ἀλλʼ ἀπορίᾳ μὲν ἑάλωκα, οὐ μέντοι λόγων, ἀλλὰ τόλμης καὶ ἀναισχυντίας καὶ τοῦ μὴ ἐθέλειν λέγειν πρὸς ὑμᾶς τοιαῦτα οἷʼ ἂν ὑμῖν μὲν ἥδιστα ἦν ἀκούειν— θρηνοῦντός τέ μου καὶ ὀδυρομένου καὶ ἄλλα ποιοῦντος καὶ λέγοντος πολλὰ καὶ ἀνάξια ἐμοῦ, ὡς ἐγώ φημι, οἷα δὴ καὶ εἴθισθε ὑμεῖς τῶν ἄλλων ἀκούειν. ἀλλʼ οὔτε τότε ᾠήθην δεῖν ἕνεκα το         n: "39",
        label: "§39",
        text: "οὔτε γὰρ ἐν δίκῃ οὔτʼ ἐν πολέμῳ οὔτʼ ἐμὲ οὔτʼ ἄλλον οὐδένα δεῖ τοῦτο μηχανᾶσθαι, ὅπως ἀποφεύξεται πᾶν ποιῶν θάνατον. καὶ γὰρ ἐν ταῖς μάχαις πολλάκις δῆλον γίγνεται ὅτι τό γε ἀποθανεῖν ἄν τις ἐκφύγοι καὶ ὅπλα ἀφεὶς καὶ ἐφʼ ἱκετείαν τραπόμενος τῶν διωκόντων· καὶ ἄλλαι μηχαναὶ πολλαί εἰσιν ἐν ἑκάστοις τοῖς κινδύνοις ὥστε διαφεύγειν θάνατον, ἐάν τις τολμᾷ πᾶν ποιεῖν καὶ λέγειν. ἀλλὰ μὴ οὐ τοῦτʼ ᾖ χαλεπόν, ὦ ἄνδρες, θάνατον ἐκφυγεῖν, ἀλλὰ πολὺ χαλεπώτερον πονηρίαν· θᾶττον γὰρ θανάτου θεῖ. καὶ νῦν ἐγὼ μὲν ἅτε βραδὺς ὢν καὶ πρεσβύτης ὑπὸ τοῦ βραδυτέρου ἑάλων, οἱ δʼ ἐμοὶ κατήγοροι ἅτε δεινοὶ καὶ ὀξεῖς ὄντες ὑπὸ τοῦ θάττονος, τῆς κακίας. καὶ νῦν ἐγὼ μὲν ἄπειμι ὑφʼ ὑμῶν θανάτου δίκην ὀφλών, οὗτοι δʼ ὑπὸ τῆς ἀληθείας ὠφληκότες μοχθηρίαν καὶ ἀδικίαν. καὶ ἐγώ τε τῷ τιμήματι ἐμμένω καὶ οὗτοι. ταῦτα μέν που ἴσως οὕτως καὶ ἔδει σχεῖν, καὶ οἶμαι αὐτὰ μετρίως ἔχειν. τὸ δὲ δὴ μετὰ τοῦτο ἐπιθυμῶ ὑμῖν χρησμῳδῆσαι, ὦ καταψηφισάμενοί μου· καὶ γάρ εἰμι ἤδη ἐνταῦθα ἐν ᾧ μάλιστα ἄνθρωποι χρησμῳδοῦσιν, ὅταν μέλλωσιν ἀποθανεῖσθαι. φημὶ γάρ, ὦ ἄνδρες οἳ ἐμὲ ἀπεκτόνατε, τιμωρίαν ὑμῖν ἥξειν εὐθὺς μετὰ τὸν ἐμὸν θάνατον πολὺ χαλεπωτέραν νὴ Δία ἢ οἵαν ἐμὲ ἀπεκτόνατε· νῦν γὰρ τοῦτο εἴργασθε οἰόμενοι μὲν ἀπαλλάξεσθαι τοῦ διδόναι ἔλεγχον τοῦ βίου, τὸ δὲ ὑμῖν πολὺ ἐναντίον ἀποβήσεται, ὡς ἐγώ φημι. πλείους ἔσονται ὑμᾶς οἱ ἐλέγχοντες, οὓς νῦν ἐγὼ κατεῖχον, ὑμεῖς δὲ οὐκ ᾐσθάνεσθε· καὶ χαλεπώτεροι ἔσονται ὅσῳ νεώτεροί εἰσιν, καὶ ὑμεῖς μᾶλλον ἀγανακτήσετε. εἰ γὰρ οἴεσθε ἀποκτείνοντες ἀνθρώπους ἐπισχήσειν τοῦ ὀνειδίζειν τινὰ ὑμῖν ὅτι οὐκ ὀρθῶς ζῆτε, οὐ καλῶς διανοεῖσθε· οὐ γάρ ἐσθʼ αὕτη ἡ ἀπαλλαγὴ οὔτε πάνυ δυνατὴ οὔτε καλή, ἀλλʼ ἐκείνη καὶ καλλίστη καὶ ῥᾴστη, μὴ τοὺς ἄλλους κολούειν ἀλλʼ ἑαυτὸν παρασκευάζειν ὅπως ἔσται ὡς βέλτιστος. ταῦτα μὲν οὖν ὑμῖν τοῖς καταψηφισαμένοις μαντευσάμενος ἀπαλλάττομαι. τοῖς δὲ ἀποψηφισαμένοις ἡδέως ἂν διαλεχθείην ὑπὲρ τοῦ γεγονότος τουτουῒ πράγματος, ἐν ᾧ οἱ ἄρχοντες ἀσχολίαν ἄγουσι καὶ οὔπω ἔρχομαι οἷ ἐλθόντα με δεῖ τεθνάναι. ἀλλά μοι, ὦ ἄνδρες, παραμείνατε τοσοῦτον χρόνον· οὐδὲν γὰρ κωλύει διαμυθολογῆσαι πρὸς ἀλλήλους ἕως ἔξεστιν."

        label: "v.101–201",
        text: "[Χορός]\n101 ο θαλάσσας πολιαι-\n102 νομένας πνεύματι λάβρῳ\n103 ἐσορᾶν πόντιον ἄλσος,\n104 πίσυνοι λεπτοδόμοις πεί-\n105 σμασι λα-\n106 οπόροις τε μαχαναῖς.\n107 δολόμητιν δʼ ἀπάταν θεοῦ\n108 τίς ἀνὴρ θνατὸς ἀλύξει;\n109 τίς ὁ κραιπνῷ ποδὶ πήδη-\n110 μα τόδʼ εὐπετῶς ἀνᾴσσων;\n111 φιλόφρων γὰρ παρασαίνει\n112 βροτὸν εἰς ἄρκυας Ἄτα,\n113 τόθεν οὐκ ἔστιν ὕπερθέν\n114 νιν ἄνατον ἐξαλύξαι.\n115 ταῦτά μοι μελαγχίτων\n116 φρὴν ἀμύσσεται φόβῳ,\n117 ὀᾶ, Περσικοῦ στρατεύματος\n118 τοῦδε, μὴ πόλις πύθη-\n119 ται κένανδρον μέγʼ ἄστυ Σουσίδος,\n120 καὶ τὸ Κισσίων πόλισμʼ\n121 ἀντίδουπον ᾄσεται,\n122 ὀᾶ, τοῦτʼ ἔπος γυναικοπλη-\n123 θὴς ὅμιλος ἀπύων,\n125 βυσσίνοις δʼ ἐν πέπλοις πέσῃ λακίς.\n126 πᾶς γὰρ ἱππηλάτας\n127 καὶ πεδοστιβὴς λεὼς\n128 σμῆνος ὣς ἐκλέλοιπεν μελισ-\n129 σᾶν σὺν ὀρχάμῳ στρατοῦ,\n130 τὸν ἀμφίζευκτον ἐξαμείψας\n131 ἀμφοτέρας ἅλιον\n132 πρῶνα κοινὸν αἴας.\n133 λέκτρα δʼ ἀνδρῶν πόθῳ\n134 πίμπλαται δακρύμασιν·\n135 Περσίδες δʼ ἁβροπενθεῖς ἑκά-\n136 στα πόθῳ φιλάνορι\n137 τὸν αἰχμάεντα θοῦρον εὐνα-\n138 τῆρʼ ἀποπεμψαμένα\n139 λείπεται μονόζυξ.\n140 ἀλλʼ ἄγε, Πέρσαι, τόδʼ ἐνεζόμενοι\n141 στέγος ἀρχαῖον,\n142 φροντίδα κεδνὴν καὶ βαθύβουλον\n143 θώμεθα, χρεία δὲ προσήκει,\n144 πῶς ἄρα πράσσει Ξέρξης βασιλεὺς\n145 Δαρειογενής,\n146 τὸ πατρωνύμιον γένος ἡμέτερον·\n147 πότερον τόξου ῥῦμα τὸ νικῶν,\n148 ἢ δορικράνου\n149 λόγχης ἰσχὺς κεκράτηκεν.\n150 ἀλλʼ ἥδε θεῶν ἴσον ὀφθαλμοῖς\n151 φάος ὁρμᾶται μήτηρ βασιλέως,\n152 βασίλεια δʼ ἐμή· προσπίτνω·\n153 καὶ προσφθόγγοις δὲ χρεὼν αὐτὴν\n154 πάντας μύθοισι προσαυδᾶν.\n155 ὦ βαθυζώνων ἄνασσα Περσίδων ὑπερτάτη,\n156 μῆτερ ἡ Ξέρξου γεραιά, χαῖρε, Δαρείου γύναι·\n157 θεοῦ μὲν εὐνάτειρα Περσῶν, θεοῦ δὲ καὶ μήτηρ ἔφυς,\n158 εἴ τι μὴ δαίμων παλαιὸς νῦν μεθέστηκε στρατῷ.\n\n[Ἄτοσσα]\n159 ταῦτα δὴ λιποῦσʼ ἱκάνω χρυσεοστόλμους δόμους\n160 καὶ τὸ Δαρείου τε κἀμὸν κοινὸν εὐνατήριον.\n161 κἀμὲ καρδίαν ἀμύσσει φροντίς· ἐς δʼ ὑμᾶς ἐρῶ\n162 μῦθον οὐδαμῶς ἐμαυτῆς οὖσʼ ἀδείμαντος, φίλοι,\n163 μὴ μέγας πλοῦτος κονίσας οὖδας ἀντρέψῃ ποδὶ\n164 ὄλβον, ὃν Δαρεῖος ἦρεν οὐκ ἄνευ θεῶν τινος.\n165 ταῦτά μοι διπλῆ μέριμνα φραστός ἐστιν ἐν φρεσίν,\n166 μήτε χρημάτων ἀνάνδρων πλῆθος ἐν τιμῇ σέβειν\n167 μήτʼ ἀχρημάτοισι λάμπειν φῶς ὅσον σθένος πάρα.\n168 ἔστι γὰρ πλοῦτός γʼ ἀμεμφής, ἀμφὶ δʼ ὀφθαλμῷ φόβος·\n169 ὄμμα γὰρ δόμων νομίζω δεσπότου παρουσίαν.\n170 πρὸς τάδʼ ὡς οὕτως ἐχόντων τῶνδε, σύμβουλοι λόγου\n171 τοῦδέ μοι γένεσθε, Πέρσαι, γηραλέα πιστώματα·\n172 πάντα γὰρ τὰ κέδνʼ ἐν ὑμῖν ἐστί μοι βουλεύματα.\n\n[Χορός]\n173 εὖ τόδʼ ἴσθι, γῆς ἄνασσα τῆσδε, μή σε δὶς φράσαι\n174 μήτʼ ἔπος μήτʼ ἔργον ὧν ἂν δύναμις ἡγεῖσθαι θέλῃ·\n175 εὐμενεῖς γὰρ ὄντας ἡμᾶς τῶνδε συμβούλους καλεῖς.\n\n[Ἄτοσσα]\n176 πολλοῖς μὲν αἰεὶ νυκτέροις ὀνείρασιν\n177 ξύνειμʼ, ἀφʼ οὗπερ παῖς ἐμὸς στείλας στρατὸν\n178 Ἰαόνων γῆν οἴχεται πέρσαι θέλων·\n179 ἀλλʼ οὔτι πω τοιόνδʼ ἐναργὲς εἰδόμην\n180 ὡς τῆς πάροιθεν εὐφρόνης· λέξω δέ σοι.\n181 ἐδοξάτην μοι δύο γυναῖκʼ εὐείμονε,\n182 ἡ μὲν πέπλοισι Περσικοῖς ἠσκημένη,\n183 ἡ δʼ αὖτε Δωρικοῖσιν, εἰς ὄψιν μολεῖν,\n184 μεγέθει τε τῶν νῦν ἐκπρεπεστάτα πολύ,\n185 κάλλει τʼ ἀμώμω, καὶ κασιγνήτα γένους\n186 ταὐτοῦ· πάτραν δʼ ἔναιον ἡ μὲν Ἑλλάδα\n187 κλήρῳ λαχοῦσα γαῖαν, ἡ δὲ βάρβαρον.\n188 τούτω στάσιν τινʼ, ὡς ἐγὼ ʼδόκουν ὁρᾶν,\n189 τεύχειν ἐν ἀλλήλαισι· παῖς δʼ ἐμὸς μαθὼν\n190 κατεῖχε κἀπράυνεν, ἅρμασιν δʼ ὕπο\n191 ζεύγνυσιν αὐτὼ καὶ λέπαδνʼ ἐπʼ αὐχένων\n192 τίθησι. χἠ μὲν τῇδʼ ἐπυργοῦτο στολῇ\n193 ἐν ἡνίαισί τʼ εἶχεν εὔαρκτον στόμα,\n194 ἡ δʼ ἐσφάδαζε, καὶ χεροῖν ἔντη δίφρου\n195 διασπαράσσει καὶ ξυναρπάζει βίᾳ\n196 ἄνευ χαλινῶν καὶ ζυγὸν θραύει μέσον.\n197 πίπτει δʼ ἐμὸς παῖς, καὶ πατὴρ παρίσταται\n198 Δαρεῖος οἰκτείρων σφε· τὸν δʼ ὅπως ὁρᾷ\n199 Ξέρξης, πέπλους ῥήγνυσιν ἀμφὶ σώματι.\n200 καὶ ταῦτα μὲν δὴ νυκτὸς εἰσιδεῖν λέγω.\n201 ἐπεὶ δʼ ἀνέστην καὶ χεροῖν καλλιρρόου"
      },
      {
        n: "202-301",
        label: "v.202–301",
        text: "[Ἄτοσσα]\n202 ἔψαυσα πηγῆς, σὺν θυηπόλῳ χερὶ\n203 βωμὸν προσέστην, ἀποτρόποισι δαίμοσιν\n204 θέλουσα θῦσαι πέλανον, ὧν τέλη τάδε.\n205 ὁρῶ δὲ φεύγοντʼ αἰετὸν πρὸς ἐσχάραν\n206 Φοίβου· φόβῳ δʼ ἄφθογγος ἐστάθην, φίλοι·\n207 μεθύστερον δὲ κίρκον εἰσορῶ δρόμῳ\n208 πτεροῖς ἐφορμαίνοντα καὶ χηλαῖς κάρα\n209 τίλλονθʼ· ὁ δʼ οὐδὲν ἄλλο γʼ ἢ πτήξας δέμας\n210 παρεῖχε. ταῦτʼ ἔμοιγε δείματʼ εἰσιδεῖν,\n211 ὑμῖν δʼ ἀκούειν. εὖ γὰρ ἴστε, παῖς ἐμὸς\n212 πράξας μὲν εὖ θαυμαστὸς ἂν γένοιτʼ ἀνήρ,\n213 κακῶς δὲ πράξας, οὐχ ὑπεύθυνος πόλει,\n214 σωθεὶς δʼ ὁμοίως τῆσδε κοιρανεῖ χθονός.\n\n[Χορός]\n215 οὔ σε βουλόμεσθα, μῆτερ, οὔτʼ ἄγαν φοβεῖν λόγοις\n216 οὔτε θαρσύνειν. θεοὺς δὲ προστροπαῖς ἱκνουμένη,\n217 εἴ τι φλαῦρον εἶδες, αἰτοῦ τῶνδʼ ἀποτροπὴν τελεῖν,\n218 τὰ δʼ ἀγάθʼ ἐκτελῆ γενέσθαι σοί τε καὶ τέκνοις σέθεν\n219 καὶ πόλει φίλοις τε πᾶσι. δεύτερον δὲ χρὴ χοὰς\n220 Γῇ τε καὶ φθιτοῖς χέασθαι· πρευμενῶς δʼ αἰτοῦ τάδε,\n221 σὸν πόσιν Δαρεῖον, ὅνπερ φὴς ἰδεῖν κατʼ εὐφρόνην,\n222 ἐσθλά σοι πέμπειν τέκνῳ τε γῆς ἔνερθεν ἐς φάος,\n223 τἄμπαλιν δὲ τῶνδε γαίᾳ κάτοχα μαυροῦσθαι σκότῳ.\n224 ταῦτα θυμόμαντις ὤν σοι πρευμενῶς παρῄνεσα.\n225 εὖ δὲ πανταχῇ τελεῖν σοι τῶνδε κρίνομεν πέρι.\n\n[Ἄτοσσα]\n226 ἀλλὰ μὴν εὔνους γʼ ὁ πρῶτος τῶνδʼ ἐνυπνίων κριτὴς\n227 παιδὶ καὶ δόμοις ἐμοῖσι τήνδʼ ἐκύρωσας φάτιν.\n228 ἐκτελοῖτο δὴ τὰ χρηστά· ταῦτα δʼ, ὡς ἐφίεσαι,\n229 πάντα θήσομεν θεοῖσι τοῖς τʼ ἔνερθε γῆς φίλοις,\n230 εὖτʼ ἂν εἰς οἴκους μόλωμεν. κεῖνα δʼ ἐκμαθεῖν θέλω,\n231 ὦ φίλοι, ποῦ τὰς Ἀθήνας φασὶν ἱδρῦσθαι χθονός.\n\n[Χορός]\n232 τῆλε πρὸς δυσμαῖς ἄνακτος Ἡλίου φθινασμάτων.\n\n[Ἄτοσσα]\n233 ἀλλὰ μὴν ἵμειρʼ ἐμὸς παῖς τήνδε θηρᾶσαι πόλιν;\n\n[Χορός]\n234 πᾶσα γὰρ γένοιτʼ ἂν Ἑλλὰς βασιλέως ὑπήκοος.\n\n[Ἄτοσσα]\n235 ὧδέ τις πάρεστιν αὐτοῖς ἀνδροπλήθεια στρατοῦ;\n\n[Χορός]\n236 καὶ στρατὸς τοιοῦτος, ἔρξας πολλὰ δὴ Μήδους κακά.\n\n[Ἄτοσσα]\n237 καὶ τί πρὸς τούτοισιν ἄλλο; πλοῦτος ἐξαρκὴς δόμοις;\n\n[Χορός]\n238 ἀργύρου πηγή τις αὐτοῖς ἐστι, θησαυρὸς χθονός.\n\n[Ἄτοσσα]\n239 πότερα γὰρ τοξουλκὸς αἰχμὴ διὰ χεροῖν αὐτοῖς πρέπει;\n\n[Χορός]\n240 οὐδαμῶς· ἔγχη σταδαῖα καὶ φεράσπιδες σαγαί.\n\n[Ἄτοσσα]\n241 τίς δὲ ποιμάνωρ ἔπεστι κἀπιδεσπόζει στρατῷ;\n\n[Χορός]\n242 οὔτινος δοῦλοι κέκληνται φωτὸς οὐδʼ ὑπήκοοι.\n\n[Ἄτοσσα]\n243 πῶς ἂν οὖν μένοιεν ἄνδρας πολεμίους ἐπήλυδας;\n\n[Χορός]\n244 ὥστε Δαρείου πολύν τε καὶ καλὸν φθεῖραι στρατόν.\n\n[Ἄτοσσα]\n245 δεινά τοι λέγεις ἰόντων τοῖς τεκοῦσι φροντίσαι.\n\n[Χορός]\n246 ἀλλʼ ἐμοὶ δοκεῖν τάχʼ εἴσῃ πάντα νημερτῆ λόγον.\n247 τοῦδε γὰρ δράμημα φωτὸς Περσικὸν πρέπει μαθεῖν,\n248 καὶ φέρει σαφές τι πρᾶγος ἐσθλὸν ἢ κακὸν κλύειν.\n\n[Ἄγγελος]\n249 ὦ γῆς ἁπάσης Ἀσιάδος πολίσματα,\n250 ὦ Περσὶς αἶα καὶ πολὺς πλούτου λιμήν,\n251 ὡς ἐν μιᾷ πληγῇ κατέφθαρται πολὺς\n252 ὄλβος, τὸ Περσῶν δʼ ἄνθος οἴχεται πεσόν.\n253 ὤμοι, κακὸν μὲν πρῶτον ἀγγέλλειν κακά·\n254 ὅμως δʼ ἀνάγκη πᾶν ἀναπτύξαι πάθος,\n255 Πέρσαι· στρατὸς γὰρ πᾶς ὄλωλε βαρβάρων.\n\n[Χορός]\n256 ἄνιʼ ἄνια κακὰ\n257 νεόκοτα καὶ δάιʼ·. αἰαῖ,\n258 διαίνεσθε, Πέρσαι,\n259 τόδʼ ἄχος κλύοντες.\n\n[Ἄγγελος]\n260 ὡς πάντα γʼ ἔστʼ ἐκεῖνα διαπεπραγμένα·\n261 αὐτὸς δʼ ἀέλπτως νόστιμον βλέπω φάος.\n\n[Χορός]\n262 ἦ μακροβίοτος\n263 ὅδε γέ τις αἰὼν ἐφάνθη\n264 γεραιοῖς, ἀκούειν\n265 τόδε πῆμʼ ἄελπτον.\n\n[Ἄγγελος]\n266 καὶ μὴν παρών γε κοὐ λόγους ἄλλων κλύων,\n267 Πέρσαι, φράσαιμʼ ἂν οἷʼ ἐπορσύνθη κακά.\n\n[Χορός]\n268 ὀτοτοτοῖ, μάταν\n269 τὰ πολλὰ βέλεα παμμιγῆ\n270 γᾶς ἀπʼ Ἀσίδος ἦλθε δᾴ-\n271 αν ἐφʼ Ἑλλάδα χώραν.\n\n[Ἄγγελος]\n272 πλήθουσι νεκρῶν δυσπότμως ἐφθαρμένων\n273 Σαλαμῖνος ἀκταὶ πᾶς τε πρόσχωρος τόπος.\n\n[Χορός]\n274 ὀτοτοτοῖ, φίλων\n275 ἁλίδονα μέλεα πολυβαφῆ\n276 κατθανόντα λέγεις φέρε-\n277 σθαι πλάγκτʼ ἐν διπλάκεσσιν.\n\n[Ἄγγελος]\n278 οὐδὲν γὰρ ἤρκει τόξα, πᾶς δʼ ἀπώλλυτο\n279 στρατὸς δαμασθεὶς ναΐοισιν ἐμβολαῖς\n\n[Χορός]\n280 ἴυζʼ ἄποτμον Πέρσαις\n281 δυσαιανῆ βοὰν\n282 δᾴοις, ὡς πάντα παγκάκως\n283 ἔφθισαν· αἰαῖ στρατοῦ φθαρέντος.\n\n[Ἄγγελος]\n284 ὦ πλεῖστον ἔχθος ὄνομα Σαλαμῖνος κλύειν.\n285 φεῦ, τῶν Ἀθηνῶν ὡς στένω μεμνημένος.\n\n[Χορός]\n286 στυγναί γʼ Ἀθᾶναι δᾴοις·\n287 μεμνῆσθαί τοι πάρα\n288 ὡς πολλὰς Περσίδων μάταν\n289 ἔκτισαν εὔνιδας ἠδʼ ἀνάνδρους.\n\n[Ἄτοσσα]\n290 σιγῶ πάλαι δύστηνος ἐκπεπληγμένη\n291 κακοῖς· ὑπερβάλλει γὰρ ἥδε συμφορὰ\n292 τὸ μήτε λέξαι μήτʼ ἐρωτῆσαι πάθη.\n293 ὅμως δʼ ἀνάγκη πημονὰς βροτοῖς φέρειν\n294 θεῶν διδόντων· πᾶν δʼ ἀναπτύξας πάθος\n295 λέξον καταστάς, κεἰ στένεις κακοῖς ὅμως.\n296 τίς οὐ τέθνηκε, τίνα δὲ καὶ πενθήσομεν\n297 τῶν ἀρχελείων, ὅστʼ ἐπὶ σκηπτουχίᾳ\n298 ταχθεὶς ἄνανδρον τάξιν ἠρήμου θανών;\n\n[Ἄγγελος]\n299 Ξέρξης μὲν αὐτὸς ζῇ τε καὶ βλέπει φάος.\n\n[Ἄτοσσα]\n300 ἐμοῖς μὲν εἶπας δώμασιν φάος μέγα\n301 καὶ λευκὸν ἦμαρ νυκτὸς ἐκ μελαγχίμου."
      },

        n: "302-401",
        label: "v.302–401",
        text: "[Ἄγγελος]\n302 Ἀρτεμβάρης δὲ μυρίας ἵππου βραβεὺς\n303 στύφλους παρʼ ἀκτὰς θείνεται Σιληνιῶν.\n304 χὠ χιλίαρχος Δαδάκης πληγῇ δορὸς\n305 πήδημα κοῦφον ἐκ νεὼς ἀφήλατο·\n306 Τενάγων τʼ ἀριστεὺς Βακτρίων ἰθαιγενὴς\n307 θαλασσόπληκτον νῆσον Αἴαντος πολεῖ.\n308 Λίλαιος, Ἀρσάμης τε κἈργήστης τρίτος,\n309 οἵδʼ ἀμφὶ νῆσον τὴν πελειοθρέμμονα\n310 δινούμενοι ʼκύρισσον ἰσχυρὰν χθόνα·\n311 πηγαῖς τε Νείλου γειτονῶν Αἰγυπτίου\n312 Ἀρκτεύς, Ἀδεύης, καὶ φερεσσάκης τρίτος\n313 Φαρνοῦχος, οἵδε ναὸς ἐκ μιᾶς πέσον.\n314 Χρυσεὺς Μάταλλος μυριόνταρχος θανών,\n315 ἵππου μελαίνης ἡγεμὼν τρισμυρίας,\n316 πυρρὰν ζαπληθῆ δάσκιον γενειάδα\n317 ἔτεγγʼ, ἀμείβων χρῶτα πορφυρέᾳ βαφῇ.\n318 καὶ Μᾶγος Ἄραβος, Ἀρτάβης τε Βάκτριος,\n319 σκληρᾶς μέτοικος γῆς, ἐκεῖ κατέφθιτο.\n320 Ἄμιστρις Ἀμφιστρεύς τε πολύπονον δόρυ\n321 νωμῶν, ὅ τʼ ἐσθλὸς Ἀριόμαρδος Σάρδεσι\n322 πένθος παρασχών, Σεισάμης θʼ ὁ Μύσιος,\n323 Θάρυβίς τε πεντήκοντα πεντάκις νεῶν\n324 ταγός, γένος Λυρναῖος, εὐειδὴς ἀνήρ,\n325 κεῖται θανὼν δείλαιος οὐ μάλʼ εὐτυχῶς·\n326 Συέννεσίς τε πρῶτος εἰς εὐψυχίαν,\n327 Κιλίκων ἄπαρχος, εἷς ἀνὴρ πλεῖστον πόνον\n328 ἐχθροῖς παρασχών εὐκλεῶς ἀπώλετο.\n329 τοσόνδε ταγῶν νῦν ὑπεμνήσθην πέρι.\n330 πολλῶν παρόντων δʼ ὀλίγʼ ἀπαγγέλλω κακά.\n\n[Ἄτοσσα]\n331 αἰαῖ, κακῶν ὕψιστα δὴ κλύω τάδε,\n332 αἴσχη τε Πέρσαις καὶ λιγέα κωκύματα.\n333 ἀτὰρ φράσον μοι τοῦτʼ ἀναστρέψας πάλιν·\n334 πόσον δὲ πλῆθος ἦν νεῶν Ἑλληνίδων,\n335 ὥστʼ ἀξιῶσαι Περσικῷ στρατεύματι\n336 μάχην συνάψαι ναΐοισιν ἐμβολαῖς;\n\n[Ἄγγελος]\n337 πλήθους μὲν ἂν σάφʼ ἴσθʼ ἕκατι βάρβαρον\n338 ναυσὶν κρατῆσαι. καὶ γὰρ Ἕλλησιν μὲν ἦν\n339 ὁ πᾶς ἀριθμὸς ἐς τριακάδας δέκα\n340 ναῶν, δεκὰς δʼ ἦν τῶνδε χωρὶς ἔκκριτος·\n341 Ξέρξῃ δέ, καὶ γὰρ οἶδα, χιλιὰς μὲν ἦν\n342 ὧν ἦγε πλῆθος, αἱ δʼ ὑπέρκοποι τάχει\n343 ἑκατὸν δὶς ἦσαν ἑπτά θʼ· ὧδʼ ἔχει λόγος.\n344 μή σοι δοκοῦμεν τῇδε λειφθῆναι μάχῃ;\n345 ἀλλʼ ὧδε δαίμων τις κατέφθειρε στρατόν,\n346 τάλαντα βρίσας οὐκ ἰσορρόπῳ τύχῃ.\n347 θεοὶ πόλιν σῴζουσι Παλλάδος θεᾶς.\n\n[Ἄτοσσα]\n348 ἔτʼ ἆρʼ Ἀθηνῶν ἔστʼ ἀπόρθητος πόλις;\n\n[Ἄγγελος]\n349 ἀνδρῶν γὰρ ὄντων ἕρκος ἐστὶν ἀσφαλές.\n\n[Ἄτοσσα]\n350 ἀρχὴ δὲ ναυσὶ συμβολῆς τίς ἦν, φράσον·\n351 τίνες κατῆρξαν, πότερον Ἕλληνες, μάχης,\n352 ἢ παῖς ἐμός, πλήθει καταυχήσας νεῶν;\n\n[Ἄγγελος]\n353 ἦρξεν μέν, ὦ δέσποινα, τοῦ παντὸς κακοῦ\n354 φανεὶς ἀλάστωρ ἢ κακὸς δαίμων ποθέν.\n355 ἀνὴρ γὰρ Ἕλλην ἐξ Ἀθηναίων στρατοῦ\n356 ἐλθὼν ἔλεξε παιδὶ σῷ Ξέρξῃ τάδε,\n357 ὡς εἰ μελαίνης νυκτὸς ἵξεται κνέφας,\n358 Ἕλληνες οὐ μενοῖεν, ἀλλὰ σέλμασιν\n359 ναῶν ἐπανθορόντες ἄλλος ἄλλοσε\n360 δρασμῷ κρυφαίῳ βίοτον ἐκσωσοίατο.\n361 ὁ δʼ εὐθὺς ὡς ἤκουσεν, οὐ ξυνεὶς δόλον\n362 Ἕλληνος ἀνδρὸς οὐδὲ τὸν θεῶν φθόνον,\n363 πᾶσιν προφωνεῖ τόνδε ναυάρχοις λόγον,\n364 εὖτʼ ἂν φλέγων ἀκτῖσιν ἥλιος χθόνα\n365 λήξῃ, κνέφας δὲ τέμενος αἰθέρος λάβῃ,\n366 τάξαι νεῶν στῖφος μὲν ἐν στοίχοις τρισὶν\n367 ἔκπλους φυλάσσειν καὶ πόρους ἁλιρρόθους,\n368 ἄλλας δὲ κύκλῳ νῆσον Αἴαντος πέριξ·\n369 ὡς εἰ μόρον φευξοίαθʼ Ἕλληνες κακόν,\n370 ναυσὶν κρυφαίως δρασμὸν εὑρόντες τινά,\n371 πᾶσιν στέρεσθαι κρατὸς ἦν προκείμενον.\n372 τοσαῦτʼ ἔλεξε κάρθʼ ὑπʼ εὐθύμου φρενός·\n373 οὐ γὰρ τὸ μέλλον ἐκ θεῶν ἠπίστατο.\n374 οἱ δʼ οὐκ ἀκόσμως, ἀλλὰ πειθάρχῳ φρενὶ\n375 δεῖπνόν τʼ ἐπορσύνοντο, ναυβάτης τʼ ἀνὴρ\n376 τροποῦτο κώπην σκαλμὸν ἀμφʼ εὐήρετμον.\n377 ἐπεὶ δὲ φέγγος ἡλίου κατέφθιτο\n378 καὶ νὺξ ἐπῄει, πᾶς ἀνὴρ κώπης ἄναξ\n379 ἐς ναῦν ἐχώρει πᾶς θʼ ὅπλων ἐπιστάτης·\n380 τάξις δὲ τάξιν παρεκάλει νεὼς μακρᾶς·\n381 πλέουσι δʼ ὡς ἕκαστος ἦν τεταγμένος,\n382 καὶ πάννυχοι δὴ διάπλοον καθίστασαν\n383 ναῶν ἄνακτες πάντα ναυτικὸν λεών.\n384 καὶ νὺξ ἐχώρει, κοὐ μάλʼ Ἑλλήνων στρατὸς\n385 κρυφαῖον ἔκπλουν οὐδαμῇ καθίστατο·\n386 ἐπεί γε μέντοι λευκόπωλος ἡμέρα\n387 πᾶσαν κατέσχε γαῖαν εὐφεγγὴς ἰδεῖν,\n388 πρῶτον μὲν ἠχῇ κέλαδος Ἑλλήνων πάρα\n389 μολπηδὸν ηὐφήμησεν, ὄρθιον δʼ ἅμα\n390 ἀντηλάλαξε νησιώτιδος πέτρας\n391 ἠχώ· φόβος δὲ πᾶσι βαρβάροις παρῆν\n392 γνώμης ἀποσφαλεῖσιν· οὐ γὰρ ὡς φυγῇ\n393 παιᾶνʼ ἐφύμνουν σεμνὸν Ἕλληνες τότε,\n394 ἀλλʼ ἐς μάχην ὁρμῶντες εὐψύχῳ θράσει·\n395 σάλπιγξ δʼ ἀϋτῇ πάντʼ ἐκεῖνʼ ἐπέφλεγεν.\n396 εὐθὺς δὲ κώπης ῥοθιάδος ξυνεμβολῇ\n397 ἔπαισαν ἅλμην βρύχιον ἐκ κελεύματος,\n398 θοῶς δὲ πάντες ἦσαν ἐκφανεῖς ἰδεῖν.\n399 τὸ δεξιὸν μὲν πρῶτον εὐτάκτως κέρας\n400 ἡγεῖτο κόσμῳ, δεύτερον δʼ ὁ πᾶς στόλος\n401 ἐπεξεχώρει, καὶ παρῆν ὁμοῦ κλύειν"

        text: "[Ἄγγελος]\n402 πολλὴν βοήν, ὦ παῖδες Ἑλλήνων ἴτε,\n403 ἐλευθεροῦτε πατρίδʼ, ἐλευθεροῦτε δὲ\n404 παῖδας, γυναῖκας, θεῶν τέ πατρῴων ἕδη,\n405 θήκας τε προγόνων· νῦν ὑπὲρ πάντων ἀγών.\n406 καὶ μὴν παρʼ ἡμῶν Περσίδος γλώσσης ῥόθος\n407 ὑπηντίαζε, κοὐκέτʼ ἦν μέλλειν ἀκμή.\n408 εὐθὺς δὲ ναῦς ἐν νηὶ χαλκήρη στόλον\n409 ἔπαισεν· ἦρξε δʼ ἐμβολῆς Ἑλληνικὴ\n410 ναῦς, κἀποθραύει πάντα Φοινίσσης νεὼς\n411 κόρυμβʼ, ἐπʼ ἄλλην δʼ ἄλλος ηὔθυνεν δόρυ.\n412 τὰ πρῶτα μέν νυν ῥεῦμα Περσικοῦ στρατοῦ\n413 ἀντεῖχεν· ὡς δὲ πλῆθος ἐν στενῷ νεῶν\n414 ἤθροιστʼ ἀρωγὴ δʼ οὔτις ἀλλήλοις παρῆν,\n415 αὐτοὶ δʼ ὑφʼ αὑτῶν ἐμβόλοις χαλκοστόμοις\n416 παίοντʼ, ἔθραυον πάντα κωπήρη στόλον,\n417 Ἑλληνικαί τε νῆες οὐκ ἀφρασμόνως\n418 κύκλῳ πέριξ ἔθεινον, ὑπτιοῦτο δὲ\n419 σκάφη νεῶν, θάλασσα δʼ οὐκέτʼ ἦν ἰδεῖν,\n420 ναυαγίων πλήθουσα καὶ φόνου βροτῶν.\n421 ἀκταὶ δὲ νεκρῶν χοιράδες τʼ ἐπλήθυον,\n422 φυγῇ δʼ ἀκόσμῳ πᾶσα ναῦς ἠρέσσετο,\n423 ὅσαιπερ ἦσαν βαρβάρου στρατεύματος.\n424 τοὶ δʼ ὥστε θύννους ἤ τινʼ ἰχθύων βόλον\n425 ἀγαῖσι κωπῶν θραύμασίν τʼ ἐρειπίων\n426 ἔπαιον, ἐρράχιζον· οἰμωγὴ δʼ ὁμοῦ\n427 κωκύμασιν κατεῖχε πελαγίαν ἅλα,\n428 ἕως κελαινῆς νυκτὸς ὄμμʼ ἀφείλετο.\n429 κακῶν δὲ πλῆθος, οὐδʼ ἂν εἰ δέκʼ ἤματα\n430 στοιχηγοροίην, οὐκ ἂν ἐκπλήσαιμί σοι.\n431 εὖ γὰρ τόδʼ ἴσθι, μηδάμʼ ἡμέρᾳ μιᾷ\n432 πλῆθος τοσουτάριθμον ἀνθρώπων θανεῖν.\n\n[Ἄτοσσα]\n433 αἰαῖ, κακῶν δὴ πέλαγος ἔρρωγεν μέγα\n434 Πέρσαις τε καὶ πρόπαντι βαρβάρων γένει.\n\n[Ἄγγελος]\n435 εὖ νυν τόδʼ ἴσθι, μηδέπω μεσοῦν κακόν·\n436 τοιάδʼ ἐπʼ αὐτοῖς ἦλθε συμφορὰ πάθους\n437 ὡς τοῖσδε καὶ δὶς ἀντισηκῶσαι ῥοπῇ.\n\n[Ἄτοσσα]\n438 καὶ τίς γένοιτʼ ἂν τῆσδʼ ἔτʼ ἐχθίων τύχη;\n439 λέξον τίνʼ αὖ φὴς τήνδε συμφορὰν στρατῷ\n440 ἐλθεῖν κακῶν ῥέπουσαν ἐς τὰ μάσσονα.\n\n[Ἄγγελος]\n441 Περσῶν ὅσοιπερ ἦσαν ἀκμαῖοι φύσιν,\n442 ψυχήν τʼ ἄριστοι κεὐγένειαν ἐκπρεπεῖς,\n443 αὐτῷ τʼ ἄνακτι πίστιν ἐν πρώτοις ἀεί,\n444 τεθνᾶσιν αἰσχρῶς δυσκλεεστάτῳ μόρῳ.\n\n[Ἄτοσσα]\n445 οἲ ʼγὼ τάλαινα συμφορᾶς κακῆς, φίλοι.\n446 ποίῳ μόρῳ δὲ τούσδε φὴς ὀλωλέναι;\n\n[Ἄγγελος]\n447 νῆσός τις ἔστι πρόσθε Σαλαμῖνος τόπων,\n448 βαιά, δύσορμος ναυσίν, ἣν ὁ φιλόχορος\n449 Πὰν ἐμβατεύει, ποντίας ἀκτῆς ἔπι.\n450 ἐνταῦθα πέμπει τούσδʼ, ὅπως, ὅταν νεῶν\n451 φθαρέντες ἐχθροὶ νῆσον ἐκσῳζοίατο,\n452 κτείνοιεν εὐχείρωτον Ἑλλήνων στρατόν,\n453 φίλους δʼ ὑπεκσῴζοιεν ἐναλίων πόρων,\n454 κακῶς τὸ μέλλον ἱστορῶν. ὡς γὰρ θεὸς\n455 ναῶν ἔδωκε κῦδος Ἕλλησιν μάχης,\n456 αὐθημερὸν φράξαντες εὐχάλκοις δέμας\n457 ὅπλοισι ναῶν ἐξέθρῳσκον· ἀμφὶ δὲ\n458 κυκλοῦντο πᾶσαν νῆσον, ὥστʼ ἀμηχανεῖν\n459 ὅποι τράποιντο. πολλὰ μὲν γὰρ ἐκ χερῶν\n460 πέτροισιν ἠράσσοντο, τοξικῆς τʼ ἄπο\n461 θώμιγγος ἰοὶ προσπίτνοντές ὤλλυσαν·\n462 τέλος δʼ ἐφορμηθέντες ἐξ ἑνὸς ῥόθου\n463 παίουσι, κρεοκοποῦσι δυστήνων μέλη,\n464 ἕως ἁπάντων ἐξαπέφθειραν βίον.\n465 Ξέρξης δʼ ἀνῴμωξεν κακῶν ὁρῶν βάθος·\n466 ἕδραν γὰρ εἶχε παντὸς εὐαγῆ στρατοῦ,\n467 ὑψηλὸν ὄχθον ἄγχι πελαγίας ἁλός·\n468 ῥήξας δὲ πέπλους κἀνακωκύσας λιγύ,\n469 πεζῷ παραγγείλας ἄφαρ στρατεύματι,\n470 ἵησʼ ἀκόσμῳ ξὺν φυγῇ. τοιάνδε σοι\n471 πρὸς τῇ πάροιθε συμφορὰν πάρα στένειν.\n\n[Ἄτοσσα]\n472 ὦ στυγνὲ δαῖμον, ὡς ἄρʼ ἔψευσας φρενῶν\n473 Πέρσας· πικρὰν δὲ παῖς ἐμὸς τιμωρίαν\n474 κλεινῶν Ἀθηνῶν ηὗρε, κοὐκ ἀπήρκεσαν\n475 οὓς πρόσθε Μαραθὼν βαρβάρων ἀπώλεσεν·\n476 ὧν ἀντίποινα παῖς ἐμὸς πράξειν δοκῶν\n477 τοσόνδε πλῆθος πημάτων ἐπέσπασεν.\n478 σὺ δʼ εἰπέ, ναῶν αἳ πεφεύγασιν μόρον,\n479 ποῦ τάσδʼ ἔλειπες· οἶσθα σημῆναι τορῶς;\n\n[Ἄγγελος]\n480 ναῶν γε ταγοὶ τῶν λελειμμένων σύδην\n481 κατʼ οὖρον οὐκ εὔκοσμον αἴρονται φυγήν·\n482 στρατὸς δʼ ὁ λοιπὸς ἔν τε Βοιωτῶν χθονὶ\n483 διώλλυθʼ, οἱ μὲν ἀμφὶ κρηναῖον γάνος\n484 δίψῃ πονοῦντες, οἱ δʼ ὑπʼ ἄσθματος κενοὶ\n485 διεκπερῶμεν ἔς τε Φωκέων χθόνα\n486 καὶ Δωρίδʼ αἶαν, Μηλιᾶ τε κόλπον, οὗ\n487 Σπερχειὸς ἄρδει πεδίον εὐμενεῖ ποτῷ·\n488 κἀντεῦθεν ἡμᾶς γῆς Ἀχαιίδος πέδον\n489 καὶ Θεσσαλῶν πόλεις ὑπεσπανισμένους\n490 βορᾶς ἐδέξαντʼ· ἔνθα δὴ πλεῖστοι ʼθάνον\n491 δίψῃ τε λιμῷ τʼ· ἀμφότερα γὰρ ἦν τάδε.\n492 Μαγνητικὴν δὲ γαῖαν ἔς τε Μακεδόνων\n493 χώραν ἀφικόμεσθʼ, ἐπʼ Ἀξίου πόρον,\n494 Βόλβης θʼ ἕλειον δόνακα, Πάγγαιόν τʼ ὄρος,\n495 Ἠδωνίδʼ αἶαν· νυκτὶ δʼ ἐν ταύτῃ θεὸς\n496 χειμῶνʼ ἄωρον ὦρσε, πήγνυσιν δὲ πᾶν\n497 ῥέεθρον ἁγνοῦ Στρυμόνος. θεοὺς δέ τις\n498 τὸ πρὶν νομίζων οὐδαμοῦ τότʼ ηὔχετο\n499 λιταῖσι, γαῖαν οὐρανόν τε προσκυνῶν.\n500 ἐπεὶ δὲ πολλὰ θεοκλυτῶν ἐπαύσατο\n501 στρατός, περᾷ κρυσταλλοπῆγα διὰ πόρον·"

        text: "[Ἄγγελος]\n502 χὤστις μὲν ἡμῶν πρὶν σκεδασθῆναι θεοῦ\n503 ἀκτῖνας ὡρμήθη, σεσωσμένος κυρεῖ.\n504 φλέγων γὰρ αὐγαῖς λαμπρὸς ἡλίου κύκλος\n505 μέσον πόρον διῆκε, θερμαίνων φλογί.\n506 πῖπτον δʼ ἐπʼ ἀλλήλοισιν· ηὐτύχει δέ τοι\n507 ὅστις τάχιστα πνεῦμʼ ἀπέρρηξεν βίου.\n508 ὅσοι δὲ λοιποὶ κἄτυχον σωτηρίας,\n509 Θρῄκην περάσαντες μόγις πολλῷ πόνῳ,\n510 ἥκουσιν ἐκφυγόντες, οὐ πολλοί τινες,\n511 ἐφʼ ἑστιοῦχον γαῖαν· ὡς στένειν πόλιν\n512 Περσῶν, ποθοῦσαν φιλτάτην ἥβην χθονός.\n513 ταῦτʼ ἔστʼ ἀληθῆ· πολλὰ δʼ ἐκλείπω λέγων\n514 κακῶν ἃ Πέρσαις ἐγκατέσκηψεν θεός.\n\n[Χορός]\n515 ὦ δυσπόνητε δαῖμον, ὡς ἄγαν βαρὺς\n516 ποδοῖν ἐνήλου παντὶ Περσικῷ γένει.\n\n[Ἄτοσσα]\n517 οἲ ʼγὼ τάλαινα διαπεπραγμένου στρατοῦ·\n518 ὦ νυκτὸς ὄψις ἐμφανὴς ἐνυπνίων,\n519 ὡς κάρτα μοι σαφῶς ἐδήλωσας κακά.\n520 ὑμεῖς δὲ φαύλως αὔτʼ ἄγαν ἐκρίνατε.\n521 ὅμως δʼ, ἐπειδὴ τῇδʼ ἐκύρωσεν φάτις\n522 ὑμῶν, θεοῖς μὲν πρῶτον εὔξασθαι θέλω·\n523 ἔπειτα Γῇ τε καὶ φθιτοῖς δωρήματα\n524 ἥξω λαβοῦσα πέλανον ἐξ οἴκων ἐμῶν,—\n525 ἐπίσταμαι μὲν ὡς ἐπʼ ἐξειργασμένοις,\n526 ἀλλʼ ἐς τὸ λοιπὸν εἴ τι δὴ λῷον πέλοι.\n527 ὑμᾶς δὲ χρὴ ʼπὶ τοῖσδε τοῖς πεπραγμένοις\n528 πιστοῖσι πιστὰ ξυμφέρειν βουλεύματα·\n529 καὶ παῖδʼ, ἐάν περ δεῦρʼ ἐμοῦ πρόσθεν μόλῃ,\n530 παρηγορεῖτε, καὶ προπέμπετʼ ἐς δόμους,\n531 μὴ καί τι πρὸς κακοῖσι προσθῆται κακόν.\n\n[Χορός]\n532 ὦ Ζεῦ βασιλεῦ, νῦν γὰρ Περσῶν\n533 τῶν μεγαλαύχων καὶ πολυάνδρων\n534 στρατιὰν ὀλέσας\n535 ἄστυ τὸ Σούσων ἠδʼ Ἀγβατάνων\n536 πένθει δνοφερῷ κατέκρυψας·\n537 πολλαὶ δʼ ἀταλαῖς χερσὶ καλύπτρας\n538 κατερεικόμεναι\n539 διαμυδαλέοις δάκρυσι κόλπους\n540 τέγγουσʼ, ἄλγους μετέχουσαι.\n541 αἱ δʼ ἁβρόγοοι Περσίδες ἀνδρῶν\n542 ποθέουσαι ἰδεῖν ἀρτιζυγίαν,\n543 λέκτρων εὐνὰς ἁβροχίτωνας,\n544 χλιδανῆς ἥβης τέρψιν, ἀφεῖσαι,\n545 πενθοῦσι γόοις ἀκορεστοτάτοις.\n546 κἀγὼ δὲ μόρον τῶν οἰχομένων\n547 αἴρω δοκίμως πολυπενθῆ.\n548 νῦν γὰρ δὴ πρόπασα μὲν στένει γαῖʼ\n549 Ἀσιὰς ἐκκενουμένα.\n550 Ξέρξης μὲν ἄγαγεν, ποποῖ,\n551 Ξέρξης δʼ ἀπώλεσεν, τοτοῖ,\n552 Ξέρξης δὲ πάντʼ ἐπέσπε δυσφρόνως\n553 βαρίδεσσι ποντίαις.\n554 τίπτε Δαρεῖος μὲν οὕ-\n555 τω τότʼ ἀβλαβὴς ἐπῆν\n556 τόξαρχος πολιήταις,\n557 Σουσίδαις φίλος ἄκτωρ;\n558 πεζούς τε γὰρ καὶ θαλασσίους\n559 λινόπτεροι κυανώπιδες\n560 νᾶες μὲν ἄγαγον, ποποῖ,\n561 νᾶες δʼ ἀπώλεσαν, τοτοῖ,\n562 νᾶες πανωλέθροισιν ἐμβολαῖς,\n563 αἵ τʼ Ἰαόνων χέρες.\n564 τυτθὰ δʼ ἐκφυγεῖν ἄνακτʼ\n565 αὐτὸν εἰσακούομεν\n566 Θρῄκης ἂμ πεδιήρεις\n567 δυσχίμους τε κελεύθους.\n568 τοὶ δʼ ἄρα πρωτόμοιροι, φεῦ,\n569 λειφθέντες πρὸς ἀνάγκας, ἠέ,\n570 ἀκτὰς ἀμφὶ Κυχρείας, ὀᾶ,\n571 σύρονται· στένε καὶ δακνά-\n572 ζου, βαρὺ δʼ ἀμβόασον\n573 οὐράνιʼ ἄχη, ὀᾶ·\n574 τεῖνε δὲ δυσβάυκτον\n575 βοᾶτιν τάλαιναν αὐδάν.\n576 γναπτόμενοι δὲ δίνᾳ, φεῦ,\n577 σκύλλονται πρὸς ἀναύδων, ἠέ,\n578 παίδων τᾶς ἀμιάντου, ὀᾶ.\n579 πενθεῖ δʼ ἄνδρα δόμος στερη-\n580 θείς τοκέες τʼ ἄπαιδες\n581 δαιμόνιʼ ἄχη, ὀᾶ,\n582 δυρόμενοι γέροντες\n583 τὸ πᾶν δὴ κλύουσιν ἄλγος.\n584 τοὶ δʼ ἀνὰ γᾶν Ἀσίαν δὴν\n585 οὐκέτι περσονομοῦνται,\n586 οὐδʼ ἔτι δασμοφοροῦσιν\n587 δεσποσύνοισιν ἀνάγκαις,\n588 οὐδʼ ἐς γᾶν προπίτνοντες\n589 ἅζονται· βασιλεία\n590 γὰρ διόλωλεν ἰσχύς.\n591 οὐδʼ ἔτι γλῶσσα βροτοῖσιν\n592 ἐν φυλακαῖς· λέλυται γὰρ\n593 λαὸς ἐλεύθερα βάζειν,\n594 ὡς ἐλύθη ζυγὸν ἀλκᾶς.\n595 αἱμαχθεῖσα δʼ ἄρουραν\n596 Αἴαντος περικλύστα\n597 νᾶσος ἔχει τὰ Περσᾶν.\n\n[Ἄτοσσα]\n598 φίλοι, κακῶν μὲν ὅστις ἔμπειρος κυρεῖ,\n599 ἐπίσταται βροτοῖσιν ὡς ὅταν κλύδων\n600 κακῶν ἐπέλθῃ πάντα δειμαίνειν φιλεῖ·\n601 ὅταν δʼ ὁ δαίμων εὐροῇ, πεποιθέναι"

        n: "602-704",
        label: "v.602–704",
        text: "[Ἄτοσσα]\n602 τὸν αὐτὸν αἰεὶ δαίμονʼ οὐριεῖν τύχην.\n603 ἐμοὶ γὰρ ἤδη πάντα μὲν φόβου πλέα\n604 ἐν ὄμμασιν τἀνταῖα φαίνεται θεῶν,\n605 βοᾷ δʼ ἐν ὠσὶ κέλαδος οὐ παιώνιος·\n606 τοία κακῶν ἔκπληξις ἐκφοβεῖ φρένας.\n607 τοιγὰρ κέλευθον τήνδʼ ἄνευ τʼ ὀχημάτων\n608 χλιδῆς τε τῆς πάροιθεν ἐκ δόμων πάλιν\n609 ἔστειλα, παιδὸς πατρὶ πρευμενεῖς χοὰς\n610 φέρουσʼ, ἅπερ νεκροῖσι μειλικτήρια,\n611 βοός τʼ ἀφʼ ἁγνῆς λευκὸν εὔποτον γάλα,\n612 τῆς τʼ ἀνθεμουργοῦ στάγμα, παμφαὲς μέλι,\n613 λιβάσιν ὑδρηλαῖς παρθένου πηγῆς μέτα,\n614 ἀκήρατόν τε μητρὸς ἀγρίας ἄπο\n615 ποτὸν παλαιᾶς ἀμπέλου γάνος τόδε·\n616 τῆς τʼ αἰὲν ἐν φύλλοισι θαλλούσης βίον\n617 ξανθῆς ἐλαίας καρπὸς εὐώδης πάρα,\n618 ἄνθη τε πλεκτά, παμφόρου γαίας τέκνα,\n619 ἀλλʼ, ὦ φίλοι, χοαῖσι ταῖσδε νερτέρων\n620 ὕμνους ἐπευφημεῖτε, τόν τε δαίμονα\n621 Δαρεῖον ἀνακαλεῖσθε, γαπότους δʼ ἐγὼ\n622 τιμὰς προπέμψω τάσδε νερτέροις θεοῖς.\n\n[Χορός]\n623 βασίλεια γύναι, πρέσβος Πέρσαις,\n624 σύ τε πέμπε χοὰς θαλάμους ὑπὸ γῆς,\n625 ἡμεῖς θʼ ὕμνοις αἰτησόμεθα\n626 φθιμένων πομποὺς\n627 εὔφρονας εἶναι κατὰ γαίας.\n628 ἀλλά, χθόνιοι δαίμονες ἁγνοί,\n629 Γῆ τε καὶ Ἑρμῆ, βασιλεῦ τʼ ἐνέρων,\n630 πέμψατʼ ἔνερθεν ψυχὴν ἐς φῶς·\n631 εἰ γάρ τι κακῶν ἄκος οἶδε πλέον,\n632 μόνος ἂν θνητῶν πέρας εἴποι.\n633 ἦ ῥʼ ἀίει μου μακαρίτας\n634 ἰσοδαίμων βασιλεὺς\n635 βάρβαρʼ ἀσαφηνῆ\n636 ἱέντος τὰ παναίολʼ αἰ-\n637 ανῆ δύσθροα βάγματʼ, ἢ\n638 παντάλανʼ ἄχη διαβοάσω;\n639 νέρθεν ἆρα κλύει μου;\n640 ἀλλὰ σύ μοι Γᾶ τε καὶ ἄλλοι\n641 χθονίων ἁγεμόνες\n642 δαίμονα μεγαυχῆ\n643 ἰόντʼ αἰνέσατʼ ἐκ δόμων,\n644 Περσᾶν Σουσιγενῆ θεόν·\n645 πέμπετε δʼ ἄνω οἷον οὔπω\n646 Περσὶς αἶʼ ἐκάλυψεν.\n647 ἦ φίλος ἁνήρ, φίλος ὄχθος·\n648 φίλα γὰρ κέκευθεν ἤθη.\n649 Ἀιδωνεὺς δʼ ἀναπομ-\n650 πὸς ἀνείης, Ἀιδωνεύς,\n651 θεῖον ἀνάκτορα Δαριᾶνα. ἠέ.\n652 οὐδὲ γὰρ ἄνδρας ποτʼ ἀπώλλυ\n653 πολεμοφθόροισιν ἄταις,\n654 θεομήστωρ δʼ ἐκικλή-\n655 σκετο Πέρσαις, θεομήστωρ δʼ\n656 ἔσκεν,ἐπεὶ στρατὸν εὖ ποδούχει. ἠέ.\n657 βαλήν, ἀρχαῖος βαλήν,\n658 ἴθι, ἱκοῦ·\n659 ἔλθʼ ἐπʼ ἄκρον κόρυμβον ὄχθου,\n660 κροκόβαπτον ποδὸς εὔμαριν ἀείρων,\n661 βασιλείου τιάρας\n662 φάλαρον πιφαύσκων.\n663 βάσκε πάτερ ἄκακε Δαριάν, οἶ.\n664 ὅπως αἰανῆ κλύῃς\n665 νέα τʼ ἄχη,\n666 δέσποτα δεσπότου φάνηθι.\n667 Στυγία γάρ τις ἐπʼ ἀχλὺς πεπόταται·\n668 νεολαία γὰρ ἤδη\n670 κατὰ πᾶσʼ ὄλωλεν.\n671 βάσκε πάτερ ἄκακε Δαριάν, οἶ.\n673 αἰαῖ αἰαῖ·\n674 ὦ πολύκλαυτε φίλοισι θανών,\n675 τί τάδε δυνάτα δυνάτα\n676 περὶ τᾷ σᾷ δίδυμα ἁμάρτια;\n677 πᾶσαι γᾷ τᾷδʼ\n678 ἐξέφθινται τρίσκαλμοι\n680 νᾶες ἄναες ἄναες.\n\n[Εἴδωλον  Δαρείου]\n681 ὦ πιστὰ πιστῶν ἥλικές θʼ ἥβης ἐμῆς\n682 Πέρσαι γεραιοί, τίνα πόλις πονεῖ πόνον;\n683 στένει, κέκοπται, καὶ χαράσσεται πέδον.\n684 λεύσσων δʼ ἄκοιτιν τὴν ἐμὴν τάφου πέλας\n685 ταρβῶ, χοὰς δὲ πρευμενὴς ἐδεξάμην.\n686 ὑμεῖς δὲ θρηνεῖτʼ ἐγγὺς ἑστῶτες τάφου\n687 καὶ ψυχαγωγοῖς ὀρθιάζοντες γόοις\n688 οἰκτρῶς καλεῖσθέ μʼ· ἐστὶ δʼ οὐκ εὐέξοδον,\n689 ἄλλως τε πάντως χοἰ κατὰ χθονὸς θεοὶ\n690 λαβεῖν ἀμείνους εἰσὶν ἢ μεθιέναι.\n691 ὅμως δʼ ἐκείνοις ἐνδυναστεύσας ἐγὼ\n692 ἥκω. τάχυνε δʼ ὡς ἄμεμπτος ὦ χρόνου.\n693 τί ἐστι Πέρσαις νεοχμὸν ἐμβριθὲς κακόν·\n\n[Χορός]\n694 σέβομαι μὲν προσιδέσθαι,\n695 σέβομαι δʼ ἀντία λέξαι\n696 σέθεν ἀρχαίῳ περὶ τάρβει.\n\n[Δαρεῖος]\n697 ἀλλʼ ἐπεὶ κάτωθεν ἦλθον σοῖς γόοις πεπεισμένος,\n698 μή τι μακιστῆρα μῦθον, ἀλλὰ σύντομον λέγων\n699 εἰπὲ καὶ πέραινε πάντα, τὴν ἐμὴν αἰδῶ μεθείς.\n\n[Χορός]\n700 δίεμαι μὲν χαρίσασθαι,\n701 δίεμαι δʼ ἀντία φάσθαι,\n702 λέξας δύσλεκτα φίλοισιν.\n\n[Δαρεῖος]\n703 ἀλλʼ ἐπεὶ δέος παλαιὸν σοὶ φρενῶν ἀνθίσταται,\n704 τῶν ἐμῶν λέκτρων γεραιὰ ξύννομʼ εὐγενὲς γύναι,"

        n: "705-805",
        label: "v.705–805",
        text: "[Δαρεῖος]\n705 κλαυμάτων λήξασα τῶνδε καὶ γόων σαφές τί μοι\n706 λέξον· ἀνθρώπεια δʼ ἄν τοι πήματʼ ἂν τύχοι βροτοῖς.\n707 πολλὰ μὲν γὰρ ἐκ θαλάσσης, πολλὰ δʼ ἐκ χέρσου κακὰ\n708 γίγνεται θνητοῖς, ὁ μάσσων βίοτος ἢν ταθῇ, πρόσω.\n\n[Ἄτοσσα]\n709 ὦ βροτῶν πάντων ὑπερσχὼν ὄλβον εὐτυχεῖ πότμῳ\n710 ὡς ἕως τʼ ἔλευσσες αὐγὰς ἡλίου ζηλωτὸς ὢν\n711 βίοτον εὐαίωνα Πέρσαις ὡς θεὸς διήγαγες,\n712 νῦν τέ σε ζηλῶ θανόντα, πρὶν κακῶν ἰδεῖν βάθος.\n713 πάντα γάρ, Δαρεῖʼ ἀκούσῃ μῦθον ἐν βραχεῖ χρόνῳ.\n714 διαπεπόρθηται τὰ Περσῶν πράγμαθʼ, ὡς εἰπεῖν ἔπος.\n\n[Δαρεῖος]\n715 τίνι τρόπῳ; λοιμοῦ τις ἦλθε σκηπτὸς ἢ στάσις πόλει;\n\n[Ἄτοσσα]\n716 οὐδαμῶς· ἀλλʼ ἀμφʼ Ἀθήνας πᾶς κατέφθαρται στρατός.\n\n[Δαρεῖος]\n717 τίς δʼ ἐμῶν ἐκεῖσε παίδων ἐστρατηλάτει; φράσον.\n\n[Ἄτοσσα]\n718 θούριος Ξέρξης, κενώσας πᾶσαν ἠπείρου πλάκα.\n\n[Δαρεῖος]\n719 πεζὸς ἢ ναύτης δὲ πεῖραν τήνδʼ ἐμώρανεν τάλας;\n\n[Ἄτοσσα]\n720 ἀμφότερα· διπλοῦν μέτωπον ἦν δυοῖν στρατευμάτοιν.\n\n[Δαρεῖος]\n721 πῶς δὲ καὶ στρατὸς τοσόσδε πεζὸς ἤνυσεν περᾶν;\n\n[Ἄτοσσα]\n722 μηχαναῖς ἔζευξεν Ἕλλης πορθμόν, ὥστʼ ἔχειν πόρον.\n\n[Δαρεῖος]\n723 καὶ τόδʼ ἐξέπραξεν, ὥστε Βόσπορον κλῇσαι μέγαν·\n\n[Ἄτοσσα]\n724 ὧδʼ ἔχει· γνώμης δέ πού τις δαιμόνων ξυνήψατο.\n\n[Δαρεῖος]\n725 φεῦ, μέγας τις ἦλθε δαίμων, ὥστε μὴ φρονεῖν καλῶς.\n\n[Ἄτοσσα]\n726 ὡς ἰδεῖν τέλος πάρεστιν οἷον ἤνυσεν κακόν.\n\n[Δαρεῖος]\n727 καὶ τί δὴ πράξασιν αὐτοῖς ὧδʼ ἐπιστενάζετε;\n\n[Ἄτοσσα]\n728 ναυτικὸς στρατὸς κακωθεὶς πεζὸν ὤλεσε στρατόν.\n\n[Δαρεῖος]\n729 ὧδε παμπήδην δὲ λαὸς πᾶς κατέφθαρται δορί;\n\n[Ἄτοσσα]\n730 πρὸς τάδʼ ὡς Σούσων μὲν ἄστυ πᾶν κενανδρίαν στένει.\n\n[Δαρεῖος]\n731 ὦ πόποι κεδνῆς ἀρωγῆς κἀπικουρίας στρατοῦ.\n\n[Ἄτοσσα]\n732 Βακτρίων δʼ ἔρρει πανώλης δῆμος, οὐδέ τις γέρων.\n\n[Δαρεῖος]\n733 ὦ μέλεος, οἵαν ἄρʼ ἥβην ξυμμάχων ἀπώλεσεν.\n\n[Ἄτοσσα]\n734 μονάδα δὲ Ξέρξην ἔρημόν φασιν οὐ πολλῶν μέτα—\n\n[Δαρεῖος]\n735 πῶς τε δὴ καὶ ποῖ τελευτᾶν; ἔστι τις σωτηρία;\n\n[Ἄτοσσα]\n736 ἄσμενον μολεῖν γέφυραν γαῖν δυοῖν ζευκτηρίαν.\n\n[Δαρεῖος]\n737 καὶ πρὸς ἤπειρον σεσῶσθαι τήνδε, τοῦτʼ ἐτήτυμον;\n\n[Ἄτοσσα]\n738 ναί· λόγος κρατεῖ σαφηνὴς τοῦτό γʼ, οὐδʼ ἔνι στάσις.\n\n[Δαρεῖος]\n739 φεῦ, ταχεῖά γʼ ἦλθε χρησμῶν πρᾶξις, ἐς δὲ παῖδʼ ἐμὸν\n740 Ζεὺς ἀπέσκηψεν τελευτὴν θεσφάτων· ἐγὼ δέ που\n741 διὰ μακροῦ χρόνου τάδʼ ηὔχουν ἐκτελευτήσειν θεούς·\n742 ἀλλʼ ὅταν σπεύδῃ τις αὐτός, χὠ θεὸς συνάπτεται.\n743 νῦν κακῶν ἔοικε πηγὴ πᾶσιν ηὑρῆσθαι φίλοις.\n744 παῖς δʼ ἐμὸς τάδʼ οὐ κατειδὼς ἤνυσεν νέῳ θράσει·\n745 ὅστις Ἑλλήσποντον ἱρὸν δοῦλον ὣς δεσμώμασιν\n746 ἤλπισε σχήσειν ῥέοντα, Βόσπορον ῥόον θεοῦ·\n747 καὶ πόρον μετερρύθμιζε, καὶ πέδαις σφυρηλάτοις\n748 περιβαλὼν πολλὴν κέλευθον ἤνυσεν πολλῷ στρατῷ,\n749 θνητὸς ὢν θεῶν τε πάντων ᾤετʼ, οὐκ εὐβουλίᾳ,\n750 καὶ Ποσειδῶνος κρατήσειν. πῶς τάδʼ οὐ νόσος φρενῶν\n751 εἶχε παῖδʼ ἐμόν; δέδοικα μὴ πολὺς πλούτου πόνος\n752 οὑμὸς ἀνθρώποις γένηται τοῦ φθάσαντος ἁρπαγή.\n\n[Ἄτοσσα]\n753 ταῦτά τοι κακοῖς ὁμιλῶν ἀνδράσιν διδάσκεται\n754 θούριος Ξέρξης· λέγουσι δʼ ὡς σὺ μὲν μέγαν τέκνοις\n755 πλοῦτον ἐκτήσω ξὺν αἰχμῇ, τὸν δʼ ἀνανδρίας ὕπο\n756 ἔνδον αἰχμάζειν, πατρῷον δʼ ὄλβον οὐδὲν αὐξάνειν.\n757 τοιάδʼ ἐξ ἀνδρῶν ὀνείδη πολλάκις κλύων κακῶν\n758 τήνδʼ ἐβούλευσεν κέλευθον καὶ στράτευμʼ ἐφʼ Ἑλλάδα.\n\n[Δαρεῖος]\n759 τοιγάρ σφιν ἔργον ἐστὶν ἐξειργασμένον\n760 μέγιστον, ἀείμνηστον, οἷον οὐδέπω\n761 τόδʼ ἄστυ Σούσων ἐξεκείνωσεν πεσόν,\n762 ἐξ οὗτε τιμὴν Ζεὺς ἄναξ τήνδʼ ὤπασεν,\n763 ἕνʼ ἄνδρʼ ἁπάσης Ἀσίδος μηλοτρόφου\n764 ταγεῖν, ἔχοντα σκῆπτρον εὐθυντήριον.\n765 Μῆδος γὰρ ἦν ὁ πρῶτος ἡγεμὼν στρατοῦ·\n766 ἄλλος δʼ ἐκείνου παῖς τόδʼ ἔργον ἤνυσεν·\n767 φρένες γὰρ αὐτοῦ θυμὸν ᾠακοστρόφουν.\n768 τρίτος δʼ ἀπʼ αὐτοῦ Κῦρος, εὐδαίμων ἀνήρ,\n769 ἄρξας ἔθηκε πᾶσιν εἰρήνην φίλοις·\n770 Λυδῶν δὲ λαὸν καὶ Φρυγῶν ἐκτήσατο,\n771 Ἰωνίαν τε πᾶσαν ἤλασεν βίᾳ.\n772 θεὸς γὰρ οὐκ ἤχθηρεν, ὡς εὔφρων ἔφυ.\n773 Κύρου δὲ παῖς τέταρτος ηὔθυνε στρατόν.\n774 πέμπτος δὲ Μάρδος ἦρξεν, αἰσχύνη πάτρᾳ\n775 θρόνοισί τʼ ἀρχαίοισι· τὸν δὲ σὺν δόλῳ\n776 Ἀρταφρένης ἔκτεινεν ἐσθλὸς ἐν δόμοις,\n777 ξὺν ἀνδράσιν φίλοισιν, οἷς τόδʼ ἦν χρέος.\n779 κἀγὼ πάλου τʼ ἔκυρσα τοῦπερ ἤθελον,\n780 κἀπεστράτευσα πολλὰ σὺν πολλῷ στρατῷ·\n781 ἀλλʼ οὐ κακὸν τοσόνδε προσέβαλον πόλει.\n782 Ξέρξης δʼ ἐμὸς παῖς ὢν νέος νέα φρονεῖ,\n783 κοὐ μνημονεύει τὰς ἐμὰς ἐπιστολάς·\n784 εὖ γὰρ σαφῶς τόδʼ ἴστʼ, ἐμοὶ ξυνήλικες,\n785 ἅπαντες ἡμεῖς, οἳ κράτη τάδʼ ἔσχομεν,\n786 οὐκ ἂν φανεῖμεν πήματʼ ἔρξαντες τόσα.\n\n[Χορός]\n787 τί οὖν, ἄναξ Δαρεῖε, ποῖ καταστρέφεις\n788 λόγων τελευτήν; πῶς ἂν ἐκ τούτων ἔτι\n789 πράσσοιμεν ὡς ἄριστα Περσικὸς λεώς;\n\n[Δαρεῖος]\n790 εἰ μὴ στρατεύοισθʼ ἐς τὸν Ἑλλήνων τόπον,\n791 μηδʼ εἰ στράτευμα πλεῖον τὸ Μηδικόν.\n792 αὐτὴ γὰρ ἡ γῆ ξύμμαχος κείνοις πέλει.\n\n[Χορός]\n793 πῶς τοῦτʼ ἔλεξας, τίνι τρόπῳ δὲ συμμαχεῖ;\n\n[Δαρεῖος]\n794 κτείνουσα λιμῷ τοὺς ὑπερπόλλους ἄγαν.\n\n[Χορός]\n795 ἀλλʼ εὐσταλῆ τοι λεκτὸν ἀροῦμεν στόλον.\n\n[Δαρεῖος]\n796 ἀλλʼ οὐδʼ ὁ μείνας νῦν ἐν Ἑλλάδος τόποις\n797 στρατὸς κυρήσει νοστίμου σωτηρίας.\n\n[Χορός]\n798 πῶς εἶπας; οὐ γὰρ πᾶν στράτευμα βαρβάρων\n799 περᾷ τὸν Ἕλλης πορθμὸν Εὐρώπης ἄπο;\n\n[Δαρεῖος]\n800 παῦροι γε πολλῶν, εἴ τι πιστεῦσαι θεῶν\n801 χρὴ θεσφάτοισιν, ἐς τὰ νῦν πεπραγμένα\n802 βλέψαντα· συμβαίνει γὰρ οὐ τὰ μέν, τὰ δʼ οὔ.\n803 κεἴπερ τάδʼ ἐστί, πλῆθος ἔκκριτον στρατοῦ\n804 λείπει κεναῖσιν ἐλπίσιν πεπεισμένος.\n805 μίμνουσι δʼ ἔνθα πεδίον Ἀσωπὸς ῥοαῖς"

        text: "[Δαρεῖος]\n806 ἄρδει, φίλον πίασμα Βοιωτῶν χθονί·\n807 οὗ σφιν κακῶν ὕψιστʼ ἐπαμμένει παθεῖν,\n808 ὕβρεως ἄποινα κἀθέων φρονημάτων·\n809 οἳ γῆν μολόντες Ἑλλάδʼ οὐ θεῶν βρέτη\n810 ᾐδοῦντο συλᾶν οὐδὲ πιμπράναι νεώς·\n811 βωμοὶ δʼ ἄιστοι, δαιμόνων θʼ ἱδρύματα\n812 πρόρριζα φύρδην ἐξανέστραπται βάθρων.\n813 τοιγὰρ κακῶς δράσαντες οὐκ ἐλάσσονα\n814 πάσχουσι, τὰ δὲ μέλλουσι, κοὐδέπω κακῶν\n815 κρηνὶς ἀπέσβηκʼ ἀλλʼ ἔτʼ ἐκπιδύεται.\n816 τόσος γὰρ ἔσται πέλανος αἱματοσφαγὴς\n817 πρὸς γῇ Πλαταιῶν Δωρίδος λόγχης ὕπο·\n818 θῖνες νεκρῶν δὲ καὶ τριτοσπόρῳ γονῇ\n819 ἄφωνα σημανοῦσιν ὄμμασιν βροτῶν\n820 ὡς οὐχ ὑπέρφευ θνητὸν ὄντα χρὴ φρονεῖν.\n821 ὕβρις γὰρ ἐξανθοῦσʼ ἐκάρπωσεν στάχυν\n822 ἄτης, ὅθεν πάγκλαυτον ἐξαμᾷ θέρος.\n823 τοιαῦθʼ ὁρῶντες τῶνδε τἀπιτίμια\n824 μέμνησθʼ Ἀθηνῶν Ἑλλάδος τε, μηδέ τις\n825 ὑπερφρονήσας τὸν παρόντα δαίμονα\n826 ἄλλων ἐρασθεὶς ὄλβον ἐκχέῃ μέγαν.\n827 Ζεύς τοι κολαστὴς τῶν ὑπερκόμπων ἄγαν\n828 φρονημάτων ἔπεστιν, εὔθυνος βαρύς.\n829 πρὸς ταῦτʼ ἐκεῖνον, σωφρονεῖν κεχρημένον,\n830 πινύσκετʼ εὐλόγοισι νουθετήμασιν,\n831 λῆξαι θεοβλαβοῦνθʼ ὑπερκόμπῳ θράσει.\n832 σὺ δʼ, ὦ γεραιὰ μῆτερ ἡ Ξέρξου φίλη,\n833 ἐλθοῦσʼ ἐς οἴκους κόσμον ὅστις εὐπρεπὴς\n834 λαβοῦσʼ ὑπαντίαζε παιδί. πάντα γὰρ\n835 κακῶν ὑπʼ ἄλγους λακίδες ἀμφὶ σώματι\n836 στημορραγοῦσι ποικίλων ἐσθημάτων.\n837 ἀλλʼ αὐτὸν εὐφρόνως σὺ πράυνον λόγοις·\n838 μόνης γάρ, οἶδα, σοῦ κλύων ἀνέξεται.\n839 ἐγὼ δʼ ἄπειμι γῆς ὑπὸ ζόφον κάτω.\n840 ὑμεῖς δέ, πρέσβεις, χαίρετʼ, ἐν κακοῖς ὅμως\n841 ψυχῇ διδόντες ἡδονὴν καθʼ ἡμέραν,\n842 ὡς τοῖς θανοῦσι πλοῦτος οὐδὲν ὠφελεῖ.\n\n[Χορός]\n843 ἦ πολλὰ καὶ παρόντα καὶ μέλλοντʼ ἔτι\n844 ἤλγησʼ ἀκούσας βαρβάροισι πήματα.\n\n[Ἄτοσσα]\n845 ὦ δαῖμον, ὥς με πόλλʼ ἐσέρχεται κακὰ\n846 ἄλγη, μάλιστα δʼ ἥδε συμφορὰ δάκνει,\n847 ἀτιμίαν γε παιδὸς ἀμφὶ σώματι\n848 ἐσθημάτων κλύουσαν, ἥ νιν ἀμπέχει.\n849 ἀλλʼ εἶμι, καὶ λαβοῦσα κόσμον ἐκ δόμων\n850 ὑπαντιάζειν παιδί μου πειράσομαι.\n851 οὐ γὰρ τὰ φίλτατʼ ἐν κακοῖς προδώσομεν.\n\n[Χορός]\n852 ὦ πόποι ἦ μεγάλας ἀγαθᾶς τε πο-\n853 λισσονόμου βιοτᾶς ἐπεκύρσαμεν,\n854 εὖθʼ ὁ γηραιὸς\n855 πανταρκὴς ἀκάκας\n856 ἄμαχος βασιλεὺς\n857 ἰσόθεος Δαρεῖος ἆρχε χώρας.\n858 πρῶτα μὲν εὐδοκίμους στρατιὰς ἀπε-\n859 φαινόμεθʼ, ἠδὲ νομίσματα πύργινα\n860 πάντʼ ἐπηύθυνε,\n861 νόστοι δʼ ἐκ πολέμων\n862 ἀπόνους ἀπαθεῖς\n863 ἀνέρας εὖ πράσσοντας ἆγον οἴκους.\n864 ὅσσας δʼ εἷλε πόλεις πόρον\n865 οὐ διαβὰς Ἅλυος ποταμοῖο,\n866 οὐδʼ ἀφʼ ἑστίας συθείς,\n867 οἷαι Στρυμονίου πελά-\n868 γους Ἀχελωίδες εἰσὶ πάροικοι\n870 Θρῃκίων ἐπαύλων,\n871 λίμνας τʼ ἔκτοθεν αἳ κατὰ\n872 χέρσον ἐληλαμέναι πέρι πύργον\n873 τοῦδʼ ἄνακτος ἄιον,\n875 Ἕλλας τʼ ἀμφὶ πόρον πλατὺν\n876 εὐχόμεναι, μυχία τε Προποντίς,\n877 καὶ στόμωμα Πόντου·\n879 νᾶσοί θʼ αἳ κατὰ πρῶνʼ\n880 ἅλιον περίκλυστοι\n881 τᾷδε γᾷ προσήμεναι\n882 οἵα Λέσβος ἐλαι-\n883 όφυτός τε Σάμος, Χίος\n884 ἠδὲ Πάρος, Νάξος, Μύκο-\n885 νος, Τήνῳ τε συνάπτουσʼ\n886 Ἀνδρος ἀγχιγείτων,\n888 καὶ τὰς ἀγχιάλους\n889 ἐκράτυνε μεσάκτους,\n890 Λῆμνον, Ἰκάρου θʼ ἕδος,\n891 καὶ Ῥόδον ἠδὲ Κνίδον\n892 Κυπρίας τε πόλεις, Πάφον,\n893 ἠδὲ Σόλους, Σαλαμῖνά τε,\n895 τᾶς νῦν ματρόπολις τῶνδʼ\n896 αἰτία στεναγμῶν.\n898 καὶ τὰς εὐκτεάνους κατὰ\n899 κλῆρον Ἰαόνιον πολυάνδρους\n900 Ἑλλάνων ἐκράτει σφετέραις φρεσίν.\n901 ἀκάματον δὲ παρῆν σθένος\n902 ἀνδρῶν τευχηστήρων\n903 παμμίκτων τʼ ἐπικούρων.\n904 νῦν δʼ οὐκ ἀμφιλόγως\n905 θεότρεπτα τάδʼ αὖ\n906 φέρομεν πολέμοισι\n907 δμαθέντες μεγάλως\n908 πλαγαῖσι ποντίαισιν.\n\n[Ξέρξης]\n909 ἰώ,\n909b δύστηνος ἐγὼ στυγερᾶς μοίρας\n910 τῆσδε κυρήσας ἀτεκμαρτοτάτης,"

        n: "911-1012",
        label: "v.911–1012",
        text: "[Ξέρξης]\n911 ὡς ὠμοφρόνως δαίμων ἐνέβη\n912 Περσῶν γενεᾷ· τί πάθω τλήμων;\n913 λέλυται γὰρ ἐμοὶ γυίων ῥώμη\n914 τήνδʼ ἡλικίαν ἐσιδόντʼ ἀστῶν.\n915 εἴθʼ ὄφελεν, Ζεῦ, κἀμὲ μετʼ ἀνδρῶν\n916 τῶν οἰχομένων\n917 θανάτου κατὰ μοῖρα καλύψαι.\n\n[Χορός]\n918 ὀτοτοῖ, βασιλεῦ, στρατιᾶς ἀγαθῆς\n919 καὶ περσονόμου τιμῆς μεγάλης,\n920 κόσμου τʼ ἀνδρῶν,\n921 οὓς νῦν δαίμων ἐπέκειρεν.\n922 γᾶ δʼ αἰάζει τὰν ἐγγαίαν\n923 ἥβαν Ξέρξᾳ κταμέναν Ἅιδου\n924 σάκτορι Περσᾶν. ᾁδοβάται γὰρ\n925 πολλοὶ φῶτες, χώρας ἄνθος,\n926 τοξοδάμαντες, πάνυ ταρφύς τις\n927 μυριὰς ἀνδρῶν, ἐξέφθινται.\n928 αἰαῖ αἰαῖ κεδνᾶς ἀλκᾶς.\n929 Ἀσία δὲ χθών, βασιλεῦ γαίας,\n930 αἰνῶς αἰνῶς\n931 ἐπὶ γόνυ κέκλιται.\n\n[Ξέρξης]\n932 ὅδʼ ἐγώ, οἰοῖ, αἰακτὸς\n933 μέλεος γέννᾳ γᾷ τε πατρῴᾳ\n934 κακὸν ἄρʼ ἐγενόμαν.\n\n[Χορός]\n935 πρόσφθογγόν σοι νόστου τὰν\n936 κακοφάτιδα βοάν,\n937 κακομέλετον ἰὰν\n938 Μαριανδυνοῦ θρηνητῆρος\n939 πέμψω πέμψω,\n940 πολύδακρυν ἰαχάν.\n\n[Ξέρξης]\n941 ἵετʼ αἰανῆ πάνδυρτον\n942 δύσθροον αὐδάν. δαίμων γὰρ ὅδʼ αὖ\n943 μετάτροπος ἐπʼ ἐμοί.\n\n[Χορός]\n944 ἥσω τοι τὰν πάνδυρτον,\n945 σὰ πάθη τε σέβων\n946 ἁλίτυπά τε βάρη,\n947 πόλεως γέννας πενθητῆρος·\n948 κλάγξω κλάγξω\n949 δὲ γόον ἀρίδακρυν.\n\n[Ξέρξης]\n950 Ἰάνων γὰρ ἀπηύρα,\n951 Ἰάνων ναύφρακτος\n952 Ἄρης ἑτεραλκὴς\n953 νυχίαν πλάκα κερσάμενος\n954 δυσδαίμονά τʼ ἀκτάν.\n\n[Χορός]\n955 οἰοιοῖ βόα καὶ πάντʼ ἐκπεύθου.—\n956 ποῦ δὲ φίλων ἄλλος ὄχλος,\n957 ποῦ δέ σοι παραστάται,\n958 οἷος ἦν Φαρανδάκης,\n959 Σούσας, Πελάγων, Δοτάμας, ἠδʼ Ἀ-\n960 γδαβάτας, Ψάμμις, Σουσισκάνης τʼ\n961 Ἀγβάτανα λιπών;\n\n[Ξέρξης]\n962 ὀλοοὺς ἀπέλειπον\n963 Τυρίας ἐκ ναὸς\n964 ἔρροντας ἐπʼ ἀκταῖς\n965 Σαλαμινιάσι στυφελοῦ\n966 θείνοντας ἐπʼ ἀκτᾶς.\n\n[Χορός]\n967 οἰοιοῖ, βόα· ποῦ σοι Φαρνοῦχος\n968 Ἀριόμαρδός τʼ ἀγαθός,\n969 ποῦ δὲ Σευάλκης ἄναξ,\n970 ἢ Λίλαιος εὐπάτωρ,\n971 Μέμφις, Θάρυβις, καὶ Μασίστρας,\n972 Ἀρτεμβάρης τʼ ἠδʼ Ὑσταίχμας;\n973 τάδε σʼ ἐπανερόμαν.\n\n[Ξέρξης]\n974 ἰὼ ἰώ μοί μοι\n975 τὰς ὠγυγίους κατιδόντες\n976 στυγνὰς Ἀθάνας πάντες ἑνὶ πιτύλῳ,\n977 ἐὴ ἐή, τλάμονες ἀσπαίρουσι χέρσῳ.\n\n[Χορός]\n978 ἦ καὶ τὸν Περσᾶν αὐτοῦ\n979 τὸν σὸν πιστὸν πάντʼ ὀφθαλμὸν\n980 μυρία μυρία πεμπαστὰν\n981 Βατανώχου παῖδʼ Ἄλπιστον\n982 τοῦ Σησάμα τοῦ Μεγαβάτα,\n983 Πάρθον τε μέγαν τʼ Οἰβάρην\n984 ἔλιπες ἔλιπες;\n985 ὢ ὢ ὢ δᾴων.\n986 Πέρσαις ἀγαυοῖς κακὰ πρόκακα λέγεις.\n\n[Ξέρξης]\n988 ἰὼ ἰὼ δῆτα\n989 ἴυγγʼ ἀγαθῶν ἑτάρων μοι\n990 κινεῖς ἄλαστα στυγνὰ πρόκακα λέγων.\n991 βοᾷ βοᾷ μοι μελέων ἔντοσθεν ἦτορ.\n\n[Χορός]\n992 καὶ μὴν ἄλλους γε ποθοῦμεν,\n993 Μάρδων ἀνδρῶν μυριοταγὸν\n994 Ξάνθιν ἄρειόν τʼ Ἀγχάρην,\n995 Δίαιξίν τʼ ἠδʼ Ἀρσάκην\n996 ἱππιάνακτας,\n997 Κηγδαδάταν καὶ Λυθίμναν\n998 Τόλμον τʼ αἰχμᾶς ἀκόρεστον.\n999 ἔταφον ἔταφον,\n1000 οὐκ ἀμφὶ σκηναῖς\n1001 τροχηλάτοισιν ὄπιθεν ἑπομένους.\n\n[Ξέρξης]\n1002 βεβᾶσι γὰρ τοίπερ ἀγρέται στρατοῦ.\n\n[Χορός]\n1003 βεβᾶσιν, οἴ, νώνυμοι.\n\n[Ξέρξης]\n1004 ἰὴ ἰή, ἰὼ ἰώ.\n\n[Χορός]\n1005 ἰὼ ἰώ, δαίμονες,\n1006 ἔθεθʼ ἄελπτον κακὸν\n1007 διαπρέπον, οἷον δέδορκεν Ἄτα.\n\n[Ξέρξης]\n1008 πεπλήγμεθʼ οἵᾳ διʼ αἰῶνος τύχᾳ·\n\n[Χορός]\n1009 πεπλήγμεθʼ· εὔδηλα γάρ·\n\n[Ξέρξης]\n1010 νέᾳ νέᾳ δύᾳ δύᾳ.\n\n[Χορός]\n1012 κύρσαντες οὐκ εὐτυχῶς"

        text: "[Χορός]\n1011 Ἰάνων ναυβατᾶν.\n1013 δυσπόλεμον δὴ γένος τὸ Περσᾶν.\n\n[Ξέρξης]\n1014 πῶς δʼ οὔ; στρατὸν μὲν τοσοῦ-\n1015 τον τάλας πέπληγμαι.\n\n[Χορός]\n1016 τί δʼ οὔκ; ὄλωλεν μεγάλως τὰ Περσᾶν.\n\n[Ξέρξης]\n1017 ὁρᾷς τὸ λοιπὸν τόδε τᾶς ἐμᾶς στολᾶς;\n\n[Χορός]\n1018 ὁρῶ ὁρῶ.\n\n[Ξέρξης]\n1020 τόνδε τʼ ὀιστοδέγμονα—\n\n[Χορός]\n1021 τί τόδε λέγεις σεσωσμένον;\n\n[Ξέρξης]\n1022 θησαυρὸν βελέεσσιν;\n\n[Χορός]\n1023 βαιά γʼ ὡς ἀπὸ πολλῶν.\n\n[Ξέρξης]\n1024 ἐσπανίσμεθʼ ἀρωγῶν.\n\n[Χορός]\n1025 Ἰάνων λαὸς οὐ φυγαίχμας.\n\n[Ξέρξης]\n1026 ἀγανόρειος· κατεῖ-\n1027 δον δὲ πῆμʼ ἄελπτον.\n\n[Χορός]\n1028 τραπέντα ναύφρακτον ἐρεῖς ὅμιλον;\n\n[Ξέρξης]\n1030 πέπλον δʼ ἐπέρρηξʼ ἐπὶ συμφορᾷ κακοῦ.\n\n[Χορός]\n1031 παπαῖ παπαῖ.\n\n[Ξέρξης]\n1032 καὶ πλέον ἢ παπαῖ μὲν οὖν.\n\n[Χορός]\n1033 δίδυμα γάρ ἐστι καὶ τριπλᾶ—\n\n[Ξέρξης]\n1034 λυπρά, χάρματα δʼ ἐχθροῖς.\n\n[Χορός]\n1035 καὶ σθένος γʼ ἐκολούσθη—\n\n[Ξέρξης]\n1036 γυμνός εἰμι προπομπῶν.\n\n[Χορός]\n1037 φίλων ἄταισι ποντίαισιν·\n\n[Ξέρξης]\n1038 δίαινε δίαινε πῆμα· πρὸς δόμους δʼ ἴθι.\n\n[Χορός]\n1039 αἰαῖ αἰαῖ, δύα δύα.\n\n[Ξέρξης]\n1040 βόα νυν ἀντίδουπά μοι.\n\n[Χορός]\n1041 δόσιν κακὰν κακῶν κακοῖς.\n\n[Ξέρξης]\n1042 ἴυζε μέλος ὁμοῦ τιθείς.\n\n[Χορός]\n1043 ὀτοτοτοτοῖ.\n1044 βαρεῖά γʼ ἅδε συμφορά.\n1045 οἲ μάλα καὶ τόδʼ ἀλγῶ.\n\n[Ξέρξης]\n1046 ἔρεσσʼ ἔρεσσε καὶ στέναζʼ ἐμὴν χάριν.\n\n[Χορός]\n1047 διαίνομαι γοεδνὸς ὤν.\n\n[Ξέρξης]\n1048 βόα νυν ἀντίδουπά μοι.\n\n[Χορός]\n1049 μέλειν πάρεστι, δέσποτα.\n\n[Ξέρξης]\n1050 ἐπορθίαζέ νυν γόοις.\n\n[Χορός]\n1051 ὀτοτοτοτοῖ.\n1052 μέλαινα δʼ ἀμμεμείξεται,\n1053 οἴ, στονόεσσα πλαγά.\n\n[Ξέρξης]\n1054 καὶ στέρνʼ ἄρασσε κἀπιβόα τὸ Μύσιον.\n\n[Χορός]\n1055 ἄνιʼ ἄνια.\n\n[Ξέρξης]\n1056 καί μοι γενείου πέρθε λευκήρη τρίχα.\n\n[Χορός]\n1057 ἄπριγδʼ ἄπριγδα μάλα γοεδνά.\n\n[Ξέρξης]\n1058 ἀύτει δʼ ὀξύ.\n\n[Χορός]\n1059 καὶ τάδʼ ἔρξω.\n\n[Ξέρξης]\n1060 πέπλον δʼ ἔρεικε κολπίαν ἀκμῇ χερῶν.\n\n[Χορός]\n1061 ἄνιʼ ἄνια.\n\n[Ξέρξης]\n1062 καὶ ψάλλʼ ἔθειραν καὶ κατοίκτισαι στρατόν.\n\n[Χορός]\n1063 ἄπριγδʼ ἄπριγδα μάλα γοεδνά.\n\n[Ξέρξης]\n1064 διαίνου δʼ ὄσσε.\n\n[Χορός]\n1065 τέγγομαί τοι.\n\n[Ξέρξης]\n1066 βόα νυν ἀντίδουπά μοι.\n\n[Χορός]\n1067 οἰοῖ οἰοῖ.\n\n[Ξέρξης]\n1068 αἰακτὸς ἐς δόμους κίε.\n\n[Χορός]\n1070 ἰὼ ἰώ, .\n\n[Ξέρξης]\n1071 ἰωὰ δὴ κατʼ ἄστυ.\n\n[Χορός]\n1072 ἰωὰ δῆτα, ναὶ ναί.\n\n[Ξέρξης]\n1073 γοᾶσθʼ ἁβροβάται.\n\n[Χορός]\n1074 ἰὼ ἰώ, Περσὶς αἶα δύσβατος.\n\n[Ξέρξης]\n1074b ἰὴ ἰὴ τρισκάλμοισιν,\n1075 ἰὴ ἰή, βάρισιν ὀλόμενοι.\n\n[Χορός]\n1076 πέμψω τοί σε δυσθρόοις γόοις."

    sections: [

        n: "1.1-50",
        label: "1.1–50",
        text: "1 μῆνιν ἄειδε θεὰ Πηληϊάδεω Ἀχιλῆος\n2 οὐλομένην, ἣ μυρίʼ Ἀχαιοῖς ἄλγεʼ ἔθηκε,\n3 πολλὰς δʼ ἰφθίμους ψυχὰς Ἄϊδι προΐαψεν\n4 ἡρώων, αὐτοὺς δὲ ἑλώρια τεῦχε κύνεσσιν\n5 οἰωνοῖσί τε πᾶσι, Διὸς δʼ ἐτελείετο βουλή,\n6 ἐξ οὗ δὴ τὰ πρῶτα διαστήτην ἐρίσαντε\n7 Ἀτρεΐδης τε ἄναξ ἀνδρῶν καὶ δῖος Ἀχιλλεύς.\n8 τίς τʼ ἄρ σφωε θεῶν ἔριδι ξυνέηκε μάχεσθαι;\n9 Λητοῦς καὶ Διὸς υἱός· ὃ γὰρ βασιλῆϊ χολωθεὶς\n10 νοῦσον ἀνὰ στρατὸν ὄρσε κακήν, ὀλέκοντο δὲ λαοί,\n11 οὕνεκα τὸν Χρύσην ἠτίμασεν ἀρητῆρα\n12 Ἀτρεΐδης· ὃ γὰρ ἦλθε θοὰς ἐπὶ νῆας Ἀχαιῶν\n13 λυσόμενός τε θύγατρα φέρων τʼ ἀπερείσιʼ ἄποινα,\n14 στέμματʼ ἔχων ἐν χερσὶν ἑκηβόλου Ἀπόλλωνος\n15 χρυσέῳ ἀνὰ σκήπτρῳ, καὶ λίσσετο πάντας Ἀχαιούς,\n16 Ἀτρεΐδα δὲ μάλιστα δύω, κοσμήτορε λαῶν·\n17 Ἀτρεΐδαι τε καὶ ἄλλοι ἐϋκνήμιδες Ἀχαιοί,\n18 ὑμῖν μὲν θεοὶ δοῖεν Ὀλύμπια δώματʼ ἔχοντες\n19 ἐκπέρσαι Πριάμοιο πόλιν, εὖ δʼ οἴκαδʼ ἱκέσθαι·\n20 παῖδα δʼ ἐμοὶ λύσαιτε φίλην, τὰ δʼ ἄποινα δέχεσθαι,\n21 ἁζόμενοι Διὸς υἱὸν ἑκηβόλον Ἀπόλλωνα.\n22 ἔνθʼ ἄλλοι μὲν πάντες ἐπευφήμησαν Ἀχαιοὶ\n23 αἰδεῖσθαί θʼ ἱερῆα καὶ ἀγλαὰ δέχθαι ἄποινα·\n24 ἀλλʼ οὐκ Ἀτρεΐδῃ Ἀγαμέμνονι ἥνδανε θυμῷ,\n25 ἀλλὰ κακῶς ἀφίει, κρατερὸν δʼ ἐπὶ μῦθον ἔτελλε·\n26 μή σε γέρον κοίλῃσιν ἐγὼ παρὰ νηυσὶ κιχείω\n27 ἢ νῦν δηθύνοντʼ ἢ ὕστερον αὖτις ἰόντα,\n28 μή νύ τοι οὐ χραίσμῃ σκῆπτρον καὶ στέμμα θεοῖο·\n29 τὴν δʼ ἐγὼ οὐ λύσω· πρίν μιν καὶ γῆρας ἔπεισιν\n30 ἡμετέρῳ ἐνὶ οἴκῳ ἐν Ἄργεϊ τηλόθι πάτρης\n31 ἱστὸν ἐποιχομένην καὶ ἐμὸν λέχος ἀντιόωσαν·\n32 ἀλλʼ ἴθι μή μʼ ἐρέθιζε σαώτερος ὥς κε νέηαι.\n33 ὣς ἔφατʼ, ἔδεισεν δʼ ὃ γέρων καὶ ἐπείθετο μύθῳ·\n34 βῆ δʼ ἀκέων παρὰ θῖνα πολυφλοίσβοιο θαλάσσης·\n35 πολλὰ δʼ ἔπειτʼ ἀπάνευθε κιὼν ἠρᾶθʼ ὁ γεραιὸς\n36 Ἀπόλλωνι ἄνακτι, τὸν ἠΰκομος τέκε Λητώ·\n37 κλῦθί μευ ἀργυρότοξʼ, ὃς Χρύσην ἀμφιβέβηκας\n38 Κίλλαν τε ζαθέην Τενέδοιό τε ἶφι ἀνάσσεις,\n39 Σμινθεῦ εἴ ποτέ τοι χαρίεντʼ ἐπὶ νηὸν ἔρεψα,\n40 ἢ εἰ δή ποτέ τοι κατὰ πίονα μηρίʼ ἔκηα\n41 ταύρων ἠδʼ αἰγῶν, τὸ δέ μοι κρήηνον ἐέλδωρ·\n42 τίσειαν Δαναοὶ ἐμὰ δάκρυα σοῖσι βέλεσσιν.\n43 ὣς ἔφατʼ εὐχόμενος, τοῦ δʼ ἔκλυε Φοῖβος Ἀπόλλων,\n44 βῆ δὲ κατʼ Οὐλύμποιο καρήνων χωόμενος κῆρ,\n45 τόξʼ ὤμοισιν ἔχων ἀμφηρεφέα τε φαρέτρην·\n46 ἔκλαγξαν δʼ ἄρʼ ὀϊστοὶ ἐπʼ ὤμων χωομένοιο,\n47 αὐτοῦ κινηθέντος· ὃ δʼ ἤϊε νυκτὶ ἐοικώς.\n48 ἕζετʼ ἔπειτʼ ἀπάνευθε νεῶν, μετὰ δʼ ἰὸν ἕηκε·\n49 δεινὴ δὲ κλαγγὴ γένετʼ ἀργυρέοιο βιοῖο·\n50 οὐρῆας μὲν πρῶτον ἐπῴχετο καὶ κύνας ἀργούς,"
