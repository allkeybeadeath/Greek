// ===== Παράδειγμα — 변화표 만들기 (v51) =====================================
// PARADIGM_LIB (76 lemma · Smyth/Goodwin 표준형) 큐레이션 표 + AGDT v2.1 실제
// 출현 어형을 결합 표시. 학습자는 (a) 표준 패러다임을 한 화면에서 학습하고,
// (b) 실제 코퍼스 (Iliad·Odyssey·Persae·Plato·Plutarch·NT) 에서 *어떤 형태가 몇 번*
// 나오는지 확인할 수 있다. 패러다임 셀과 일치하는 어형은 attested 표시,
// 그 외 (Homeric -οιο, Doric ματ-, 비교급, crasis, 지시 -ί 등) 는 별도 그룹.
// 큐레이션 미매칭 시 AGDT 만으로 fallback 표시.

let _paradigmQuery = '';      // 재진입 보존 (탭 전환 후 돌아와도 마지막 쿼리 복원)
let _paradigmIdx = null;      // PARADIGM_LIB 키 정규화 인덱스 (lazy)

function _paradigmNormalize(s){
  // _searchNormalize 와 동일 규칙 (NFD + ς→σ + lowercase). 의존성 회피 위해 인라인.
  if(!s) return '';
  return s.normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/ς/g, 'σ')
          .toLowerCase()
          .trim();
}

function _buildParadigmIdx(){
  if(_paradigmIdx) return _paradigmIdx;
  const idx = new Map();
  if(typeof PARADIGM_LIB !== 'undefined'){
    for(const k in PARADIGM_LIB) idx.set(_paradigmNormalize(k), k);
  }
  _paradigmIdx = idx;
  return idx;
}

// query → PARADIGM_LIB hit. (1) 직접 키 매칭 → (2) 정규화 매칭 → (3) 어형으로
// 입력된 경우 MORPH_LOOKUP 으로 표제어 환원 후 재매칭. 환원되면 viaForm 부착.
function _lookupParadigmLib(query){
  if(typeof PARADIGM_LIB === 'undefined' || !query) return null;
  if(PARADIGM_LIB[query]) return {key:query, entry:PARADIGM_LIB[query]};
  const norm = _paradigmNormalize(query);
  if(!norm) return null;
  const idx = _buildParadigmIdx();
  const orig = idx.get(norm);
  if(orig) return {key:orig, entry:PARADIGM_LIB[orig]};
  // 어형으로 입력했을 가능성 — MORPH_LOOKUP 로 표제어 환원
  if(typeof MORPH_LOOKUP !== 'undefined'){
    const tries = [query, query.replace(/σ$/, 'ς'), norm, norm.replace(/σ$/, 'ς')];
    for(const t of tries){
      const ml = MORPH_LOOKUP[t];
      if(!ml || !ml.length) continue;
      for(const an of ml){
        const orig2 = idx.get(_paradigmNormalize(an.l));
        if(orig2) return {key:orig2, entry:PARADIGM_LIB[orig2], viaForm:query, viaLemma:an.l};
      }
    }
  }
  return null;
}

// AGDT lemmaForms 에서 해당 표제어 어형 + 빈도 추출. 인덱스 미구축이면 null.
function _collectAGDTFormsForLemma(lemmaKey){
  if(!_searchIdx || !_searchIdx.lemmaForms) return null;
  const norm = _paradigmNormalize(lemmaKey);
  const formsSet = _searchIdx.lemmaForms.get(norm);
  if(!formsSet) return null;
  const result = [];
  for(const f of formsSet){
    const surface = (_searchIdx.surface && _searchIdx.surface.get(f)) || f;
    const positions = _searchIdx.occ && _searchIdx.occ.get(f);
    const count = positions ? positions.length : 0;
    result.push({normalized:f, surface:surface, count:count});
  }
  result.sort((a,b) => b.count - a.count);
  return result;
}

// 큐레이션 표의 모든 어형을 정규화 set 으로 (AGDT 와 매칭용).
function _collectParadigmFormSet(entry){
  const set = new Set();
  const add = (s) => { if(s) set.add(_paradigmNormalize(s)); };
  for(const num of ['sg','pl']){
    if(!entry[num]) continue;
    for(const c in entry[num]){
      const v = entry[num][c];
      if(typeof v === 'string') add(v);
      else if(v && typeof v === 'object'){
        for(const g in v) add(v[g]);
      }
    }
  }
  return set;
}

function _esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 패러다임의 sg.nom (또는 임의 셀) 이 문자열이면 flat (성 구분 없음),
// 객체면 3-gender (m/f/n). 명사 + 인칭대명사 (ἐγώ, σύ) 가 flat, 형용사 + 다른 대명사가 3-gender.
function _paradigmIsThreeGender(entry){
  for(const num of ['sg','pl']){
    if(!entry[num]) continue;
    for(const c in entry[num]){
      const v = entry[num][c];
      if(v == null) continue;
      return (typeof v === 'object');  // 첫 non-null 셀로 결정
    }
  }
  return false;
}

function _paradigmMeta(entry){
  // 표 caption 우측 메타라벨
  const posLbl = entry.pos === 'noun' ? '명사'
              : entry.pos === 'adj'  ? '형용사'
              : entry.pos === 'pron' ? '대명사' : '';
  const genLbl = entry.gender ? ({m:'남성',f:'여성',n:'중성'}[entry.gender] || entry.gender) : '';
  const parts = [entry.type || '', posLbl, genLbl].filter(Boolean);
  // type 에 이미 pos/gender 가 녹아있을 수 있으므로 중복 피해 *type 만* 표시,
  // 단 gender 가 type 에 없으면 부착
  let s = entry.type || posLbl;
  if(genLbl && entry.pos === 'noun' && entry.type && !entry.type.includes(genLbl)) s += ' · ' + genLbl;
  return s;
}

function _paradigmFooter(entry){
  let html = '';
  if(entry.gloss)  html += '<div style="font-size:12px;color:var(--clay-d);margin-top:6px">의미: ' + _esc(entry.gloss) + '</div>';
  if(entry.note)   html += '<div style="font-size:11px;color:var(--black-glaze-l);margin-top:4px;line-height:1.55;padding:6px 8px;background:var(--ivory-d);border-left:2px solid var(--clay);border-radius:3px"><b>주:</b> ' + _esc(entry.note) + '</div>';
  if(entry.source) html += '<div style="font-size:11px;color:var(--clay-d);margin-top:4px">출처: ' + _esc(entry.source) + '</div>';
  return html;
}

// flat 표 — 단·복 2열, 5격 (호격 없으면 생략). 명사 + 인칭대명사 ἐγώ/σύ 공용.
function _renderCuratedFlat(key, entry){
  const cases = ['nom','gen','dat','acc','voc'];
  const labels = {nom:'주격', gen:'속격', dat:'여격', acc:'대격', voc:'호격'};
  let html = '<table class="paradigm"><caption>' + _esc(key) +
    ' <span style="font-size:11px;color:var(--clay-d);font-weight:400;font-style:normal">— ' +
    _esc(_paradigmMeta(entry)) + '</span></caption>';
  html += '<thead><tr><th></th><th>단수</th><th>복수</th></tr></thead><tbody>';
  for(const c of cases){
    const s = entry.sg && entry.sg[c];
    const p = entry.pl && entry.pl[c];
    if(!s && !p) continue;
    html += '<tr><td class="lbl">' + labels[c] + '</td>';
    html += '<td class="grk">' + _esc(s || '—') + '</td>';
    html += '<td class="grk">' + _esc(p || '—') + '</td></tr>';
  }
  html += '</tbody></table>';
  html += _paradigmFooter(entry);
  return html;
}

// 3-gender 표 — 단·복 각각 5격×3성
function _renderCuratedThreeGender(key, entry){
  const cases = ['nom','gen','dat','acc','voc'];
  const labels = {nom:'주격', gen:'속격', dat:'여격', acc:'대격', voc:'호격'};
  let html = '';
  for(const num of ['sg','pl']){
    if(!entry[num]) continue;
    const numLbl = num === 'sg' ? '단수' : '복수';
    html += '<table class="paradigm" style="margin-bottom:10px"><caption>' + _esc(key) + ' — ' + numLbl +
      ' <span style="font-size:11px;color:var(--clay-d);font-weight:400;font-style:normal">' +
      _esc(_paradigmMeta(entry)) + '</span></caption>';
    html += '<thead><tr><th></th><th>m</th><th>f</th><th>n</th></tr></thead><tbody>';
    for(const c of cases){
      const row = entry[num][c];
      if(!row) continue;
      const m = (row && typeof row === 'object') ? (row.m || '') : '';
      const f = (row && typeof row === 'object') ? (row.f || '') : '';
      const n = (row && typeof row === 'object') ? (row.n || '') : '';
      if(!m && !f && !n) continue;
      html += '<tr><td class="lbl">' + labels[c] + '</td>';
      html += '<td class="grk">' + _esc(m || '—') + '</td>';
      html += '<td class="grk">' + _esc(f || '—') + '</td>';
      html += '<td class="grk">' + _esc(n || '—') + '</td></tr>';
    }
    html += '</tbody></table>';
  }
  html += _paradigmFooter(entry);
  return html;
}

function _renderCuratedTable(key, entry){
  if(_paradigmIsThreeGender(entry)) return _renderCuratedThreeGender(key, entry);
  return _renderCuratedFlat(key, entry);
}

// AGDT attestation — 표준 패러다임 셀과 일치하는 어형은 단단 테두리 + 빨강,
// 그 외 어형 (Homeric/Doric/축약/비교급/지시 -ί 등) 은 점선 테두리 + 무채색.
function _renderAGDTAttestations(key, entry){
  const forms = _collectAGDTFormsForLemma(key);
  if(!forms){
    return '<div style="font-size:12px;color:var(--clay-d);padding:8px;background:var(--ivory-d);border-radius:6px">AGDT 형태분석 인덱스에서 표제어 매칭 없음 (인덱스 미구축이거나 본 자료군 외 표제어).</div>';
  }
  if(!forms.length){
    return '<div style="font-size:12px;color:var(--clay-d);padding:8px;background:var(--ivory-d);border-radius:6px">표제어 등록은 됐으나 본문 출현 0회 (AGDT 어휘목록만 보유).</div>';
  }
  const paradigmSet = _collectParadigmFormSet(entry);
  const inParadigm = [];
  const extra = [];
  for(const f of forms){
    if(paradigmSet.has(f.normalized)) inParadigm.push(f);
    else extra.push(f);
  }
  const total = forms.reduce((a,f)=>a+f.count, 0);
  let html = '<div style="font-size:12px;color:var(--clay-d);margin-bottom:6px">AGDT v2.1 형태분석 · 본 표제어로 총 <b>' + total + '</b>회 출현 (' + forms.length + ' 어형)</div>';
  if(inParadigm.length){
    html += '<div style="font-size:12px;color:var(--terracotta-d);font-weight:600;margin:8px 0 4px 0">표준 패러다임 attested (' + inParadigm.length + '/' + paradigmSet.size + ' 매칭)</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    for(const f of inParadigm){
      html += '<span style="font-family:var(--font-grk);font-size:14px;background:var(--ivory-d);border:1px solid var(--terracotta);padding:3px 8px;border-radius:6px;color:var(--terracotta-d);font-weight:600">' +
        _esc(f.surface) + ' <span style="font-size:10px;color:var(--clay-d);font-weight:400">×' + f.count + '</span></span>';
    }
    html += '</div>';
  }
  if(extra.length){
    html += '<div style="font-size:12px;color:var(--clay-d);font-weight:600;margin:10px 0 4px 0">패러다임 외 어형 (' + extra.length + ') ' +
      '<span style="font-weight:400;font-style:italic">— 방언/시문체/축약/비교급/지시 -ί 등</span></div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    const top = extra.slice(0, 40);
    for(const f of top){
      html += '<span style="font-family:var(--font-grk);font-size:13px;background:var(--ivory-d);border:1px dashed var(--clay);padding:2px 7px;border-radius:6px;color:var(--black-glaze-l)">' +
        _esc(f.surface) + ' <span style="font-size:10px;color:var(--clay-d)">×' + f.count + '</span></span>';
    }
    if(extra.length > 40){
      html += '<span style="font-size:11px;color:var(--clay-d);align-self:center;margin-left:4px">… 외 ' + (extra.length - 40) + '개</span>';
    }
    html += '</div>';
  }
  return html;
}

// AGDT only fallback — 큐레이션 미매칭 시. 정확한 lemma 일치면 AGDT 어형 나열,
// 아니면 MORPH_LOOKUP 으로 어형→표제어 후보 제시.
function _renderAGDTOnlyFallback(query){
  if(!_searchIdx || !_searchIdx.lemmaForms){
    return '<div style="padding:12px;background:var(--ivory-d);border-radius:8px;font-size:13px">' +
      '<div style="margin-bottom:8px">AGDT 인덱스 미구축 — 구축 후 다시 시도하세요.</div>' +
      '<button class="btn btn-sm" id="paradigm-build-idx">인덱스 구축 (~1-2초)</button>' +
      '<div id="paradigm-build-progress" style="font-size:11px;color:var(--clay-d);margin-top:6px"></div></div>';
  }
  const norm = _paradigmNormalize(query);
  const exactForms = _searchIdx.lemmaForms.get(norm);
  if(exactForms){
    const surface = (_searchIdx.lemmaSurface && _searchIdx.lemmaSurface.get(norm)) || query;
    const forms = _collectAGDTFormsForLemma(query) || [];
    const total = forms.reduce((a,f)=>a+f.count, 0);
    let html = '<div style="padding:10px 12px;background:var(--ivory-d);border-radius:8px;margin-bottom:10px">' +
      '<div style="font-size:12px;color:var(--clay-d)">큐레이션 패러다임은 없습니다 — AGDT 형태분석만 표시</div>' +
      '<div style="font-family:var(--font-grk);font-size:22px;color:var(--terracotta-d);font-weight:600;margin-top:4px">' +
      _esc(surface) + '</div></div>';
    html += '<div style="font-size:12px;color:var(--clay-d);margin-bottom:6px">총 ' + total + '회 출현 · ' + forms.length + ' 어형</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    for(const f of forms.slice(0, 80)){
      html += '<span style="font-family:var(--font-grk);font-size:14px;background:var(--ivory-d);border:1px solid var(--clay);padding:3px 8px;border-radius:6px;color:var(--terracotta-d);font-weight:600">' +
        _esc(f.surface) + ' <span style="font-size:10px;color:var(--clay-d);font-weight:400">×' + f.count + '</span></span>';
    }
    if(forms.length > 80){
      html += '<span style="font-size:11px;color:var(--clay-d);align-self:center;margin-left:4px">… 외 ' + (forms.length - 80) + '개</span>';
    }
    html += '</div>';
    return html;
  }
  if(typeof MORPH_LOOKUP !== 'undefined'){
    const ml = MORPH_LOOKUP[query] || MORPH_LOOKUP[query.replace(/σ$/, 'ς')];
    if(ml && ml.length){
      let html = '<div style="padding:12px;background:var(--ivory-d);border-radius:8px"><div style="font-size:13px;color:var(--black-glaze)">"' +
        _esc(query) + '"는 어형으로 보입니다. 가능한 표제어:</div><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">';
      const seen = new Set();
      for(const an of ml){
        if(seen.has(an.l)) continue;
        seen.add(an.l);
        html += '<button class="btn btn-sm" data-paradigm-lemma="' + _esc(an.l) + '" style="font-family:var(--font-grk)">' + _esc(an.l) + '</button>';
      }
      html += '</div></div>';
      return html;
    }
  }
  return '<div style="padding:12px;background:var(--ivory-d);border-radius:8px;font-size:13px;color:var(--clay-d)">' +
    '매칭 없음 — 표제어로 입력했는지 확인하세요. 예시: ' +
    '<button class="btn btn-sm" data-paradigm-lemma="ἄνθρωπος" style="font-family:var(--font-grk);margin:2px">ἄνθρωπος</button>' +
    '<button class="btn btn-sm" data-paradigm-lemma="πατήρ" style="font-family:var(--font-grk);margin:2px">πατήρ</button>' +
    '<button class="btn btn-sm" data-paradigm-lemma="αὐτός" style="font-family:var(--font-grk);margin:2px">αὐτός</button>' +
    '</div>';
}

// 큐레이션 목차 — 카테고리별로 details 펼침
function _renderParadigmSuggestions(){
  if(typeof PARADIGM_LIB === 'undefined') return '';
  // 카테고리 분류 — type 문자열 첫 부분 (예 "3변화 자음 (κ)" → "3변화 자음")
  const groups = {};
  const order = [];
  for(const k in PARADIGM_LIB){
    const e = PARADIGM_LIB[k];
    const posLbl = e.pos === 'noun' ? '명사' : (e.pos === 'adj' ? '형용사' : '대명사');
    const typBase = (e.type || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || '기타';
    const cat = posLbl + ' · ' + typBase;

    groups[cat].push(k);
  }
  let html = '<div><div style="font-size:12px;color:var(--clay-d);margin-bottom:6px">PARADIGM_LIB 수록 ' +
    Object.keys(PARADIGM_LIB).length + ' 표제어</div>';
  for(const cat of order){
    html += '<details style="margin-bottom:4px"><summary style="cursor:pointer;font-size:12px;color:var(--black-glaze-l);padding:4px 0">' +
      _esc(cat) + ' <span style="color:var(--clay-d)">(' + groups[cat].length + ')</span></summary>' +
      '<div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px 0 8px 12px">';

// ===== Paradigm Quiz — 변화표 빈칸 채우기 =====
// 큐레이션 표제어의 격변화 셀 중 무작위 N개를 가리고 입력 → 채점.
// 학습 가치: 수동적 표 읽기 → 능동적 회상 (active recall, testing effect).
// 채점 규칙:
//   · NFD 정규화 후 다이아크리틱 무시 (휴머니티 — acute/grave 자체 학습은 Τόνος 모드 별도)
//   · ς/σ 동일 처리 (Greek typography quirk)
//   · 액센트가 일치하면 정답에 별도 마킹 (★) — 액센트까지 맞춰서 학습한 학습자 인정
// sg.nom 은 표제어 hint 로 유지 (가리지 않음). 명사는 voc 도 자주 = nom 이라 제외.

function _paradigmQuizNormalize(s){
  if(!s) return '';
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ').toLowerCase().trim();
}

// 셀 좌표 인벤토리 — { num:'sg'|'pl', case:'nom'|..., gender:undefined|'m'|'f'|'n', expected:string }
function _paradigmQuizCells(entry){
  const cases = ['nom','gen','dat','acc','voc'];
  const cells = [];
  const is3G = _paradigmIsThreeGender(entry);
  for(const num of ['sg','pl']){
    if(!entry[num]) continue;
    for(const c of cases){
      const v = entry[num][c];
      if(v == null) continue;
      if(is3G){
        if(typeof v !== 'object') continue;
        for(const g of ['m','f','n']){
          if(v[g]) cells.push({num, case:c, gender:g, expected:v[g]});
        }
      } else {
        if(typeof v === 'string' && v) cells.push({num, case:c, gender:undefined, expected:v});
      }
    }
  }
  return cells;
}

// 가릴 셀 후보 — sg.nom 제외 (모든 성에서), 명사면 voc 도 제외
function _paradigmQuizCandidates(cells, entry){
  return cells.filter(cell => {
    if(cell.num === 'sg' && cell.case === 'nom') return false;
    if(entry.pos === 'noun' && cell.case === 'voc') return false;
    return true;
  });
}

// 무작위 N개 선택. 표 크기가 작으면 50%.
function _paradigmQuizPickBlanks(candidates){
  const target = Math.max(3, Math.min(7, Math.ceil(candidates.length * 0.4)));
  const shuffled = candidates.slice();
  for(let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, Math.min(target, shuffled.length));
}

// 빈칸 셀이 무엇인지 체크. 좌표 일치.
function _isBlank(blanks, num, c, gender){
  return blanks.some(b => b.num === num && b.case === c && b.gender === gender);
}

// 빈칸 input 의 id — 좌표로 안정적 식별.
function _quizInputId(num, c, gender){
  return 'pq-' + num + '-' + c + (gender ? '-' + gender : '');
}

// quiz 표 (flat) — 빈칸은 input, 그 외는 정답 노출
function _renderQuizFlat(key, entry, blanks){
  const cases = ['nom','gen','dat','acc','voc'];
  const labels = {nom:'주격', gen:'속격', dat:'여격', acc:'대격', voc:'호격'};
  let html = '<table class="paradigm"><caption>' + _esc(key) +
    ' <span style="font-size:11px;color:var(--clay-d);font-weight:400;font-style:normal">— ' +
    _esc(_paradigmMeta(entry)) + ' · 시험</span></caption>';
  html += '<thead><tr><th></th><th>단수</th><th>복수</th></tr></thead><tbody>';
  for(const c of cases){
    const s = entry.sg && entry.sg[c];
    const p = entry.pl && entry.pl[c];
    if(!s && !p) continue;
    html += '<tr><td class="lbl">' + labels[c] + '</td>';
    for(const [num, val] of [['sg', s], ['pl', p]]){
      if(!val){ html += '<td class="grk">—</td>'; continue; }
      if(_isBlank(blanks, num, c, undefined)){
        const id = _quizInputId(num, c, undefined);
        html += '<td><input type="text" id="' + id +
          '" class="pq-blank" data-num="' + num + '" data-case="' + c +
          '" style="width:100%;font-family:var(--font-grk);font-size:15px;padding:4px 6px;border:1px dashed var(--terracotta);border-radius:4px;background:var(--ivory-w);box-sizing:border-box"></td>';
      } else {
        html += '<td class="grk">' + _esc(val) + '</td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

// quiz 표 (3-gender) — 단·복 각 표, 셀이 m/f/n 분리
function _renderQuizThreeGender(key, entry, blanks){
  const cases = ['nom','gen','dat','acc','voc'];
  const labels = {nom:'주격', gen:'속격', dat:'여격', acc:'대격', voc:'호격'};
  let html = '';
  for(const num of ['sg','pl']){
    if(!entry[num]) continue;
    const numLbl = num === 'sg' ? '단수' : '복수';
    html += '<table class="paradigm" style="margin-bottom:10px"><caption>' + _esc(key) + ' — ' + numLbl +
      ' <span style="font-size:11px;color:var(--clay-d);font-weight:400;font-style:normal">' +
      _esc(_paradigmMeta(entry)) + ' · 시험</span></caption>';
    html += '<thead><tr><th></th><th>m</th><th>f</th><th>n</th></tr></thead><tbody>';
    for(const c of cases){
      const row = entry[num][c];
      if(!row || typeof row !== 'object') continue;
      const cells = ['m','f','n'].map(g => row[g] || '');
      if(!cells.some(x => x)) continue;
      html += '<tr><td class="lbl">' + labels[c] + '</td>';
      for(const g of ['m','f','n']){
        const val = row[g];
        if(!val){ html += '<td class="grk">—</td>'; continue; }
        if(_isBlank(blanks, num, c, g)){
          const id = _quizInputId(num, c, g);
          html += '<td><input type="text" id="' + id +
            '" class="pq-blank" data-num="' + num + '" data-case="' + c + '" data-gender="' + g +
            '" style="width:100%;font-family:var(--font-grk);font-size:14px;padding:4px 5px;border:1px dashed var(--terracotta);border-radius:4px;background:var(--ivory-w);box-sizing:border-box"></td>';
        } else {
          html += '<td class="grk">' + _esc(val) + '</td>';
        }
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
  }
  return html;
}

function _renderQuizTable(key, entry, blanks){
  if(_paradigmIsThreeGender(entry)) return _renderQuizThreeGender(key, entry, blanks);
  return _renderQuizFlat(key, entry, blanks);
}

// quiz 한 라운드 — key 지정 시 그 lemma, 미지정 시 무작위 (PARADIGM_LIB 에서)
function startParadigmQuiz(key){
  if(typeof PARADIGM_LIB === 'undefined') return;
  const result = document.getElementById('paradigm-result');
  if(!result) return;

  // key 없으면 무작위 — 명사·형용사·대명사 중 cell 수 충분한 것
  if(!key || !PARADIGM_LIB[key]){
    const candidates = [];
    for(const k in PARADIGM_LIB){
      const e = PARADIGM_LIB[k];
      const cands = _paradigmQuizCandidates(_paradigmQuizCells(e), e);
      if(cands.length >= 4) candidates.push(k);
    }
    if(!candidates.length) return;
    key = candidates[Math.floor(Math.random() * candidates.length)];
  }
  const entry = PARADIGM_LIB[key];
  const cells = _paradigmQuizCells(entry);
  const cands = _paradigmQuizCandidates(cells, entry);
  const blanks = _paradigmQuizPickBlanks(cands);

  let html = '<div class="card" style="border-left:3px solid var(--terracotta)">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">' +
    '<div style="font-size:12px;color:var(--clay-d)">🎯 시험 모드 · 빈칸 ' + blanks.length + '개 · 정답 입력 후 채점</div>' +
    '<div style="display:flex;gap:6px">' +
    '<button class="btn btn-sm btn-o" id="pq-back">← 학습 모드</button>' +
    '<button class="btn btn-sm" id="pq-grade">채점</button>' +
    '</div></div>';
  html += _renderQuizTable(key, entry, blanks);
  html += '<div id="pq-result-summary" style="margin-top:8px;font-size:13px"></div>';
  html += '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">' +
    '<button class="btn btn-sm" id="pq-retry">🎲 다른 빈칸 (같은 표제어)</button>' +
    '<button class="btn btn-sm btn-o" id="pq-random">🎲 무작위 표제어</button>' +
    '<button class="btn btn-sm btn-o" id="pq-reveal">정답 보기</button>' +
    '</div>';
  html += '</div>';
  result.innerHTML = html;

  // 첫 빈칸 포커스
  const firstInput = result.querySelector('input.pq-blank');
  if(firstInput) firstInput.focus();

  // Enter 키로 빈칸 간 이동, 마지막 빈칸에서 채점
  const inputs = Array.from(result.querySelectorAll('input.pq-blank'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(i < inputs.length - 1) inputs[i+1].focus();
        else grade();
      }
    });
  });

  function grade(){
    let correctExact = 0, correctIgnoreDiac = 0, total = blanks.length;
    const summary = [];
    for(const b of blanks){
      const id = _quizInputId(b.num, b.case, b.gender);
      const inp = document.getElementById(id);
      if(!inp) continue;
      const userRaw = inp.value.trim();
      const userNorm = _paradigmQuizNormalize(userRaw);
      const expNorm = _paradigmQuizNormalize(b.expected);
      // td 부모에 결과 마킹
      const td = inp.parentElement;
      if(userNorm && userNorm === expNorm){
        // 다이아크리틱까지 일치하는지
        const exactMatch = userRaw === b.expected || userRaw.normalize('NFC') === b.expected.normalize('NFC');
        if(exactMatch){
          correctExact++;
          td.innerHTML = '<span class="grk" style="color:#2d5016;font-weight:600">' + _esc(b.expected) + ' ★</span>';
        } else {
          correctIgnoreDiac++;
          td.innerHTML = '<span class="grk" style="color:#2d5016">' + _esc(b.expected) +
            ' <span style="font-size:10px;color:var(--clay-d)">(액센트 ≠)</span></span>';
        }
      } else {
        const userDisp = userRaw ? '<span style="text-decoration:line-through;color:var(--clay-d)">' + _esc(userRaw) + '</span> ' : '';
        td.innerHTML = '<span class="grk" style="color:#7a1a1a">' + userDisp + _esc(b.expected) + '</span>';
      }
    }
    const correct = correctExact + correctIgnoreDiac;
    const pct = Math.round(100 * correct / total);
    const sum = document.getElementById('pq-result-summary');
    if(sum){
      let msg = '<b>채점</b>: ' + correct + ' / ' + total + ' (' + pct + '%)';
      if(correctExact > 0) msg += ' · ★ 액센트까지 정확 ' + correctExact;
      if(correctIgnoreDiac > 0) msg += ' · 액센트 무시하면 정답 ' + correctIgnoreDiac;
      const wrong = total - correct;
      if(wrong > 0) msg += ' · 오답 ' + wrong;
      sum.innerHTML = '<div style="padding:8px;background:var(--ivory-d);border-radius:6px">' + msg + '</div>';
    }
    // grade 버튼 비활성화
    const gradeBtn = document.getElementById('pq-grade');
    if(gradeBtn){ gradeBtn.disabled = true; gradeBtn.style.opacity = 0.5; }
  }

  function reveal(){
    for(const b of blanks){
      const id = _quizInputId(b.num, b.case, b.gender);
      const inp = document.getElementById(id);
      if(!inp) continue;
      const td = inp.parentElement;
      td.innerHTML = '<span class="grk" style="color:var(--terracotta-d)">' + _esc(b.expected) + '</span>';
    }
    const sum = document.getElementById('pq-result-summary');
    if(sum) sum.innerHTML = '<div style="padding:8px;background:var(--ivory-d);border-radius:6px;font-size:12px;color:var(--clay-d)">정답 노출 — 다음 라운드를 시도하세요</div>';
    const gradeBtn = document.getElementById('pq-grade');
    if(gradeBtn){ gradeBtn.disabled = true; gradeBtn.style.opacity = 0.5; }
  }

  document.getElementById('pq-grade').addEventListener('click', grade);
  document.getElementById('pq-reveal').addEventListener('click', reveal);
  document.getElementById('pq-retry').addEventListener('click', () => startParadigmQuiz(key));
  document.getElementById('pq-random').addEventListener('click', () => startParadigmQuiz(null));
  document.getElementById('pq-back').addEventListener('click', () => {
    // 학습 모드로 돌아가기 — doLookup 트리거를 위해 input 재설정 후 renderParadigmBuilder 재진입
    _paradigmQuery = key;
    renderParadigmBuilder();
  });
}

// ===== Cloze deletion (빈칸 채우기) =====
// 실제 본문(WORKS)에서 임의 구절 추출 → 한 단어 빈칸 → 같은 구절 + 길이 비슷 단어로 4지선다.
function _cleanGrkWord(w){
  if(!w) return '';
  return w.replace(/^[^\u0370-\u03FF\u1F00-\u1FFF]+|[^\u0370-\u03FF\u1F00-\u1FFF]+$/g, '');
}
function pickClozeQuestion(){
  if(typeof WORKS === 'undefined' || !WORKS.length) return null;
  for(let attempt = 0; attempt < 50; attempt++){
    const wk = WORKS[Math.floor(Math.random() * WORKS.length)];
    if(!wk.sections || !wk.sections.length) continue;
    const sec = wk.sections[Math.floor(Math.random() * wk.sections.length)];
    if(!sec.text) continue;
    // 구절 분할: 줄바꿈 + 그리스 구두점(· ;) + 라틴 구두점(. !)
    const clauses = sec.text.split(/\n|[\.;·!]+/)
      .map(c => c.replace(/^\s*\d+\s*/, '').trim())   // verse 번호 제거
      .filter(c => c.length >= 14);
    if(!clauses.length) continue;
    const clause = clauses[Math.floor(Math.random() * clauses.length)];
    const tokens = clause.split(/\s+/).filter(w => /[\u0370-\u03FF\u1F00-\u1FFF]/.test(w));
    if(tokens.length < 5 || tokens.length > 18) continue;
    const cands = [];
    for(let i = 0; i < tokens.length; i++){
      const c = _cleanGrkWord(tokens[i]);
      if(c.length >= 4) cands.push({i, clean: c});
    }
    if(!cands.length) continue;
    const pick = cands[Math.floor(Math.random() * cands.length)];
    return {
      workTitle: wk.title || wk.id,
      sectionLabel: sec.label || sec.n || '',
      tokens, blankIdx: pick.i, blankWord: pick.clean
    };
  }
  return null;
}
function buildClozeDistractors(blank, tokens, corpus){
  const blankBase = _stripDiacritics(blank);
  let cands = tokens
    .map(_cleanGrkWord)
    .filter(w => w && w !== blank && w.length >= 3);
  if(cands.length < 6 && corpus){
    const more = corpus.filter(w => w !== blank
      && Math.abs(w.length - blank.length) <= 2
      && !cands.includes(w));
    more.sort(()=>Math.random()-.5);
    for(const m of more.slice(0, 14)) cands.push(m);
  }
  const scored = cands.map(w => ({w, d: _levenshtein(_stripDiacritics(w), blankBase)}));
  const med = scored.filter(s => s.d >= 1 && s.d <= 6);
  const pool = med.length >= 3 ? med : scored;
  return pool.sort(()=>Math.random()-.5).slice(0, 3).map(s => s.w);
}
function renderCloze(){
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="setTab('read')">← 원문 목록</button>
    <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Ἔλλειψις</span>빈칸 채우기 (Cloze)</h2>
    <div class="view-sub">전집 13편 본문에서 임의 추출 · 한 구절 한 단어 빈칸</div>

    <div class="card">
      <div style="font-size:13px;line-height:1.7;color:var(--black-glaze-l)">
        실제 본문(Perseus DL)에서 임의 구절을 뽑고, 그 안의 한 단어를 빈칸으로 둡니다.
        같은 구절 안의 다른 단어와 시각적으로 비슷한 형태가 오답으로 제시됩니다.
        문맥·문법 일치를 종합해 정답을 고르세요.
      </div>
    </div>

    <div class="card">
      <div style="font-family:var(--font-display);font-size:16px;color:var(--terracotta-d);font-weight:600;margin-bottom:8px">시작</div>
      <div style="font-size:12px;color:var(--clay-d);margin-bottom:10px">10문제 · 점수×3 XP 적립 (난이도 보정)</div>
      <div id="cloze-quiz">
        <button class="btn" onclick="startCloze()">시작 →</button>
      </div>
    </div>
  `;
}
function startCloze(){
  const corpus = (typeof getAccentCorpus === 'function') ? getAccentCorpus() : [];
  const questions = [];
  let tried = 0;
  while(questions.length < 10 && tried < 120){
    tried++;
    const q = pickClozeQuestion();
    if(!q) continue;
    const distractors = buildClozeDistractors(q.blankWord, q.tokens, corpus);
    if(distractors.length < 3) continue;
    const options = [q.blankWord, ...distractors].sort(()=>Math.random()-.5);
    questions.push({...q, options});
  }
  if(questions.length < 3){
    document.getElementById('cloze-quiz').innerHTML =
      '<div style="color:var(--clay-d);font-size:13px">출제 가능한 구절이 부족합니다.</div>';
    return;
  }
  renderClozeQuiz(questions, 0, 0);
}
function renderClozeQuiz(questions, idx, score){
  const host = document.getElementById('cloze-quiz');
  if(!host) return;
  const Q = questions[idx];
  if(!Q){
    const total = questions.length;
    const pct = Math.round(100 * score / total);
    host.innerHTML = `
      <div style="text-align:center;padding:14px 0">
        <div style="font-family:var(--font-display);font-size:28px;color:var(--terracotta-d);font-weight:600">${score}/${total}</div>
        <div style="font-size:13px;color:var(--clay-d);margin-top:4px">정답률 ${pct}%</div>
        <button class="btn" style="margin-top:14px" onclick="startCloze()">다시 →</button>
      </div>`;
    if(typeof S !== 'undefined' && typeof saveState === 'function'){
      S.xp = (S.xp || 0) + score * 3;
      saveState();
    }
    return;
  }
  const display = Q.tokens.map((tok, i) => {
    if(i === Q.blankIdx){
      return '<span style="background:var(--terracotta-d);color:#fff;padding:1px 14px;border-radius:4px;letter-spacing:.1em">_____</span>';
    }
    return tok;
  }).join(' ');
  host.innerHTML = `
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:8px">문제 ${idx+1}/${questions.length} · 점수 ${score}</div>
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:4px">${Q.workTitle} · ${Q.sectionLabel}</div>
    <div style="font-family:var(--font-grk);font-size:17px;line-height:1.9;color:var(--black-glaze);padding:14px 4px;text-align:center">${display}</div>
    <div style="font-size:12px;color:var(--clay-d);text-align:center;margin-bottom:12px">빈칸에 들어갈 단어는?</div>
    ${Q.options.map(o => `
      <button class="btn btn-o" style="display:block;width:100%;margin:6px 0;text-align:center;font-family:var(--font-grk);font-size:18px;letter-spacing:.05em" data-w="${o}">${o}</button>
    `).join('')}
  `;
  host.querySelectorAll('[data-w]').forEach(btn => {
    btn.addEventListener('click', () => {
      const correct = btn.dataset.w === Q.blankWord;
      host.querySelectorAll('[data-w]').forEach(b => {
        b.disabled = true;
        if(b.dataset.w === Q.blankWord){
          b.style.background = 'var(--terracotta)';
          b.style.color = '#fff';
          b.style.borderColor = 'var(--terracotta-d)';
        } else if(b === btn){
          b.style.opacity = '0.45';
        }
      });
      setTimeout(() => renderClozeQuiz(questions, idx + 1, score + (correct ? 1 : 0)), 950);
    });
  });
}

function renderScenario(scenarioId){
  const sc = CONVERSATIONS.find(c => c.id === scenarioId);
  if(!sc) return;
  if(!S.convRead) S.convRead = {};
  if(!S.convRead[scenarioId]) S.convRead[scenarioId] = [];
  view.innerHTML = `
    <button class="btn btn-sm btn-o" data-render="renderConversation">← 시나리오 목록</button>
    <h2 class="view-title fade-in" style="margin-top:10px">${sc.title}</h2>
    <div class="view-sub">${sc.desc} · ${sc.items.length}개 표현</div>

    ${sc.items.map((it, i) => {
      const isRead = S.convRead[scenarioId].includes(i);
      return `
        <div class="card" style="border-left:3px solid ${isRead?'var(--terracotta)':'var(--clay)'}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
            <div style="flex:1;min-width:0">
              <div style="font-family:var(--font-grk);font-size:24px;color:var(--terracotta-d);font-weight:600;line-height:1.3;letter-spacing:.02em">${it.grk}</div>
              <div style="font-size:14px;color:var(--black-glaze);font-weight:500;margin-top:4px">${it.ko}</div>
              ${it.note ? `<div style="font-size:11.5px;color:var(--black-glaze-l);margin-top:6px;line-height:1.5">📐 ${it.note}</div>` : ''}
              ${it.src  ? `<div style="font-size:10.5px;color:var(--clay-d);margin-top:4px;font-style:italic">📜 ${it.src}</div>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-self:center">
              <button class="btn btn-sm btn-o" data-speak-conv="${encodeURIComponent(it.grk)}" title="발음 듣기" aria-label="발음 듣기" style="min-width:54px;padding:4px 8px;font-size:13px">🔊</button>
              <button class="btn btn-sm ${isRead?'btn-g':'btn-o'}" data-i="${i}" style="min-width:54px">${isRead?'✓':'학습'}</button>
            </div>
          </div>
        </div>`;
    }).join('')}
  `;
  view.querySelectorAll('[data-i]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      const arr = S.convRead[scenarioId];
      const idx = arr.indexOf(i);
      if(idx >= 0){
        arr.splice(idx, 1);
      } else {
        arr.push(i);
        if(typeof S !== 'undefined') S.xp = (S.xp || 0) + 1;
      }
      saveState();
      renderScenario(scenarioId);
    });
  });
  view.querySelectorAll('[data-speak-conv]').forEach(btn => {
    btn.addEventListener('click', () => {
      try { if(typeof stopSpeech === 'function') stopSpeech(); } catch(_){}
      const t = decodeURIComponent(btn.dataset.speakConv || '');
      if(t && typeof speakGreek === 'function') speakGreek(t);
    });
  });
}

// ===== 받아쓰기 모드 (Ἀκοή · Dictation, v44) =====
// TTS 가 그리스어 단어/구를 발음 → 사용자가 그리스어 텍스트 입력 → 매칭.
// 매칭은 (a) Unicode NFD 후 결합 표지(다이아크리틱) 제거 (b) 소문자 (c) 공백 정규화.
// → 학습자가 polytonic/monotonic 어느 쪽으로 입력해도 통과. 대소문자·시그마 위치 무관.
// 풀: ALL_VOCAB 중 어휘 길이 4-15 사이 (단음절은 발음 식별 어려움, 너무 긴 것은 부담).
let _dictSession = null;

function _normalizeForDictation(s){
  if(!s) return '';
  return s.normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')   // 결합 표지 (악센트·기식부호) 제거
          .replace(/ς/g, 'σ')                 // 어말 시그마 통일
          .replace(/[,;.·"'᾽’‘()\[\]…—–\-?!]/g, '')
          .replace(/\s+/g, ' ')
          .trim()
          .toLowerCase();
}

function renderDictation(){
  // 풀 구성: 너무 짧거나 너무 긴 어형 제외, 발음 표제어가 단순한 것 위주
  const pool = (typeof ALL_VOCAB !== 'undefined' ? ALL_VOCAB : []).filter(w => {
    if(!w || !w.g) return false;
    const stripped = w.g.replace(/\s+/g, '');
    return stripped.length >= 4 && stripped.length <= 15;
  });
  if(pool.length < 10){
    view.innerHTML = `
      <button class="btn btn-sm btn-o" onclick="setTab('vocab')">← 어휘</button>
      <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Ἀκοή</span>받아쓰기</h2>
      <div class="card warm">어휘 풀이 너무 작습니다.</div>`;
    return;
  }
  if(!_dictSession){
    _dictSession = { qIdx:0, total:10, right:0, wrong:0, history:[], pool };
  }
  _renderDictationQuestion();
}

function _renderDictationQuestion(){
  const s = _dictSession;
  if(!s) return renderDictation();
  if(s.qIdx >= s.total){ _finishDictation(); return; }
  const q = s.pool[Math.floor(Math.random() * s.pool.length)];
  s.q = q;
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="_endDictation()">← 어휘</button>
    <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Ἀκοή</span>받아쓰기</h2>
    <div class="view-sub">${s.qIdx+1} / ${s.total} · 정답률 ${s.qIdx>0?Math.round(s.right*100/s.qIdx)+'%':'—'}</div>

    <div class="card" style="text-align:center;padding:24px 16px">
      <div style="font-size:11px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:14px">소리를 듣고 그리스어로 입력</div>

      <button class="btn" id="dict-play" style="font-size:24px;padding:12px 28px;min-width:120px">🔊 듣기</button>

      <div style="font-size:11px;color:var(--clay-d);margin-top:10px;line-height:1.5;font-style:italic">
        ${q.ko ? `힌트: <b>${q.ko}</b>` : ''}${q.pos ? ` · ${POS_LABELS[q.pos]||q.pos}` : ''}
      </div>
    </div>

    <div class="card">
      <input class="input grk" id="dict-input" autocomplete="off" autocapitalize="none" spellcheck="false"
             aria-label="듣고 입력 (polytonic 없이도 OK)" placeholder="듣고 입력 (polytonic 없이도 OK)" style="font-size:18px;text-align:center">
      <div class="btn-row" style="margin-top:10px;justify-content:center">
        <button class="btn" id="dict-submit">제출</button>
        <button class="btn btn-o btn-sm" id="dict-skip">모르겠다</button>
      </div>
      <div id="dict-fb" style="margin-top:10px"></div>
    </div>

    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-o btn-sm" id="dict-replay" style="flex:1">🔁 다시 듣기</button>
      <button class="btn btn-o btn-sm" id="dict-slow"   style="flex:1">🐢 느리게</button>
    </div>
  `;

  const playOnce = (rate) => {
    try { if(typeof stopSpeech === 'function') stopSpeech(); } catch(_){}
    // speakGreek 의 rate 옵션 활용 가능하면 사용; 아니면 기본
    if(typeof speakGreek === 'function'){
      // speakGreek 시그니처에 옵션이 있는지 사전 점검
      try { speakGreek(q.g, rate ? {rate} : undefined); }
      catch(_){ speakGreek(q.g); }
    }
  };
  document.getElementById('dict-play').addEventListener('click', () => playOnce());
  document.getElementById('dict-replay').addEventListener('click', () => playOnce());
  document.getElementById('dict-slow').addEventListener('click', () => playOnce(0.65));
  document.getElementById('dict-submit').addEventListener('click', () => _gradeDictation(false));
  document.getElementById('dict-skip').addEventListener('click', () => _gradeDictation(true));

  const inp = document.getElementById('dict-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') _gradeDictation(false); });

  // 자동 1회 재생 — 사용자 인터랙션 없이 안 들릴 수 있으므로 클릭 후 사용
  // 첫 진입에서는 명시적 버튼 클릭 유도
}

function _gradeDictation(giveUp){
  const s = _dictSession;
  if(!s || !s.q) return;
  const q = s.q;
  const fb = document.getElementById('dict-fb');
  const inp = document.getElementById('dict-input');
  const user = giveUp ? '' : (inp.value || '');
  const target = q.g;
  const ok = !giveUp && _normalizeForDictation(user) === _normalizeForDictation(target);

  if(ok){
    s.right += 1;
    fb.innerHTML = `<div class="feedback ok">✓ 정답 — <span class="grk">${target}</span> = ${q.ko}</div>`;
    if(typeof addXP === 'function') addXP(8, '받아쓰기 정답');
    if(typeof S !== 'undefined') S.vocabCorrectCount = (S.vocabCorrectCount || 0) + 1;
  } else {
    s.wrong += 1;
    const showInput = user ? ` (당신: <span class="grk">${user}</span>)` : '';
    fb.innerHTML = `<div class="feedback bad">✗ ${giveUp?'정답':'오답'} — <span class="grk">${target}</span> = ${q.ko}${showInput}</div>`;
    if(typeof bumpWrongRoom === 'function') bumpWrongRoom(q.g, -1, q);
  }
  s.history.push({q, user, ok, giveUp});

  // 입력·버튼 비활성화
  document.getElementById('dict-submit').disabled = true;
  document.getElementById('dict-skip').disabled   = true;
  inp.disabled = true;

  setTimeout(() => {
    s.qIdx += 1;
    _renderDictationQuestion();
  }, ok ? 1100 : 1900);
}

function _finishDictation(){
  const s = _dictSession;
  const total = s.right + s.wrong;
  const pct = total>0 ? Math.round(s.right*100/total) : 0;
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="setTab('vocab')">← 어휘</button>
    <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Ἀκοή</span>받아쓰기 결과</h2>
    <div class="card warm">

// ===== 악센트 위치 학습 (Τόνος · Accent Locator, v47) =====
// 폴리토닉 그리스어 어형의 *악센트 위치 + 종류* 를 식별하는 학습 모드.
// 학습 가치: 그리스어 운율의 핵심은 악센트 — 음절 길이·강세·악센트 종류가 발음과 의미를 결정.
//
// 주의: 본 함수 이름은 v48 에서 renderAccentLocator 로 변경됨 —
// 이전 v32 시절의 옥시톤·파록시톤 분류 quiz (renderAccentQuiz, 5365줄) 와 *공존*.
// 두 quiz 는 학습 목표가 다름:
//   · 옛 (renderAccentQuiz): 옥시톤·파록시톤·프로파록시톤·페리스포메논·프로페리스포메논 5분류
//   · 새 (renderAccentLocator): 위치 (ultima/penult/antepenult) + 종류 (acute/circumflex/grave) 분리 학습
//
// 분류 체계:
//   · 위치: ultima (1, 마지막 음절) · penult (2, 끝에서 2번째) · antepenult (3, 끝에서 3번째)
//   · 종류: acute (´) · circumflex (῀) · grave (`)
//   · 음절 수: 1·2·3·4+
//
// 음절 식별 알고리즘:
//   (a) 단어를 NFD 정규화 → base char + diacritics 분리
//   (b) 모음을 차례로 스캔, 인접한 모음 쌍이 *true diphthong* 이면 한 음절
//   (c) 두 번째 모음에 diaeresis (U+0308) 있으면 hiatus → 별개 음절
//   (d) diphthong 의 어느 글자에 든 acute/circumflex/grave 가 그 음절의 강세
//
// 테스트 19개 단어로 100% 정확도 검증 (개발 시).

const DIPHTHONGS = new Set(['αι','ει','οι','υι','αυ','ευ','ηυ','ου','ωυ']);

function _classifyAccent(word){
  if(!word) return null;
  const nfd = word.normalize('NFD');
  const units = [];
  for(const c of nfd){
    if(/[\u0300-\u036f]/.test(c)){
      if(units.length) units[units.length-1].marks.push(c);
    } else {
      units.push({base:c, marks:[]});
    }
  }
  const VOWEL_RE = /[αεηιουωΑΕΗΙΟΥΩ]/;
  const syllables = [];
  let i = 0;
  while(i < units.length){
    const u = units[i];
    if(VOWEL_RE.test(u.base)){
      const base1 = u.base.toLowerCase();
      let isDip = false;
      if(i+1 < units.length && VOWEL_RE.test(units[i+1].base)){
        const pair = base1 + units[i+1].base.toLowerCase();
        if(DIPHTHONGS.has(pair)){
          if(!units[i+1].marks.includes('\u0308')) isDip = true;
        }
      }
      if(u.marks.includes('\u0308')) isDip = false;
      if(isDip){
        const allMarks = [...u.marks, ...units[i+1].marks];
        let acc = null;
        if(allMarks.includes('\u0301')) acc = 'acute';
        else if(allMarks.includes('\u0342')) acc = 'circumflex';
        else if(allMarks.includes('\u0300')) acc = 'grave';
        syllables.push({accent:acc});
        i += 2;
      } else {
        let acc = null;
        if(u.marks.includes('\u0301')) acc = 'acute';
        else if(u.marks.includes('\u0342')) acc = 'circumflex';
        else if(u.marks.includes('\u0300')) acc = 'grave';
        syllables.push({accent:acc});
        i += 1;
      }
    } else {
      i += 1;
    }
  }
  const nSyllables = syllables.length;
  let accentPos = null, accentType = null;
  for(let j = 0; j < nSyllables; j++){
    if(syllables[j].accent){
      accentPos = nSyllables - j;
      accentType = syllables[j].accent;
      break;
    }
  }
  return {nSyllables, accentPos, accentType};
}

const ACCENT_POS_NAMES = {
  1: {ko:'마지막 음절 (ultima)',      en:'oxytone/perispomenon zone'},
  2: {ko:'끝에서 2번째 음절 (penult)', en:'paroxytone/properispomenon zone'},
  3: {ko:'끝에서 3번째 음절 (antepenult)', en:'proparoxytone zone'},
};
const ACCENT_TYPE_NAMES = {
  acute:      {ko:'예음 (´)',  symbol:'΄', en:'acute'},
  circumflex: {ko:'곡절 (῀)',  symbol:'῀', en:'circumflex'},
  grave:      {ko:'억음 (`)',  symbol:'`', en:'grave'},
};

let _accentSession = null;

function renderAccentLocator(){
  // 풀 구성: ALL_VOCAB 중 2-3 음절 단어가 학습 가치 높음 (1 음절은 위치 식별 의미 없음)
  // antepenult 강세 (proparoxytone) 는 흔치 않으므로 별도 카운트
  const pool = (typeof ALL_VOCAB !== 'undefined' ? ALL_VOCAB : [])
    .filter(w => w && w.g)
    .map(w => {
      const cls = _classifyAccent(w.g);
      return {...w, _accent: cls};
    })
    .filter(w => w._accent && w._accent.nSyllables >= 2 && w._accent.nSyllables <= 4 && w._accent.accentPos && w._accent.accentType);

  if(pool.length < 8){
    view.innerHTML = `
      <button class="btn btn-sm btn-o" onclick="setTab('vocab')">← 어휘</button>
      <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Τόνος</span>악센트 위치</h2>
      <div class="card warm">학습 가능한 어휘 풀이 부족합니다.</div>`;
    return;
  }
  if(!_accentSession){
    _accentSession = { qIdx:0, total:10, right:0, wrong:0, history:[], pool };
  }
  _renderAccentQuestion();
}

function _renderAccentQuestion(){
  const s = _accentSession;
  if(!s) return renderAccentLocator();
  if(s.qIdx >= s.total){ _finishAccentQuiz(); return; }

  // 다양한 위치·종류가 나오도록 가중치 — antepenult 와 circumflex 를 약간 우대
  const weighted = s.pool.flatMap(w => {
    const weight = (w._accent.accentPos === 3 ? 3 : 1) + (w._accent.accentType === 'circumflex' ? 2 : 0);
    return Array(weight).fill(w);
  });
  const q = weighted[Math.floor(Math.random() * weighted.length)];
  s.q = q;

  // 모드 선택: 두 질문 유형을 번갈아 — (a) 위치 식별 (b) 종류 식별
  const mode = (s.qIdx % 2 === 0) ? 'position' : 'type';
  s.mode = mode;

  // 단어를 *악센트 없이* 표시하기 위해 모든 강세 표지 제거
  const stripped = q.g.normalize('NFD').replace(/[\u0301\u0342\u0300]/g, '').normalize('NFC');

  let questionHTML, optionsHTML;
  if(mode === 'position'){
    questionHTML = `<div style="font-size:13px;color:var(--clay-d);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px">이 단어의 강세 위치는?</div>`;
    const possiblePositions = q._accent.nSyllables >= 3 ? [1, 2, 3] : [1, 2];
    optionsHTML = possiblePositions.map(p => `
      <button class="opt accent-opt" data-pos="${p}" style="width:100%;text-align:left">

  } else {

  view.innerHTML = `

    <div class="view-sub">${s.qIdx+1} / ${s.total} · 정답률 ${s.qIdx>0?Math.round(s.right*100/s.qIdx)+'%':'—'}</div>

    <div class="card" style="text-align:center;padding:24px 16px">
      ${questionHTML}
      <div class="grk" style="font-size:36px;color:var(--terracotta-d);font-weight:600;margin:6px 0 4px">${stripped}</div>
      <div style="font-size:12px;color:var(--clay-d);font-style:italic">${q.ko || ''} · ${q._accent.nSyllables}음절</div>
      <button class="btn btn-sm btn-o" id="acc-speak" style="margin-top:10px;padding:4px 12px;font-size:13px">🔊 듣기</button>
    </div>

    <div class="card">
      <div style="display:flex;flex-direction:column;gap:8px">
        ${optionsHTML}
      </div>
      <div id="acc-fb" style="margin-top:12px"></div>
    </div>
  `;

  // 발음 듣기
  const sp = document.getElementById('acc-speak');
  if(sp) sp.addEventListener('click', () => {
    try { if(typeof stopSpeech === 'function') stopSpeech(); } catch(_){}
    if(typeof speakGreek === 'function') speakGreek(q.g);
  });

  // 옵션 클릭
  view.querySelectorAll('.accent-opt').forEach(b => b.addEventListener('click', () => {
    const ans = mode === 'position' ? parseInt(b.dataset.pos, 10) : b.dataset.type;
    _gradeAccent(ans, b);
  }));
}

function _gradeAccent(answer, btn){
  const s = _accentSession;
  if(!s || !s.q) return;
  const q = s.q;
  const correct = (s.mode === 'position')
    ? (answer === q._accent.accentPos)
    : (answer === q._accent.accentType);

  const fb = document.getElementById('acc-fb');
  view.querySelectorAll('.accent-opt').forEach(o => {
    o.disabled = true;
    const isCorrect = (s.mode === 'position')
      ? (parseInt(o.dataset.pos, 10) === q._accent.accentPos)
      : (o.dataset.type === q._accent.accentType);
    if(isCorrect) o.classList.add('right');
    else if(o === btn && !correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });

  if(correct){
    s.right += 1;
    if(typeof addXP === 'function') addXP(6, '악센트 정답');
    fb.innerHTML = `<div class="feedback ok">✓ 정답 — <span class="grk">${q.g}</span> · ${ACCENT_POS_NAMES[q._accent.accentPos].ko} · ${ACCENT_TYPE_NAMES[q._accent.accentType].ko}</div>`;
  } else {
    s.wrong += 1;
    const corrLabel = s.mode === 'position'
      ? ACCENT_POS_NAMES[q._accent.accentPos].ko
      : ACCENT_TYPE_NAMES[q._accent.accentType].ko;
    fb.innerHTML = `<div class="feedback bad">✗ 오답 — 정답: <b>${corrLabel}</b> · 단어 <span class="grk">${q.g}</span></div>`;
    if(typeof bumpWrongRoom === 'function') bumpWrongRoom(q.g, -1, q);
  }
  s.history.push({q, mode:s.mode, answer, correct});
  setTimeout(() => {
    s.qIdx += 1;
    _renderAccentQuestion();
  }, correct ? 1100 : 1900);
}

function _finishAccentQuiz(){

// ===== 검색·콘코던스 (Εὕρεσις · Search, v45) =====
// 본 PWA 의 본문 (WORKS · 545 섹션 · ~266K 토큰) 에 대한 전체 텍스트 검색.
// MORPH_LOOKUP (AGDT v2.1) 의 형태분석을 활용한 lemma 기반 검색 지원.
//
// 아키텍처:
//   _searchIdx = {
//     occ: Map<form, Array<[workIdx, secIdx]>>   // form 별 등장 위치
//     lemmaForms: Map<lemma, Set<form>>          // lemma → 어형 변이
//   }
//
// 구축 비용: ~266K 토큰 순회 + Map 쓰기. node 측정 ~1-2 초. 인메모리 ~10 MB 추정.
// 한 세션 동안 캐시 (sessionStorage 는 4 MB 한도라 부적합).
// 본문 토큰화 후 *어떤 lemma 데이터에도 없는 form* 도 위치 인덱스에 등록 — 본문 검색 가능.

let _searchIdx = null;        // 구축된 인덱스
let _searchBuilding = false;  // 동시 진행 가드
let _searchInput = '';        // 마지막 쿼리 (재진입 보존)

// 정규화 — 입력과 인덱스 키 모두 같은 규칙 적용
// (a) Unicode NFD 후 결합 표지 제거 (다이아크리틱)
// (b) 어말 ς → σ
// (c) 소문자
// 결과: polytonic/monotonic, 시그마 위치, 대소문자 무관 검색.
function _searchNormalize(s){
  if(!s) return '';
  return s.normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/ς/g, 'σ')
          .toLowerCase()
          .trim();
}

// 본문 토큰에서 punctuation 제거 — stripWord 와 동일 동작 (의존성 회피 위해 인라인)
function _searchStripWord(w){
  return w.replace(/[,;.·"'᾽’‘()\[\]…—–\-?!]/g, '').trim();
}

// 인덱스 구축 — 비동기·chunked. 한 번에 큰 작업 = UI freeze 방지.
// progress 콜백으로 진행률 (0-1) 보고. 완료 시 _searchIdx 에 결과 캐시.
async function _buildSearchIndex(progressCb){
  if(_searchIdx) return _searchIdx;
  if(_searchBuilding){
    // 진행 중이면 완료 대기
    return new Promise(resolve => {
      const t = setInterval(() => {
        if(_searchIdx){ clearInterval(t); resolve(_searchIdx); }
      }, 100);
    });
  }
  _searchBuilding = true;

  const occ = new Map();            // normalized form → [workIdx*10000+secIdx, ...] (int packing)
  const surface = new Map();        // normalized form → original surface form (대표 1개)
  const lemmaForms = new Map();     // lemma (normalized) → Set<original form>
  const lemmaSurface = new Map();   // lemma normalized → original lemma 형 (대표 1개)
  const ML = (typeof MORPH_LOOKUP !== 'undefined') ? MORPH_LOOKUP : null;

  const W = (typeof WORKS !== 'undefined') ? WORKS : [];

  // 작품 단위로 chunk 진행, 매 작품 후 yield
  for(let wi = 0; wi < W.length; wi++){
    const w = W[wi];
    const secs = w.sections || [];
    for(let si = 0; si < secs.length; si++){
      const text = secs[si].text || '';
      // 라인 단위로 토큰화 — 위치 정보는 (workIdx, secIdx) 만 저장
      for(const line of text.split('\n')){
        for(const tok of line.split(/\s+/)){
          const stripped = _searchStripWord(tok);
          if(!stripped) continue;
          const norm = _searchNormalize(stripped);
          if(!norm) continue;
          // 위치 packing — workIdx (max 100) * 10000 + secIdx (max 10000)
          const pos = wi * 10000 + si;
          if(!occ.has(norm)){
            occ.set(norm, [pos]);
            surface.set(norm, stripped);
          } else {
            const arr = occ.get(norm);
            // 같은 (wi, si) 중복 방지 — 마지막과 다르면 push
            if(arr[arr.length - 1] !== pos) arr.push(pos);
          }
          // lemma 역인덱스 — MORPH_LOOKUP 에 있을 때만
          if(ML && ML[stripped]){
            for(const an of ML[stripped]){
              const lNorm = _searchNormalize(an.l);
              if(!lemmaForms.has(lNorm)){
                lemmaForms.set(lNorm, new Set());
                lemmaSurface.set(lNorm, an.l);
              }
              lemmaForms.get(lNorm).add(stripped);
            }
          }
        }
      }
    }
    if(progressCb && wi % 3 === 0){
      progressCb((wi + 1) / W.length);
      // yield to event loop
      await new Promise(r => setTimeout(r, 0));
    }
  }

  // MORPH_LOOKUP 의 모든 lemma 등록 (본문에 안 나오더라도 역인덱스 자체엔 등록)
  // 즉 사용자가 lemma 입력하면 본문에 안 나와도 어형 목록은 보여줌
  if(ML){
    for(const form in ML){
      for(const an of ML[form]){
        const lNorm = _searchNormalize(an.l);
        if(!lemmaForms.has(lNorm)){
          lemmaForms.set(lNorm, new Set());
          lemmaSurface.set(lNorm, an.l);
        }
        lemmaForms.get(lNorm).add(form);
      }
    }
  }

  _searchIdx = { occ, surface, lemmaForms, lemmaSurface };
  _searchBuilding = false;
  if(progressCb) progressCb(1);
  return _searchIdx;
}

function _renderSearchResults(query){
  const out = document.getElementById('search-results');
  if(!out || !_searchIdx) return;
  const qNorm = _searchNormalize(query.trim());
  if(!qNorm){ out.innerHTML = ''; return; }

  const { occ, surface, lemmaForms, lemmaSurface } = _searchIdx;

  // 검색 결과 두 갈래:
  // (a) 쿼리가 form 인 경우 — occ 에서 직접 hit + 같은 lemma 의 다른 form 도 lookup
  // (b) 쿼리가 lemma 인 경우 — lemmaForms 에서 어형 집합 → 각 어형의 occ 합산
  // 한 쿼리가 양쪽 모두 일치할 수도 있음 (예: λέγω 는 form 이자 lemma).

  const ML = (typeof MORPH_LOOKUP !== 'undefined') ? MORPH_LOOKUP : null;
  const sectionsOf = []; // 모든 종합 occurrence (정렬 전)
  const lemmaSet = new Set();
  const matchedForms = new Set();

  // (a) form 검색
  if(occ.has(qNorm)){
    matchedForms.add(qNorm);
    if(ML){
      const orig = surface.get(qNorm);
      if(orig && ML[orig]){
        for(const an of ML[orig]) lemmaSet.add(_searchNormalize(an.l));
      }
    }
  }
  // (b) lemma 검색
  if(lemmaForms.has(qNorm)){
    lemmaSet.add(qNorm);
    for(const f of lemmaForms.get(qNorm)){
      matchedForms.add(_searchNormalize(f));
    }
  }

  // 다른 lemma 들의 어형도 통합
  for(const lN of lemmaSet){
    const fs = lemmaForms.get(lN);
    if(!fs) continue;
    for(const f of fs) matchedForms.add(_searchNormalize(f));
  }

  // 모든 matchedForms 의 occurrence 합산
  const allOcc = [];  // [{wi, si, form}]
  for(const fN of matchedForms){
    const arr = occ.get(fN);
    if(!arr) continue;
    const surf = surface.get(fN);
    for(const pos of arr){
      allOcc.push({ wi: Math.floor(pos / 10000), si: pos % 10000, form: surf });
    }
  }

  if(matchedForms.size === 0 && lemmaSet.size === 0){
    out.innerHTML = `<div class="card warm"><b>"${query}"</b> — 본문·표제어 데이터에 일치 없음. 악센트·기식부호는 자동 무시됩니다. 다른 표기를 시도해 보세요.</div>`;
    return;
  }

  // 작품별 그룹
  const W = (typeof WORKS !== 'undefined') ? WORKS : [];
  const byWork = new Map();
  for(const o of allOcc){
    const key = o.wi;
    if(!byWork.has(key)) byWork.set(key, []);
    byWork.get(key).push(o);
  }
  // 작품 정렬 — 등장 횟수 많은 순
  const sortedWorks = [...byWork.entries()].sort((a, b) => b[1].length - a[1].length);

  // (lemma block) — 형태분석 + 어형 변이
  let lemmaHtml = '';
  if(lemmaSet.size > 0){
    lemmaHtml = `<div class="card" style="border-left:3px solid var(--terracotta)">
      <div style="font-size:11px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:8px">표제어 (Lemma)</div>
      ${[...lemmaSet].map(lN => {
        const lSurf = lemmaSurface.get(lN) || lN;
        const fs = [...(lemmaForms.get(lN) || new Set())];
        // 형태분석 — 첫 어형 하나의 분석을 대표로 표시 (lemma 자체에는 분석 없음)
        let anaHTML = '';
        if(ML){
          const ana = ML[lSurf];
          if(ana && ana.length){
            anaHTML = ana.map(a => `<span style="display:inline-block;background:var(--ivory-d);padding:2px 7px;border-radius:4px;margin:2px 2px 0 0;font-size:11px;color:var(--clay-d)">${a.p}</span>`).join('');
          }
        }
        const otherForms = fs.filter(f => _searchNormalize(f) !== lN).slice(0, 24);
        return `<div style="padding:10px 0;border-bottom:1px dashed var(--clay)">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span class="grk" style="font-size:22px;color:var(--terracotta-d);font-weight:700">${lSurf}</span>
            <button class="btn btn-sm btn-o" data-speak-lem="${encodeURIComponent(lSurf)}" title="발음" aria-label="발음" style="padding:2px 7px;font-size:12px">🔊</button>
            <a class="minlink" href="#" data-lookup="${encodeURIComponent(lSurf)}" style="font-size:11px">외부 사전 ↗</a>
          </div>
          ${anaHTML ? `<div style="margin-top:4px">${anaHTML}</div>` : ''}
          ${otherForms.length ? `<div style="margin-top:6px;font-size:12px;color:var(--clay-d)">
            <b>어형 변이 (${fs.length})</b>: ${otherForms.map(f => `<span class="grk" style="color:var(--black-glaze-l);margin-right:6px">${f}</span>`).join('')}${fs.length > 24 ? ` <i>… 외 ${fs.length-24}</i>` : ''}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }

  // (concordance block)
  let concHtml = '';
  if(allOcc.length){
    concHtml = `<div class="card" style="border-left:3px solid var(--clay-d);margin-top:10px">
      <div style="font-size:11px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:8px">본문 등장 (콘코던스) · 총 ${allOcc.length}회 · ${sortedWorks.length}편</div>
      ${sortedWorks.slice(0, 20).map(([wi, list]) => {
        const w = W[wi];
        if(!w) return '';
        // 섹션별 그룹
        const bySec = new Map();
        for(const o of list){
          const sk = o.si;
          if(!bySec.has(sk)) bySec.set(sk, []);
          bySec.get(sk).push(o);
        }
        const sortedSecs = [...bySec.entries()].sort((a, b) => a[0] - b[0]).slice(0, 12);
        return `<div style="padding:8px 0;border-bottom:1px dashed var(--clay)">
          <div style="font-family:var(--font-display);font-size:14px;color:var(--terracotta-d);font-weight:600">${w.workKo || w.work} <span style="font-size:11px;color:var(--clay-d);font-weight:400;font-style:italic">(${list.length}회)</span></div>
          <div style="font-size:11px;color:var(--clay-d);font-style:italic;margin-bottom:6px">${w.author || ''} · ${w.work || ''}</div>
          ${sortedSecs.map(([si, group]) => {
            const sec = (w.sections || [])[si];
            if(!sec) return '';
            // 컨텍스트 추출 — 첫 일치 토큰 ±5 단어
            const ctx = _extractContext(sec.text || '', matchedForms);
            return `<div style="padding:5px 0 5px 10px;border-left:2px solid var(--clay);margin:4px 0">
              <a href="#" class="minlink" data-jump-wi="${wi}" data-jump-si="${si}" style="font-size:11px;color:var(--terracotta-d);font-weight:600">${sec.label || ('§'+sec.n)}</a>
              <span style="font-size:10px;color:var(--clay-d)">${group.length>1?` (${group.length}회)`:''}</span>
              <div class="grk" style="font-size:13px;color:var(--black-glaze-l);margin-top:3px;line-height:1.5">${ctx}</div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
      ${sortedWorks.length > 20 ? `<div style="font-size:11px;color:var(--clay-d);font-style:italic;margin-top:8px">… 외 ${sortedWorks.length-20}편 (상위 20편 표시)</div>` : ''}
    </div>`;
  }

  out.innerHTML = lemmaHtml + concHtml;

  // 이벤트 바인딩
  out.querySelectorAll('[data-speak-lem]').forEach(b => b.addEventListener('click', () => {
    try { if(typeof stopSpeech === 'function') stopSpeech(); } catch(_){}
    const t = decodeURIComponent(b.dataset.speakLem || '');
    if(t && typeof speakGreek === 'function') speakGreek(t);
  }));
  out.querySelectorAll('[data-lookup]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const t = decodeURIComponent(a.dataset.lookup || '');
    if(t && typeof openLookup === 'function') openLookup(t);
  }));
  out.querySelectorAll('[data-jump-wi]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const wi = parseInt(a.dataset.jumpWi, 10);
    const si = parseInt(a.dataset.jumpSi, 10);
    const W = (typeof WORKS !== 'undefined') ? WORKS : [];
    const w = W[wi];
    if(w && typeof renderWorkSection === 'function') renderWorkSection(w.id, si);
  }));
}

// 컨텍스트 추출 — 본문 텍스트에서 matchedForms 중 첫 일치 토큰의 ±5 단어 추출
// matchedForms 는 normalized form 의 Set
function _extractContext(text, matchedForms){
  if(!text || !matchedForms || !matchedForms.size) return text.slice(0, 80) + '…';
  const lines = text.split('\n');
  for(const line of lines){
    const tokens = line.split(/(\s+)/);   // 공백 보존
    const words = [];     // {tok, norm, isMatch}
    for(const tok of tokens){
      if(/^\s+$/.test(tok)){ words.push({tok, sep: true}); continue; }
      const stripped = _searchStripWord(tok);
      const norm = stripped ? _searchNormalize(stripped) : '';
      words.push({tok, norm, sep: false, isMatch: matchedForms.has(norm)});
    }
    // 매치 위치 찾기
    for(let i = 0; i < words.length; i++){
      if(words[i].isMatch){
        // ±5 word 윈도우 (separator 미포함 카운트)
        let start = i, end = i, wordCount = 0;
        // 왼쪽
        for(let j = i - 1; j >= 0 && wordCount < 5; j--){
          if(!words[j].sep) wordCount++;
          start = j;
        }
        wordCount = 0;
        for(let j = i + 1; j < words.length && wordCount < 5; j++){
          if(!words[j].sep) wordCount++;
          end = j;
        }
        // 윈도우 조립, 매치 토큰 강조
        let html = '';
        for(let j = start; j <= end; j++){
          if(words[j].isMatch){
            html += `<mark style="background:var(--terracotta);color:var(--ivory-w);padding:0 3px;border-radius:3px">${words[j].tok}</mark>`;
          } else {
            html += words[j].tok;
          }
        }
        const prefix = start > 0 ? '… ' : '';
        const suffix = end < words.length - 1 ? ' …' : '';
        return prefix + html + suffix;
      }
    }
  }
  return text.slice(0, 80) + '…';
}

// 날짜 기반 deterministic 선택. 형태분석 + 전집 본문 용례.
function _todaySeed(){
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
}
function _seededPick(arr, seed){
  // Mulberry32 PRNG
  let s = seed | 0;
  s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  return arr[Math.floor(r * arr.length)];
}
function _findWordInWorks(word, maxHits){
  // word를 전집 본문에서 찾아 (work, section, snippet) 반환
  if(typeof WORKS === 'undefined') return [];
  const hits = [];
  const baseStrip = stripAccent(word).toLowerCase();
  for(const w of WORKS){
    for(const sec of (w.sections || [])){
      const text = sec.text || '';
      // 단어 경계에서 찾기 (그리스어 단어 분리)
      const tokens = text.split(/[\s\.,;··:·!\?"\(\)\[\]\—\-\n]+/);
      for(let ti = 0; ti < tokens.length; ti++){
        const tok = tokens[ti].replace(/^[''«»"']+|[''«»"']+$/g, '');
        if(!tok || tok.length < 2) continue;
        if(stripAccent(tok).toLowerCase() === baseStrip){
          // 주변 문맥
          const start = Math.max(0, ti - 4);
          const end = Math.min(tokens.length, ti + 5);
          const snippet = tokens.slice(start, end).join(' ');
          hits.push({
            workId: w.id, workKo: w.workKo, author: w.authorKo,
            section: sec.label || sec.n, snippet, matched: tok
          });
          if(hits.length >= maxHits) return hits;
          break;  // 한 섹션당 한 hit
        }
      }
    }
  }
  return hits;
}

  `;
}

// ===== 빈도 분석 (Frequency Analysis) =====
let _freqCache = null;
function computeFrequency(){
  if(_freqCache) return _freqCache;
  if(typeof WORKS === 'undefined') return {global: [], byWork: {}};
  const STOP = new Set(['καί','δέ','τε','γάρ','μέν','οὖν','δή','οὐ','οὐκ','οὐχ','μή',
                        'ὁ','ἡ','τό','τοῦ','τῆς','τοῖς','ταῖς','τόν','τήν','τούς','τάς',
                        'ἐν','ἐκ','ἐξ','εἰς','ἐπί','κατά','πρός','σύν','διά','παρά','ὑπό','ὑπέρ',
                        'ἐγώ','σύ','αὐτός','αὐτή','αὐτό','ἡμεῖς','ὑμεῖς','τις','τίς','τι','τί',
                        'ὥς','ὧδε','τις','τὶς','ἄν','ἐάν','εἰ','ἤ','ὅτι','ὥστε','ὅδε',
                        'δʼ','τʼ','γʼ','μʼ','σʼ','οἷς','αἷς','ᾧ','ᾗ','τῷ','τῇ']);
  const global = {};
  const byWork = {};
  for(const w of WORKS){
    const local = {};
    for(const sec of (w.sections || [])){
      const text = sec.text || '';
      const tokens = text.split(/[\s\.,;··:·!\?"\(\)\[\]\—\-\n0-9]+/);
      for(const tok of tokens){
        const clean = tok.replace(/^[''«»"'·]+|[''«»"'·]+$/g, '');
        if(!clean || clean.length < 3) continue;
        if(!/[\u0370-\u03FF\u1F00-\u1FFF]/.test(clean)) continue;
        const norm = stripAccent(clean).toLowerCase();
        if(STOP.has(clean) || STOP.has(norm)) continue;
        global[clean] = (global[clean] || 0) + 1;
        local[clean] = (local[clean] || 0) + 1;
      }
    }
    byWork[w.id] = Object.entries(local).sort((a,b)=>b[1]-a[1]);
  }
  const globalSorted = Object.entries(global).sort((a,b)=>b[1]-a[1]);
  _freqCache = {global: globalSorted, byWork};
  return _freqCache;
}

// ===== 전체 검색 (Search) =====
function searchInWorks(query, maxHits){
  if(typeof WORKS === 'undefined' || !query || query.length < 2) return [];
  const baseQ = stripAccent(query).toLowerCase();
  const hits = [];
  for(const w of WORKS){
    for(const sec of (w.sections || [])){
      const text = sec.text || '';
      const baseText = stripAccent(text).toLowerCase();
      let idx = 0;
      while(true){
        const found = baseText.indexOf(baseQ, idx);
        if(found < 0) break;
        // 단어 경계 확인
        const before = found > 0 ? baseText[found-1] : ' ';
        const after = found + baseQ.length < baseText.length ? baseText[found + baseQ.length] : ' ';
        const isWordBoundary = !/[\u0370-\u03FF\u1F00-\u1FFF]/.test(before) && !/[\u0370-\u03FF\u1F00-\u1FFF]/.test(after);
        if(isWordBoundary){
          const lo = Math.max(0, found - 50);
          const hi = Math.min(text.length, found + baseQ.length + 50);
          let snippet = text.slice(lo, hi);
          // 매칭 부분 찾아 표시 (원본 텍스트에서)
          const matchInOriginal = text.slice(found, found + baseQ.length);
          snippet = (lo > 0 ? '…' : '') +
                    snippet.replace(matchInOriginal, `<b style="color:var(--terracotta-d);background:var(--ivory-d);padding:0 2px">${matchInOriginal}</b>`) +
                    (hi < text.length ? '…' : '');
          hits.push({
            workId: w.id, workKo: w.workKo, author: w.authorKo,
            section: sec.label || sec.n, snippet,
            sectionId: sec.n
          });
          if(hits.length >= maxHits) return hits;
        }
        idx = found + baseQ.length;
      }
    }
  }
  return hits;
}

function renderTopic(id){
  const t = TOPICS.find(x=>x.id===id);
  if(!t) return;

  // v47: paradigm 두 형식 호환 — (a) 구식 (cols + sections[].rows=2D), (b) 신식 (rows=[{form,info}]).
  // paradigmAlt 도 같은 양 형식 지원. 신식은 v44 이후 추가된 심화 토픽들에 사용.
  function _renderParadigm(p){
    if(!p) return '';
    if(p.rows && Array.isArray(p.rows) && p.rows.length && typeof p.rows[0] === 'object' && 'form' in p.rows[0]){
      // 신식 — form/info 2열 단순 표
      let html = '<table class="paradigm"><caption>' + (p.caption || '') + '</caption><tbody>';
      for(const row of p.rows){
        html += '<tr><td class="grk" style="font-weight:600;color:var(--terracotta-d);white-space:nowrap;padding-right:10px">' +
                (row.form || '') + '</td><td style="line-height:1.55">' + (row.info || '') + '</td></tr>';
      }
      html += '</tbody></table>';
      return html;
    }
    if(p.cols && p.sections){
      // 구식 — 다열 cols + sections[].rows = 2D
      let html = '<table class="paradigm"><caption>' + (p.caption || '') + '</caption>';
      html += '<thead><tr><th></th>' + p.cols.map(c=>'<th>'+c+'</th>').join('') + '</tr></thead><tbody>';
      for(const sec of p.sections){
        if(sec.label && p.sections.length>1) html += '<tr class="section-row"><td colspan="'+(p.cols.length+1)+'">'+sec.label+'</td></tr>';
        for(const row of sec.rows){
          html += '<tr><td class="lbl">'+row[0]+'</td>' + row.slice(1).map(c=>'<td class="grk">'+(c||'—')+'</td>').join('') + '</tr>';
        }
      }
      html += '</tbody></table>';
      return html;
    }
    return '';   // 알 수 없는 형식
  }

  // v47: expl 본문에 줄바꿈/마크다운 일부 처리 — 신식 토픽은 backtick template 으로 작성되어
  // 본격적인 multi-paragraph 해설. \n\n → 단락, ** → <b>, * → <i>.
  function _formatExpl(s){
    if(!s) return '';
    if(s.includes('<')) return s;   // 이미 HTML 포함 (구식 토픽) — 그대로
    // 마크다운 like
    let out = s
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<i>$1</i>');
    // 단락 분할
    const paras = out.split(/\n\n+/);
    return paras.map(p => '<p style="margin:0 0 10px 0">' + p.replace(/\n/g, '<br>') + '</p>').join('');
  }

  const tableHtml    = _renderParadigm(t.paradigm);
  const tableAltHtml = _renderParadigm(t.paradigmAlt);
  // v47: 추가 패러다임 표 배열 — μι-동사 같은 큰 토픽에서 mid/pass, 부정과거 등을 분리 표시
  const extraTablesHtml = (Array.isArray(t.extraParadigms) ? t.extraParadigms : [])
    .map(p => {
      const html = _renderParadigm(p);
      return html ? `<div class="card">${html}</div>` : '';
    }).join('');

  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="setTab('grammar')">← 목록</button>
    <h2 class="view-title fade-in" style="margin-top:10px">${t.title}</h2>
    <div class="view-sub">${t.lesson<500?`교재 ${t.lesson}과`:'심화'} · ${t.desc}</div>

    <div class="card">
      <div style="line-height:1.75;font-size:14.5px">${_formatExpl(t.expl)}</div>
    </div>

    ${tableHtml ? `<div class="card">
      ${tableHtml}
      ${t.note?`<div class="hint">📜 ${t.note}</div>`:''}
    </div>` : ''}

    ${tableAltHtml ? `<div class="card">
      ${tableAltHtml}
    </div>` : ''}

    ${extraTablesHtml}

    <div class="btn-row" style="margin:12px 0">
      ${t.items && t.items.length>=2 ? `<button class="btn" onclick="startGrammarDrill('${t.id}')">형태 식별 드릴 →</button>` : ''}
      <button class="btn btn-o" onclick="markTopicStudied('${t.id}')">${S.topicsStudied.includes(t.id)?'✓ 학습 완료':'학습 완료로 표시'}</button>
    </div>
  `;
}

let grammarSession = null;
function startGrammarDrill(id){
  const t = TOPICS.find(x=>x.id===id);
  if(!t || !t.items || t.items.length<2){ toast('이 주제는 드릴이 준비되지 않았습니다.'); return; }
  grammarSession = { topic:t, idx:0, total:Math.min(6, t.items.length), right:0, wrong:0, items:[...t.items].sort(()=>Math.random()-.5) };
  if(!S.topicsStudied.includes(id)){ S.topicsStudied.push(id); saveState(); }
  nextGrammarQ();
}
function nextGrammarQ(){
  const s = grammarSession;
  if(s.idx >= s.total){ finishGrammar(); return; }
  const item = s.items[s.idx];
  // 정답 + 다른 3개 (같은 주제에서)
  const distractors = randPick(s.topic.items.filter(x=>x.info!==item.info), 3);
  const opts = [...distractors, item].sort(()=>Math.random()-.5);
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="setTab('grammar')">← 종료</button>
    <h2 class="view-title fade-in" style="margin-top:10px">${s.topic.title}</h2>

    <div class="quiz-card fade-in">
      <div class="quiz-prompt grk">${item.form}</div>
      <div class="quiz-sub">이 형태의 분석은?</div>
      <div class="options">
        ${opts.map(o=>`<button class="opt" data-info="${o.info.replace(/"/g,'&quot;')}">${o.info}</button>`).join('')}
      </div>
      <div id="g-fb"></div>
    </div>
  `;
  view.querySelectorAll('.opt').forEach(b=> b.addEventListener('click',()=> answerGrammar(b, item, opts)));
}
function answerGrammar(btn, item, opts){
  const chosen = btn.dataset.info;
  const correct = (chosen === item.info);
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.info === item.info) o.classList.add('right');
    else if(o === btn && !correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const fb = document.getElementById('g-fb');
  if(correct){
    grammarSession.right += 1;
    S.grammarCorrectCount += 1;
    fb.innerHTML = `<div class="feedback ok">✓ 정답</div>`;
  } else {
    grammarSession.wrong += 1;
    fb.innerHTML = `<div class="feedback bad">✗ 정답: ${item.info}</div>`;
  }
  setTimeout(()=>{ grammarSession.idx += 1; nextGrammarQ(); }, correct?900:1500);
}
function finishGrammar(){
  const s = grammarSession;
  const xpGain = s.right * 15;
  if(xpGain>0) addXP(xpGain, `문법 드릴 ${s.right}/${s.total}`);
  view.innerHTML = `

      </div>
    </div>
  `;
}

// ============================================================================
// v52 — Ἑρμηνεία · 원문 해석 (sentence-level Korean translations)
// ============================================================================
// 본문 읽기 화면 (renderWorkSection) 에서 각 그리스어 문장 아래 한국어 해석을
// 표시. 두 단계 폴백:
//   (1) WORK_TRANSLATIONS 에 큐레이션된 정역 (가장 핵심 발췌만)
//   (2) ALL_VOCAB + MORPH_LOOKUP 으로 단어별 literal gloss
//
// 큐레이션 정역은 학습자 보조용 작업 번역이며 학술 정역이 아님. 학자 정역
// (예: 강대진, 천병희) 과는 구분되어야 하며 sec.label 위 안내 메시지에서
// 그 점을 명시. AGDT 형태 분석 커버 작품 (Iliad 1, Odyssey 1, Persae) 에서는
// gloss 정확도가 가장 높음.
//
// 토글: S.showTranslation (bool). 본문 액션 행의 "📖 해석" 버튼으로 전환.
// 표시 위치: .sent[data-sent-idx="N"] 의 마지막 span 다음에 .trans div 삽입.
// ============================================================================

// ─── 큐레이션 정역 데이터 ────────────────────────────────────────────────
// 정역 데이터는 별도 파일 `data-translations.js` 에서 정의되어 `window.WORK_TRANSLATIONS`
// 와 `window.READING_TRANSLATIONS` 로 노출됨. 키 포맷: 'workId:secN' → 한국어 배열.
// 문장 분할은 renderWorkSection 의 `[.;·?!]` 규칙과 일치해야 함.
// data-translations.js 가 로드 실패 시 빈 객체로 폴백 (단어 풀이 폴백이 동작함).
const WORK_TRANSLATIONS = (typeof window !== 'undefined' && window.WORK_TRANSLATIONS && typeof window.WORK_TRANSLATIONS === 'object') ? window.WORK_TRANSLATIONS : {};
const READING_TRANSLATIONS = (typeof window !== 'undefined' && window.READING_TRANSLATIONS && typeof window.READING_TRANSLATIONS === 'object') ? window.READING_TRANSLATIONS : {};

// ─── 정역 조회 헬퍼 ─────────────────────────────────────────────────────
// workId + 섹션 번호 (sec.n) + 문장 인덱스 → 큐레이션 정역 또는 null
function _getCuratedTranslation(workId, secN, sentIdx){
  const key = `${workId}:${secN}`;
  const arr = WORK_TRANSLATIONS[key];
  if(!Array.isArray(arr)) return null;
  if(sentIdx < 0 || sentIdx >= arr.length) return null;
  return arr[sentIdx];
}

// ─── 단어 단위 literal gloss ──────────────────────────────────────────
// 큐레이션이 없을 때 대안 — ALL_VOCAB 와 MORPH_LOOKUP 으로 단어별 한국어 의미를
// 모아 "단어=뜻 · 단어=뜻" 형식. 정역이 아닌 *원어 학습자가 단어 의미를 빠르게
// 파악할 수 있도록 하는 보조*. AGDT 커버 작품에서 가장 정확.
let _vocabByLemmaCache = null;
function _buildVocabByLemmaIndex(){
  if(_vocabByLemmaCache) return _vocabByLemmaCache;
  const idx = new Map();
  if(typeof ALL_VOCAB === 'undefined') return _vocabByLemmaCache = idx;
  for(const v of ALL_VOCAB){
    if(!v || !v.g) continue;
    // 키 정규화: 원본 + 다이아크리틱 제거된 형태 둘 다 인덱스
    idx.set(v.g, v);
    const stripped = (typeof stripAccent==='function') ? stripAccent(v.g).toLowerCase() : v.g.toLowerCase();
    if(!idx.has(stripped)) idx.set(stripped, v);
  }
  _vocabByLemmaCache = idx;
  return idx;
}

function _glossOneWord(word){
  if(!word) return null;
  const idx = _buildVocabByLemmaIndex();
  // 1) 직접 매치 (사전형이 그대로 본문에 등장)
  let entry = idx.get(word);
  if(!entry){
    const stripped = (typeof stripAccent==='function') ? stripAccent(word).toLowerCase() : word.toLowerCase();
    entry = idx.get(stripped);
  }
  if(entry && entry.ko) return entry.ko;
  // 2) MORPH_LOOKUP 으로 lemma 환원
  if(typeof MORPH_LOOKUP !== 'undefined'){
    const m = MORPH_LOOKUP[word];
    if(m && m.l){
      // m.l 은 lemma — 본 어휘에서 다시 검색
      const lemmaEntry = idx.get(m.l) ||
        (typeof stripAccent==='function' ? idx.get(stripAccent(m.l).toLowerCase()) : null);
      if(lemmaEntry && lemmaEntry.ko) return lemmaEntry.ko;
    }
  }
  return null;
}

function _buildLiteralGloss(text){
  if(!text) return null;
  // 토큰화 — 공백·구두점 기준
  const tokens = text.split(/(\s+)/);
  const out = [];
  for(const tok of tokens){
    if(/^\s+$/.test(tok)) continue;
    const clean = (typeof stripWord==='function') ? stripWord(tok) : tok.replace(/[,;.·"'᾽’‘()\[\]…—–\-?!]/g,'').trim();
    if(!clean) continue;
    const gloss = _glossOneWord(clean);
    if(gloss){
      // 다중 의미는 첫 번째만 (a, b — c → "a, b")
      const short = gloss.split(/[,·;]/)[0].trim();
      out.push(`<span style="color:var(--terracotta-d);font-weight:600">${clean}</span>=${short}`);
    }
  }
  return out.length ? out.join(' · ') : null;
}

function _ensureTranslationPref(){
  if(typeof S.showTranslation !== 'boolean') S.showTranslation = false;
  return S.showTranslation;

// ─── 본문 화면에 정역/주석 적용 ────────────────────────────────────────
// renderWorkSection 이 view.innerHTML 을 채운 *후* 호출. .sent[data-sent-idx="N"]
// 마지막 span 다음에 .trans div 삽입. sentenceTexts: {sentIdx: "그리스어 원문"}
//
// 한 line div 안에 여러 문장이 종결되는 경우 (예: 짧은 시 행이나 dialogue) 도
// 올바른 순서로 표시되도록 line div 별로 그룹화하여 일괄 삽입.
function _applyTranslationDisplay(workId, secN, sentenceTexts){
  // 기존 .trans 노드 제거 (재 적용 시 중복 방지)
  view.querySelectorAll('.trans').forEach(n => n.remove());
  if(!S.showTranslation) return;
  // 각 sentIdx 별로 마지막 .sent[data-sent-idx="N"] 찾아서 그 다음 형제로 .trans 삽입
  // 한 문장이 여러 줄 (.sent[data-sent-idx="N"] 다수) 에 걸칠 수 있으므로 마지막 것을 선택
  const allSents = view.querySelectorAll('.sent[data-sent-idx]');
  const lastBySentIdx = new Map();
  allSents.forEach(s => {
    const idx = parseInt(s.getAttribute('data-sent-idx'), 10);
    if(!Number.isFinite(idx)) return;
    lastBySentIdx.set(idx, s);   // 같은 idx 면 뒤에 오는 것이 덮어씀 → 자동으로 마지막
  });
  // 문장 idx 오름차순 정렬 후, 각 문장 별로 .trans 빌드
  const sortedIdx = Array.from(lastBySentIdx.keys()).sort((a,b)=>a-b);
  // line div 단위로 그룹화 (한 라인 안에 끝나는 문장이 여러 개면 한꺼번에 처리)
  const transByLineDiv = new Map();   // lineDiv → [trans, trans, ...] (순서대로)
  const transStandalone = [];          // line div 가 아닌 부모일 경우 (드물지만 대비)
  for(const idx of sortedIdx){
    const lastSpan = lastBySentIdx.get(idx);
    const sentText = sentenceTexts[idx] || '';
    const curated = _getCuratedTranslation(workId, secN, idx);
    let content = '';
    let isCurated = false;
    if(curated){
      content = curated;
      isCurated = true;
    } else {
      const gloss = _buildLiteralGloss(sentText);
      if(gloss) content = gloss;
    }
    if(!content) continue;
    const trans = document.createElement('div');
    trans.className = 'trans';
    trans.setAttribute('data-sent-idx', String(idx));
    trans.style.cssText =
      'font-size:12.5px;line-height:1.65;color:var(--black-glaze-l);' +
      'background:' + (isCurated ? 'var(--ivory-d)' : 'transparent') + ';' +
      'border-left:' + (isCurated ? '2.5px solid var(--terracotta)' : '1.5px dashed var(--clay)') + ';' +
      'padding:6px 10px;margin:4px 0 10px 12px;border-radius:0 4px 4px 0;' +
      "font-family:var(--font-ko);";
    if(isCurated){
      trans.textContent = content;
    } else {
      trans.innerHTML = '<span style="font-size:10px;color:var(--clay-d);text-transform:uppercase;letter-spacing:.04em;font-weight:600">단어 풀이</span> ' + content;
    }
    // 부모 식별 — line div 면 그룹에 누적, 아니면 standalone
    let lineDiv = lastSpan.parentNode;
    while(lineDiv && !(lineDiv.tagName === 'DIV' && lineDiv.hasAttribute('data-line-idx'))){
      lineDiv = lineDiv.parentNode;
      // passage div 까지 올라가면 중단
      if(!lineDiv || lineDiv.classList && lineDiv.classList.contains('passage')){ lineDiv = null; break; }
    }
    if(lineDiv){
      if(!transByLineDiv.has(lineDiv)) transByLineDiv.set(lineDiv, []);
      transByLineDiv.get(lineDiv).push(trans);
    } else {
      // line div 가 아니면 lastSpan 의 직접 부모 뒤에 standalone 으로
      transStandalone.push({lastSpan, trans});
    }
  }
  // line div 별로 일괄 삽입 (모든 .trans 를 line div 직후에 *순서대로*)
  // DocumentFragment 로 한 번에 삽입하면 reflow 1회로 끝남
  for(const [lineDiv, transList] of transByLineDiv.entries()){
    const frag = document.createDocumentFragment();
    transList.forEach(t => frag.appendChild(t));
    if(lineDiv.parentNode){
      lineDiv.parentNode.insertBefore(frag, lineDiv.nextSibling);
    }
  }
  for(const {lastSpan, trans} of transStandalone){
    const parent = lastSpan.parentNode;
    if(!parent) continue;
    const next = lastSpan.nextSibling;
    if(next) parent.insertBefore(trans, next); else parent.appendChild(trans);
  }
}
