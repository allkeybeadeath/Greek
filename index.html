        text: "ΣΩ. σὺ δὲ οὔτε Λακεδαίμονα προῃροῦ οὔτε Κρήτην, ἃς δὴ ἑκάστοτε φῂς εὐνομεῖσθαι, οὔτε ἄλλην οὐδεμίαντῶν Ἑλληνίδων πόλεων οὐδὲ τῶν βαρβαρικῶν, ἀλλὰ ἐλάττω ἐξ αὐτῆς ἀπεδήμησας ἢ οἱ χωλοί τε καὶ τυφλοὶ καὶ οἱ ἄλλοι ἀνάπηροι· οὕτω σοι διαφερόντως τῶν ἄλλων Ἀθηναίων ἤρεσκεν ἡ πόλις τε καὶ ἡμεῖς οἱ νόμοι δῆλον ὅτι· τίνι γὰρ ἂν πόλις ἀρέσκοι ἄνευ νόμων; νῦν δὲ δὴ οὐκ ἐμμενεῖς τοῖς ὡμολογημένοις; ἐὰν ἡμῖν γε πείθῃ, ὦ Σώκρατες· καὶ οὐ καταγέλαστός γε ἔσῃ ἐκ τῆς πόλεως ἐξελθών.σκόπει γὰρ δή, ταῦτα παραβὰς καὶ ἐξαμαρτάνων τι τούτων τί ἀγαθὸν ἐργάσῃ σαυτὸν ἢ τοὺς ἐπιτηδείους τοὺς σαυτοῦ. ὅτι μὲν γὰρ κινδυνεύσουσί γέ σου οἱ ἐπιτήδειοι καὶ αὐτοὶ φεύγειν καὶ στερηθῆναι τῆς πόλεως ἢ τὴν οὐσίαν ἀπολέσαι, σχεδόν τι δῆλον· αὐτὸς δὲ πρῶτον μὲν ἐὰν εἰς τῶν ἐγγύτατά τινα πόλεων ἔλθῃς, ἢ Θήβαζε ἢ Μέγαράδε— εὐνομοῦνται γὰρ ἀμφότεραι—πολέμιος ἥξεις, ὦ Σώκρατες, τῇ τούτων πολιτείᾳ, καὶ ὅσοιπερ κήδονται τῶν αὑτῶν πόλεων ὑποβλέψονταί σε διαφθορέα ἡγούμενοι τῶν νόμων, καὶ βεβαιώσεις τοῖς δικασταῖς τὴν δόξαν, ὥστε δοκεῖν ὀρθῶς τὴν δίκην δικάσαι· ὅστις γὰρ νόμων διαφθορεύς ἐστιν σφόδρα που δόξειεν ἂν νέων γε καὶ ἀνοήτων ἀνθρώπων διαφθορεὺς εἶναι. πότερον οὖν φεύξῃ τάς τε εὐνομουμένας πόλεις καὶ τῶν ἀνδρῶν τοὺς κοσμιωτάτους; καὶ τοῦτο ποιοῦντι ἆρα ἄξιόν σοι ζῆν ἔσται; ἢ πλησιάσεις τούτοις καὶ ἀναισχυντήσεις διαλεγόμενος—τίνας λόγους, ὦ Σώκρατες; ἢ οὕσπερ ἐνθάδε, ὡς ἡ ἀρετὴ καὶ ἡ δικαιοσύνη πλείστου ἄξιον τοῖς ἀνθρώποις καὶ τὰ νόμιμα καὶ οἱ νόμοι; καὶ οὐκ οἴει ἄσχημον \n φανεῖσθαι τὸ τοῦ Σωκράτους πρᾶγμα; οἴεσθαί γε χρή. ἀλλʼ ἐκ μὲν τούτων τῶν τόπων ἀπαρεῖς, ἥξεις δὲ εἰς Θετταλίαν παρὰ τοὺς ξένους τοὺς Κρίτωνος; ἐκεῖ γὰρ δὴ πλείστη ἀταξία καὶ ἀκολασία, καὶ ἴσως ἂν ἡδέως σου ἀκούοιεν ὡς γελοίως ἐκ τοῦ δεσμωτηρίου ἀπεδίδρασκες σκευήν τέ τινα περιθέμενος, ἢ διφθέραν λαβὼν ἢ ἄλλα οἷα δὴ εἰώθασιν ἐνσκευάζεσθαι οἱ ἀποδιδράσκοντες, καὶ τὸ σχῆμα τὸ σαυτοῦ μεταλλάξας· ὅτι δὲ γέρων ἀνήρ, σμικροῦ χρόνου τῷ βίῳ λοιποῦ ὄντος ὡς τὸ εἰκός, ἐτόλμησας οὕτω γλίσχρως ἐπιθυμεῖν ζῆν, νόμους τοὺς μεγίστους παραβάς, οὐδεὶς ὃς ἐρεῖ; ἴσως, ἂν μή τινα λυπῇς· εἰ δὲ μή, ἀκούσῃ, ὦ Σώκρατες, πολλὰ καὶ ἀνάξια σαυτοῦ. ὑπερχόμενος δὴ βιώσῃ πάντας ἀνθρώπους καὶ δουλεύων— τί ποιῶν ἢ εὐωχούμενος ἐν Θετταλίᾳ, ὥσπερ ἐπὶ δεῖπνον ἀποδεδημηκὼς εἰς Θετταλίαν;"

        text: "ΣΩ. λόγοι δὲ ἐκεῖνοι οἱ περὶ δικαιοσύνης τε καὶ τῆς ἄλλης ἀρετῆς ποῦ ἡμῖν ἔσονται; ἀλλὰ δὴ τῶν παίδων ἕνεκα βούλει ζῆν, ἵνα αὐτοὺς ἐκθρέψῃς καὶ παιδεύσῃς; τί δέ; εἰς Θετταλίαν αὐτοὺς ἀγαγὼν θρέψεις τε καὶ παιδεύσεις, ξένους ποιήσας, ἵνα καὶ τοῦτο ἀπολαύσωσιν; ἢ τοῦτο μὲν οὔ, αὐτοῦ δὲ τρεφόμενοι σοῦ ζῶντος βέλτιον θρέψονται καὶ παιδεύσονται μὴ συνόντος σοῦ αὐτοῖς; οἱ γὰρ ἐπιτήδειοι οἱ σοὶ ἐπιμελήσονται αὐτῶν. πότερον ἐὰν μὲν εἰς Θετταλίαν ἀποδημήσῃς, ἐπιμελήσονται, ἐὰν δὲ εἰς Ἅιδου ἀποδημήσῃς, οὐχὶ ἐπιμελήσονται; εἴπερ γέ τι ὄφελος αὐτῶν ἐστιν τῶν σοι φασκόντων ἐπιτηδείων εἶναι, οἴεσθαί γε χρή.ἀλλʼ, ὦ Σώκρατες, πειθόμενος ἡμῖν τοῖς σοῖς τροφεῦσι μήτε παῖδας περὶ πλείονος ποιοῦ μήτε τὸ ζῆν μήτε ἄλλο μηδὲν πρὸ τοῦ δικαίου, ἵνα εἰς Ἅιδου ἐλθὼν ἔχῃς πάντα ταῦτα ἀπολογήσασθαι τοῖς ἐκεῖ ἄρχουσιν· οὔτε γὰρ ἐνθάδε σοι φαίνεται ταῦτα πράττοντι ἄμεινον εἶναι οὐδὲ δικαιότερον οὐδὲ ὁσιώτερον, οὐδὲ ἄλλῳ τῶν σῶν οὐδενί, οὔτε ἐκεῖσε ἀφικομένῳ ἄμεινον ἔσται. ἀλλὰ νῦν μὲν ἠδικημένος ἄπει,\n ἐὰν ἀπίῃς, οὐχ ὑφʼ ἡμῶν τῶν νόμων ἀλλὰ ὑπʼ ἀνθρώπων· ἐὰν δὲ ἐξέλθῃς οὕτως αἰσχρῶς ἀνταδικήσας τε καὶ ἀντικακουργήσας, τὰς σαυτοῦ ὁμολογίας τε καὶ συνθήκας τὰς πρὸς ἡμᾶς παραβὰς καὶ κακὰ ἐργασάμενος τούτους οὓς ἥκιστα ἔδει, σαυτόν τε καὶ φίλους καὶ πατρίδα καὶ ἡμᾶς, ἡμεῖς τέ σοι χαλεπανοῦμεν ζῶντι, καὶ ἐκεῖ οἱ ἡμέτεροι ἀδελφοὶ οἱ ἐν Ἅιδου νόμοι οὐκ εὐμενῶς σε ὑποδέξονται, εἰδότες ὅτι καὶ ἡμᾶς ἐπεχείρησας ἀπολέσαι τὸ σὸν μέρος. ἀλλὰ μή σε πείσῃ Κρίτων ποιεῖν ἃ λέγει μᾶλλον ἢ ἡμεῖς.ταῦτα, ὦ φίλε ἑταῖρε Κρίτων, εὖ ἴσθι ὅτι ἐγὼ δοκῶ ἀκούειν, ὥσπερ οἱ κορυβαντιῶντες τῶν αὐλῶν δοκοῦσιν ἀκούειν, καὶ ἐν ἐμοὶ αὕτη ἡ ἠχὴ τούτων τῶν λόγων βομβεῖ καὶ ποιεῖ μὴ δύνασθαι τῶν ἄλλων ἀκούειν· ἀλλὰ ἴσθι, ὅσα γε τὰ νῦν ἐμοὶ δοκοῦντα, ἐὰν λέγῃς παρὰ ταῦτα, μάτην ἐρεῖς. ὅμως μέντοι εἴ τι οἴει πλέον ποιήσειν, λέγε.\n ΚΡ. ἀλλʼ, ὦ Σώκρατες, οὐκ ἔχω λέγειν.\n\n ΣΩ. ἔα τοίνυν, ὦ Κρίτων, καὶ πράττωμεν ταύτῃ, ἐπειδὴ ταύτῃ ὁ θεὸς ὑφηγεῖται."

        n: "1.1-50",
        label: "1.1–50",
        text: "1 ἄνδρα μοι ἔννεπε, μοῦσα, πολύτροπον, ὃς μάλα πολλὰ\n2 πλάγχθη, ἐπεὶ Τροίης ἱερὸν πτολίεθρον ἔπερσεν·\n3 πολλῶν δʼ ἀνθρώπων ἴδεν ἄστεα καὶ νόον ἔγνω,\n4 πολλὰ δʼ ὅ γʼ ἐν πόντῳ πάθεν ἄλγεα ὃν κατὰ θυμόν,\n5 ἀρνύμενος ἥν τε ψυχὴν καὶ νόστον ἑταίρων.\n6 ἀλλʼ οὐδʼ ὣς ἑτάρους ἐρρύσατο, ἱέμενός περ·\n7 αὐτῶν γὰρ σφετέρῃσιν ἀτασθαλίῃσιν ὄλοντο,\n8 νήπιοι, οἳ κατὰ βοῦς Ὑπερίονος Ἠελίοιο\n9 ἤσθιον· αὐτὰρ ὁ τοῖσιν ἀφείλετο νόστιμον ἦμαρ.\n10 τῶν ἁμόθεν γε, θεά, θύγατερ Διός, εἰπὲ καὶ ἡμῖν.\n11 ἔνθʼ ἄλλοι μὲν πάντες, ὅσοι φύγον αἰπὺν ὄλεθρον,\n12 οἴκοι ἔσαν, πόλεμόν τε πεφευγότες ἠδὲ θάλασσαν·\n13 τὸν δʼ οἶον νόστου κεχρημένον ἠδὲ γυναικὸς\n14 νύμφη πότνιʼ ἔρυκε Καλυψὼ δῖα θεάων\n15 ἐν σπέσσι γλαφυροῖσι, λιλαιομένη πόσιν εἶναι.\n16 ἀλλʼ ὅτε δὴ ἔτος ἦλθε περιπλομένων ἐνιαυτῶν,\n17 τῷ οἱ ἐπεκλώσαντο θεοὶ οἶκόνδε νέεσθαι\n18 εἰς Ἰθάκην, οὐδʼ ἔνθα πεφυγμένος ἦεν ἀέθλων\n19 καὶ μετὰ οἷσι φίλοισι. θεοὶ δʼ ἐλέαιρον ἅπαντες\n20 νόσφι Ποσειδάωνος· ὁ δʼ ἀσπερχὲς μενέαινεν\n21 ἀντιθέῳ Ὀδυσῆι πάρος ἣν γαῖαν ἱκέσθαι.\n22 ἀλλʼ ὁ μὲν Αἰθίοπας μετεκίαθε τηλόθʼ ἐόντας,\n23 Αἰθίοπας τοὶ διχθὰ δεδαίαται, ἔσχατοι ἀνδρῶν,\n24 οἱ μὲν δυσομένου Ὑπερίονος οἱ δʼ ἀνιόντος,\n25 ἀντιόων ταύρων τε καὶ ἀρνειῶν ἑκατόμβης.\n26 ἔνθʼ ὅ γʼ ἐτέρπετο δαιτὶ παρήμενος· οἱ δὲ δὴ ἄλλοι\n27 Ζηνὸς ἐνὶ μεγάροισιν Ὀλυμπίου ἁθρόοι ἦσαν.\n28 τοῖσι δὲ μύθων ἦρχε πατὴρ ἀνδρῶν τε θεῶν τε·\n29 μνήσατο γὰρ κατὰ θυμὸν ἀμύμονος Αἰγίσθοιο,\n30 τόν ῥʼ Ἀγαμεμνονίδης τηλεκλυτὸς ἔκτανʼ Ὀρέστης·\n31 τοῦ ὅ γʼ ἐπιμνησθεὶς ἔπεʼ ἀθανάτοισι μετηύδα·\n32 ὢ πόποι, οἷον δή νυ θεοὺς βροτοὶ αἰτιόωνται·\n33 ἐξ ἡμέων γάρ φασι κάκʼ ἔμμεναι, οἱ δὲ καὶ αὐτοὶ\n34 σφῇσιν ἀτασθαλίῃσιν ὑπὲρ μόρον ἄλγεʼ ἔχουσιν,\n35 ὡς καὶ νῦν Αἴγισθος ὑπὲρ μόρον Ἀτρεΐδαο\n36 γῆμʼ ἄλοχον μνηστήν, τὸν δʼ ἔκτανε νοστήσαντα,\n37 εἰδὼς αἰπὺν ὄλεθρον, ἐπεὶ πρό οἱ εἴπομεν ἡμεῖς,\n38 Ἑρμείαν πέμψαντες, ἐύσκοπον ἀργεϊφόντην,\n39 μήτʼ αὐτὸν κτείνειν μήτε μνάασθαι ἄκοιτιν·\n40 ἐκ γὰρ Ὀρέσταο τίσις ἔσσεται Ἀτρεΐδαο,\n41 ὁππότʼ ἂν ἡβήσῃ τε καὶ ἧς ἱμείρεται αἴης.\n42 ὣς ἔφαθʼ Ἑρμείας, ἀλλʼ οὐ φρένας Αἰγίσθοιο\n43 πεῖθʼ ἀγαθὰ φρονέων· νῦν δʼ ἁθρόα πάντʼ ἀπέτισεν.\n44 τὸν δʼ ἠμείβετʼ ἔπειτα θεά, γλαυκῶπις Ἀθήνη·\n45 ὦ πάτερ ἡμέτερε Κρονίδη, ὕπατε κρειόντων,\n46 καὶ λίην κεῖνός γε ἐοικότι κεῖται ὀλέθρῳ·\n47 ὡς ἀπόλοιτο καὶ ἄλλος, ὅτις τοιαῦτά γε ῥέζοι·\n48 ἀλλά μοι ἀμφʼ Ὀδυσῆι δαΐφρονι δαίεται ἦτορ,\n49 δυσμόρῳ, ὃς δὴ δηθὰ φίλων ἄπο πήματα πάσχει\n50 νήσῳ ἐν ἀμφιρύτῃ, ὅθι τʼ ὀμφαλός ἐστι θαλάσσης."

        text: "51 νῆσος δενδρήεσσα, θεὰ δʼ ἐν δώματα ναίει,\n52 Ἄτλαντος θυγάτηρ ὀλοόφρονος, ὅς τε θαλάσσης\n53 πάσης βένθεα οἶδεν, ἔχει δέ τε κίονας αὐτὸς\n54 μακράς, αἳ γαῖάν τε καὶ οὐρανὸν ἀμφὶς ἔχουσιν.\n55 τοῦ θυγάτηρ δύστηνον ὀδυρόμενον κατερύκει,\n56 αἰεὶ δὲ μαλακοῖσι καὶ αἱμυλίοισι λόγοισιν\n57 θέλγει, ὅπως Ἰθάκης ἐπιλήσεται· αὐτὰρ Ὀδυσσεύς,\n58 ἱέμενος καὶ καπνὸν ἀποθρῴσκοντα νοῆσαι\n59 ἧς γαίης, θανέειν ἱμείρεται. οὐδέ νυ σοί περ\n60 ἐντρέπεται φίλον ἦτορ, Ὀλύμπιε. οὔ νύ τʼ Ὀδυσσεὺς\n61 Ἀργείων παρὰ νηυσὶ χαρίζετο ἱερὰ ῥέζων\n62 Τροίῃ ἐν εὐρείῃ; τί νύ οἱ τόσον ὠδύσαο, Ζεῦ;\n63 τὴν δʼ ἀπαμειβόμενος προσέφη νεφεληγερέτα Ζεύς·\n64 τέκνον ἐμόν, ποῖόν σε ἔπος φύγεν ἕρκος ὀδόντων.\n65 πῶς ἂν ἔπειτʼ Ὀδυσῆος ἐγὼ θείοιο λαθοίμην,\n66 ὃς περὶ μὲν νόον ἐστὶ βροτῶν, περὶ δʼ ἱρὰ θεοῖσιν\n67 ἀθανάτοισιν ἔδωκε, τοὶ οὐρανὸν εὐρὺν ἔχουσιν;\n68 ἀλλὰ Ποσειδάων γαιήοχος ἀσκελὲς αἰεὶ\n69 Κύκλωπος κεχόλωται, ὃν ὀφθαλμοῦ ἀλάωσεν,\n70 ἀντίθεον Πολύφημον, ὅου κράτος ἐστὶ μέγιστον\n71 πᾶσιν Κυκλώπεσσι· Θόωσα δέ μιν τέκε νύμφη,\n72 Φόρκυνος θυγάτηρ ἁλὸς ἀτρυγέτοιο μέδοντος,\n73 ἐν σπέσσι γλαφυροῖσι Ποσειδάωνι μιγεῖσα.\n74 ἐκ τοῦ δὴ Ὀδυσῆα Ποσειδάων ἐνοσίχθων\n75 οὔ τι κατακτείνει, πλάζει δʼ ἀπὸ πατρίδος αἴης.\n76 ἀλλʼ ἄγεθʼ, ἡμεῖς οἵδε περιφραζώμεθα πάντες\n77 νόστον, ὅπως ἔλθῃσι· Ποσειδάων δὲ μεθήσει\n78 ὃν χόλον· οὐ μὲν γάρ τι δυνήσεται ἀντία πάντων\n79 ἀθανάτων ἀέκητι θεῶν ἐριδαινέμεν οἶος.\n80 τὸν δʼ ἠμείβετʼ ἔπειτα θεά, γλαυκῶπις Ἀθήνη·\n81 ὦ πάτερ ἡμέτερε Κρονίδη, ὕπατε κρειόντων,\n82 εἰ μὲν δὴ νῦν τοῦτο φίλον μακάρεσσι θεοῖσιν,\n83 νοστῆσαι Ὀδυσῆα πολύφρονα ὅνδε δόμονδε,\n84 Ἑρμείαν μὲν ἔπειτα διάκτορον ἀργεϊφόντην\n85 νῆσον ἐς Ὠγυγίην ὀτρύνομεν, ὄφρα τάχιστα\n86 νύμφῃ ἐυπλοκάμῳ εἴπῃ νημερτέα βουλήν,\n87 νόστον Ὀδυσσῆος ταλασίφρονος, ὥς κε νέηται·\n88 αὐτὰρ ἐγὼν Ἰθάκηνδʼ ἐσελεύσομαι, ὄφρα οἱ υἱὸν\n89 μᾶλλον ἐποτρύνω καί οἱ μένος ἐν φρεσὶ θείω,\n90 εἰς ἀγορὴν καλέσαντα κάρη κομόωντας Ἀχαιοὺς\n91 πᾶσι μνηστήρεσσιν ἀπειπέμεν, οἵ τέ οἱ αἰεὶ\n92 μῆλʼ ἁδινὰ σφάζουσι καὶ εἰλίποδας ἕλικας βοῦς.\n93 πέμψω δʼ ἐς Σπάρτην τε καὶ ἐς Πύλον ἠμαθόεντα\n94 νόστον πευσόμενον πατρὸς φίλου, ἤν που ἀκούσῃ,\n95 ἠδʼ ἵνα μιν κλέος ἐσθλὸν ἐν ἀνθρώποισιν ἔχῃσιν.\n96 ὣς εἰποῦσʼ ὑπὸ ποσσὶν ἐδήσατο καλὰ πέδιλα,\n97 ἀμβρόσια χρύσεια, τά μιν φέρον ἠμὲν ἐφʼ ὑγρὴν\n98 ἠδʼ ἐπʼ ἀπείρονα γαῖαν ἅμα πνοιῇς ἀνέμοιο·\n99 εἵλετο δʼ ἄλκιμον ἔγχος, ἀκαχμένον ὀξέι χαλκῷ,\n100 βριθὺ μέγα στιβαρόν, τῷ δάμνησι στίχας ἀνδρῶν"

        text: "101 ἡρώων, τοῖσίν τε κοτέσσεται ὀβριμοπάτρη.\n102 βῆ δὲ κατʼ Οὐλύμποιο καρήνων ἀίξασα,\n103 στῆ δʼ Ἰθάκης ἐνὶ δήμῳ ἐπὶ προθύροις Ὀδυσῆος,\n104 οὐδοῦ ἐπʼ αὐλείου· παλάμῃ δʼ ἔχε χάλκεον ἔγχος,\n105 εἰδομένη ξείνῳ, Ταφίων ἡγήτορι Μέντῃ.\n106 εὗρε δʼ ἄρα μνηστῆρας ἀγήνορας. οἱ μὲν ἔπειτα\n107 πεσσοῖσι προπάροιθε θυράων θυμὸν ἔτερπον\n108 ἥμενοι ἐν ῥινοῖσι βοῶν, οὓς ἔκτανον αὐτοί·\n109 κήρυκες δʼ αὐτοῖσι καὶ ὀτρηροὶ θεράποντες\n110 οἱ μὲν οἶνον ἔμισγον ἐνὶ κρητῆρσι καὶ ὕδωρ,\n111 οἱ δʼ αὖτε σπόγγοισι πολυτρήτοισι τραπέζας\n112 νίζον καὶ πρότιθεν, τοὶ δὲ κρέα πολλὰ δατεῦντο.\n113 τὴν δὲ πολὺ πρῶτος ἴδε Τηλέμαχος θεοειδής,\n114 ἧστο γὰρ ἐν μνηστῆρσι φίλον τετιημένος ἦτορ,\n115 ὀσσόμενος πατέρʼ ἐσθλὸν ἐνὶ φρεσίν, εἴ ποθεν ἐλθὼν\n116 μνηστήρων τῶν μὲν σκέδασιν κατὰ δώματα θείη,\n117 τιμὴν δʼ αὐτὸς ἔχοι καὶ δώμασιν οἷσιν ἀνάσσοι.\n118 τὰ φρονέων, μνηστῆρσι μεθήμενος, εἴσιδʼ Ἀθήνην.\n119 βῆ δʼ ἰθὺς προθύροιο, νεμεσσήθη δʼ ἐνὶ θυμῷ\n120 ξεῖνον δηθὰ θύρῃσιν ἐφεστάμεν· ἐγγύθι δὲ στὰς\n121 χεῖρʼ ἕλε δεξιτερὴν καὶ ἐδέξατο χάλκεον ἔγχος,\n122 καί μιν φωνήσας ἔπεα πτερόεντα προσηύδα·\n123 χαῖρε, ξεῖνε, παρʼ ἄμμι φιλήσεαι· αὐτὰρ ἔπειτα\n124 δείπνου πασσάμενος μυθήσεαι ὅττεό σε χρή.\n125 ὣς εἰπὼν ἡγεῖθʼ, ἡ δʼ ἕσπετο Παλλὰς Ἀθήνη.\n126 οἱ δʼ ὅτε δή ῥʼ ἔντοσθεν ἔσαν δόμου ὑψηλοῖο,\n127 ἔγχος μέν ῥʼ ἔστησε φέρων πρὸς κίονα μακρὴν\n128 δουροδόκης ἔντοσθεν ἐυξόου, ἔνθα περ ἄλλα\n129 ἔγχεʼ Ὀδυσσῆος ταλασίφρονος ἵστατο πολλά,\n130 αὐτὴν δʼ ἐς θρόνον εἷσεν ἄγων, ὑπὸ λῖτα πετάσσας,\n131 καλὸν δαιδάλεον· ὑπὸ δὲ θρῆνυς ποσὶν ἦεν.\n132 πὰρ δʼ αὐτὸς κλισμὸν θέτο ποικίλον, ἔκτοθεν ἄλλων\n133 μνηστήρων, μὴ ξεῖνος ἀνιηθεὶς ὀρυμαγδῷ\n134 δείπνῳ ἁδήσειεν, ὑπερφιάλοισι μετελθών,\n135 ἠδʼ ἵνα μιν περὶ πατρὸς ἀποιχομένοιο ἔροιτο.\n136 χέρνιβα δʼ ἀμφίπολος προχόῳ ἐπέχευε φέρουσα\n137 καλῇ χρυσείῃ, ὑπὲρ ἀργυρέοιο λέβητος,\n138 νίψασθαι· παρὰ δὲ ξεστὴν ἐτάνυσσε τράπεζαν.\n139 σῖτον δʼ αἰδοίη ταμίη παρέθηκε φέρουσα,\n140 εἴδατα πόλλʼ ἐπιθεῖσα, χαριζομένη παρεόντων·\n141 δαιτρὸς δὲ κρειῶν πίνακας παρέθηκεν ἀείρας\n142 παντοίων, παρὰ δέ σφι τίθει χρύσεια κύπελλα·\n143 κῆρυξ δʼ αὐτοῖσιν θάμʼ ἐπῴχετο οἰνοχοεύων.\n144 ἐς δʼ ἦλθον μνηστῆρες ἀγήνορες. οἱ μὲν ἔπειτα\n145 ἑξείης ἕζοντο κατὰ κλισμούς τε θρόνους τε,\n146 τοῖσι δὲ κήρυκες μὲν ὕδωρ ἐπὶ χεῖρας ἔχευαν,\n147 σῖτον δὲ δμῳαὶ παρενήνεον ἐν κανέοισιν,\n148 κοῦροι δὲ κρητῆρας ἐπεστέψαντο ποτοῖο.\n149 οἱ δʼ ἐπʼ ὀνείαθʼ ἑτοῖμα προκείμενα χεῖρας ἴαλλον.\n150 αὐτὰρ ἐπεὶ πόσιος καὶ ἐδητύος ἐξ ἔρον ἕντο"

        n: "1.151-200",

        text: "151 μνηστῆρες, τοῖσιν μὲν ἐνὶ φρεσὶν ἄλλα μεμήλει,\n152 μολπή τʼ ὀρχηστύς τε· τὰ γάρ τʼ ἀναθήματα δαιτός·\n153 κῆρυξ δʼ ἐν χερσὶν κίθαριν περικαλλέα θῆκεν\n154 Φημίῳ, ὅς ῥʼ ἤειδε παρὰ μνηστῆρσιν ἀνάγκῃ.\n155 ἦ τοι ὁ φορμίζων ἀνεβάλλετο καλὸν ἀείδειν.\n156 αὐτὰρ Τηλέμαχος προσέφη γλαυκῶπιν Ἀθήνην,\n157 ἄγχι σχὼν κεφαλήν, ἵνα μὴ πευθοίαθʼ οἱ ἄλλοι·\n158 ξεῖνε φίλʼ, ἦ καί μοι νεμεσήσεαι ὅττι κεν εἴπω;\n159 τούτοισιν μὲν ταῦτα μέλει, κίθαρις καὶ ἀοιδή,\n160 ῥεῖʼ, ἐπεὶ ἀλλότριον βίοτον νήποινον ἔδουσιν,\n161 ἀνέρος, οὗ δή που λεύκʼ ὀστέα πύθεται ὄμβρῳ\n162 κείμενʼ ἐπʼ ἠπείρου, ἢ εἰν ἁλὶ κῦμα κυλίνδει.\n163 εἰ κεῖνόν γʼ Ἰθάκηνδε ἰδοίατο νοστήσαντα,\n164 πάντες κʼ ἀρησαίατʼ ἐλαφρότεροι πόδας εἶναι\n165 ἢ ἀφνειότεροι χρυσοῖό τε ἐσθῆτός τε.\n166 νῦν δʼ ὁ μὲν ὣς ἀπόλωλε κακὸν μόρον, οὐδέ τις ἡμῖν\n167 θαλπωρή, εἴ πέρ τις ἐπιχθονίων ἀνθρώπων\n168 φῇσιν ἐλεύσεσθαι· τοῦ δʼ ὤλετο νόστιμον ἦμαρ.\n169 ἀλλʼ ἄγε μοι τόδε εἰπὲ καὶ ἀτρεκέως κατάλεξον·\n170 τίς πόθεν εἰς ἀνδρῶν; πόθι τοι πόλις ἠδὲ τοκῆες;\n171 ὁπποίης τʼ ἐπὶ νηὸς ἀφίκεο· πῶς δέ σε ναῦται\n172 ἤγαγον εἰς Ἰθάκην; τίνες ἔμμεναι εὐχετόωντο;\n173 οὐ μὲν γάρ τί σε πεζὸν ὀίομαι ἐνθάδʼ ἱκέσθαι.\n174 καί μοι τοῦτʼ ἀγόρευσον ἐτήτυμον, ὄφρʼ ἐὺ εἰδῶ,\n175 ἠὲ νέον μεθέπεις ἦ καὶ πατρώιός ἐσσι\n176 ξεῖνος, ἐπεὶ πολλοὶ ἴσαν ἀνέρες ἡμέτερον δῶ\n177 ἄλλοι, ἐπεὶ καὶ κεῖνος ἐπίστροφος ἦν ἀνθρώπων.\n178 τὸν δʼ αὖτε προσέειπε θεά, γλαυκῶπις Ἀθήνη·\n179 τοιγὰρ ἐγώ τοι ταῦτα μάλʼ ἀτρεκέως ἀγορεύσω.\n180 Μέντης Ἀγχιάλοιο δαΐφρονος εὔχομαι εἶναι\n181 υἱός, ἀτὰρ Ταφίοισι φιληρέτμοισιν ἀνάσσω.\n182 νῦν δʼ ὧδε ξὺν νηὶ κατήλυθον ἠδʼ ἑτάροισιν\n183 πλέων ἐπὶ οἴνοπα πόντον ἐπʼ ἀλλοθρόους ἀνθρώπους,\n184 ἐς Τεμέσην μετὰ χαλκόν, ἄγω δʼ αἴθωνα σίδηρον.\n185 νηῦς δέ μοι ἥδʼ ἕστηκεν ἐπʼ ἀγροῦ νόσφι πόληος,\n186 ἐν λιμένι Ῥείθρῳ ὑπὸ Νηίῳ ὑλήεντι.\n187 ξεῖνοι δʼ ἀλλήλων πατρώιοι εὐχόμεθʼ εἶναι\n188 ἐξ ἀρχῆς, εἴ πέρ τε γέροντʼ εἴρηαι ἐπελθὼν\n189 Λαέρτην ἥρωα, τὸν οὐκέτι φασὶ πόλινδε\n190 ἔρχεσθʼ, ἀλλʼ ἀπάνευθεν ἐπʼ ἀγροῦ πήματα πάσχειν\n191 γρηὶ σὺν ἀμφιπόλῳ, ἥ οἱ βρῶσίν τε πόσιν τε\n192 παρτιθεῖ, εὖτʼ ἄν μιν κάματος κατὰ γυῖα λάβῃσιν\n193 ἑρπύζοντʼ ἀνὰ γουνὸν ἀλωῆς οἰνοπέδοιο.\n194 νῦν δʼ ἦλθον· δὴ γάρ μιν ἔφαντʼ ἐπιδήμιον εἶναι,\n195 σὸν πατέρʼ· ἀλλά νυ τόν γε θεοὶ βλάπτουσι κελεύθου.\n196 οὐ γάρ πω τέθνηκεν ἐπὶ χθονὶ δῖος Ὀδυσσεύς,\n197 ἀλλʼ ἔτι που ζωὸς κατερύκεται εὐρέι πόντῳ\n198 νήσῳ ἐν ἀμφιρύτῃ, χαλεποὶ δέ μιν ἄνδρες ἔχουσιν\n199 ἄγριοι, οἵ που κεῖνον ἐρυκανόωσʼ ἀέκοντα.\n200 αὐτὰρ νῦν τοι ἐγὼ μαντεύσομαι, ὡς ἐνὶ θυμῷ"

        n: "1.201-250",

        text: "201 ἀθάνατοι βάλλουσι καὶ ὡς τελέεσθαι ὀίω,\n202 οὔτε τι μάντις ἐὼν οὔτʼ οἰωνῶν σάφα εἰδώς.\n203 οὔ τοι ἔτι δηρόν γε φίλης ἀπὸ πατρίδος αἴης\n204 ἔσσεται, οὐδʼ εἴ πέρ τε σιδήρεα δέσματʼ ἔχῃσιν·\n205 φράσσεται ὥς κε νέηται, ἐπεὶ πολυμήχανός ἐστιν.\n206 ἀλλʼ ἄγε μοι τόδε εἰπὲ καὶ ἀτρεκέως κατάλεξον,\n207 εἰ δὴ ἐξ αὐτοῖο τόσος πάϊς εἰς Ὀδυσῆος.\n208 αἰνῶς μὲν κεφαλήν τε καὶ ὄμματα καλὰ ἔοικας\n209 κείνῳ, ἐπεὶ θαμὰ τοῖον ἐμισγόμεθʼ ἀλλήλοισιν,\n210 πρίν γε τὸν ἐς Τροίην ἀναβήμεναι, ἔνθα περ ἄλλοι\n211 Ἀργείων οἱ ἄριστοι ἔβαν κοίλῃς ἐνὶ νηυσίν·\n212 ἐκ τοῦ δʼ οὔτʼ Ὀδυσῆα ἐγὼν ἴδον οὔτʼ ἔμʼ ἐκεῖνος.\n213 τὴν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα·\n214 τοιγὰρ ἐγώ τοι, ξεῖνε, μάλʼ ἀτρεκέως ἀγορεύσω.\n215 μήτηρ μέν τέ μέ φησι τοῦ ἔμμεναι, αὐτὰρ ἐγώ γε\n216 οὐκ οἶδʼ· οὐ γάρ πώ τις ἑὸν γόνον αὐτὸς ἀνέγνω.\n217 ὡς δὴ ἐγώ γʼ ὄφελον μάκαρός νύ τευ ἔμμεναι υἱὸς\n218 ἀνέρος, ὃν κτεάτεσσιν ἑοῖς ἔπι γῆρας ἔτετμε.\n219 νῦν δʼ ὃς ἀποτμότατος γένετο θνητῶν ἀνθρώπων,\n220 τοῦ μʼ ἔκ φασι γενέσθαι, ἐπεὶ σύ με τοῦτʼ ἐρεείνεις.\n221 τὸν δʼ αὖτε προσέειπε θεά, γλαυκῶπις Ἀθήνη·\n222 οὐ μέν τοι γενεήν γε θεοὶ νώνυμνον ὀπίσσω\n223 θῆκαν, ἐπεὶ σέ γε τοῖον ἐγείνατο Πηνελόπεια.\n224 ἀλλʼ ἄγε μοι τόδε εἰπὲ καὶ ἀτρεκέως κατάλεξον·\n225 τίς δαίς, τίς δὲ ὅμιλος ὅδʼ ἔπλετο; τίπτε δέ σε χρεώ;\n226 εἰλαπίνη ἠὲ γάμος; ἐπεὶ οὐκ ἔρανος τάδε γʼ ἐστίν·\n227 ὥς τέ μοι ὑβρίζοντες ὑπερφιάλως δοκέουσι\n228 δαίνυσθαι κατὰ δῶμα. νεμεσσήσαιτό κεν ἀνὴρ\n229 αἴσχεα πόλλʼ ὁρόων, ὅς τις πινυτός γε μετέλθοι.\n230 τὴν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα·\n231 ξεῖνʼ, ἐπεὶ ἂρ δὴ ταῦτά μʼ ἀνείρεαι ἠδὲ μεταλλᾷς,\n232 μέλλεν μέν ποτε οἶκος ὅδʼ ἀφνειὸς καὶ ἀμύμων\n233 ἔμμεναι, ὄφρʼ ἔτι κεῖνος ἀνὴρ ἐπιδήμιος ἦεν·\n234 νῦν δʼ ἑτέρως ἐβόλοντο θεοὶ κακὰ μητιόωντες,\n235 οἳ κεῖνον μὲν ἄιστον ἐποίησαν περὶ πάντων\n236 ἀνθρώπων, ἐπεὶ οὔ κε θανόντι περ ὧδʼ ἀκαχοίμην,\n237 εἰ μετὰ οἷς ἑτάροισι δάμη Τρώων ἐνὶ δήμῳ,\n238 ἠὲ φίλων ἐν χερσίν, ἐπεὶ πόλεμον τολύπευσεν.\n239 τῷ κέν οἱ τύμβον μὲν ἐποίησαν Παναχαιοί,\n240 ἠδέ κε καὶ ᾧ παιδὶ μέγα κλέος ἤρατʼ ὀπίσσω.\n241 νῦν δέ μιν ἀκλειῶς ἅρπυιαι ἀνηρείψαντο·\n242 οἴχετʼ ἄιστος ἄπυστος, ἐμοὶ δʼ ὀδύνας τε γόους τε\n243 κάλλιπεν. οὐδέ τι κεῖνον ὀδυρόμενος στεναχίζω\n244 οἶον, ἐπεί νύ μοι ἄλλα θεοὶ κακὰ κήδεʼ ἔτευξαν.\n245 ὅσσοι γὰρ νήσοισιν ἐπικρατέουσιν ἄριστοι,\n246 Δουλιχίῳ τε Σάμῃ τε καὶ ὑλήεντι Ζακύνθῳ,\n247 ἠδʼ ὅσσοι κραναὴν Ἰθάκην κάτα κοιρανέουσιν,\n248 τόσσοι μητέρʼ ἐμὴν μνῶνται, τρύχουσι δὲ οἶκον.\n249 ἡ δʼ οὔτʼ ἀρνεῖται στυγερὸν γάμον οὔτε τελευτὴν\n250 ποιῆσαι δύναται· τοὶ δὲ φθινύθουσιν ἔδοντες"

        text: "251 οἶκον ἐμόν· τάχα δή με διαρραίσουσι καὶ αὐτόν.\n252 τὸν δʼ ἐπαλαστήσασα προσηύδα Παλλὰς Ἀθήνη·\n253 ὢ πόποι, ἦ δὴ πολλὸν ἀποιχομένου Ὀδυσῆος\n254 δεύῃ, ὅ κε μνηστῆρσιν ἀναιδέσι χεῖρας ἐφείη.\n255 εἰ γὰρ νῦν ἐλθὼν δόμου ἐν πρώτῃσι θύρῃσι\n256 σταίη, ἔχων πήληκα καὶ ἀσπίδα καὶ δύο δοῦρε,\n257 τοῖος ἐὼν οἷόν μιν ἐγὼ τὰ πρῶτʼ ἐνόησα\n258 οἴκῳ ἐν ἡμετέρῳ πίνοντά τε τερπόμενόν τε,\n259 ἐξ Ἐφύρης ἀνιόντα παρʼ Ἴλου Μερμερίδαο—\n260 ᾤχετο γὰρ καὶ κεῖσε θοῆς ἐπὶ νηὸς Ὀδυσσεὺς\n261 φάρμακον ἀνδροφόνον διζήμενος, ὄφρα οἱ εἴη\n262 ἰοὺς χρίεσθαι χαλκήρεας· ἀλλʼ ὁ μὲν οὔ οἱ\n263 δῶκεν, ἐπεί ῥα θεοὺς νεμεσίζετο αἰὲν ἐόντας,\n264 ἀλλὰ πατήρ οἱ δῶκεν ἐμός· φιλέεσκε γὰρ αἰνῶς—\n265 τοῖος ἐὼν μνηστῆρσιν ὁμιλήσειεν Ὀδυσσεύς·\n266 πάντες κʼ ὠκύμοροί τε γενοίατο πικρόγαμοί τε.\n267 ἀλλʼ ἦ τοι μὲν ταῦτα θεῶν ἐν γούνασι κεῖται,\n268 ἤ κεν νοστήσας ἀποτίσεται, ἦε καὶ οὐκί,\n269 οἷσιν ἐνὶ μεγάροισι· σὲ δὲ φράζεσθαι ἄνωγα,\n270 ὅππως κε μνηστῆρας ἀπώσεαι ἐκ μεγάροιο.\n271 εἰ δʼ ἄγε νῦν ξυνίει καὶ ἐμῶν ἐμπάζεο μύθων·\n272 αὔριον εἰς ἀγορὴν καλέσας ἥρωας Ἀχαιοὺς\n273 μῦθον πέφραδε πᾶσι, θεοὶ δʼ ἐπὶ μάρτυροι ἔστων.\n274 μνηστῆρας μὲν ἐπὶ σφέτερα σκίδνασθαι ἄνωχθι,\n275 μητέρα δʼ, εἴ οἱ θυμὸς ἐφορμᾶται γαμέεσθαι,\n276 ἂψ ἴτω ἐς μέγαρον πατρὸς μέγα δυναμένοιο·\n277 οἱ δὲ γάμον τεύξουσι καὶ ἀρτυνέουσιν ἔεδνα\n278 πολλὰ μάλʼ, ὅσσα ἔοικε φίλης ἐπὶ παιδὸς ἕπεσθαι.\n279 σοὶ δʼ αὐτῷ πυκινῶς ὑποθήσομαι, αἴ κε πίθηαι·\n280 νῆʼ ἄρσας ἐρέτῃσιν ἐείκοσιν, ἥ τις ἀρίστη,\n281 ἔρχεο πευσόμενος πατρὸς δὴν οἰχομένοιο,\n282 ἤν τίς τοι εἴπῃσι βροτῶν, ἢ ὄσσαν ἀκούσῃς\n283 ἐκ Διός, ἥ τε μάλιστα φέρει κλέος ἀνθρώποισι.\n284 πρῶτα μὲν ἐς Πύλον ἐλθὲ καὶ εἴρεο Νέστορα δῖον,\n285 κεῖθεν δὲ Σπάρτηνδε παρὰ ξανθὸν Μενέλαον·\n286 ὃς γὰρ δεύτατος ἦλθεν Ἀχαιῶν χαλκοχιτώνων.\n287 εἰ μέν κεν πατρὸς βίοτον καὶ νόστον ἀκούσῃς,\n288 ἦ τʼ ἂν τρυχόμενός περ ἔτι τλαίης ἐνιαυτόν·\n289 εἰ δέ κε τεθνηῶτος ἀκούσῃς μηδʼ ἔτʼ ἐόντος,\n290 νοστήσας δὴ ἔπειτα φίλην ἐς πατρίδα γαῖαν\n291 σῆμά τέ οἱ χεῦαι καὶ ἐπὶ κτέρεα κτερεΐξαι\n292 πολλὰ μάλʼ, ὅσσα ἔοικε, καὶ ἀνέρι μητέρα δοῦναι.\n293 αὐτὰρ ἐπὴν δὴ ταῦτα τελευτήσῃς τε καὶ ἔρξῃς,\n294 φράζεσθαι δὴ ἔπειτα κατὰ φρένα καὶ κατὰ θυμὸν\n295 ὅππως κε μνηστῆρας ἐνὶ μεγάροισι τεοῖσι\n296 κτείνῃς ἠὲ δόλῳ ἢ ἀμφαδόν· οὐδέ τί σε χρὴ\n297 νηπιάας ὀχέειν, ἐπεὶ οὐκέτι τηλίκος ἐσσι.\n298 ἢ οὐκ ἀίεις οἷον κλέος ἔλλαβε δῖος Ὀρέστης\n299 πάντας ἐπʼ ἀνθρώπους, ἐπεὶ ἔκτανε πατροφονῆα,\n300 Αἴγισθον δολόμητιν, ὅ οἱ πατέρα κλυτὸν ἔκτα;"

const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, type){
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (type?' '+type:'');
  clearTimeout(toastTimer);

function addXP(n, label){
  S.xp += n;
  const oldLvl = levelOf(S.xp - n);
  const newLvl = levelOf(S.xp);
  toast(`+${n} XP — ${label||''}`, 'xp');
  if(newLvl > oldLvl){
    setTimeout(()=> toast(`✦ ${LEVELS[newLvl].grk} 단계로 승급! (${LEVELS[newLvl].ko})`,'xp'), 600);
  }
  checkBadges();
  refreshBanner();
  saveState();

function awardBadge(id){
  if(S.badges.includes(id)) return;
  S.badges.push(id);
  const b = BADGES.find(x=>x.id===id);
  setTimeout(()=> toast(`🏺 명예: ${b.ko}`,'xp'), 1100);
  saveState();
}
function checkBadges(){
  if(S.hadPerfect) awardBadge('first-perfect');
  if(S.vocabCorrectCount >= 50)  awardBadge('voc-50');
  if(S.vocabCorrectCount >= 200) awardBadge('voc-200');
  if(S.topicsStudied.length >= 17) awardBadge('gram-17');
  if(S.topicsStudied.length >= 34) awardBadge('gram-34');
  if(S.readDone.length >= 10) awardBadge('read-10');
  if(S.readDone.length >= READINGS.length) awardBadge('read-all');
  // 호메로스: 발췌 hom-* 모두 + 일리아드/오디세이 1권 중 하나
  const homerExcerpts = READINGS.filter(r=>r.id.startsWith('hom-')).map(r=>r.id);
  const homerDone = homerExcerpts.length && homerExcerpts.every(id=>S.readDone.includes(id));
  const epicDone = S.worksFinished.includes('homer-iliad-1') || S.worksFinished.includes('homer-odyssey-1');
  if(homerDone || epicDone) awardBadge('homer');
  if(S.streak >= 7) awardBadge('streak-7');
  if(S.analysisWritten >= 5) awardBadge('analysis');
  if(levelOf(S.xp) >= LEVELS.length-1) awardBadge('zeus');
  // 새 전집 배지
  if(S.worksFinished.length >= 1) awardBadge('work-1');
  if(S.worksFinished.length >= 3) awardBadge('work-3');
  if(S.worksFinished.includes('plato-apology')) awardBadge('apology');
  if(S.worksFinished.includes('aeschylus-persians') || S.worksFinished.includes('plutarch-themistocles')) awardBadge('salamis');
}

const ALL_VOCAB = [].concat(TEXTBOOK_W).concat(DCC_W);
const POS_LABELS = {N:'명사',V:'동사',A:'형용사',D:'부사',C:'접속사',P:'전치사',PR:'대명사',NUM:'수사',ART:'관사'};
function uniqByGreek(arr){
  const seen = new Map();
  for(const w of arr){ if(!seen.has(w.g)) seen.set(w.g, w); }
  return [...seen.values()];
}
function randPick(arr,n){
  const c=[...arr]; const out=[];
  for(let i=0;i<n && c.length;i++){
    const idx = Math.floor(Math.random()*c.length);
    out.push(c.splice(idx,1)[0]);
  }
  return out;
}

// ─── 어휘 필터링 / 풀 빌더 ───────────────────────────────────────────────────
const VOCAB_FILTERS = { source:'all', pos:'all', lessonGroup:'all' };
function lessonGroupFn(g){
  if(g==='all') return _=>true;
  if(g==='textbook-early') return w => w.l>=3 && w.l<=12;
  if(g==='textbook-mid')   return w => w.l>=13 && w.l<=24;
  if(g==='textbook-late')  return w => w.l>=25 && w.l<=40;
  if(g==='dcc-100')        return w => w.l===501;
  if(g==='dcc-200')        return w => w.l===502;
  if(g==='dcc-300')        return w => w.l===503;
  if(g==='dcc-400')        return w => w.l===504;
  if(g==='dcc-523')        return w => w.l===505;
  return _=>true;
}
function buildVocabPool(){
  const f = VOCAB_FILTERS;
  let pool = ALL_VOCAB;
  if(f.source==='textbook') pool = TEXTBOOK_W;
  else if(f.source==='dcc') pool = DCC_W;
  pool = pool.filter(lessonGroupFn(f.lessonGroup));
  if(f.pos!=='all') pool = pool.filter(w=>w.pos===f.pos);
  return pool;
}

// SRS: 오답함의 단어가 풀에 있으면 가중치 ↑
function pickQuestion(pool){
  if(pool.length===0) return null;
  // 30% 확률로 오답함에서 픽 (있을 경우)
  const wrongIds = Object.keys(S.wrongRoom).filter(g => pool.some(w=>w.g===g));
  if(wrongIds.length && Math.random() < 0.35){
    const g = wrongIds[Math.floor(Math.random()*wrongIds.length)];
    return pool.find(w=>w.g===g);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

  document.getElementById('start-mc-g2k').addEventListener('click',()=> startQuiz('mc','g2k', buildVocabPool()));
  document.getElementById('start-mc-k2g').addEventListener('click',()=> startQuiz('mc','k2g', buildVocabPool()));
  document.getElementById('start-typed').addEventListener('click',()=> startQuiz('typed','g2k', buildVocabPool()));
  const wb = document.getElementById('start-wrong');
  if(wb) wb.addEventListener('click',()=>{
    const wrongList = Object.values(S.wrongRoom).map(x=>({g:x.lemma||x.g||x.greek, r:'', pos:x.pos||'', l:0, ko:x.ko, en:''}));
    if(wrongList.length) startQuiz('mc','g2k', wrongList, true);
  });
}
function startQuiz(mode, dir, pool, isWrong){
  if(pool.length<4){ toast('풀이 너무 작습니다 (최소 4개 필요).'); return; }
  vocabSession = { qIdx:0, total:Math.min(10, pool.length), right:0, wrong:0, mode, dir, q:null, pool, isWrong:!!isWrong };
  nextQuestion();
}
function nextQuestion(){
  const s = vocabSession;
  if(s.qIdx >= s.total){ finishQuiz(); return; }
  const q = pickQuestion(s.pool);
  s.q = q;
  const area = document.getElementById('quiz-area');
  S.vocabSeen += 1; saveState();

  const promptGr = s.dir==='g2k';
  const prompt = promptGr
    ? `<div class="quiz-prompt grk">${q.g}${q.r?` <span style="font-size:14px;color:var(--clay-d);font-family:var(--font-grk)">${q.r}</span>`:''}</div>`
    : `<div class="quiz-prompt ko">${q.ko}</div>`;
  const sub = promptGr ? `${POS_LABELS[q.pos]||q.pos}${q.note?' · '+q.note:''}` : `<span class="grk" style="opacity:.5">위의 한국어 뜻에 맞는 그리스어를 고르세요</span>`;

  if(s.mode==='mc'){
    const distractors = randPick(s.pool.filter(x=>x.g!==q.g), 3);
    const opts = [...distractors, q].sort(()=>Math.random()-.5);
    area.innerHTML = `
      <div class="quiz-card fade-in">
        ${prompt}
        <div class="quiz-sub">${sub}</div>
        <div class="options">
          ${opts.map(o=>`<button class="opt" data-g="${o.g}">${promptGr?o.ko:`<span class="grk">${o.g}</span>${o.r?' '+o.r:''}`}</button>`).join('')}
        </div>
        <div id="fb"></div>
        <div style="margin-top:14px;font-size:11px;color:var(--clay-d)">${s.qIdx+1} / ${s.total}</div>
      </div>
    `;
    area.querySelectorAll('.opt').forEach(b=> b.addEventListener('click',()=> answerMC(b, q, opts)));
  } else {
    area.innerHTML = `
      <div class="quiz-card fade-in">
        ${prompt}
        <div class="quiz-sub">${sub}</div>
        <input class="input" id="answer-input" autocomplete="off" placeholder="한국어 뜻을 입력하세요…">
        <div class="btn-row" style="margin-top:12px;justify-content:center">
          <button class="btn" id="submit-typed">제출</button>
          <button class="btn btn-o btn-sm" id="show-typed">모르겠다</button>
        </div>
        <div id="fb"></div>
        <div style="margin-top:14px;font-size:11px;color:var(--clay-d)">${s.qIdx+1} / ${s.total}</div>
      </div>
    `;
    const inp = document.getElementById('answer-input');
    inp.focus();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('submit-typed').click(); });
    document.getElementById('submit-typed').addEventListener('click',()=> answerTyped(q));
    document.getElementById('show-typed').addEventListener('click',()=> answerTyped(q, true));
  }
}
function normalizeAnswer(s){ return (s||'').replace(/\s+/g,' ').replace(/[,\.\(\)~·…!?]/g,'').trim().toLowerCase(); }
function answerMC(btn, q, opts){
  const chosen = btn.dataset.g;
  const correct = (chosen === q.g);
  const fb = document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.g === q.g) o.classList.add('right');
    else if(o === btn && !correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  if(correct){
    vocabSession.right += 1;
    S.vocabCorrectCount += 1;
    // 오답함 streak 처리
    bumpWrongRoom(q.g, +1);
    fb.innerHTML = `<div class="feedback ok">✓ 정답 — <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  } else {
    vocabSession.wrong += 1;
    bumpWrongRoom(q.g, -1, q);
    fb.innerHTML = `<div class="feedback bad">✗ 오답 — 정답: <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  }
  setTimeout(()=>{ vocabSession.qIdx += 1; nextQuestion(); }, correct?1100:1700);
}
function answerTyped(q, giveUp){
  const inp = document.getElementById('answer-input');
  const userA = giveUp ? '' : inp.value;
  const fb = document.getElementById('fb');
  // 입력형은 한국어 뜻을 입력. 매칭: 사용자 답이 정답 ko 의 첫 단어/구를 포함하면 정답
  const target = q.ko.split(/[,·\/;]/)[0].trim();
  const ok = !giveUp && (normalizeAnswer(userA).includes(normalizeAnswer(target)) || normalizeAnswer(target).includes(normalizeAnswer(userA)) && userA.length>=2);
  if(ok){
    vocabSession.right += 1;
    S.vocabCorrectCount += 1;
    bumpWrongRoom(q.g, +1);
    fb.innerHTML = `<div class="feedback ok">✓ 정답 — <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  } else {
    vocabSession.wrong += 1;
    bumpWrongRoom(q.g, -1, q);
    fb.innerHTML = `<div class="feedback bad">✗ ${giveUp?'정답':'오답'} — <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  }
  document.getElementById('submit-typed').disabled = true;
  document.getElementById('show-typed').disabled = true;
  setTimeout(()=>{ vocabSession.qIdx += 1; nextQuestion(); }, ok?1100:1700);
}
function bumpWrongRoom(g, delta, q){
  if(delta < 0){
    // 오답 → 추가/카운트 증가
    if(!S.wrongRoom[g]) S.wrongRoom[g] = {miss:0, streak:0, lemma:g, ko:q?q.ko:'', pos:q?q.pos:''};
    S.wrongRoom[g].miss += 1;
    S.wrongRoom[g].streak = 0;
  } else {
    // 정답 → streak 증가; 3연속이면 졸업
    if(S.wrongRoom[g]){
      S.wrongRoom[g].streak = (S.wrongRoom[g].streak||0) + 1;
      if(S.wrongRoom[g].streak >= 3){
        delete S.wrongRoom[g];
        addXP(8, '오답함 졸업');
        // 오답함이 비었으면 배지
        if(Object.keys(S.wrongRoom).length === 0){
          awardBadge('wrong-zero');
        }
      }
    }
  }
  saveState();
}
function finishQuiz(){
  const s = vocabSession;
  const total = s.right + s.wrong;
  const pct = total>0 ? Math.round(s.right*100/total) : 0;
  let bonus = 0;
  if(s.right === s.total && s.total>=5){
    bonus = 5 * s.total;
    S.hadPerfect = true;
  }
  const xpGain = s.right*10 + bonus;
  if(xpGain>0) addXP(xpGain, `정답 ${s.right}/${s.total}${bonus?` (만점 보너스 +${bonus})`:''}`);
  document.getElementById('quiz-area').innerHTML = `

      <div style="font-size:13px;color:var(--clay-d)">획득 XP: <b>${xpGain}</b>${bonus?` (만점 보너스 +${bonus})`:''}</div>
      ${s.wrong>0?`<div style="font-size:12px;color:var(--clay-d);margin-top:6px">틀린 단어는 오답함에 자동 등록 — 3회 연속 맞히면 졸업합니다.</div>`:''}
      <div class="btn-row" style="margin-top:12px">

  `;
}

window.startGrammarDrill = startGrammarDrill;
let grammarSession = null;
function startGrammarDrill(id){
  const t = TOPICS.find(x=>x.id===id);
  if(!t || !t.items || t.items.length<2){ toast('이 주제는 드릴이 준비되지 않았습니다.'); return; }
  grammarSession = { topic:t, idx:0, total:Math.min(6, t.items.length), right:0, wrong:0, items:[...t.items].sort(()=>Math.random()-.5) };
  if(!S.topicsStudied.includes(id)){ S.topicsStudied.push(id); saveState(); }
  nextGrammarQ();
}
function nextGrammarQ(){
  const s = grammarSession;
  if(s.idx >= s.total){ finishGrammar(); return; }
  const item = s.items[s.idx];
  // 정답 + 다른 3개 (같은 주제에서)
  const distractors = randPick(s.topic.items.filter(x=>x.info!==item.info), 3);
  const opts = [...distractors, item].sort(()=>Math.random()-.5);
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="setTab('grammar')">← 종료</button>

      <div class="quiz-prompt grk">${item.form}</div>

      </div>
      <div id="g-fb"></div>
    </div>
  `;
  view.querySelectorAll('.opt').forEach(b=> b.addEventListener('click',()=> answerGrammar(b, item, opts)));
}
function answerGrammar(btn, item, opts){
  const chosen = btn.dataset.info;
  const correct = (chosen === item.info);
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.info === item.info) o.classList.add('right');
    else if(o === btn && !correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const fb = document.getElementById('g-fb');
  if(correct){
    grammarSession.right += 1;
    S.grammarCorrectCount += 1;
    fb.innerHTML = `<div class="feedback ok">✓ 정답</div>`;
  } else {
    grammarSession.wrong += 1;
    fb.innerHTML = `<div class="feedback bad">✗ 정답: ${item.info}</div>`;
  }
  setTimeout(()=>{ grammarSession.idx += 1; nextGrammarQ(); }, correct?900:1500);
}
function finishGrammar(){
  const s = grammarSession;

function renderWorkSection(workId, secIdx){
  const w = WORKS.find(x=>x.id===workId);
  if(!w) return;
  const sec = w.sections[secIdx];
  if(!sec) return;
  const done = (S.sectionsDone[w.id]||[]).includes(sec.n);
  const lines = sec.text.split('\n').map(line=>{
    if(!line.trim()) return '<div style="height:6px"></div>';
    const words = line.split(/(\s+)/).map(tok=>{
      if(/^\s+$/.test(tok)) return tok;
      const clean = stripWord(tok);
      if(!clean) return tok;
      return `<span class="w" data-w="${encodeURIComponent(clean)}">${tok}</span>`;
    }).join('');
    return `<div>${words}</div>`;
  }).join('');
  const noteKey = `${workId}:${sec.n}`;
  const note = (S.workNotes[workId] && S.workNotes[workId][sec.n]) || '';
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="window._renderWork('${workId}')">← 섹션</button>
    <h2 class="view-title fade-in" style="margin-top:10px">${w.workKo}</h2>
    <div class="cite-line">${w.author}, <i>${w.work}</i> ${sec.label}</div>

    <div class="card">
      <div class="passage" style="font-size:17px;line-height:2.1">${lines}</div>
      <div class="hint">📌 단어를 누르면 Perseus Morpheus + Logeion 사전이 새 창에서 열립니다.</div>
    </div>

    <div class="memo-block">
      <label>이 섹션 메모</label>
      <textarea class="input" id="memo-sec" placeholder="번역·구문·어휘 메모…">${note}</textarea>
    </div>

    <div class="btn-row" style="margin-top:14px;justify-content:space-between">
      <div style="display:flex;gap:8px">
        ${secIdx>0?`<button class="btn btn-sm btn-o" onclick="window._renderWorkSection('${workId}',${secIdx-1})">← 이전</button>`:''}
        ${secIdx<w.sections.length-1?`<button class="btn btn-sm btn-o" onclick="window._renderWorkSection('${workId}',${secIdx+1})">다음 →</button>`:''}
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" id="save-sec-memo">저장</button>
        <button class="btn btn-sm ${done?'btn-o':''}" id="mark-sec-done">${done?'✓ 완독':'완독 (+20 XP)'}</button>
      </div>
    </div>
  `;
  view.querySelectorAll('.w').forEach(el=> el.addEventListener('click', ()=> openLookup(el.dataset.w)));
  document.getElementById('save-sec-memo').addEventListener('click', ()=>{
    if(!S.workNotes[workId]) S.workNotes[workId] = {};
    S.workNotes[workId][sec.n] = document.getElementById('memo-sec').value;
    saveState();
    toast('메모 저장됨');
  });
  document.getElementById('mark-sec-done').addEventListener('click', ()=>{
    if(!S.sectionsDone[workId]) S.sectionsDone[workId] = [];
    if(!S.sectionsDone[workId].includes(sec.n)){
      S.sectionsDone[workId].push(sec.n);
      addXP(20, '섹션 완독');
      // 작품 전체 완독 체크
      if(S.sectionsDone[workId].length === w.sections.length && !S.worksFinished.includes(workId)){
        S.worksFinished.push(workId);
        setTimeout(()=> addXP(200, `${w.workKo} 전권 완독`), 600);
      }
      saveState();
      renderWorkSection(workId, secIdx);
    }
  });
}

function stripWord(w){
  // 그리스어 단어에서 문장부호·생략 부호 제거
  return w.replace(/[,;.·"'᾽’‘()\[\]…—–\-?!]/g,'').trim();
}
function renderPassage(id){
  const r = READINGS.find(x=>x.id===id);
  if(!r) return;
  // 한 줄씩 분리 후 단어별로 wrap
  const lines = r.greek.split('\n').map((line,i)=>{

    const words = line.split(/(\s+)/).map(tok=>{
      if(/^\s+$/.test(tok)) return tok;
      const clean = stripWord(tok);
      if(!clean) return tok;
      return `<span class="w" data-w="${encodeURIComponent(clean)}">${tok}</span>`;
    }).join('');
    return `<div><span class="pn">${num}</span>${words}</div>`;
  }).join('');
  const done = S.readDone.includes(id);

    body = `

        <div style="background:var(--ivory-d);border:1px solid var(--clay);border-radius:8px;padding:11px 13px;margin-bottom:8px">

          <div style="font-family:var(--font-grk);font-size:18px;color:var(--black-glaze);font-weight:600">표제어 → <span style="color:var(--terracotta-d)">${a.l}</span></div>
          <div style="font-size:13px;color:var(--black-glaze-l);margin-top:4px">${a.p}</div>
          ${a.k?`<div style="font-size:13px;color:var(--terracotta-d);margin-top:6px;font-weight:600">의미: ${a.k}</div>`:`<div style="font-size:11px;color:var(--clay-d);margin-top:6px;font-style:italic">한국어 풀이 미수록 — 외부 사전 참조</div>`}
        </div>
      `).join('')}
      <div class="btn-row" style="margin-top:14px;flex-wrap:wrap">
        <a class="btn btn-sm btn-o" href="${perseusURL}" target="_blank" rel="noopener">Perseus Morpheus ↗</a>

      <div style="font-size:12px;color:var(--clay-d);margin-bottom:14px;line-height:1.5">이 작품은 AGDT 검증 분석이 등록되지 않았습니다.<br>외부 사전에서 형태·의미를 확인하세요.</div>
      <div class="btn-row" style="flex-wrap:wrap">
        <a class="btn btn-sm" href="${perseusURL}" target="_blank" rel="noopener">Perseus Morpheus ↗</a>
        <a class="btn btn-sm btn-g" href="${logeionURL}" target="_blank" rel="noopener">Logeion 사전 ↗</a>
        <button class="btn btn-sm btn-o" onclick="window._closeModal()">닫기</button>

async function loadLeaderboard(){
  const slot = document.getElementById('leaderboard-slot');
  if(!slot) return;
  // 공유 미지원 환경
  if(!STORAGE.supportsShared){
    slot.innerHTML = `<div class="card">
      <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">라이브 순위</b>
      <div class="hint" style="margin-top:10px;line-height:1.6">
        현재 환경(${STORAGE.label})은 사용자 간 공유 저장소를 지원하지 않습니다.<br>
        Claude 아티팩트 환경에서 이 파일을 열면 같은 링크를 공유한 모든 분들의 진행이 함께 표시됩니다.
      </div>
    </div>`;
    return;
  }
  // 참여 동의 받기
  if(!S.joinLeaderboard){
    slot.innerHTML = `<div class="card warm">
      <b style="font-size:14px;color:var(--terracotta-d)">라이브 순위에 참여</b>
      <div class="hint" style="margin-top:8px;color:var(--black-glaze-l);line-height:1.6">
        같은 링크를 사용하는 다른 분들과 진행 상황을 공유합니다. 표시 이름을 정해주세요 — XP·레벨·완독 통계가 공개되며 본문 메모는 공개되지 않습니다.
      </div>
      <input class="input" id="dn-input" placeholder="예: 김연구원 / Anonymous Scholar" maxlength="24" style="margin-top:12px" value="${escapeHtml(S.displayName)}">
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-sm" id="dn-save">참여하기</button>
        <button class="btn btn-sm btn-o" id="dn-skip">건너뛰기</button>
      </div>
    </div>`;
    const saveBtn = document.getElementById('dn-save');
    const skipBtn = document.getElementById('dn-skip');
    saveBtn.addEventListener('click', async () => {
      const v = document.getElementById('dn-input').value.trim();
      if(!v){ toast('이름을 입력하세요'); return; }
      S.displayName = v.slice(0,24);
      S.joinLeaderboard = true;
      await saveState();
      // 즉시 동기화 (1.5초 디바운스 우회)
      try{
        await STORAGE.setShared('lb:' + S.userId, JSON.stringify({
          name:S.displayName, userId:S.userId, level:levelOf(S.xp), xp:S.xp,
          vocab:S.vocabCorrectCount, topics:S.topicsStudied.length,
          works:S.worksFinished.length, reads:S.readDone.length,
          badges:S.badges.length, streak:S.streak, lastSeen:Date.now()
        }));
      }catch(e){}
      loadLeaderboard();
    });
    skipBtn.addEventListener('click', () => {
      slot.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--clay-d);text-align:center">라이브 순위 비참여 — <button class="minlink" id="rejoin-lb" style="background:none;border:none;color:var(--terracotta-d);cursor:pointer;padding:0">참여하기</button></div></div>`;
      document.getElementById('rejoin-lb').addEventListener('click', () => { S.joinLeaderboard = false; loadLeaderboard(); });
    });
    return;
  }
  // 순위표 fetch
  try{
    const list = await STORAGE.listShared('lb:');
    const keys = (list && list.keys) || [];
    const entries = [];
    for(const k of keys){
      try{
        const r = await STORAGE.getShared(k);
        if(r && r.value){
          const e = JSON.parse(r.value);
          e._key = k;
          entries.push(e);
        }
      }catch(e){}
    }
    entries.sort((a,b) => (b.xp||0) - (a.xp||0));
    const myRank = entries.findIndex(e => e.userId === S.userId) + 1;
    const fmtAgo = (ts) => {
      if(!ts) return '';
      const mins = (Date.now() - ts) / 60000;
      if(mins < 1) return '방금';
      if(mins < 60) return Math.round(mins) + '분 전';
      if(mins < 1440) return Math.round(mins/60) + '시간 전';
      return Math.round(mins/1440) + '일 전';
    };
    if(entries.length === 0){
      slot.innerHTML = `<div class="card">
        <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">라이브 순위</b>
        <div class="hint" style="margin-top:8px">아직 참여자가 없습니다. 다른 분들이 참여하면 여기에 표시됩니다.</div>
      </div>`;
      return;
    }
    slot.innerHTML = `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">라이브 순위 (${entries.length}명)</b>
        <span style="font-size:11px;color:var(--terracotta-d);font-weight:600">내 순위: ${myRank > 0 ? myRank + '위' : '미참여'}</span>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table style="width:100%;font-size:12.5px;border-collapse:collapse;min-width:340px">
        <thead>
          <tr style="background:var(--ivory-d)">
            <th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--clay);font-size:11px">#</th>
            <th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--clay);font-size:11px">이름</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">XP</th>
            <th style="text-align:center;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">레벨</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">어휘</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">전집</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">활동</th>
          </tr>
        </thead>
        <tbody>
        ${entries.map((e,i) => {
          const me = e.userId === S.userId;
          const medal = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':''));
          return `<tr style="${me ? 'background:linear-gradient(90deg,var(--ivory-d),transparent)' : ''}">
            <td style="padding:7px 8px;border-bottom:1px solid var(--clay);opacity:.7">${medal||(i+1)}</td>
            <td style="padding:7px 8px;border-bottom:1px solid var(--clay);font-weight:${me?'700':'500'};color:${me?'var(--terracotta-d)':'inherit'}">${escapeHtml(e.name)}${me?' <span style="font-size:10px;opacity:.7">(나)</span>':''}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-variant-numeric:tabular-nums">${(e.xp||0).toLocaleString()}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:center;font-family:var(--font-grk);color:var(--terracotta-d);font-size:13px">${LEVELS[e.level||0].grk}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-variant-numeric:tabular-nums">${e.vocab||0}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-variant-numeric:tabular-nums">${e.works||0}/${WORKS.length}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-size:10px;color:var(--clay-d)">${fmtAgo(e.lastSeen)}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      </div>
      <div class="hint" style="margin-top:10px">
        진행은 자동 동기화됩니다 · 이름 ‘<b>${escapeHtml(S.displayName)}</b>’ ·
        <button class="minlink" id="lb-change" style="background:none;border:none;color:var(--terracotta-d);cursor:pointer;padding:0;font-size:11px">이름 바꾸기</button> ·
        <button class="minlink" id="lb-leave" style="background:none;border:none;color:var(--bad);cursor:pointer;padding:0;font-size:11px">참여 취소</button> ·
        <button class="minlink" id="lb-refresh" style="background:none;border:none;color:var(--clay-d);cursor:pointer;padding:0;font-size:11px">새로고침</button>
      </div>
    </div>`;
    document.getElementById('lb-change').addEventListener('click', () => {
      S.joinLeaderboard = false;
      loadLeaderboard();
    });
    document.getElementById('lb-leave').addEventListener('click', async () => {
      if(!confirm('순위에서 자신의 항목을 제거합니다. 진행 데이터는 보존됩니다. 계속하시겠습니까?')) return;
      try{ await STORAGE.delShared('lb:' + S.userId); }catch(e){}
      S.joinLeaderboard = false;
      S.displayName = '';
      await saveState();
      loadLeaderboard();
    });
    document.getElementById('lb-refresh').addEventListener('click', loadLeaderboard);
  }catch(e){
    slot.innerHTML = `<div class="card"><b>순위 로딩 실패</b><div class="hint">${escapeHtml(e.message||String(e))}</div></div>`;
  }
}

// ─── 초기화 ──────────────────────────────────────────────────────────────────
async function init(){
  const saved = await load();
  if(saved){
    // 기존 키를 모두 보존하며 병합 (새 필드는 기본값 유지)
    Object.assign(S, saved);
  }
  // 익명 ID 생성 (한 번만)
  if(!S.userId){
    S.userId = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  }
  updateStreak();
  saveState();
  refreshBanner();
  setTab('home');
}
init();

})();

</script>

</body>
</html>
