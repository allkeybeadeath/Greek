    <div class="btn-row" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm btn-o" id="export-data">📤 내보내기 (JSON)</button>
      <button class="btn btn-sm btn-o" id="import-data">📥 가져오기 (JSON)</button>
      <button class="btn btn-sm btn-o" id="reset-data" style="color:var(--bad);border-color:var(--bad)">전체 초기화</button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none">
    <div style="font-size:11px;color:var(--clay-d);margin-top:8px;line-height:1.6;font-style:italic">
      📋 CIM Lab 다중 사용자 안내: 각자 학습 후 <b>내보내기</b>로 JSON 백업을 보관하고,
      다음 세션에서 <b>가져오기</b>로 복원하면 학습 진척이 분리됩니다.
      라이브 순위 ID·표시 이름은 가져오기 시 현재 기기 값이 유지됩니다.
    </div>
  `;
  document.getElementById('export-data').addEventListener('click',()=>{
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (S.displayName || 'anonymous').replace(/[^\w가-힣ㄱ-ㅎㅏ-ㅣ-]/g, '_').slice(0, 24);
    a.href = u; a.download = `paideia-${safeName}-${todayStr()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(u), 200);
    toast('JSON 파일 다운로드 완료');
  });
  document.getElementById('import-data').addEventListener('click', ()=>{
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    let data;
    try {
      const text = await f.text();
      data = JSON.parse(text);
    } catch(err){
      toast('파일을 읽을 수 없습니다 (JSON 형식 오류)');
      e.target.value = '';
      return;
    }
    // 핵심 필드 validate
    if(typeof data !== 'object' || data === null || typeof data.xp !== 'number'){
      toast('Paideia 백업 파일이 아닙니다');
      e.target.value = '';
      return;
    }
    // 현재 vs 새 데이터 요약
    const curStats = `XP ${S.xp || 0} · 완독 ${(S.worksFinished||[]).length}편 · 어휘 ${S.vocabCorrectCount||0} · 북마크 ${Object.keys(S.bookmarks||{}).length}`;
    const newStats = `XP ${data.xp || 0} · 완독 ${(data.worksFinished||[]).length}편 · 어휘 ${data.vocabCorrectCount||0} · 북마크 ${Object.keys(data.bookmarks||{}).length}`;
    if(!confirm(`기존 데이터를 새 데이터로 덮어씁니다.\n\n현재: ${curStats}\n새것:  ${newStats}\n\n진행할까요? (라이브 순위 ID·이름은 현재 기기 값 유지)`)){
      e.target.value = '';
      return;
    }
    // 현재 기기의 라이브 순위 정보 보존
    const preservedUserId = S.userId;
    const preservedDisplayName = S.displayName;
    const preservedJoinLeaderboard = S.joinLeaderboard;
    // 데이터 적용
    S = data;
    S.userId = preservedUserId || S.userId || ('u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4));
    S.displayName = preservedDisplayName || '';
    S.joinLeaderboard = preservedJoinLeaderboard || false;
    // 새 필드 (v24~v29)에 기본값 보장
    if(!S.speech) S.speech = {rate:0.85, pitch:1.0, voiceName:''};
    if(S.readColorize === undefined) S.readColorize = true;
    if(!S.bookmarks) S.bookmarks = {};
    if(!S.srs) S.srs = {};
    if(!S.workNotes) S.workNotes = {};
    if(!S.sectionsDone) S.sectionsDone = {};
    if(!S.wrongRoom) S.wrongRoom = {};
    if(!S.topicsStudied) S.topicsStudied = [];
    if(!S.readDone) S.readDone = [];
    if(!S.readNotes) S.readNotes = {};
    if(!S.readAnalysis) S.readAnalysis = {};
    if(!S.worksFinished) S.worksFinished = [];
    if(!S.badges) S.badges = [];
    try {
      await saveState();
      refreshBanner();
      renderHall();
      toast('가져오기 완료');
    } catch(err){
      toast('저장 실패 — 새로고침해 보세요');
    }
    e.target.value = '';
  });
  document.getElementById('reset-data').addEventListener('click', async()=>{
    if(!confirm('모든 진행 상황을 초기화합니다. 계속하시겠습니까?')) return;
    // 순위표에서도 제거
    if(STORAGE.supportsShared && S.userId){
      try{ await STORAGE.delShared('lb:' + S.userId); }catch(e){}
    }
    // 초기화 — v29까지의 모든 필드 포함
    S = {
      xp:0, vocabSeen:0, vocabCorrectCount:0, vocabRight:0, vocabWrong:0,
      wrongRoom:{}, topicsStudied:[], grammarCorrectCount:0,
      readDone:[], readNotes:{}, readAnalysis:{},
      sectionsDone:{}, worksFinished:[], workNotes:{},
      badges:[], streak:0, lastDay:'', hadPerfect:false, analysisWritten:0,
      displayName:'', userId:'', joinLeaderboard:false,
      speech:{rate:0.85, pitch:1.0, voiceName:''},   // v24
      readColorize: true,                              // v29
      bookmarks:{},                                    // v25
      srs:{}                                           // SRS (이미 사용 중)
    };
    if(!S.userId) S.userId = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
    try{ await STORAGE.del(KEY); }catch(e){}
    refreshBanner();
    renderHall();
    toast('초기화 완료');
  });
  // 비동기로 순위표 로드
  loadLeaderboard();
}

async function loadLeaderboard(){
  const slot = document.getElementById('leaderboard-slot');
  if(!slot) return;
  // 공유 미지원 환경
  if(!STORAGE.supportsShared){
    slot.innerHTML = `<div class="card">
      <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">라이브 순위</b>
      <div class="hint" style="margin-top:10px;line-height:1.6">
        현재 환경(${STORAGE.label})은 사용자 간 공유 저장소를 지원하지 않습니다.<br>
        Claude 아티팩트 환경에서 이 파일을 열면 같은 링크를 공유한 모든 분들의 진행이 함께 표시됩니다.
      </div>
    </div>`;
    return;
  }
  // 참여 동의 받기
  if(!S.joinLeaderboard){
    slot.innerHTML = `<div class="card warm">
      <b style="font-size:14px;color:var(--terracotta-d)">라이브 순위에 참여</b>
      <div class="hint" style="margin-top:8px;color:var(--black-glaze-l);line-height:1.6">
        같은 링크를 사용하는 다른 분들과 진행 상황을 공유합니다. 표시 이름을 정해주세요 — XP·레벨·완독 통계가 공개되며 본문 메모는 공개되지 않습니다.
      </div>
      <input class="input" id="dn-input" placeholder="예: 김연구원 / Anonymous Scholar" maxlength="24" style="margin-top:12px" value="${escapeHtml(S.displayName)}">
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-sm" id="dn-save">참여하기</button>
        <button class="btn btn-sm btn-o" id="dn-skip">건너뛰기</button>
      </div>
    </div>`;
    const saveBtn = document.getElementById('dn-save');
    const skipBtn = document.getElementById('dn-skip');
    saveBtn.addEventListener('click', async () => {
      const v = document.getElementById('dn-input').value.trim();
      if(!v){ toast('이름을 입력하세요'); return; }
      S.displayName = v.slice(0,24);
      S.joinLeaderboard = true;
      await saveState();
      // 즉시 동기화 (1.5초 디바운스 우회)
      try{
        await STORAGE.setShared('lb:' + S.userId, JSON.stringify({
          name:S.displayName, userId:S.userId, level:levelOf(S.xp), xp:S.xp,
          vocab:S.vocabCorrectCount, topics:S.topicsStudied.length,
          works:S.worksFinished.length, reads:S.readDone.length,
          badges:S.badges.length, streak:S.streak, lastSeen:Date.now()
        }));
      }catch(e){}
      loadLeaderboard();
    });
    skipBtn.addEventListener('click', () => {
      slot.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--clay-d);text-align:center">라이브 순위 비참여 — <button class="minlink" id="rejoin-lb" style="background:none;border:none;color:var(--terracotta-d);cursor:pointer;padding:0">참여하기</button></div></div>`;
      document.getElementById('rejoin-lb').addEventListener('click', () => { S.joinLeaderboard = false; loadLeaderboard(); });
    });
    return;
  }
  // 순위표 fetch
  try{
    const list = await STORAGE.listShared('lb:');
    const keys = (list && list.keys) || [];
    const entries = [];
    for(const k of keys){
      try{
        const r = await STORAGE.getShared(k);
        if(r && r.value){
          const e = JSON.parse(r.value);
          e._key = k;
          entries.push(e);
        }
      }catch(e){}
    }
    entries.sort((a,b) => (b.xp||0) - (a.xp||0));
    const myRank = entries.findIndex(e => e.userId === S.userId) + 1;
    const fmtAgo = (ts) => {
      if(!ts) return '';
      const mins = (Date.now() - ts) / 60000;
      if(mins < 1) return '방금';
      if(mins < 60) return Math.round(mins) + '분 전';
      if(mins < 1440) return Math.round(mins/60) + '시간 전';
      return Math.round(mins/1440) + '일 전';
    };
    if(entries.length === 0){
      slot.innerHTML = `<div class="card">
        <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">라이브 순위</b>
        <div class="hint" style="margin-top:8px">아직 참여자가 없습니다. 다른 분들이 참여하면 여기에 표시됩니다.</div>
      </div>`;
      return;
    }
    slot.innerHTML = `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">라이브 순위 (${entries.length}명)</b>
        <span style="font-size:11px;color:var(--terracotta-d);font-weight:600">내 순위: ${myRank > 0 ? myRank + '위' : '미참여'}</span>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table style="width:100%;font-size:12.5px;border-collapse:collapse;min-width:340px">
        <thead>
          <tr style="background:var(--ivory-d)">
            <th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--clay);font-size:11px">#</th>
            <th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--clay);font-size:11px">이름</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">XP</th>
            <th style="text-align:center;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">레벨</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">어휘</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">전집</th>
            <th style="text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--clay);font-size:11px">활동</th>
          </tr>
        </thead>
        <tbody>
        ${entries.map((e,i) => {
          const me = e.userId === S.userId;
          const medal = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':''));
          return `<tr style="${me ? 'background:linear-gradient(90deg,var(--ivory-d),transparent)' : ''}">
            <td style="padding:7px 8px;border-bottom:1px solid var(--clay);opacity:.7">${medal||(i+1)}</td>
            <td style="padding:7px 8px;border-bottom:1px solid var(--clay);font-weight:${me?'700':'500'};color:${me?'var(--terracotta-d)':'inherit'}">${escapeHtml(e.name)}${me?' <span style="font-size:10px;opacity:.7">(나)</span>':''}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-variant-numeric:tabular-nums">${(e.xp||0).toLocaleString()}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:center;font-family:var(--font-grk);color:var(--terracotta-d);font-size:13px">${LEVELS[e.level||0].grk}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-variant-numeric:tabular-nums">${e.vocab||0}</td>
            <td style="padding:7px 4px;border-bottom:1px solid var(--clay);text-align:right;font-variant-numeric:tabular-nums">${e.works||0}/${WORKS.length}</td>

// ===== 읽기 시간 추정 =====
// 학습자 그리스어 읽기 속도: 약 40 단어/분 (느린 정독). 산문은 5/분 빠름.
function estimateReadingMinutes(work){
  if(!work || !work.sections) return 0;
  let words = 0;
  for(const sec of work.sections){
    words += (sec.text || '').split(/\s+/).filter(Boolean).length;
  }
  const wpm = work.kind === 'prose' ? 45 : 35;
  return Math.max(1, Math.round(words / wpm));
}

// ===== 음성 합성 (TTS) — v34: 다발음체계 ====================================
// 학술 배경: 브라우저 TTS는 OS가 제공하는 음성만 사용 가능하고, 모든 주요
// 플랫폼이 그리스어로 제공하는 것은 현대 헬라어(el-GR) 음성뿐이다. 현대
// 발음은 고전 아티카(5–4c BCE)와 자음·모음 양면에서 크게 다르다 (W.S.
// Allen, Vox Graeca, 3rd ed., 1987; cf. Ancient Greek phonology, Wikipedia).
//
// 우회법: 그리스어 본문을 라틴 문자 음역으로 변환 후, 이탈리아어 음성으로
// 발화한다. 이탈리아어의 5모음 체계·자음 단순성·'h' 무음·'c+a/o/u=[k]' 등의
// 음운적 성질이 Erasmian·Restored 음운에 비교적 가깝다. 한계:
//   ◇ 고저강세(pitch accent) 미재현 — 화자가 stress로 읽음
//   ◇ 기식음(aspiration) θ/φ/χ는 평이한 [t/p/k]로 약화
//   ◇ 복원 발음의 υ [y]는 이탈리아어에 없어 [i]로 근사
//   ◇ rough breathing [h]는 이탈리아 'h' 무음으로 약화
// 학술적 엄밀함이 필요하면 ScorpioMartianus 등의 학자 녹음을 권장.

const PRON_SYSTEMS = {
  modern: {
    label: '현대 그리스어',
    desc: '브라우저 기본 — 현대 헬라어 음운 (β=v, η=i, υ=i, αι=e 등)',
    voiceLang: 'el',
    transliterate: null,
  },
  erasmian: {
    label: '에라스무스식',
    desc: '르네상스 유럽 학계 관용 — φ=ph, β=b, η=e, υ=u, αι=ai',
    voiceLang: 'it',
    transliterate: 'erasmian',
  },
  restored: {
    label: '복원 아티카식',
    desc: 'W.S. Allen Vox Graeca (1987) · 5–4c BCE — η=ɛː, υ=y, ω=ɔː',
    voiceLang: 'it',
    transliterate: 'restored',
  },
};

const PRON_DIALECTS = {
  default: {label:'기본 (Attic 음운)',  psilosis:false},
  attic:   {label:'Attic · 아테네식',    psilosis:false},
  ionic:   {label:'Ionic · 이오니아식',  psilosis:true },  // East Ionic — psilosis
  doric:   {label:'Doric · 도리스식',    psilosis:false},
  aeolic:  {label:'Aeolic · 아이올리스식',psilosis:true },  // psilosis, recessive accent
  homeric: {label:'Homeric · 호메로스식',psilosis:false},
  koine:   {label:'Koine · 코이네',      psilosis:false},
};

// 그리스어 본문 → Erasmian / Restored 라틴 음역
function greekToLatin(text, system, dialect){
  if(!text) return '';
  const sysCfg = PRON_SYSTEMS[system] || PRON_SYSTEMS.modern;
  if(!sysCfg.transliterate) return text;
  const D = PRON_DIALECTS[dialect] || PRON_DIALECTS.default;
  const isRestored = sysCfg.transliterate === 'restored';
  // 단어 단위 처리 (rough breathing은 단어 첫 모음 앞에만 'h' 부여)
  const tokens = text.split(/(\s+|[\.,;··:?!"'·()\[\]\—\-]+)/);
  return tokens.map(tok => {
    if(!tok || /^[\s\.,;··:?!"'·()\[\]\—\-]+$/.test(tok)) return tok;
    return _greekWordToLatin(tok, isRestored, D);
  }).join('');
}

function _greekWordToLatin(word, isRestored, D){
  const nfd = word.normalize('NFD');
  const ROUGH = '\u0314';
  // 한 문자 + 결합부호 그룹화
  const groups = [];
  for(const c of nfd){
    if(/\p{M}/u.test(c) && groups.length){
      groups[groups.length-1].marks.add(c);
    } else {
      groups.push({base: c, marks: new Set()});
    }
  }
  // 초성 모음군 전체에서 rough breathing 검사 (υἱός 등: 두 번째 모음에 rough가 있을 수 있음)
  let leadingEnd = -1;
  for(let i = 0; i < groups.length; i++){
    if(/[αεηιουωΑΕΗΙΟΥΩ]/.test(groups[i].base)){ leadingEnd = i; }
    else break;
  }
  let hasRoughInit = false;
  let initIsUpper = false;
  if(leadingEnd >= 0){
    for(let i = 0; i <= leadingEnd; i++){
      if(groups[i].marks.has(ROUGH)) hasRoughInit = true;
    }
    initIsUpper = /[Α-Ω]/.test(groups[0].base);
  }
  let out = '';
  let firstVowelDone = false;
  for(let i = 0; i < groups.length; i++){
    const g = groups[i];
    const nx = groups[i+1] ? groups[i+1].base : '';
    let latin = _greekCharToLatin(g.base, nx, isRestored);
    if(latin == null){ out += g.base; continue; }
    const isVowel = /^[aeiouyàèìòù]/i.test(latin);
    if(isVowel && !firstVowelDone){
      if(hasRoughInit && !D.psilosis){
        // 대문자 단어면 'H' + 첫 모음 소문자 (Hellenikē 관용표기)
        if(initIsUpper){ out += 'H'; latin = latin.toLowerCase(); }
        else out += 'h';
      }
      firstVowelDone = true;
    }
    out += latin;
  }
  // 후처리: ου = [u]
  out = out.replace(/ou/g, 'u').replace(/OU/g, 'U');
  return out;
}

function _greekCharToLatin(ch, nextCh, isRestored){
  const upper = /[Α-Ω]/.test(ch);
  const lower = ch.toLowerCase();
  let r;
  switch(lower){
    case 'α': r = 'a'; break;
    case 'ε': r = 'e'; break;
    case 'η': r = isRestored ? 'è' : 'e'; break;  // Restored: open long ɛː → it. è=[ɛ]
    case 'ι': r = 'i'; break;
    case 'ο': r = 'o'; break;
    case 'υ': r = isRestored ? 'i' : 'u'; break;  // [y] 없음 → [i] 근사 (Restored)
    case 'ω': r = isRestored ? 'ò' : 'o'; break;  // Restored: open long ɔː → it. ò=[ɔ]
    case 'β': r = 'b'; break;
    case 'γ': {
      // γγ γκ γχ γξ → [ŋ] (Allen §6, Smyth §19)
      const nl = (nextCh || '').toLowerCase();
      r = (nl === 'γ' || nl === 'κ' || nl === 'χ' || nl === 'ξ') ? 'n' : 'g';
      break;
    }
    case 'δ': r = 'd'; break;
    case 'ζ': r = 'z'; break;  // Erasmian: [z]/[dz], Restored: [zd] — 단순화
    case 'θ': r = 't'; break;  // 이탈리아 'th'는 [t], 'h' 무음 → 't'로 약화 (한계)
    case 'κ': r = 'k'; break;
    case 'λ': r = 'l'; break;
    case 'μ': r = 'm'; break;
    case 'ν': r = 'n'; break;
    case 'ξ': r = 'ks'; break;
    case 'π': r = 'p'; break;
    case 'ρ': r = 'r'; break;
    case 'σ': case 'ς': r = 's'; break;
    case 'τ': r = 't'; break;
    case 'φ': r = 'p'; break;  // [pʰ] → 평이한 [p] 약화 (이탈리아 'f'는 fricative라 부적합)
    case 'χ': r = 'k'; break;  // [kʰ] → [k] 약화
    case 'ψ': r = 'ps'; break;
    case 'ϝ': r = 'v'; break;  // digamma [w] — 이탈리아 'v'/'u' 중 'v' 사용
    default:
      if(/[a-zA-Z0-9]/.test(ch)) return ch;
      return null;
  }
  return upper ? r.toUpperCase() : r;
}

// 사용 가능한 음성 캐시: { 'el': voice, 'it': voice, ... }
let _voiceCache = {};
let _availableVoices = [];
function _pickVoiceFor(langPrefix){
  if(_voiceCache[langPrefix] !== undefined) return _voiceCache[langPrefix];
  // 사용자가 명시 선택한 음성이 해당 lang 계열이면 우선
  const preferredName = (S && S.speech && S.speech.voiceName) ? S.speech.voiceName : '';
  if(preferredName){
    const v = _availableVoices.find(v => v.name === preferredName && v.lang.toLowerCase().startsWith(langPrefix));
    if(v){ _voiceCache[langPrefix] = v; return v; }
  }
  const v = _availableVoices.find(v => v.lang.toLowerCase().startsWith(langPrefix)) || null;
  _voiceCache[langPrefix] = v;
  return v;
}

function _initVoice(){
  if(!('speechSynthesis' in window)) return;
  const pick = () => {
    _availableVoices = speechSynthesis.getVoices();
    _voiceCache = {};  // 음성 목록 갱신 시 캐시 무효화
  };
  pick();
  if(_availableVoices.length === 0){
    speechSynthesis.onvoiceschanged = pick;
  }
}
if(typeof window !== 'undefined'){ _initVoice(); }

function speakGreek(text, overrideDialect){
  if(!('speechSynthesis' in window) || !text) return false;
  const settings = (S && S.speech) ? S.speech : {};
  const system  = settings.system  || 'modern';
  const dialect = overrideDialect || settings.dialect || 'default';
  const sysCfg  = PRON_SYSTEMS[system] || PRON_SYSTEMS.modern;
  // 본문 정리 (행번호·각주 표시 제거)
  const clean = text.replace(/^\d+\s+/gm, '').replace(/\[\d+[a-z]?\]/g, '');
  // 음역
  const utterText = greekToLatin(clean, system, dialect);
  const u = new SpeechSynthesisUtterance(utterText);
  // 음성 선택: 시스템에 해당하는 lang 음성, 없으면 Spanish→English 폴백 (이탈리아 부재 시), 마지막으로 그리스
  let voice = _pickVoiceFor(sysCfg.voiceLang);
  if(!voice && sysCfg.voiceLang === 'it'){
    voice = _pickVoiceFor('es') || _pickVoiceFor('en');
  }
  if(!voice){
    voice = _pickVoiceFor('el');
  }
  if(voice){
    u.voice = voice;
    u.lang  = voice.lang;
  } else {
    u.lang = sysCfg.voiceLang === 'el' ? 'el-GR' : 'it-IT';
  }
  u.rate  = typeof settings.rate  === 'number' ? settings.rate  : 0.85;
  u.pitch = typeof settings.pitch === 'number' ? settings.pitch : 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  return true;
}

// 특정 방언의 음운 규칙으로 임시 발화 (사용자 설정 보존)
function speakGreekDialect(text, dialect){
  return speakGreek(text, dialect);
}

function stopSpeech(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }

window.speakGreek = speakGreek;
window.speakGreekDialect = speakGreekDialect;
window.stopSpeech = stopSpeech;

// ===== 멀티 실시간 배틀 (Ἀγών) — Phase 1 인프라 (v29) =====
// 디자인: Firebase RTDB polling (~2s) — Phase 4에서 SSE로 업그레이드 예정
// 데이터: battles/{roomCode}/{meta,players,questions}
// 상태:   lobby → playing → finished
//
// v31: SSE (Server-Sent Events) 업그레이드 — Firebase REST의 ?accept=text/event-stream
// 엔드포인트로 push 받음. 실패 시 polling으로 자동 fallback.

const BATTLE_POLL_MS = 2000;        // polling 간격 (SSE 실패 시 fallback)
const BATTLE_CODE_LEN = 6;          // 방 코드 길이
const BATTLE_SSE_TIMEOUT_MS = 8000; // SSE 연결 8초 무응답 시 fallback
let _battleState = null;            // {roomCode, role, pollTimer, sseSrc, sseMode, onUpdate}

function _battleGenCode(){
  // 혼동되는 문자 제외 (0/O, 1/I/L) — 학습자가 입력 쉽게
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i = 0; i < BATTLE_CODE_LEN; i++){
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

function _battleStopPoll(){
  if(!_battleState) return;
  if(_battleState.pollTimer){
    clearInterval(_battleState.pollTimer);
    _battleState.pollTimer = null;
  }
  if(_battleState.sseSrc){
    try { _battleState.sseSrc.close(); } catch(e){}
    _battleState.sseSrc = null;
  }
  if(_battleState.sseTimeoutId){
    clearTimeout(_battleState.sseTimeoutId);
    _battleState.sseTimeoutId = null;
  }
  _battleState.sseMode = null;
}

function _battleCleanup(){
  _battleStopPoll();
  _battleState = null;
}

async function _battleFetchRoom(code){
  if(!STORAGE.supportsShared) return null;
  try {
    const r = await STORAGE.getShared(`battles:${code}`);
    if(!r || !r.value) return null;
    return JSON.parse(r.value);
  } catch(e){
    return null;
  }
}

// SSE 구독: Firebase RTDB의 EventSource 엔드포인트로 실시간 push 받음
// 성공 시 onUpdate(room)을 변경마다 호출. 실패 시 false 반환 → polling으로 폴백.
function _battleSubscribeSSE(code, onUpdate){
  if(!_battleState) return false;
  if(typeof EventSource === 'undefined') return false;
  if(!FIREBASE_URL) return false;

  const base = FIREBASE_URL.replace(/\/$/, '');
  const url = `${base}/battles/${code}.json?accept=text/event-stream`;
  let es;
  try {
    es = new EventSource(url);
  } catch(e){
    return false;
  }

  let opened = false;
  let cached = null;          // 마지막으로 전달한 room (멱등성)

  // 연결 타임아웃: 8초 내 open 없으면 fallback
  const timeoutId = setTimeout(() => {
    if(!opened){
      try { es.close(); } catch(e){}
      if(_battleState && _battleState.sseSrc === es){
        _battleState.sseSrc = null;
        _battleStartPolling(code, onUpdate);
      }
    }
  }, BATTLE_SSE_TIMEOUT_MS);

  es.onopen = () => {
    opened = true;
  };

  // Firebase는 'put' (전체 교체)과 'patch' (부분 갱신) 이벤트를 보냄
  // 우리 구조는 항상 PUT으로 전체 저장하므로 put이 주력
  const handle = (data) => {
    try {
      const parsed = JSON.parse(data);
      if(!parsed) return;
      const { path, data: payload } = parsed;
      if(path === '/' || path === ''){
        // 전체 객체 교체 (또는 초기 fetch)
        if(payload === null){
          onUpdate(null);   // 방 삭제됨
          cached = null;
        } else {
          cached = payload;
          onUpdate(payload);
        }
      } else if(cached){
        // 부분 갱신: cached에 path 따라 패치
        const keys = path.replace(/^\//, '').split('/');
        let cursor = cached;
        for(let i = 0; i < keys.length - 1; i++){
          if(cursor[keys[i]] === undefined) cursor[keys[i]] = {};
          cursor = cursor[keys[i]];
        }
        if(payload === null){
          delete cursor[keys[keys.length - 1]];
        } else {
          cursor[keys[keys.length - 1]] = payload;
        }
        onUpdate(cached);
      } else {
        // cached 없는데 부분 갱신만 옴 — fetch로 보강
        _battleFetchRoom(code).then(r => {
          cached = r;
          onUpdate(r);
        });
      }
    } catch(e){
      // 파싱 실패 시 무시 — 다음 이벤트가 정상이면 진행
    }
  };

  es.addEventListener('put',   (e) => handle(e.data));
  es.addEventListener('patch', (e) => handle(e.data));
  // keep-alive 이벤트는 무시. cancel/auth_revoked는 연결 종료 신호.
  es.addEventListener('cancel', () => {
    try { es.close(); } catch(e){}
    if(_battleState && _battleState.sseSrc === es){
      _battleState.sseSrc = null;
      _battleStartPolling(code, onUpdate);
    }
  });
  es.addEventListener('auth_revoked', () => {
    try { es.close(); } catch(e){}
  });

  es.onerror = () => {
    // 연결 끊김 — 자동 재시도는 브라우저가 함. 그러나 우리는 폴링으로 폴백.
    // 단, 일시적 끊김(브라우저 자동 재연결)에는 너무 빠르게 폴백하지 않음
    // → onopen 후에 에러가 반복되면 그때 폴백
    if(opened && _battleState && _battleState.sseSrc === es){
      // 한 번 더 기회를 주고 (브라우저 재연결), 5초 후에도 안 오면 폴백
      setTimeout(() => {
        if(es.readyState === 2 /* CLOSED */ &&
           _battleState && _battleState.sseSrc === es){
          _battleState.sseSrc = null;
          _battleStartPolling(code, onUpdate);
        }
      }, 5000);
    }
  };

  _battleState.sseSrc = es;
  _battleState.sseMode = 'sse';
  _battleState.sseTimeoutId = timeoutId;
  return true;
}

// polling 시작 — SSE 실패 시 자동 호출되거나, SSE 시도 후 fallback으로
function _battleStartPolling(code, onUpdate){
  if(!_battleState) return;
  _battleState.sseMode = 'poll';
  if(_battleState.pollTimer) clearInterval(_battleState.pollTimer);
  // 즉시 한 번 fetch
  _battleFetchRoom(code).then(onUpdate);
  _battleState.pollTimer = setInterval(async () => {
    const r = await _battleFetchRoom(code);
    onUpdate(r);
  }, BATTLE_POLL_MS);
}

// 통합 구독자: SSE 시도 → 실패 시 polling 자동 폴백
// 기존 setInterval 호출부를 이걸로 대체
function _battleSubscribe(code, onUpdate){
  if(!_battleState) return;
  _battleState.onUpdate = onUpdate;
  // 즉시 한 번 fetch (SSE open 전 빈 화면 방지)
  _battleFetchRoom(code).then(r => { if(r !== null) onUpdate(r); });
  // SSE 시도
  const sseOk = _battleSubscribeSSE(code, onUpdate);
  if(!sseOk){
    _battleStartPolling(code, onUpdate);
  }
}

async function _battleSaveRoom(code, room){
  if(!STORAGE.supportsShared) return false;
  try {
    await STORAGE.setShared(`battles:${code}`, JSON.stringify(room));
    return true;
  } catch(e){
    return false;
  }
}

// 방 만들기 — 코드 생성 + 즉시 lobby
async function renderBattleCreate(){
  if(!STORAGE.supportsShared){ renderBattle(); return; }

    S.userId = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
    saveState();
  }
  const room = {
    meta: {
      hostId: S.userId,
      createdAt: Date.now(),
      status: 'lobby',
      mode: 'vocab',
      currentQuestion: 0,
    },
    players: {
      [S.userId]: { name: S.displayName || '익명', joinedAt: Date.now(), score: 0, ready: false }
    },
  };
  const ok = await _battleSaveRoom(code, room);
  if(!ok){ toast('방 생성 실패 — 네트워크 확인'); renderBattle(); return; }
  _battleState = { roomCode: code, role: 'host', pollTimer: null };
  renderBattleLobby();
}

             autocomplete="off"
             autocapitalize="characters"
             style="text-align:center;font-family:var(--font-display);font-size:28px;letter-spacing:.3em;font-weight:600;color:var(--terracotta-d)">
      <button class="btn" id="battle-join-go" style="width:100%;margin-top:14px">입장 →</button>
    </div>
  `;
  const inp = document.getElementById('battle-code-input');
  const go = document.getElementById('battle-join-go');
  inp.addEventListener('input', () => {
    inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, BATTLE_CODE_LEN);
  });
  inp.focus();
  const attempt = async () => {
    const code = inp.value.trim().toUpperCase();
    if(code.length !== BATTLE_CODE_LEN){ toast(`${BATTLE_CODE_LEN}자리 코드를 입력하세요`); return; }
    go.disabled = true;
    go.textContent = '확인 중...';
    const room = await _battleFetchRoom(code);
    if(!room || !room.meta){
      toast('해당 코드의 방이 없습니다');
      go.disabled = false; go.textContent = '입장 →';
      return;
    }
    if(room.meta.status === 'finished'){
      toast('이미 종료된 방입니다');
      go.disabled = false; go.textContent = '입장 →';
      return;
    }
    if(room.meta.status === 'playing'){
      toast('이미 진행 중인 방입니다 (관전 미지원)');
      go.disabled = false; go.textContent = '입장 →';
      return;
    }
    // userId 등록
    if(!S.userId){
      S.userId = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
      saveState();
    }
    room.players = room.players || {};
    room.players[S.userId] = { name: S.displayName || '익명', joinedAt: Date.now(), score: 0, ready: false };
    const saved = await _battleSaveRoom(code, room);
    if(!saved){
      toast('입장 실패 — 네트워크 확인');
      go.disabled = false; go.textContent = '입장 →';
      return;
    }
    _battleState = { roomCode: code, role: 'guest', pollTimer: null };
    renderBattleLobby();
  };
  go.addEventListener('click', attempt);
  inp.addEventListener('keypress', e => { if(e.key === 'Enter') attempt(); });
}
window.renderBattleJoin = renderBattleJoin;

// 대기실 — 호스트·게스트 공통. 호스트만 "시작" 버튼.
async function renderBattleLobby(){
  if(!_battleState){ renderBattle(); return; }
  const code = _battleState.roomCode;
  const isHost = _battleState.role === 'host';

  const draw = (room) => {
    if(!room){
      view.innerHTML = `
        <button class="btn btn-sm btn-o" onclick="renderBattle()">← 배틀</button>
        <div class="card warm" style="margin-top:14px">
          <b>방이 닫혔습니다</b>
          <div style="font-size:13px;margin-top:6px">호스트가 방을 종료했거나 네트워크 오류입니다.</div>
        </div>
      `;
      _battleStopPoll();
      return;
    }
    const players = Object.entries(room.players || {});
    const status = room.meta.status;
    const myId = S.userId;
    if(status === 'playing'){
      // 답 중이면 점수보드만 부분 갱신 (전체 재렌더하면 시각 피드백 끊김)
      if(_battleGameLocal && _battleGameLocal.answeredThisQ){
        const sb = document.getElementById('bat-scoreboard-wrap');
        if(sb){
          const ps = Object.entries(room.players || {});
          sb.innerHTML = _battleScoreboardHTML(ps);
        }
        return;
      }
      return renderBattleGame(code, room);
    }
    if(status === 'finished'){
      _battleStopPoll();
      return renderBattleResult(code, room);
    }

    view.innerHTML = `
      <button class="btn btn-sm btn-o" onclick="_battleLeave()">← 나가기</button>
      <h2 class="view-title fade-in" style="margin-top:10px">대기실</h2>
      <div class="view-sub">${isHost ? '호스트' : '게스트'} · 참가자 ${players.length}명</div>

      <div class="card" style="text-align:center">
        <div style="font-size:11px;color:var(--clay-d);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">방 코드</div>
        <div style="font-family:var(--font-display);font-size:38px;color:var(--terracotta-d);font-weight:600;letter-spacing:.25em">${code}</div>
        <div style="font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic">친구에게 이 코드를 공유하세요</div>
        <button class="btn btn-sm btn-o" id="battle-copy" style="margin-top:8px">📋 코드 복사</button>
        <div style="font-size:9.5px;color:var(--clay-d);margin-top:10px;font-style:italic;letter-spacing:.03em">
          ${_battleState && _battleState.sseMode === 'sse' ? '⚡ 실시간 push 연결' :
            (_battleState && _battleState.sseMode === 'poll' ? '🔄 폴링 (2초)' : '⌛ 연결 중...')}
        </div>
      </div>

      <div class="card">
        <div style="font-family:var(--font-display);font-size:13px;color:var(--terracotta-d);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">참가자 (${players.length}/6)</div>
        ${players.length === 0 ? `
          <div style="color:var(--clay-d);font-size:13px;text-align:center;padding:10px">아직 참가자가 없습니다.</div>
        ` : players.map(([uid, p]) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px dashed var(--clay);border-radius:4px;background:${uid===myId?'var(--ivory-d)':'transparent'}">
            <div>
              <span style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--black-glaze)">${(p.name || '익명').replace(/</g,'&lt;')}</span>
              ${uid === room.meta.hostId ? '<span style="font-size:10px;background:var(--terracotta);color:var(--ivory-w);padding:2px 6px;border-radius:8px;margin-left:6px">호스트</span>' : ''}
              ${uid === myId ? '<span style="font-size:10px;color:var(--terracotta-d);margin-left:6px">(나)</span>' : ''}
            </div>
            <span style="font-size:11px;color:var(--clay-d)">${p.ready ? '✓ 준비' : '대기 중'}</span>
          </div>
        `).join('')}
      </div>

      ${isHost ? `
        <button class="btn" id="battle-start" style="width:100%;margin-top:14px" ${players.length < 2 ? 'disabled' : ''}>
          ${players.length < 2 ? '최소 2명 필요' : `시작 (${players.length}명) →`}
        </button>
      ` : `
        <div class="card" style="margin-top:14px;text-align:center;background:var(--ivory-d)">
          <div style="font-size:13px;color:var(--clay-d)">호스트가 시작하기를 기다리는 중...</div>
        </div>
      `}
    `;

    const copyBtn = document.getElementById('battle-copy');
    if(copyBtn){
      copyBtn.addEventListener('click', () => {
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(code).then(
            () => toast('코드 복사됨'),
            () => toast('복사 실패 — 수동으로 입력하세요')
          );
        } else {
          toast('이 브라우저는 자동 복사를 지원하지 않습니다');
        }
      });
    }
    const startBtn = document.getElementById('battle-start');
    if(startBtn){
      startBtn.addEventListener('click', async () => {
        if(!confirm(`${players.length}명으로 시작합니다. 계속하시겠습니까?`)) return;
        startBtn.disabled = true;
        startBtn.textContent = '시작 중...';
        const fresh = await _battleFetchRoom(code);
        if(fresh){
          fresh.meta.status = 'playing';
          fresh.meta.startedAt = Date.now();
          // 시드 — 모든 플레이어가 동일 문제 받게
          fresh.meta.seed = Date.now() + Math.floor(Math.random() * 1000000);
          // 각 플레이어 진행 필드 초기화 (이전 매치 잔존 방어)
          for(const uid of Object.keys(fresh.players)){
            fresh.players[uid].score = 0;
            fresh.players[uid].currentQ = 0;
            fresh.players[uid].finished = false;
          }
          await _battleSaveRoom(code, fresh);
        }
      });
    }
  };

  // 첫 fetch 즉시 그리기 + 실시간 구독 (SSE → 실패 시 polling)
  _battleStopPoll();
  _battleSubscribe(code, draw);
}
window.renderBattleLobby = renderBattleLobby;

// 방 나가기 — 호스트면 방 삭제, 게스트면 자기만 제거
async function _battleLeave(){
  if(!_battleState){ renderBattle(); return; }
  const code = _battleState.roomCode;
  const isHost = _battleState.role === 'host';
  _battleStopPoll();
  try {
    if(isHost){
      // 호스트 이탈 — 방 자체 삭제
      await STORAGE.delShared(`battles:${code}`);
    } else {
      // 게스트 이탈 — 자기만 제거
      const room = await _battleFetchRoom(code);
      if(room && room.players){
        delete room.players[S.userId];
        await _battleSaveRoom(code, room);
      }
    }
  } catch(e){ /* 네트워크 실패 시 무시 — 클라이언트는 어쨌든 떠남 */ }
  _battleCleanup();
  renderBattle();
}
window._battleLeave = _battleLeave;

// ===== Phase 2 (v30) — 실제 게임플레이: 시드 기반 동기 문제 + 실시간 점수 =====
const BATTLE_N_Q             = 10;     // 문제 수
const BATTLE_Q_TIMER_SEC     = 12;     // 문제당 12초
const BATTLE_GAME_TTL_MS     = 5*60*1000;  // 매치 5분 한도
let _battleQTimer = null;
let _battleGameLocal = null;
// { code, idx, score, answeredThisQ, startedAt, questions }

// LCG seeded random — 호스트 시드로 모두 동일 문제 생성
function _battleSeededRng(seed){
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
}
function _battleBuildQuestions(seed){
  const rng = _battleSeededRng(seed);
  const pool = (typeof ALL_VOCAB !== 'undefined') ? ALL_VOCAB.filter(w => w.g && w.ko) : [];
  if(pool.length < BATTLE_N_Q + 3) return [];
  const used = new Set();
  const qs = [];
  let safety = 0;
  while(qs.length < BATTLE_N_Q && safety < 300){
    safety++;
    const idx = Math.floor(rng() * pool.length);
    if(used.has(idx)) continue;
    used.add(idx);
    const w = pool[idx];
    const distractors = [];
    const distUsed = new Set([idx]);
    while(distractors.length < 3){
      const di = Math.floor(rng() * pool.length);
      if(distUsed.has(di)) continue;
      distUsed.add(di);
      distractors.push(pool[di].ko);
    }
    const correctIdx = Math.floor(rng() * 4);
    const options = [...distractors];
    options.splice(correctIdx, 0, w.ko);
    qs.push({ g: w.g, ko: w.ko, options, correctIdx });
  }
  return qs;
}

function _battleStopQTimer(){
  if(_battleQTimer){ clearInterval(_battleQTimer); _battleQTimer = null; }
}

// 게임 진행 — renderBattleLobby가 status==='playing'일 때 호출
async function renderBattleGame(code, room){
  // 첫 진입 시 로컬 상태 초기화
  if(!_battleGameLocal || _battleGameLocal.code !== code){
    const seed = (room && room.meta && room.meta.seed) || 0;
    const questions = _battleBuildQuestions(seed);
    if(questions.length < BATTLE_N_Q){
      view.innerHTML = `
        <button class="btn btn-sm btn-o" onclick="_battleLeave()">← 나가기</button>
        <div class="card warm" style="margin-top:14px"><b>문제 풀 부족</b>
          <div style="font-size:13px;margin-top:6px">어휘 데이터가 부족하여 매치를 시작할 수 없습니다.</div></div>`;
      return;
    }
    _battleGameLocal = {
      code, idx: 0, score: 0, correctCount: 0, answeredThisQ: false,
      startedAt: Date.now(), qStartedAt: 0,
      questions, answered: [], finished: false,
    };
  }
  const local = _battleGameLocal;

  // 5분 초과 → 강제 종료
  if(Date.now() - local.startedAt > BATTLE_GAME_TTL_MS && !local.finished){
    local.finished = true;
    await _battleSubmitProgress(code, local, true);
  }

  // 매치 자체가 finished 상태로 전환됐으면 결과
  if(room && room.meta && room.meta.status === 'finished'){
    return renderBattleResult(code, room);
  }

  // 자기 다 풀었으면 대기 화면
  if(local.idx >= BATTLE_N_Q || local.finished){
    return _renderBattleWaitOthers(code, room, local);
  }

  const q = local.questions[local.idx];
  const players = Object.entries(room.players || {});
  view.innerHTML = `
    <h2 class="view-title fade-in" style="margin-top:6px"><span class="grk">Ἀγών</span>배틀 진행 중</h2>

    <div class="card" id="bat-scoreboard-wrap" style="padding:10px 12px">
      ${_battleScoreboardHTML(players)}
    </div>

    <div class="card">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:11px;color:var(--clay-d);font-weight:600;text-transform:uppercase;letter-spacing:.06em">문제 ${local.idx+1}/${BATTLE_N_Q}</div>
        <div id="bat-qtimer" style="font-family:var(--font-display);font-size:18px;color:var(--terracotta-d);font-weight:600">${BATTLE_Q_TIMER_SEC}초</div>
      </div>
      <div class="grk" style="font-size:32px;color:var(--terracotta-d);font-weight:600;text-align:center;padding:14px 0;letter-spacing:.02em">${q.g}</div>
      <div style="font-size:12px;color:var(--clay-d);text-align:center;margin-bottom:12px">이 단어의 뜻은?</div>
      ${q.options.map((opt, i) => `
        <button class="btn btn-o" style="display:block;width:100%;margin:6px 0;text-align:left;font-size:13.5px" data-i="${i}">
          ${opt.replace(/</g,'&lt;')}
        </button>`).join('')}
    </div>

    <button class="btn btn-sm btn-o" onclick="_battleForfeit()" style="margin-top:6px;color:var(--bad);border-color:var(--bad)">포기하고 나가기</button>
  `;
  local.answeredThisQ = false;
  local.qStartedAt = Date.now();   // v32: 속도 점수 계산용
  view.querySelectorAll('[data-i]').forEach(btn => {
    btn.addEventListener('click', () => _battleAnswer(parseInt(btn.dataset.i, 10)));
  });
  _battleStartQTimer();
}

function _battleScoreboardHTML(players){
  // players: [[uid, {name, score, currentQ, ready, ...}], ...]
  const myId = S.userId;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(76px, 1fr));gap:6px">
    ${players.map(([uid, p]) => {
      const mine = uid === myId;
      return `<div style="text-align:center;padding:8px 6px;background:${mine?'var(--terracotta)':'var(--black-glaze)'};color:var(--ivory-w);border-radius:8px">
        <div style="font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(p.name||'').slice(0,12)}${mine?' (나)':''}</div>
        <div style="font-family:var(--font-display);font-size:20px;font-weight:600;margin-top:2px">${p.score||0}</div>
        <div style="font-size:10px;opacity:.85;margin-top:2px">${p.currentQ||0}/${BATTLE_N_Q}${p.finished?' ✓':''}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function _battleStartQTimer(){
  _battleStopQTimer();
  const startedAt = Date.now();
  _battleQTimer = setInterval(() => {
    if(!_battleGameLocal) return _battleStopQTimer();
    const remain = Math.max(0, BATTLE_Q_TIMER_SEC - Math.floor((Date.now() - startedAt) / 1000));
    const el = document.getElementById('bat-qtimer');
    if(el){
      el.textContent = remain + '초';
      if(remain <= 3) el.style.color = 'var(--bad)';
    }
    if(remain <= 0){
      _battleStopQTimer();
      if(!_battleGameLocal.answeredThisQ) _battleAnswer(-1);
    }
  }, 250);
}

async function _battleAnswer(chosenIdx){
  const local = _battleGameLocal;
  if(!local || local.answeredThisQ) return;
  local.answeredThisQ = true;
  _battleStopQTimer();
  const q = local.questions[local.idx];
  const correct = chosenIdx === q.correctIdx;
  // v32: 속도 점수 — 정답 시 기본 10 + 남은 시간(초) 보너스 (최대 22).
  // 오답·시간초과는 0. 총점은 최대 220 (BATTLE_N_Q=10 기준).
  const elapsedMs = Date.now() - (local.qStartedAt || Date.now());
  const remainSec = Math.max(0, BATTLE_Q_TIMER_SEC - elapsedMs / 1000);
  let points = 0;
  if(correct){
    local.correctCount = (local.correctCount || 0) + 1;
    points = 10 + Math.ceil(remainSec);
    local.score += points;
  }
  // v32: 답변 기록 — 결과 화면 리뷰·오답함 자동 추가에 사용
  local.answered = local.answered || [];
  local.answered.push({
    q: q.g,
    correctAnswer: q.options[q.correctIdx],
    chosen: chosenIdx >= 0 ? q.options[chosenIdx] : null,
    correct, points,
    elapsedMs: Math.round(elapsedMs),
  });
  // 시각 피드백
  view.querySelectorAll('[data-i]').forEach(b => {
    b.disabled = true;
    const i = parseInt(b.dataset.i, 10);
    if(i === q.correctIdx){
      b.style.background = 'var(--terracotta)';
      b.style.color = '#fff';
      b.style.borderColor = 'var(--terracotta-d)';
    } else if(i === chosenIdx){
      b.style.opacity = '0.45';
    }
  });
  // 점수 표시 (정답 시 +N 잠깐 강조)
  if(correct){
    const timerEl = document.getElementById('bat-qtimer');
    if(timerEl){
      timerEl.textContent = '+' + points;
      timerEl.style.color = 'var(--terracotta-d)';
    }
  }
  local.idx++;
  // 자기 진척 push (다음 polling에 다른 사람도 봄)
  await _battleSubmitProgress(local.code, local, local.idx >= BATTLE_N_Q);
  setTimeout(() => {
    // 다음 폴링 tick에 자동 갱신되지만 즉시 다음 문제로
    if(_battleGameLocal && _battleGameLocal.idx < BATTLE_N_Q){
      // 매치 상태 재조회 후 다음 문제
      _battleFetchRoom(_battleGameLocal.code).then(room => {
        if(room) renderBattleGame(_battleGameLocal.code, room);
      });
    }
  }, 800);
}

async function _battleSubmitProgress(code, local, finished){
  if(!S.userId) return;
  // 자기 player 객체만 PUT (path-level) — race condition 회피
  const payload = {
    name: S.displayName || '익명',
    joinedAt: Date.now(),
    score: local.score,
    correctCount: local.correctCount || 0,   // v32: 점수와 별도로 정답 수 동기화
    currentQ: local.idx,
    ready: true,
    finished: !!finished,
  };
  try {
    await STORAGE.setShared(`battles:${code}:players:${S.userId}`, JSON.stringify(payload));
  } catch(_){}
  // 모든 플레이어 finished인지 확인 → status를 'finished'로
  if(finished){
    try {
      const fresh = await _battleFetchRoom(code);
      if(fresh && fresh.players){
        const allDone = Object.values(fresh.players).every(p => p.finished);
        if(allDone && fresh.meta.status !== 'finished'){
          fresh.meta.status = 'finished';
          fresh.meta.finishedAt = Date.now();
          await _battleSaveRoom(code, fresh);
        }
      }
    } catch(_){}
  }
}

function _renderBattleWaitOthers(code, room, local){
  const players = Object.entries(room.players || {});
  view.innerHTML = `
    <h2 class="view-title fade-in" style="margin-top:6px"><span class="grk">Ἀγών</span>배틀 진행 중</h2>
    <div class="card" style="padding:10px 12px">${_battleScoreboardHTML(players)}</div>
    <div class="card" style="text-align:center;padding:24px">
      <div style="font-family:var(--font-display);font-size:18px;color:var(--terracotta-d);font-weight:600">${local.score}/${BATTLE_N_Q} 완료</div>
      <div style="font-size:13px;color:var(--clay-d);margin-top:8px;line-height:1.6">다른 참가자가 끝나기를 기다리는 중...</div>
      <div style="font-size:11px;color:var(--clay-d);margin-top:12px;font-style:italic">매치 5분 한도 초과 시 자동 종료</div>
    </div>
  `;

async function _battleForfeit(){

// ===== 명예의 전당 통계 시각화 (v30) =====
// era별 작품 완독 진척 + 최근 배틀 히스토리

function _renderEraStats(){
  if(typeof WORKS === 'undefined') return '<div style="color:var(--clay-d);font-size:12px">데이터 없음</div>';
  // era 정규화: "코이네(1)" → "코이네"
  const eraStats = {};
  const eraOrder = ['상고기', '고전기', '코이네', '후기'];
  WORKS.forEach(w => {
    let era = (w.era || '?').replace(/\([^)]*\)/g, '').trim() || '?';
    if(!eraStats[era]) eraStats[era] = { done: 0, total: 0, sectionsDone: 0, sectionsTotal: 0 };
    eraStats[era].total++;
    if((S.worksFinished || []).includes(w.id)) eraStats[era].done++;
    eraStats[era].sectionsTotal += w.sections ? w.sections.length : 0;
    eraStats[era].sectionsDone += ((S.sectionsDone || {})[w.id] || []).length;
  });
  // 표시 순서: 시대 순 + 모르는 era는 뒤
  const eras = Object.keys(eraStats).sort((a, b) => {
    const ai = eraOrder.indexOf(a);
    const bi = eraOrder.indexOf(b);
    if(ai < 0 && bi < 0) return a.localeCompare(b);
    if(ai < 0) return 1;
    if(bi < 0) return -1;
    return ai - bi;
  });
  return eras.map(era => {
    const s = eraStats[era];
    const pct = s.total > 0 ? Math.round(100 * s.done / s.total) : 0;
    const secPct = s.sectionsTotal > 0 ? Math.round(100 * s.sectionsDone / s.sectionsTotal) : 0;
    return `<div style="margin:8px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
        <span style="font-family:var(--font-display);font-weight:600;color:var(--terracotta-d)">${era}</span>
        <span style="font-size:11px;color:var(--clay-d)">완독 ${s.done}/${s.total} · 섹션 ${s.sectionsDone}/${s.sectionsTotal}</span>
      </div>
      <div style="height:8px;background:var(--ivory-d);border-radius:3px;overflow:hidden;position:relative">
        <div style="height:100%;width:${secPct}%;background:linear-gradient(90deg,var(--clay) 0%,var(--terracotta) 100%);transition:width .6s;border-radius:3px"></div>
        ${pct > 0 ? `<div style="position:absolute;top:0;left:0;height:100%;width:${pct}%;background:var(--terracotta-d);transition:width .6s;border-radius:3px;opacity:.85" title="완독 ${pct}%"></div>` : ''}
      </div>
      <div style="font-size:10px;color:var(--clay-d);margin-top:3px;font-style:italic">진한 막대 = 완독 · 흐린 막대 = 섹션 진행</div>
    </div>`;
  }).join('');
}

function _renderBattleHistory(){
  if(!S.battleHistory || S.battleHistory.length === 0) return '';
  const recent = S.battleHistory.slice(-10).reverse();
  return recent.map(b => {
    const d = new Date(b.date);
    const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
    const medal = b.rank === 1 ? '🥇' : (b.rank === 2 ? '🥈' : (b.rank === 3 ? '🥉' : `${b.rank}.`));
    const accuracy = b.totalQ > 0 ? Math.round(100 * b.correctCount / b.totalQ) : 0;

      <div style="font-family:var(--font-display);font-size:18px;color:var(--terracotta-d);min-width:32px;text-align:center">${medal}</div>
      <div style="flex:1;min-width:0">
        <div style="color:var(--black-glaze)"><b>${b.rank}위</b> / ${b.totalPlayers}명 · 정답 ${b.correctCount}/${b.totalQ} (${accuracy}%)</div>
        <div style="font-size:10.5px;color:var(--clay-d);margin-top:2px">${dateStr} · 점수 ${b.score.toFixed(1)}</div>
      </div>

// 배틀 히스토리에 결과 누적 (최대 20개)
// 인자: {score, correctCount, totalQ, rank, totalPlayers}
function _recordBattleResult(result){
  if(!result || typeof result !== 'object') return;
  if(!S.battleHistory) S.battleHistory = [];
  S.battleHistory.push({
    date: Date.now(),
    score: result.score || 0,
    rank: result.rank || 0,
    totalPlayers: result.totalPlayers || 0,
    correctCount: result.correctCount || 0,
    totalQ: result.totalQ || 0,
  });
  // 최대 20개 유지 (오래된 것부터 제거)
  if(S.battleHistory.length > 20){
    S.battleHistory = S.battleHistory.slice(-20);
  }
  saveState();
}

// ===== 즐겨찾기·북마크 (v25 다태그 + 메모 + 검색 + 필터) =====
const BOOKMARK_TAGS = ['중요', '어려움', '다시 읽기', '문법 예시', '어휘 발굴', '시구 인용', '번역 연습'];

function _ensureBookmarks(){ if(!S.bookmarks) S.bookmarks = {}; }

// 기존 단일 tag(문자열) → 다태그 tags(배열) 자동 마이그레이션
function _migrateBookmark(b){
  if(b && !b.tags){
    b.tags = b.tag ? [b.tag] : ['중요'];
    if(b.note === undefined) b.note = '';
  }
  return b;
}

function bookmarkKey(workId, secN){ return `${workId}::${secN}`; }

function toggleBookmark(workId, secN, tags, note){
  _ensureBookmarks();
  const k = bookmarkKey(workId, secN);
  if(S.bookmarks[k]){
    delete S.bookmarks[k]; saveState(); return false;
  } else {
    let tagsArr;
    if(Array.isArray(tags)) tagsArr = tags.length ? tags : ['중요'];
    else if(typeof tags === 'string' && tags) tagsArr = [tags];
    else tagsArr = ['중요'];
    S.bookmarks[k] = {
      workId, secN,
      tags: tagsArr,
      tag: tagsArr[0],   // 호환성 위해 첫 태그를 단일 tag 필드에도 보존
      note: note || '',
      ts: Date.now()
    };
    saveState(); return true;
  }
}
function isBookmarked(workId, secN){
  _ensureBookmarks();
  return !!S.bookmarks[bookmarkKey(workId, secN)];
}

// 악센트 제거 (검색용)
function _strip(s){
  if(!s) return '';
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

let _bookmarkFilter = { q: '', tag: 'all', sort: 'recent' };

  const all = Object.values(S.bookmarks).map(_migrateBookmark);

// ===== SRS — 간격 반복 학습 (SM-2) =====
function _ensureSRS(){ if(!S.srs) S.srs = {}; }
function _srsKey(word){ return word.g; }
function _srsToday(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}
function srsDueCards(){
  _ensureSRS();
  if(typeof DEFAULT_W === 'undefined') return [];
  const today = _srsToday();
  const due = [];
  for(const w of DEFAULT_W){
    const k = _srsKey(w);
    const st = S.srs[k];
    if(!st){ due.push({word: w, isNew: true, st: null}); }
    else if(st.due <= today){ due.push({word: w, isNew: false, st}); }
  }
  return due;
}
function srsGrade(word, quality){
  _ensureSRS();
  const k = _srsKey(word);
  let st = S.srs[k] || {ef: 2.5, interval: 0, reps: 0, lapses: 0, due: _srsToday()};
  if(quality < 3){
    st.lapses = (st.lapses || 0) + 1;
    st.reps = 0; st.interval = 1;
  } else {
    st.reps = (st.reps || 0) + 1;
    if(st.reps === 1) st.interval = 1;
    else if(st.reps === 2) st.interval = 6;
    else st.interval = Math.round(st.interval * st.ef);
    st.ef = Math.max(1.3, st.ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  }
  st.due = _srsToday() + st.interval * 24 * 60 * 60 * 1000;
  st.lastReview = Date.now();
  S.srs[k] = st;
  saveState();
}
let _srsQueue = null, _srsIdx = 0, _srsCorrect = 0;
function renderSRS(){

// ===== SRS 통계 시각화 (인라인 SVG, 외부 의존성 없음) =====
// 막대 그래프 헬퍼 — 좌측 라벨 + 우측 막대 + 값 표시
function _svgBars(data, opts){
  opts = opts || {};
  const h = opts.height || 24;             // 막대 한 줄 높이
  const labelW = opts.labelW || 70;         // 좌측 라벨 너비
  const valueW = opts.valueW || 36;         // 우측 값 표시 너비
  const gap = 4;
  const max = opts.max || Math.max(1, ...data.map(d => d.value));
  const totalH = data.length * (h + gap);
  const color = opts.color || 'var(--terracotta)';
  const labelColor = opts.labelColor || 'var(--clay-d)';
  return `<svg viewBox="0 0 320 ${totalH}" width="100%" style="display:block">
    ${data.map((d, i) => {
      const y = i * (h + gap);
      const barMaxW = 320 - labelW - valueW - 8;
      const bw = max === 0 ? 0 : Math.max(2, (d.value / max) * barMaxW);
      const hl = d.highlight ? ';font-weight:700;fill:var(--terracotta-d)' : '';
      return `
        <text x="${labelW - 4}" y="${y + h/2 + 4}" font-size="11" text-anchor="end" style="fill:${labelColor}${hl}">${d.label}</text>
        <rect x="${labelW}" y="${y + 4}" width="${barMaxW}" height="${h - 8}" fill="var(--ivory-d)" rx="2"/>
        ${d.value > 0 ? `<rect x="${labelW}" y="${y + 4}" width="${bw}" height="${h - 8}" fill="${d.color || color}" rx="2"/>` : ''}
        <text x="${labelW + barMaxW + 4}" y="${y + h/2 + 4}" font-size="11" style="fill:var(--black-glaze);font-weight:600">${d.value || 0}</text>
      `;
    }).join('')}
  </svg>`;
}

function renderSRSStats(){
  _ensureSRS();
  const cards = Object.values(S.srs || {});
  const today = _srsToday();
  const DAY = 24 * 60 * 60 * 1000;

  // 1) 향후 14일 Due 분포
  const dueBuckets = {};
  for(let i = 0; i < 14; i++) dueBuckets[i] = 0;
  let overdue = 0;
  for(const c of cards){
    if(typeof c.due !== 'number') continue;
    const days = Math.floor((c.due - today) / DAY);
    if(days < 0) overdue++;
    else if(days < 14) dueBuckets[days]++;
  }
  const todayLabel = new Date(today);
  const dueData = [];
  if(overdue > 0) dueData.push({label:'⚠ 연체', value: overdue, color:'var(--terracotta-d)', highlight: true});
  for(let i = 0; i < 14; i++){
    const d = new Date(today + i * DAY);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    const lbl = i === 0 ? `오늘 (${mm}/${dd})` : `${mm}/${dd} ${dow}`;
    dueData.push({label: lbl, value: dueBuckets[i], highlight: i === 0});
  }

  // 2) 지난 7일 학습량 (lastReview 기준)
  const reviewBuckets = {};
  for(let i = 6; i >= 0; i--) reviewBuckets[i] = 0;   // i = 며칠 전
  for(const c of cards){
    if(!c.lastReview) continue;
    const daysAgo = Math.floor((today - _srsDayStart(c.lastReview)) / DAY);
    if(daysAgo >= 0 && daysAgo < 7) reviewBuckets[daysAgo]++;
  }
  const reviewData = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(today - i * DAY);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    const lbl = i === 0 ? `오늘` : (i === 1 ? `어제` : `${mm}/${dd} ${dow}`);
    reviewData.push({label: lbl, value: reviewBuckets[i]});
  }

  // 3) EF (난이도) 분포 — 1.3-1.7 / 1.7-2.0 / 2.0-2.3 / 2.3-2.5 / 2.5+
  const efBuckets = {hard:0, med1:0, med2:0, easy1:0, easy2:0};
  for(const c of cards){
    const ef = c.ef || 2.5;
    if(ef < 1.7) efBuckets.hard++;
    else if(ef < 2.0) efBuckets.med1++;
    else if(ef < 2.3) efBuckets.med2++;
    else if(ef < 2.5) efBuckets.easy1++;
    else efBuckets.easy2++;
  }
  const efData = [
    {label:'1.3–1.7 매우 어려움', value: efBuckets.hard,  color:'#7a2920'},
    {label:'1.7–2.0 어려움',      value: efBuckets.med1,  color:'#9C3F2D'},
    {label:'2.0–2.3 보통',        value: efBuckets.med2,  color:'#C44536'},
    {label:'2.3–2.5 쉬움',        value: efBuckets.easy1, color:'#b59070'},
    {label:'2.5+ 매우 쉬움',      value: efBuckets.easy2, color:'#8a7a6a'},
  ];

  // 4) 반복 횟수 분포
  const repsBuckets = {r0:0, r1:0, r2:0, r3:0, r4plus:0};
  for(const c of cards){
    const r = c.reps || 0;
    if(r === 0) repsBuckets.r0++;
    else if(r === 1) repsBuckets.r1++;
    else if(r === 2) repsBuckets.r2++;
    else if(r === 3) repsBuckets.r3++;
    else repsBuckets.r4plus++;
  }
  const repsData = [
    {label:'0회 (lapse)',  value: repsBuckets.r0},
    {label:'1회',          value: repsBuckets.r1},
    {label:'2회',          value: repsBuckets.r2},
    {label:'3회',          value: repsBuckets.r3},
    {label:'4회+ 숙달',    value: repsBuckets.r4plus, color:'#5a9c5a'},
  ];

  // 누적 통계
  const totalLearned = cards.length;
  const totalReps = cards.reduce((s, c) => s + (c.reps || 0), 0);
  const totalLapses = cards.reduce((s, c) => s + (c.lapses || 0), 0);
  const mastered = repsBuckets.r4plus;
  const lapseRate = (totalReps + totalLapses) > 0 ? Math.round(100 * totalLapses / (totalReps + totalLapses)) : 0;

  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="renderSRS()">← SRS</button>
    <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Στατιστική</span>학습 통계</h2>
    <div class="view-sub">${totalLearned}개 카드 학습 중 · 누적 ${totalReps}회 성공 · ${totalLapses}회 lapse</div>

    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
        <div>
          <div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${mastered}</div>
          <div style="font-size:10px;color:var(--clay-d)">숙달 (4회+)</div>
        </div>
        <div>
          <div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${overdue}</div>
          <div style="font-size:10px;color:var(--clay-d)">연체</div>
        </div>
        <div>
          <div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${lapseRate}%</div>
          <div style="font-size:10px;color:var(--clay-d)">실수율</div>
        </div>
      </div>
    </div>

    <h3 style="font-family:var(--font-display);font-size:14px;color:var(--terracotta-d);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em">향후 14일 복습 일정</h3>
    <div class="card">
      ${dueData.length > 0 ? _svgBars(dueData, {height: 22}) : '<div style="font-size:12px;color:var(--clay-d);text-align:center;padding:14px">예정된 복습이 없습니다.</div>'}
      <div style="font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic;line-height:1.5">
        각 날짜의 막대 길이는 그 날 복습 대기 중인 카드 수입니다. 연체 카드는 지금 풀면 일정이 정상화됩니다.
      </div>
    </div>

    <h3 style="font-family:var(--font-display);font-size:14px;color:var(--terracotta-d);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em">최근 7일 학습량</h3>
    <div class="card">
      ${_svgBars(reviewData, {height: 22, color:'#9C3F2D'})}
      <div style="font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic;line-height:1.5">
        각 날짜에 복습한 카드 수 (마지막 평가 기준). 매일 일정량씩 꾸준히 보는 것이 SRS의 정수입니다.
      </div>
    </div>

    <h3 style="font-family:var(--font-display);font-size:14px;color:var(--terracotta-d);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em">난이도 (EF) 분포</h3>

      </div>

    <h3 style="font-family:var(--font-display);font-size:14px;color:var(--terracotta-d);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em">연속 정답 횟수</h3>

// 보조: timestamp → 그 날의 00:00 timestamp

      <div class="card" style="text-align:center;padding:24px">
        <div style="font-family:var(--font-display);font-size:24px;color:var(--terracotta-d);font-weight:600">${_srsCorrect}/${_srsQueue.length}</div>
        <div style="font-size:12px;color:var(--clay-d);margin-top:6px">세션 완료.</div>
        <button class="btn" style="margin-top:14px" onclick="renderSRS()">메인 →</button>
      </div>`;
    if(typeof addXP === 'function') addXP(_srsCorrect * 3, 'SRS 복습');
    return;
  }
  const card = _srsQueue[_srsIdx];
  const w = card.word;
  const a = (typeof classifyAccent === 'function') ? classifyAccent(w.g) : null;
  const hasSpeech = ('speechSynthesis' in window);
  host.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:11px;color:var(--clay-d);margin-bottom:6px">${_srsIdx+1}/${_srsQueue.length}${card.isNew?' · 새 카드':''}</div>
      <div style="font-family:var(--font-grk);font-size:38px;color:var(--terracotta-d);font-weight:600;line-height:1.2;padding:14px 0">${w.g}</div>
      ${w.r?`<div style="font-family:var(--font-grk);font-size:14px;color:var(--clay-d)">${w.r}</div>`:''}
      ${hasSpeech?`<button class="btn btn-sm btn-o" onclick="speakGreek('${w.g.replace(/'/g,"\\'")}')" style="margin-top:6px;font-size:11px">🔊 발음</button>`:''}
      <div id="srs-answer" style="margin-top:14px;display:none">
        <div style="border-top:1px dashed var(--clay);padding-top:14px">
          <div style="font-size:17px;color:var(--black-glaze);font-weight:500">${w.ko}</div>
          ${w.en?`<div style="font-size:12px;color:var(--clay-d);margin-top:3px;font-style:italic">${w.en}</div>`:''}
          ${a && a.greek ? `<div style="font-size:11px;color:var(--clay-d);margin-top:8px">${a.greek} · ${a.korean}</div>` : ''}
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px">
            <button class="btn btn-sm" data-q="0" style="background:#c84a3a;color:#fff;font-size:11px;padding:8px 4px">다시</button>
            <button class="btn btn-sm btn-o" data-q="3" style="font-size:11px;padding:8px 4px">어려움</button>
            <button class="btn btn-sm" data-q="4" style="font-size:11px;padding:8px 4px">보통</button>
            <button class="btn btn-sm btn-g" data-q="5" style="font-size:11px;padding:8px 4px">쉬움</button>
          </div>
        </div>
      </div>
      <button class="btn btn-o" id="srs-show" style="margin-top:8px">정답 보기</button>
    </div>
  `;
  document.getElementById('srs-show').addEventListener('click', () => {
    document.getElementById('srs-show').style.display = 'none';
    document.getElementById('srs-answer').style.display = 'block';
  });
  host.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    const q = parseInt(b.dataset.q, 10);
    srsGrade(w, q);
    if(q >= 3) _srsCorrect++;
    _srsIdx++;
    renderSRSCard();
  }));
}

// ===== CSV·TSV(Anki) 익스포트 =====
function _downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function exportVocabCSV(words, kind){
  const sep = kind === 'tsv' ? '\t' : ',';
  const quote = (s) => {
    if(kind === 'tsv') return (s || '').replace(/\t/g, ' ').replace(/\n/g, ' ');
    return '"' + (s || '').replace(/"/g, '""') + '"';
  };
  const header = ['그리스어','principal_parts','품사','과','한국어','영어'];
  const rows = [header.join(sep)];
  for(const w of words){
    rows.push([w.g, w.r||'', w.pos||'', w.l||'', w.ko||'', w.en||''].map(quote).join(sep));
  }
  const filename = `paideia_vocab_${new Date().toISOString().slice(0,10)}.${kind}`;
  _downloadFile(filename, '\uFEFF' + rows.join('\n'),
                kind === 'tsv' ? 'text/tab-separated-values' : 'text/csv');
  if(typeof toast === 'function') toast(`${words.length}개 단어 export됨`);
}

// ===== 연관 인용·평행 구절 =====
let _xrefCache = null;
function computeCrossRefs(){
  if(_xrefCache) return _xrefCache;
  if(typeof WORKS === 'undefined') return [];
  const PHRASE_LEN = 4;
  const grams = new Map();
  const norm = (s) => stripAccent(s).toLowerCase();
  for(const w of WORKS){
    for(const sec of (w.sections || [])){
      const tokens = (sec.text || '').split(/[\s\.,;··:!\?\(\)\[\]\—\-\n]+/)
        .map(t => t.replace(/^[''«»"'·]+|[''«»"'·]+$/g, ''))
        .filter(t => t && /[\u0370-\u03FF\u1F00-\u1FFF]/.test(t) && t.length >= 3);
      for(let i = 0; i + PHRASE_LEN <= tokens.length; i++){
        const slice = tokens.slice(i, i + PHRASE_LEN);
        const key = slice.map(norm).join(' ');
        if(!grams.has(key)) grams.set(key, []);
        grams.get(key).push({
          workId: w.id, secN: sec.n,
          original: slice.join(' '),
          workKo: w.workKo, author: w.authorKo
        });
      }
    }
  }
  const xrefs = [];
  for(const [key, occs] of grams.entries()){
    const works = new Set(occs.map(o => o.workId));
    if(works.size >= 2) xrefs.push({phrase: occs[0].original, occurrences: occs});
  }
  const filtered = xrefs.filter(x => x.occurrences.length <= 6);
  filtered.sort((a, b) => b.occurrences.length - a.occurrences.length);
  _xrefCache = filtered.slice(0, 50);
  return _xrefCache;
}
function renderCrossRefs(){
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="setTab('read')">← 원문</button>
    <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Παράλληλα</span>연관 인용·평행 구절</h2>
    <div class="view-sub">두 작품 이상에 동일하게 나타나는 4단어 이상 구절 자동 검출</div>
    <div class="card" id="xref-loading"><div style="text-align:center;padding:20px;color:var(--clay-d)">분석 중... (시간 약 2초)</div></div>
    <div id="xref-body"></div>
  `;
  setTimeout(() => {
    const xrefs = computeCrossRefs();
    const loading = document.getElementById('xref-loading');
    if(loading) loading.remove();
    const host = document.getElementById('xref-body');
    if(!xrefs.length){
      host.innerHTML = '<div class="card"><div style="font-size:13px;color:var(--clay-d)">평행 구절이 검출되지 않았습니다.</div></div>';
      return;
    }
    host.innerHTML = `
      <div class="card">
        <div style="font-size:11px;color:var(--clay-d);margin-bottom:10px">상위 ${Math.min(30, xrefs.length)}개 (총 ${xrefs.length}개) · 빈도 높은 일반 구문 자동 제외</div>
        ${xrefs.slice(0, 30).map(x => `
          <div style="padding:10px 0;border-bottom:1px dashed var(--clay)">
            <div style="font-family:var(--font-grk);font-size:15px;color:var(--terracotta-d);font-weight:600;margin-bottom:6px">${x.phrase}</div>
            ${x.occurrences.map(o => `
              <div style="font-size:11px;color:var(--clay-d);margin-left:8px;padding:2px 0">→ ${o.author} · ${o.workKo} · ${o.secN}</div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    `;
  }, 50);
}
