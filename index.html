function renderWorkSection(workId, secIdx){
  const w = WORKS.find(x=>x.id===workId);
  if(!w) return;
  const sec = w.sections[secIdx];
  if(!sec) return;
  const done = (S.sectionsDone[w.id]||[]).includes(sec.n);
  const colorize = S.readColorize !== false;   // 기본 true (v29 토글)
  // v49: 행 인덱스 + 단락 인덱스를 데이터 속성으로 부여 — 학자 낭독 시간 동기용
  // (a) 시 본문: 행 prefix "N " 가 있으면 그 번호를 data-line 으로
  // (b) 산문: 연속 빈 행 (\n \n \n 패턴) 으로 단락 분리, data-para 인덱스 증가
  // (c) 산문: 문장 종결 부호 (· ; . ? !) 로 문장 분리, span 으로 감쌈 — 단락이 큰 경우의 세밀한 동기 지원
  let paraIdx = 0;
  let sentIdx = 0;   // v49b: 섹션 전체에 걸친 누적 문장 인덱스
  let inSentence = false;
  let lastWasEmpty = false;
  // v52: 문장 인덱스 → 그리스어 본문 매핑 (정역/주석 토글용)
  const sentenceTexts = {};
  const rawLines = sec.text.split('\n');
  const lines = rawLines.map((line, lineIdx)=>{
    const trimmed = line.trim();
    if(!trimmed){
      lastWasEmpty = true;
      // 단락 사이의 공백 줄에서는 문장 강제 종결 (다음 단락의 첫 문장이 새 sentIdx)
      if(inSentence){ inSentence = false; sentIdx += 1; }
      return '<div style="height:6px" data-line-blank="1"></div>';
    }
    // 새 단락 시작 — 직전이 빈 행이고 현재가 첫 비-빈 행
    let attrs = ` data-line-idx="${lineIdx}"`;
    if(lastWasEmpty || lineIdx === 0){
      attrs += ` data-para-idx="${paraIdx}"`;
      paraIdx += 1;
    }
    lastWasEmpty = false;
    // 행 번호 추출 (시 본문)
    const lineNumMatch = /^(\d+)\s+/.exec(trimmed);
    if(lineNumMatch){
      attrs += ` data-line-num="${lineNumMatch[1]}"`;
    }
    // 문장 단위 마크업
    // 라인을 토큰화 후, 토큰 단위로 문장 종결 검사. 종결되면 sentIdx 증가.
    const tokens = line.split(/(\s+)/);
    const parts = [];
    if(!inSentence){
      parts.push(`<span class="sent" data-sent-idx="${sentIdx}">`);
      inSentence = true;
    }
    for(const tok of tokens){
      if(/^\s+$/.test(tok)){
        parts.push(tok);
        // v52: 공백도 문장 본문에 누적 (단어 분리 보존)
        if(sentenceTexts[sentIdx] != null) sentenceTexts[sentIdx] += tok;
        continue;
      }
      const clean = stripWord(tok);
      if(!clean){
        parts.push(tok);
        if(sentenceTexts[sentIdx] != null) sentenceTexts[sentIdx] += tok;
        continue;
      }
      // 새 word 인데 sentence span 이 닫힌 상태면 새로 열기
      if(!inSentence){
        parts.push(`<span class="sent" data-sent-idx="${sentIdx}">`);
        inSentence = true;
      }
      const pc = colorize ? posClassOf(clean) : '';
      parts.push(`<span class="w${pc}" data-w="${encodeURIComponent(clean)}">${tok}</span>`);
      // v52: 본문 누적
      sentenceTexts[sentIdx] = (sentenceTexts[sentIdx] || '') + tok;
      // 문장 종결 — 토큰 끝의 punctuation 검사
      if(/[.;·?!]$/.test(tok)){
        parts.push('</span>');
        sentIdx += 1;
        inSentence = false;
      }
    }
    // 라인 끝 — 문장이 진행 중이면 임시 닫음
    // 한 문장이 두 라인에 걸치는 경우는 *두 span* 으로 분할되되 같은 data-sent-idx 유지.
    // 그러나 sentIdx 가 증가하기 전에 line 이 끝나야 함 — 여기서 sentIdx 증가하지 *않음*.
    if(inSentence){
      parts.push('</span>');
      inSentence = false;   // reset, 다음 라인 시작 시 같은 sentIdx 로 reopen
    }
    return `<div${attrs}>${parts.join('')}</div>`;
  }).join('');
  const noteKey = `${workId}:${sec.n}`;
  const note = (S.workNotes[workId] && S.workNotes[workId][sec.n]) || '';
  // v52: 정역 보유 여부 (큐레이션) — 안내 메시지 토글용
  const hasCurated = (typeof WORK_TRANSLATIONS !== 'undefined') &&
                     Array.isArray(WORK_TRANSLATIONS[`${workId}:${sec.n}`]);
  _ensureTranslationPref();
  const showTrans = S.showTranslation;
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="window._renderWork('${workId}')">← 섹션</button>
    <h2 class="view-title fade-in" style="margin-top:10px">${w.workKo}</h2>
    <div class="cite-line">${w.author}, <i>${w.work}</i> ${sec.label}</div>

    <div class="card">
      <div class="passage" style="font-size:17px;line-height:2.1">${lines}</div>
      <div class="hint">📌 단어를 누르면 Perseus Morpheus + Logeion 사전이 새 창에서 열립니다.${showTrans?(hasCurated?' · <b style="color:var(--terracotta-d)">📖 해석</b> 표시 중 (큐레이션 정역)':' · <b style="color:var(--terracotta-d)">📖 해석</b> 표시 중 (단어 풀이)'):''}</div>
    </div>

    <div class="memo-block">
      <label>이 섹션 메모</label>
      <textarea class="input" id="memo-sec" placeholder="번역·구문·어휘 메모…">${note}</textarea>
    </div>

    <div class="btn-row" style="margin-top:14px;justify-content:space-between">
      <div style="display:flex;gap:8px">
        ${secIdx>0?`<button class="btn btn-sm btn-o" onclick="window._renderWorkSection('${workId}',${secIdx-1})">← 이전</button>`:''}
        ${secIdx<w.sections.length-1?`<button class="btn btn-sm btn-o" onclick="window._renderWorkSection('${workId}',${secIdx+1})">다음 →</button>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm ${showTrans?'':'btn-o'}" id="toggle-trans" title="${showTrans?'해석 끄기':'해석 켜기'} (각 문장 아래 한국어)" aria-label="${showTrans?'해석 끄기':'해석 켜기'}" style="${showTrans?'background:var(--terracotta);color:var(--ivory);border-color:var(--terracotta-d)':''}">📖</button>
        <button class="btn btn-sm btn-o" id="toggle-color" title="${colorize?'색깔 끄기':'색깔 켜기'}" aria-label="${colorize?'색깔 끄기':'색깔 켜기'}">${colorize?'🎨':'⚫'}</button>
        ${('speechSynthesis' in window)?`<button class="btn btn-sm btn-o" id="speak-sec" title="발음 듣기 (TTS)" aria-label="발음 듣기 (TTS)">🔊</button>`:''}
        ${_getScholarAudio(workId, sec.n)?`<button class="btn btn-sm" id="scholar-sec" title="학자 낭독 (인간 음성, 외부 스트림)" aria-label="학자 낭독 (인간 음성, 외부 스트림)" style="background:var(--terracotta);color:var(--ivory);border-color:var(--terracotta-d)">📻</button>`:''}
        <button class="btn btn-sm ${isBookmarked(workId,sec.n)?'':'btn-o'}" id="bookmark-sec" title="즐겨찾기" aria-label="즐겨찾기">${isBookmarked(workId,sec.n)?'★':'☆'}</button>
        <button class="btn btn-sm" id="save-sec-memo">저장</button>
        <button class="btn btn-sm ${done?'btn-o':''}" id="mark-sec-done">${done?'✓ 완독':'완독 (+20 XP)'}</button>
      </div>
    </div>
  `;
  view.querySelectorAll('.w').forEach(el=> el.addEventListener('click', ()=> openLookup(el.dataset.w)));
  // v52: 해석 토글
  const transBtn = document.getElementById('toggle-trans');
  if(transBtn) transBtn.addEventListener('click', () => {
    S.showTranslation = !S.showTranslation;
    saveState();
    _applyTranslationDisplay(workId, sec.n, sentenceTexts);
    // 버튼 시각 상태 즉시 반영
    if(S.showTranslation){
      transBtn.classList.remove('btn-o');
      transBtn.style.background = 'var(--terracotta)';
      transBtn.style.color = 'var(--ivory)';
      transBtn.style.borderColor = 'var(--terracotta-d)';
      transBtn.title = '해석 끄기';
      transBtn.setAttribute('aria-label', '해석 끄기');
      toast(hasCurated ? '해석 켜짐 · 큐레이션 정역' : '해석 켜짐 · 단어 풀이 (정역 미수록)');
    } else {
      transBtn.classList.add('btn-o');
      transBtn.style.background = '';
      transBtn.style.color = '';
      transBtn.style.borderColor = '';
      transBtn.title = '해석 켜기';
      transBtn.setAttribute('aria-label', '해석 켜기');
      toast('해석 꺼짐');
    }
    // hint 텍스트도 갱신
    const passageHint = view.querySelector('.passage + .hint');
    if(passageHint){
      const baseHint = '📌 단어를 누르면 Perseus Morpheus + Logeion 사전이 새 창에서 열립니다.';
      if(S.showTranslation){
        passageHint.innerHTML = baseHint + (hasCurated ? ' · <b style="color:var(--terracotta-d)">📖 해석</b> 표시 중 (큐레이션 정역)' : ' · <b style="color:var(--terracotta-d)">📖 해석</b> 표시 중 (단어 풀이)');
      } else {
        passageHint.textContent = baseHint;
      }
    }
  });
  // v52: 초기 진입 시 토글 ON 이면 즉시 적용
  if(S.showTranslation) _applyTranslationDisplay(workId, sec.n, sentenceTexts);
  document.getElementById('toggle-color').addEventListener('click', () => {
    S.readColorize = !colorize;
    saveState();
    renderWorkSection(workId, secIdx);
    toast(S.readColorize ? '품사별 색칠 켜짐' : '품사별 색칠 꺼짐');
  });
  document.getElementById('save-sec-memo').addEventListener('click', ()=>{
    if(!S.workNotes[workId]) S.workNotes[workId] = {};
    S.workNotes[workId][sec.n] = document.getElementById('memo-sec').value;

  document.getElementById('mark-sec-done').addEventListener('click', ()=>{
    if(!S.sectionsDone[workId]) S.sectionsDone[workId] = [];
    if(!S.sectionsDone[workId].includes(sec.n)){

      }
      saveState();
      renderWorkSection(workId, secIdx);
    }
  });
  const bb = document.getElementById('bookmark-sec');
  if(bb) bb.addEventListener('click', ()=>{
    const added = toggleBookmark(workId, sec.n);
    toast(added ? '북마크 추가됨 ⭐' : '북마크 제거됨');
    renderWorkSection(workId, secIdx);
  });
  const sp = document.getElementById('speak-sec');
  if(sp) sp.addEventListener('click', ()=>{
    if(speechSynthesis.speaking){
      stopSpeech();

  });
}

function stripWord(w){
  // 그리스어 단어에서 문장부호·생략 부호 제거
  return w.replace(/[,;.·"'᾽’‘()\[\]…—–\-?!]/g,'').trim();
}
function renderPassage(id){
  const r = READINGS.find(x=>x.id===id);
  if(!r) return;
  // 한 줄씩 분리 후 단어별로 wrap
  const lines = r.greek.split('\n').map((line,i)=>{
    const num = i+1;
    const words = line.split(/(\s+)/).map(tok=>{
      if(/^\s+$/.test(tok)) return tok;
      const clean = stripWord(tok);
      if(!clean) return tok;
      return `<span class="w" data-w="${encodeURIComponent(clean)}">${tok}</span>`;
    }).join('');
    return `<div><span class="pn">${num}</span>${words}</div>`;
  }).join('');

      <textarea class="input" id="analysis" placeholder="주어·동사·수식 관계, 운율, 수사 등 정밀 분석…">${ana}</textarea>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button class="btn ${done?'btn-o':''}" id="mark-done">${done?'✓ 완독 표시됨':'완독 표시 (+100 XP)'}</button>
      <button class="btn btn-sm btn-o" id="save-memo">메모 저장</button>
    </div>
  `;
  view.querySelectorAll('.w').forEach(el=> el.addEventListener('click', ()=> openLookup(el.dataset.w)));
  document.getElementById('mark-done').addEventListener('click', ()=>{
    if(!S.readDone.includes(id)){
      S.readDone.push(id);
      addXP(100, '원문 완독');
      saveState();
      renderPassage(id);
    }
  });
  document.getElementById('save-memo').addEventListener('click', ()=>{
    const m = document.getElementById('memo').value;
    const a = document.getElementById('analysis').value;
    const hadAna = !!S.readAnalysis[id];
    S.readNotes[id] = m;
    S.readAnalysis[id] = a;
    if(a.trim().length > 30 && !hadAna){ S.analysisWritten += 1; checkBadges(); }
    saveState();
    toast('메모 저장됨');
  });
}
// ===== 악센트 분석 (Smyth's Greek Grammar §156-181) =====
// Unicode NFD 결합기호 기반. 5종 분류 + barytone + atonic.
const _ACC = {
  ACUTE:'\u0301', GRAVE:'\u0300', CIRCUMFLEX:'\u0342',
  SMOOTH:'\u0313', ROUGH:'\u0314', DIAERESIS:'\u0308',
  IOTA_SUB:'\u0345', MACRON:'\u0304'
};
const _GRK_VOWELS = new Set('αεηιουωΑΕΗΙΟΥΩ');
const _DIPH_1 = new Set('αεηοΑΕΗΟυΥ');
const _DIPH_2 = new Set('ιυΙΥ');
function _isCombining(c){ return /\p{M}/u.test(c); }

function syllabifyGreek(word){
  // 그리스어 단어 → 음절 핵 배열 (이중모음 합침, diaeresis 시 분리)
  const nfd = word.normalize('NFD');
  const syls = [];
  let i = 0;
  while(i < nfd.length){
    const c = nfd[i];
    if(_GRK_VOWELS.has(c)){
      const v = c;
      const marks = new Set();
      let j = i + 1;
      while(j < nfd.length && _isCombining(nfd[j])){ marks.add(nfd[j]); j++; }
      let secondV = '';
      if(_DIPH_1.has(v) && j < nfd.length && _DIPH_2.has(nfd[j])){
        let k = j + 1;
        const tmpMarks = new Set();
        while(k < nfd.length && _isCombining(nfd[k])){ tmpMarks.add(nfd[k]); k++; }
        if(!tmpMarks.has(_ACC.DIAERESIS)){
          secondV = nfd[j];
          tmpMarks.forEach(m => marks.add(m));
          j = k;
        }
      }
      syls.push({vowels: v + secondV, marks: marks, idx: syls.length});
      i = j;
    } else {
      i++;
    }
  }
  return syls;
}

function classifyAccent(word){
  if(!word) return {type:'no_vowel', greek:'', korean:'', syllableCount:0};
  const syls = syllabifyGreek(word);
  const n = syls.length;
  if(n === 0) return {type:'no_vowel', greek:'', korean:'모음 없음', syllableCount:0};
  let accIdx = -1, mark = null;
  for(const s of syls){
    if(s.marks.has(_ACC.ACUTE)){ accIdx = s.idx; mark = 'acute'; break; }
    if(s.marks.has(_ACC.CIRCUMFLEX)){ accIdx = s.idx; mark = 'circumflex'; break; }
    if(s.marks.has(_ACC.GRAVE)){ accIdx = s.idx; mark = 'grave'; break; }
  }
  if(accIdx === -1){
    return {type:'atonic', greek:'ἄτονον', korean:'무강세 (전·후접어 가능)',
            accentIdx:-1, position:null, mark:null, syllableCount:n};
  }
  const posFromEnd = accIdx - (n - 1);
  const posMap = {'0':'ultima','-1':'penult','-2':'antepenult'};
  const posLabel = posMap[String(posFromEnd)] || 'beyond';
  if(mark === 'grave'){
    return {type:'barytone', greek:'βαρύτονον',
            korean:'바리톤 — oxytone의 문장 중간 변형',
            accentIdx:accIdx, position:posLabel, mark:'grave', syllableCount:n};
  }
  const map = {
    'acute': {
      '0':  ['oxytone',       'ὀξύτονον',       '옥시톤 — 마지막 음절 예각'],
      '-1': ['paroxytone',    'παροξύτονον',    '파록시톤 — 끝에서 둘째 음절 예각'],
      '-2': ['proparoxytone', 'προπαροξύτονον', '프로파록시톤 — 끝에서 셋째 음절 예각']
    },
    'circumflex': {
      '0':  ['perispomenon',     'περισπώμενον',     '페리스포메논 — 마지막 음절 곡절'],
      '-1': ['properispomenon',  'προπερισπώμενον',  '프로페리스포메논 — 끝에서 둘째 음절 곡절']
    }
  };
  const f = map[mark] && map[mark][String(posFromEnd)];
  if(f) return {type:f[0], greek:f[1], korean:f[2],
                accentIdx:accIdx, position:posLabel, mark:mark, syllableCount:n};
  return {type:'unknown', greek:'', korean:'',
          accentIdx:accIdx, position:posLabel, mark:mark, syllableCount:n};
}

function stripAccent(word){
  // 악센트만 제거 (breathing·iota subscript는 유지) — 퀴즈용
  if(!word) return '';
  return word.normalize('NFD')
    .replace(new RegExp('[' + _ACC.ACUTE + _ACC.GRAVE + _ACC.CIRCUMFLEX + ']', 'g'), '')
    .normalize('NFC');
}

function accentInfoBlock(w){
  // 단어 분석 팝업용 악센트 정보 HTML 조각
  const a = classifyAccent(w);
  if(a.type === 'no_vowel') return '';
  const posKor = {ultima:'마지막', penult:'끝에서 둘째', antepenult:'끝에서 셋째'}[a.position] || '';
  const markKor = {acute:'예각 ´', circumflex:'곡절 ῀', grave:'둔각 `'}[a.mark] || '';
  return `
    <div style="background:linear-gradient(135deg, var(--ivory) 0%, var(--ivory-d) 100%);
                border-left:3px solid var(--terracotta);
                padding:8px 12px;margin-bottom:10px;border-radius:6px;font-size:12px">
      <div style="color:var(--terracotta-d);font-weight:600">악센트 ·
        ${a.greek ? `<span style="font-family:var(--font-grk)">${a.greek}</span> · ` : ''}${a.korean}
      </div>
      ${a.position ? `<div style="color:var(--clay-d);margin-top:3px;font-size:11px">
        ${a.syllableCount}음절 · ${posKor} 음절 · ${markKor}
      </div>` : ''}
    </div>`;
}

// ===== 구문 역할 힌트 =====
// 격(case)·동사 형태에서 절 내 역할 한국어로 추론. AGDT dependency 트리 없이도
// 단어 단위 구문 학습 보조 (Smyth §1278+ 격 기능 참조).
function syntaxHintBlock(analyses){
  if(!analyses || !analyses.length) return '';
  const CASE_HINTS = {
    '주격': '주어 · 보어',
    '호격': '부름 (호격)',
    '속격': '소유 · 기원 · 부분 (of)',
    '여격': '간접목적 · 도구 · 장소 (to · with · in)',
    '대격': '직접목적 · 동작 대상'
  };
  const items = [];
  const seen = new Set();
  for(const a of analyses){
    const p = a.p || '';
    for(const [c, h] of Object.entries(CASE_HINTS)){
      if(p.includes(c)){
        const key = c;
        if(!seen.has(key)){ seen.add(key); items.push(`<b>${c}</b> — ${h}`); }
        break;
      }
    }
    if(p.startsWith('동사')){
      if(!seen.has('동사')){ seen.add('동사'); items.push('<b>동사</b> — 절의 핵 (술어)'); }
    } else if(p.startsWith('분사')){
      if(!seen.has('분사')){ seen.add('분사'); items.push('<b>분사</b> — 부속절 (시간·원인·조건·양보)'); }
    } else if(p.startsWith('부정사')){
      if(!seen.has('부정사')){ seen.add('부정사'); items.push('<b>부정사</b> — 보충어·간접화법·부정사구'); }
    } else if(p.startsWith('관사')){
      if(!seen.has('관사')){ seen.add('관사'); items.push('<b>관사</b> — 명사 한정 (성·수·격 일치)'); }
    } else if(p.startsWith('전치사')){
      if(!seen.has('전치사')){ seen.add('전치사'); items.push('<b>전치사</b> — 격 지배 (속·여·대격)'); }
    }
  }
  if(!items.length) return '';
  return `
    <div style="background:#f4ebe2;border-left:3px solid var(--clay-d);padding:8px 12px;margin-bottom:10px;border-radius:6px;font-size:12px">
      <div style="color:var(--clay-d);font-weight:700;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase">📐 구문 역할</div>
      <div style="color:var(--black-glaze-l);line-height:1.6">${items.join(' · ')}</div>
    </div>`;
}

// ===== 품사 색상 분류 =====
// 본문 단어 → MORPH_LOOKUP 룩업 → parse 첫 단어 → 품사 클래스.
function posClassOf(word){
  if(typeof MORPH_LOOKUP === 'undefined') return '';
  const an = MORPH_LOOKUP[word];
  if(!an || !an[0] || !an[0].p) return '';
  const p = an[0].p;
  if(p.startsWith('명사'))    return ' pos-noun';
  if(p.startsWith('동사'))    return ' pos-verb';
  if(p.startsWith('형용사'))  return ' pos-adj';
  if(p.startsWith('관사'))    return ' pos-art';
  if(p.startsWith('전치사'))  return ' pos-prep';
  if(p.startsWith('부사'))    return ' pos-adv';
  if(p.startsWith('접속사'))  return ' pos-conj';
  if(p.startsWith('대명사'))  return ' pos-pron';
  if(p.startsWith('분사'))    return ' pos-ptcp';
  if(p.startsWith('부정사'))  return ' pos-inf';
  return '';
}

// ===== 형태분석 데이터 지연 로드 (data-morph.js, ~4 MB) =====
// SW가 activate 후 백그라운드로 미리 받으므로 보통은 즉시 완료.
// 미캐시 상태에서 단어 첫 클릭 시 한 번만 약 0.5 MB(gzip) 받음.
let _morphLoadPromise = null;
function ensureMorph(){
  if (typeof MORPH_LOOKUP !== 'undefined') return Promise.resolve();
  if (_morphLoadPromise) return _morphLoadPromise;
  _morphLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'data-morph.js';
    s.onload = () => resolve();
    s.onerror = () => { _morphLoadPromise = null; reject(new Error('형태분석 데이터 로드 실패')); };
    document.head.appendChild(s);
  });
  return _morphLoadPromise;
}
window.ensureMorph = ensureMorph;

function openLookup(encWord){
  const w = decodeURIComponent(encWord);
  if(!w) return;
  // 형태분석 데이터 미로드 시: 모달에 로딩 표시 후 비동기 fetch
  if(typeof MORPH_LOOKUP === 'undefined'){
    const modal = document.getElementById('modal');
    const modalBg = document.getElementById('modal-bg');
    modal.innerHTML = `
      <button class="modal-close" onclick="_closeModal()" aria-label="닫기">×</button>
      <div style="text-align:center;padding:34px 22px">
        <div style="font-family:var(--font-grk);font-size:26px;color:var(--terracotta-d);font-weight:600;margin-bottom:14px;line-height:1.2">${w}</div>
        <div style="font-size:13px;color:var(--black-glaze);margin-bottom:6px">형태분석 데이터 로딩 중…</div>
        <div style="font-size:11px;color:var(--clay-d);font-style:italic">AGDT v2.1 · 37,154 키 · 한 번만 받습니다</div>
      </div>
    `;
    modalBg.classList.add('show');   // v32 fix: 이전 버전 'open'은 CSS에 정의되지 않아 로딩 모달이 표시되지 않던 버그
    ensureMorph()
      .then(() => openLookup(encWord))   // 로드 완료 시 다시 호출 (이제 가드 통과)
      .catch(err => {
        modal.innerHTML = `
          <button class="modal-close" onclick="_closeModal()" aria-label="닫기">×</button>
          <div style="padding:24px;text-align:center">
            <div style="font-family:var(--font-grk);font-size:22px;color:var(--terracotta-d);margin-bottom:10px">${w}</div>
            <div style="font-size:13px;color:var(--black-glaze)">${err.message}</div>
            <div style="font-size:11px;color:var(--clay-d);margin-top:8px">네트워크 확인 후 다시 시도해 주세요.</div>
            <div style="margin-top:14px"><a class="btn btn-sm btn-o" href="https://www.perseus.tufts.edu/hopper/morph?l=${encWord}&la=greek" target="_blank" rel="noopener">Perseus 형태분석 →</a></div>
          </div>
        `;
      });
    return;
  }
  // 형태분석 룩업 시도
  const analyses = (typeof MORPH_LOOKUP !== 'undefined') ? MORPH_LOOKUP[w] : null;
  // v48: 악센트 분류를 한 줄 형식으로 다시 노출 — v32 에서 제거됐던 것이지만,
  // v47 의 Τόνος 학습 모드와 통합 목적으로 *위치/종류 라벨* 만 압축 표시.
  // 단어 자체의 다이아크리틱은 그대로 보이므로 중복이 아님 — 사용자가 *분류명* 을 학습.
  let accentBlock = '';
  if(typeof _classifyAccent === 'function' && typeof ACCENT_POS_NAMES !== 'undefined'){
    const cls = _classifyAccent(w);
    if(cls && cls.accentPos && cls.accentType){
      const posLbl = ACCENT_POS_NAMES[cls.accentPos] && ACCENT_POS_NAMES[cls.accentPos].ko;
      const typLbl = ACCENT_TYPE_NAMES[cls.accentType] && ACCENT_TYPE_NAMES[cls.accentType].ko;
      if(posLbl && typLbl){
        accentBlock = `<div style="font-size:11px;color:var(--clay-d);margin-bottom:8px;letter-spacing:.02em" title="음절 수 · 강세 위치 · 강세 종류">
          ⛓ ${cls.nSyllables}음절 · ${posLbl} · ${typLbl}
        </div>`;
      }
    }
  }
  const syntaxBlock = syntaxHintBlock(analyses);
  const perseusURL = `https://www.perseus.tufts.edu/hopper/morph?l=${encWord}&la=greek`;
  const logeionURL = `https://logeion.uchicago.edu/${encWord}`;
  const modal = document.getElementById('modal');
  const modalBg = document.getElementById('modal-bg');
  let body = '';
  if(analyses && analyses.length){
    const allAuto = analyses.every(a => a.auto);
    const hasAuto = analyses.some(a => a.auto);
    const sourceLabel = allAuto
      ? 'CLTK 자동 lemmatize · 표제어만 (격·시제 미식별)'
      : (hasAuto ? '혼합 분석 (수동 + 자동)' : 'AGDT 수동 분석 · ' + analyses.length + '가지 가능성');
    body = `
      <div style="font-family:var(--font-grk);font-size:28px;color:var(--terracotta-d);font-weight:600;line-height:1.2;margin-bottom:8px">${w}</div>
      ${accentBlock}
      ${syntaxBlock}
      <div style="font-size:11px;color:var(--clay-d);margin-bottom:10px">${sourceLabel}</div>
      ${analyses.map((a,i)=>`
        <div style="background:var(--ivory-d);border:1px solid var(--clay);border-radius:8px;padding:11px 13px;margin-bottom:8px${a.auto?';opacity:.92':''}">
          ${analyses.length>1?`<div style="font-size:10px;color:var(--clay-d);margin-bottom:4px">분석 ${i+1}${a.auto?' (자동)':''}</div>`:''}
          <div style="font-family:var(--font-grk);font-size:18px;color:var(--black-glaze);font-weight:600">표제어 → <span style="color:var(--terracotta-d)">${a.l}</span></div>
          <div style="font-size:13px;color:var(--black-glaze-l);margin-top:4px">${a.p}</div>
          ${a.k?`<div style="font-size:13px;color:var(--terracotta-d);margin-top:6px;font-weight:600">의미: ${a.k}</div>`:`<div style="font-size:11px;color:var(--clay-d);margin-top:6px;font-style:italic">한국어 풀이 미수록 — 외부 사전 참조</div>`}
        </div>
      `).join('')}
      <div class="btn-row" style="margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="_lookupToSearch('${encWord}', '${(analyses[0] && analyses[0].l) ? encodeURIComponent(analyses[0].l) : ''}')" title="본 앱 본문에서 이 표제어의 모든 등장 검색" aria-label="본 앱 본문에서 이 표제어의 모든 등장 검색">🔍 본문 검색</button>
        <a class="btn btn-sm btn-o" href="${perseusURL}" target="_blank" rel="noopener">Perseus Morpheus ↗</a>
        <a class="btn btn-sm btn-o" href="${logeionURL}" target="_blank" rel="noopener">Logeion 사전 ↗</a>
        <button class="btn btn-sm btn-g" onclick="window._closeModal()">닫기</button>
      </div>
    `;
  } else {
    body = `
      <div style="font-family:var(--font-grk);font-size:28px;color:var(--terracotta-d);font-weight:600;line-height:1.2;margin-bottom:8px">${w}</div>
      ${accentBlock}
      <div style="font-size:12px;color:var(--clay-d);margin-bottom:14px;line-height:1.5">이 작품은 AGDT 검증 분석이 등록되지 않았습니다.<br>외부 사전에서 형태·의미를 확인하세요.</div>
      <div class="btn-row" style="flex-wrap:wrap">
        <button class="btn btn-sm" onclick="_lookupToSearch('${encWord}', '')" title="본 앱 본문에서 이 어형의 등장 검색" aria-label="본 앱 본문에서 이 어형의 등장 검색">🔍 본문 검색</button>
        <a class="btn btn-sm btn-o" href="${perseusURL}" target="_blank" rel="noopener">Perseus Morpheus ↗</a>
        <a class="btn btn-sm btn-g" href="${logeionURL}" target="_blank" rel="noopener">Logeion 사전 ↗</a>
        <button class="btn btn-sm btn-o" onclick="window._closeModal()">닫기</button>
      </div>
      <div class="hint" style="margin-top:10px">📌 AGDT 분석은 호메로스 <i>Iliad</i> 1권 · <i>Odyssey</i> 1권 · 아이스킬로스 <i>Persae</i> 에서만 제공됩니다.</div>
    `;
  }
  modal.innerHTML = body;
  modalBg.classList.add('show');
}

// 진입 카드 클릭을 body 레벨에서 위임. 인라인 onclick은 모바일 사파리에서
// 자식 div 클릭의 버블링이 불안정해 일부 카드가 안 눌리는 문제를 우회.
document.body.addEventListener('click', function(e){
  const t = e.target.closest('[data-render]');

// ── v41: 진단 modal ─────────────────────────────────────────────────────────
// 사용자가 stale SW · 캐시 불일치로 갇혔을 때의 회복 경로.
// 홈 푸터 "진단" 링크에서 호출. SW 의 CACHE_VERSION 을 MessageChannel 로 질의해
// APP_VERSION 과 비교한다. 불일치 시 강제 새로고침 또는 reset.html 로 안내.
window._appDiagnose = async function(){
  let swVersion = '(미등록)';
  let swState = '(미등록)';
  let hasWaiting = false;
  let mismatch = false;
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        hasWaiting = !!reg.waiting;
        const ctrl = navigator.serviceWorker.controller;
        if (ctrl) {
          swState = ctrl.state;
          swVersion = await new Promise((resolve) => {
            const ch = new MessageChannel();
            const tm = setTimeout(()=>resolve('(응답 없음)'), 1500);
            ch.port1.onmessage = (e) => {
              clearTimeout(tm);
              resolve((e.data && e.data.version) ? e.data.version : '(미상)');
            };
            try { ctrl.postMessage('getVersion', [ch.port2]); }
            catch(_){ clearTimeout(tm); resolve('(전송 실패)'); }
          });
          mismatch = swVersion.startsWith('v') && swVersion !== APP_VERSION;
        } else {
          swState = '(controller 없음 — 첫 로드 또는 비활성)';
        }
      }
    } else {
      swState = '(SW 미지원 브라우저)';
    }
  } catch (e) { /* ignore */ }

  const modal = document.getElementById('modal');
  const modalBg = document.getElementById('modal-bg');
  const warnColor = '#c44536';
  modal.innerHTML = `
    <div style="font-size:18px;font-weight:600;color:var(--terracotta-d);margin-bottom:6px">앱 진단 · 문제 해결</div>
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:14px">eSpeak 로드 실패, 화면 갱신 안 됨 등 동기화 문제 회복용</div>

    <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:12px">
      <tr><td style="padding:5px 0;color:var(--clay-d);width:42%">앱 HTML</td>
          <td style="padding:5px 0;font-family:monospace">${APP_VERSION}</td></tr>
      <tr><td style="padding:5px 0;color:var(--clay-d)">Service Worker</td>
          <td style="padding:5px 0;font-family:monospace">${swVersion}${mismatch?` <span style="color:${warnColor}">⚠ 불일치</span>`:''}</td></tr>
      <tr><td style="padding:5px 0;color:var(--clay-d)">SW 상태</td>
          <td style="padding:5px 0;font-family:monospace;font-size:11px">${swState}</td></tr>
      <tr><td style="padding:5px 0;color:var(--clay-d)">대기 중 새 SW</td>
          <td style="padding:5px 0;font-family:monospace">${hasWaiting?`<span style="color:${warnColor}">있음</span>`:'없음'}</td></tr>
    </table>

    ${(mismatch || hasWaiting) ? `<div class="hint" style="margin-bottom:12px;color:${warnColor};border-left-color:${warnColor}">새 버전이 대기 중입니다. <b>강제 새로고침</b>으로 즉시 적용하세요.</div>` : ''}

    <div style="font-size:12px;color:var(--clay-d);line-height:1.65;margin-bottom:14px;background:var(--ivory-d);padding:10px 12px;border-radius:6px">
      <b>강제 새로고침</b>: 대기 중인 새 SW 활성화 후 페이지 재로드. 학습 진도는 유지됩니다.<br>
      <b style="color:${warnColor}">전체 초기화</b>: SW · 캐시 · 학습 진도 모두 폐기. 다른 방법이 안 될 때만.
    </div>

    <div class="btn-row" style="flex-wrap:wrap;gap:6px">
      <button class="btn btn-sm" id="diag-soft-refresh">강제 새로고침</button>
      <a class="btn btn-sm btn-o" href="./reset.html">전체 초기화 ↗</a>
      <button class="btn btn-sm btn-g" onclick="window._closeModal()">닫기</button>
    </div>
  `;
  modalBg.classList.add('show');

  const softBtn = modal.querySelector('#diag-soft-refresh');
  if(softBtn) softBtn.addEventListener('click', async () => {
    softBtn.disabled = true;
    softBtn.textContent = '갱신 중…';
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      // 1) 새 SW 가 'waiting' 상태로 대기 중이면 깨움
      if (reg && reg.waiting) {
        reg.waiting.postMessage('skipWaiting');
      }
      // 2) 등록부에 있는 update 도 한 번 강제 (서버에 새 sw.js 가 있을 때)
      if (reg && typeof reg.update === 'function') {
        try { await reg.update(); } catch(_){}
      }
    } catch (_) {}
    // 3) 캐시 버스팅 쿼리로 reload — network-first HTML 분기가 확실히 새 HTML 받음
    const url = location.pathname + '?fresh=' + Date.now() + (location.hash || '');
    location.replace(url);
  });
};

async function init(){
  const sp = document.getElementById('splash-stage');
  const stage = (msg) => { if(sp) sp.textContent = msg; };
  try {
    stage('상태 로드 중…');
    const saved = await load();
    if(saved){
      Object.assign(S, saved);
    }
    stage('사용자 ID 확인 중…');
    if(!S.userId){
      S.userId = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
    }
    stage('연속 출석 갱신 중…');
    updateStreak();
    saveState();
    stage('배너 그리는 중…');
    refreshBanner();
    stage('홈 화면 렌더 중…');
    setTab('home');
  } catch(e) {
    if(typeof __paideiaShowError === 'function'){
      __paideiaShowError('init() 단계 실패',
        (e.message || String(e)) +
        (e.stack ? '\n\n' + e.stack.split('\n').slice(0,4).join('\n') : ''));
    } else {
      throw e;
    }
  }
}
// ===== 읽기 시간 추정 =====
// 학습자 그리스어 읽기 속도: 약 40 단어/분 (느린 정독). 산문은 5/분 빠름.
function estimateReadingMinutes(work){
  if(!work || !work.sections) return 0;
  let words = 0;
  for(const sec of work.sections){
    words += (sec.text || '').split(/\s+/).filter(Boolean).length;
  }
  const wpm = work.kind === 'prose' ? 45 : 35;
  return Math.max(1, Math.round(words / wpm));
}

// ===== 음성 합성 (TTS) — v34: 다발음체계 ====================================
// 학술 배경: 브라우저 TTS는 OS가 제공하는 음성만 사용 가능하고, 모든 주요
// 플랫폼이 그리스어로 제공하는 것은 현대 헬라어(el-GR) 음성뿐이다. 현대
// 발음은 고전 아티카(5–4c BCE)와 자음·모음 양면에서 크게 다르다 (W.S.
// Allen, Vox Graeca, 3rd ed., 1987; cf. Ancient Greek phonology, Wikipedia).
//
// 우회법: 그리스어 본문을 라틴 문자 음역으로 변환 후, 이탈리아어 음성으로
// 발화한다. 이탈리아어의 5모음 체계·자음 단순성·'h' 무음·'c+a/o/u=[k]' 등의
// 음운적 성질이 Erasmian·Restored 음운에 비교적 가깝다. 한계:
//   ◇ 고저강세(pitch accent) 미재현 — 화자가 stress로 읽음
//   ◇ 기식음(aspiration) θ/φ/χ는 평이한 [t/p/k]로 약화
//   ◇ 복원 발음의 υ [y]는 이탈리아어에 없어 [i]로 근사
//   ◇ rough breathing [h]는 이탈리아 'h' 무음으로 약화
// 학술적 엄밀함이 필요하면 ScorpioMartianus 등의 학자 녹음을 권장.

  const entries = SCHOLAR_AUDIO[workId];

// v49: audio element 의 timeupdate 를 listen 하여 본문 view 의 행/단락 highlight 토글
// cues = [{t: seconds, unit: 'line'|'para', value: number}, ...] — t 오름차순 가정
let _syncCurrentIdx = -1;
function _attachSyncHighlight(audioEl, cues){
  if(!audioEl || !cues) return;
  // 정렬 보장
  cues = cues.slice().sort((a, b) => a.t - b.t);

  function _clear(){
    document.querySelectorAll('.passage div.now-speaking').forEach(el => el.classList.remove('now-speaking'));
    document.querySelectorAll('.passage .sent.now-speaking-sent').forEach(el => el.classList.remove('now-speaking-sent'));
  }

  function _applyAt(t){
    // 현재 t 가 속한 cue 찾기 — 가장 큰 cue.t <= t
    let idx = -1;
    for(let i = 0; i < cues.length; i++){
      if(cues[i].t <= t) idx = i;
      else break;
    }
    if(idx === _syncCurrentIdx) return;   // 변화 없음
    _syncCurrentIdx = idx;
    _clear();
    if(idx < 0) return;
    const cue = cues[idx];
    // selector: data-line-num·data-para-idx·data-sent-idx
    let sel;
    if(cue.unit === 'line')        sel = `.passage div[data-line-num="${cue.value}"]`;
    else if(cue.unit === 'sent')   sel = `.passage .sent[data-sent-idx="${cue.value}"]`;
    else                           sel = `.passage div[data-para-idx="${cue.value}"]`;
    // sent unit 은 *복수 elements* 가능 (한 문장이 여러 라인에 걸칠 때) — querySelectorAll
    const targets = cue.unit === 'sent' ? document.querySelectorAll(sel) : [document.querySelector(sel)];
    let first = null;
    for(const target of targets){
      if(!target) continue;
      if(cue.unit === 'sent') target.classList.add('now-speaking-sent');
      else target.classList.add('now-speaking');
      if(!first) first = target;
    }
    if(first){
      // 자동 스크롤 — viewport 밖이면 부드럽게
      const rect = first.getBoundingClientRect();
      if(rect.top < 80 || rect.bottom > window.innerHeight - 120){
        first.scrollIntoView({behavior:'smooth', block:'center'});
      }
    }
  }

  audioEl.addEventListener('timeupdate', () => _applyAt(audioEl.currentTime));
  audioEl.addEventListener('pause', _clear);
  audioEl.addEventListener('ended', () => { _clear(); _syncCurrentIdx = -1; });
  audioEl.addEventListener('seeking', () => { _syncCurrentIdx = -1; });
  // modal 닫힐 때도 cleanup — modal-bg 의 mutation observer
  const modalBg = document.getElementById('modal-bg');
  if(modalBg){
    const obs = new MutationObserver(() => {
      if(!modalBg.classList.contains('show')){
        _clear();
        _syncCurrentIdx = -1;
        obs.disconnect();
      }
    });
    obs.observe(modalBg, {attributes:true, attributeFilter:['class']});
  }
}

// 아포스트로피 정규화 (v38) — Unicode 변형들을 ASCII로 통일하여 elision 맵 매칭
// U+2019 right single quote (현대 문서 빈출), U+1FBD Greek koronis (Greek 정자법),
// U+02BC modifier apostrophe (음운 표기) → U+0027 ASCII apostrophe.
function _normalizeApostrophes(text){
  return text ? text.replace(/[\u2019\u1FBD\u02BC]/g, "'") : text;
}

// Elision 복원 (v38) — 한국 iPad의 monotonic el 음성이 bare 자음(δ', τ', κατ' 등)을
// letter name("δέλτα", "ταυ")으로 발화하는 문제 회피. 가장 흔한 elision 형태들을
// 본래 형태로 복원하여 음성에 전달. *_normalizeApostrophes 후에 호출할 것*.
// 출처: Smyth §70-76, LSJ s.v., Buck §85.
const _ELISION_RESTORE = {
  // 소문자
  "δ'":"δέ", "τ'":"τε", "γ'":"γε", "ῥ'":"ῥα",
  "ἀλλ'":"ἀλλά", "οὐδ'":"οὐδέ", "μηδ'":"μηδέ",
  "ἐπ'":"ἐπί", "ἀπ'":"ἀπό", "ὑπ'":"ὑπό", "κατ'":"κατά",
  "παρ'":"παρά", "μετ'":"μετά", "ἀντ'":"ἀντί", "δι'":"διά",
  // rough breathing 동화형 (φ θ — π τ가 rough 앞에서)
  "ἐφ'":"ἐπί", "καθ'":"κατά", "μεθ'":"μετά", "ἀνθ'":"ἀντί",
  "οὐχ":"οὐκ",   // οὐκ before rough → οὐχ. 음운상 동일.
  // 흔한 부사·접속사
  "ἔτ'":"ἔτι", "ποτ'":"ποτε", "τότ'":"τότε", "ὁπότ'":"ὁπότε",
  "πρόσθ'":"πρόσθε", "ἔμπροσθ'":"ἔμπροσθε",
  // 문장 첫 단어 대문자
  "Δ'":"Δέ", "Τ'":"Τε", "Γ'":"Γε",
  "Ἀλλ'":"Ἀλλά", "Οὐδ'":"Οὐδέ", "Μηδ'":"Μηδέ",
  "Ἐπ'":"Ἐπί", "Ἀπ'":"Ἀπό", "Ὑπ'":"Ὑπό", "Κατ'":"Κατά",
  "Παρ'":"Παρά", "Μετ'":"Μετά", "Ἀντ'":"Ἀντί", "Δι'":"Διά",
  "Ἐφ'":"Ἐπί", "Καθ'":"Κατά", "Μεθ'":"Μετά", "Ἀνθ'":"Ἀντί",
};
function _restoreElisions(text){
  if(!text || text.indexOf("'") < 0) return text;
  let out = text;
  // 길이순(긴 것 우선)으로 정렬해야 ἀλλ'를 δ'보다 먼저 매치 — 부분 매치 방지
  const keys = Object.keys(_ELISION_RESTORE).sort((a,b) => b.length - a.length);
  for(const from of keys){
    if(out.indexOf(from) < 0) continue;
    const to = _ELISION_RESTORE[from];
    // 단어 경계 (그리스 문자가 앞/뒤에 없을 때만) — 정규식으로 비-그리스 lookbehind/lookahead
    const escaped = from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const rx = new RegExp('(^|[^\u0370-\u03FF\u1F00-\u1FFF])' + escaped + '(?![\u0370-\u03FF\u1F00-\u1FFF])', 'g');
    out = out.replace(rx, (m, pre) => pre + to);
  }
  return out;
}

// Polytonic → Monotonic 변환 (v37) — 현대 헬라어 음성(el-GR)이 polytonic
// 결합 부호(smooth ̓, rough ̔, circumflex ͂, iota subscript ͅ)를 인식 못 해
// letter-name spell-out("alpha, lambda, ...")으로 발화하는 버그 회피.
// 처리: circumflex·grave → acute(현대 tonos), smooth/rough/iota_subscript 제거.
// 보존: diaeresis(¨ U+0308)는 현대 헬라어도 사용하므로 그대로.
function _polytonicToMonotonic(text){
  if(!text) return text;
  return text.normalize('NFD')
    .replace(/\u0300/g, '\u0301')      // grave → acute
    .replace(/\u0342/g, '\u0301')      // circumflex(̑) → acute
    .replace(/[\u0313\u0314\u0345]/g, '')   // smooth, rough, iota_subscript 제거
    .normalize('NFC');
}

// 그리스어 본문 → Erasmian / Restored 라틴 음역
function greekToLatin(text, system, dialect){
  if(!text) return '';
  const sysCfg = PRON_SYSTEMS[system] || PRON_SYSTEMS.modern;
  if(!sysCfg.transliterate) return text;
  const D = PRON_DIALECTS[dialect] || PRON_DIALECTS.default;
  const isRestored = sysCfg.transliterate === 'restored';
  // 아포스트로피 정규화 — 토큰화 정규식이 ASCII '만 인식하므로
  text = _normalizeApostrophes(text);
  // 단어 단위 처리 (rough breathing은 단어 첫 모음 앞에만 'h' 부여)
  const tokens = text.split(/(\s+|[\.,;··:?!"'·()\[\]\—\-]+)/);
  return tokens.map(tok => {
    if(!tok || /^[\s\.,;··:?!"'·()\[\]\—\-]+$/.test(tok)) return tok;
    return _greekWordToLatin(tok, isRestored, D);
  }).join('');
}

// 모음 디그래프 매핑 (v38) — Allen Vox Graeca / Erasmian 관용
// 디그래프를 글자별로 처리하면 Restored ου = [uː]가 'oi'(υ→i)로 잘못 표기되어
// "οὗ → hoi"처럼 의미 망가지는 발음이 나옴. 디그래프 단위로 매핑하여 해결.
// diaeresis(¨)가 둘째 모음에 있으면 두 모음 분리 의도 — 디그래프 적용 안 함.
function _greekDigraph(c1, c2, isRestored){
  const k = (c1 + c2).toLowerCase();
  if(isRestored){
    // W.S. Allen, Vox Graeca §1.10 — classical Attic (5–4c BCE)
    if(k === 'ου') return 'u';     // [uː]
    if(k === 'ει') return 'ei';    // [eː] in classical; spelled 'ei' for Italian voice
    if(k === 'αι') return 'ai';    // [ai̯]
    if(k === 'οι') return 'oi';    // [oi̯]
    if(k === 'αυ') return 'au';    // [au̯]
    if(k === 'ευ') return 'eu';    // [eu̯]
    if(k === 'ηυ') return 'èu';    // [ɛːu̯] (rare)
    if(k === 'υι') return 'ii';    // [yi̯] approximated (Italian no /y/)
    if(k === 'ωυ') return 'òu';    // Ionic
    return null;
  }
  // Erasmian 관용
  if(k === 'ου') return 'u';
  if(k === 'ει') return 'ei';
  if(k === 'αι') return 'ai';
  if(k === 'οι') return 'oi';
  if(k === 'αυ') return 'au';
  if(k === 'ευ') return 'eu';
  if(k === 'ηυ') return 'eu';
  if(k === 'υι') return 'ui';
  if(k === 'ωυ') return 'ou';
  return null;
}

function _greekWordToLatin(word, isRestored, D){
  const nfd = word.normalize('NFD');
  const ROUGH = '\u0314';
  const DIAER = '\u0308';
  const VOWEL_RX = /[αεηιουωΑΕΗΙΟΥΩ]/;
  // 한 문자 + 결합부호 그룹화
  const groups = [];
  for(const c of nfd){
    if(/\p{M}/u.test(c) && groups.length){
      groups[groups.length-1].marks.add(c);
    } else {
      groups.push({base: c, marks: new Set()});
    }
  }
  // 초성 모음군 전체에서 rough breathing 검사 (υἱός 등: 두 번째 모음에 rough가 있을 수 있음)
  let leadingEnd = -1;
  for(let i = 0; i < groups.length; i++){
    if(VOWEL_RX.test(groups[i].base)){ leadingEnd = i; }
    else break;
  }
  let hasRoughInit = false;
  let initIsUpper = false;
  if(leadingEnd >= 0){
    for(let i = 0; i <= leadingEnd; i++){
      if(groups[i].marks.has(ROUGH)) hasRoughInit = true;
    }
    initIsUpper = /[Α-Ω]/.test(groups[0].base);
  }
  let out = '';
  let firstVowelDone = false;
  let i = 0;
  while(i < groups.length){
    const g = groups[i];
    const nxG = groups[i+1];
    const nx = nxG ? nxG.base : '';
    let latin = null;
    let consumed = 1;
    // 디그래프 매칭 (인접 두 모음, 둘째에 diaeresis 없음)
    if(VOWEL_RX.test(g.base) && nx && VOWEL_RX.test(nx) && !nxG.marks.has(DIAER)){
      const dg = _greekDigraph(g.base, nx, isRestored);
      if(dg !== null){
        latin = dg;
        consumed = 2;
        if(/[Α-Ω]/.test(g.base)){
          latin = latin.charAt(0).toUpperCase() + latin.slice(1);
        }
      }
    }
    if(latin === null){
      latin = _greekCharToLatin(g.base, nx, isRestored);
    }
    if(latin == null){ out += g.base; i += consumed; continue; }
    const isVowel = /^[aeiouyàèìòù]/i.test(latin);
    if(isVowel && !firstVowelDone){
      if(hasRoughInit && !D.psilosis){
        if(initIsUpper){ out += 'H'; latin = latin.toLowerCase(); }
        else out += 'h';
      }
      firstVowelDone = true;
    }
    out += latin;
    i += consumed;
  }
  // 안전망 — 디그래프 매핑이 잡지 못한 'ou'(드물게 형태소 경계 등) 후처리
  out = out.replace(/ou/g, 'u').replace(/OU/g, 'U');
  return out;
}

function _greekCharToLatin(ch, nextCh, isRestored){
  const upper = /[Α-Ω]/.test(ch);
  const lower = ch.toLowerCase();
  let r;
  switch(lower){
    case 'α': r = 'a'; break;
    case 'ε': r = 'e'; break;
    case 'η': r = isRestored ? 'è' : 'e'; break;  // Restored: open long ɛː → it. è=[ɛ]
    case 'ι': r = 'i'; break;
    case 'ο': r = 'o'; break;
    case 'υ': r = isRestored ? 'i' : 'u'; break;  // [y] 없음 → [i] 근사 (Restored)
    case 'ω': r = isRestored ? 'ò' : 'o'; break;  // Restored: open long ɔː → it. ò=[ɔ]
    case 'β': r = 'b'; break;
    case 'γ': {
      // γγ γκ γχ γξ → [ŋ] (Allen §6, Smyth §19)
      const nl = (nextCh || '').toLowerCase();
      r = (nl === 'γ' || nl === 'κ' || nl === 'χ' || nl === 'ξ') ? 'n' : 'g';
      break;
    }
    case 'δ': r = 'd'; break;
    case 'ζ': r = 'z'; break;  // Erasmian: [z]/[dz], Restored: [zd] — 단순화
    case 'θ': r = 't'; break;  // 이탈리아 'th'는 [t], 'h' 무음 → 't'로 약화 (한계)
    case 'κ': r = 'k'; break;
    case 'λ': r = 'l'; break;
    case 'μ': r = 'm'; break;
    case 'ν': r = 'n'; break;
    case 'ξ': r = 'ks'; break;
    case 'π': r = 'p'; break;
    case 'ρ': r = 'r'; break;
    case 'σ': case 'ς': r = 's'; break;
    case 'τ': r = 't'; break;
    case 'φ': r = 'p'; break;  // [pʰ] → 평이한 [p] 약화 (이탈리아 'f'는 fricative라 부적합)
    case 'χ': r = 'k'; break;  // [kʰ] → [k] 약화
    case 'ψ': r = 'ps'; break;
    case 'ϝ': r = 'v'; break;  // digamma [w] — 이탈리아 'v'/'u' 중 'v' 사용
    default:
      if(/[a-zA-Z0-9]/.test(ch)) return ch;
      return null;
  }
  return upper ? r.toUpperCase() : r;
}

// 사용 가능한 음성 캐시: { 'el': voice, 'it': voice, ... }
let _voiceCache = {};
let _availableVoices = [];
function _pickVoiceFor(langPrefix){
  if(_voiceCache[langPrefix] !== undefined) return _voiceCache[langPrefix];
  // 사용자가 명시 선택한 음성이 해당 lang 계열이면 우선
  const preferredName = (S && S.speech && S.speech.voiceName) ? S.speech.voiceName : '';
  if(preferredName){
    const v = _availableVoices.find(v => v.name === preferredName && v.lang.toLowerCase().startsWith(langPrefix));
    if(v){ _voiceCache[langPrefix] = v; return v; }
  }
  const v = _availableVoices.find(v => v.lang.toLowerCase().startsWith(langPrefix)) || null;
  _voiceCache[langPrefix] = v;
  return v;
}

function _initVoice(){
  if(!('speechSynthesis' in window)) return;
  const pick = () => {
    _availableVoices = speechSynthesis.getVoices();
    _voiceCache = {};  // 음성 목록 갱신 시 캐시 무효화
  };
  pick();
  if(_availableVoices.length === 0){
    speechSynthesis.onvoiceschanged = pick;
  }
}

  _initVoice();
  // v39: espeak_grc 사용자의 첫 클릭 latency 제거 — 백그라운드 프리로드
  // S와 _ensureSpeechSettings는 setTimeout 후 IIFE 종료 시점에 모두 정의됨
  setTimeout(() => {
    try {
      if(typeof S !== 'undefined' && typeof _ensureSpeechSettings === 'function'){
        _ensureSpeechSettings();
        if(S.speech && S.speech.system === 'espeak_grc'){
          _ensureEspeak({silent: true}).catch(() => { /* 사용자가 클릭하면 명시적 로드 재시도 */ });
        }
      }
      // v52: 캐릭터 마이그레이션 — 기존 상태에 character 필드 없으면 default 부여
      if(typeof S !== 'undefined' && typeof _ensureCharacter === 'function'){
        _ensureCharacter();
      }
    } catch(_){}
  }, 2000);

// ===== eSpeak NG WASM 엔진 통합 (v36) =====
// PWA 내장 합성 — 기기 무관 동일 음성. 첫 사용 시 ~3MB lazy load.
// 원본: Pettarin's espeakng.js (Eitan Isaacson의 eSpeak NG emscripten port).
// 로봇 음질이나 espeak의 grc 음운 규칙으로 모든 기기에서 동일한 출력 보장.
// 학술 한계: espeak grc 음성은 "initial naive implementation"으로 표시되어
// 정밀한 Vox Graeca 재현은 아님 (일관 기준점 제공이 목적).

let _espeak = null;
let _espeakLoadPromise = null;
let _espeakAudioCtx = null;
let _espeakCurrentPusher = null;
let _espeakReqSeq = 0;   // 요청 시퀀스 — 이전 요청의 async 콜백이 새 요청과 겹치는 race 방지

// PushAudioNode — Eitan Isaacson / Alberto Pettarin demo.js 기반 적응
// ScriptProcessorNode를 통해 청크 단위 오디오 스트리밍 재생
function _EspeakPushAudioNode(ctx, bufferSize){
  this.context = ctx;
  this.buffer_size = bufferSize || 4096;
  this.samples_queue = [];
  this.scriptNode = ctx.createScriptProcessor(this.buffer_size, 1, 1);
  this.connected = false;
  this.sinks = [];
  this.closed = false;
}
_EspeakPushAudioNode.prototype.push = function(chunk){
  if(this.closed) return;
  this.samples_queue.push(chunk);
  if(!this.connected && this.sinks.length) this._connect();
};
_EspeakPushAudioNode.prototype.close = function(){ this.closed = true; };
_EspeakPushAudioNode.prototype.connect = function(dest){
  this.sinks.push(dest);
  if(this.samples_queue.length) this._connect();
};
_EspeakPushAudioNode.prototype._connect = function(){
  if(this.connected) return;
  this.connected = true;
  for(const d of this.sinks) this.scriptNode.connect(d);
  this.scriptNode.onaudioprocess = this._process.bind(this);
};
_EspeakPushAudioNode.prototype.disconnect = function(){
  this.scriptNode.onaudioprocess = null;
  try { this.scriptNode.disconnect(); } catch(_){}
  this.connected = false;
  this.closed = true;
  this.samples_queue.length = 0;
};
_EspeakPushAudioNode.prototype._process = function(evt){
  let offset = 0;
  const outBuf = evt.outputBuffer;
  const bs = evt.target.bufferSize;
  while(this.samples_queue.length && offset < bs){
    let chunk = this.samples_queue[0];
    const toCopy = chunk.subarray(0, bs - offset);
    if(outBuf.copyToChannel) outBuf.copyToChannel(toCopy, 0, offset);
    else outBuf.getChannelData(0).set(toCopy, offset);
    offset += toCopy.length;
    chunk = chunk.subarray(toCopy.length);
    if(chunk.length) this.samples_queue[0] = chunk;
    else this.samples_queue.shift();
  }
  if(!this.samples_queue.length && this.closed){
    this.disconnect();
  }
};

function _ensureEspeak(opts){
  opts = opts || {};
  const showToasts = !opts.silent;
  if(_espeak) return Promise.resolve(_espeak);
  if(_espeakLoadPromise) return _espeakLoadPromise;
  if(showToasts && typeof toast === 'function') toast('eSpeak 엔진 로드 중… (~3MB · 첫 사용 시 1회)');
  _espeakLoadPromise = (async () => {
    // 1. 로더 스크립트 동적 삽입 (window.eSpeakNG 정의)
    //    v41: onerror 시 HTTP status·final URL 을 함께 노출하여 사용자/관리자가
    //    stale-cache(시나리오 A) vs 배포 누락(시나리오 B) 을 즉시 구분할 수 있게 함.
    if(typeof window.eSpeakNG === 'undefined'){
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = './espeakng.min.js';
        s.onload = res;
        s.onerror = async () => {
          let diag = '';
          try {
            const r = await fetch('./espeakng.min.js', { cache: 'no-store' });
            diag = ` (HTTP ${r.status} · ${r.url})`;
          } catch (e) {
            diag = ` (network: ${e && e.message ? e.message : 'unknown'})`;
          }
          rej(new Error('espeakng.min.js 로드 실패' + diag));
        };
        document.head.appendChild(s);
      });
      if(typeof window.eSpeakNG === 'undefined'){
        throw new Error('eSpeakNG 전역 미정의 — 스크립트 손상');
      }
    }
    // 2. Worker 인스턴스 (worker.data는 worker.js와 같은 경로에서 자동 로드)
    const inst = await new Promise((res, rej) => {
      const tm = setTimeout(() => rej(new Error('eSpeak Worker 로드 타임아웃 (60초)')), 60000);
      const t = new window.eSpeakNG('./espeakng.worker.js', () => {
        clearTimeout(tm);
        res(t);
      });
    });
    // 3. 음성을 grc(Ancient Greek)로 설정
    await new Promise(res => inst.set_voice('grc', () => res()));
    _espeak = inst;
    if(showToasts && typeof toast === 'function') toast('✓ eSpeak 엔진 준비 완료');
    return inst;
  })();
  _espeakLoadPromise.catch(err => {
    _espeakLoadPromise = null;
    console.error('[eSpeak load]', err);
    if(showToasts && typeof toast === 'function') toast('eSpeak 로드 실패 — ' + (err.message || '재시도해주세요'), 'warn');
  });
  return _espeakLoadPromise;
}

function _speakViaEspeak(text){
  try {
    const myReq = ++_espeakReqSeq;
    if(!_espeakAudioCtx){
      _espeakAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(_espeakAudioCtx.state === 'suspended'){
      _espeakAudioCtx.resume();
    }
    // 이전 합성 정리
    if(_espeakCurrentPusher){
      try { _espeakCurrentPusher.disconnect(); } catch(_){}
      _espeakCurrentPusher = null;
    }
    _ensureEspeak().then(espeak => {
      if(myReq !== _espeakReqSeq) return;   // 이후 새 요청·정지가 있었으면 폐기
      const settings = (S && S.speech) ? S.speech : {};
      // 속도·음높이 매핑: 사용자 rate(0.5-1.5x) → espeak rate(80-450), 기본 175가 1.0배
      const rate  = Math.round((settings.rate  || 0.85) * 175);
      const pitch = Math.round((settings.pitch || 1.0) * 50);
      espeak.set_rate(Math.max(80, Math.min(450, rate)));
      espeak.set_pitch(Math.max(0, Math.min(99, pitch)));
      const pusher = new _EspeakPushAudioNode(_espeakAudioCtx);
      pusher.connect(_espeakAudioCtx.destination);
      _espeakCurrentPusher = pusher;
      espeak.synthesize(text, (samples /*, events*/) => {
        if(myReq !== _espeakReqSeq){
          // 도중에 새 요청 — 청크 무시
          if(_espeakCurrentPusher === pusher){
            try { pusher.disconnect(); } catch(_){}
            _espeakCurrentPusher = null;
          }
          return;
        }
        if(!samples){
          if(_espeakCurrentPusher === pusher) pusher.close();
          return;
        }
        if(_espeakCurrentPusher === pusher){
          pusher.push(new Float32Array(samples));
        }
      });
    });
    return true;
  } catch(e){
    console.error('[espeak speak]', e);
    if(typeof toast === 'function') toast('eSpeak 발화 오류: ' + e.message, 'warn');
    return false;
  }
}

// 폴백 안내는 세션당 1회만 (사용자가 시스템·음성을 바꿀 때 재설정됨)
let _speechFallbackNoticed = false;

function speakGreek(text, overrideDialect){
  if(!text) return false;
  const settings = (S && S.speech) ? S.speech : {};
  const system   = settings.system || 'modern';
  const sysCfg   = PRON_SYSTEMS[system] || PRON_SYSTEMS.modern;
  const clean    = text.replace(/^\d+\s+/gm, '').replace(/\[\d+[a-z]?\]/g, '');

  // eSpeak NG 경로 — Web Speech API 우회
  if(sysCfg.engine === 'espeak'){
    return _speakViaEspeak(clean);
  }

  // 이하 Web Speech API 경로
  if(!('speechSynthesis' in window)) return false;
  const dialect = overrideDialect || settings.dialect || 'default';
  // ── 음성·텍스트 정합성 ──
  // Web Speech API 음성이 처리 못하는 글자는 letter-name spell-out으로 발화된다
  // (예: 한국 iPad의 기본 음성이 그리스 글자를 받으면 "alpha, beta..." 발화).
  // 따라서 (a) 사용 가능 음성을 먼저 선택하고, (b) 그 음성에 안전한 텍스트
  // 표현을 결정한다. 어떤 적합 음성도 없으면 발화를 보류하고 사용자에게 안내한다.
  let voice = _pickVoiceFor(sysCfg.voiceLang);
  if(!voice && sysCfg.voiceLang === 'it'){
    voice = _pickVoiceFor('es') || _pickVoiceFor('en');
  }
  let utterText, fallbackNote = null;
  // el 음성 안전 변환 — 아포스트로피 정규화 → elision 복원 → polytonic→monotonic
  const _prepGreekForEl = (s) => _polytonicToMonotonic(_restoreElisions(_normalizeApostrophes(s)));
  if(voice){
    utterText = sysCfg.transliterate
      ? greekToLatin(clean, system, dialect)
      : _prepGreekForEl(clean);
  } else if(sysCfg.transliterate){
    voice = _pickVoiceFor('el');
    if(voice){
      utterText = _prepGreekForEl(clean);
      fallbackNote = '이탈리아어 음성이 없어 현대 그리스어 발음으로 폴백되었습니다. 설정 → 손쉬운 사용에서 이탈리아어 음성 추가 시 Erasmian/Restored 발화 가능. (또는 eSpeak NG 시스템 사용 — 기기 무관 일관 음성)';
    }
  } else {
    voice = _pickVoiceFor('it') || _pickVoiceFor('es') || _pickVoiceFor('en');
    if(voice){
      utterText = greekToLatin(clean, 'erasmian', dialect);
      fallbackNote = '그리스어 음성이 없어 Erasmian 음역(이탈리아어 음성)으로 폴백되었습니다. 설정 → 손쉬운 사용 → 음성에서 그리스어(Ελληνικά) 추가하면 현대 발음 사용 가능. (또는 eSpeak NG 시스템 사용 — 기기 무관 일관 음성)';
    }
  }
  if(!voice){
    if(typeof toast === 'function') toast('재생 가능한 음성이 없습니다. eSpeak NG 시스템(기기 무관)을 선택하거나 설정 → 손쉬운 사용에서 음성을 추가하세요.', 'warn');
    return false;
  }
  if(fallbackNote && !_speechFallbackNoticed){
    _speechFallbackNoticed = true;
    if(typeof toast === 'function') toast(fallbackNote);
  }
  const u = new SpeechSynthesisUtterance(utterText);
  u.voice = voice;
  u.lang  = voice.lang;
  u.rate  = typeof settings.rate  === 'number' ? settings.rate  : 0.85;
  u.pitch = typeof settings.pitch === 'number' ? settings.pitch : 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  return true;
}

// 특정 방언의 음운 규칙으로 임시 발화 (사용자 설정 보존)
function speakGreekDialect(text, dialect){

function stopSpeech(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  _espeakReqSeq++;   // 진행 중인 espeak 요청 무효화 (async then은 자동 폐기)
  if(_espeakCurrentPusher){
    try { _espeakCurrentPusher.disconnect(); } catch(_){}
    _espeakCurrentPusher = null;
  }
}

window.speakGreekDialect = speakGreekDialect;

const _SPEECH_DEMO_TEXT = 'Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν.';

// ===== 멀티 실시간 배틀 (Ἀγών) — Phase 1 인프라 (v29) =====
// 디자인: Firebase RTDB polling (~2s) — Phase 4에서 SSE로 업그레이드 예정
// 데이터: battles/{roomCode}/{meta,players,questions}
// 상태:   lobby → playing → finished
//
// v31: SSE (Server-Sent Events) 업그레이드 — Firebase REST의 ?accept=text/event-stream
// 엔드포인트로 push 받음. 실패 시 polling으로 자동 fallback.

const BATTLE_POLL_MS = 2000;        // polling 간격 (SSE 실패 시 fallback)
const BATTLE_CODE_LEN = 6;          // 방 코드 길이
const BATTLE_SSE_TIMEOUT_MS = 8000; // SSE 연결 8초 무응답 시 fallback
let _battleState = null;            // {roomCode, role, pollTimer, sseSrc, sseMode, onUpdate}

function _battleGenCode(){
  // 혼동되는 문자 제외 (0/O, 1/I/L) — 학습자가 입력 쉽게
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i = 0; i < BATTLE_CODE_LEN; i++){
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

function _battleStopPoll(){
  if(!_battleState) return;
  if(_battleState.pollTimer){
    clearInterval(_battleState.pollTimer);
    _battleState.pollTimer = null;
  }
  if(_battleState.sseSrc){
    try { _battleState.sseSrc.close(); } catch(e){}
    _battleState.sseSrc = null;
  }
  if(_battleState.sseTimeoutId){
    clearTimeout(_battleState.sseTimeoutId);
    _battleState.sseTimeoutId = null;
  }
  _battleState.sseMode = null;
}

function _battleCleanup(){
  _battleStopPoll();
  _battleState = null;
}

async function _battleFetchRoom(code){
  if(!STORAGE.supportsShared) return null;
  try {
    const r = await STORAGE.getShared(`battles:${code}`);
    if(!r || !r.value) return null;
    return JSON.parse(r.value);
  } catch(e){
    return null;
  }
}

// SSE 구독: Firebase RTDB의 EventSource 엔드포인트로 실시간 push 받음
// 성공 시 onUpdate(room)을 변경마다 호출. 실패 시 false 반환 → polling으로 폴백.
function _battleSubscribeSSE(code, onUpdate){
  if(!_battleState) return false;
  if(typeof EventSource === 'undefined') return false;
  if(!FIREBASE_URL) return false;

  const base = FIREBASE_URL.replace(/\/$/, '');
  const url = `${base}/battles/${code}.json?accept=text/event-stream`;
  let es;
  try {
    es = new EventSource(url);
  } catch(e){
    return false;
  }

  let opened = false;
  let cached = null;          // 마지막으로 전달한 room (멱등성)

  // 연결 타임아웃: 8초 내 open 없으면 fallback
  const timeoutId = setTimeout(() => {
    if(!opened){
      try { es.close(); } catch(e){}
      if(_battleState && _battleState.sseSrc === es){
        _battleState.sseSrc = null;
        _battleStartPolling(code, onUpdate);
      }
    }
  }, BATTLE_SSE_TIMEOUT_MS);

  es.onopen = () => {
    opened = true;
  };

  // Firebase는 'put' (전체 교체)과 'patch' (부분 갱신) 이벤트를 보냄
  // 우리 구조는 항상 PUT으로 전체 저장하므로 put이 주력
  const handle = (data) => {
    try {
      const parsed = JSON.parse(data);
      if(!parsed) return;
      const { path, data: payload } = parsed;
      if(path === '/' || path === ''){
        // 전체 객체 교체 (또는 초기 fetch)
        if(payload === null){
          onUpdate(null);   // 방 삭제됨
          cached = null;
        } else {
          cached = payload;
          onUpdate(payload);
        }
      } else if(cached){
        // 부분 갱신: cached에 path 따라 패치
        const keys = path.replace(/^\//, '').split('/');
        let cursor = cached;
        for(let i = 0; i < keys.length - 1; i++){
          if(cursor[keys[i]] === undefined) cursor[keys[i]] = {};
          cursor = cursor[keys[i]];
        }
        if(payload === null){
          delete cursor[keys[keys.length - 1]];
        } else {
          cursor[keys[keys.length - 1]] = payload;
        }
        onUpdate(cached);
      } else {
        // cached 없는데 부분 갱신만 옴 — fetch로 보강
        _battleFetchRoom(code).then(r => {
          cached = r;
          onUpdate(r);
        });
      }
    } catch(e){
      // 파싱 실패 시 무시 — 다음 이벤트가 정상이면 진행
    }
  };

  es.addEventListener('put',   (e) => handle(e.data));
  es.addEventListener('patch', (e) => handle(e.data));
  // keep-alive 이벤트는 무시. cancel/auth_revoked는 연결 종료 신호.
  es.addEventListener('cancel', () => {
    try { es.close(); } catch(e){}
    if(_battleState && _battleState.sseSrc === es){
      _battleState.sseSrc = null;
      _battleStartPolling(code, onUpdate);
    }
  });
  es.addEventListener('auth_revoked', () => {
    try { es.close(); } catch(e){}
  });

  es.onerror = () => {
    // 연결 끊김 — 자동 재시도는 브라우저가 함. 그러나 우리는 폴링으로 폴백.
    // 단, 일시적 끊김(브라우저 자동 재연결)에는 너무 빠르게 폴백하지 않음
    // → onopen 후에 에러가 반복되면 그때 폴백
    if(opened && _battleState && _battleState.sseSrc === es){
      // 한 번 더 기회를 주고 (브라우저 재연결), 5초 후에도 안 오면 폴백
      setTimeout(() => {
        if(es.readyState === 2 /* CLOSED */ &&
           _battleState && _battleState.sseSrc === es){
          _battleState.sseSrc = null;
          _battleStartPolling(code, onUpdate);
        }
      }, 5000);
    }
  };

  _battleState.sseSrc = es;
  _battleState.sseMode = 'sse';
  _battleState.sseTimeoutId = timeoutId;
  return true;
}

// polling 시작 — SSE 실패 시 자동 호출되거나, SSE 시도 후 fallback으로
function _battleStartPolling(code, onUpdate){
  if(!_battleState) return;
  _battleState.sseMode = 'poll';
  if(_battleState.pollTimer) clearInterval(_battleState.pollTimer);
  // 즉시 한 번 fetch
  _battleFetchRoom(code).then(onUpdate);
  _battleState.pollTimer = setInterval(async () => {
    const r = await _battleFetchRoom(code);
    onUpdate(r);
  }, BATTLE_POLL_MS);
}

// 통합 구독자: SSE 시도 → 실패 시 polling 자동 폴백
// 기존 setInterval 호출부를 이걸로 대체
function _battleSubscribe(code, onUpdate){
  if(!_battleState) return;
  _battleState.onUpdate = onUpdate;
  // 즉시 한 번 fetch (SSE open 전 빈 화면 방지)
  _battleFetchRoom(code).then(r => { if(r !== null) onUpdate(r); });
  // SSE 시도
  const sseOk = _battleSubscribeSSE(code, onUpdate);
  if(!sseOk){
    _battleStartPolling(code, onUpdate);
  }
}

async function _battleSaveRoom(code, room){
  if(!STORAGE.supportsShared) return false;
  try {
    await STORAGE.setShared(`battles:${code}`, JSON.stringify(room));
    return true;
  } catch(e){
    return false;
  }
}

// ===== Phase 2 (v30) — 실제 게임플레이: 시드 기반 동기 문제 + 실시간 점수 =====
const BATTLE_N_Q             = 10;     // 문제 수
const BATTLE_Q_TIMER_SEC     = 12;     // 문제당 12초
const BATTLE_GAME_TTL_MS     = 5*60*1000;  // 매치 5분 한도
let _battleQTimer = null;
let _battleGameLocal = null;
// { code, idx, score, answeredThisQ, startedAt, questions }

// LCG seeded random — 호스트 시드로 모두 동일 문제 생성
function _battleSeededRng(seed){
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
}
function _battleBuildQuestions(seed){
  const rng = _battleSeededRng(seed);
  const pool = (typeof ALL_VOCAB !== 'undefined') ? ALL_VOCAB.filter(w => w.g && w.ko) : [];
  if(pool.length < BATTLE_N_Q + 3) return [];
  const used = new Set();
  const qs = [];
  let safety = 0;
  while(qs.length < BATTLE_N_Q && safety < 300){
    safety++;
    const idx = Math.floor(rng() * pool.length);
    if(used.has(idx)) continue;
    used.add(idx);
    const w = pool[idx];
    const distractors = [];
    const distUsed = new Set([idx]);
    while(distractors.length < 3){
      const di = Math.floor(rng() * pool.length);
      if(distUsed.has(di)) continue;
      distUsed.add(di);
      distractors.push(pool[di].ko);
    }
    const correctIdx = Math.floor(rng() * 4);
    const options = [...distractors];
    options.splice(correctIdx, 0, w.ko);
    qs.push({ g: w.g, ko: w.ko, options, correctIdx });
  }
  return qs;
}

function _battleStopQTimer(){
  if(_battleQTimer){ clearInterval(_battleQTimer); _battleQTimer = null; }
}

// 게임 진행 — renderBattleLobby가 status==='playing'일 때 호출
async function renderBattleGame(code, room){
  // 첫 진입 시 로컬 상태 초기화
  if(!_battleGameLocal || _battleGameLocal.code !== code){
    const seed = (room && room.meta && room.meta.seed) || 0;
    const questions = _battleBuildQuestions(seed);
    if(questions.length < BATTLE_N_Q){
      view.innerHTML = `
        <button class="btn btn-sm btn-o" onclick="_battleLeave()">← 나가기</button>
        <div class="card warm" style="margin-top:14px"><b>문제 풀 부족</b>
          <div style="font-size:13px;margin-top:6px">어휘 데이터가 부족하여 매치를 시작할 수 없습니다.</div></div>`;
      return;
    }
    _battleGameLocal = {
      code, idx: 0, score: 0, correctCount: 0, answeredThisQ: false,
      startedAt: Date.now(), qStartedAt: 0,
      questions, answered: [], finished: false,
    };
  }
  const local = _battleGameLocal;

  // 5분 초과 → 강제 종료
  if(Date.now() - local.startedAt > BATTLE_GAME_TTL_MS && !local.finished){
    local.finished = true;
    await _battleSubmitProgress(code, local, true);
  }

  // 매치 자체가 finished 상태로 전환됐으면 결과
  if(room && room.meta && room.meta.status === 'finished'){
    return renderBattleResult(code, room);
  }

  // 자기 다 풀었으면 대기 화면
  if(local.idx >= BATTLE_N_Q || local.finished){
    return _renderBattleWaitOthers(code, room, local);
  }

  const q = local.questions[local.idx];
  const players = Object.entries(room.players || {});
  view.innerHTML = `

function _battleStartQTimer(){
  _battleStopQTimer();
  const startedAt = Date.now();
  _battleQTimer = setInterval(() => {
    if(!_battleGameLocal) return _battleStopQTimer();
    const remain = Math.max(0, BATTLE_Q_TIMER_SEC - Math.floor((Date.now() - startedAt) / 1000));
    const el = document.getElementById('bat-qtimer');
    if(el){
      el.textContent = remain + '초';
      if(remain <= 3) el.style.color = 'var(--bad)';
    }
    if(remain <= 0){
      _battleStopQTimer();
      if(!_battleGameLocal.answeredThisQ) _battleAnswer(-1);
    }
  }, 250);
}

async function _battleAnswer(chosenIdx){
  const local = _battleGameLocal;
  if(!local || local.answeredThisQ) return;
  local.answeredThisQ = true;
  _battleStopQTimer();
  const q = local.questions[local.idx];
  const correct = chosenIdx === q.correctIdx;
  // v32: 속도 점수 — 정답 시 기본 10 + 남은 시간(초) 보너스 (최대 22).
  // 오답·시간초과는 0. 총점은 최대 220 (BATTLE_N_Q=10 기준).
  const elapsedMs = Date.now() - (local.qStartedAt || Date.now());
  const remainSec = Math.max(0, BATTLE_Q_TIMER_SEC - elapsedMs / 1000);
  let points = 0;
  if(correct){
    local.correctCount = (local.correctCount || 0) + 1;
    points = 10 + Math.ceil(remainSec);
    local.score += points;
  }
  // v32: 답변 기록 — 결과 화면 리뷰·오답함 자동 추가에 사용
  local.answered = local.answered || [];
  local.answered.push({
    q: q.g,
    correctAnswer: q.options[q.correctIdx],
    chosen: chosenIdx >= 0 ? q.options[chosenIdx] : null,
    correct, points,
    elapsedMs: Math.round(elapsedMs),
  });
  // 시각 피드백
  view.querySelectorAll('[data-i]').forEach(b => {
    b.disabled = true;
    const i = parseInt(b.dataset.i, 10);
    if(i === q.correctIdx){
      b.style.background = 'var(--terracotta)';
      b.style.color = '#fff';
      b.style.borderColor = 'var(--terracotta-d)';
    } else if(i === chosenIdx){
      b.style.opacity = '0.45';
    }
  });
  // 점수 표시 (정답 시 +N 잠깐 강조)
  if(correct){
    const timerEl = document.getElementById('bat-qtimer');
    if(timerEl){
      timerEl.textContent = '+' + points;
      timerEl.style.color = 'var(--terracotta-d)';
    }
  }
  local.idx++;
  // 자기 진척 push (다음 polling에 다른 사람도 봄)
  await _battleSubmitProgress(local.code, local, local.idx >= BATTLE_N_Q);
  setTimeout(() => {
    // 다음 폴링 tick에 자동 갱신되지만 즉시 다음 문제로
    if(_battleGameLocal && _battleGameLocal.idx < BATTLE_N_Q){
      // 매치 상태 재조회 후 다음 문제
      _battleFetchRoom(_battleGameLocal.code).then(room => {
        if(room) renderBattleGame(_battleGameLocal.code, room);
      });
    }
  }, 800);
}

async function _battleSubmitProgress(code, local, finished){
  if(!S.userId) return;
  // 자기 player 객체만 PUT (path-level) — race condition 회피
  const payload = {
    name: S.displayName || '익명',
    joinedAt: Date.now(),
    score: local.score,
    correctCount: local.correctCount || 0,   // v32: 점수와 별도로 정답 수 동기화
    currentQ: local.idx,
    ready: true,
    finished: !!finished,
  };
  try {
    await STORAGE.setShared(`battles:${code}:players:${S.userId}`, JSON.stringify(payload));
  } catch(_){}
  // 모든 플레이어 finished인지 확인 → status를 'finished'로
  if(finished){
    try {
      const fresh = await _battleFetchRoom(code);
      if(fresh && fresh.players){
        const allDone = Object.values(fresh.players).every(p => p.finished);
        if(allDone && fresh.meta.status !== 'finished'){
          fresh.meta.status = 'finished';
          fresh.meta.finishedAt = Date.now();
          await _battleSaveRoom(code, fresh);
        }
      }
    } catch(_){}
  }
}

// ===== 명예의 전당 통계 시각화 (v30) =====
// era별 작품 완독 진척 + 최근 배틀 히스토리

function _renderEraStats(){
  if(typeof WORKS === 'undefined') return '<div style="color:var(--clay-d);font-size:12px">데이터 없음</div>';
  // era 정규화: "코이네(1)" → "코이네"
  const eraStats = {};
  const eraOrder = ['상고기', '고전기', '코이네', '후기'];
  WORKS.forEach(w => {
    let era = (w.era || '?').replace(/\([^)]*\)/g, '').trim() || '?';
    if(!eraStats[era]) eraStats[era] = { done: 0, total: 0, sectionsDone: 0, sectionsTotal: 0 };
    eraStats[era].total++;
    if((S.worksFinished || []).includes(w.id)) eraStats[era].done++;
    eraStats[era].sectionsTotal += w.sections ? w.sections.length : 0;
    eraStats[era].sectionsDone += ((S.sectionsDone || {})[w.id] || []).length;
  });
  // 표시 순서: 시대 순 + 모르는 era는 뒤
  const eras = Object.keys(eraStats).sort((a, b) => {
    const ai = eraOrder.indexOf(a);
    const bi = eraOrder.indexOf(b);
    if(ai < 0 && bi < 0) return a.localeCompare(b);
    if(ai < 0) return 1;
    if(bi < 0) return -1;
    return ai - bi;
  });
  return eras.map(era => {
    const s = eraStats[era];
    const pct = s.total > 0 ? Math.round(100 * s.done / s.total) : 0;
    const secPct = s.sectionsTotal > 0 ? Math.round(100 * s.sectionsDone / s.sectionsTotal) : 0;
    return `<div style="margin:8px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
        <span style="font-family:var(--font-display);font-weight:600;color:var(--terracotta-d)">${era}</span>
        <span style="font-size:11px;color:var(--clay-d)">완독 ${s.done}/${s.total} · 섹션 ${s.sectionsDone}/${s.sectionsTotal}</span>
      </div>
      <div style="height:8px;background:var(--ivory-d);border-radius:3px;overflow:hidden;position:relative">
        <div style="height:100%;width:${secPct}%;background:linear-gradient(90deg,var(--clay) 0%,var(--terracotta) 100%);transition:width .6s;border-radius:3px"></div>
        ${pct > 0 ? `<div style="position:absolute;top:0;left:0;height:100%;width:${pct}%;background:var(--terracotta-d);transition:width .6s;border-radius:3px;opacity:.85" title="완독 ${pct}%"></div>` : ''}
      </div>
      <div style="font-size:10px;color:var(--clay-d);margin-top:3px;font-style:italic">진한 막대 = 완독 · 흐린 막대 = 섹션 진행</div>
    </div>`;
  }).join('');
}

  return recent.map(b => {

    const accuracy = b.totalQ > 0 ? Math.round(100 * b.correctCount / b.totalQ) : 0;
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--clay);font-size:12px">
      <div style="font-family:var(--font-display);font-size:18px;color:var(--terracotta-d);min-width:32px;text-align:center">${medal}</div>
      <div style="flex:1;min-width:0">
        <div style="color:var(--black-glaze)"><b>${b.rank}위</b> / ${b.totalPlayers}명 · 정답 ${b.correctCount}/${b.totalQ} (${accuracy}%)</div>
        <div style="font-size:10.5px;color:var(--clay-d);margin-top:2px">${dateStr} · 점수 ${b.score.toFixed(1)}</div>
      </div>
    </div>`;
  }).join('');
}

// 배틀 히스토리에 결과 누적 (최대 20개)
// 인자: {score, correctCount, totalQ, rank, totalPlayers}
function _recordBattleResult(result){
  if(!result || typeof result !== 'object') return;
  if(!S.battleHistory) S.battleHistory = [];
  S.battleHistory.push({
    date: Date.now(),
    score: result.score || 0,
    rank: result.rank || 0,
    totalPlayers: result.totalPlayers || 0,
    correctCount: result.correctCount || 0,
    totalQ: result.totalQ || 0,
  });
  // 최대 20개 유지 (오래된 것부터 제거)
  if(S.battleHistory.length > 20){
    S.battleHistory = S.battleHistory.slice(-20);
  }
  saveState();
}

// ===== 즐겨찾기·북마크 (v25 다태그 + 메모 + 검색 + 필터) =====
const BOOKMARK_TAGS = ['중요', '어려움', '다시 읽기', '문법 예시', '어휘 발굴', '시구 인용', '번역 연습'];

function _ensureBookmarks(){ if(!S.bookmarks) S.bookmarks = {}; }

// 기존 단일 tag(문자열) → 다태그 tags(배열) 자동 마이그레이션
function _migrateBookmark(b){
  if(b && !b.tags){
    b.tags = b.tag ? [b.tag] : ['중요'];
    if(b.note === undefined) b.note = '';
  }
  return b;
}

function bookmarkKey(workId, secN){ return `${workId}::${secN}`; }

function toggleBookmark(workId, secN, tags, note){
  _ensureBookmarks();
  const k = bookmarkKey(workId, secN);
  if(S.bookmarks[k]){
    delete S.bookmarks[k]; saveState(); return false;
  } else {
    let tagsArr;
    if(Array.isArray(tags)) tagsArr = tags.length ? tags : ['중요'];
    else if(typeof tags === 'string' && tags) tagsArr = [tags];
    else tagsArr = ['중요'];
    S.bookmarks[k] = {
      workId, secN,
      tags: tagsArr,
      tag: tagsArr[0],   // 호환성 위해 첫 태그를 단일 tag 필드에도 보존
      note: note || '',
      ts: Date.now()
    };
    saveState(); return true;
  }
}
function isBookmarked(workId, secN){
  _ensureBookmarks();
  return !!S.bookmarks[bookmarkKey(workId, secN)];
}

// 악센트 제거 (검색용)
function _strip(s){
  if(!s) return '';
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

let _bookmarkFilter = { q: '', tag: 'all', sort: 'recent' };

  const usedTags = Object.keys(tagCounts).sort((a,b) => tagCounts[b] - tagCounts[a]);

  // 필터링
  const q = _strip(_bookmarkFilter.q);
  const fTag = _bookmarkFilter.tag;
  let items = all.filter(b => {
    if(fTag !== 'all'){
      const tags = b.tags || (b.tag ? [b.tag] : []);
      if(!tags.includes(fTag)) return false;

    if(q){
      const w = WORKS.find(x => x.id === b.workId);

        w.author, w.authorKo, w.work, w.workKo, sec.label,
        sec.text || '', b.note || '',
        (b.tags || []).join(' ')
      ].join(' ');
      if(!_strip(haystack).includes(q)) return false;
    }
    return true;

  // 정렬

// ===== SRS — 간격 반복 학습 (SM-2) =====
function _ensureSRS(){ if(!S.srs) S.srs = {}; }
function _srsKey(word){ return word.g; }
function _srsToday(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}
function srsDueCards(){
  _ensureSRS();
  if(typeof DEFAULT_W === 'undefined') return [];
  const today = _srsToday();
  const due = [];
  for(const w of DEFAULT_W){
    const k = _srsKey(w);
    const st = S.srs[k];
    if(!st){ due.push({word: w, isNew: true, st: null}); }
    else if(st.due <= today){ due.push({word: w, isNew: false, st}); }
  }
  return due;
}
function srsGrade(word, quality){
  _ensureSRS();
  const k = _srsKey(word);
  let st = S.srs[k] || {ef: 2.5, interval: 0, reps: 0, lapses: 0, due: _srsToday()};
  if(quality < 3){
    st.lapses = (st.lapses || 0) + 1;
    st.reps = 0; st.interval = 1;
  } else {
    st.reps = (st.reps || 0) + 1;
    if(st.reps === 1) st.interval = 1;
    else if(st.reps === 2) st.interval = 6;
    else st.interval = Math.round(st.interval * st.ef);
    st.ef = Math.max(1.3, st.ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  }
  st.due = _srsToday() + st.interval * 24 * 60 * 60 * 1000;
  st.lastReview = Date.now();
  S.srs[k] = st;
  saveState();
}
let _srsQueue = null, _srsIdx = 0, _srsCorrect = 0;
function renderSRS(){
  _ensureSRS();
  const due = srsDueCards();
  const stats = {
    total: typeof DEFAULT_W !== 'undefined' ? DEFAULT_W.length : 0,
    learned: Object.keys(S.srs).length,
    dueToday: due.length,
    new: due.filter(d => d.isNew).length,
  };
  view.innerHTML = `

    <h2 class="view-title fade-in" style="margin-top:10px"><span class="grk">Ἐπανάληψις</span>SRS · 간격 반복</h2>
    <div class="view-sub">SM-2 알고리즘 · 오늘 복습 ${stats.dueToday}개</div>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
        <div><div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${stats.total}</div><div style="font-size:10px;color:var(--clay-d)">전체 단어</div></div>
        <div><div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${stats.learned}</div><div style="font-size:10px;color:var(--clay-d)">학습 중</div></div>
        <div><div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${stats.dueToday}</div><div style="font-size:10px;color:var(--clay-d)">오늘 due</div></div>
      </div>

        SM-2: 어려운 단어는 자주, 쉬운 단어는 드물게 보여줍니다. 다시·어려움·보통·쉬움 4단계로 평가하면 다음 복습일이 자동 계산됩니다.

// ===== SRS 통계 시각화 (인라인 SVG, 외부 의존성 없음) =====
// 막대 그래프 헬퍼 — 좌측 라벨 + 우측 막대 + 값 표시
function _svgBars(data, opts){
  opts = opts || {};
  const h = opts.height || 24;             // 막대 한 줄 높이
  const labelW = opts.labelW || 70;         // 좌측 라벨 너비
  const valueW = opts.valueW || 36;         // 우측 값 표시 너비
  const gap = 4;
  const max = opts.max || Math.max(1, ...data.map(d => d.value));
  const totalH = data.length * (h + gap);
  const color = opts.color || 'var(--terracotta)';
  const labelColor = opts.labelColor || 'var(--clay-d)';
  return `<svg viewBox="0 0 320 ${totalH}" width="100%" style="display:block">
    ${data.map((d, i) => {
      const y = i * (h + gap);
      const barMaxW = 320 - labelW - valueW - 8;
      const bw = max === 0 ? 0 : Math.max(2, (d.value / max) * barMaxW);
      const hl = d.highlight ? ';font-weight:700;fill:var(--terracotta-d)' : '';
      return `
        <text x="${labelW - 4}" y="${y + h/2 + 4}" font-size="11" text-anchor="end" style="fill:${labelColor}${hl}">${d.label}</text>
        <rect x="${labelW}" y="${y + 4}" width="${barMaxW}" height="${h - 8}" fill="var(--ivory-d)" rx="2"/>
        ${d.value > 0 ? `<rect x="${labelW}" y="${y + 4}" width="${bw}" height="${h - 8}" fill="${d.color || color}" rx="2"/>` : ''}
        <text x="${labelW + barMaxW + 4}" y="${y + h/2 + 4}" font-size="11" style="fill:var(--black-glaze);font-weight:600">${d.value || 0}</text>
      `;
    }).join('')}
  </svg>`;
}

function renderSRSStats(){
  _ensureSRS();
  const cards = Object.values(S.srs || {});
  const today = _srsToday();
  const DAY = 24 * 60 * 60 * 1000;

  // 1) 향후 14일 Due 분포
  const dueBuckets = {};
  for(let i = 0; i < 14; i++) dueBuckets[i] = 0;
  let overdue = 0;
  for(const c of cards){
    if(typeof c.due !== 'number') continue;
    const days = Math.floor((c.due - today) / DAY);
    if(days < 0) overdue++;
    else if(days < 14) dueBuckets[days]++;
  }
  const todayLabel = new Date(today);
  const dueData = [];
  if(overdue > 0) dueData.push({label:'⚠ 연체', value: overdue, color:'var(--terracotta-d)', highlight: true});
  for(let i = 0; i < 14; i++){
    const d = new Date(today + i * DAY);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    const lbl = i === 0 ? `오늘 (${mm}/${dd})` : `${mm}/${dd} ${dow}`;
    dueData.push({label: lbl, value: dueBuckets[i], highlight: i === 0});
  }

  // 2) 지난 7일 학습량 (lastReview 기준)
  const reviewBuckets = {};
  for(let i = 6; i >= 0; i--) reviewBuckets[i] = 0;   // i = 며칠 전
  for(const c of cards){
    if(!c.lastReview) continue;
    const daysAgo = Math.floor((today - _srsDayStart(c.lastReview)) / DAY);
    if(daysAgo >= 0 && daysAgo < 7) reviewBuckets[daysAgo]++;
  }
  const reviewData = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(today - i * DAY);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    const lbl = i === 0 ? `오늘` : (i === 1 ? `어제` : `${mm}/${dd} ${dow}`);
    reviewData.push({label: lbl, value: reviewBuckets[i]});
  }

  // 3) EF (난이도) 분포 — 1.3-1.7 / 1.7-2.0 / 2.0-2.3 / 2.3-2.5 / 2.5+
  const efBuckets = {hard:0, med1:0, med2:0, easy1:0, easy2:0};
  for(const c of cards){
    const ef = c.ef || 2.5;
    if(ef < 1.7) efBuckets.hard++;
    else if(ef < 2.0) efBuckets.med1++;
    else if(ef < 2.3) efBuckets.med2++;
    else if(ef < 2.5) efBuckets.easy1++;
    else efBuckets.easy2++;

    {label:'1.7–2.0 어려움',      value: efBuckets.med1,  color:'#9C3F2D'},

    {label:'2.3–2.5 쉬움',        value: efBuckets.easy1, color:'#b59070'},
    {label:'2.5+ 매우 쉬움',      value: efBuckets.easy2, color:'#8a7a6a'},

    else if(r === 1) repsBuckets.r1++;

    {label:'3회',          value: repsBuckets.r3},
    {label:'4회+ 숙달',    value: repsBuckets.r4plus, color:'#5a9c5a'},

  // 누적 통계

  const totalLapses = cards.reduce((s, c) => s + (c.lapses || 0), 0);

    <div class="card">

          <div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${mastered}</div>
          <div style="font-size:10px;color:var(--clay-d)">숙달 (4회+)</div>
        </div>
        <div>
          <div style="font-family:var(--font-display);font-size:22px;color:var(--terracotta-d);font-weight:600">${overdue}</div>
          <div style="font-size:10px;color:var(--clay-d)">연체</div>

    <div class="card">
      ${dueData.length > 0 ? _svgBars(dueData, {height: 22}) : '<div style="font-size:12px;color:var(--clay-d);text-align:center;padding:14px">예정된 복습이 없습니다.</div>'}
      <div style="font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic;line-height:1.5">

      ${_svgBars(reviewData, {height: 22, color:'#9C3F2D'})}
      <div style="font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic;line-height:1.5">
        각 날짜에 복습한 카드 수 (마지막 평가 기준). 매일 일정량씩 꾸준히 보는 것이 SRS의 정수입니다.
      </div>

    <h3 style="font-family:var(--font-display);font-size:14px;color:var(--terracotta-d);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em">난이도 (EF) 분포</h3>
