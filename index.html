<!-- ===== 진단: 전역 오류 캐치 (가장 일찍 등록) ===== -->
<script>
window.__paideiaErrors = [];
function __paideiaShowError(label, detail){
  window.__paideiaErrors.push({label, detail, t: Date.now()});
  // splash가 아직 안 그려졌으면 다음 틱에 재시도
  const sp = document.getElementById('splash-stage');
  if(!sp){ setTimeout(() => __paideiaShowError(label, detail), 50); return; }
  sp.style.color = '#c44536';
  sp.style.fontWeight = '600';
  sp.style.textAlign = 'left';
  sp.style.maxWidth = '92vw';
  sp.style.margin = '0 auto';
  sp.innerHTML = '<div style="font-size:13px;margin-bottom:6px">❌ ' + label + '</div>' +
                 '<div style="font-size:11px;font-weight:400;color:#5c4e3e;font-family:Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;background:#fbf0ee;padding:8px 10px;border-radius:6px;border:1px solid #e8b5ab">' +
                 (detail || '(추가 정보 없음)') +
                 '</div>' +
                 '<div style="font-size:10px;font-weight:400;margin-top:8px;color:#8a7a6a">이 화면을 캡처해서 보고해 주세요. reset.html 적용도 시도해 보세요.</div>';
}
window.addEventListener('error', e => {
  const msg = (e.message || 'unknown error') +
              (e.filename ? ' @ ' + e.filename.replace(/.*\//, '') + ':' + (e.lineno||'?') + ':' + (e.colno||'?') : '');
  __paideiaShowError('JavaScript 오류', msg);
});
window.addEventListener('unhandledrejection', e => {
  let msg = 'Promise 거부';
  if(e.reason){
    if(e.reason.message) msg = e.reason.message + (e.reason.stack ? '\n\n' + e.reason.stack.split('\n').slice(0,3).join('\n') : '');
    else msg = String(e.reason);
  }
  __paideiaShowError('비동기 오류', msg);
});
</script>

<style>
/* ============================================================================
   적색상 도기(red-figure) 미학 — terracotta / black-glaze / ivory
   ============================================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --terracotta:#C44536;
  --terracotta-d:#9E3528;
  --terracotta-l:#D87060;
  --black-glaze:#1a1612;
  --black-glaze-l:#2a241e;
  --ivory:#F4E8D8;
  --ivory-d:#E5D5BC;
  --ivory-w:#FBF6EC;
  --clay:#C4986A;
  --clay-d:#8B6B45;
  --gold:#B8945B;
  --shadow:rgba(26,22,18,0.18);
  --shadow-s:rgba(26,22,18,0.08);
  --ok:#5C8A4A;
  --bad:#A1342B;
  --warn:#C49849;
  --font-display:'Cormorant Garamond',serif;
  --font-grk:'Gentium Book Plus','GFS Didot',Georgia,serif;
  --font-ko:'Noto Sans KR',-apple-system,sans-serif;
  --r:8px;
  --r-l:14px;
  --t:.2s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;background:var(--ivory);color:var(--black-glaze);font-family:var(--font-ko);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.grk{font-family:var(--font-grk)}
.lat{font-family:var(--font-display);font-style:italic}

/* iOS safe-area 노치·홈바 대응 */
@supports (padding: env(safe-area-inset-top)){
  .app-header{ padding-top: calc(18px + env(safe-area-inset-top)) }
  .bottom-nav{ padding-bottom: env(safe-area-inset-bottom) }
}

/* Baked-clay texture overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 60% 80% at 20% 20%,rgba(196,134,86,.10),transparent 60%),
    radial-gradient(ellipse 70% 90% at 80% 90%,rgba(196,69,54,.08),transparent 60%),
    repeating-linear-gradient(45deg,transparent 0 7px,rgba(139,107,69,.018) 7px 8px);
}

/* Meander border (Greek key) — used as decorative divider */
.meander{
  height:18px;background-repeat:repeat-x;background-position:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='18' viewBox='0 0 40 18'><path d='M0 14h6V4h14v6h-6v4h12V4h6v10h6' fill='none' stroke='%231a1612' stroke-width='1.2'/></svg>");
  opacity:.55;
}

#app{min-height:100vh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--ivory);position:relative;box-shadow:0 0 40px rgba(0,0,0,.05)}

/* ============================================================================
   상단 헤더 — 도기의 어깨 부분처럼
   ============================================================================ */
.app-header{
  background:linear-gradient(180deg,var(--black-glaze) 0%,var(--black-glaze-l) 100%);
  color:var(--ivory);padding:18px 18px 12px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 12px var(--shadow);
}
.app-header h1{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.app-header h1 .grk{font-family:var(--font-grk);color:var(--terracotta-l);font-size:.85em}
.app-header h1 .sub{font-family:var(--font-ko);font-weight:400;font-size:13px;color:var(--clay);margin-left:auto;opacity:.85}
.level-banner{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(244,232,216,.15)}
.level-banner .lvl-name{font-family:var(--font-grk);font-size:18px;color:var(--terracotta-l);font-weight:700}
.level-banner .lvl-name .ko{font-family:var(--font-ko);font-size:11px;color:var(--clay);font-weight:400;margin-left:4px}
.xp-bar{flex:1;height:6px;background:rgba(244,232,216,.12);border-radius:3px;overflow:hidden;margin-left:auto;max-width:180px}
.xp-bar .fill{height:100%;background:linear-gradient(90deg,var(--terracotta),var(--terracotta-l));transition:width .6s ease-out}
.xp-num{font-size:11px;color:var(--clay);font-variant-numeric:tabular-nums;min-width:60px;text-align:right}

/* ============================================================================
   하단 네비게이션 — 도기 굽처럼
   ============================================================================ */
.bottom-nav{
  display:grid;grid-template-columns:repeat(5,1fr);
  background:linear-gradient(180deg,var(--ivory) 0%,var(--ivory-d) 100%);
  border-top:1px solid var(--clay-d);position:sticky;bottom:0;z-index:50;
  box-shadow:0 -2px 12px var(--shadow-s);
}
.nav-btn{
  border:none;background:none;padding:10px 4px 8px;font-family:var(--font-ko);
  color:var(--black-glaze-l);cursor:pointer;transition:all var(--t);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
.nav-btn .ic{font-family:var(--font-grk);font-size:18px;line-height:1;color:var(--black-glaze);font-weight:700}
.nav-btn .lb{font-size:10px;letter-spacing:.05em}
.nav-btn.active{color:var(--terracotta)}
.nav-btn.active .ic{color:var(--terracotta)}
.nav-btn.active::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--terracotta);border-radius:1px}
.nav-btn:active{transform:scale(.95)}

/* ============================================================================
   메인 콘텐츠
   ============================================================================ */
main#view{flex:1;padding:16px 16px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--black-glaze);margin-bottom:4px;letter-spacing:.01em}
.view-title .grk{color:var(--terracotta-d);font-weight:600;margin-right:8px}
.view-sub{font-size:13px;color:var(--clay-d);margin-bottom:18px}

/* 카드 — 도기 패널 */
.card{
  background:var(--ivory-w);border:1px solid var(--clay);border-radius:var(--r-l);
  padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow-s);
  position:relative;overflow:hidden;
}
.card.warm{background:linear-gradient(135deg,var(--ivory-w) 0%,var(--clay) 200%);border-color:var(--terracotta-d)}
.card.dark{background:var(--black-glaze);color:var(--ivory);border-color:var(--black-glaze)}
.card.dark .grk{color:var(--terracotta-l)}

/* 통계 띠 */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat-cell{background:var(--ivory-w);border:1px solid var(--clay);border-radius:var(--r);padding:10px 6px;text-align:center}
.stat-cell .v{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--terracotta-d);line-height:1.1}
.stat-cell .l{font-size:10px;color:var(--clay-d);margin-top:2px;letter-spacing:.02em}

/* 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{
  background:var(--ivory-w);border:1px solid var(--clay);border-radius:var(--r-l);
  padding:16px 14px;text-align:left;cursor:pointer;transition:transform var(--t),box-shadow var(--t);
  display:flex;flex-direction:column;gap:6px;font-family:inherit;color:inherit;
}
.tile:active{transform:scale(.97)}
.tile:hover{box-shadow:0 4px 14px var(--shadow)}
.tile .grk{font-size:24px;color:var(--terracotta-d);font-weight:600;line-height:1}
.tile .title{font-size:15px;font-weight:600;color:var(--black-glaze)}
.tile .desc{font-size:11px;color:var(--clay-d)}

/* 일일 인용구 */
.quote-card{background:linear-gradient(135deg,var(--black-glaze) 0%,#0f0c09 100%);color:var(--ivory);padding:18px;border-radius:var(--r-l);margin-bottom:16px;border:1px solid var(--terracotta-d);position:relative}
.quote-card .grk{font-family:var(--font-grk);font-size:18px;line-height:1.5;color:var(--ivory);font-style:italic}
.quote-card .src{font-size:11px;color:var(--terracotta-l);margin-top:8px;letter-spacing:.05em;text-transform:uppercase}

/* 버튼 — 도기 표면 같은 매트 톤 */
.btn{
  border:none;background:var(--terracotta);color:var(--ivory-w);
  padding:11px 18px;border-radius:var(--r);font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:all var(--t);letter-spacing:.02em;
}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--terracotta-d)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:var(--black-glaze);color:var(--ivory)}
.btn-g:hover{background:var(--black-glaze-l)}
.btn-o{background:transparent;color:var(--terracotta-d);border:1px solid var(--terracotta-d)}
.btn-o:hover{background:var(--terracotta);color:var(--ivory-w)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* 필터 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{
  background:var(--ivory-w);border:1px solid var(--clay);color:var(--black-glaze);
  padding:5px 11px;border-radius:14px;font-size:12px;cursor:pointer;transition:all var(--t);
  font-family:inherit;white-space:nowrap;
}
.chip:hover{border-color:var(--terracotta)}
.chip.active{background:var(--terracotta);color:var(--ivory-w);border-color:var(--terracotta)}

/* 퀴즈 카드 */
.quiz-card{background:var(--ivory-w);border:2px solid var(--clay);border-radius:var(--r-l);padding:22px 18px;margin-bottom:12px;text-align:center}
.quiz-prompt{font-family:var(--font-grk);font-size:32px;color:var(--black-glaze);margin-bottom:6px;line-height:1.2;font-weight:600}
.quiz-prompt.ko{font-family:var(--font-ko);font-size:20px;font-weight:600}
.quiz-sub{font-size:12px;color:var(--clay-d);margin-bottom:18px}

.options{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.opt{
  background:var(--ivory-w);border:1.5px solid var(--clay);border-radius:var(--r);
  padding:12px 14px;text-align:left;font-family:inherit;font-size:14px;color:var(--black-glaze);
  cursor:pointer;transition:all var(--t);
}
.opt:hover{border-color:var(--terracotta);background:var(--ivory-d)}
.opt.right{background:#E8F0DD;border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:#F4D8D4;border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.4}
.opt .grk{font-size:18px}

.feedback{margin:14px 0;padding:12px;border-radius:var(--r);font-size:14px;text-align:left}
.feedback.ok{background:#E8F0DD;color:var(--ok);border:1px solid var(--ok)}
.feedback.bad{background:#F4D8D4;color:var(--bad);border:1px solid var(--bad)}
.feedback .grk{font-size:17px;font-weight:600}

input.input{
  width:100%;padding:12px 14px;border:1.5px solid var(--clay);border-radius:var(--r);
  font-family:var(--font-grk);font-size:18px;background:var(--ivory-w);color:var(--black-glaze);
}
input.input:focus{outline:none;border-color:var(--terracotta)}
textarea.input{font-family:var(--font-ko);font-size:14px;line-height:1.5;min-height:80px;resize:vertical}

/* 문법 — 패러다임 테이블 */
.paradigm{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
.paradigm th,.paradigm td{padding:7px 9px;border:1px solid var(--clay);text-align:left}
.paradigm th{background:var(--black-glaze);color:var(--ivory);font-family:var(--font-display);font-weight:600;letter-spacing:.02em;font-size:13px}
.paradigm td.lbl{background:var(--ivory-d);font-weight:600;color:var(--black-glaze-l);font-size:13px}
.paradigm td.grk{font-family:var(--font-grk);font-size:15px;color:var(--terracotta-d);font-weight:600}
.paradigm caption{font-family:var(--font-display);font-size:17px;color:var(--black-glaze);font-style:italic;text-align:left;padding:6px 0;font-weight:600}
.paradigm .section-row td{background:var(--clay);color:var(--ivory-w);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase}

/* 원문 뷰어 */
.passage{font-family:var(--font-grk);font-size:18px;line-height:2.2;color:var(--black-glaze);padding:18px 4px;text-align:left}
.passage .w{cursor:pointer;border-radius:3px;padding:1px 2px;transition:background var(--t)}
/* 품사별 본문 단어 색상 (terracotta 팔레트 조화) */
.passage .w.pos-noun  { color: #8b2e1f; }   /* 명사: 짙은 terracotta */
.passage .w.pos-verb  { color: #2d6354; }   /* 동사: 깊은 청록 */
.passage .w.pos-adj   { color: #6d3f8a; }   /* 형용사: 무화과 보라 */
.passage .w.pos-art   { color: #7a6a4f; }   /* 관사: 회색 갈색 */
.passage .w.pos-prep  { color: #8c5e30; }   /* 전치사: 진한 청동 */
.passage .w.pos-adv   { color: #a87d1d; }   /* 부사: 황금 */
.passage .w.pos-conj  { color: #888080; }   /* 접속사: 중성 회색 */
.passage .w.pos-pron  { color: #234c75; }   /* 대명사: 청남 */
.passage .w.pos-ptcp  { color: #4d3a70; }   /* 분사: 어두운 보라 */
.passage .w.pos-inf   { color: #3a5a3d; }   /* 부정사: 어두운 녹색 */
.passage .w:hover{background:var(--terracotta-l);color:var(--ivory-w)}
/* 색상 끄기 토글 (v29): OCT/Loeb 같은 학술 표준 무채색 본문 */
.no-color-words .passage .w,
.no-color-words .passage .w.pos-noun,
.no-color-words .passage .w.pos-verb,
.no-color-words .passage .w.pos-adj,
.no-color-words .passage .w.pos-art,
.no-color-words .passage .w.pos-prep,
.no-color-words .passage .w.pos-adv,
.no-color-words .passage .w.pos-conj,
.no-color-words .passage .w.pos-pron,
.no-color-words .passage .w.pos-ptcp,
.no-color-words .passage .w.pos-inf { color: var(--black-glaze); }
.passage .pn{display:inline-block;width:34px;color:var(--clay-d);font-family:var(--font-display);font-style:italic;font-size:14px;user-select:none}
.cite-line{font-family:var(--font-display);font-style:italic;color:var(--clay-d);font-size:13px;margin-bottom:6px;letter-spacing:.02em}

/* 명예의 전당 */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.badge{
  aspect-ratio:1;background:var(--ivory-w);border:2px solid var(--clay);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;
  transition:all var(--t);position:relative;
}
.badge.got{border-color:var(--terracotta);background:linear-gradient(135deg,var(--ivory-w),var(--clay));box-shadow:0 2px 8px var(--shadow)}
.badge.locked{opacity:.35;filter:grayscale(.8)}
.badge .ic{font-family:var(--font-grk);font-size:22px;color:var(--terracotta-d);line-height:1;margin-bottom:2px}
.badge .nm{font-size:9px;line-height:1.1;color:var(--black-glaze-l)}

.ladder{margin:10px 0}
.ladder-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);margin-bottom:4px;background:var(--ivory-w);border:1px solid var(--clay)}
.ladder-row.current{background:linear-gradient(90deg,var(--terracotta-l) 0%,var(--ivory-w) 80%);border-color:var(--terracotta)}
.ladder-row.passed{opacity:.55}
.ladder-row .grk{font-family:var(--font-grk);font-size:16px;color:var(--terracotta-d);font-weight:700;min-width:80px}
.ladder-row .ko{font-size:12px;color:var(--clay-d);flex:1}
.ladder-row .xp-need{font-size:11px;color:var(--clay-d);font-variant-numeric:tabular-nums}

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:var(--black-glaze);color:var(--ivory-w);padding:10px 18px;border-radius:20px;
  font-size:13px;box-shadow:0 4px 16px var(--shadow);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.toast.show{opacity:1}
.toast.xp{background:var(--terracotta);font-weight:600}

/* 메모 영역 */
.memo-block{margin-top:14px}
.memo-block label{display:block;font-size:12px;color:var(--clay-d);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}

/* 도움말·작은 텍스트 */
.hint{font-size:11px;color:var(--clay-d);margin-top:8px;font-style:italic}
.divider{height:1px;background:var(--clay);margin:18px 0;opacity:.4}

/* 빈 상태 */
.empty{text-align:center;padding:32px 20px;color:var(--clay-d)}
.empty .grk{font-size:32px;color:var(--terracotta-l);margin-bottom:10px;font-family:var(--font-grk)}

/* 동적 요소 */
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse .5s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* 미니 링크 */
.minlink{color:var(--terracotta-d);text-decoration:none;font-size:12px;border-bottom:1px dotted var(--terracotta-d);font-weight:500}
.minlink:hover{color:var(--terracotta)}

/* 진행률 */
.progress{height:5px;background:var(--ivory-d);border-radius:3px;overflow:hidden;margin:8px 0}
.progress .fill{height:100%;background:var(--terracotta);transition:width .4s}

/* 큰 그리스어 표시 */
.big-grk{font-family:var(--font-grk);font-size:28px;color:var(--terracotta-d);font-weight:600;line-height:1.3;margin:8px 0}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(26,22,18,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--ivory-w);border-radius:var(--r-l);padding:22px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--clay)}
.modal h3{font-family:var(--font-display);font-size:20px;color:var(--terracotta-d);margin-bottom:10px;font-weight:600}
.modal-close{float:right;cursor:pointer;font-size:20px;color:var(--clay-d);border:none;background:none}

/* 데스크탑 너비 적응 */
@media(min-width:560px){
  #app{max-width:520px;margin:20px auto;border-radius:var(--r-l);overflow:hidden;min-height:calc(100vh - 40px)}
  body{background:var(--clay-d)}
  body::before{background:
    radial-gradient(ellipse 60% 80% at 20% 20%,rgba(196,134,86,.20),transparent 60%),
    radial-gradient(ellipse 70% 90% at 80% 90%,rgba(196,69,54,.18),transparent 60%),
    repeating-linear-gradient(45deg,transparent 0 7px,rgba(0,0,0,.025) 7px 8px)}
}
/* ─── 로딩 스플래시 (데이터 동기 로드 중 표시) ─── */
.splash-init{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;padding:32px 20px;text-align:center;
  font-family:Georgia, 'Times New Roman', serif; /* Google Fonts 로드 전 폴백 */
}
.splash-grk{
  font-size:30px;font-weight:600;color:#9C3F2D;
  letter-spacing:.01em;margin-bottom:18px;
  animation: splash-fade 1.4s ease-in-out infinite alternate;
}
.splash-meander{
  width:200px;height:18px;margin-bottom:24px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='18' viewBox='0 0 40 18'><path d='M0 14h6V4h14v6h-6v4h12V4h6v10h6' fill='none' stroke='%23C44536' stroke-width='1.2'/></svg>");
  background-repeat:repeat-x;opacity:.7;
}
.splash-stage{font-size:14px;color:#2a241e;margin-bottom:6px}
.splash-hint{font-size:11px;color:#8a7a6a;font-style:italic}
@keyframes splash-fade { from{opacity:.55} to{opacity:1} }
</style>
</head>

<!-- ===== PWA: 서비스 워커 등록 ===== -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // 새 버전 감지 시 알림
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        if (!newSW) return;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // 새 버전이 대기 중 — 토스트 표시
            const t = document.getElementById('toast');
            if (t) {
              t.innerHTML = '새 버전 사용 가능 — <button style="background:none;border:none;color:#D87060;text-decoration:underline;cursor:pointer;font:inherit" onclick="navigator.serviceWorker.controller.postMessage(\'skipWaiting\');location.reload()">새로고침</button>';
              t.classList.add('show');
              setTimeout(() => t.classList.remove('show'), 8000);
            }
          }
        });
      });
    }).catch(err => console.warn('SW register failed:', err));
  });
}
</script>

<script>
/* engine */

(function(){
'use strict';

// ─── 그리스어 lang 속성 자동 부여 (v32) ──────────────────────────────────────
// 접근성: 스크린 리더(VoiceOver·NVDA·TalkBack)가 그리스어 텍스트를 한국어 음성으로
// 잘못 읽는 문제 해결. .grk 클래스가 있는 요소에는 lang="grc"를 무조건 부여하고,
// --font-grk inline 스타일이 적용된 요소는 내용이 그리스어 위주일 때만 부여(혼합
// 텍스트 오태깅 방지). 동적 삽입은 MutationObserver로 자동 처리.
//
// 주의: HTML lang 속성은 시각 발음 식별(grc) — Web Speech의 utterance.lang('el-GR')
// 과는 독립된 축. 둘 다 v32에서 정상 동작.
(function _setupGreekLang(){
  const GRK_RX = /[\u0370-\u03FF\u1F00-\u1FFF]/;                     // 그리스 + 확장
  const CJK_RX = /[\uAC00-\uD7AF\u3040-\u30FF\u4E00-\u9FFF]/;        // 한·일·중
  const LAT_RX = /[A-Za-z]{4,}/;                                      // 라틴 단어급

  function isMostlyGreek(text){
    if(!text) return false;
    const t = text.trim();
    if(!t || CJK_RX.test(t) || LAT_RX.test(t)) return false;
    return GRK_RX.test(t);
  }
  function applyOne(el){
    if(!el || el.nodeType !== 1 || el.hasAttribute('lang')) return;
    if(el.classList && el.classList.contains('grk')){
      el.setAttribute('lang', 'grc');
      return;
    }
    const style = el.getAttribute && el.getAttribute('style');
    if(style && style.indexOf('--font-grk') !== -1 && isMostlyGreek(el.textContent)){
      el.setAttribute('lang', 'grc');
    }
  }
  function applyIn(root){
    if(!root || root.nodeType !== 1) return;
    applyOne(root);
    if(root.querySelectorAll){
      root.querySelectorAll('.grk:not([lang]), [style*="--font-grk"]:not([lang])').forEach(applyOne);
    }
  }
  // 초기 스윕 — 정적 HTML
  applyIn(document.body);
  // 동적 삽입 감지 — view·modal·toast 모두 포괄
  if(typeof MutationObserver !== 'undefined'){
    const mo = new MutationObserver((muts) => {
      for(const m of muts){ m.addedNodes.forEach(n => applyIn(n)); }
    });
    mo.observe(document.body, {childList: true, subtree: true});
  }
})();

// ─── Firebase 라이브 순위 설정 (선택) ─────────────────────────────────────────
// PWA·자체 호스팅 환경에서 사용자 간 라이브 순위를 작동시키려면 Firebase Realtime
// Database 무료 프로젝트를 만들어 URL을 아래에 넣으세요. 비워두면 localStorage
// 폴백으로 개인 진행만 저장됩니다. (5분 셋업 가이드: README.md 참조)
//
// 예: const FIREBASE_URL = 'https://paideia-xxxxx-default-rtdb.firebaseio.com';
const FIREBASE_URL = 'https://paideia-8e45e-default-rtdb.asia-southeast1.firebasedatabase.app/';

// Firebase REST API 백엔드 (path-based, ':' 금지문자 → '/'로 변환)
const BACKEND = (() => {
  if(!FIREBASE_URL) return null;
  const base = FIREBASE_URL.replace(/\/$/, '');
  const fbPath = (k) => k.replace(/:/g, '/');  // 'lb:userId' → 'lb/userId'
  return {
    label: 'Firebase RTDB',
    getShared: async (k) => {
      try{
        const r = await fetch(`${base}/${fbPath(k)}.json`);
        if(!r.ok) return null;
        const v = await r.json();
        if(v === null || v === undefined) return null;
        return { key:k, value: (typeof v === 'string') ? v : JSON.stringify(v), shared:true };
      }catch(e){ return null; }
    },
    setShared: async (k, v) => {
      try{
        // value는 JSON 문자열 — Firebase에 객체로 저장 (콘솔 가독성)
        const obj = (typeof v === 'string') ? JSON.parse(v) : v;
        const r = await fetch(`${base}/${fbPath(k)}.json`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(obj),
        });
        return r.ok ? { key:k, value:v, shared:true } : null;
      }catch(e){ return null; }
    },
    delShared: async (k) => {
      try{
        await fetch(`${base}/${fbPath(k)}.json`, { method:'DELETE' });
        return { key:k, deleted:true, shared:true };
      }catch(e){ return null; }
    },
    listShared: async (prefix) => {
      // 'lb:' → 'lb' 노드의 자식 키 나열
      const node = prefix.replace(/:$/, '').replace(/:/g, '/');
      try{
        const r = await fetch(`${base}/${node}.json?shallow=true`);
        if(!r.ok) return { keys:[] };
        const data = await r.json();
        if(!data || typeof data !== 'object') return { keys:[] };
        return { keys: Object.keys(data).map(k => prefix + k) };
      }catch(e){ return { keys:[] }; }
    },
  };
})();

// ─── 저장 (window.storage 있으면 사용, 없으면 localStorage 폴백) ─────────────
const KEY = 'hellenike-paideia:v1';
let saveTimer = null;

const STORAGE = (() => {
  const hasWS = (typeof window !== 'undefined') && window.storage

      set: (k,v) => window.storage.set(k,v),
      del: (k) => window.storage.delete(k),
      getShared:  (k) => window.storage.get(k, true),
      setShared:  (k,v) => window.storage.set(k,v, true),
      delShared:  (k) => window.storage.delete(k, true),
      listShared: (prefix) => window.storage.list(prefix, true),
    };
  }
  // localStorage 폴백 — Claude 외부 호스팅 (GitHub Pages, 연구실 서버 등) 용
  let lsWorks = false;
  try{
    const t = '__test__' + Date.now();
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    lsWorks = true;
  }catch(e){ lsWorks = false; }
  if(lsWorks){
    return {
      kind: 'local',
      label: '브라우저 localStorage (개인 전용)',
      supportsShared: false,
      get: async (k) => {
        const v = localStorage.getItem(k);
        return v == null ? null : {key:k, value:v, shared:false};
      },
      set: async (k,v) => {
        localStorage.setItem(k, v);
        return {key:k, value:v, shared:false};
      },
      del: async (k) => {
        localStorage.removeItem(k);
        return {key:k, deleted:true, shared:false};
      },
      getShared:  async () => null,
      setShared:  async () => null,
      delShared:  async () => null,
      listShared: async () => ({keys:[]}),
    };
  }
  // 둘 다 안 되면 메모리에만 (페이지 새로고침 시 사라짐)
  const mem = {};
  return {
    kind: 'memory',
    label: '메모리 (저장 안 됨 — 새로고침 시 초기화)',
    supportsShared: false,
    get: async (k) => (k in mem) ? {key:k, value:mem[k], shared:false} : null,
    set: async (k,v) => { mem[k] = v; return {key:k, value:v, shared:false}; },
    del: async (k) => { delete mem[k]; return {key:k, deleted:true, shared:false}; },
    getShared:  async () => null,
    setShared:  async () => null,
    delShared:  async () => null,
    listShared: async () => ({keys:[]}),
  };
})();

// Firebase 백엔드가 설정되어 있으면 shared 저장을 그쪽으로 라우팅

if(BACKEND){

  STORAGE.label = STORAGE.label + ' + ' + BACKEND.label + ' (라이브 공유 활성)';
}

const PROFILE_META_KEY = 'paideia-profile-meta';
let _currentProfileId = null;
let _profileMetaCache = null;   // 동기 접근용 (load 후 채워짐)
function _profileKey(id){ return 'paideia-state-' + id; }
function _newProfileId(){
  return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}

async function getProfileMeta(){
  // 1) 메타 있으면 그것 사용
  try {
    const r = await STORAGE.get(PROFILE_META_KEY);
    if(r && r.value){
      const m = JSON.parse(r.value);
      if(m && Array.isArray(m.profiles) && m.profiles.length > 0 && m.currentId){
        _profileMetaCache = m;
        return m;
      }
    }
  } catch(e){}
  // 2) 메타 없음 — 기존 단일 프로필 키(KEY)에서 마이그레이션
  let migratedState = null;
  try {
    const r = await STORAGE.get(KEY);
    if(r && r.value) migratedState = JSON.parse(r.value);
  } catch(e){}
  const defaultId = 'p_default';
  const meta = {
    currentId: defaultId,
    profiles: [{
      id: defaultId,
      name: migratedState ? '기본' : '기본',
      createdAt: Date.now(),
      lastUsed: Date.now(),
    }],
    schemaVersion: 1,
  };
  if(migratedState){
    try { await STORAGE.set(_profileKey(defaultId), JSON.stringify(migratedState)); }
    catch(e){ console.warn('migrate failed', e); }
    // 기존 KEY는 fallback 안전망으로 그대로 둠
  }
  try { await STORAGE.set(PROFILE_META_KEY, JSON.stringify(meta)); }
  catch(e){ console.warn('meta save failed', e); }
  _profileMetaCache = meta;
  return meta;
}
async function setProfileMeta(meta){
  try { await STORAGE.set(PROFILE_META_KEY, JSON.stringify(meta)); }

}

async function createProfile(name){
  const meta = await getProfileMeta();
  const cleanName = (name || '').trim() || '새 사용자';
  if(cleanName.length > 30) return null;
  // 중복 이름 방지: 같은 이름 있으면 (2), (3) 자동 부여
  let finalName = cleanName;
  let suffix = 2;
  while(meta.profiles.find(p => p.name === finalName)){
    finalName = cleanName + ' (' + suffix + ')';
    suffix++;
  }
  const id = _newProfileId();
  meta.profiles.push({
    id, name: finalName,
    createdAt: Date.now(),
    lastUsed: 0,
  });
  await setProfileMeta(meta);
  return id;
}

  const cleanName = (newName || '').trim();
  if(!cleanName || cleanName.length > 30) return false;
  if(meta.profiles.find(x => x.id !== id && x.name === cleanName)) return false;
  p.name = cleanName;
  await setProfileMeta(meta);
  return true;
}

async function deleteProfile(id){
  const meta = await getProfileMeta();
  if(meta.profiles.length <= 1) return false;
  meta.profiles = meta.profiles.filter(p => p.id !== id);
  let switched = false;
  if(meta.currentId === id){
    meta.currentId = meta.profiles[0].id;
    switched = true;
  }
  await setProfileMeta(meta);
  try { await STORAGE.del(_profileKey(id)); } catch(e){}
  if(switched){ location.reload(); }
  return true;
}

  if(S.analysisWritten >= 5) awardBadge('analysis');

}

const ALL_VOCAB = [].concat(TEXTBOOK_W).concat(DCC_W);
const POS_LABELS = {N:'명사',V:'동사',A:'형용사',D:'부사',C:'접속사',P:'전치사',PR:'대명사',NUM:'수사',ART:'관사'};
function uniqByGreek(arr){
  const seen = new Map();
  for(const w of arr){ if(!seen.has(w.g)) seen.set(w.g, w); }
  return [...seen.values()];
}
function randPick(arr,n){
  const c=[...arr]; const out=[];
  for(let i=0;i<n && c.length;i++){
    const idx = Math.floor(Math.random()*c.length);
    out.push(c.splice(idx,1)[0]);
  }
  return out;
}

// ─── 어휘 필터링 / 풀 빌더 ───────────────────────────────────────────────────
const VOCAB_FILTERS = { source:'all', pos:'all', lessonGroups:['all'] };
function lessonGroupFn(g){
  if(g==='all') return _=>true;
  if(g==='textbook-early') return w => w.l>=3 && w.l<=12;
  if(g==='textbook-mid')   return w => w.l>=13 && w.l<=24;
  if(g==='textbook-late')  return w => w.l>=25 && w.l<=40;
  if(g==='dcc-100')        return w => w.l===501;
  if(g==='dcc-200')        return w => w.l===502;
  if(g==='dcc-300')        return w => w.l===503;
  if(g==='dcc-400')        return w => w.l===504;
  if(g==='dcc-523')        return w => w.l===505;
  // 개별 교재 과: tb-3, tb-4, ..., tb-40
  if(g.startsWith('tb-')){
    const n = parseInt(g.slice(3), 10);
    if(!isNaN(n)) return w => w.l === n;
  }
  return _=>true;
}
function buildVocabPool(){
  const f = VOCAB_FILTERS;
  let pool = ALL_VOCAB;
  if(f.source==='textbook') pool = TEXTBOOK_W;
  else if(f.source==='dcc') pool = DCC_W;
  // 다중 과 선택: 그룹 중 하나라도 해당하면 포함 (OR)
  const groups = f.lessonGroups || ['all'];
  if(!groups.includes('all') && groups.length){
    const fns = groups.map(lessonGroupFn);
    pool = pool.filter(w => fns.some(fn => fn(w)));
  }
  if(f.pos!=='all') pool = pool.filter(w=>w.pos===f.pos);
  return pool;
}

// SRS: 오답함의 단어가 풀에 있으면 가중치 ↑
function pickQuestion(pool){
  if(pool.length===0) return null;
  // 30% 확률로 오답함에서 픽 (있을 경우)
  const wrongIds = Object.keys(S.wrongRoom).filter(g => pool.some(w=>w.g===g));
  if(wrongIds.length && Math.random() < 0.35){
    const g = wrongIds[Math.floor(Math.random()*wrongIds.length)];
    return pool.find(w=>w.g===g);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

// ===== 헷갈리는 오답 생성 (v9 객관식 개선) =====
// 단순 무작위 → 시각적·의미적·품사적 혼란도 점수 기반 선택.
function _levenshtein(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    const cur = new Array(n + 1);
    cur[0] = i;
    for(let j = 1; j <= n; j++){
      const c = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + c);
    }
    prev = cur;
  }
  return prev[n];
}
function _stripDiacritics(w){
  if(!w) return '';
  return w.normalize('NFD').replace(/[\u0300-\u036F]/g, '');
}
function _tokenizeKo(s){
  if(!s) return new Set();
  return new Set(s.split(/[\s,;··:·]+|\s*\/\s*|\s*\(\s*|\s*\)\s*/)
                  .map(x => x.trim())
                  .filter(x => x.length >= 2 && !/^(또는|혹은|및|등|것|수|중|또|에|을|를|의|이|가|은|는)$/.test(x)));
}
function pickConfusingDistractors(q, pool, n){
  // q와 시각·의미·품사적으로 혼란되는 단어 n개를 pool에서 선택.
  const cands = pool.filter(x => x.g !== q.g);
  if(cands.length <= n) return cands.slice(0, n);
  const qBase = _stripDiacritics(q.g).toLowerCase();
  const qKoTokens = _tokenizeKo(q.ko);
  const scored = cands.map(c => {
    let s = 0;
    if(c.pos === q.pos) s += 10;               // 같은 품사 강한 우선
    const cBase = _stripDiacritics(c.g).toLowerCase();
    const lev = _levenshtein(qBase, cBase);
    const ml = Math.max(qBase.length, cBase.length, 1);
    s += (1 - lev / ml) * 7;                   // 시각적 유사 (0~7)
    const cKoTokens = _tokenizeKo(c.ko);
    let overlap = 0;
    for(const tk of cKoTokens) if(qKoTokens.has(tk)) overlap++;
    if(overlap > 0) s += 4 + overlap * 2;      // 의미 토큰 겹침
    // 동일한 lesson(과) 약간 우선 (학습 동시기 단어가 헷갈림)
    if(c.l === q.l) s += 1.5;
    s += Math.random() * 0.4;                  // 동점자 무작위 분산
    return {c, s};
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, n).map(x => x.c);
}

function startQuiz(mode, dir, pool, isWrong){
  if(pool.length<4){ toast('풀이 너무 작습니다 (최소 4개 필요).'); return; }
  vocabSession = { qIdx:0, total:Math.min(10, pool.length), right:0, wrong:0, mode, dir, q:null, pool, isWrong:!!isWrong };
  nextQuestion();
}
function nextQuestion(){
  const s = vocabSession;
  if(s.qIdx >= s.total){ finishQuiz(); return; }
  const q = pickQuestion(s.pool);
  s.q = q;
  const area = document.getElementById('quiz-area');
  S.vocabSeen += 1; saveState();

  const promptGr = s.dir==='g2k';
  const prompt = promptGr
    ? `<div class="quiz-prompt grk">${q.g}${q.r?` <span style="font-size:14px;color:var(--clay-d);font-family:var(--font-grk)">${q.r}</span>`:''}</div>`

  if(s.mode==='mc'){
    const distractors = pickConfusingDistractors(q, s.pool, 3);
    const opts = [...distractors, q].sort(()=>Math.random()-.5);
    area.innerHTML = `
      <div class="quiz-card fade-in">
        ${prompt}
        <div class="quiz-sub">${sub}</div>
        <div class="options">
          ${opts.map(o=>`<button class="opt" data-g="${o.g}">${promptGr?o.ko:`<span class="grk">${o.g}</span>${o.r?' '+o.r:''}`}</button>`).join('')}
        </div>
        <div id="fb"></div>
        <div style="margin-top:14px;font-size:11px;color:var(--clay-d)">${s.qIdx+1} / ${s.total}</div>
      </div>
    `;
    area.querySelectorAll('.opt').forEach(b=> b.addEventListener('click',()=> answerMC(b, q, opts)));
  } else {
    area.innerHTML = `
      <div class="quiz-card fade-in">
        ${prompt}
        <div class="quiz-sub">${sub}</div>
        <input class="input" id="answer-input" autocomplete="off" placeholder="한국어 뜻을 입력하세요…">
        <div class="btn-row" style="margin-top:12px;justify-content:center">
          <button class="btn" id="submit-typed">제출</button>
          <button class="btn btn-o btn-sm" id="show-typed">모르겠다</button>
        </div>
        <div id="fb"></div>
        <div style="margin-top:14px;font-size:11px;color:var(--clay-d)">${s.qIdx+1} / ${s.total}</div>
      </div>
    `;
    const inp = document.getElementById('answer-input');
    inp.focus();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('submit-typed').click(); });
    document.getElementById('submit-typed').addEventListener('click',()=> answerTyped(q));
    document.getElementById('show-typed').addEventListener('click',()=> answerTyped(q, true));
  }
}
function normalizeAnswer(s){ return (s||'').replace(/\s+/g,' ').replace(/[,\.\(\)~·…!?]/g,'').trim().toLowerCase(); }
function answerMC(btn, q, opts){
  const chosen = btn.dataset.g;
  const correct = (chosen === q.g);
  const fb = document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.g === q.g) o.classList.add('right');
    else if(o === btn && !correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  if(correct){
    vocabSession.right += 1;
    S.vocabCorrectCount += 1;
    // 오답함 streak 처리
    bumpWrongRoom(q.g, +1);
    fb.innerHTML = `<div class="feedback ok">✓ 정답 — <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  } else {
    vocabSession.wrong += 1;
    bumpWrongRoom(q.g, -1, q);
    fb.innerHTML = `<div class="feedback bad">✗ 오답 — 정답: <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  }
  setTimeout(()=>{ vocabSession.qIdx += 1; nextQuestion(); }, correct?1100:1700);
}
function answerTyped(q, giveUp){
  const inp = document.getElementById('answer-input');
  const userA = giveUp ? '' : inp.value;
  const fb = document.getElementById('fb');
  // 입력형은 한국어 뜻을 입력. 매칭: 사용자 답이 정답 ko 의 첫 단어/구를 포함하면 정답
  const target = q.ko.split(/[,·\/;]/)[0].trim();
  const ok = !giveUp && (normalizeAnswer(userA).includes(normalizeAnswer(target)) || normalizeAnswer(target).includes(normalizeAnswer(userA)) && userA.length>=2);
  if(ok){
    vocabSession.right += 1;
    S.vocabCorrectCount += 1;
    bumpWrongRoom(q.g, +1);
    fb.innerHTML = `<div class="feedback ok">✓ 정답 — <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  } else {
    vocabSession.wrong += 1;
    bumpWrongRoom(q.g, -1, q);
    fb.innerHTML = `<div class="feedback bad">✗ ${giveUp?'정답':'오답'} — <span class="grk">${q.g}</span> = ${q.ko}</div>`;
  }
  document.getElementById('submit-typed').disabled = true;
  document.getElementById('show-typed').disabled = true;
  setTimeout(()=>{ vocabSession.qIdx += 1; nextQuestion(); }, ok?1100:1700);
}
function bumpWrongRoom(g, delta, q){
  if(delta < 0){
    // 오답 → 추가/카운트 증가
    if(!S.wrongRoom[g]) S.wrongRoom[g] = {miss:0, streak:0, lemma:g, ko:q?q.ko:'', pos:q?q.pos:''};
    S.wrongRoom[g].miss += 1;
    S.wrongRoom[g].streak = 0;
  } else {
    // 정답 → streak 증가; 3연속이면 졸업
    if(S.wrongRoom[g]){
      S.wrongRoom[g].streak = (S.wrongRoom[g].streak||0) + 1;
      if(S.wrongRoom[g].streak >= 3){
        delete S.wrongRoom[g];
        addXP(8, '오답함 졸업');
        // 오답함이 비었으면 배지
        if(Object.keys(S.wrongRoom).length === 0){
          awardBadge('wrong-zero');
        }
      }
    }
  }
  saveState();
}

let _accentCorpus = null;
function getAccentCorpus(){
  if(_accentCorpus) return _accentCorpus;
  const set = new Set();
  if(typeof WORKS !== 'undefined' && Array.isArray(WORKS)){
    for(const wk of WORKS){
      for(const sec of (wk.sections || [])){
        const text = sec.text || '';
        text.split(/[\s\.,;··:\?\!"\(\)\[\]\—\-]+/).forEach(w => {
          const clean = w.trim().replace(/^[''«»"']+|[''«»"']+$/g, '');
          if(clean.length >= 2 && /[\u0370-\u03FF\u1F00-\u1FFF]/.test(clean)){
            set.add(clean);
          }
        });
      }
    }
  }
  _accentCorpus = Array.from(set);
  return _accentCorpus;
}

let _accentByType = null;
function getCorpusByType(){
  if(_accentByType) return _accentByType;
  const corpus = getAccentCorpus();
  const by = {oxytone:[], paroxytone:[], proparoxytone:[],
              perispomenon:[], properispomenon:[], barytone:[], atonic:[]};
  for(const w of corpus){
    const r = classifyAccent(w);
    if(by[r.type]) by[r.type].push(w);
  }
  _accentByType = by;
  return by;
}

// 단어의 다양한 악센트 위치 변형 생성 (위치 맞히기 퀴즈용)
function buildAccentVariants(strippedWord){
  const VOWELS = 'αεηιουωΑΕΗΙΟΥΩ';
  const ACUTE = '\u0301';
  const CIRC  = '\u0342';
  const nfd = strippedWord.normalize('NFD');
  // 각 음절 마지막 모음 char index 식별 (이중모음 합침)
  const vowelEnds = [];
  let i = 0;
  while(i < nfd.length){
    const c = nfd[i];
    if(VOWELS.includes(c)){
      let lastV = i;
      let j = i + 1;
      while(j < nfd.length && /\p{M}/u.test(nfd[j])) j++;
      if(j < nfd.length && 'ιυΙΥ'.includes(nfd[j]) && 'αεηοΑΕΗΟυΥ'.includes(c)){
        // diaeresis 점검
        let k = j + 1;
        const tmp = [];
        while(k < nfd.length && /\p{M}/u.test(nfd[k])){ tmp.push(nfd[k]); k++; }
        if(!tmp.includes('\u0308')){
          lastV = j;
          i = k;
        } else {
          i = j;
        }
      } else {
        i = j;
      }
      vowelEnds.push(lastV);
    } else {
      i++;
    }
  }
  const n = vowelEnds.length;
  const variants = [];
  // 마지막 세 음절에 각각 acute, ultima·penult에 circumflex
  const posLabels = ['ultima', 'penult', 'antepenult'];
  for(let pos = 1; pos <= Math.min(3, n); pos++){
    const vi = vowelEnds[n - pos];
    const withAcute = (nfd.slice(0, vi+1) + ACUTE + nfd.slice(vi+1)).normalize('NFC');
    variants.push({label: posLabels[pos-1] + ' acute',     word: withAcute});
    if(pos <= 2){
      const withCirc = (nfd.slice(0, vi+1) + CIRC + nfd.slice(vi+1)).normalize('NFC');
      variants.push({label: posLabels[pos-1] + ' circumflex', word: withCirc});
    }
  }
  return variants;
}

function startAccentPositionQuiz(){
  const byType = getCorpusByType();
  // 후보: 모든 5종에서 2음절 이상, 본디 악센트 있는 단어
  const pool = [];
  for(const tp of ['oxytone','paroxytone','proparoxytone','perispomenon','properispomenon']){
    for(const w of (byType[tp] || [])){
      const a = classifyAccent(w);
      if(a.syllableCount >= 2) pool.push(w);
    }
  }
  if(pool.length < 10){
    document.getElementById('accent-pos-quiz').innerHTML =
      '<div style="color:var(--clay-d);font-size:13px">데이터 부족.</div>';
    return;
  }
  const questions = [];
  let tried = 0;
  while(questions.length < 10 && tried < 60){
    tried++;
    const w = pool[Math.floor(Math.random() * pool.length)];
    const stripped = stripAccent(w);
    const variants = buildAccentVariants(stripped);
    // 정답은 원본 w. 오답: variants 중 w가 아닌 것 3개
    const others = variants.filter(v => v.word !== w);
    if(others.length < 3) continue;
    const distractors = others.sort(()=>Math.random()-.5).slice(0, 3).map(v => v.word);
    const options = [w, ...distractors].sort(()=>Math.random()-.5);
    questions.push({correct: w, stripped, options});
  }
  if(questions.length < 3){
    document.getElementById('accent-pos-quiz').innerHTML =
      '<div style="color:var(--clay-d);font-size:13px">출제 불가능한 코퍼스 상태.</div>';
    return;
  }
  renderAccentPositionQuiz(questions, 0, 0);
}

function renderAccentPositionQuiz(questions, idx, score){
  const host = document.getElementById('accent-pos-quiz');
  if(!host) return;
  const Q = questions[idx];

    host.innerHTML = `
      <div style="text-align:center;padding:14px 0">
        <div style="font-family:var(--font-display);font-size:28px;color:var(--terracotta-d);font-weight:600">${score}/${total}</div>
        <div style="font-size:13px;color:var(--clay-d);margin-top:4px">정답률 ${pct}%</div>
        <button class="btn" style="margin-top:14px" onclick="startAccentPositionQuiz()">다시 →</button>
      </div>`;
    if(typeof S !== 'undefined' && typeof saveState === 'function'){
      S.xp = (S.xp || 0) + score * 2;
      saveState();
    }
    return;
  }
  host.innerHTML = `
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:8px">문제 ${idx+1}/${questions.length} · 점수 ${score}</div>
    <div style="font-family:var(--font-grk);font-size:30px;color:var(--clay-d);font-weight:600;text-align:center;padding:8px 0;letter-spacing:.05em;opacity:.6">${Q.stripped}</div>
    <div style="font-size:12px;color:var(--clay-d);text-align:center;margin-bottom:12px">위 단어에 본디 들어가는 악센트는?</div>
    ${Q.options.map(o => `
      <button class="btn btn-o" style="display:block;width:100%;margin:6px 0;text-align:center;font-family:var(--font-grk);font-size:22px;letter-spacing:.05em" data-w="${o}">${o}</button>
    `).join('')}
  `;
  host.querySelectorAll('[data-w]').forEach(btn => {
    btn.addEventListener('click', () => {
      const correct = btn.dataset.w === Q.correct;
      host.querySelectorAll('[data-w]').forEach(b => {
        b.disabled = true;
        if(b.dataset.w === Q.correct){
          b.style.background = 'var(--terracotta)';
          b.style.color = '#fff';
          b.style.borderColor = 'var(--terracotta-d)';
        } else if(b === btn){
          b.style.opacity = '0.45';
        }
      });
      setTimeout(() => renderAccentPositionQuiz(questions, idx + 1, score + (correct ? 1 : 0)), 850);
    });
  });
}

function startAccentQuiz(){
  const byType = getCorpusByType();
  const types = ['oxytone','paroxytone','proparoxytone','perispomenon','properispomenon'];
  const valid = types.filter(t => byType[t] && byType[t].length >= 2);
  if(valid.length < 4){
    document.getElementById('accent-quiz').innerHTML =
      '<div style="color:var(--clay-d);font-size:13px">본문에서 충분한 유형이 검출되지 않았습니다.</div>';
    return;
  }
  const questions = [];
  // 각 유형이 균형 있게 나오도록
  for(let i = 0; i < 10; i++){
    const t = valid[i % valid.length];
    const word = byType[t][Math.floor(Math.random() * byType[t].length)];
    const others = valid.filter(x => x !== t).sort(()=>Math.random()-.5).slice(0, 3);
    const options = [t, ...others].sort(()=>Math.random()-.5);
    questions.push({word, correct: t, options});
  }
  questions.sort(()=>Math.random()-.5);
  renderAccentQuiz(questions, 0, 0);
}

function renderAccentQuiz(questions, idx, score){
  const TN = {
    oxytone:'ὀξύτονον · 옥시톤',
    paroxytone:'παροξύτονον · 파록시톤',
    proparoxytone:'προπαροξύτονον · 프로파록시톤',
    perispomenon:'περισπώμενον · 페리스포메논',
    properispomenon:'προπερισπώμενον · 프로페리스포메논'
  };
  const host = document.getElementById('accent-quiz');
  if(!host) return;
  const q = questions[idx];
  if(!q){
    const total = questions.length;
    const pct = Math.round(100 * score / total);
    host.innerHTML = `
      <div style="text-align:center;padding:14px 0">
        <div style="font-family:var(--font-display);font-size:28px;color:var(--terracotta-d);font-weight:600">${score}/${total}</div>
        <div style="font-size:13px;color:var(--clay-d);margin-top:4px">정답률 ${pct}%</div>
        <button class="btn" style="margin-top:14px" onclick="startAccentQuiz()">다시 →</button>
      </div>`;
    if(typeof S !== 'undefined' && typeof saveState === 'function'){
      S.xp = (S.xp || 0) + score * 2;
      saveState();
    }
    return;
  }
  host.innerHTML = `
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:8px">문제 ${idx+1}/${questions.length} · 점수 ${score}</div>
    <div style="font-family:var(--font-grk);font-size:34px;color:var(--terracotta-d);font-weight:600;text-align:center;padding:14px 0;letter-spacing:.05em">${q.word}</div>
    <div style="font-size:12px;color:var(--clay-d);text-align:center;margin-bottom:12px">이 단어의 악센트 유형은?</div>
    ${q.options.map(opt => `
      <button class="btn btn-o" style="display:block;width:100%;margin:6px 0;text-align:left;font-size:13px" data-opt="${opt}">
        ${TN[opt]}
      </button>`).join('')}
  `;
  host.querySelectorAll('[data-opt]').forEach(btn => {
    btn.addEventListener('click', () => {
      const chosen = btn.dataset.opt;
      const correct = chosen === q.correct;
      host.querySelectorAll('[data-opt]').forEach(b => {
        b.disabled = true;
        if(b.dataset.opt === q.correct){
          b.style.background = 'var(--terracotta)';
          b.style.color = '#fff';
          b.style.borderColor = 'var(--terracotta-d)';
        } else if(b === btn){
          b.style.opacity = '0.45';
        }
      });
      setTimeout(() => renderAccentQuiz(questions, idx + 1, score + (correct ? 1 : 0)), 850);
    });
  });
}

// ===== 변형 드릴 (Inflection drill) =====
// TOPICS의 items 활용: form ↔ info 4지선다. 같은 topic의 다른 items를 오답으로 우선,
// 부족하면 다른 topic에서 Levenshtein 가까운 form 보충.
let _inflectionPool = null;
function getInflectionPool(){
  if(_inflectionPool) return _inflectionPool;
  const pool = [];
  if(typeof TOPICS !== 'undefined'){
    for(const tp of TOPICS){
      if(!tp.items || !tp.items.length) continue;
      for(const it of tp.items){
        if(!it.form || !it.info) continue;
        pool.push({form: it.form, info: it.info, topicTitle: tp.title, topicId: tp.id});
      }
    }
  }
  _inflectionPool = pool;
  return pool;
}

// ===== 방언 식별 퀴즈 (v27) =====
// cite에서 방언 추출 — "(Doric)", "(Homeric, ...)" 등
function _inferDialect(cite){
  if(!cite) return null;
  const m = cite.match(/\(([^)]*)\)/);
  if(!m) return null;
  const tag = m[1].toLowerCase();
  // 복합 표기 우선순위: 첫 명시된 방언 채택
  // ("Aeolic-Doric" → aeolic; "Homeric, ..." → homeric)
  const order = ['attic', 'ionic', 'homeric', 'aeolic', 'doric', 'koine'];
  for(const d of order){
    if(tag.includes(d)) return d;
  }
  return null;
}

const _DIALECT_LABEL = {
  attic:   'Attic · 아테네식',
  ionic:   'Ionic · 이오니아식',
  homeric: 'Homeric · 호메로스식',
  aeolic:  'Aeolic · 아이올리스식',
  doric:   'Doric · 도리스식',
  koine:   'Koine · 코이네',
};

let _dialectQuizQuestions = null;
function _buildDialectQuizPool(){
  const pool = [];
  for(const topic of DIALECT_TOPICS){
    if(!topic.examples) continue;
    for(const ex of topic.examples){
      const d = _inferDialect(ex.cite);
      if(d && _DIALECT_LABEL[d]){
        pool.push({text: ex.text, cite: ex.cite, dialect: d, topicTitle: topic.title});
      }
    }
  }
  return pool;
}

function startDialectQuiz(){
  const pool = _buildDialectQuizPool();
  const usedDialects = [...new Set(pool.map(x => x.dialect))];
  const host = document.getElementById('dialect-quiz-host');
  if(!host) return;
  if(pool.length < 4 || usedDialects.length < 4){
    host.innerHTML = '<div style="color:var(--clay-d);font-size:13px;text-align:center;padding:14px">예문 데이터가 부족합니다.</div>';
    return;
  }
  // 균형 있게 10문제 (가능한 dialect 풀이 적으면 그만큼)
  const targetN = Math.min(10, pool.length);
  const questions = [];
  const usedKeys = new Set();
  let attempts = 0;
  while(questions.length < targetN && attempts < 200){
    attempts++;
    const q = pool[Math.floor(Math.random() * pool.length)];
    const key = q.text;
    if(usedKeys.has(key)) continue;
    usedKeys.add(key);
    // 오답: 정답 외 dialect 3개 (사용 dialect 중에서)
    const distractors = usedDialects.filter(d => d !== q.dialect)
                                     .sort(() => Math.random() - 0.5)
                                     .slice(0, 3);
    const options = [q.dialect, ...distractors].sort(() => Math.random() - 0.5);
    questions.push({...q, options});
  }
  questions.sort(() => Math.random() - 0.5);
  _dialectQuizQuestions = questions;
  renderDialectQuiz(questions, 0, 0);
}
window.startDialectQuiz = startDialectQuiz;

function startInflectionDrill(){
  const pool = getInflectionPool();
  if(pool.length < 10){
    document.getElementById('inflection-quiz').innerHTML =
      '<div style="color:var(--clay-d);font-size:13px">데이터 부족 (10문항 출제 불가).</div>';
    return;
  }
  const used = new Set();
  const questions = [];
  let attempts = 0;
  while(questions.length < 10 && attempts < 200){
    attempts++;
    const q = pool[Math.floor(Math.random() * pool.length)];
    const key = q.topicId + '|' + q.form + '|' + q.info;
    if(used.has(key)) continue;
    used.add(key);
    const sameTopic = pool.filter(x =>
      x.topicId === q.topicId && (x.form !== q.form || x.info !== q.info));
    let distractors;
    if(sameTopic.length >= 3){
      distractors = sameTopic.sort(()=>Math.random()-.5).slice(0, 3);
    } else {
      const qBase = _stripDiacritics(q.form);
      const others = pool.filter(x => x.form !== q.form)
        .map(x => ({x, d: _levenshtein(_stripDiacritics(x.form), qBase)}))
        .sort((a,b) => a.d - b.d)
        .slice(0, 12)
        .sort(()=>Math.random()-.5)
        .map(o => o.x);
      distractors = [...sameTopic];
      for(const o of others){
        if(distractors.length >= 3) break;
        if(!distractors.some(d => d.form === o.form)) distractors.push(o);
      }
    }
    const options = [q, ...distractors].sort(()=>Math.random()-.5);
    questions.push({q, options});
  }
  renderInflectionQuiz(questions, 0, 0);
}

// ===== Cloze deletion (빈칸 채우기) =====
// 실제 본문(WORKS)에서 임의 구절 추출 → 한 단어 빈칸 → 같은 구절 + 길이 비슷 단어로 4지선다.
function _cleanGrkWord(w){
  if(!w) return '';
  return w.replace(/^[^\u0370-\u03FF\u1F00-\u1FFF]+|[^\u0370-\u03FF\u1F00-\u1FFF]+$/g, '');
}
function pickClozeQuestion(){
  if(typeof WORKS === 'undefined' || !WORKS.length) return null;
  for(let attempt = 0; attempt < 50; attempt++){
    const wk = WORKS[Math.floor(Math.random() * WORKS.length)];
    if(!wk.sections || !wk.sections.length) continue;
    const sec = wk.sections[Math.floor(Math.random() * wk.sections.length)];
    if(!sec.text) continue;
    // 구절 분할: 줄바꿈 + 그리스 구두점(· ;) + 라틴 구두점(. !)
    const clauses = sec.text.split(/\n|[\.;·!]+/)
      .map(c => c.replace(/^\s*\d+\s*/, '').trim())   // verse 번호 제거
      .filter(c => c.length >= 14);
    if(!clauses.length) continue;
    const clause = clauses[Math.floor(Math.random() * clauses.length)];
    const tokens = clause.split(/\s+/).filter(w => /[\u0370-\u03FF\u1F00-\u1FFF]/.test(w));
    if(tokens.length < 5 || tokens.length > 18) continue;
    const cands = [];
    for(let i = 0; i < tokens.length; i++){
      const c = _cleanGrkWord(tokens[i]);
      if(c.length >= 4) cands.push({i, clean: c});
    }
    if(!cands.length) continue;
    const pick = cands[Math.floor(Math.random() * cands.length)];
    return {
      workTitle: wk.title || wk.id,
      sectionLabel: sec.label || sec.n || '',
      tokens, blankIdx: pick.i, blankWord: pick.clean
    };
  }
  return null;
}
function buildClozeDistractors(blank, tokens, corpus){
  const blankBase = _stripDiacritics(blank);
  let cands = tokens
    .map(_cleanGrkWord)
    .filter(w => w && w !== blank && w.length >= 3);
  if(cands.length < 6 && corpus){
    const more = corpus.filter(w => w !== blank
      && Math.abs(w.length - blank.length) <= 2
      && !cands.includes(w));
    more.sort(()=>Math.random()-.5);
    for(const m of more.slice(0, 14)) cands.push(m);
  }
  const scored = cands.map(w => ({w, d: _levenshtein(_stripDiacritics(w), blankBase)}));
  const med = scored.filter(s => s.d >= 1 && s.d <= 6);
  const pool = med.length >= 3 ? med : scored;
  return pool.sort(()=>Math.random()-.5).slice(0, 3).map(s => s.w);
}

function startCloze(){
  const corpus = (typeof getAccentCorpus === 'function') ? getAccentCorpus() : [];
  const questions = [];
  let tried = 0;
  while(questions.length < 10 && tried < 120){
    tried++;
    const q = pickClozeQuestion();
    if(!q) continue;
    const distractors = buildClozeDistractors(q.blankWord, q.tokens, corpus);
    if(distractors.length < 3) continue;
    const options = [q.blankWord, ...distractors].sort(()=>Math.random()-.5);
    questions.push({...q, options});
  }
  if(questions.length < 3){
    document.getElementById('cloze-quiz').innerHTML =
      '<div style="color:var(--clay-d);font-size:13px">출제 가능한 구절이 부족합니다.</div>';
    return;
  }
  renderClozeQuiz(questions, 0, 0);
}
function renderClozeQuiz(questions, idx, score){
  const host = document.getElementById('cloze-quiz');
  if(!host) return;
  const Q = questions[idx];
  if(!Q){
    const total = questions.length;
    const pct = Math.round(100 * score / total);
    host.innerHTML = `
      <div style="text-align:center;padding:14px 0">
        <div style="font-family:var(--font-display);font-size:28px;color:var(--terracotta-d);font-weight:600">${score}/${total}</div>
        <div style="font-size:13px;color:var(--clay-d);margin-top:4px">정답률 ${pct}%</div>
        <button class="btn" style="margin-top:14px" onclick="startCloze()">다시 →</button>
      </div>`;
    if(typeof S !== 'undefined' && typeof saveState === 'function'){
      S.xp = (S.xp || 0) + score * 3;
      saveState();
    }
    return;
  }
  const display = Q.tokens.map((tok, i) => {
    if(i === Q.blankIdx){
      return '<span style="background:var(--terracotta-d);color:#fff;padding:1px 14px;border-radius:4px;letter-spacing:.1em">_____</span>';
    }
    return tok;
  }).join(' ');
  host.innerHTML = `
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:8px">문제 ${idx+1}/${questions.length} · 점수 ${score}</div>
    <div style="font-size:11px;color:var(--clay-d);margin-bottom:4px">${Q.workTitle} · ${Q.sectionLabel}</div>
    <div style="font-family:var(--font-grk);font-size:17px;line-height:1.9;color:var(--black-glaze);padding:14px 4px;text-align:center">${display}</div>
    <div style="font-size:12px;color:var(--clay-d);text-align:center;margin-bottom:12px">빈칸에 들어갈 단어는?</div>
    ${Q.options.map(o => `
      <button class="btn btn-o" style="display:block;width:100%;margin:6px 0;text-align:center;font-family:var(--font-grk);font-size:18px;letter-spacing:.05em" data-w="${o}">${o}</button>
    `).join('')}
  `;
  host.querySelectorAll('[data-w]').forEach(btn => {
    btn.addEventListener('click', () => {
      const correct = btn.dataset.w === Q.blankWord;
      host.querySelectorAll('[data-w]').forEach(b => {
        b.disabled = true;
        if(b.dataset.w === Q.blankWord){
          b.style.background = 'var(--terracotta)';
          b.style.color = '#fff';
          b.style.borderColor = 'var(--terracotta-d)';
        } else if(b === btn){
          b.style.opacity = '0.45';
        }
      });
      setTimeout(() => renderClozeQuiz(questions, idx + 1, score + (correct ? 1 : 0)), 950);
    });
  });
}

// ===== 오늘의 단어 (Word of the Day) =====
// 날짜 기반 deterministic 선택. 형태분석 + 전집 본문 용례.
function _todaySeed(){
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
}
function _seededPick(arr, seed){
  // Mulberry32 PRNG
  let s = seed | 0;
  s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  return arr[Math.floor(r * arr.length)];
}
function _findWordInWorks(word, maxHits){
  // word를 전집 본문에서 찾아 (work, section, snippet) 반환
  if(typeof WORKS === 'undefined') return [];
  const hits = [];
  const baseStrip = stripAccent(word).toLowerCase();
  for(const w of WORKS){
    for(const sec of (w.sections || [])){
      const text = sec.text || '';
      // 단어 경계에서 찾기 (그리스어 단어 분리)
      const tokens = text.split(/[\s\.,;··:·!\?"\(\)\[\]\—\-\n]+/);
      for(let ti = 0; ti < tokens.length; ti++){
        const tok = tokens[ti].replace(/^[''«»"']+|[''«»"']+$/g, '');
        if(!tok || tok.length < 2) continue;
        if(stripAccent(tok).toLowerCase() === baseStrip){
          // 주변 문맥
          const start = Math.max(0, ti - 4);
          const end = Math.min(tokens.length, ti + 5);
          const snippet = tokens.slice(start, end).join(' ');
          hits.push({
            workId: w.id, workKo: w.workKo, author: w.authorKo,
            section: sec.label || sec.n, snippet, matched: tok
          });
          if(hits.length >= maxHits) return hits;
          break;  // 한 섹션당 한 hit
        }
      }
    }
  }
  return hits;

// ===== 빈도 분석 (Frequency Analysis) =====
let _freqCache = null;
function computeFrequency(){
  if(_freqCache) return _freqCache;
  if(typeof WORKS === 'undefined') return {global: [], byWork: {}};
  const STOP = new Set(['καί','δέ','τε','γάρ','μέν','οὖν','δή','οὐ','οὐκ','οὐχ','μή',
                        'ὁ','ἡ','τό','τοῦ','τῆς','τοῖς','ταῖς','τόν','τήν','τούς','τάς',
                        'ἐν','ἐκ','ἐξ','εἰς','ἐπί','κατά','πρός','σύν','διά','παρά','ὑπό','ὑπέρ',
                        'ἐγώ','σύ','αὐτός','αὐτή','αὐτό','ἡμεῖς','ὑμεῖς','τις','τίς','τι','τί',
                        'ὥς','ὧδε','τις','τὶς','ἄν','ἐάν','εἰ','ἤ','ὅτι','ὥστε','ὅδε',
                        'δʼ','τʼ','γʼ','μʼ','σʼ','οἷς','αἷς','ᾧ','ᾗ','τῷ','τῇ']);
  const global = {};
  const byWork = {};
  for(const w of WORKS){
    const local = {};
    for(const sec of (w.sections || [])){
      const text = sec.text || '';
      const tokens = text.split(/[\s\.,;··:·!\?"\(\)\[\]\—\-\n0-9]+/);
      for(const tok of tokens){
        const clean = tok.replace(/^[''«»"'·]+|[''«»"'·]+$/g, '');
        if(!clean || clean.length < 3) continue;
        if(!/[\u0370-\u03FF\u1F00-\u1FFF]/.test(clean)) continue;
        const norm = stripAccent(clean).toLowerCase();
        if(STOP.has(clean) || STOP.has(norm)) continue;
        global[clean] = (global[clean] || 0) + 1;
        local[clean] = (local[clean] || 0) + 1;
      }
    }
    byWork[w.id] = Object.entries(local).sort((a,b)=>b[1]-a[1]);
  }
  const globalSorted = Object.entries(global).sort((a,b)=>b[1]-a[1]);
  _freqCache = {global: globalSorted, byWork};
  return _freqCache;
}

// ===== 전체 검색 (Search) =====
function searchInWorks(query, maxHits){
  if(typeof WORKS === 'undefined' || !query || query.length < 2) return [];
  const baseQ = stripAccent(query).toLowerCase();
  const hits = [];
  for(const w of WORKS){
    for(const sec of (w.sections || [])){
      const text = sec.text || '';
      const baseText = stripAccent(text).toLowerCase();
      let idx = 0;
      while(true){
        const found = baseText.indexOf(baseQ, idx);
        if(found < 0) break;
        // 단어 경계 확인
        const before = found > 0 ? baseText[found-1] : ' ';
        const after = found + baseQ.length < baseText.length ? baseText[found + baseQ.length] : ' ';
        const isWordBoundary = !/[\u0370-\u03FF\u1F00-\u1FFF]/.test(before) && !/[\u0370-\u03FF\u1F00-\u1FFF]/.test(after);
        if(isWordBoundary){
          const lo = Math.max(0, found - 50);
          const hi = Math.min(text.length, found + baseQ.length + 50);
          let snippet = text.slice(lo, hi);
          // 매칭 부분 찾아 표시 (원본 텍스트에서)
          const matchInOriginal = text.slice(found, found + baseQ.length);
          snippet = (lo > 0 ? '…' : '') +
                    snippet.replace(matchInOriginal, `<b style="color:var(--terracotta-d);background:var(--ivory-d);padding:0 2px">${matchInOriginal}</b>`) +
                    (hi < text.length ? '…' : '');
          hits.push({
            workId: w.id, workKo: w.workKo, author: w.authorKo,
            section: sec.label || sec.n, snippet,
            sectionId: sec.n
          });
          if(hits.length >= maxHits) return hits;
        }
        idx = found + baseQ.length;
      }
    }
  }
  return hits;
}

let grammarSession = null;
function startGrammarDrill(id){
  const t = TOPICS.find(x=>x.id===id);
  if(!t || !t.items || t.items.length<2){ toast('이 주제는 드릴이 준비되지 않았습니다.'); return; }
  grammarSession = { topic:t, idx:0, total:Math.min(6, t.items.length), right:0, wrong:0, items:[...t.items].sort(()=>Math.random()-.5) };
  if(!S.topicsStudied.includes(id)){ S.topicsStudied.push(id); saveState(); }
  nextGrammarQ();
}
function nextGrammarQ(){
  const s = grammarSession;
  if(s.idx >= s.total){ finishGrammar(); return; }
  const item = s.items[s.idx];
  // 정답 + 다른 3개 (같은 주제에서)
  const distractors = randPick(s.topic.items.filter(x=>x.info!==item.info), 3);
  const opts = [...distractors, item].sort(()=>Math.random()-.5);
  view.innerHTML = `

      </div>
      <div id="g-fb"></div>
    </div>
  `;
  view.querySelectorAll('.opt').forEach(b=> b.addEventListener('click',()=> answerGrammar(b, item, opts)));
}
function answerGrammar(btn, item, opts){
  const chosen = btn.dataset.info;
  const correct = (chosen === item.info);
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.info === item.info) o.classList.add('right');
    else if(o === btn && !correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const fb = document.getElementById('g-fb');
  if(correct){
    grammarSession.right += 1;
    S.grammarCorrectCount += 1;
    fb.innerHTML = `<div class="feedback ok">✓ 정답</div>`;
  } else {
    grammarSession.wrong += 1;
    fb.innerHTML = `<div class="feedback bad">✗ 정답: ${item.info}</div>`;
  }
  setTimeout(()=>{ grammarSession.idx += 1; nextGrammarQ(); }, correct?900:1500);
}
function finishGrammar(){
  const s = grammarSession;
  const xpGain = s.right * 15;
  if(xpGain>0) addXP(xpGain, `문법 드릴 ${s.right}/${s.total}`);

}

function _resolveWork(id){ return WORKS.find(w => w.id === id); }
function _groupProgress(g){
  let done = 0, total = 0, allDone = true;
  for(const wid of g.works){
    const w = _resolveWork(wid);
    if(!w) continue;
    total += w.sections.length;
    const dn = (S.sectionsDone[wid] || []).length;
    done += dn;
    if(!S.worksFinished.includes(wid)) allDone = false;
  }
  return {done, total, pct: total > 0 ? Math.round(done * 100 / total) : 0, allDone};
}

    return `<button class="card" data-id="${w.id}" style="width:100%;text-align:left;cursor:pointer;border:1px solid ${done?'var(--terracotta)':'var(--clay)'};margin:6px 0">

          <div style="font-size:11px;color:var(--clay-d);margin-top:4px;line-height:1.4">${w.note.slice(0, 90)}${w.note.length > 90 ? '…' : ''}</div>

// (v15 이전의 평면 작품 리스트 함수는 그룹화 도입과 함께 renderWorksList로 대체됨 —

function renderWork(workId){
  const w = WORKS.find(x=>x.id===workId);
  if(!w) return;
  // 작품 본문 진입 — 단어 클릭 시 즉응을 위해 형태분석 데이터 미리 로드 시작 (백그라운드)

    <button class="btn btn-sm btn-o" onclick="setTab('read')">← 목록</button>

    </div>` : ''}

function renderWorkSection(workId, secIdx){
  const w = WORKS.find(x=>x.id===workId);
  if(!w) return;
  const sec = w.sections[secIdx];
  if(!sec) return;
  const done = (S.sectionsDone[w.id]||[]).includes(sec.n);
  const colorize = S.readColorize !== false;   // 기본 true (v29 토글)
  const lines = sec.text.split('\n').map(line=>{
    if(!line.trim()) return '<div style="height:6px"></div>';
    const words = line.split(/(\s+)/).map(tok=>{
      if(/^\s+$/.test(tok)) return tok;
      const clean = stripWord(tok);
      if(!clean) return tok;
      const pc = colorize ? posClassOf(clean) : '';
      return `<span class="w${pc}" data-w="${encodeURIComponent(clean)}">${tok}</span>`;
    }).join('');
    return `<div>${words}</div>`;
  }).join('');
  const noteKey = `${workId}:${sec.n}`;
  const note = (S.workNotes[workId] && S.workNotes[workId][sec.n]) || '';
  view.innerHTML = `
    <button class="btn btn-sm btn-o" onclick="window._renderWork('${workId}')">← 섹션</button>
    <h2 class="view-title fade-in" style="margin-top:10px">${w.workKo}</h2>
    <div class="cite-line">${w.author}, <i>${w.work}</i> ${sec.label}</div>

    <div class="card">
      <div class="passage" style="font-size:17px;line-height:2.1">${lines}</div>
      <div class="hint">📌 단어를 누르면 Perseus Morpheus + Logeion 사전이 새 창에서 열립니다.</div>
    </div>

    <div class="memo-block">
      <label>이 섹션 메모</label>
      <textarea class="input" id="memo-sec" placeholder="번역·구문·어휘 메모…">${note}</textarea>
    </div>

    <div class="btn-row" style="margin-top:14px;justify-content:space-between">
      <div style="display:flex;gap:8px">
        ${secIdx>0?`<button class="btn btn-sm btn-o" onclick="window._renderWorkSection('${workId}',${secIdx-1})">← 이전</button>`:''}
        ${secIdx<w.sections.length-1?`<button class="btn btn-sm btn-o" onclick="window._renderWorkSection('${workId}',${secIdx+1})">다음 →</button>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm btn-o" id="toggle-color" title="${colorize?'색깔 끄기':'색깔 켜기'}">${colorize?'🎨':'⚫'}</button>
        ${('speechSynthesis' in window)?`<button class="btn btn-sm btn-o" id="speak-sec" title="발음 듣기">🔊</button>`:''}
        <button class="btn btn-sm ${isBookmarked(workId,sec.n)?'':'btn-o'}" id="bookmark-sec" title="즐겨찾기">${isBookmarked(workId,sec.n)?'★':'☆'}</button>
        <button class="btn btn-sm" id="save-sec-memo">저장</button>
        <button class="btn btn-sm ${done?'btn-o':''}" id="mark-sec-done">${done?'✓ 완독':'완독 (+20 XP)'}</button>
      </div>
    </div>
  `;
  view.querySelectorAll('.w').forEach(el=> el.addEventListener('click', ()=> openLookup(el.dataset.w)));
  document.getElementById('toggle-color').addEventListener('click', () => {
    S.readColorize = !colorize;
    saveState();
    renderWorkSection(workId, secIdx);
    toast(S.readColorize ? '품사별 색칠 켜짐' : '품사별 색칠 꺼짐');
  });

// ===== 악센트 분석 (Smyth's Greek Grammar §156-181) =====
// Unicode NFD 결합기호 기반. 5종 분류 + barytone + atonic.
const _ACC = {
  ACUTE:'\u0301', GRAVE:'\u0300', CIRCUMFLEX:'\u0342',
  SMOOTH:'\u0313', ROUGH:'\u0314', DIAERESIS:'\u0308',
  IOTA_SUB:'\u0345', MACRON:'\u0304'
};
const _GRK_VOWELS = new Set('αεηιουωΑΕΗΙΟΥΩ');
const _DIPH_1 = new Set('αεηοΑΕΗΟυΥ');
const _DIPH_2 = new Set('ιυΙΥ');
function _isCombining(c){ return /\p{M}/u.test(c); }

function syllabifyGreek(word){
  // 그리스어 단어 → 음절 핵 배열 (이중모음 합침, diaeresis 시 분리)
  const nfd = word.normalize('NFD');
  const syls = [];
  let i = 0;
  while(i < nfd.length){
    const c = nfd[i];
    if(_GRK_VOWELS.has(c)){
      const v = c;
      const marks = new Set();
      let j = i + 1;
      while(j < nfd.length && _isCombining(nfd[j])){ marks.add(nfd[j]); j++; }
      let secondV = '';
      if(_DIPH_1.has(v) && j < nfd.length && _DIPH_2.has(nfd[j])){
        let k = j + 1;
        const tmpMarks = new Set();
        while(k < nfd.length && _isCombining(nfd[k])){ tmpMarks.add(nfd[k]); k++; }
        if(!tmpMarks.has(_ACC.DIAERESIS)){
          secondV = nfd[j];
          tmpMarks.forEach(m => marks.add(m));
          j = k;
        }
      }
      syls.push({vowels: v + secondV, marks: marks, idx: syls.length});
      i = j;
    } else {
      i++;
    }
  }
  return syls;
}

function classifyAccent(word){
  if(!word) return {type:'no_vowel', greek:'', korean:'', syllableCount:0};
  const syls = syllabifyGreek(word);
  const n = syls.length;
  if(n === 0) return {type:'no_vowel', greek:'', korean:'모음 없음', syllableCount:0};
  let accIdx = -1, mark = null;
  for(const s of syls){
    if(s.marks.has(_ACC.ACUTE)){ accIdx = s.idx; mark = 'acute'; break; }
    if(s.marks.has(_ACC.CIRCUMFLEX)){ accIdx = s.idx; mark = 'circumflex'; break; }
    if(s.marks.has(_ACC.GRAVE)){ accIdx = s.idx; mark = 'grave'; break; }
  }
  if(accIdx === -1){
    return {type:'atonic', greek:'ἄτονον', korean:'무강세 (전·후접어 가능)',
            accentIdx:-1, position:null, mark:null, syllableCount:n};
  }
  const posFromEnd = accIdx - (n - 1);
  const posMap = {'0':'ultima','-1':'penult','-2':'antepenult'};
  const posLabel = posMap[String(posFromEnd)] || 'beyond';
  if(mark === 'grave'){
    return {type:'barytone', greek:'βαρύτονον',
            korean:'바리톤 — oxytone의 문장 중간 변형',
            accentIdx:accIdx, position:posLabel, mark:'grave', syllableCount:n};
  }
  const map = {
    'acute': {
      '0':  ['oxytone',       'ὀξύτονον',       '옥시톤 — 마지막 음절 예각'],
      '-1': ['paroxytone',    'παροξύτονον',    '파록시톤 — 끝에서 둘째 음절 예각'],
      '-2': ['proparoxytone', 'προπαροξύτονον', '프로파록시톤 — 끝에서 셋째 음절 예각']
    },
    'circumflex': {
      '0':  ['perispomenon',     'περισπώμενον',     '페리스포메논 — 마지막 음절 곡절'],
      '-1': ['properispomenon',  'προπερισπώμενον',  '프로페리스포메논 — 끝에서 둘째 음절 곡절']
    }
  };
  const f = map[mark] && map[mark][String(posFromEnd)];
  if(f) return {type:f[0], greek:f[1], korean:f[2],
                accentIdx:accIdx, position:posLabel, mark:mark, syllableCount:n};
  return {type:'unknown', greek:'', korean:'',
          accentIdx:accIdx, position:posLabel, mark:mark, syllableCount:n};
}

function stripAccent(word){
  // 악센트만 제거 (breathing·iota subscript는 유지) — 퀴즈용
  if(!word) return '';
  return word.normalize('NFD')
    .replace(new RegExp('[' + _ACC.ACUTE + _ACC.GRAVE + _ACC.CIRCUMFLEX + ']', 'g'), '')
    .normalize('NFC');
}

function accentInfoBlock(w){
  // 단어 분석 팝업용 악센트 정보 HTML 조각
  const a = classifyAccent(w);
  if(a.type === 'no_vowel') return '';
  const posKor = {ultima:'마지막', penult:'끝에서 둘째', antepenult:'끝에서 셋째'}[a.position] || '';
  const markKor = {acute:'예각 ´', circumflex:'곡절 ῀', grave:'둔각 `'}[a.mark] || '';
  return `
    <div style="background:linear-gradient(135deg, var(--ivory) 0%, var(--ivory-d) 100%);

        ${a.syllableCount}음절 · ${posKor} 음절 · ${markKor}

}

// ===== 구문 역할 힌트 =====
// 격(case)·동사 형태에서 절 내 역할 한국어로 추론. AGDT dependency 트리 없이도
// 단어 단위 구문 학습 보조 (Smyth §1278+ 격 기능 참조).
function syntaxHintBlock(analyses){
  if(!analyses || !analyses.length) return '';
  const CASE_HINTS = {
    '주격': '주어 · 보어',
    '호격': '부름 (호격)',
    '속격': '소유 · 기원 · 부분 (of)',
    '여격': '간접목적 · 도구 · 장소 (to · with · in)',
    '대격': '직접목적 · 동작 대상'
  };
  const items = [];
  const seen = new Set();
  for(const a of analyses){
    const p = a.p || '';
    for(const [c, h] of Object.entries(CASE_HINTS)){
      if(p.includes(c)){
        const key = c;
        if(!seen.has(key)){ seen.add(key); items.push(`<b>${c}</b> — ${h}`); }
        break;
      }
    }
    if(p.startsWith('동사')){
      if(!seen.has('동사')){ seen.add('동사'); items.push('<b>동사</b> — 절의 핵 (술어)'); }
    } else if(p.startsWith('분사')){
      if(!seen.has('분사')){ seen.add('분사'); items.push('<b>분사</b> — 부속절 (시간·원인·조건·양보)'); }
    } else if(p.startsWith('부정사')){
      if(!seen.has('부정사')){ seen.add('부정사'); items.push('<b>부정사</b> — 보충어·간접화법·부정사구'); }
    } else if(p.startsWith('관사')){
      if(!seen.has('관사')){ seen.add('관사'); items.push('<b>관사</b> — 명사 한정 (성·수·격 일치)'); }
    } else if(p.startsWith('전치사')){
      if(!seen.has('전치사')){ seen.add('전치사'); items.push('<b>전치사</b> — 격 지배 (속·여·대격)'); }
    }
  }
  if(!items.length) return '';
  return `
    <div style="background:#f4ebe2;border-left:3px solid var(--clay-d);padding:8px 12px;margin-bottom:10px;border-radius:6px;font-size:12px">
      <div style="color:var(--clay-d);font-weight:700;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase">📐 구문 역할</div>
      <div style="color:var(--black-glaze-l);line-height:1.6">${items.join(' · ')}</div>
    </div>`;
}

// ===== 품사 색상 분류 =====
// 본문 단어 → MORPH_LOOKUP 룩업 → parse 첫 단어 → 품사 클래스.
function posClassOf(word){
  if(typeof MORPH_LOOKUP === 'undefined') return '';
  const an = MORPH_LOOKUP[word];
  if(!an || !an[0] || !an[0].p) return '';
  const p = an[0].p;
  if(p.startsWith('명사'))    return ' pos-noun';
  if(p.startsWith('동사'))    return ' pos-verb';
  if(p.startsWith('형용사'))  return ' pos-adj';
  if(p.startsWith('관사'))    return ' pos-art';
  if(p.startsWith('전치사'))  return ' pos-prep';
  if(p.startsWith('부사'))    return ' pos-adv';
  if(p.startsWith('접속사'))  return ' pos-conj';
  if(p.startsWith('대명사'))  return ' pos-pron';
  if(p.startsWith('분사'))    return ' pos-ptcp';
  if(p.startsWith('부정사'))  return ' pos-inf';
  return '';
}

// ===== 형태분석 데이터 지연 로드 (data-morph.js, ~4 MB) =====
// SW가 activate 후 백그라운드로 미리 받으므로 보통은 즉시 완료.
// 미캐시 상태에서 단어 첫 클릭 시 한 번만 약 0.5 MB(gzip) 받음.
let _morphLoadPromise = null;
function ensureMorph(){
  if (typeof MORPH_LOOKUP !== 'undefined') return Promise.resolve();
  if (_morphLoadPromise) return _morphLoadPromise;
  _morphLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'data-morph.js';
    s.onload = () => resolve();
    s.onerror = () => { _morphLoadPromise = null; reject(new Error('형태분석 데이터 로드 실패')); };
    document.head.appendChild(s);
  });
  return _morphLoadPromise;
}
window.ensureMorph = ensureMorph;

function openLookup(encWord){

  if(!w) return;
  // 형태분석 데이터 미로드 시: 모달에 로딩 표시 후 비동기 fetch

// 진입 카드 클릭을 body 레벨에서 위임. 인라인 onclick은 모바일 사파리에서
// 자식 div 클릭의 버블링이 불안정해 일부 카드가 안 눌리는 문제를 우회.
document.body.addEventListener('click', function(e){
  const t = e.target.closest('[data-render]');
  if(t){
    const fn = t.getAttribute('data-render');
    if(fn && typeof window[fn] === 'function'){ window[fn](); }
  }
});

window._closeModal = function(){ document.getElementById('modal-bg').classList.remove('show'); };
// 모달 배경 클릭 시 닫기
document.getElementById('modal-bg').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('show');
});

    <button class="card" type="button" data-render="renderBattle" style="cursor:pointer;width:100%;text-align:left;border:1px solid var(--clay);border-left:3px solid var(--terracotta);background:linear-gradient(135deg, var(--ivory) 0%, var(--ivory-d) 100%)">

      <div style="margin-top:10px">${_renderEraStats()}</div>
    </div>

    ${(S.battleHistory && S.battleHistory.length > 0) ? `
    <div class="card">
      <b style="font-size:13px;color:var(--clay-d);letter-spacing:.04em;text-transform:uppercase">최근 배틀 (${S.battleHistory.length}/20)</b>
      <div style="margin-top:8px">${_renderBattleHistory()}</div>

    <div class="card">

      <div class="badge-grid">
        ${BADGES.map(b=>{

          return `<div class="badge ${got?'got':'locked'}" title="${b.desc}">

        }).join('')}
      </div>

    <div class="card">

        · 어휘 정답 누적: <b>${S.vocabCorrectCount}</b><br>

      </div>
