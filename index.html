        n: "1.51-100",
        label: "1.51–100",
        text: "51 αὐτὰρ ἔπειτʼ αὐτοῖσι βέλος ἐχεπευκὲς ἐφιεὶς\n52 βάλλʼ· αἰεὶ δὲ πυραὶ νεκύων καίοντο θαμειαί.\n53 ἐννῆμαρ μὲν ἀνὰ στρατὸν ᾤχετο κῆλα θεοῖο,\n54 τῇ δεκάτῃ δʼ ἀγορὴν δὲ καλέσσατο λαὸν Ἀχιλλεύς·\n55 τῷ γὰρ ἐπὶ φρεσὶ θῆκε θεὰ λευκώλενος Ἥρη·\n56 κήδετο γὰρ Δαναῶν, ὅτι ῥα θνήσκοντας ὁρᾶτο.\n57 οἳ δʼ ἐπεὶ οὖν ἤγερθεν ὁμηγερέες τε γένοντο,\n58 τοῖσι δʼ ἀνιστάμενος μετέφη πόδας ὠκὺς Ἀχιλλεύς·\n59 Ἀτρεΐδη νῦν ἄμμε παλιμπλαγχθέντας ὀΐω\n60 ἂψ ἀπονοστήσειν, εἴ κεν θάνατόν γε φύγοιμεν,\n61 εἰ δὴ ὁμοῦ πόλεμός τε δαμᾷ καὶ λοιμὸς Ἀχαιούς·\n62 ἀλλʼ ἄγε δή τινα μάντιν ἐρείομεν ἢ ἱερῆα\n63 ἢ καὶ ὀνειροπόλον, καὶ γάρ τʼ ὄναρ ἐκ Διός ἐστιν,\n64 ὅς κʼ εἴποι ὅ τι τόσσον ἐχώσατο Φοῖβος Ἀπόλλων,\n65 εἴτʼ ἄρʼ ὅ γʼ εὐχωλῆς ἐπιμέμφεται ἠδʼ ἑκατόμβης,\n66 αἴ κέν πως ἀρνῶν κνίσης αἰγῶν τε τελείων\n67 βούλεται ἀντιάσας ἡμῖν ἀπὸ λοιγὸν ἀμῦναι.\n68 ἤτοι ὅ γʼ ὣς εἰπὼν κατʼ ἄρʼ ἕζετο· τοῖσι δʼ ἀνέστη\n69 Κάλχας Θεστορίδης οἰωνοπόλων ὄχʼ ἄριστος,\n70 ὃς ᾔδη τά τʼ ἐόντα τά τʼ ἐσσόμενα πρό τʼ ἐόντα,\n71 καὶ νήεσσʼ ἡγήσατʼ Ἀχαιῶν Ἴλιον εἴσω\n72 ἣν διὰ μαντοσύνην, τήν οἱ πόρε Φοῖβος Ἀπόλλων·\n73 ὅ σφιν ἐὺ φρονέων ἀγορήσατο καὶ μετέειπεν·\n74 ὦ Ἀχιλεῦ κέλεαί με Διῒ φίλε μυθήσασθαι\n75 μῆνιν Ἀπόλλωνος ἑκατηβελέταο ἄνακτος·\n76 τοὶ γὰρ ἐγὼν ἐρέω· σὺ δὲ σύνθεο καί μοι ὄμοσσον\n77 ἦ μέν μοι πρόφρων ἔπεσιν καὶ χερσὶν ἀρήξειν·\n78 ἦ γὰρ ὀΐομαι ἄνδρα χολωσέμεν, ὃς μέγα πάντων\n79 Ἀργείων κρατέει καί οἱ πείθονται Ἀχαιοί·\n80 κρείσσων γὰρ βασιλεὺς ὅτε χώσεται ἀνδρὶ χέρηϊ·\n81 εἴ περ γάρ τε χόλον γε καὶ αὐτῆμαρ καταπέψῃ,\n82 ἀλλά τε καὶ μετόπισθεν ἔχει κότον, ὄφρα τελέσσῃ,\n83 ἐν στήθεσσιν ἑοῖσι· σὺ δὲ φράσαι εἴ με σαώσεις.\n84 τὸν δʼ ἀπαμειβόμενος προσέφη πόδας ὠκὺς Ἀχιλλεύς·\n85 θαρσήσας μάλα εἰπὲ θεοπρόπιον ὅ τι οἶσθα·\n86 οὐ μὰ γὰρ Ἀπόλλωνα Διῒ φίλον, ᾧ τε σὺ Κάλχαν\n87 εὐχόμενος Δαναοῖσι θεοπροπίας ἀναφαίνεις,\n88 οὔ τις ἐμεῦ ζῶντος καὶ ἐπὶ χθονὶ δερκομένοιο\n89 σοὶ κοίλῃς παρὰ νηυσί βαρείας χεῖρας ἐποίσει\n90 συμπάντων Δαναῶν, οὐδʼ ἢν Ἀγαμέμνονα εἴπῃς,\n91 ὃς νῦν πολλὸν ἄριστος Ἀχαιῶν εὔχεται 41 σύμπαντας· τότε δʼ οὔ τι δυνήσεαι ἀχνύμενός περ\n242 χραισμεῖν, εὖτʼ ἂν πολλοὶ ὑφʼ Ἕκτορος ἀνδροφόνοιο\n243 θνήσκοντες πίπτωσι· σὺ δʼ ἔνδοθι θυμὸν ἀμύξεις\n244 χωόμενος ὅ τʼ ἄριστον Ἀχαιῶν οὐδὲν ἔτισας.\n245 ὣς φάτο Πηλεΐδης, ποτὶ δὲ σκῆπτρον βάλε γαίῃ\n246 χρυσείοις ἥλοισι πεπαρμένον, ἕζετο δʼ αὐτός·\n247 Ἀτρεΐδης δʼ ἑτέρωθεν ἐμήνιε· τοῖσι δὲ Νέστωρ\n248 ἡδυεπὴς ἀνόρουσε λιγὺς Πυλίων ἀγορητής,\n249 τοῦ καὶ ἀπὸ γλώσσης μέλιτος γλυκίων ῥέεν αὐδή·\n250 τῷ δʼ ἤδη δύο μὲν γενεαὶ μερόπων ἀνθρώπων"

        text: "251 ἐφθίαθʼ, οἵ οἱ πρόσθεν ἅμα τράφεν ἠδʼ ἐγένοντο\n252 ἐν Πύλῳ ἠγαθέῃ, μετὰ δὲ τριτάτοισιν ἄνασσεν·\n253 ὅ σφιν ἐὺ φρονέων ἀγορήσατο καὶ μετέειπεν·\n254 ὦ πόποι ἦ μέγα πένθος Ἀχαιΐδα γαῖαν ἱκάνει·\n255 ἦ κεν γηθήσαι Πρίαμος Πριάμοιό τε παῖδες\n256 ἄλλοι τε Τρῶες μέγα κεν κεχαροίατο θυμῷ\n257 εἰ σφῶϊν τάδε πάντα πυθοίατο μαρναμένοιϊν,\n258 οἳ περὶ μὲν βουλὴν Δαναῶν, περὶ δʼ ἐστὲ μάχεσθαι.\n259 ἀλλὰ πίθεσθʼ· ἄμφω δὲ νεωτέρω ἐστὸν ἐμεῖο·\n260 ἤδη γάρ ποτʼ ἐγὼ καὶ ἀρείοσιν ἠέ περ ὑμῖν\n261 ἀνδράσιν ὡμίλησα, καὶ οὔ ποτέ μʼ οἵ γʼ ἀθέριζον.\n262 οὐ γάρ πω τοίους ἴδον ἀνέρας οὐδὲ ἴδωμαι,\n263 οἷον Πειρίθοόν τε Δρύαντά τε ποιμένα λαῶν\n264 Καινέα τʼ Ἐξάδιόν τε καὶ ἀντίθεον Πολύφημον\n265 Θησέα τʼ Αἰγεΐδην, ἐπιείκελον ἀθανάτοισιν·\n266 κάρτιστοι δὴ κεῖνοι ἐπιχθονίων τράφεν ἀνδρῶν·\n267 κάρτιστοι μὲν ἔσαν καὶ καρτίστοις ἐμάχοντο\n268 φηρσὶν ὀρεσκῴοισι καὶ ἐκπάγλως ἀπόλεσσαν.\n269 καὶ μὲν τοῖσιν ἐγὼ μεθομίλεον ἐκ Πύλου ἐλθὼν\n270 τηλόθεν ἐξ ἀπίης γαίης· καλέσαντο γὰρ αὐτοί·\n271 καὶ μαχόμην κατʼ ἔμʼ αὐτὸν ἐγώ· κείνοισι δʼ ἂν οὔ τις\n272 τῶν οἳ νῦν βροτοί εἰσιν ἐπιχθόνιοι μαχέοιτο·\n273 καὶ μέν μευ βουλέων ξύνιεν πείθοντό τε μύθῳ·\n274 ἀλλὰ πίθεσθε καὶ ὔμμες, ἐπεὶ πείθεσθαι ἄμεινον·\n275 μήτε σὺ τόνδʼ ἀγαθός περ ἐὼν ἀποαίρεο κούρην,\n276 ἀλλʼ ἔα ὥς οἱ πρῶτα δόσαν γέρας υἷες Ἀχαιῶν·\n277 μήτε σὺ Πηλείδη ἔθελʼ ἐριζέμεναι βασιλῆϊ\n278 ἀντιβίην, ἐπεὶ οὔ ποθʼ ὁμοίης ἔμμορε τιμῆς\n279 σκηπτοῦχος βασιλεύς, ᾧ τε Ζεὺς κῦδος ἔδωκεν.\n280 εἰ δὲ σὺ καρτερός ἐσσι θεὰ δέ σε γείνατο μήτηρ,\n281 ἀλλʼ ὅ γε φέρτερός ἐστιν ἐπεὶ πλεόνεσσιν ἀνάσσει.\n282 Ἀτρεΐδη σὺ δὲ παῦε τεὸν μένος· αὐτὰρ ἔγωγε\n283 λίσσομʼ Ἀχιλλῆϊ μεθέμεν χόλον, ὃς μέγα πᾶσιν\n284 ἕρκος Ἀχαιοῖσιν πέλεται πολέμοιο κακοῖο.\n285 τὸν δʼ ἀπαμειβόμενος προσέφη κρείων Ἀγαμέμνων·\n286 ναὶ δὴ ταῦτά γε πάντα γέρον κατὰ μοῖραν ἔειπες·\n287 ἀλλʼ ὅδʼ ἀνὴρ ἐθέλει περὶ πάντων ἔμμεναι ἄλλων,\n288 πάντων μὲν κρατέειν ἐθέλει, πάντεσσι δʼ ἀνάσσειν,\n289 πᾶσι δὲ σημαίνειν, ἅ τινʼ οὐ πείσεσθαι ὀΐω·\n290 εἰ δέ μιν αἰχμητὴν ἔθεσαν θεοὶ αἰὲν ἐόντες\n291 τοὔνεκά οἱ προθέουσιν ὀνείδεα μυθήσασθαι;\n292 τὸν δʼ ἄρʼ ὑποβλήδην ἠμείβετο δῖος Ἀχιλλεύς·\n293 ἦ γάρ κεν δειλός τε καὶ οὐτιδανὸς καλεοίμην\n294 εἰ δὴ σοὶ πᾶν ἔργον ὑπείξομαι ὅττί κεν εἴπῃς·\n295 ἄλλοισιν δὴ ταῦτʼ ἐπιτέλλεο, μὴ γὰρ ἔμοιγε\n296 σήμαινʼ· οὐ γὰρ ἔγωγʼ ἔτι σοὶ πείσεσθαι ὀΐω.\n297 ἄλλο δέ τοι ἐρέω, σὺ δʼ ἐνὶ φρεσὶ βάλλεο σῇσι·\n298 χερσὶ μὲν οὔ τοι ἔγωγε μαχήσομαι εἵνεκα κούρης\n299 οὔτε σοὶ οὔτέ τῳ ἄλλῳ, ἐπεί μʼ ἀφέλεσθέ γε δόντες·\n300 τῶν δʼ ἄλλων ἅ μοί ἐστι θοῇ παρὰ νηῒ μελαίνῃ"

        text: "301 τῶν οὐκ ἄν τι φέροις ἀνελὼν ἀέκοντος ἐμεῖο·\n302 εἰ δʼ ἄγε μὴν πείρησαι ἵνα γνώωσι καὶ οἵδε·\n303 αἶψά τοι αἷμα κελαινὸν ἐρωήσει περὶ δουρί.\n304 ὣς τώ γʼ ἀντιβίοισι μαχεσσαμένω ἐπέεσσιν\n305 ἀνστήτην, λῦσαν δʼ ἀγορὴν παρὰ νηυσὶν Ἀχαιῶν·\n306 Πηλεΐδης μὲν ἐπὶ κλισίας καὶ νῆας ἐΐσας\n307 ἤϊε σύν τε Μενοιτιάδῃ καὶ οἷς ἑτάροισιν·\n308 Ἀτρεΐδης δʼ ἄρα νῆα θοὴν ἅλα δὲ προέρυσσεν,\n309 ἐν δʼ ἐρέτας ἔκρινεν ἐείκοσιν, ἐς δʼ ἑκατόμβην\n310 βῆσε θεῷ, ἀνὰ δὲ Χρυσηΐδα καλλιπάρῃον\n311 εἷσεν ἄγων· ἐν δʼ ἀρχὸς ἔβη πολύμητις Ὀδυσσεύς.\n312 οἳ μὲν ἔπειτʼ ἀναβάντες ἐπέπλεον ὑγρὰ κέλευθα,\n313 λαοὺς δʼ Ἀτρεΐδης ἀπολυμαίνεσθαι ἄνωγεν·\n314 οἳ δʼ ἀπελυμαίνοντο καὶ εἰς ἅλα λύματα βάλλον,\n315 ἕρδον δʼ Ἀπόλλωνι τεληέσσας ἑκατόμβας\n316 ταύρων ἠδʼ αἰγῶν παρὰ θῖνʼ ἁλὸς ἀτρυγέτοιο·\n317 κνίση δʼ οὐρανὸν ἷκεν ἑλισσομένη περὶ καπνῷ.\n318 ὣς οἳ μὲν τὰ πένοντο κατὰ στρατόν· οὐδʼ Ἀγαμέμνων\n319 λῆγʼ ἔριδος τὴν πρῶτον ἐπηπείλησʼ Ἀχιλῆϊ,\n320 ἀλλʼ ὅ γε Ταλθύβιόν τε καὶ Εὐρυβάτην προσέειπε,\n321 τώ οἱ ἔσαν κήρυκε καὶ ὀτρηρὼ θεράποντε·\n322 ἔρχεσθον κλισίην Πηληϊάδεω Ἀχιλῆος·\n323 χειρὸς ἑλόντʼ ἀγέμεν Βρισηΐδα καλλιπάρῃον·\n324 εἰ δέ κε μὴ δώῃσιν ἐγὼ δέ κεν αὐτὸς ἕλωμαι\n325 ἐλθὼν σὺν πλεόνεσσι· τό οἱ καὶ ῥίγιον ἔσται.\n326 ὣς εἰπὼν προΐει, κρατερὸν δʼ ἐπὶ μῦθον ἔτελλε·\n327 τὼ δʼ ἀέκοντε βάτην παρὰ θῖνʼ ἁλὸς ἀτρυγέτοιο,\n328 Μυρμιδόνων δʼ ἐπί τε κλισίας καὶ νῆας ἱκέσθην,\n329 τὸν δʼ εὗρον παρά τε κλισίῃ καὶ νηῒ μελαίνῃ\n330 ἥμενον· οὐδʼ ἄρα τώ γε ἰδὼν γήθησεν Ἀχιλλεύς.\n331 τὼ μὲν ταρβήσαντε καὶ αἰδομένω βασιλῆα\n332 στήτην, οὐδέ τί μιν προσεφώνεον οὐδʼ ἐρέοντο·\n333 αὐτὰρ ὃ ἔγνω ᾗσιν ἐνὶ φρεσὶ φώνησέν τε·\n334 χαίρετε κήρυκες Διὸς ἄγγελοι ἠδὲ καὶ ἀνδρῶν,\n335 ἆσσον ἴτʼ· οὔ τί μοι ὔμμες ἐπαίτιοι ἀλλʼ Ἀγαμέμνων,\n336 ὃ σφῶϊ προΐει Βρισηΐδος εἵνεκα κούρης.\n337 ἀλλʼ ἄγε διογενὲς Πατρόκλεες ἔξαγε κούρην\n338 καί σφωϊν δὸς ἄγειν· τὼ δʼ αὐτὼ μάρτυροι ἔστων\n339 πρός τε θεῶν μακάρων πρός τε θνητῶν ἀνθρώπων\n340 καὶ πρὸς τοῦ βασιλῆος ἀπηνέος εἴ ποτε δʼ αὖτε\n341 χρειὼ ἐμεῖο γένηται ἀεικέα λοιγὸν ἀμῦναι\n342 τοῖς ἄλλοις· ἦ γὰρ ὅ γʼ ὀλοιῇσι φρεσὶ θύει,\n343 οὐδέ τι οἶδε νοῆσαι ἅμα πρόσσω καὶ ὀπίσσω,\n344 ὅππως οἱ παρὰ νηυσὶ σόοι μαχέοιντο Ἀχαιοί.\n345 ὣς φάτο, Πάτροκλος δὲ φίλῳ ἐπεπείθεθʼ ἑταίρῳ,\n346 ἐκ δʼ ἄγαγε κλισίης Βρισηΐδα καλλιπάρῃον,\n347 δῶκε δʼ ἄγειν· τὼ δʼ αὖτις ἴτην παρὰ νῆας Ἀχαιῶν·\n348 ἣ δʼ ἀέκουσʼ ἅμα τοῖσι γυνὴ κίεν· αὐτὰρ Ἀχιλλεὺς\n349 δακρύσας ἑτάρων ἄφαρ ἕζετο νόσφι λιασθείς,\n350 θῖνʼ ἔφʼ ἁλὸς πολιῆς, ὁρόων ἐπʼ ἀπείρονα πόντον·"

        text: "351 πολλὰ δὲ μητρὶ φίλῃ ἠρήσατο χεῖρας ὀρεγνύς·\n352 μῆτερ ἐπεί μʼ ἔτεκές γε μινυνθάδιόν περ ἐόντα,\n353 τιμήν πέρ μοι ὄφελλεν Ὀλύμπιος ἐγγυαλίξαι\n354 Ζεὺς ὑψιβρεμέτης· νῦν δʼ οὐδέ με τυτθὸν ἔτισεν·\n355 ἦ γάρ μʼ Ἀτρεΐδης εὐρὺ κρείων Ἀγαμέμνων\n356 ἠτίμησεν· ἑλὼν γὰρ ἔχει γέρας αὐτὸς ἀπούρας.\n357 ὣς φάτο δάκρυ χέων, τοῦ δʼ ἔκλυε πότνια μήτηρ\n358 ἡμένη ἐν βένθεσσιν ἁλὸς παρὰ πατρὶ γέροντι·\n359 καρπαλίμως δʼ ἀνέδυ πολιῆς ἁλὸς ἠΰτʼ ὀμίχλη,\n360 καί ῥα πάροιθʼ αὐτοῖο καθέζετο δάκρυ χέοντος,\n361 χειρί τέ μιν κατέρεξεν ἔπος τʼ ἔφατʼ ἔκ τʼ ὀνόμαζε·\n362 τέκνον τί κλαίεις; τί δέ σε φρένας ἵκετο πένθος;\n363 ἐξαύδα, μὴ κεῦθε νόῳ, ἵνα εἴδομεν ἄμφω.\n364 τὴν δὲ βαρὺ στενάχων προσέφη πόδας ὠκὺς Ἀχιλλεύς·\n365 οἶσθα· τί ἤ τοι ταῦτα ἰδυίῃ πάντʼ ἀγορεύω;\n366 ᾠχόμεθʼ ἐς Θήβην ἱερὴν πόλιν Ἠετίωνος,\n367 τὴν δὲ διεπράθομέν τε καὶ ἤγομεν ἐνθάδε πάντα·\n368 καὶ τὰ μὲν εὖ δάσσαντο μετὰ σφίσιν υἷες Ἀχαιῶν,\n369 ἐκ δʼ ἕλον Ἀτρεΐδῃ Χρυσηΐδα καλλιπάρῃον.\n370 Χρύσης δʼ αὖθʼ ἱερεὺς ἑκατηβόλου Ἀπόλλωνος\n371 ἦλθε θοὰς ἐπὶ νῆας Ἀχαιῶν χαλκοχιτώνων\n372 λυσόμενός τε θύγατρα φέρων τʼ ἀπερείσιʼ ἄποινα,\n373 στέμματʼ ἔχων ἐν χερσὶν ἑκηβόλου Ἀπόλλωνος\n374 χρυσέῳ ἀνὰ σκήπτρῳ, καὶ λίσσετο πάντας Ἀχαιούς,\n375 Ἀτρεΐδα δὲ μάλιστα δύω κοσμήτορε λαῶν.\n376 ἔνθʼ ἄλλοι μὲν πάντες ἐπευφήμησαν Ἀχαιοὶ\n377 αἰδεῖσθαί θʼ ἱερῆα καὶ ἀγλαὰ δέχθαι ἄποινα·\n378 ἀλλʼ οὐκ Ἀτρεΐδῃ Ἀγαμέμνονι ἥνδανε θυμῷ,\n379 ἀλλὰ κακῶς ἀφίει, κρατερὸν δʼ ἐπὶ μῦθον ἔτελλε·\n380 χωόμενος δʼ ὁ γέρων πάλιν ᾤχετο· τοῖο δʼ Ἀπόλλων\n381 εὐξαμένου ἤκουσεν, ἐπεὶ μάλα οἱ φίλος ἦεν,\n382 ἧκε δʼ ἐπʼ Ἀργείοισι κακὸν βέλος· οἳ δέ νυ λαοὶ\n383 θνῇσκον ἐπασσύτεροι, τὰ δʼ ἐπῴχετο κῆλα θεοῖο\n384 πάντῃ ἀνὰ στρατὸν εὐρὺν Ἀχαιῶν· ἄμμι δὲ μάντις\n385 εὖ εἰδὼς ἀγόρευε θεοπροπίας ἑκάτοιο.\n386 αὐτίκʼ ἐγὼ πρῶτος κελόμην θεὸν ἱλάσκεσθαι·\n387 Ἀτρεΐωνα δʼ ἔπειτα χόλος λάβεν, αἶψα δʼ ἀναστὰς\n388 ἠπείλησεν μῦθον ὃ δὴ τετελεσμένος ἐστί·\n389 τὴν μὲν γὰρ σὺν νηῒ θοῇ ἑλίκωπες Ἀχαιοὶ\n390 ἐς Χρύσην πέμπουσιν, ἄγουσι δὲ δῶρα ἄνακτι·\n391 τὴν δὲ νέον κλισίηθεν ἔβαν κήρυκες ἄγοντες\n392 κούρην Βρισῆος τήν μοι δόσαν υἷες Ἀχαιῶν.\n393 ἀλλὰ σὺ εἰ δύνασαί γε περίσχεο παιδὸς ἑῆος·\n394 ἐλθοῦσʼ Οὔλυμπον δὲ Δία λίσαι, εἴ ποτε δή τι\n395 ἢ ἔπει ὤνησας κραδίην Διὸς ἠὲ καὶ ἔργῳ.\n396 πολλάκι γάρ σεο πατρὸς ἐνὶ μεγάροισιν ἄκουσα\n397 εὐχομένης ὅτʼ ἔφησθα κελαινεφέϊ Κρονίωνι\n398 οἴη ἐν ἀθανάτοισιν ἀεικέα λοιγὸν ἀμῦναι,\n399 ὁππότε μιν ξυνδῆσαι Ὀλύμπιοι ἤθελον ἄλλοι\n400 Ἥρη τʼ ἠδὲ Ποσειδάων καὶ Παλλὰς Ἀθήνη·"

        text: "401 ἀλλὰ σὺ τόν γʼ ἐλθοῦσα θεὰ ὑπελύσαο δεσμῶν,\n402 ὦχʼ ἑκατόγχειρον καλέσασʼ ἐς μακρὸν Ὄλυμπον,\n403 ὃν Βριάρεων καλέουσι θεοί, ἄνδρες δέ τε πάντες\n404 Αἰγαίωνʼ, ὃ γὰρ αὖτε βίην οὗ πατρὸς ἀμείνων·\n405 ὅς ῥα παρὰ Κρονίωνι καθέζετο κύδεϊ γαίων·\n406 τὸν καὶ ὑπέδεισαν μάκαρες θεοὶ οὐδʼ ἔτʼ ἔδησαν.\n407 τῶν νῦν μιν μνήσασα παρέζεο καὶ λαβὲ γούνων\n408 αἴ κέν πως ἐθέλῃσιν ἐπὶ Τρώεσσιν ἀρῆξαι,\n409 τοὺς δὲ κατὰ πρύμνας τε καὶ ἀμφʼ ἅλα ἔλσαι Ἀχαιοὺς\n410 κτεινομένους, ἵνα πάντες ἐπαύρωνται βασιλῆος,\n411 γνῷ δὲ καὶ Ἀτρεΐδης εὐρὺ κρείων Ἀγαμέμνων\n412 ἣν ἄτην ὅ τʼ ἄριστον Ἀχαιῶν οὐδὲν ἔτισεν.\n413 τὸν δʼ ἠμείβετʼ ἔπειτα Θέτις κατὰ δάκρυ χέουσα·\n414 ὤ μοι τέκνον ἐμόν, τί νύ σʼ ἔτρεφον αἰνὰ τεκοῦσα;\n415 αἴθʼ ὄφελες παρὰ νηυσὶν ἀδάκρυτος καὶ ἀπήμων\n416 ἧσθαι, ἐπεί νύ τοι αἶσα μίνυνθά περ οὔ τι μάλα δήν·\n417 νῦν δʼ ἅμα τʼ ὠκύμορος καὶ ὀϊζυρὸς περὶ πάντων\n418 ἔπλεο· τώ σε κακῇ αἴσῃ τέκον ἐν μεγάροισι.\n419 τοῦτο δέ τοι ἐρέουσα ἔπος Διὶ τερπικεραύνῳ\n420 εἶμʼ αὐτὴ πρὸς Ὄλυμπον ἀγάννιφον αἴ κε πίθηται.\n421 ἀλλὰ σὺ μὲν νῦν νηυσὶ παρήμενος ὠκυπόροισι\n422 μήνιʼ Ἀχαιοῖσιν, πολέμου δʼ ἀποπαύεο πάμπαν·\n423 Ζεὺς γὰρ ἐς Ὠκεανὸν μετʼ ἀμύμονας Αἰθιοπῆας\n424 χθιζὸς ἔβη κατὰ δαῖτα, θεοὶ δʼ ἅμα πάντες ἕποντο·\n425 δωδεκάτῃ δέ τοι αὖτις ἐλεύσεται Οὔλυμπον δέ,\n426 καὶ τότʼ ἔπειτά τοι εἶμι Διὸς ποτὶ χαλκοβατὲς δῶ,\n427 καί μιν γουνάσομαι καί μιν πείσεσθαι ὀΐω.\n428 ὣς ἄρα φωνήσασʼ ἀπεβήσετο, τὸν δὲ λίπʼ αὐτοῦ\n429 χωόμενον κατὰ θυμὸν ἐϋζώνοιο γυναικὸς\n430 τήν ῥα βίῃ ἀέκοντος ἀπηύρων· αὐτὰρ Ὀδυσσεὺς\n431 ἐς Χρύσην ἵκανεν ἄγων ἱερὴν ἑκατόμβην.\n432 οἳ δʼ ὅτε δὴ λιμένος πολυβενθέος ἐντὸς ἵκοντο\n433 ἱστία μὲν στείλαντο, θέσαν δʼ ἐν νηῒ μελαίνῃ,\n434 ἱστὸν δʼ ἱστοδόκῃ πέλασαν προτόνοισιν ὑφέντες\n435 καρπαλίμως, τὴν δʼ εἰς ὅρμον προέρεσσαν ἐρετμοῖς.\n436 ἐκ δʼ εὐνὰς ἔβαλον, κατὰ δὲ πρυμνήσιʼ ἔδησαν·\n437 ἐκ δὲ καὶ αὐτοὶ βαῖνον ἐπὶ ῥηγμῖνι θαλάσσης,\n438 ἐκ δʼ ἑκατόμβην βῆσαν ἑκηβόλῳ Ἀπόλλωνι·\n439 ἐκ δὲ Χρυσηῒς νηὸς βῆ ποντοπόροιο.\n440 τὴν μὲν ἔπειτʼ ἐπὶ βωμὸν ἄγων πολύμητις Ὀδυσσεὺς\n441 πατρὶ φίλῳ ἐν χερσὶ τίθει καί μιν προσέειπεν·\n442 ὦ Χρύση, πρό μʼ ἔπεμψεν ἄναξ ἀνδρῶν Ἀγαμέμνων\n443 παῖδά τε σοὶ ἀγέμεν, Φοίβῳ θʼ ἱερὴν ἑκατόμβην\n444 ῥέξαι ὑπὲρ Δαναῶν ὄφρʼ ἱλασόμεσθα ἄνακτα,\n445 ὃς νῦν Ἀργείοισι πολύστονα κήδεʼ ἐφῆκεν.\n446 ὣς εἰπὼν ἐν χερσὶ τίθει, ὃ δὲ δέξατο χαίρων\n447 παῖδα φίλην· τοὶ δʼ ὦκα θεῷ ἱερὴν ἑκατόμβην\n448 ἑξείης ἔστησαν ἐΰδμητον περὶ βωμόν,\n449 χερνίψαντο δʼ ἔπειτα καὶ οὐλοχύτας ἀνέλοντο.\n450 τοῖσιν δὲ Χρύσης μεγάλʼ εὔχετο χεῖρας ἀνασχών·"

        text: "451 κλῦθί μευ ἀργυρότοξʼ, ὃς Χρύσην ἀμφιβέβηκας\n452 Κίλλαν τε ζαθέην Τενέδοιό τε ἶφι ἀνάσσεις·\n453 ἦ μὲν δή ποτʼ ἐμεῦ πάρος ἔκλυες εὐξαμένοιο,\n454 τίμησας μὲν ἐμέ, μέγα δʼ ἴψαο λαὸν Ἀχαιῶν·\n455 ἠδʼ ἔτι καὶ νῦν μοι τόδʼ ἐπικρήηνον ἐέλδωρ·\n456 ἤδη νῦν Δαναοῖσιν ἀεικέα λοιγὸν ἄμυνον.\n457 ὣς ἔφατʼ εὐχόμενος, τοῦ δʼ ἔκλυε Φοῖβος Ἀπόλλων.\n458 αὐτὰρ ἐπεί ῥʼ εὔξαντο καὶ οὐλοχύτας προβάλοντο,\n459 αὐέρυσαν μὲν πρῶτα καὶ ἔσφαξαν καὶ ἔδειραν,\n460 μηρούς τʼ ἐξέταμον κατά τε κνίσῃ ἐκάλυψαν\n461 δίπτυχα ποιήσαντες, ἐπʼ αὐτῶν δʼ ὠμοθέτησαν·\n462 καῖε δʼ ἐπὶ σχίζῃς ὁ γέρων, ἐπὶ δʼ αἴθοπα οἶνον\n463 λεῖβε· νέοι δὲ παρʼ αὐτὸν ἔχον πεμπώβολα χερσίν.\n464 αὐτὰρ ἐπεὶ κατὰ μῆρε κάη καὶ σπλάγχνα πάσαντο,\n465 μίστυλλόν τʼ ἄρα τἆλλα καὶ ἀμφʼ ὀβελοῖσιν ἔπειραν,\n466 ὤπτησάν τε περιφραδέως, ἐρύσαντό τε πάντα.\n467 αὐτὰρ ἐπεὶ παύσαντο πόνου τετύκοντό τε δαῖτα\n468 δαίνυντʼ, οὐδέ τι θυμὸς ἐδεύετο δαιτὸς ἐΐσης.\n469 αὐτὰρ ἐπεὶ πόσιος καὶ ἐδητύος ἐξ ἔρον ἕντο,\n470 κοῦροι μὲν κρητῆρας ἐπεστέψαντο ποτοῖο,\n471 νώμησαν δʼ ἄρα πᾶσιν ἐπαρξάμενοι δεπάεσσιν·\n472 οἳ δὲ πανημέριοι μολπῇ θεὸν ἱλάσκοντο\n473 καλὸν ἀείδοντες παιήονα κοῦροι Ἀχαιῶν\n474 μέλποντες ἑκάεργον· ὃ δὲ φρένα τέρπετʼ ἀκούων.\n475 ἦμος δʼ ἠέλιος κατέδυ καὶ ἐπὶ κνέφας ἦλθε,\n476 δὴ τότε κοιμήσαντο παρὰ πρυμνήσια νηός·\n477 ἦμος δʼ ἠριγένεια φάνη ῥοδοδάκτυλος Ἠώς,\n478 καὶ τότʼ ἔπειτʼ ἀνάγοντο μετὰ στρατὸν εὐρὺν Ἀχαιῶν·\n479 τοῖσιν δʼ ἴκμενον οὖρον ἵει ἑκάεργος Ἀπόλλων·\n480 οἳ δʼ ἱστὸν στήσαντʼ ἀνά θʼ ἱστία λευκὰ πέτασσαν,\n481 ἐν δʼ ἄνεμος πρῆσεν μέσον ἱστίον, ἀμφὶ δὲ κῦμα\n482 στείρῃ πορφύρεον μεγάλʼ ἴαχε νηὸς ἰούσης·\n483 ἣ δʼ ἔθεεν κατὰ κῦμα διαπρήσσουσα κέλευθον.\n484 αὐτὰρ ἐπεί ῥʼ ἵκοντο κατὰ στρατὸν εὐρὺν Ἀχαιῶν,\n485 νῆα μὲν οἵ γε μέλαιναν ἐπʼ ἠπείροιο ἔρυσσαν\n486 ὑψοῦ ἐπὶ ψαμάθοις, ὑπὸ δʼ ἕρματα μακρὰ τάνυσσαν·\n487 αὐτοὶ δʼ ἐσκίδναντο κατὰ κλισίας τε νέας τε.\n488 αὐτὰρ ὃ μήνιε νηυσὶ παρήμενος ὠκυπόροισι\n489 διογενὴς Πηλῆος υἱὸς πόδας ὠκὺς Ἀχιλλεύς·\n490 οὔτέ ποτʼ εἰς ἀγορὴν πωλέσκετο κυδιάνειραν\n491 οὔτέ ποτʼ ἐς πόλεμον, ἀλλὰ φθινύθεσκε φίλον κῆρ\n492 αὖθι μένων, ποθέεσκε δʼ ἀϋτήν τε πτόλεμόν τε.\n493 ἀλλʼ ὅτε δή ῥʼ ἐκ τοῖο δυωδεκάτη γένετʼ ἠώς,\n494 καὶ τότε δὴ πρὸς Ὄλυμπον ἴσαν θεοὶ αἰὲν ἐόντες\n495 πάντες ἅμα, Ζεὺς δʼ ἦρχε· Θέτις δʼ οὐ λήθετʼ ἐφετμέων\n496 παιδὸς ἑοῦ, ἀλλʼ ἥ γʼ ἀνεδύσετο κῦμα θαλάσσης.\n497 ἠερίη δʼ ἀνέβη μέγαν οὐρανὸν Οὔλυμπόν τε.\n498 εὗρεν δʼ εὐρύοπα Κρονίδην ἄτερ ἥμενον ἄλλων\n499 ἀκροτάτῃ κορυφῇ πολυδειράδος Οὐλύμποιο·\n500 καί ῥα πάροιθʼ αὐτοῖο καθέζετο, καὶ λάβε γούνων"

        text: "501 σκαιῇ, δεξιτερῇ δʼ ἄρʼ ὑπʼ ἀνθερεῶνος ἑλοῦσα\n502 λισσομένη προσέειπε Δία Κρονίωνα ἄνακτα·\n503 Ζεῦ πάτερ εἴ ποτε δή σε μετʼ ἀθανάτοισιν ὄνησα\n504 ἢ ἔπει ἢ ἔργῳ, τόδε μοι κρήηνον ἐέλδωρ·\n505 τίμησόν μοι υἱὸν ὃς ὠκυμορώτατος ἄλλων\n506 ἔπλετʼ· ἀτάρ μιν νῦν γε ἄναξ ἀνδρῶν Ἀγαμέμνων\n507 ἠτίμησεν· ἑλὼν γὰρ ἔχει γέρας αὐτὸς ἀπούρας.\n508 ἀλλὰ σύ πέρ μιν τῖσον Ὀλύμπιε μητίετα Ζεῦ·\n509 τόφρα δʼ ἐπὶ Τρώεσσι τίθει κράτος ὄφρʼ ἂν Ἀχαιοὶ\n510 υἱὸν ἐμὸν τίσωσιν ὀφέλλωσίν τέ ἑ τιμῇ.\n511 ὣς φάτο· τὴν δʼ οὔ τι προσέφη νεφεληγερέτα Ζεύς,\n512 ἀλλʼ ἀκέων δὴν ἧστο· Θέτις δʼ ὡς ἥψατο γούνων\n513 ὣς ἔχετʼ ἐμπεφυυῖα, καὶ εἴρετο δεύτερον αὖτις·\n514 νημερτὲς μὲν δή μοι ὑπόσχεο καὶ κατάνευσον\n515 ἢ ἀπόειπʼ, ἐπεὶ οὔ τοι ἔπι δέος, ὄφρʼ ἐῢ εἰδέω\n516 ὅσσον ἐγὼ μετὰ πᾶσιν ἀτιμοτάτη θεός εἰμι.\n517 τὴν δὲ μέγʼ ὀχθήσας προσέφη νεφεληγερέτα Ζεύς·\n518 ἦ δὴ λοίγια ἔργʼ ὅ τέ μʼ ἐχθοδοπῆσαι ἐφήσεις\n519 Ἥρῃ ὅτʼ ἄν μʼ ἐρέθῃσιν ὀνειδείοις ἐπέεσσιν·\n520 ἣ δὲ καὶ αὔτως μʼ αἰεὶ ἐν ἀθανάτοισι θεοῖσι\n521 νεικεῖ, καί τέ μέ φησι μάχῃ Τρώεσσιν ἀρήγειν.\n522 ἀλλὰ σὺ μὲν νῦν αὖτις ἀπόστιχε μή τι νοήσῃ\n523 Ἥρη· ἐμοὶ δέ κε ταῦτα μελήσεται ὄφρα τελέσσω·\n524 εἰ δʼ ἄγε τοι κεφαλῇ κατανεύσομαι ὄφρα πεποίθῃς·\n525 τοῦτο γὰρ ἐξ ἐμέθεν γε μετʼ ἀθανάτοισι μέγιστον\n526 τέκμωρ· οὐ γὰρ ἐμὸν παλινάγρετον οὐδʼ ἀπατηλὸν\n527 οὐδʼ ἀτελεύτητον ὅ τί κεν κεφαλῇ κατανεύσω.\n528 ἦ καὶ κυανέῃσιν ἐπʼ ὀφρύσι νεῦσε Κρονίων·\n529 ἀμβρόσιαι δʼ ἄρα χαῖται ἐπερρώσαντο ἄνακτος\n530 κρατὸς ἀπʼ ἀθανάτοιο· μέγαν δʼ ἐλέλιξεν Ὄλυμπον.\n531 τώ γʼ ὣς βουλεύσαντε διέτμαγεν· ἣ μὲν ἔπειτα\n532 εἰς ἅλα ἆλτο βαθεῖαν ἀπʼ αἰγλήεντος Ὀλύμπου,\n533 Ζεὺς δὲ ἑὸν πρὸς δῶμα· θεοὶ δʼ ἅμα πάντες ἀνέσταν\n534 ἐξ ἑδέων σφοῦ πατρὸς ἐναντίον· οὐδέ τις ἔτλη\n535 μεῖναι ἐπερχόμενον, ἀλλʼ ἀντίοι ἔσταν ἅπαντες.\n536 ὣς ὃ μὲν ἔνθα καθέζετʼ ἐπὶ θρόνου· οὐδέ μιν Ἥρη\n537 ἠγνοίησεν ἰδοῦσʼ ὅτι οἱ συμφράσσατο βουλὰς\n538 ἀργυρόπεζα Θέτις θυγάτηρ ἁλίοιο γέροντος.\n539 αὐτίκα κερτομίοισι Δία Κρονίωνα προσηύδα·\n540 τίς δʼ αὖ τοι δολομῆτα θεῶν συμφράσσατο βουλάς;\n541 αἰεί τοι φίλον ἐστὶν ἐμεῦ ἀπὸ νόσφιν ἐόντα\n542 κρυπτάδια φρονέοντα δικαζέμεν· οὐδέ τί πώ μοι\n543 πρόφρων τέτληκας εἰπεῖν ἔπος ὅττι νοήσῃς.\n544 τὴν δʼ ἠμείβετʼ ἔπειτα πατὴρ ἀνδρῶν τε θεῶν τε·\n545 Ἥρη μὴ δὴ πάντας ἐμοὺς ἐπιέλπεο μύθους\n546 εἰδήσειν· χαλεποί τοι ἔσοντʼ ἀλόχῳ περ ἐούσῃ·\n547 ἀλλʼ ὃν μέν κʼ ἐπιεικὲς ἀκουέμεν οὔ τις ἔπειτα\n548 οὔτε θεῶν πρότερος τὸν εἴσεται οὔτʼ ἀνθρώπων·\n549 ὃν δέ κʼ ἐγὼν ἀπάνευθε θεῶν ἐθέλωμι νοῆσαι\n550 μή τι σὺ ταῦτα ἕκαστα διείρεο μηδὲ μετάλλα."

        text: "551 τὸν δʼ ἠμείβετʼ ἔπειτα βοῶπις πότνια Ἥρη·\n552 αἰνότατε Κρονίδη ποῖον τὸν μῦθον ἔειπες;\n553 καὶ λίην σε πάρος γʼ οὔτʼ εἴρομαι οὔτε μεταλλῶ,\n554 ἀλλὰ μάλʼ εὔκηλος τὰ φράζεαι ἅσσʼ ἐθέλῃσθα.\n555 νῦν δʼ αἰνῶς δείδοικα κατὰ φρένα μή σε παρείπῃ\n556 ἀργυρόπεζα Θέτις θυγάτηρ ἁλίοιο γέροντος·\n557 ἠερίη γὰρ σοί γε παρέζετο καὶ λάβε γούνων·\n558 τῇ σʼ ὀΐω κατανεῦσαι ἐτήτυμον ὡς Ἀχιλῆα\n559 τιμήσῃς, ὀλέσῃς δὲ πολέας ἐπὶ νηυσὶν Ἀχαιῶν.\n560 τὴν δʼ ἀπαμειβόμενος προσέφη νεφεληγερέτα Ζεύς·\n561 δαιμονίη αἰεὶ μὲν ὀΐεαι οὐδέ σε λήθω·\n562 πρῆξαι δʼ ἔμπης οὔ τι δυνήσεαι, ἀλλʼ ἀπὸ θυμοῦ\n563 μᾶλλον ἐμοὶ ἔσεαι· τὸ δέ τοι καὶ ῥίγιον ἔσται.\n564 εἰ δʼ οὕτω τοῦτʼ ἐστὶν ἐμοὶ μέλλει φίλον εἶναι·\n565 ἀλλʼ ἀκέουσα κάθησο, ἐμῷ δʼ ἐπιπείθεο μύθῳ,\n566 μή νύ τοι οὐ χραίσμωσιν ὅσοι θεοί εἰσʼ ἐν Ὀλύμπῳ\n567 ἆσσον ἰόνθʼ, ὅτε κέν τοι ἀάπτους χεῖρας ἐφείω.\n568 ὣς ἔφατʼ ἔδεισεν δὲ βοῶπις πότνια Ἥρη,\n569 καί ῥʼ ἀκέουσα καθῆστο ἐπιγνάμψασα φίλον κῆρ·\n570 ὄχθησαν δʼ ἀνὰ δῶμα Διὸς θεοὶ Οὐρανίωνες·\n571 τοῖσιν δʼ Ἥφαιστος κλυτοτέχνης ἦρχʼ ἀγορεύειν\n572 μητρὶ φίλῃ ἐπίηρα φέρων λευκωλένῳ Ἥρῃ·\n573 ἦ δὴ λοίγια ἔργα τάδʼ ἔσσεται οὐδʼ ἔτʼ ἀνεκτά,\n574 εἰ δὴ σφὼ ἕνεκα θνητῶν ἐριδαίνετον ὧδε,\n575 ἐν δὲ θεοῖσι κολῳὸν ἐλαύνετον· οὐδέ τι δαιτὸς\n576 ἐσθλῆς ἔσσεται ἦδος, ἐπεὶ τὰ χερείονα νικᾷ.\n577 μητρὶ δʼ ἐγὼ παράφημι καὶ αὐτῇ περ νοεούσῃ\n578 πατρὶ φίλῳ ἐπίηρα φέρειν Διί, ὄφρα μὴ αὖτε\n579 νεικείῃσι πατήρ, σὺν δʼ ἡμῖν δαῖτα ταράξῃ.\n580 εἴ περ γάρ κʼ ἐθέλῃσιν Ὀλύμπιος ἀστεροπητὴς\n581 ἐξ ἑδέων στυφελίξαι· ὃ γὰρ πολὺ φέρτατός ἐστιν.\n582 ἀλλὰ σὺ τὸν ἐπέεσσι καθάπτεσθαι μαλακοῖσιν·\n583 αὐτίκʼ ἔπειθʼ ἵλαος Ὀλύμπιος ἔσσεται ἡμῖν.\n584 ὣς ἄρʼ ἔφη καὶ ἀναΐξας δέπας ἀμφικύπελλον\n585 μητρὶ φίλῃ ἐν χειρὶ τίθει καί μιν προσέειπε·\n586 τέτλαθι μῆτερ ἐμή, καὶ ἀνάσχεο κηδομένη περ,\n587 μή σε φίλην περ ἐοῦσαν ἐν ὀφθαλμοῖσιν ἴδωμαι\n588 θεινομένην, τότε δʼ οὔ τι δυνήσομαι ἀχνύμενός περ\n589 χραισμεῖν· ἀργαλέος γὰρ Ὀλύμπιος ἀντιφέρεσθαι·\n590 ἤδη γάρ με καὶ ἄλλοτʼ ἀλεξέμεναι μεμαῶτα\n591 ῥῖψε ποδὸς τεταγὼν ἀπὸ βηλοῦ θεσπεσίοιο,\n592 πᾶν δʼ ἦμαρ φερόμην, ἅμα δʼ ἠελίῳ καταδύντι\n593 κάππεσον ἐν Λήμνῳ, ὀλίγος δʼ ἔτι θυμὸς ἐνῆεν·\n594 ἔνθά με Σίντιες ἄνδρες ἄφαρ κομίσαντο πεσόντα.\n595 ὣς φάτο, μείδησεν δὲ θεὰ λευκώλενος Ἥρη,\n596 μειδήσασα δὲ παιδὸς ἐδέξατο χειρὶ κύπελλον·\n597 αὐτὰρ ὃ τοῖς ἄλλοισι θεοῖς ἐνδέξια πᾶσιν\n598 οἰνοχόει γλυκὺ νέκταρ ἀπὸ κρητῆρος ἀφύσσων·\n599 ἄσβεστος δʼ ἄρʼ ἐνῶρτο γέλως μακάρεσσι θεοῖσιν\n600 ὡς ἴδον Ἥφαιστον διὰ δώματα ποιπνύοντα."

        label: "1장 §1",
        text: "Δαρείου καὶ Παρυσάτιδος γίγνονται παῖδες δύο, πρεσβύτερος μὲν Ἀρταξέρξης, νεώτερος δὲ Κῦρος· ἐπεὶ δὲ ἠσθένει Δαρεῖος καὶ ὑπώπτευε τελευτὴν τοῦ βίου, ἐβούλετο τὼ παῖδε ἀμφοτέρω παρεῖναι.\n \n \n ὁ μὲν οὖν πρεσβύτερος παρὼν ἐτύγχανε· Κῦρον δὲ μεταπέμπεται ἀπὸ τῆς ἀρχῆς ἧς αὐτὸν σατράπην ἐποίησε, καὶ στρατηγὸν δὲ αὐτὸν ἀπέδειξε πάντων ὅσοι ἐς Καστωλοῦ πεδίον ἁθροίζονται. ἀναβαίνει οὖν ὁ Κῦρος λαβὼν Τισσαφέρνην ὡς φίλον, καὶ τῶν Ἑλλήνων ἔχων ὁπλίτας ἀνέβη τριακοσίους, ἄρχοντα δὲ αὐτῶν Ξενίαν Παρράσιον.\n \n \n ἐπεὶ δὲ ἐτελεύτησε Δαρεῖος καὶ κατέστη εἰς τὴν βασιλείαν Ἀρταξέρξης, Τισσαφέρνης διαβάλλει τὸν Κῦρον πρὸς τὸν ἀδελφὸν ὡς ἐπιβουλεύοι αὐτῷ. ὁ δὲ πείθεται καὶ συλλαμβάνει Κῦρον ὡς ἀποκτενῶν· ἡ δὲ μήτηρ ἐξαιτησαμένη αὐτὸν ἀποπέμπει πάλιν ἐπὶ τὴν ἀρχήν.\n \n \n ὁ δʼ ὡς ἀπῆλθε κινδυνεύσας καὶ ἀτιμασθείς, βουλεύεται ὅπως μήποτε ἔτι ἔσται ἐπὶ τῷ ἀδελφῷ, ἀλλά, ἢν δύνηται, βασιλεύσει ἀντʼ ἐκείνου. Παρύσατις μὲν δὴ ἡ μήτηρ ὑπῆρχε τῷ Κύρῳ, φιλοῦσα αὐτὸν μᾶλλον ἢ τὸν βασιλεύοντα Ἀρταξέρξην.\n \n \n ὅστις δʼ ἀφικνεῖτο τῶν παρὰ βασιλέως πρὸς αὐτὸν πάντας οὕτω διατιθεὶς ἀπεπέμπετο ὥστε αὐτῷ μᾶλλον φίλους εἶναι ἢ βασιλεῖ. καὶ τῶν παρʼ ἑαυτῷ δὲ βαρβάρων ἐπεμελεῖτο ὡς πολεμεῖν τε ἱκανοὶ εἴησαν καὶ εὐνοϊκῶς ἔχοιεν αὐτῷ.\n \n \n τὴν δὲ Ἑλληνικὴν δύναμιν ἥθροιζεν ὡς μάλιστα ἐδύνατο ἐπικρυπτόμενος, ὅπως ὅτι ἀπαρασκευότατον λάβοι βασιλέα. ὧδε οὖν ἐποιεῖτο τὴν συλλογήν. ὁπόσας εἶχε φυλακὰς ἐν ταῖς πόλεσι παρήγγειλε τοῖς φρουράρχοις ἑκάστοις λαμβάνειν ἄνδρας Πελοποννησίους ὅτι πλείστους καὶ βελτίστους, ὡς ἐπιβουλεύοντος Τισσαφέρνους ταῖς πόλεσι. καὶ γὰρ ἦσαν αἱ Ἰωνικαὶ πόλεις Τισσαφέρνους τὸ ἀρχαῖον ἐκ βασιλέως δεδομέναι, τότε δὲ ἀφειστήκεσαν πρὸς Κῦρον πᾶσαι πλὴν Μιλήτου·\n \n \n ἐν Μιλήτῳ δὲ Τισσαφέρνης προαισθόμενος τὰ αὐτὰ ταῦτα βουλευομένους ἀποστῆναι πρὸς Κῦρον, τοὺς μὲν αὐτῶν ἀπέκτεινε τοὺς δʼ ἐξέβαλεν. ὁ δὲ Κῦρος ὑπολαβὼν τοὺς φεύγοντας συλλέξας στράτευμα ἐπολιόρκει Μίλητον καὶ κατὰ γῆν καὶ κατὰ θάλατταν καὶ ἐπειρᾶτο κατάγειν τοὺς ἐκπεπτωκότας. καὶ αὕτη αὖ ἄλλη πρόφασις ἦν αὐτῷ τοῦ ἁθροίζειν στράτευμα.\n \n \n πρὸς δὲ βασιλέα πέμπων ἠξίου ἀδελφὸς ὢν αὐτοῦ δοθῆναι οἷ ταύτας τὰς πόλεις μᾶλλον ἢ Τισσαφέρνην ἄρχειν αὐτῶν, καὶ ἡ μήτηρ συνέπραττεν αὐτῷ ταῦτα· ὥστε βασιλεὺς τὴν μὲν πρὸς ἑαυτὸν ἐπιβουλὴν οὐκ ᾐσθάνετο, Τισσαφέρνει δʼ ἐνόμιζε πολεμοῦντα αὐτὸν ἀμφὶ τὰ στρατεύματα δαπανᾶν· ὥστε οὐδὲν ἤχθετο αὐτῶν πολεμούντων. καὶ γὰρ ὁ Κῦρος ἀπέπεμπε τοὺς γιγνομένους δασμοὺς βασιλεῖ ἐκ τῶν πόλεων ὧν Τισσαφέρνους ἐτύγχανεν ἔχων.\n \n \n ἄλλο δὲ στράτευμα αὐτῷ συνελέγετο ἐν Χερρονήσῳ τῇ κατʼ ἀντιπέρας Ἀβύδου τόνδε τὸν τρόπον. Κλέαρχος Λακεδαιμόνιος φυγὰς ἦν· τούτῳ συγγενόμενος ὁ Κῦρος ἠγάσθη τε αὐτὸν καὶ δίδωσιν αὐτῷ μυρίους δαρεικούς. ὁ δὲ λαβὼν τὸ χρυσίον στράτευμα συνέλεξεν ἀπὸ τούτων τῶν χρημάτων καὶ ἐπολέμει ἐκ Χερρονήσου ὁρμώμενος τοῖς Θρᾳξὶ τοῖς ὑπὲρ Ἑλλήσποντον οἰκοῦσι καὶ ὠφέλει τοὺς Ἕλληνας· ὥστε καὶ χρήματα συνεβάλλοντο αὐτῷ εἰς τὴν τροφὴν τῶν στρατιωτῶν αἱ Ἑλλησποντιακαὶ πόλεις ἑκοῦσαι. τοῦτο δʼ αὖ οὕτω τρεφόμενον ἐλάνθανεν αὐτῷ τὸ στράτευμα.\n \n \n Ἀρίστιππος δὲ ὁ Θετταλὸς ξένος ὢν ἐτύγχανεν αὐτῷ, καὶ πιεζόμενος ὑπὸ τῶν οἴκοι ἀντιστασιωτῶν ἔρχεται πρὸς τὸν Κῦρον καὶ αἰτεῖ αὐτὸν εἰς δισχιλίους ξένους καὶ τριῶν μηνῶν μισθόν, ὡς οὕτως περιγενόμενος ἂν τῶν ἀντιστασιωτῶν. ὁ δὲ Κῦρος δίδωσιν αὐτῷ εἰς τετρακισχιλίους καὶ ἓξ μηνῶν μισθόν, καὶ δεῖται αὐτοῦ μὴ πρόσθεν καταλῦσαι πρὸς τοὺς ἀντιστασιώτας πρὶν ἂν αὐτῷ συμβουλεύσηται. οὕτω δὲ αὖ τὸ ἐν Θετταλίᾳ ἐλάνθανεν αὐτῷ τρεφόμενον στράτευμα.\n \n \n Πρόξενον δὲ τὸν Βοιώτιον ξένον ὄντα ἐκέλευσε λαβόντα ἄνδρας ὅτι πλείστους παραγενέσθαι, ὡς ἐς Πισίδας βουλόμενος στρατεύεσθαι, ὡς πράγματα παρεχόντων τῶν Πισιδῶν τῇ ἑαυτοῦ χώρᾳ. Σοφαίνετον δὲ τὸν Στυμφάλιον καὶ Σωκράτην τὸν Ἀχαιόν, ξένους ὄντας καὶ τούτους, ἐκέλευσεν ἄνδρας λαβόντας ἐλθεῖν ὅτι πλείστους, ὡς πολεμήσων Τισσαφέρνει σὺν τοῖς φυγάσι τοῖς Μιλησίων. καὶ ἐποίουν οὕτως οὗτοι."
      },

        n: "1.2",
        label: "1장 §2",
        text: "ἐπεὶ δʼ ἐδόκει ἤδη πορεύεσθαι αὐτῷ ἄνω, τὴν μὲν πρόφασιν ἐποιεῖτο ὡς Πισίδας βουλόμενος ἐκβαλεῖν παντάπασιν ἐκ τῆς χώρας· καὶ ἁθροίζει ὡς ἐπὶ τούτους τό τε βαρβαρικὸν καὶ τὸ Ἑλληνικόν. ἐνταῦθα καὶ παραγγέλλει τῷ τε Κλεάρχῳ λαβόντι ἥκειν ὅσον ἦν αὐτῷ στράτευμα καὶ τῷ Ἀριστίππῳ συναλλαγέντι πρὸς τοὺς οἴκοι ἀποπέμψαι πρὸς ἑαυτὸν ὃ εἶχε στράτευμα· καὶ Ξενίᾳ τῷ Ἀρκάδι, ὃς αὐτῷ προειστήκει τοῦ ἐν ταῖς πόλεσι ξενικοῦ, ἥκειν παραγγέλλει λαβόντα τοὺς ἄλλους πλὴν ὁπόσοι ἱκανοὶ ἦσαν τὰς ἀκροπόλεις φυλάττειν.\n \n \n ἐκάλεσε δὲ καὶ τοὺς Μίλητον πολιορκοῦντας, καὶ τοὺς φυγάδας ἐκέλευσε σὺν αὐτῷ στρατεύεσθαι, ὑποσχόμενος αὐτοῖς, εἰ καλῶς καταπράξειεν ἐφʼ ἃ ἐστρατεύετο, μὴ πρόσθεν παύσεσθαι πρὶν αὐτοὺς καταγάγοι οἴκαδε. οἱ δὲ ἡδέως ἐπείθοντο· ἐπίστευον γὰρ αὐτῷ· καὶ λαβόντες τὰ ὅπλα παρῆσαν εἰς Σάρδεις.\n \n \n Ξενίας μὲν δὴ τοὺς ἐκ τῶν πόλεων λαβὼν παρεγένετο εἰς Σάρδεις ὁπλίτας εἰς τετρακισχιλίους, Πρόξενος δὲ παρῆν ἔχων ὁπλίτας μὲν εἰς πεντακοσίους καὶ χιλίους, γυμνῆτας δὲ πεντακοσίους, Σοφαίνετος δὲ ὁ Στυμφάλιος ὁπλίτας ἔχων χιλίους, Σωκράτης δὲ ὁ Ἀχαιὸς ὁπλίτας ἔχων ὡς πεντακοσίους, Πασίων δὲ ὁ Μεγαρεὺς τριακοσίους μὲν ὁπλίτας, τριακοσίους δὲ πελταστὰς ἔχων παρεγένετο· ἦν δὲ καὶ οὗτος καὶ ὁ Σωκράτης τῶν ἀμφὶ Μίλητον στρατευομένων.\n \n \n οὗτοι μὲν εἰς Σάρδεις αὐτῷ ἀφίκοντο. Τισσαφέρνης δὲ κατανοήσας ταῦτα, καὶ μείζονα ἡγησάμενος εἶναι ἢ ὡς ἐπὶ Πισίδας τὴν παρασκευήν, πορεύεται ὡς βασιλέα ᾗ ἐδύνατο τάχιστα ἱππέας ἔχων ὡς πεντακοσίους.\n \n \n καὶ βασιλεὺς μὲν δὴ ἐπεὶ ἤκουσε Τισσαφέρνους τὸν Κύρου στόλον, ἀντιπαρεσκευάζετο.\nΚῦρος δὲ ἔχων οὓς εἴρηκα ὡρμᾶτο ἀπὸ Σάρδεων· καὶ ἐξελαύνει διὰ τῆς Λυδίας σταθμοὺς τρεῖς παρασάγγας εἴκοσι καὶ δύο ἐπὶ τὸν Μαίανδρον ποταμόν. τούτου τὸ εὖρος δύο πλέθρα· γέφυρα δὲ ἐπῆν ἐζευγμένη πλοίοις.\n \n \n τοῦτον διαβὰς ἐξελαύνει διὰ Φρυγίας σταθμὸν ἕνα παρασάγγας ὀκτὼ εἰς Κολοσσάς, πόλιν οἰκουμένην καὶ εὐδαίμονα καὶ μεγάλην. ἐνταῦθα ἔμεινεν ἡμέρας ἑπτά· καὶ ἧκε Μένων ὁ Θετταλὸς ὁπλίτας ἔχων χιλίους καὶ πελταστὰς πεντακοσίους, Δόλοπας καὶ Αἰνιᾶνας καὶ Ὀλυνθίους.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς τρεῖς παρασάγγας εἴκοσιν εἰς Κελαινάς, τῆς Φρυγίας πόλιν οἰκουμένην, μεγάλην καὶ εὐδαίμονα. ἐνταῦθα Κύρῳ βασίλεια ἦν καὶ παράδεισος μέγας ἀγρίων θηρίων πλήρης, ἃ ἐκεῖνος ἐθήρευεν ἀπὸ ἵππου, ὁπότε γυμνάσαι βούλοιτο ἑαυτόν τε καὶ τοὺς ἵππους. διὰ μέσου δὲ τοῦ παραδείσου ῥεῖ ὁ Μαίανδρος ποταμός· αἱ δὲ πηγαὶ αὐτοῦ εἰσιν ἐκ τῶν βασιλείων· ῥεῖ δὲ καὶ διὰ τῆς Κελαινῶν πόλεως.\n \n \n ἔστι δὲ καὶ μεγάλου βασιλέως βασίλεια ἐν Κελαιναῖς ἐρυμνὰ ἐπὶ ταῖς πηγαῖς τοῦ Μαρσύου ποταμοῦ ὑπὸ τῇ ἀκροπόλει· ῥεῖ δὲ καὶ οὗτος διὰ τῆς πόλεως καὶ ἐμβάλλει εἰς τὸν Μαίανδρον· τοῦ δὲ Μαρσύου τὸ εὖρός ἐστιν εἴκοσι καὶ πέντε ποδῶν. ἐνταῦθα λέγεται Ἀπόλλων ἐκδεῖραι Μαρσύαν νικήσας ἐρίζοντά οἱ περὶ σοφίας, καὶ τὸ δέρμα κρεμάσαι ἐν τῷ ἄντρῳ ὅθεν αἱ πηγαί· διὰ δὲ τοῦτο ὁ ποταμὸς καλεῖται Μαρσύας.\n \n \n ἐνταῦθα Ξέρξης, ὅτε ἐκ τῆς Ἑλλάδος ἡττηθεὶς τῇ μάχῃ ἀπεχώρει, λέγεται οἰκοδομῆσαι ταῦτά τε τὰ βασίλεια καὶ τὴν Κελαινῶν ἀκρόπολιν. ἐνταῦθα ἔμεινε Κῦρος ἡμέρας τριάκοντα· καὶ ἧκε Κλέαρχος ὁ Λακεδαιμόνιος φυγὰς ἔχων ὁπλίτας χιλίους καὶ πελταστὰς Θρᾷκας ὀκτακοσίους καὶ τοξότας Κρῆτας διακοσίους. ἅμα δὲ καὶ Σῶσις παρῆν ὁ Συρακόσιος ἔχων ὁπλίτας τριακοσίους, καὶ Σοφαίνετος Ἀρκάδας ἔχων ὁπλίτας χιλίους. καὶ ἐνταῦθα Κῦρος ἐξέτασιν καὶ ἀριθμὸν τῶν Ἑλλήνων ἐποίησεν ἐν τῷ παραδείσῳ, καὶ ἐγένοντο οἱ σύμπαντες ὁπλῖται μὲν μύριοι χίλιοι, πελτασταὶ δὲ ἀμφὶ τοὺς δισχιλίους.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς δύο παρασάγγας δέκα εἰς Πέλτας, πόλιν οἰκουμένην. ἐνταῦθʼ ἔμεινεν ἡμέρας τρεῖς· ἐν αἷς Ξενίας ὁ Ἀρκὰς τὰ Λύκαια ἔθυσε καὶ ἀγῶνα ἔθηκε· τὰ δὲ ἆθλα ἦσαν στλεγγίδες χρυσαῖ· ἐθεώρει δὲ τὸν ἀγῶνα καὶ Κῦρος.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς δύο παρασάγγας δώδεκα ἐς Κεράμων ἀγοράν, πόλιν οἰκουμένην, ἐσχάτην πρὸς τῇ Μυσίᾳ χώρᾳ. ἐντεῦθεν ἐξελαύνει σταθμοὺς τρεῖς παρασάγγας τριάκοντα εἰς Καΰστρου πεδίον, πόλιν οἰκουμένην. ἐνταῦθʼ ἔμεινεν ἡμέρας πέντε· καὶ τοῖς στρατιώταις ὠφείλετο μισθὸς πλέον ἢ τριῶν μηνῶν, καὶ πολλάκις ἰόντες ἐπὶ τὰς θύρας ἀπῄτουν. ὁ δὲ ἐλπίδας λέγων διῆγε καὶ δῆλος ἦν ἀνιώμενος· οὐ γὰρ ἦν πρὸς τοῦ Κύρου τρόπου ἔχοντα μὴ ἀποδιδόναι.\n \n \n ἐνταῦθα ἀφικνεῖται Ἐπύαξα ἡ Συεννέσιος γυνὴ τοῦ Κιλίκων βασιλέως παρὰ Κῦρον· καὶ ἐλέγετο Κύρῳ δοῦναι χρήματα πολλά. τῇ δʼ οὖν στρατιᾷ τότε ἀπέδωκε Κῦρος μισθὸν τεττάρων μηνῶν. εἶχε δὲ ἡ Κίλισσα φυλακὴν περὶ αὑτὴν Κίλικας καὶ Ἀσπενδίους· ἐλέγετο δὲ καὶ συγγενέσθαι Κῦρον τῇ Κιλίσσῃ.\n \n \n ἐντεῦθεν δὲ ἐλαύνει σταθμοὺς δύο παρασάγγας δέκα εἰς Θύμβριον, πόλιν οἰκουμένην. ἐνταῦθα ἦν παρὰ τὴν ὁδὸν κρήνη ἡ Μίδου καλουμένη τοῦ Φρυγῶν βασιλέως, ἐφʼ ᾗ λέγεται Μίδας τὸν Σάτυρον θηρεῦσαι οἴνῳ κεράσας αὐτήν.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς δύο παρασάγγας δέκα εἰς Τυριάειον, πόλιν οἰκουμένην. ἐνταῦθα ἔμεινεν ἡμέρας τρεῖς. καὶ λέγεται δεηθῆναι ἡ Κίλισσα Κύρου ἐπιδεῖξαι τὸ στράτευμα αὐτῇ· βουλόμενος οὖν ἐπιδεῖξαι ἐξέτασιν ποιεῖται ἐν τῷ πεδίῳ τῶν Ἑλλήνων καὶ τῶν βαρβάρων.\n \n \n ἐκέλευσε δὲ τοὺς Ἕλληνας ὡς νόμος αὐτοῖς εἰς μάχην οὕτω ταχθῆναι καὶ στῆναι, συντάξαι δʼ ἕκαστον τοὺς ἑαυτοῦ. ἐτάχθησαν οὖν ἐπὶ τεττάρων· εἶχε δὲ τὸ μὲν δεξιὸν Μένων καὶ οἱ σὺν αὐτῷ, τὸ δὲ εὐώνυμον Κλέαρχος καὶ οἱ ἐκείνου, τὸ δὲ μέσον οἱ ἄλλοι στρατηγοί.\n \n \n ἐθεώρει οὖν ὁ Κῦρος πρῶτον μὲν τοὺς βαρβάρους· οἱ δὲ παρήλαυνον τεταγμένοι κατὰ ἴλας καὶ κατὰ τάξεις· εἶτα δὲ τοὺς Ἕλληνας, παρελαύνων ἐφʼ ἅρματος καὶ ἡ Κίλισσα ἐφʼ ἁρμαμάξης. εἶχον δὲ πάντες κράνη χαλκᾶ καὶ χιτῶνας φοινικοῦς καὶ κνημῖδας καὶ τὰς ἀσπίδας ἐκκεκαλυμμένας.\n \n \n ἐπειδὴ δὲ πάντας παρήλασε, στήσας τὸ ἅρμα πρὸ τῆς φάλαγγος μέσης, πέμψας Πίγρητα τὸν ἑρμηνέα παρὰ τοὺς στρατηγοὺς τῶν Ἑλλήνων ἐκέλευσε προβαλέσθαι τὰ ὅπλα καὶ ἐπιχωρῆσαι ὅλην τὴν φάλαγγα. οἱ δὲ ταῦτα προεῖπον τοῖς στρατιώταις· καὶ ἐπεὶ ἐσάλπιγξε, προβαλόμενοι τὰ ὅπλα ἐπῇσαν. ἐκ δὲ τούτου θᾶττον προϊόντων σὺν κραυγῇ ἀπὸ τοῦ αὐτομάτου δρόμος ἐγένετο τοῖς στρατιώταις ἐπὶ τὰς σκηνάς,\n \n \n τῶν δὲ βαρβάρων φόβος πολύς, καὶ ἥ τε Κίλισσα ἔφυγεν ἐπὶ τῆς ἁρμαμάξης καὶ οἱ ἐκ τῆς ἀγορᾶς καταλιπόντες τὰ ὤνια ἔφυγον. οἱ δὲ Ἕλληνες σὺν γέλωτι ἐπὶ τὰς σκηνὰς ἦλθον. ἡ δὲ Κίλισσα ἰδοῦσα τὴν λαμπρότητα καὶ τὴν τάξιν τοῦ στρατεύματος ἐθαύμασε. Κῦρος δὲ ἥσθη τὸν ἐκ τῶν Ἑλλήνων εἰς τοὺς βαρβάρους φόβον ἰδών.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς τρεῖς παρασάγγας εἴκοσιν εἰς Ἰκόνιον, τῆς Φρυγίας πόλιν ἐσχάτην. ἐνταῦθα ἔμεινε τρεῖς ἡμέρας. ἐντεῦθεν ἐξελαύνει διὰ τῆς Λυκαονίας σταθμοὺς πέντε παρασάγγας τριάκοντα. ταύτην τὴν χώραν ἐπέτρεψε διαρπάσαι τοῖς Ἕλλησιν ὡς πολεμίαν οὖσαν.\n \n \n ἐντεῦθεν Κῦρος τὴν Κίλισσαν εἰς τὴν Κιλικίαν ἀποπέμπει τὴν ταχίστην ὁδόν· καὶ συνέπεμψεν αὐτῇ στρατιώτας οὓς Μένων εἶχε καὶ αὐτόν. Κῦρος δὲ μετὰ τῶν ἄλλων ἐξελαύνει διὰ Καππαδοκίας σταθμοὺς τέτταρας παρασάγγας εἴκοσι καὶ πέντε πρὸς Δάναν, πόλιν οἰκουμένην, μεγάλην καὶ εὐδαίμονα. ἐνταῦθα ἔμειναν ἡμέρας τρεῖς· ἐν ᾧ Κῦρος ἀπέκτεινεν ἄνδρα Πέρσην Μεγαφέρνην, φοινικιστὴν βασίλειον, καὶ ἕτερόν τινα τῶν ὑπάρχων δυνάστην, αἰτιασάμενος ἐπιβουλεύειν αὐτῷ.\n \n \n ἐντεῦθεν ἐπειρῶντο εἰσβάλλειν εἰς τὴν Κιλικίαν· ἡ δὲ εἰσβολὴ ἦν ὁδὸς ἁμαξιτὸς ὀρθία ἰσχυρῶς καὶ ἀμήχανος εἰσελθεῖν στρατεύματι, εἴ τις ἐκώλυεν. ἐλέγετο δὲ καὶ Συέννεσις εἶναι ἐπὶ τῶν ἄκρων φυλάττων τὴν εἰσβολήν· διὸ ἔμεινεν ἡμέραν ἐν τῷ πεδίῳ. τῇ δʼ ὑστεραίᾳ ἧκεν ἄγγελος λέγων ὅτι λελοιπὼς εἴη Συέννεσις τὰ ἄκρα, ἐπεὶ ᾔσθετο ὅτι τὸ Μένωνος στράτευμα ἤδη ἐν Κιλικίᾳ ἦν εἴσω τῶν ὀρέων, καὶ ὅτι τριήρεις ἤκουε περιπλεούσας ἀπʼ Ἰωνίας εἰς Κιλικίαν Ταμὼν ἔχοντα τὰς Λακεδαιμονίων καὶ αὐτοῦ Κύρου.\n \n \n Κῦρος δʼ οὖν ἀνέβη ἐπὶ τὰ ὄρη οὐδενὸς κωλύοντος, καὶ εἶδε τὰς σκηνὰς οὗ οἱ Κίλικες ἐφύλαττον. ἐντεῦθεν δὲ κατέβαινεν εἰς πεδίον μέγα καὶ καλόν, ἐπίρρυτον, καὶ δένδρων παντοδαπῶν σύμπλεων καὶ ἀμπέλων· πολὺ δὲ καὶ σήσαμον καὶ μελίνην καὶ κέγχρον καὶ πυροὺς καὶ κριθὰς φέρει. ὄρος δʼ αὐτὸ περιεῖχεν ὀχυρὸν καὶ ὑψηλὸν πάντῃ ἐκ θαλάττης εἰς θάλατταν.\n \n \n καταβὰς δὲ διὰ τούτου τοῦ πεδίου ἤλασε σταθμοὺς τέτταρας παρασάγγας πέντε καὶ εἴκοσιν εἰς Ταρσούς, τῆς Κιλικίας πόλιν μεγάλην καὶ εὐδαίμονα, οὗ ἦν τὰ Συεννέσιος βασίλεια τοῦ Κιλίκων βασιλέως· διὰ μέσου δὲ τῆς πόλεως ῥεῖ ποταμὸς Κύδνος ὄνομα, εὖρος δύο πλέθρων.\n \n \n ταύτην τὴν πόλιν ἐξέλιπον οἱ ἐνοικοῦντες μετὰ Συεννέσιος εἰς χωρίον ὀχυρὸν ἐπὶ τὰ ὄρη πλὴν οἱ τὰ καπηλεῖα ἔχοντες· ἔμειναν δὲ καὶ οἱ παρὰ τὴν θάλατταν οἰκοῦντες ἐν Σόλοις καὶ ἐν Ἰσσοῖς.\n \n \n Ἐπύαξα δὲ ἡ Συεννέσιος γυνὴ προτέρα Κύρου πέντε ἡμέραις εἰς Ταρσοὺς ἀφίκετο· ἐν δὲ τῇ ὑπερβολῇ τῶν ὀρέων τῇ εἰς τὸ πεδίον δύο λόχοι τοῦ Μένωνος στρατεύματος ἀπώλοντο· οἱ μὲν ἔφασαν ἁρπάζοντάς τι κατακοπῆναι ὑπὸ τῶν Κιλίκων, οἱ δὲ ὑπολειφθέντας καὶ οὐ δυναμένους εὑρεῖν τὸ ἄλλο στράτευμα οὐδὲ τὰς ὁδοὺς εἶτα πλανωμένους ἀπολέσθαι· ἦσαν δʼ οὖν οὗτοι ἑκατὸν ὁπλῖται.\n \n \n οἱ δʼ ἄλλοι ἐπεὶ ἧκον, τήν τε πόλιν τοὺς Ταρσοὺς διήρπασαν, διὰ τὸν ὄλεθρον τῶν συστρατιωτῶν ὀργιζόμενοι, καὶ τὰ βασίλεια τὰ ἐν αὐτῇ. Κῦρος δʼ ἐπεὶ εἰσήλασεν εἰς τὴν πόλιν, μετεπέμπετο τὸν Συέννεσιν πρὸς ἑαυτόν· ὁ δʼ οὔτε πρότερον οὐδενί πω κρείττονι ἑαυτοῦ εἰς χεῖρας ἐλθεῖν ἔφη οὔτε τότε Κύρῳ ἰέναι ἤθελε, πρὶν ἡ γυνὴ αὐτὸν ἔπεισε καὶ πίστεις ἔλαβε.\n \n \n μετὰ δὲ ταῦτα ἐπεὶ συνεγένοντο ἀλλήλοις, Συέννεσις μὲν ἔδωκε Κύρῳ χρήματα πολλὰ εἰς τὴν στρατιάν, Κῦρος δὲ ἐκείνῳ δῶρα ἃ νομίζεται παρὰ βασιλεῖ τίμια, ἵππον χρυσοχάλινον καὶ στρεπτὸν χρυσοῦν καὶ ψέλια καὶ ἀκινάκην χρυσοῦν καὶ στολὴν Περσικήν, καὶ τὴν χώραν μηκέτι διαρπάζεσθαι· τὰ δὲ ἡρπασμένα ἀνδράποδα, ἤν που ἐντυγχάνωσιν, ἀπολαμβάνειν."

        label: "1장 §3",
        text: "ἐνταῦθα ἔμεινεν ὁ Κῦρος καὶ ἡ στρατιὰ ἡμέρας εἴκοσιν· οἱ γὰρ στρατιῶται οὐκ ἔφασαν ἰέναι τοῦ πρόσω· ὑπώπτευον γὰρ ἤδη ἐπὶ βασιλέα ἰέναι· μισθωθῆναι δὲ οὐκ ἐπὶ τούτῳ ἔφασαν. πρῶτος δὲ Κλέαρχος τοὺς αὑτοῦ στρατιώτας ἐβιάζετο ἰέναι· οἱ δʼ αὐτόν τε ἔβαλλον καὶ τὰ ὑποζύγια τὰ ἐκείνου, ἐπεὶ ἄρξαιντο προϊέναι.\n \n \n Κλέαρχος δὲ τότε μὲν μικρὸν ἐξέφυγε μὴ καταπετρωθῆναι, ὕστερον δʼ ἐπεὶ ἔγνω ὅτι οὐ δυνήσεται βιάσασθαι, συνήγαγεν ἐκκλησίαν τῶν αὑτοῦ στρατιωτῶν. καὶ πρῶτον μὲν ἐδάκρυε πολὺν χρόνον ἑστώς· οἱ δὲ ὁρῶντες ἐθαύμαζον καὶ ἐσιώπων· εἶτα δὲ ἔλεξε τοιάδε.\n \n \n ἄνδρες στρατιῶται, μὴ θαυμάζετε ὅτι χαλεπῶς φέρω τοῖς παροῦσι πράγμασιν. ἐμοὶ γὰρ ξένος Κῦρος ἐγένετο καί με φεύγοντα ἐκ τῆς πατρίδος τά τε ἄλλα ἐτίμησε καὶ μυρίους ἔδωκε δαρεικούς· οὓς ἐγὼ λαβὼν οὐκ εἰς τὸ ἴδιον κατεθέμην ἐμοὶ οὐδὲ καθηδυπάθησα, ἀλλʼ εἰς ὑμᾶς ἐδαπάνων.\n \n \n καὶ πρῶτον μὲν πρὸς τοὺς Θρᾷκας ἐπολέμησα, καὶ ὑπὲρ τῆς Ἑλλάδος ἐτιμωρούμην μεθʼ ὑμῶν, ἐκ τῆς Χερρονήσου αὐτοὺς ἐξελαύνων βουλομένους ἀφαιρεῖσθαι τοὺς ἐνοικοῦντας Ἕλληνας τὴν γῆν. ἐπειδὴ δὲ Κῦρος ἐκάλει, λαβὼν ὑμᾶς ἐπορευόμην, ἵνα εἴ τι δέοιτο ὠφελοίην αὐτὸν ἀνθʼ ὧν εὖ ἔπαθον ὑπʼ ἐκείνου.\n \n \n ἐπεὶ δὲ ὑμεῖς οὐ βούλεσθε συμπορεύεσθαι, ἀνάγκη δή μοι ἢ ὑμᾶς προδόντα τῇ Κύρου φιλίᾳ χρῆσθαι ἢ πρὸς ἐκεῖνον ψευσάμενον μεθʼ ὑμῶν εἶναι. εἰ μὲν δὴ δίκαια ποιήσω οὐκ οἶδα, αἱρήσομαι δʼ οὖν ὑμᾶς καὶ σὺν ὑμῖν ὅ τι ἂν δέῃ πείσομαι. καὶ οὔποτε ἐρεῖ οὐδεὶς ὡς ἐγὼ Ἕλληνας ἀγαγὼν εἰς τοὺς βαρβάρους, προδοὺς τοὺς Ἕλληνας τὴν τῶν βαρβάρων φιλίαν εἱλόμην,\n \n \n ἀλλʼ ἐπεὶ ὑμεῖς ἐμοὶ οὐ θέλετε πείθεσθαι, ἐγὼ σὺν ὑμῖν ἕψομαι καὶ ὅ τι ἂν δέῃ πείσομαι. νομίζω γὰρ ὑμᾶς ἐμοὶ εἶναι καὶ πατρίδα καὶ φίλους καὶ συμμάχους, καὶ σὺν ὑμῖν μὲν ἂν οἶμαι εἶναι τίμιος ὅπου ἂν ὦ, ὑμῶν δὲ ἔρημος ὢν οὐκ ἂν ἱκανὸς οἶμαι εἶναι οὔτʼ ἂν φίλον ὠφελῆσαι οὔτʼ ἂν ἐχθρὸν ἀλέξασθαι. ὡς ἐμοῦ οὖν ἰόντος ὅπῃ ἂν καὶ ὑμεῖς οὕτω τὴν γνώμην ἔχετε.\n \n \n ταῦτα εἶπεν· οἱ δὲ στρατιῶται οἵ τε αὐτοῦ ἐκείνου καὶ οἱ ἄλλοι ταῦτα ἀκούσαντες ὅτι οὐ φαίη παρὰ βασιλέα πορεύεσθαι ἐπῄνεσαν· παρὰ δὲ Ξενίου καὶ Πασίωνος πλείους ἢ δισχίλιοι λαβόντες τὰ ὅπλα καὶ τὰ σκευοφόρα ἐστρατοπεδεύσαντο παρὰ Κλεάρχῳ.\n \n \n Κῦρος δὲ τούτοις ἀπορῶν τε καὶ λυπούμενος μετεπέμπετο τὸν Κλέαρχον· ὁ δὲ ἰέναι μὲν οὐκ ἤθελε, λάθρᾳ δὲ τῶν στρατιωτῶν πέμπων αὐτῷ ἄγγελον ἔλεγε θαρρεῖν ὡς καταστησομένων τούτων εἰς τὸ δέον. μεταπέμπεσθαι δʼ ἐκέλευεν αὐτόν· αὐτὸς δʼ οὐκ ἔφη ἰέναι.\n \n \n μετὰ δὲ ταῦτα συναγαγὼν τούς θʼ ἑαυτοῦ στρατιώτας καὶ τοὺς προσελθόντας αὐτῷ καὶ τῶν ἄλλων τὸν βουλόμενον, ἔλεξε τοιάδε. ἄνδρες στρατιῶται, τὰ μὲν δὴ Κύρου δῆλον ὅτι οὕτως ἔχει πρὸς ἡμᾶς ὥσπερ τὰ ἡμέτερα πρὸς ἐκεῖνον· οὔτε γὰρ ἡμεῖς ἐκείνου ἔτι στρατιῶται, ἐπεί γε οὐ συνεπόμεθα αὐτῷ, οὔτε ἐκεῖνος ἔτι ἡμῖν μισθοδότης.\n \n \n ὅτι μέντοι ἀδικεῖσθαι νομίζει ὑφʼ ἡμῶν οἶδα· ὥστε καὶ μεταπεμπομένου αὐτοῦ οὐκ ἐθέλω ἐλθεῖν, τὸ μὲν μέγιστον αἰσχυνόμενος ὅτι σύνοιδα ἐμαυτῷ πάντα ἐψευσμένος αὐτόν, ἔπειτα καὶ δεδιὼς μὴ λαβών με δίκην ἐπιθῇ ὧν νομίζει ὑπʼ ἐμοῦ ἠδικῆσθαι.\n \n \n ἐμοὶ οὖν δοκεῖ οὐχ ὥρα εἶναι ἡμῖν καθεύδειν οὐδʼ ἀμελεῖν ἡμῶν αὐτῶν, ἀλλὰ βουλεύεσθαι ὅ τι χρὴ ποιεῖν ἐκ τούτων. καὶ ἕως γε μένομεν αὐτοῦ σκεπτέον μοι δοκεῖ εἶναι ὅπως ἀσφαλέστατα μενοῦμεν, εἴ τε ἤδη δοκεῖ ἀπιέναι, ὅπως ἀσφαλέστατα ἄπιμεν, καὶ ὅπως τὰ ἐπιτήδεια ἕξομεν· ἄνευ γὰρ τούτων οὔτε στρατηγοῦ οὔτε ἰδιώτου ὄφελος οὐδέν.\n \n \n ὁ δʼ ἀνὴρ πολλοῦ μὲν ἄξιος ᾧ ἂν φίλος ᾖ, χαλεπώτατος δʼ ἐχθρὸς ᾧ ἂν πολέμιος ᾖ, ἔχει δὲ δύναμιν καὶ πεζὴν καὶ ἱππικὴν καὶ ναυτικὴν ἣν πάντες ὁμοίως ὁρῶμέν τε καὶ ἐπιστάμεθα· καὶ γὰρ οὐδὲ πόρρω δοκοῦμέν μοι αὐτοῦ καθῆσθαι. ὥστε ὥρα λέγειν ὅ τι τις γιγνώσκει ἄριστον εἶναι. ταῦτα εἰπὼν ἐπαύσατο.\n \n \n ἐκ δὲ τούτου ἀνίσταντο οἱ μὲν ἐκ τοῦ αὐτομάτου, λέξοντες ἃ ἐγίγνωσκον, οἱ δὲ καὶ ὑπʼ ἐκείνου ἐγκέλευστοι, ἐπιδεικνύντες οἵα εἴη ἡ ἀπορία ἄνευ τῆς Κύρου γνώμης καὶ μένειν καὶ ἀπιέναι.\n \n \n εἷς δὲ δὴ εἶπε προσποιούμενος σπεύδειν ὡς τάχιστα πορεύεσθαι εἰς τὴν Ἑλλάδα στρατηγοὺς μὲν ἑλέσθαι ἄλλους ὡς τάχιστα, εἰ μὴ βούλεται Κλέαρχος ἀπάγειν· τὰ δʼ ἐπιτήδειʼ ἀγοράζεσθαι (ἡ δʼ ἀγορὰ ἦν ἐν τῷ βαρβαρικῷ στρατεύματι) καὶ συσκευάζεσθαι· ἐλθόντας δὲ Κῦρον αἰτεῖν πλοῖα, ὡς ἀποπλέοιεν· ἐὰν δὲ μὴ διδῷ ταῦτα, ἡγεμόνα αἰτεῖν Κῦρον ὅστις διὰ φιλίας τῆς χώρας ἀπάξει. ἐὰν δὲ μηδὲ ἡγεμόνα διδῷ, συντάττεσθαι τὴν ταχίστην, πέμψαι δὲ καὶ προκαταληψομένους τὰ ἄκρα, ὅπως μὴ φθάσωσι μήτε Κῦρος μήτε οἱ Κίλικες καταλαβόντες, ὧν πολλοὺς καὶ πολλὰ χρήματα ἔχομεν ἀνηρπακότες. οὗτος μὲν τοιαῦτα εἶπε· μετὰ δὲ τοῦτον Κλέαρχος εἶπε τοσοῦτον.\n \n \n ὡς μὲν στρατηγήσοντα ἐμὲ ταύτην τὴν στρατηγίαν μηδεὶς ὑμῶν λεγέτω· πολλὰ γὰρ ἐνορῶ διʼ ἃ ἐμοὶ τοῦτο οὐ ποιητέον· ὡς δὲ τῷ ἀνδρὶ ὃν ἂν ἕλησθε πείσομαι ᾗ δυνατὸν μάλιστα, ἵνα εἰδῆτε ὅτι καὶ ἄρχεσθαι ἐπίσταμαι ὥς τις καὶ ἄλλος μάλιστα ἀνθρώπων.\n \n \n μετὰ τοῦτον ἄλλος ἀνέστη, ἐπιδεικνὺς μὲν τὴν εὐήθειαν τοῦ τὰ πλοῖα αἰτεῖν κελεύοντος, ὥσπερ πάλιν τὸν στόλον Κύρου ποιουμένου, ἐπιδεικνὺς δὲ ὡς εὔηθες εἴη ἡγεμόνα αἰτεῖν παρὰ τούτου ᾧ λυμαινόμεθα τὴν πρᾶξιν. εἰ δὲ καὶ τῷ ἡγεμόνι πιστεύσομεν ὃν ἂν Κῦρος διδῷ, τί κωλύει καὶ τὰ ἄκρα ἡμῖν κελεύειν Κῦρον προκαταλαβεῖν;\n \n \n ἐγὼ γὰρ ὀκνοίην μὲν ἂν εἰς τὰ πλοῖα ἐμβαίνειν ἃ ἡμῖν δοίη, μὴ ἡμᾶς ταῖς τριήρεσι καταδύσῃ, φοβοίμην δʼ ἂν τῷ ἡγεμόνι ὃν δοίη ἕπεσθαι, μὴ ἡμᾶς ἀγάγῃ ὅθεν οὐκ ἔσται ἐξελθεῖν· βουλοίμην δʼ ἂν ἄκοντος ἀπιὼν Κύρου λαθεῖν αὐτὸν ἀπελθών· ὃ οὐ δυνατόν ἐστιν.\n \n \n ἀλλʼ ἐγώ φημι ταῦτα μὲν φλυαρίας εἶναι· δοκεῖ δέ μοι ἄνδρας ἐλθόντας πρὸς Κῦρον οἵτινες ἐπιτήδειοι σὺν Κλεάρχῳ ἐρωτᾶν ἐκεῖνον τί βούλεται ἡμῖν χρῆσθαι· καὶ ἐὰν μὲν ἡ πρᾶξις ᾖ παραπλησία οἵᾳπερ καὶ πρόσθεν ἐχρῆτο τοῖς ξένοις, ἕπεσθαι καὶ ἡμᾶς καὶ μὴ κακίους εἶναι τῶν πρόσθεν τούτῳ συναναβάντων·\n \n \n ἐὰν δὲ μείζων ἡ πρᾶξις τῆς πρόσθεν φαίνηται καὶ ἐπιπονωτέρα καὶ ἐπικινδυνοτέρα, ἀξιοῦν ἢ πείσαντα ἡμᾶς ἄγειν ἢ πεισθέντα πρὸς φιλίαν ἀφιέναι· οὕτω γὰρ καὶ ἑπόμενοι ἂν φίλοι αὐτῷ καὶ πρόθυμοι ἑποίμεθα καὶ ἀπιόντες ἀσφαλῶς ἂν ἀπίοιμεν· ὅ τι δʼ ἂν πρὸς ταῦτα λέγῃ ἀπαγγεῖλαι δεῦρο· ἡμᾶς δʼ ἀκούσαντας πρὸς ταῦτα βουλεύεσθαι.\n \n \n ἔδοξε ταῦτα, καὶ ἄνδρας ἑλόμενοι σὺν Κλεάρχῳ πέμπουσιν οἳ ἠρώτων Κῦρον τὰ δόξαντα τῇ στρατιᾷ. ὁ δʼ ἀπεκρίνατο ὅτι ἀκούει Ἀβροκόμαν ἐχθρὸν ἄνδρα ἐπὶ τῷ Εὐφράτῃ ποταμῷ εἶναι, ἀπέχοντα δώδεκα σταθμούς· πρὸς τοῦτον οὖν ἔφη βούλεσθαι ἐλθεῖν· κἂν μὲν ᾖ ἐκεῖ, τὴν δίκην ἔφη χρῄζειν ἐπιθεῖναι αὐτῷ, ἦν ἢν δὲ φύγῃ, ἡμεῖς ἐκεῖ πρὸς ταῦτα βουλευσόμεθα.\n \n \n ἀκούσαντες δὲ ταῦτα οἱ αἱρετοὶ ἀγγέλλουσι τοῖς στρατιώταις· τοῖς δὲ ὑποψία μὲν ἦν ὅτι ἄγει πρὸς βασιλέα, ὅμως δὲ ἐδόκει ἕπεσθαι. προσαιτοῦσι δὲ μισθόν· ὁ δὲ Κῦρος ὑπισχνεῖται ἡμιόλιον πᾶσι δώσειν οὗ πρότερον ἔφερον, ἀντὶ δαρεικοῦ τρία ἡμιδαρεικὰ τοῦ μηνὸς τῷ στρατιώτῃ· ὅτι δὲ ἐπὶ βασιλέα ἄγοι οὐδὲ ἐνταῦθα ἤκουσεν οὐδεὶς ἐν τῷ γε φανερῷ."

        n: "1.4",
        label: "1장 §4",
        text: "ἐντεῦθεν ἐξελαύνει σταθμοὺς δύο παρασάγγας δέκα ἐπὶ τὸν Ψάρον ποταμόν, οὗ ἦν τὸ εὖρος τρία πλέθρα. ἐντεῦθεν ἐξελαύνει σταθμὸν ἕνα παρασάγγας πέντε ἐπὶ τὸν Πύραμον ποταμόν, οὗ ἦν τὸ εὖρος στάδιον. ἐντεῦθεν ἐξελαύνει σταθμοὺς δύο παρασάγγας πεντεκαίδεκα εἰς Ἰσσούς, τῆς Κιλικίας ἐσχάτην πόλιν ἐπὶ τῇ θαλάττῃ οἰκουμένην, μεγάλην καὶ εὐδαίμονα.\n \n \n ἐνταῦθα ἔμειναν ἡμέρας τρεῖς· καὶ Κύρῳ παρῆσαν αἱ ἐκ Πελοποννήσου νῆες τριάκοντα καὶ πέντε καὶ ἐπʼ αὐταῖς ναύαρχος Πυθαγόρας Λακεδαιμόνιος. ἡγεῖτο δʼ αὐταῖς Ταμὼς Αἰγύπτιος ἐξ Ἐφέσου, ἔχων ναῦς ἑτέρας Κύρου πέντε καὶ εἴκοσιν, αἷς ἐπολιόρκει Μίλητον, ὅτε Τισσαφέρνει φίλη ἦν, καὶ συνεπολέμει Κύρῳ πρὸς αὐτόν.\n \n \n παρῆν δὲ καὶ Χειρίσοφος Λακεδαιμόνιος ἐπὶ τῶν νεῶν, μετάπεμπτος ὑπὸ Κύρου, ἑπτακοσίους ἔχων ὁπλίτας, ὧν ἐστρατήγει παρὰ Κύρῳ. αἱ δὲ νῆες ὥρμουν παρὰ τὴν Κύρου σκηνήν. ἐνταῦθα καὶ οἱ παρὰ Ἀβροκόμα μισθοφόροι Ἕλληνες ἀποστάντες ἦλθον παρὰ Κῦρον τετρακόσιοι ὁπλῖται καὶ συνεστρατεύοντο ἐπὶ βασιλέα.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμὸν ἕνα παρασάγγας πέντε ἐπὶ πύλας τῆς Κιλικίας καὶ τῆς Συρίας. ἦσαν δὲ ταῦτα δύο τείχη, καὶ τὸ μὲν ἔσωθεν τὸ πρὸ τῆς Κιλικίας Συέννεσις εἶχε καὶ Κιλίκων φυλακή, τὸ δὲ ἔξω τὸ πρὸ τῆς Συρίας βασιλέως ἐλέγετο φυλακὴ φυλάττειν. διὰ μέσου δὲ ῥεῖ τούτων ποταμὸς Κάρσος ὄνομα, εὖρος πλέθρου. ἅπαν δὲ τὸ μέσον τῶν τειχῶν ἦσαν στάδιοι τρεῖς· καὶ παρελθεῖν οὐκ ἦν βίᾳ· ἦν γὰρ ἡ πάροδος στενὴ καὶ τὰ τείχη εἰς τὴν θάλατταν καθήκοντα, ὕπερθεν δʼ ἦσαν πέτραι ἠλίβατοι· ἐπὶ δὲ τοῖς τείχεσιν ἀμφοτέροις ἐφειστήκεσαν πύλαι.\n \n \n ταύτης ἕνεκα τῆς παρόδου Κῦρος τὰς ναῦς μετεπέμψατο, ὅπως ὁπλίτας ἀποβιβάσειεν εἴσω καὶ ἔξω τῶν πυλῶν, καὶ βιασόμενος τοὺς πολεμίους εἰ φυλάττοιεν ἐπὶ ταῖς Συρίαις πύλαις, ὅπερ ᾤετο ποιήσειν ὁ Κῦρος τὸν Ἀβροκόμαν, ἔχοντα πολὺ στράτευμα. Ἀβροκόμας δὲ οὐ τοῦτʼ ἐποίησεν, ἀλλʼ ἐπεὶ ἤκουσε Κῦρον ἐν Κιλικίᾳ ὄντα, ἀναστρέψας ἐκ Φοινίκης παρὰ βασιλέα ἀπήλαυνεν, ἔχων, ὡς ἐλέγετο, τριάκοντα μυριάδας στρατιᾶς.\n \n \n ἐντεῦθεν ἐξελαύνει διὰ Συρίας σταθμὸν ἕνα παρασάγγας πέντε εἰς Μυρίανδον, πόλιν οἰκουμένην ὑπὸ Φοινίκων ἐπὶ τῇ θαλάττῃ· ἐμπόριον δʼ ἦν τὸ χωρίον καὶ ὥρμουν αὐτόθι ὁλκάδες πολλαί. ἐνταῦθʼ ἔμεινεν ἡμέρας ἑπτά·\n \n \n καὶ Ξενίας ὁ Ἀρκὰς καὶ Πασίων ὁ Μεγαρεὺς ἐμβάντες εἰς πλοῖον καὶ τὰ πλείστου ἄξια ἐνθέμενοι ἀπέπλευσαν, ὡς μὲν τοῖς πλείστοις ἐδόκουν φιλοτιμηθέντες ὅτι τοὺς στρατιώτας αὐτῶν τοὺς παρὰ Κλέαρχον ἀπελθόντας ὡς ἀπιόντας εἰς τὴν Ἑλλάδα πάλιν καὶ οὐ πρὸς βασιλέα εἴα Κῦρος τὸν Κλέαρχον ἔχειν. ἐπεὶ δʼ ἦσαν ἀφανεῖς, διῆλθε λόγος ὅτι διώκει αὐτοὺς Κῦρος τριήρεσι· καὶ οἱ μὲν ηὔχοντο ὡς δειλοὺς ὄντας αὐτοὺς ληφθῆναι, οἱ δʼ ᾤκτιρον εἰ ἁλώσοιντο.\n \n \n Κῦρος δὲ συγκαλέσας τοὺς στρατηγοὺς εἶπεν· ἀπολελοίπασιν ἡμᾶς Ξενίας καὶ Πασίων. ἀλλʼ εὖ γε μέντοι ἐπιστάσθων ὅτι οὔτε ἀποδεδράκασιν· οἶδα γὰρ ὅπῃ οἴχονται· οὔτε ἀποπεφεύγασιν· ἔχω γὰρ τριήρεις ὥστε ἑλεῖν τὸ ἐκείνων πλοῖον· ἀλλὰ μὰ τοὺς θεοὺς οὐκ ἔγωγε αὐτοὺς διώξω, οὐδʼ ἐρεῖ οὐδεὶς ὡς ἐγὼ ἕως μὲν ἂν παρῇ τις χρῶμαι, ἐπειδὰν δὲ ἀπιέναι βούληται, συλλαβὼν καὶ αὐτοὺς κακῶς ποιῶ καὶ τὰ χρήματα ἀποσυλῶ. ἀλλὰ ἴτωσαν, εἰδότες ὅτι κακίους εἰσὶ περὶ ἡμᾶς ἢ ἡμεῖς περὶ ἐκείνους. καίτοι ἔχω γε αὐτῶν καὶ τέκνα καὶ γυναῖκας ἐν Τράλλεσι φρουρούμενα· ἀλλʼ οὐδὲ τούτων στερήσονται, ἀλλʼ ἀπολήψονται τῆς πρόσθεν ἕνεκα περὶ ἐμὲ ἀρετῆς.\n \n \n καὶ ὁ μὲν ταῦτα εἶπεν· οἱ δὲ Ἕλληνες, εἴ τις καὶ ἀθυμότερος ἦν πρὸς τὴν ἀνάβασιν, ἀκούοντες τὴν Κύρου ἀρετὴν ἥδιον καὶ προθυμότερον συνεπορεύοντο.\nμετὰ ταῦτα Κῦρος ἐξελαύνει σταθμοὺς τέτταρας παρασάγγας εἴκοσιν ἐπὶ τὸν Χάλον ποταμόν, ὄντα τὸ εὖρος πλέθρου, πλήρη δʼ ἰχθύων μεγάλων καὶ πραέων, οὓς οἱ Σύροι θεοὺς ἐνόμιζον καὶ ἀδικεῖν οὐκ εἴων, οὐδὲ τὰς περιστεράς. αἱ δὲ κῶμαι ἐν αἷς ἐσκήνουν Παρυσάτιδος ἦσαν εἰς ζώνην δεδομέναι.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς πέντε παρασάγγας τριάκοντα ἐπὶ τὰς πηγὰς τοῦ Δάρδατος ποταμοῦ, οὗ τὸ εὖρος πλέθρου. ἐνταῦθα ἦσαν τὰ Βελέσυος βασίλεια τοῦ Συρίας ἄρξαντος, καὶ παράδεισος πάνυ μέγας καὶ καλός, ἔχων πάντα ὅσα ὧραι φύουσι. Κῦρος δʼ αὐτὸν ἐξέκοψε καὶ τὰ βασίλεια κατέκαυσεν.\n \n \n ἐντεῦθεν ἐξελαύνει σταθμοὺς τρεῖς παρασάγγας πεντεκαίδεκα ἐπὶ τὸν Εὐφράτην ποταμόν, ὄντα τὸ εὖρος τεττάρων σταδίων· καὶ πόλις αὐτόθι ᾠκεῖτο μεγάλη καὶ εὐδαίμων Θάψακος ὄνομα. ἐνταῦθα ἔμεινεν ἡμέρας πέντε. καὶ Κῦρος μεταπεμψάμενος τοὺς στρατηγοὺς τῶν Ἑλλήνων ἔλεγεν ὅτι ἡ ὁδὸς ἔσοιτο πρὸς βασιλέα μέγαν εἰς Βαβυλῶνα· καὶ κελεύει αὐτοὺς λέγειν ταῦτα τοῖς στρατιώταις καὶ ἀναπείθειν ἕπεσθαι.\n \n \n οἱ δὲ ποιήσαντες ἐκκλησίαν ἀπήγγελλον ταῦτα· οἱ δὲ στρατιῶται ἐχαλέπαινον τοῖς στρατηγοῖς, καὶ ἔφασαν αὐτοὺς πάλαι ταῦτʼ εἰδότας κρύπτειν, καὶ οὐκ ἔφασαν ἰέναι, ἐὰν μή τις αὐτοῖς χρήματα διδῷ, ὥσπερ τοῖς προτέροις μετὰ Κύρου ἀναβᾶσι παρὰ τὸν πατέρα τοῦ Κύρου, καὶ ταῦτα οὐκ ἐπὶ μάχην ἰόντων, ἀλλὰ καλοῦντος τοῦ πατρὸς Κῦρον.\n \n \n ταῦτα οἱ στρατηγοὶ Κύρῳ ἀπήγγελλον· ὁ δʼ ὑπέσχετο ἀνδρὶ ἑκάστῳ δώσειν πέντε ἀργυρίου μνᾶς, ἐπὰν εἰς Βαβυλῶνα ἥκωσι, καὶ τὸν μισθὸν ἐντελῆ μέχρι ἂν καταστήσῃ τοὺς Ἕλληνας εἰς Ἰωνίαν πάλιν. τὸ μὲν δὴ πολὺ τοῦ Ἑλληνικοῦ οὕτως ἐπείσθη. Μένων δὲ πρὶν δῆλον εἶναι τί ποιήσουσιν οἱ ἄλλοι στρατιῶται, πότερον ἕψονται Κύρῳ ἢ οὔ, συνέλεξε τὸ αὑτοῦ στράτευμα χωρὶς τῶν ἄλλων καὶ ἔλεξε τάδε.\n \n \n ἄνδρες, ἐάν μοι πεισθῆτε, οὔτε κινδυνεύσαντες οὔτε πονήσαντες τῶν ἄλλων πλέον προτιμήσεσθε στρατιωτῶν ὑπὸ Κύρου. τί οὖν κελεύω ποιῆσαι; νῦν δεῖται Κῦρος ἕπεσθαι τοὺς Ἕλληνας ἐπὶ βασιλέα· ἐγὼ οὖν φημι ὑμᾶς χρῆναι διαβῆναι τὸν Εὐφράτην ποταμὸν πρὶν δῆλον εἶναι ὅ τι οἱ ἄλλοι Ἕλληνες ἀποκρινοῦνται Κύρῳ.\n \n \n ἢν μὲν γὰρ ψηφίσωνται ἕπεσθαι, ὑμεῖς δόξετε αἴτιοι εἶναι ἄρξαντες τοῦ διαβαίνειν, καὶ ὡς προθυμοτάτοις οὖσιν ὑμῖν χάριν εἴσεται Κῦρος καὶ ἀποδώσει· ἐπίσταται δʼ εἴ τις καὶ ἄλλος· ἢν δὲ ἀποψηφίσωνται οἱ ἄλλοι, ἄπιμεν μὲν ἅπαντες τοὔμπαλιν, ὑμῖν δὲ ὡς μόνοις πειθομένοις πιστοτάτοις χρήσεται καὶ εἰς φρούρια καὶ εἰς λοχαγίας, καὶ ἄλλου οὗτινος ἂν δέησθε οἶδα ὅτι ὡς φίλοι τεύξεσθε Κύρου.\n \n \n ἀκούσαντες ταῦτα ἐπείθοντο καὶ διέβησαν πρὶν τοὺς ἄλλους ἀποκρίνασθαι. Κῦρος δʼ ἐπεὶ ᾔσθετο διαβεβηκότας, ἥσθη τε καὶ τῷ στρατεύματι πέμψας Γλοῦν εἶπεν· ἐγὼ μέν, ὦ ἄνδρες, ἤδη ὑμᾶς ἐπαινῶ· ὅπως δὲ καὶ ὑμεῖς ἐμὲ ἐπαινέσετε ἐμοὶ μελήσει, ἢ μηκέτι με Κῦρον νομίζετε.\n \n \n οἱ μὲν δὴ στρατιῶται ἐν ἐλπίσι μεγάλαις ὄντες ηὔχοντο αὐτὸν εὐτυχῆσαι, Μένωνι δὲ καὶ δῶρα ἐλέγετο πέμψαι μεγαλοπρεπῶς. ταῦτα δὲ ποιήσας διέβαινε· συνείπετο δὲ καὶ τὸ ἄλλο στράτευμα αὐτῷ ἅπαν. καὶ τῶν διαβαινόντων τὸν ποταμὸν οὐδεὶς ἐβρέχθη ἀνωτέρω τῶν μαστῶν ὑπὸ τοῦ ποταμοῦ.\n \n \n οἱ δὲ Θαψακηνοὶ ἔλεγον ὅτι οὐπώποθʼ οὗτος ὁ ποταμὸς διαβατὸς γένοιτο πεζῇ εἰ μὴ τότε, ἀλλὰ πλοίοις, ἃ τότε Ἀβροκόμας προϊὼν κατέκαυσεν, ἵνα μὴ Κῦρος διαβῇ. ἐδόκει δὴ θεῖον εἶναι καὶ σαφῶς ὑποχωρῆσαι τὸν ποταμὸν Κύρῳ ὡς βασιλεύσοντι.\n \n \n ἐντεῦθεν ἐξελαύνει διὰ τῆς Συρίας σταθμοὺς ἐννέα παρασάγγας πεντήκοντα· καὶ ἀφικνοῦνται πρὸς τὸν Ἀράξην ποταμόν. ἐνταῦθα ἦσαν κῶμαι πολλαὶ μεσταὶ σίτου καὶ οἴνου. ἐνταῦθα ἔμειναν ἡμέρας τρεῖς καὶ ἐπεσιτίσαντο."

        n: "1.5",
        label: "1장 §5",
        text: "ἐντεῦθεν ἐξελαύνει διὰ τῆς Ἀραβίας τὸν Εὐφράτην ποταμὸν ἐν δεξιᾷ ἔχων σταθμοὺς ἐρήμους πέντε παρασάγγας τριάκοντα καὶ πέντε. ἐν τούτῳ δὲ τῷ τόπῳ ἦν μὲν ἡ γῆ πεδίον ἅπαν ὁμαλὲς ὥσπερ θάλαττα, ἀψινθίου δὲ πλῆρες· εἰ δέ τι καὶ ἄλλο ἐνῆν ὕλης ἢ καλάμου, ἅπαντα ἦσαν εὐώδη ὥσπερ ἀρώματα·\n \n \n δένδρον δʼ οὐδὲν ἐνῆν, θηρία δὲ παντοῖα, πλεῖστοι ὄνοι ἄγριοι, πολλαὶ δὲ στρουθοὶ αἱ μεγάλαι· ἐνῆσαν δὲ καὶ ὠτίδες καὶ δορκάδες· ταῦτα δὲ τὰ θηρία οἱ ἱππεῖς ἐνίοτε ἐδίωκον. καὶ οἱ μὲν ὄνοι, ἐπεί τις διώκοι, προδραμόντες ἕστασαν· πολὺ γὰρ τῶν ἵππων ἔτρεχον θᾶττον· καὶ πάλιν, ἐπεὶ πλησιάζοιεν οἱ ἵπποι, ταὐτὸν ἐποίουν, καὶ οὐκ ἦν λαβεῖν, εἰ μὴ διαστάντες οἱ ἱππεῖς θηρῷεν διαδεχόμενοι. τὰ δὲ κρέα τῶν ἁλισκομένων ἦν παραπλήσια τοῖς ἐλαφείοις, ἁπαλώτερα δέ.\n \n \n στρουθὸν δὲ οὐδεὶς ἔλαβεν· οἱ δὲ διώξαντες τῶν ἱππέων ταχὺ ἐπαύοντο· πολὺ γὰρ ἀπέσπα φεύγουσα, τοῖς μὲν ποσὶ δρόμῳ, ταῖς δὲ πτέρυξιν αἴρουσα, ὥσπερ ἱστίῳ χρωμένη. τὰς δὲ ὠτίδας ἄν τις ταχὺ ἀνιστῇ ἔστι λαμβάνειν· πέτονται γὰρ βραχὺ ὥσπερ πέρδικες καὶ ταχὺ ἀπαγορεύουσι. τὰ δὲ κρέα αὐτῶν ἥδιστα ἦν. \n \n \n πορευόμενοι δὲ διὰ ταύτης τῆς χώρας ἀφικνοῦνται ἐπὶ τὸν Μάσκαν ποταμόν, τὸ εὖρος πλεθριαῖον. ἐνταῦθα ἦν πόλις ἐρήμη, μεγάλη, ὄνομα δʼ αὐτῇ Κορσωτή· περιερρεῖτο δʼ αὕτη ὑπὸ τοῦ Μάσκα κύκλῳ.\n \n \n ἐνταῦθʼ ἔμειναν ἡμέρας τρεῖς καὶ ἐπεσιτίσαντο. ἐντεῦθεν ἐξελαύνει σταθμοὺς ἐρήμους τρισκαίδεκα παρασάγγας ἐνενήκοντα τὸν Εὐφράτην ποταμὸν ἐν δεξιᾷ ἔχων, καὶ ἀφικνεῖται ἐπὶ Πύλας. ἐν τούτοις τοῖς σταθμοῖς πολλὰ τῶν ὑποζυγίων ἀπώλετο ὑπὸ λιμοῦ· οὐ γὰρ ἦν χόρτος οὐδὲ ἄλλο οὐδὲν δένδρον, ἀλλὰ ψιλὴ ἦν ἅπασα ἡ χώρα· οἱ δὲ ἐνοικοῦντες ὄνους ἀλέτας παρὰ τὸν ποταμὸν ὀρύττοντες καὶ ποιοῦντες εἰς Βαβυλῶνα ἦγον καὶ ἐπώλουν καὶ ἀνταγοράζοντες σῖτον ἔζων.\n \n \n τὸ δὲ στράτευμα ὁ σῖτος ἐπέλιπε, καὶ πρίασθαι οὐκ ἦν εἰ μὴ ἐν τῇ Λυδίᾳ ἀγορᾷ ἐν τῷ Κύρου βαρβαρικῷ, τὴν καπίθην ἀλεύρων ἢ ἀλφίτων τεττάρων σίγλων. ὁ δὲ σίγλος δύναται ἑπτὰ ὀβολοὺς καὶ ἡμιωβέλιον Ἀττικούς· ἡ δὲ καπίθη δύο χοίνικας Ἀττικὰς ἐχώρει. κρέα οὖν ἐσθίοντες οἱ στρατιῶται διεγίγνοντο.\n \n \n ἦν δὲ τούτων τῶν σταθμῶν οὓς πάνυ μακροὺς ἤλαυνεν, ὁπότε ἢ πρὸς ὕδωρ βούλοιτο διατελέσαι ἢ πρὸς χιλόν. καὶ δή ποτε στενοχωρίας καὶ πηλοῦ φανέντος ταῖς ἁμάξαις δυσπορεύτου ἐπέστη ὁ Κῦρος σὺν τοῖς περὶ αὐτὸν ἀρίστοις καὶ εὐδαιμονεστάτοις καὶ ἔταξε Γλοῦν καὶ Πίγρητα λαβόντας τοῦ βαρβαρικοῦ στρατοῦ συνεκβιβάζειν τὰς ἁμάξας.\n \n \n ἐπεὶ δʼ ἐδόκουν αὐτῷ σχολαίως ποιεῖν, ὥσπερ ὀργῇ ἐκέλευσε τοὺς περὶ αὐτὸν Πέρσας τοὺς κρατίστους συνεπισπεῦσαι τὰς ἁμάξας. ἔνθα δὴ μέρος τι τῆς εὐταξίας ἦν θεάσασθαι. ῥίψαντες γὰρ τοὺς πορφυροῦς κάνδυς ὅπου ἔτυχεν ἕκαστος ἑστηκώς, ἵεντο ὥσπερ ἂν δράμοι τις ἐπὶ νίκῃ καὶ μάλα κατὰ πρανοῦς γηλόφου, ἔχοντες τούτους τε τοὺς πολυτελεῖς χιτῶνας καὶ τὰς ποικίλας ἀναξυρίδας, ἔνιοι δὲ καὶ στρεπτοὺς περὶ τοῖς τραχήλοις καὶ ψέλια περὶ ταῖς χερσίν· εὐθὺς δὲ σὺν τούτοις εἰσπηδήσαντες εἰς τὸν πηλὸν θᾶττον ἢ ὥς τις ἂν ᾤετο μετεώρους ἐξεκόμισαν τὰς ἁμάξας.\n \n \n τὸ δὲ σύμπαν δῆλος ἦν Κῦρος ὡς σπεύδων πᾶσαν τὴν ὁδὸν καὶ οὐ διατρίβων ὅπου μὴ ἐπισιτισμοῦ ἕνεκα ἤ τινος ἄλλου ἀναγκαίου ἐκαθέζετο, νομίζων, ὅσῳ θᾶττον ἔλθοι, τοσούτῳ ἀπαρασκευαστοτέρῳ βασιλεῖ μαχεῖσθαι, ὅσῳ δὲ σχολαίτερον, τοσούτῳ πλέον συναγείρεσθαι βασιλεῖ στράτευμα. καὶ συνιδεῖν δʼ ἦν τῷ προσέχοντι τὸν νοῦν τῇ βασιλέως ἀρχῇ πλήθει μὲν χώρας καὶ ἀνθρώπων ἰσχυρὰ οὖσα, τοῖς δὲ μήκεσι τῶν ὁδῶν καὶ τῷ διεσπάσθαι τὰς δυνάμεις ἀσθενής, εἴ τις διὰ ταχέων τὸν πόλεμον ποιοῖτο.\n \n \n πέραν δὲ τοῦ Εὐφράτου ποταμοῦ κατὰ τοὺς ἐρήμους σταθμοὺς ἦν πόλις εὐδαίμων καὶ μεγάλη, ὄνομα δὲ Χαρμάνδη· ἐκ ταύτης οἱ στρατιῶται ἠγόραζον τὰ ἐπιτήδεια, σχεδίαις διαβαίνοντες ὧδε. διφθέρας ἃς εἶχον στεγάσματα ἐπίμπλασαν χόρτου κούφου, εἶτα συνῆγον καὶ συνέσπων, ὡς μὴ ἅπτεσθαι τῆς κάρφης τὸ ὕδωρ· ἐπὶ τούτων διέβαινον καὶ ἐλάμβανον τὰ ἐπιτήδεια, οἶνόν τε ἐκ τῆς βαλάνου πεποιημένον τῆς ἀπὸ τοῦ φοίνικος καὶ σῖτον μελίνης· τοῦτο γὰρ ἦν ἐν τῇ χώρᾳ πλεῖστον.\n \n \n ἀμφιλεξάντων δέ τι ἐνταῦθα τῶν τε τοῦ Μένωνος στρατιωτῶν καὶ τῶν τοῦ Κλεάρχου ὁ Κλέαρχος κρίνας ἀδικεῖν τὸν τοῦ Μένωνος πληγὰς ἐνέβαλεν· ὁ δὲ ἐλθὼν πρὸς τὸ ἑαυτοῦ στράτευμα ἔλεγεν· ἀκούσαντες δὲ οἱ στρατιῶται ἐχαλέπαινον καὶ ὠργίζοντο ἰσχυρῶς τῷ Κλεάρχῳ.\n \n \n τῇ δὲ αὐτῇ ἡμέρᾳ Κλέαρχος ἐλθὼν ἐπὶ τὴν διάβασιν τοῦ ποταμοῦ καὶ ἐκεῖ κατασκεψάμενος τὴν ἀγορὰν ἀφιππεύει ἐπὶ τὴν ἑαυτοῦ σκηνὴν διὰ τοῦ Μένωνος στρατεύματος σὺν ὀλίγοις τοῖς περὶ αὐτόν· Κῦρος δὲ οὔπω ἧκεν, ἀλλʼ ἔτι προσήλαυνε· τῶν δὲ Μένωνος στρατιωτῶν ξύλα σχίζων τις ὡς εἶδε Κλέαρχον διελαύνοντα, ἵησι τῇ ἀξίνῃ· καὶ οὗτος μὲν αὐτοῦ ἥμαρτεν· ἄλλος δὲ λίθῳ καὶ ἄλλος, εἶτα πολλοί, κραυγῆς γενομένης.\n \n \n ὁ δὲ καταφεύγει εἰς τὸ ἑαυτοῦ στράτευμα, καὶ εὐθὺς παραγγέλλει εἰς τὰ ὅπλα· καὶ τοὺς μὲν ὁπλίτας αὐτοῦ ἐκέλευσε μεῖναι τὰς ἀσπίδας πρὸς τὰ γόνατα θέντας, αὐτὸς δὲ λαβὼν τοὺς Θρᾷκας καὶ τοὺς ἱππέας οἳ ἦσαν αὐτῷ ἐν τῷ στρατεύματι πλείους ἢ τετταράκοντα, τούτων δὲ οἱ πλεῖστοι Θρᾷκες, ἤλαυνεν ἐπὶ τοὺς Μένωνος, ὥστʼ ἐκείνους ἐκπεπλῆχθαι καὶ αὐτὸν Μένωνα, καὶ τρέχειν ἐπὶ τὰ ὅπλα· οἱ δὲ καὶ ἕστασαν ἀποροῦντες τῷ πράγματι.\n \n \n ὁ δὲ Πρόξενος (ἔτυχε γὰρ ὕστερος προσιὼν καὶ τάξις αὐτῷ ἑπομένη τῶν ὁπλιτῶν) εὐθὺς οὖν εἰς τὸ μέσον ἀμφοτέρων ἄγων ἔθετο τὰ ὅπλα καὶ ἐδεῖτο τοῦ Κλεάρχου μὴ ποιεῖν ταῦτα. ὁ δʼ ἐχαλέπαινεν ὅτι αὐτοῦ ὀλίγου δεήσαντος καταλευσθῆναι πράως λέγοι τὸ αὑτοῦ πάθος, ἐκέλευσέ τε αὐτὸν ἐκ τοῦ μέσου ἐξίστασθαι.\n \n \n ἐν τούτῳ δʼ ἐπῄει καὶ Κῦρος καὶ ἐπύθετο τὸ πρᾶγμα· εὐθὺς δʼ ἔλαβε τὰ παλτὰ εἰς τὰς χεῖρας καὶ σὺν τοῖς παροῦσι τῶν πιστῶν ἧκεν ἐλαύνων εἰς τὸ μέσον, καὶ λέγει τάδε.\n \n \n Κλέαρχε καὶ Πρόξενε καὶ οἱ ἄλλοι οἱ παρόντες Ἕλληνες, οὐκ ἴστε ὅ τι ποιεῖτε. εἰ γάρ τινα ἀλλήλοις μάχην συνάψετε, νομίζετε ἐν τῇδε τῇ ἡμέρᾳ ἐμέ τε κατακεκόψεσθαι καὶ ὑμᾶς οὐ πολὺ ἐμοῦ ὕστερον· κακῶς γὰρ τῶν ἡμετέρων ἐχόντων πάντες οὗτοι οὓς ὁρᾶτε βάρβαροι πολεμιώτεροι ἡμῖν ἔσονται τῶν παρὰ βασιλεῖ ὄντων.\n \n \n ἀκούσας ταῦτα ὁ Κλέαρχος ἐν ἑαυτῷ ἐγένετο· καὶ παυσάμενοι ἀμφότεροι κατὰ χώραν ἔθεντο τὰ ὅπλα."

        n: "1.6",

        text: "ἐντεῦθεν προϊόντων ἐφαίνετο ἴχνια ἵππων καὶ κόπρος· εἰκάζετο δʼ εἶναι ὁ στίβος ὡς δισχιλίων ἵππων. οὗτοι προϊόντες ἔκαιον καὶ χιλὸν καὶ εἴ τι ἄλλο χρήσιμον ἦν. Ὀρόντας δέ, Πέρσης ἀνήρ, γένει τε προσήκων βασιλεῖ καὶ τὰ πολέμια λεγόμενος ἐν τοῖς ἀρίστοις Περσῶν ἐπιβουλεύει Κύρῳ καὶ πρόσθεν πολεμήσας, καταλλαγεὶς δέ.\n \n \n οὗτος Κύρῳ εἶπεν, εἰ αὐτῷ δοίη ἱππέας χιλίους, ὅτι τοὺς προκατακαίοντας ἱππέας ἢ κατακαίνοι ἂν ἐνεδρεύσας ἢ ζῶντας πολλοὺς αὐτῶν ἂν ἕλοι καὶ κωλύσειε τοῦ καίειν ἐπιόντας, καὶ ποιήσειεν ὥστε μήποτε δύνασθαι αὐτοὺς ἰδόντας τὸ Κύρου στράτευμα βασιλεῖ διαγγεῖλαι. τῷ δὲ Κύρῳ ἀκούσαντι ταῦτα ἐδόκει ὠφέλιμα εἶναι, καὶ ἐκέλευεν αὐτὸν λαμβάνειν μέρος παρʼ ἑκάστου τῶν ἡγεμόνων.\n \n \n ὁ δʼ Ὀρόντας νομίσας ἑτοίμους εἶναι αὑτῷ τοὺς ἱππέας γράφει ἐπιστολὴν παρὰ βασιλέα ὅτι ἥξοι ἔχων ἱππέας ὡς ἂν δύνηται πλείστους· ἀλλὰ φράσαι τοῖς αὑτοῦ ἱππεῦσιν ἐκέλευεν ὡς φίλιον αὐτὸν ὑποδέχεσθαι. ἐνῆν δὲ ἐν τῇ ἐπιστολῇ καὶ τῆς πρόσθεν φιλίας ὑπομνήματα καὶ πίστεως. ταύτην τὴν ἐπιστολὴν δίδωσι πιστῷ ἀνδρί, ὡς ᾤετο· ὁ δὲ λαβὼν Κύρῳ δίδωσιν.\n \n \n ἀναγνοὺς δὲ αὐτὴν ὁ Κῦρος συλλαμβάνει Ὀρόνταν, καὶ συγκαλεῖ εἰς τὴν ἑαυτοῦ σκηνὴν Πέρσας τοὺς ἀρίστους τῶν περὶ αὐτὸν ἑπτά, καὶ τοὺς τῶν Ἑλλήνων στρατηγοὺς ἐκέλευσεν ὁπλίτας ἀγαγεῖν, τούτους δὲ θέσθαι τὰ ὅπλα περὶ τὴν αὑτοῦ σκηνήν. οἱ δὲ ταῦτα ἐποίησαν, ἀγαγόντες ὡς τρισχιλίους ὁπλίτας.\n \n \n Κλέαρχον δὲ καὶ εἴσω παρεκάλεσε σύμβουλον, ὅς γε καὶ αὐτῷ καὶ τοῖς ἄλλοις ἐδόκει προτιμηθῆναι μάλιστα τῶν Ἑλλήνων. ἐπεὶ δʼ ἐξῆλθεν, ἀπήγγειλε τοῖς φίλοις τὴν κρίσιν τοῦ Ὀρόντα ὡς ἐγένετο· οὐ γὰρ ἀπόρρητον ἦν.\n \n \n ἔφη δὲ Κῦρον ἄρχειν τοῦ λόγου ὧδε. παρεκάλεσα ὑμᾶς, ἄνδρες φίλοι, ὅπως σὺν ὑμῖν βουλευόμενος ὅ τι δίκαιόν ἐστι καὶ πρὸς θεῶν καὶ πρὸς ἀνθρώπων, τοῦτο πράξω περὶ Ὀρόντα τουτουί. τοῦτον γὰρ πρῶτον μὲν ὁ ἐμὸς πατὴρ ἔδωκεν ὑπήκοον εἶναι ἐμοί· ἐπεὶ δὲ ταχθείς, ὡς ἔφη αὐτός, ὑπὸ τοῦ ἐμοῦ ἀδελφοῦ οὗτος ἐπολέμησεν ἐμοὶ ἔχων τὴν ἐν Σάρδεσιν ἀκρόπολιν, καὶ ἐγὼ αὐτὸν προσπολεμῶν ἐποίησα ὥστε δόξαι τούτῳ τοῦ πρὸς ἐμὲ πολέμου παύσασθαι, καὶ δεξιὰν ἔλαβον καὶ ἔδωκα, μετὰ ταῦτα, ἔφη, Ὀρόντα, ἔστιν ὅ τι σε ἠδίκησα;\n \n \n ἀπεκρίνατο ὅτι οὔ. πάλιν δὲ ὁ Κῦρος ἠρώτα· οὐκοῦν ὕστερον, ὡς αὐτὸς σὺ ὁμολογεῖς, οὐδὲν ὑπʼ ἐμοῦ ἀδικούμενος ἀποστὰς εἰς Μυσοὺς κακῶς ἐποίεις τὴν ἐμὴν χώραν ὅ τι ἐδύνω; ἔφη Ὀρόντας. οὐκοῦν, ἔφη ὁ Κῦρος, ὁπότʼ αὖ ἔγνως τὴν σαυτοῦ δύναμιν, ἐλθὼν ἐπὶ τὸν τῆς Ἀρτέμιδος βωμὸν μεταμέλειν τέ σοι ἔφησθα καὶ πείσας ἐμὲ πιστὰ πάλιν ἔδωκάς μοι καὶ ἔλαβες παρʼ ἐμοῦ; καὶ ταῦθʼ ὡμολόγει Ὀρόντας.\n \n \n τί οὖν, ἔφη ὁ Κῦρος, ἀδικηθεὶς ὑπʼ ἐμοῦ νῦν τὸ τρίτον ἐπιβουλεύων μοι φανερὸς γέγονας; εἰπόντος δὲ τοῦ Ὀρόντα ὅτι οὐδὲν ἀδικηθείς, ἠρώτησεν ὁ Κῦρος αὐτόν· ὁμολογεῖς οὖν περὶ ἐμὲ ἄδικος γεγενῆσθαι; ἦ γὰρ ἀνάγκη, ἔφη Ὀρόντας. ἐκ τούτου πάλιν ἠρώτησεν ὁ Κῦρος· ἔτι οὖν ἂν γένοιο τῷ ἐμῷ ἀδελφῷ πολέμιος, ἐμοὶ δὲ φίλος καὶ πιστός; ὁ δὲ ἀπεκρίνατο ὅτι οὐδʼ εἰ γενοίμην, ὦ Κῦρε, σοί γʼ ἄν ποτε ἔτι δόξαιμι.\n \n \n πρὸς ταῦτα Κῦρος εἶπε τοῖς παροῦσιν· ὁ μὲν ἀνὴρ τοιαῦτα μὲν πεποίηκε, τοιαῦτα δὲ λέγει· ὑμῶν δὲ σὺ πρῶτος, ὦ Κλέαρχε, ἀπόφηναι γνώμην ὅ τι σοι δοκεῖ. Κλέαρχος δὲ εἶπε τάδε. συμβουλεύω ἐγὼ τὸν ἄνδρα τοῦτον ἐκποδὼν ποιεῖσθαι ὡς τάχιστα, ὡς μηκέτι δέῃ τοῦτον φυλάττεσθαι, ἀλλὰ σχολὴ ᾖ ἡμῖν, τὸ κατὰ τοῦτον εἶναι, τοὺς ἐθελοντὰς τούτους εὖ ποιεῖν.\n \n \n ταύτῃ δὲ τῇ γνώμῃ ἔφη καὶ τοὺς ἄλλους προσθέσθαι. μετὰ ταῦτα, ἔφη, κελεύοντος Κύρου ἔλαβον τῆς ζώνης τὸν Ὀρόνταν ἐπὶ θανάτῳ ἅπαντες ἀναστάντες καὶ οἱ συγγενεῖς· εἶτα δʼ ἐξῆγον αὐτὸν οἷς προσετάχθη. ἐπεὶ δὲ εἶδον αὐτὸν οἵπερ πρόσθεν προσεκύνουν, καὶ τότε προσεκύνησαν, καίπερ εἰδότες ὅτι ἐπὶ θάνατον ἄγοιτο.\n \n \n ἐπεὶ δὲ εἰς τὴν Ἀρταπάτου σκηνὴν εἰσήχθη, τοῦ πιστοτάτου τῶν Κύρου σκηπτούχων, μετὰ ταῦτα οὔτε ζῶντα Ὀρόνταν οὔτε τεθνηκότα οὐδεὶς εἶδε πώποτε, οὐδὲ ὅπως ἀπέθανεν οὐδεὶς εἰδὼς ἔλεγεν· εἴκαζον δὲ ἄλλοι ἄλλως· τάφος δὲ οὐδεὶς πώποτε αὐτοῦ ἐφάνη."

        text: "ἐντεῦθεν ἐξελαύνει διὰ τῆς Βαβυλωνίας σταθμοὺς τρεῖς παρασάγγας δώδεκα. ἐν δὲ τῷ τρίτῳ σταθμῷ Κῦρος ἐξέτασιν ποιεῖται τῶν Ἑλλήνων καὶ τῶν βαρβάρων ἐν τῷ πεδίῳ περὶ μέσας νύκτας· ἐδόκει γὰρ εἰς τὴν ἐπιοῦσαν ἕω ἥξειν βασιλέα σὺν τῷ στρατεύματι μαχούμενον· καὶ ἐκέλευε Κλέαρχον μὲν τοῦ δεξιοῦ κέρως ἡγεῖσθαι, Μένωνα δὲ τὸν Θετταλὸν τοῦ εὐωνύμου, αὐτὸς δὲ τοὺς ἑαυτοῦ διέταξε.\n \n \n μετὰ δὲ τὴν ἐξέτασιν ἅμα τῇ ἐπιούσῃ ἡμέρᾳ ἥκοντες αὐτόμολοι παρὰ μεγάλου βασιλέως ἀπήγγελλον Κύρῳ περὶ τῆς βασιλέως στρατιᾶς. Κῦρος δὲ συγκαλέσας τοὺς στρατηγοὺς καὶ λοχαγοὺς τῶν Ἑλλήνων συνεβουλεύετό τε πῶς ἂν τὴν μάχην ποιοῖτο καὶ αὐτὸς παρῄνει θαρρύνων τοιάδε.\n \n \n ὦ ἄνδρες Ἕλληνες, οὐκ ἀνθρώπων ἀπορῶν βαρβάρων συμμάχους ὑμᾶς ἄγω, ἀλλὰ νομίζων ἀμείνονας καὶ κρείττους πολλῶν βαρβάρων ὑμᾶς εἶναι, διὰ τοῦτο προσέλαβον. ὅπως οὖν ἔσεσθε ἄνδρες ἄξιοι τῆς ἐλευθερίας ἧς κέκτησθε καὶ ἧς ὑμᾶς ἐγὼ εὐδαιμονίζω. εὖ γὰρ ἴστε ὅτι τὴν ἐλευθερίαν ἑλοίμην ἂν ἀντὶ ὧν ἔχω πάντων καὶ ἄλλων πολλαπλασίων.\n \n \n ὅπως δὲ καὶ εἰδῆτε εἰς οἷον ἔρχεσθε ἀγῶνα, ὑμᾶς εἰδὼς διδάξω. τὸ μὲν γὰρ πλῆθος πολὺ καὶ κραυγῇ πολλῇ ἐπίασιν· ἂν δὲ ταῦτα ἀνάσχησθε, τὰ ἄλλα καὶ αἰσχύνεσθαί μοι δοκῶ οἵους ἡμῖν γνώσεσθε τοὺς ἐν τῇ χώρᾳ ὄντας ἀνθρώπους. ὑμῶν δὲ ἀνδρῶν ὄντων καὶ εὖ τῶν ἐμῶν γενομένων, ἐγὼ ὑμῶν τὸν μὲν οἴκαδε βουλόμενον ἀπιέναι τοῖς οἴκοι ζηλωτὸν ποιήσω ἀπελθεῖν, πολλοὺς δὲ οἶμαι ποιήσειν τὰ παρʼ ἐμοὶ ἑλέσθαι ἀντὶ τῶν οἴκοι.\n \n \n ἐνταῦθα Γαυλίτης παρών, φυγὰς Σάμιος, πιστὸς δὲ Κύρῳ, εἶπεν· καὶ μήν, ὦ Κῦρε, λέγουσί τινες ὅτι πολλὰ ὑπισχνῇ νῦν διὰ τὸ ἐν τοιούτῳ εἶναι τοῦ κινδύνου προσιόντος, ἂν δὲ εὖ γένηταί τι, οὐ μεμνήσεσθαί σέ φασιν· ἔνιοι δὲ οὐδʼ εἰ μεμνῇό τε καὶ βούλοιο δύνασθαι ἂν ἀποδοῦναι ὅσα ὑπισχνῇ.\n \n \n ἀκούσας ταῦτα ἔλεξεν ὁ Κῦρος· ἀλλʼ ἔστι μὲν ἡμῖν, ὦ ἄνδρες, ἀρχὴ πατρῴα πρὸς μὲν μεσημβρίαν μέχρι οὗ διὰ καῦμα οὐ δύνανται οἰκεῖν ἄνθρωποι, πρὸς δὲ ἄρκτον μέχρι οὗ διὰ χειμῶνα· τὰ δʼ ἐν μέσῳ τούτων πάντα σατραπεύουσιν οἱ τοῦ ἐμοῦ ἀδελφοῦ φίλοι.\n \n \n ἢν δʼ ἡμεῖς νικήσωμεν, ἡμᾶς δεῖ τοὺς ἡμετέρους φίλους τούτων ἐγκρατεῖς ποιῆσαι. ὥστε οὐ τοῦτο δέδοικα, μὴ οὐκ ἔχω ὅ τι δῶ ἑκάστῳ τῶν φίλων, ἂν εὖ γένηται, ἀλλὰ μὴ οὐκ ἔχω ἱκανοὺς οἷς δῶ. ὑμῶν δὲ τῶν Ἑλλήνων καὶ στέφανον ἑκάστῳ χρυσοῦν δώσω.\n \n \n οἱ δὲ ταῦτα ἀκούσαντες αὐτοί τε ἦσαν πολὺ προθυμότεροι καὶ τοῖς ἄλλοις ἐξήγγελλον. εἰσῇσαν δὲ παρʼ αὐτὸν οἵ τε στρατηγοὶ καὶ τῶν ἄλλων Ἑλλήνων τινὲς ἀξιοῦντες εἰδέναι τί σφίσιν ἔσται, ἐὰν κρατήσωσιν. ὁ δὲ ἐμπιμπλὰς ἁπάντων τὴν γνώμην ἀπέπεμπε.\n \n \n παρεκελεύοντο δὲ αὐτῷ πάντες ὅσοιπερ διελέγοντο μὴ μάχεσθαι, ἀλλʼ ὄπισθεν ἑαυτῶν τάττεσθαι. ἐν δὲ τῷ καιρῷ τούτῳ Κλέαρχος ὧδέ πως ἤρετο τὸν Κῦρον· οἴει γάρ σοι μαχεῖσθαι, ὦ Κῦρε, τὸν ἀδελφόν; νὴ Δίʼ, ἔφη ὁ Κῦρος, εἴπερ γε Δαρείου καὶ Παρυσάτιδός ἐστι παῖς, ἐμὸς δὲ ἀδελφός, οὐκ ἀμαχεὶ ταῦτʼ ἐγὼ λήψομαι.\n \n \n ἐνταῦθα δὴ ἐν τῇ ἐξοπλισίᾳ ἀριθμὸς ἐγένετο τῶν μὲν Ἑλλήνων ἀσπὶς μυρία καὶ τετρακοσία, πελτασταὶ δὲ δισχίλιοι καὶ πεντακόσιοι, τῶν δὲ μετὰ Κύρου βαρβάρων δέκα μυριάδες καὶ ἅρματα δρεπανηφόρα ἀμφὶ τὰ εἴκοσι.\n \n \n τῶν δὲ πολεμίων ἐλέγοντο εἶναι ἑκατὸν καὶ εἴκοσι μυριάδες καὶ ἅρματα δρεπανηφόρα διακόσια. ἄλλοι δὲ ἦσαν ἑξακισχίλιοι ἱππεῖς, ὧν Ἀρταγέρσης ἦρχεν· οὗτοι δʼ αὖ πρὸ αὐτοῦ βασιλέως τεταγμένοι ἦσαν.\n \n \n τοῦ δὲ βασιλέως στρατεύματος ἦσαν ἄρχοντες καὶ στρατηγοὶ καὶ ἡγεμόνες τέτταρες, τριάκοντα μυριάδων ἕκαστος, Ἀβροκόμας, Τισσαφέρνης, Γωβρύας, Ἀρβάκης. τούτων δὲ παρεγένοντο ἐν τῇ μάχῃ ἐνενήκοντα μυριάδες καὶ ἅρματα δρεπανηφόρα ἑκατὸν καὶ πεντήκοντα· Ἀβροκόμας δὲ ὑστέρησε τῆς μάχης ἡμέραις πέντε, ἐκ Φοινίκης ἐλαύνων.\n \n \n ταῦτα δὲ ἤγγελλον πρὸς Κῦρον οἱ αὐτομολήσαντες παρὰ μεγάλου βασιλέως πρὸ τῆς μάχης, καὶ μετὰ τὴν μάχην οἳ ὕστερον ἐλήφθησαν τῶν πολεμίων ταὐτὰ ἤγγελλον.\n \n \n ἐντεῦθεν δὲ Κῦρος ἐξελαύνει σταθμὸν ἕνα παρασάγγας τρεῖς συντεταγμένῳ τῷ στρατεύματι παντὶ καὶ τῷ Ἑλληνικῷ καὶ τῷ βαρβαρικῷ· ᾤετο γὰρ ταύτῃ τῇ ἡμέρᾳ μαχεῖσθαι βασιλέα· κατὰ γὰρ μέσον τὸν σταθμὸν τοῦτον τάφρος ἦν ὀρυκτὴ βαθεῖα, τὸ μὲν εὖρος ὀργυιαὶ πέντε, τὸ δὲ βάθος ὀργυιαὶ τρεῖς.\n \n \n παρετέτατο δὲ ἡ τάφρος ἄνω διὰ τοῦ πεδίου ἐπὶ δώδεκα παρασάγγας μέχρι τοῦ Μηδίας τείχους. ἦν δὲ παρὰ τὸν Εὐφράτην πάροδος στενὴ μεταξὺ τοῦ ποταμοῦ καὶ τῆς τάφρου ὡς εἴκοσι ποδῶν τὸ εὖρος·\n \n \n ταύτην δὲ τὴν τάφρον βασιλεὺς ποιεῖ μέγας ἀντὶ ἐρύματος, ἐπειδὴ πυνθάνεται Κῦρον προσελαύνοντα. ταύτην δὴ τὴν πάροδον Κῦρός τε καὶ ἡ στρατιὰ παρῆλθε καὶ ἐγένοντο εἴσω τῆς τάφρου.\n \n \n ταύτῃ μὲν οὖν τῇ ἡμέρᾳ οὐκ ἐμαχέσατο βασιλεύς, ἀλλʼ ὑποχωρούντων φανερὰ ἦσαν καὶ ἵππων καὶ ἀνθρώπων ἴχνη πολλά.\n \n \n ἐνταῦθα Κῦρος Σιλανὸν καλέσας τὸν Ἀμπρακιώτην μάντιν ἔδωκεν αὐτῷ δαρεικοὺς τρισχιλίους, ὅτι τῇ ἑνδεκάτῃ ἀπʼ ἐκείνης ἡμέρᾳ πρότερον θυόμενος εἶπεν αὐτῷ ὅτι βασιλεὺς οὐ μαχεῖται δέκα ἡμερῶν, Κῦρος δʼ εἶπεν· οὐκ ἄρα ἔτι μαχεῖται, εἰ ἐν ταύταις οὐ μαχεῖται ταῖς ἡμέραις· ἐὰν δʼ ἀληθεύσῃς, ὑπισχνοῦμαί σοι δέκα τάλαντα. τοῦτο τὸ χρυσίον τότε ἀπέδωκεν, ἐπεὶ παρῆλθον αἱ δέκα ἡμέραι.\n \n \n ἐπεὶ δʼ ἐπὶ τῇ τάφρῳ οὐκ ἐκώλυε βασιλεὺς τὸ Κύρου στράτευμα διαβαίνειν, ἔδοξε καὶ Κύρῳ καὶ τοῖς ἄλλοις ἀπεγνωκέναι τοῦ μάχεσθαι· ὥστε τῇ ὑστεραίᾳ Κῦρος ἐπορεύετο ἠμελημένως μᾶλλον.\n \n \n τῇ δὲ τρίτῃ ἐπί τε τοῦ ἅρματος καθήμενος τὴν πορείαν ἐποιεῖτο καὶ ὀλίγους ἐν τάξει ἔχων πρὸ αὑτοῦ, τὸ δὲ πολὺ αὐτῷ ἀνατεταραγμένον ἐπορεύετο καὶ τῶν ὅπλων τοῖς στρατιώταις πολλὰ ἐπὶ ἁμαξῶν ἤγοντο καὶ ὑποζυγίων."
      },

        n: "1.8",
        label: "1장 §8",
        text: "καὶ ἤδη τε ἦν ἀμφὶ ἀγορὰν πλήθουσαν καὶ πλησίον ἦν ὁ σταθμὸς ἔνθα ἔμελλε καταλύειν, ἡνίκα Πατηγύας, ἀνὴρ Πέρσης τῶν ἀμφὶ Κῦρον χρηστός, προφαίνεται ἐλαύνων ἀνὰ κράτος ἱδροῦντι τῷ ἵππῳ, καὶ εὐθὺς πᾶσιν οἷς ἐνετύγχανεν ἐβόα καὶ βαρβαρικῶς καὶ ἑλληνικῶς ὅτι βασιλεὺς σὺν στρατεύματι πολλῷ προσέρχεται ὡς εἰς μάχην παρεσκευασμένος.\n \n \n ἔνθα δὴ πολὺς τάραχος ἐγένετο· αὐτίκα γὰρ ἐδόκουν οἱ Ἕλληνες καὶ πάντες δὲ ἀτάκτοις σφίσιν ἐπιπεσεῖσθαι·\n \n \n Κῦρός τε καταπηδήσας ἀπὸ τοῦ ἅρματος τὸν θώρακα ἐνεδύετο καὶ ἀναβὰς ἐπὶ τὸν ἵππον τὰ παλτὰ εἰς τὰς χεῖρας ἔλαβε, τοῖς τε ἄλλοις πᾶσι παρήγγελλεν ἐξοπλίζεσθαι καὶ καθίστασθαι εἰς τὴν ἑαυτοῦ τάξιν ἕκαστον.\n \n \n ἔνθα δὴ σὺν πολλῇ σπουδῇ καθίσταντο, Κλέαρχος μὲν τὰ δεξιὰ τοῦ κέρατος ἔχων πρὸς τῷ Εὐφράτῃ ποταμῷ, Πρόξενος δὲ ἐχόμενος, οἱ δʼ ἄλλοι μετὰ τοῦτον, Μένων δὲ καὶ τὸ στράτευμα τὸ εὐώνυμον κέρας ἔσχε τοῦ Ἑλληνικοῦ.\n \n \n τοῦ δὲ βαρβαρικοῦ ἱππεῖς μὲν Παφλαγόνες εἰς χιλίους παρὰ Κλέαρχον ἔστησαν ἐν τῷ δεξιῷ καὶ τὸ Ἑλληνικὸν πελταστικόν, ἐν δὲ τῷ εὐωνύμῳ Ἀριαῖός τε ὁ Κύρου ὕπαρχος καὶ τὸ ἄλλο βαρβαρικόν,\n \n \n Κῦρος δὲ καὶ ἱππεῖς τούτου ὅσον ἑξακόσιοι κατὰ τὸ μέσον, ὡπλισμένοι θώραξι μὲν αὐτοὶ καὶ παραμηριδίοις καὶ κράνεσι πάντες πλὴν Κύρου· Κῦρος δὲ ψιλὴν ἔχων τὴν κεφαλὴν εἰς τὴν μάχην καθίστατο .\n \n \n οἱ δʼ ἵπποι πάντες εἶχον καὶ προμετωπίδια καὶ προστερνίδια· εἶχον δὲ καὶ μαχαίρας οἱ ἱππεῖς Ἑλληνικάς.\n \n \n καὶ ἤδη τε ἦν μέσον ἡμέρας καὶ οὔπω καταφανεῖς ἦσαν οἱ πολέμιοι· ἡνίκα δὲ δείλη ἐγίγνετο, ἐφάνη κονιορτὸς ὥσπερ νεφέλη λευκή, χρόνῳ δὲ συχνῷ ὕστερον ὥσπερ μελανία τις ἐν τῷ πεδίῳ ἐπὶ πολύ. ὅτε δὲ ἐγγύτερον ἐγίγνοντο, τάχα δὴ καὶ χαλκός τις ἤστραπτε καὶ λόγχαι καὶ αἱ τάξεις καταφανεῖς ἐγίγνοντο.\n \n \n καὶ ἦσαν ἱππεῖς μὲν λευκοθώρακες ἐπὶ τοῦ εὐωνύμου τῶν πολεμίων· Τισσαφέρνης ἐλέγετο τούτων ἄρχειν· ἐχόμενοι δὲ γερροφόροι, ἐχόμενοι δὲ ὁπλῖται σὺν ποδήρεσι ξυλίναις ἀσπίσιν. Αἰγύπτιοι δʼ οὗτοι ἐλέγοντο εἶναι· ἄλλοι δʼ ἱππεῖς, ἄλλοι τοξόται. πάντες δʼ οὗτοι κατὰ ἔθνη ἐν πλαισίῳ πλήρει ἀνθρώπων ἕκαστον τὸ ἔθνος ἐπορεύετο.\n \n \n πρὸ δὲ αὐτῶν ἅρματα διαλείποντα συχνὸν ἀπʼ ἀλλήλων τὰ δὴ δρεπανηφόρα καλούμενα· εἶχον δὲ τὰ δρέπανα ἐκ τῶν ἀξόνων εἰς πλάγιον ἀποτεταμένα καὶ ὑπὸ τοῖς δίφροις εἰς γῆν βλέποντα, ὡς διακόπτειν ὅτῳ ἐντυγχάνοιεν. ἡ δὲ γνώμη ἦν ὡς εἰς τὰς τάξεις τῶν Ἑλλήνων ἐλῶντα καὶ διακόψοντα.\n \n \n ὃ μέντοι Κῦρος εἶπεν ὅτε καλέσας παρεκελεύετο τοῖς Ἕλλησι τὴν κραυγὴν τῶν βαρβάρων ἀνέχεσθαι, ἐψεύσθη τοῦτο· οὐ γὰρ κραυγῇ ἀλλὰ σιγῇ ὡς ἁνυστὸν καὶ ἡσυχῇ ἐν ἴσῳ καὶ βραδέως προσῇσαν.\n \n \n καὶ ἐν τούτῳ Κῦρος παρελαύνων αὐτὸς σὺν Πίγρητι τῷ ἑρμηνεῖ καὶ ἄλλοις τρισὶν ἢ τέτταρσι τῷ Κλεάρχῳ ἐβόα ἄγειν τὸ στράτευμα κατὰ μέσον τὸ τῶν πολεμίων, ὅτι ἐκεῖ βασιλεὺς εἴη· κἂν τοῦτʼ, ἔφη, νικῶμεν, πάνθʼ ἡμῖν πεποίηται.\n \n \n ὁρῶν δὲ ὁ Κλέαρχος τὸ μέσον στῖφος καὶ ἀκούων Κύρου ἔξω ὄντα τοῦ Ἑλληνικοῦ εὐωνύμου βασιλέα (τοσοῦτον γὰρ πλήθει περιῆν βασιλεὺς ὥστε μέσον τῶν ἑαυτοῦ ἔχων τοῦ Κύρου εὐωνύμου ἔξω ἦν) ἀλλʼ ὅμως ὁ Κλέαρχος οὐκ ἤθελεν ἀποσπάσαι ἀπὸ τοῦ ποταμοῦ τὸ δεξιὸν κέρας, φοβούμενος μὴ κυκλωθείη ἑκατέρωθεν, τῷ δὲ Κύρῳ ἀπεκρίνατο ὅτι αὐτῷ μέλει ὅπως καλῶς ἔχοι.\n \n \n καὶ ἐν τούτῳ τῷ καιρῷ τὸ μὲν βαρβαρικὸν στράτευμα ὁμαλῶς προῄει, τὸ δὲ Ἑλληνικὸν ἔτι ἐν τῷ αὐτῷ μένον συνετάττετο ἐκ τῶν ἔτι προσιόντων. καὶ ὁ Κῦρος παρελαύνων οὐ πάνυ πρὸς αὐτῷ στρατεύματι κατεθεᾶτο ἑκατέρωσε ἀποβλέπων εἴς τε τοὺς πολεμίους καὶ τοὺς φίλους.\n \n \n ἰδὼν δὲ αὐτὸν ἀπὸ τοῦ Ἑλληνικοῦ Ξενοφῶν Ἀθηναῖος, πελάσας ὡς συναντῆσαι ἤρετο εἴ τι παραγγέλλοι· ὁ δʼ ἐπιστήσας εἶπε καὶ λέγειν ἐκέλευε πᾶσιν ὅτι καὶ τὰ ἱερὰ καλὰ καὶ τὰ σφάγια καλά.\n \n \n ταῦτα δὲ λέγων θορύβου ἤκουσε διὰ τῶν τάξεων ἰόντος, καὶ ἤρετο τίς ὁ θόρυβος εἴη. ὁ δὲ εἶπεν ὅτι σύνθημα παρέρχεται δεύτερον ἤδη. καὶ ὃς ἐθαύμασε τίς παραγγέλλει καὶ ἤρετο ὅ τι εἴη τὸ σύνθημα. ὁ δʼ ἀπεκρίνατο· Ζεὺς σωτὴρ καὶ νίκη.\n \n \n ὁ δὲ Κῦρος ἀκούσας, ἀλλὰ δέχομαί τε, ἔφη, καὶ τοῦτο ἔστω. ταῦτα δʼ εἰπὼν εἰς τὴν αὑτοῦ χώραν ἀπήλαυνε. καὶ οὐκέτι τρία ἢ τέτταρα στάδια διειχέτην τὼ φάλαγγε ἀπʼ ἀλλήλων ἡνίκα ἐπαιάνιζόν τε οἱ Ἕλληνες καὶ ἤρχοντο ἀντίοι ἰέναι τοῖς πολεμίοις.\n \n \n ὡς δὲ πορευομένων ἐξεκύμαινέ τι τῆς φάλαγγος, τὸ ὑπολειπόμενον ἤρξατο δρόμῳ θεῖν· καὶ ἅμα ἐφθέγξαντο πάντες οἷον τῷ Ἐνυαλίῳ ἐλελίζουσι, καὶ πάντες δὲ ἔθεον. λέγουσι δέ τινες ὡς καὶ ταῖς ἀσπίσι πρὸς τὰ δόρατα ἐδούπησαν φόβον ποιοῦντες τοῖς ἵπποις.\n \n \n πρὶν δὲ τόξευμα ἐξικνεῖσθαι ἐκκλίνουσιν οἱ βάρβαροι καὶ φεύγουσι. καὶ ἐνταῦθα δὴ ἐδίωκον μὲν κατὰ κράτος οἱ Ἕλληνες, ἐβόων δὲ ἀλλήλοις μὴ θεῖν δρόμῳ, ἀλλʼ ἐν τάξει ἕπεσθαι.\n \n \n τὰ δʼ ἅρματα ἐφέροντο τὰ μὲν διʼ αὐτῶν τῶν πολεμίων, τὰ δὲ καὶ διὰ τῶν Ἑλλήνων κενὰ ἡνιόχων. οἱ δʼ ἐπεὶ προΐδοιεν, διίσταντο· ἔστι δʼ ὅστις καὶ κατελήφθη ὥσπερ ἐν ἱπποδρόμῳ ἐκπλαγείς· καὶ οὐδὲν μέντοι οὐδὲ τοῦτον παθεῖν ἔφασαν, οὐδʼ ἄλλος δὲ τῶν Ἑλλήνων ἐν ταύτῃ τῇ μάχῃ ἔπαθεν οὐδεὶς οὐδέν, πλὴν ἐπὶ τῷ εὐωνύμῳ τοξευθῆναί τις ἐλέγετο.\n \n \n Κῦρος δʼ ὁρῶν τοὺς Ἕλληνας νικῶντας τὸ καθʼ αὑτοὺς καὶ διώκοντας, ἡδόμενος καὶ προσκυνούμενος ἤδη ὡς βασιλεὺς ὑπὸ τῶν ἀμφʼ αὐτόν, οὐδʼ ὣς ἐξήχθη διώκειν, ἀλλὰ συνεσπειραμένην ἔχων τὴν τῶν σὺν ἑαυτῷ ἑξακοσίων ἱππέων τάξιν ἐπεμελεῖτο ὅ τι ποιήσει βασιλεύς. καὶ γὰρ ᾔδει αὐτὸν ὅτι μέσον ἔχοι τοῦ Περσικοῦ στρατεύματος.\n \n \n καὶ πάντες δʼ οἱ τῶν βαρβάρων ἄρχοντες μέσον ἔχοντες τὸ αὑτῶν ἡγοῦνται, νομίζοντες οὕτω καὶ ἐν ἀσφαλεστάτῳ εἶναι, ἢν ᾖ ἡ ἰσχὺς αὐτῶν ἑκατέρωθεν, καὶ εἴ τι παραγγεῖλαι χρῄζοιεν, ἡμίσει ἂν χρόνῳ αἰσθάνεσθαι τὸ στράτευμα.\n \n \n καὶ βασιλεὺς δὴ τότε μέσον ἔχων τῆς αὑτοῦ στρατιᾶς ὅμως ἔξω ἐγένετο τοῦ Κύρου εὐωνύμου κέρατος. ἐπεὶ δʼ οὐδεὶς αὐτῷ ἐμάχετο ἐκ τοῦ ἀντίου οὐδὲ τοῖς αὐτοῦ τεταγμένοις ἔμπροσθεν, ἐπέκαμπτεν ὡς εἰς κύκλωσιν.\n \n \n ἔνθα δὴ Κῦρος δείσας μὴ ὄπισθεν γενόμενος κατακόψῃ τὸ Ἑλληνικὸν ἐλαύνει ἀντίος· καὶ ἐμβαλὼν σὺν τοῖς ἑξακοσίοις νικᾷ τοὺς πρὸ βασιλέως τεταγμένους καὶ εἰς φυγὴν ἔτρεψε τοὺς ἑξακισχιλίους, καὶ ἀποκτεῖναι λέγεται αὐτὸς τῇ ἑαυτοῦ χειρὶ Ἀρταγέρσην τὸν ἄρχοντα αὐτῶν.\n \n \n ὡς δʼ ἡ τροπὴ ἐγένετο, διασπείρονται καὶ οἱ Κύρου ἑξακόσιοι εἰς τὸ διώκειν ὁρμήσαντες, πλὴν πάνυ ὀλίγοι ἀμφʼ αὐτὸν κατελείφθησαν, σχεδὸν οἱ ὁμοτράπεζοι καλούμενοι.\n \n \n σὺν τούτοις δὲ ὢν καθορᾷ βασιλέα καὶ τὸ ἀμφʼ ἐκεῖνον στῖφος· καὶ εὐθὺς οὐκ ἠνέσχετο, ἀλλʼ εἰπὼν τὸν ἄνδρα ὁρῶ ἵετο ἐπʼ αὐτὸν καὶ παίει κατὰ τὸ στέρνον καὶ τιτρώσκει διὰ τοῦ θώρακος, ὥς φησι Κτησίας ὁ ἰατρός, καὶ ἰᾶσθαι αὐτὸς τὸ τραῦμά φησι.\n \n \n παίοντα δʼ αὐτὸν ἀκοντίζει τις παλτῷ ὑπὸ τὸν ὀφθαλμὸν βιαίως· καὶ ἐνταῦθα μαχόμενοι καὶ βασιλεὺς καὶ Κῦρος καὶ οἱ ἀμφʼ αὐτοὺς ὑπὲρ ἑκατέρου, ὁπόσοι μὲν τῶν ἀμφὶ βασιλέα ἀπέθνῃσκον Κτησίας λέγει· παρʼ ἐκείνῳ γὰρ ἦν· Κῦρος δὲ αὐτός τε ἀπέθανε καὶ ὀκτὼ οἱ ἄριστοι τῶν περὶ αὐτὸν ἔκειντο ἐπʼ αὐτῷ.\n \n \n Ἀρταπάτης δʼ ὁ πιστότατος αὐτῷ τῶν σκηπτούχων θεράπων λέγεται, ἐπειδὴ πεπτωκότα εἶδε Κῦρον, καταπηδήσας ἀπὸ τοῦ ἵππου περιπεσεῖν αὐτῷ.\n \n \n καὶ οἱ μέν φασι βασιλέα κελεῦσαί τινα ἐπισφάξαι αὐτὸν Κύρῳ, οἱ δʼ ἑαυτὸν ἐπισφάξασθαι σπασάμενον τὸν ἀκινάκην· εἶχε γὰρ χρυσοῦν· καὶ στρεπτὸν δʼ ἐφόρει καὶ ψέλια καὶ τἆλλα ὥσπερ οἱ ἄριστοι Περσῶν· ἐτετίμητο γὰρ ὑπὸ Κύρου διʼ εὔνοιάν τε καὶ πιστότητα."

        n: "1.9",
        label: "1장 §9",
        text: "Κῦρος μὲν οὖν οὕτως ἐτελεύτησεν, ἀνὴρ ὢν Περσῶν τῶν μετὰ Κῦρον τὸν ἀρχαῖον γενομένων βασιλικώτατός τε καὶ ἄρχειν ἀξιώτατος, ὡς παρὰ πάντων ὁμολογεῖται τῶν Κύρου δοκούντων ἐν πείρᾳ γενέσθαι.\n \n \n πρῶτον μὲν γὰρ ἔτι παῖς ὤν, ὅτʼ ἐπαιδεύετο καὶ σὺν τῷ ἀδελφῷ καὶ σὺν τοῖς ἄλλοις παισί, πάντων πάντα κράτιστος ἐνομίζετο.\n \n \n πάντες γὰρ οἱ τῶν ἀρίστων Περσῶν παῖδες ἐπὶ ταῖς βασιλέως θύραις παιδεύονται· ἔνθα πολλὴν μὲν σωφροσύνην καταμάθοι ἄν τις, αἰσχρὸν δʼ οὐδὲν οὔτʼ ἀκοῦσαι οὔτʼ ἰδεῖν ἔστι.\n \n \n θεῶνται δʼ οἱ παῖδες καὶ τιμωμένους ὑπὸ βασιλέως καὶ ἀκούουσι, καὶ ἄλλους ἀτιμαζομένους· ὥστε εὐθὺς παῖδες ὄντες μανθάνουσιν ἄρχειν τε καὶ ἄρχεσθαι.\n \n \n ἔνθα Κῦρος αἰδημονέστατος μὲν πρῶτον τῶν ἡλικιωτῶν ἐδόκει εἶναι, τοῖς τε πρεσβυτέροις καὶ τῶν ἑαυτοῦ ὑποδεεστέρων μᾶλλον πείθεσθαι, ἔπειτα δὲ φιλιππότατος καὶ τοῖς ἵπποις ἄριστα χρῆσθαι· ἔκρινον δʼ αὐτὸν καὶ τῶν εἰς τὸν πόλεμον ἔργων, τοξικῆς τε καὶ ἀκοντίσεως, φιλομαθέστατον εἶναι καὶ μελετηρότατον.\n \n \n ἐπεὶ δὲ τῇ ἡλικίᾳ ἔπρεπε, καὶ φιλοθηρότατος ἦν καὶ πρὸς τὰ θηρία μέντοι φιλοκινδυνότατος. καὶ ἄρκτον ποτὲ ἐπιφερομένην οὐκ ἔτρεσεν, ἀλλὰ συμπεσὼν κατεσπάσθη ἀπὸ τοῦ ἵππου, καὶ τὰ μὲν ἔπαθεν, ὧν καὶ τὰς ὠτειλὰς εἶχεν, τέλος δὲ κατέκανε· καὶ τὸν πρῶτον μέντοι βοηθήσαντα πολλοῖς μακαριστὸν ἐποίησεν.\n \n \n ἐπεὶ δὲ κατεπέμφθη ὑπὸ τοῦ πατρὸς σατράπης Λυδίας τε καὶ Φρυγίας τῆς μεγάλης καὶ Καππαδοκίας, στρατηγὸς δὲ καὶ πάντων ἀπεδείχθη οἷς καθήκει εἰς Καστωλοῦ πεδίον ἁθροίζεσθαι, πρῶτον μὲν ἐπέδειξεν αὑτόν, ὅτι περὶ πλείστου ποιοῖτο, εἴ τῳ σπείσαιτο καὶ εἴ τῳ συνθοῖτο καὶ εἴ τῳ ὑπόσχοιτό τι, μηδὲν ψεύδεσθαι.\n \n \n καὶ γὰρ οὖν ἐπίστευον μὲν αὐτῷ αἱ πόλεις ἐπιτρεπόμεναι, ἐπίστευον δʼ οἱ ἄνδρες· καὶ εἴ τις πολέμιος ἐγένετο, σπεισαμένου Κύρου ἐπίστευε μηδὲν ἂν παρὰ τὰς σπονδὰς παθεῖν.\n \n \n τοιγαροῦν ἐπεὶ Τισσαφέρνει ἐπολέμησε, πᾶσαι αἱ πόλεις ἑκοῦσαι Κῦρον εἵλοντο ἀντὶ Τισσαφέρνους πλὴν Μιλησίων· οὗτοι δὲ ὅτι οὐκ ἤθελε τοὺς φεύγοντας προέσθαι ἐφοβοῦντο αὐτόν.\n \n \n καὶ γὰρ ἔργῳ ἐπεδείκνυτο καὶ ἔλεγεν ὅτι οὐκ ἄν ποτε προοῖτο, ἐπεὶ ἅπαξ φίλος αὐτοῖς ἐγένετο, οὐδʼ εἰ ἔτι μὲν μείους γένοιντο, ἔτι δὲ κάκιον πράξειαν.\n \n \n φανερὸς δʼ ἦν καὶ εἴ τίς τι ἀγαθὸν ἢ κακὸν ποιήσειεν αὐτόν, νικᾶν πειρώμενος· καὶ εὐχὴν δέ τινες αὐτοῦ ἐξέφερον ὡς εὔχοιτο τοσοῦτον χρόνον ζῆν ἔστε νικῴη καὶ τοὺς εὖ καὶ κακῶς ποιοῦντας ἀλεξόμενος.\n \n \n καὶ γὰρ οὖν πλεῖστοι δὴ αὐτῷ ἑνί γε ἀνδρὶ τῶν ἐφʼ ἡμῶν ἐπεθύμησαν καὶ χρήματα καὶ πόλεις καὶ τὰ ἑαυτῶν σώματα προέσθαι.\n \n \n οὐ μὲν δὴ οὐδὲ τοῦτʼ ἄν τις εἴποι, ὡς τοὺς κακούργους καὶ ἀδίκους εἴα καταγελᾶν, ἀλλὰ ἀφειδέστατα πάντων ἐτιμωρεῖτο· πολλάκις δʼ ἦν ἰδεῖν παρὰ τὰς στειβομένας ὁδοὺς καὶ ποδῶν καὶ χειρῶν καὶ ὀφθαλμῶν στερομένους ἀνθρώπους· ὥστʼ ἐν τῇ Κύρου ἀρχῇ ἐγένετο καὶ Ἕλληνι καὶ βαρβάρῳ μηδὲν ἀδικοῦντι ἀδεῶς πορεύεσθαι ὅπῃ τις ἤθελεν, ἔχοντι ὅ τι προχωροίη.\n \n \n τούς γε μέντοι ἀγαθοὺς εἰς πόλεμον ὡμολόγητο διαφερόντως τιμᾶν. καὶ πρῶτον μὲν ἦν αὐτῷ πόλεμος πρὸς Πισίδας καὶ Μυσούς· στρατευόμενος οὖν καὶ αὐτὸς εἰς ταύτας τὰς χώρας, οὓς ἑώρα ἐθέλοντας κινδυνεύειν, τούτους καὶ ἄρχοντας ἐποίει ἧς κατεστρέφετο χώρας, ἔπειτα δὲ καὶ ἄλλοις δώροις ἐτίμα·\n \n \n ὥστε φαίνεσθαι τοὺς μὲν ἀγαθοὺς εὐδαιμονεστάτους, τοὺς δὲ κακοὺς δούλους τούτων ἀξιοῦσθαι εἶναι. τοιγαροῦν πολλὴ ἦν ἀφθονία αὐτῷ τῶν ἐθελόντων κινδυνεύειν, ὅπου τις οἴοιτο Κῦρον αἰσθήσεσθαι.\n \n \n εἴς γε μὴν δικαιοσύνην εἴ τις φανερὸς γένοιτο ἐπιδείκνυσθαι βουλόμενος, περὶ παντὸς ἐποιεῖτο τούτους πλουσιωτέρους ποιεῖν τῶν ἐκ τοῦ ἀδίκου φιλοκερδούντων.\n \n \n καὶ γὰρ οὖν ἄλλα τε πολλὰ δικαίως αὐτῷ διεχειρίζετο καὶ στρατεύματι ἀληθινῷ ἐχρήσατο. καὶ γὰρ στρατηγοὶ καὶ λοχαγοί, οἳ χρημάτων ἕνεκα πρὸς ἐκεῖνον ἔπλευσαν, ἔγνωσαν κερδαλεώτερον εἶναι Κύρῳ καλῶς πειθαρχεῖν ἢ τὸ κατὰ μῆνα κέρδος.\n \n \n ἀλλὰ μὴν εἴ τίς γέ τι αὐτῷ προστάξαντι καλῶς ὑπηρετήσειεν, οὐδενὶ πώποτε ἀχάριστον εἴασε τὴν προθυμίαν. τοιγαροῦν δὴ κράτιστοι ὑπηρέται παντὸς ἔργου Κύρῳ ἐλέχθησαν γενέσθαι.\n \n \n εἰ δέ τινα ὁρῴη δεινὸν ὄντα οἰκονόμον ἐκ τοῦ δικαίου καὶ κατασκευάζοντά τε ἧς ἄρχοι χώρας καὶ προσόδους ποιοῦντα, οὐδένα ἂν πώποτε ἀφείλετο, ἀλλʼ ἀεὶ πλείω προσεδίδου· ὥστε καὶ ἡδέως ἐπόνουν καὶ θαρραλέως ἐκτῶντο καὶ ὃ ἐπέπατο αὖ τις ἥκιστα Κῦρον ἔκρυπτεν· οὐ γὰρ φθονῶν τοῖς φανερῶς πλουτοῦσιν ἐφαίνετο, ἀλλὰ πειρώμενος χρῆσθαι τοῖς τῶν ἀποκρυπτομένων χρήμασι.\n \n \n φίλους γε μήν, ὅσους ποιήσαιτο καὶ εὔνους γνοίη ὄντας καὶ ἱκανοὺς κρίνειε συνεργοὺς εἶναι ὅ τι τυγχάνει βουλόμενος κατεργάζεσθαι, ὁμολογεῖται πρὸς πάντων κράτιστος δὴ γενέσθαι θεραπεύειν.\n \n \n καὶ γὰρ αὐτὸ τοῦτο οὗπερ αὐτὸς ἕνεκα φίλων ᾤετο δεῖσθαι, ὡς συνεργοὺς ἔχοι, καὶ αὐτὸς ἐπειρᾶτο συνεργὸς τοῖς φίλοις κράτιστος εἶναι τούτου ὅτου αἰσθάνοιτο ἕκαστον ἐπιθυμοῦντα.\n \n \n δῶρα δὲ πλεῖστα μὲν οἶμαι εἷς γε ἀνὴρ ἐλάμβανε διὰ πολλά· ταῦτα δὲ πάντων δὴ μάλιστα τοῖς φίλοις διεδίδου, πρὸς τοὺς τρόπους ἑκάστου σκοπῶν καὶ ὅτου μάλιστα ὁρῴη ἕκαστον δεόμενον.\n \n \n καὶ ὅσα τῷ σώματι αὐτοῦ πέμποι τις ἢ ὡς εἰς πόλεμον ἢ ὡς εἰς καλλωπισμόν, καὶ περὶ τούτων λέγειν αὐτὸν ἔφασαν ὅτι τὸ μὲν ἑαυτοῦ σῶμα οὐκ ἂν δύναιτο τούτοις πᾶσι κοσμηθῆναι, φίλους δὲ καλῶς κεκοσμημένους μέγιστον κόσμον ἀνδρὶ νομίζοι.\n \n \n καὶ τὸ μὲν τὰ μεγάλα νικᾶν τοὺς φίλους εὖ ποιοῦντα οὐδὲν θαυμαστόν, ἐπειδή γε καὶ δυνατώτερος ἦν· τὸ δὲ τῇ ἐπιμελείᾳ περιεῖναι τῶν φίλων καὶ τῷ προθυμεῖσθαι χαρίζεσθαι, ταῦτα ἔμοιγε μᾶλλον δοκεῖ ἀγαστὰ εἶναι.\n \n \n Κῦρος γὰρ ἔπεμπε βίκους οἴνου ἡμιδεεῖς πολλάκις ὁπότε πάνυ ἡδὺν λάβοι, λέγων ὅτι οὔπω δὴ πολλοῦ χρόνου τούτου ἡδίονι οἴνῳ ἐπιτύχοι· τοῦτον οὖν σοὶ ἔπεμψε καὶ δεῖταί σου τήμερον τοῦτον ἐκπιεῖν σὺν οἷς μάλιστα φιλεῖς.\n \n \n πολλάκις δὲ χῆνας ἡμιβρώτους ἔπεμπε καὶ ἄρτων ἡμίσεα καὶ ἄλλα τοιαῦτα, ἐπιλέγειν κελεύων τὸν φέροντα· τούτοις ἥσθη Κῦρος· βούλεται οὖν καὶ σὲ τούτων γεύσασθαι.\n \n \n ὅπου δὲ χιλὸς σπάνιος πάνυ εἴη, αὐτὸς δὲ δύναιτο παρασκευάσασθαι διὰ τὸ πολλοὺς ἔχειν ὑπηρέτας καὶ διὰ τὴν ἐπιμέλειαν, διαπέμπων ἐκέλευε τοὺς φίλους τοῖς τὰ ἑαυτῶν σώματα ἄγουσιν ἵπποις ἐμβάλλειν τοῦτον τὸν χιλόν, ὡς μὴ πεινῶντες τοὺς ἑαυτοῦ φίλους ἄγωσιν.\n \n \n εἰ δὲ δή ποτε πορεύοιτο καὶ πλεῖστοι μέλλοιεν ὄψεσθαι, προσκαλῶν τοὺς φίλους ἐσπουδαιολογεῖτο, ὡς δηλοίη οὓς τιμᾷ. ὥστε ἐγὼ μέν γε, ἐξ ὧν ἀκούω, οὐδένα κρίνω ὑπὸ πλειόνων πεφιλῆσθαι οὔτε Ἑλλήνων οὔτε βαρβάρων.\n \n \n τεκμήριον δὲ τούτου καὶ τόδε. παρὰ μὲν Κύρου δούλου ὄντος οὐδεὶς ἀπῄει πρὸς βασιλέα, πλὴν Ὀρόντας ἐπεχείρησε· καὶ οὗτος δὴ ὃν ᾤετο πιστόν οἱ εἶναι ταχὺ αὐτὸν ηὗρε Κύρῳ φίλτερον ἢ ἑαυτῷ· παρὰ δὲ βασιλέως πολλοὶ πρὸς Κῦρον ἀπῆλθον, ἐπειδὴ πολέμιοι ἀλλήλοις ἐγένοντο, καὶ οὗτοι μέντοι οἱ μάλιστα ὑπʼ αὐτοῦ ἀγαπώμενοι, νομίζοντες παρὰ Κύρῳ ὄντες ἀγαθοὶ ἀξιωτέρας ἂν τιμῆς τυγχάνειν ἢ παρὰ βασιλεῖ.\n \n \n μέγα δὲ τεκμήριον καὶ τὸ ἐν τῇ τελευτῇ τοῦ βίου αὐτῷ γενόμενον ὅτι καὶ αὐτὸς ἦν ἀγαθὸς καὶ κρίνειν ὀρθῶς ἐδύνατο τοὺς πιστοὺς καὶ εὔνους καὶ βεβαίους.\n \n \n ἀποθνῄσκοντος γὰρ αὐτοῦ πάντες οἱ περὶ αὐτὸν φίλοι καὶ συντράπεζοι ἀπέθανον μαχόμενοι ὑπὲρ Κύρου πλὴν Ἀριαίου· οὗτος δὲ τεταγμένος ἐτύγχανεν ἐπὶ τῷ εὐωνύμῳ τοῦ ἱππικοῦ ἄρχων· ὡς δʼ ᾔσθετο Κῦρον πεπτωκότα, ἔφυγεν ἔχων καὶ τὸ στράτευμα πᾶν οὗ ἡγεῖτο."
