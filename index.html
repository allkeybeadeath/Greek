        text: "ἐνταῦθα δὴ Κύρου ἀποτέμνεται ἡ κεφαλὴ καὶ ἡ χεὶρ ἡ δεξιά. βασιλεὺς δὲ διώκων εἰσπίπτει εἰς τὸ Κύρειον στρατόπεδον· καὶ οἱ μὲν μετὰ Ἀριαίου οὐκέτι ἵστανται, ἀλλὰ φεύγουσι διὰ τοῦ αὑτῶν στρατοπέδου εἰς τὸν σταθμὸν ἔνθεν ὡρμῶντο· τέτταρες δʼ ἐλέγοντο παρασάγγαι εἶναι τῆς ὁδοῦ.\n \n \n βασιλεὺς δὲ καὶ οἱ σὺν αὐτῷ τά τε ἄλλα πολλὰ διαρπάζουσι καὶ τὴν Φωκαΐδα τὴν Κύρου παλλακίδα τὴν σοφὴν καὶ καλὴν λεγομένην εἶναι λαμβάνει.\n \n \n ἡ δὲ Μιλησία ἡ νεωτέρα ληφθεῖσα ὑπὸ τῶν ἀμφὶ βασιλέα ἐκφεύγει γυμνὴ πρὸς τῶν Ἑλλήνων οἳ ἔτυχον ἐν τοῖς σκευοφόροις ὅπλα ἔχοντες καὶ ἀντιταχθέντες πολλοὺς μὲν τῶν ἁρπαζόντων ἀπέκτειναν, οἱ δὲ καὶ αὐτῶν ἀπέθανον· οὐ μὴν ἔφυγόν γε, ἀλλὰ καὶ ταύτην ἔσωσαν καὶ τἆλλα, ὁπόσα ἐντὸς αὐτῶν καὶ χρήματα καὶ ἄνθρωποι ἐγένοντο, πάντα ἔσωσαν.\n \n \n ἐνταῦθα διέσχον ἀλλήλων βασιλεύς τε καὶ οἱ Ἕλληνες ὡς τριάκοντα στάδια, οἱ μὲν διώκοντες τοὺς καθʼ αὑτοὺς ὡς πάντας νικῶντες, οἱ δʼ ἁρπάζοντες ὡς ἤδη πάντες νικῶντες.\n \n \n ἐπεὶ δʼ ᾔσθοντο οἱ μὲν Ἕλληνες ὅτι βασιλεὺς σὺν τῷ στρατεύματι ἐν τοῖς σκευοφόροις εἴη, βασιλεὺς δʼ αὖ ἤκουσε Τισσαφέρνους ὅτι οἱ Ἕλληνες νικῷεν τὸ καθʼ αὑτοὺς καὶ εἰς τὸ πρόσθεν οἴχονται διώκοντες, ἔνθα δὴ βασιλεὺς μὲν ἁθροίζει τε τοὺς ἑαυτοῦ καὶ συντάττεται, ὁ δὲ Κλέαρχος ἐβουλεύετο Πρόξενον καλέσας (πλησιαίτατος γὰρ ἦν), εἰ πέμποιέν τινας ἢ πάντες ἴοιεν ἐπὶ τὸ στρατόπεδον ἀρήξοντες.\n \n \n ἐν τούτῳ καὶ βασιλεὺς δῆλος ἦν προσιὼν πάλιν, ὡς ἐδόκει, ὄπισθεν. καὶ οἱ μὲν Ἕλληνες στραφέντες παρεσκευάζοντο ὡς ταύτῃ προσιόντος καὶ δεξόμενοι, ὁ δὲ βασιλεὺς ταύτῃ μὲν οὐκ ἦγεν, ᾗ δὲ παρῆλθεν ἔξω τοῦ εὐωνύμου κέρατος ταύτῃ καὶ ἀπῆγεν, ἀναλαβὼν καὶ τοὺς ἐν τῇ μάχῃ πρὸς τοὺς Ἕλληνας αὐτομολήσαντας καὶ Τισσαφέρνην καὶ τοὺς σὺν αὐτῷ.\n \n \n ὁ γὰρ Τισσαφέρνης ἐν τῇ πρώτῃ συνόδῳ οὐκ ἔφυγεν, ἀλλὰ διήλασε παρὰ τὸν ποταμὸν κατὰ τοὺς Ἕλληνας πελταστάς· διελαύνων δὲ κατέκανε μὲν οὐδένα, διαστάντες δʼ οἱ Ἕλληνες ἔπαιον καὶ ἠκόντιζον αὐτούς· Ἐπισθένης δὲ Ἀμφιπολίτης ἦρχε τῶν πελταστῶν καὶ ἐλέγετο φρόνιμος γενέσθαι.\n \n \n ὁ δʼ οὖν Τισσαφέρνης ὡς μεῖον ἔχων ἀπηλλάγη, πάλιν μὲν οὐκ ἀναστρέφει, εἰς δὲ τὸ στρατόπεδον ἀφικόμενος τὸ τῶν Ἑλλήνων ἐκεῖ συντυγχάνει βασιλεῖ, καὶ ὁμοῦ δὴ πάλιν συνταξάμενοι ἐπορεύοντο.\n \n \n ἐπεὶ δʼ ἦσαν κατὰ τὸ εὐώνυμον τῶν Ἑλλήνων κέρας, ἔδεισαν οἱ Ἕλληνες μὴ προσάγοιεν πρὸς τὸ κέρας καὶ περιπτύξαντες ἀμφοτέρωθεν αὐτοὺς κατακόψειαν· καὶ ἐδόκει αὐτοῖς ἀναπτύσσειν τὸ κέρας καὶ ποιήσασθαι ὄπισθεν τὸν ποταμόν.\n \n \n ἐν ᾧ δὲ ταῦτα ἐβουλεύοντο, καὶ δὴ βασιλεὺς παραμειψάμενος εἰς τὸ αὐτὸ σχῆμα κατέστησεν ἀντίαν τὴν φάλαγγα ὥσπερ τὸ πρῶτον μαχούμενος συνῄει. ὡς δὲ εἶδον οἱ Ἕλληνες ἐγγύς τε ὄντας καὶ παρατεταγμένους, αὖθις παιανίσαντες ἐπῇσαν πολὺ ἔτι προθυμότερον ἢ τὸ πρόσθεν.\n \n \n οἱ δʼ αὖ βάρβαροι οὐκ ἐδέχοντο, ἀλλὰ ἐκ πλέονος ἢ τὸ πρόσθεν ἔφευγον·\n \n \n οἱ δʼ ἐπεδίωκον μέχρι κώμης τινός· ἐνταῦθα δʼ ἔστησαν οἱ Ἕλληνες· ὑπὲρ γὰρ τῆς κώμης γήλοφος ἦν, ἐφʼ οὗ ἀνεστράφησαν οἱ ἀμφὶ βασιλέα, πεζοὶ μὲν οὐκέτι, τῶν δὲ ἱππέων ὁ λόφος ἐνεπλήσθη, ὥστε τὸ ποιούμενον μὴ γιγνώσκειν. καὶ τὸ βασίλειον σημεῖον ὁρᾶν ἔφασαν αἰετόν τινα χρυσοῦν ἐπὶ πέλτῃ ἐπὶ ξύλου ἀνατεταμένον.\n \n \n ἐπεὶ δὲ καὶ ἐνταῦθʼ ἐχώρουν οἱ Ἕλληνες, λείπουσι δὴ καὶ τὸν λόφον οἱ ἱππεῖς· οὐ μὴν ἔτι ἁθρόοι ἀλλʼ ἄλλοι ἄλλοθεν· ἐψιλοῦτο δʼ ὁ λόφος τῶν ἱππέων· τέλος δὲ καὶ πάντες ἀπεχώρησαν.\n \n \n ὁ οὖν Κλέαρχος οὐκ ἀνεβίβαζεν ἐπὶ τὸν λόφον, ἀλλʼ ὑπʼ αὐτὸν στήσας τὸ στράτευμα πέμπει Λύκιον τὸν Συρακόσιον καὶ ἄλλον ἐπὶ τὸν λόφον καὶ κελεύει κατιδόντας τὰ ὑπὲρ τοῦ λόφου τί ἐστιν ἀπαγγεῖλαι.\n \n \n καὶ ὁ Λύκιος ἤλασέ τε καὶ ἰδὼν ἀπαγγέλλει ὅτι φεύγουσιν ἀνὰ κράτος.\n \n \n σχεδὸν δʼ ὅτε ταῦτα ἦν καὶ ἥλιος ἐδύετο. ἐνταῦθα δʼ ἔστησαν οἱ Ἕλληνες καὶ θέμενοι τὰ ὅπλα ἀνεπαύοντο· καὶ ἅμα μὲν ἐθαύμαζον ὅτι οὐδαμοῦ Κῦρος φαίνοιτο οὐδʼ ἄλλος ἀπʼ αὐτοῦ οὐδεὶς παρῄει· οὐ γὰρ ᾔδεσαν αὐτὸν τεθνηκότα, ἀλλʼ εἴκαζον ἢ διώκοντα οἴχεσθαι ἢ καταληψόμενόν τι προεληλακέναι·\n \n \n καὶ αὐτοὶ ἐβουλεύοντο εἰ αὐτοῦ μείναντες τὰ σκευοφόρα ἐνταῦθα ἄγοιντο ἢ ἀπίοιεν ἐπὶ τὸ στρατόπεδον. ἔδοξεν αὐτοῖς ἀπιέναι· καὶ ἀφικνοῦνται ἀμφὶ δορπηστὸν ἐπὶ τὰς σκηνάς.\n \n \n ταύτης μὲν τῆς ἡμέρας τοῦτο τὸ τέλος ἐγένετο. καταλαμβάνουσι δὲ τῶν τε ἄλλων χρημάτων τὰ πλεῖστα διηρπασμένα καὶ εἴ τι σιτίον ἢ ποτὸν ἦν, καὶ τὰς ἁμάξας μεστὰς ἀλεύρων καὶ οἴνου, ἃς παρεσκευάσατο Κῦρος, ἵνα εἴ ποτε σφόδρα τὸ στράτευμα λάβοι ἔνδεια, διαδιδοίη τοῖς Ἕλλησιν (ἦσαν δʼ αὗται τετρακόσιαι, ὡς ἐλέγοντο, ἅμαξαι), καὶ ταύτας τότε οἱ σὺν βασιλεῖ διήρπασαν.\n \n \n ὥστε ἄδειπνοι ἦσαν οἱ πλεῖστοι τῶν Ἑλλήνων· ἦσαν δὲ καὶ ἀνάριστοι· πρὶν γὰρ δὴ καταλῦσαι τὸ στράτευμα πρὸς ἄριστον βασιλεὺς ἐφάνη. ταύτην μὲν οὖν τὴν νύκτα οὕτω διεγένοντο."

        text: "τοιούτου δὲ τοῦ Περικλέους ἐν τοῖς ἀξίοις μνήμης γεγονότος, ὡς παρειλήφαμεν, ἐπὶ τὸν Φάβιον τὴν ἱστορίαν μεταγάγωμεν. νυμφῶν μιᾶς λέγουσιν, οἱ δὲ γυναικὸς ἐπιχωρίας, Ἡρακλεῖ μιγείσης περὶ τὸν Θύμβριν ποταμὸν γενέσθαι Φάβιον, ἄνδρα πολὺ καὶ δόκιμον ἐν Ῥώμῃ τὸ Φαβίων γένος ἀφʼ αὐτοῦ παρασχόντα, \n τινὲς δὲ τοὺς ἀπὸ τοῦ γένους τούτου πρώτους τῇ διʼ ὀρυγμάτων χρησαμένους ἄγρᾳ Φοδίους ἱστοροῦσιν ὀνομάζεσθαι τὸ παλαιόν οὕτω γὰρ ἄχρι νῦν αἱ διώρυχες φόσσαι καὶ φόδερε τὸ σκάψαι καλεῖται· χρόνῳ δὲ τῶν δυεῖν φθόγγων μεταπεσόντων Φάβιοι προσηγορεύθησαν. πολλοὺς δὲ καὶ μεγάλους τῆς οἰκίας ἐξενεγκαμένης ἄνδρας, ἀπὸ Ῥούλλου τοῦ μεγίστου καὶ διὰ τοῦτο Μαξίμου παρὰ Ῥωμαίοις ἐπονομασθέντος τέταρτος ἦν Φάβιος Μάξιμος, περὶ οὗ τάδε γράφομεν. \n ἦν δʼ αὐτῷ σωματικὸν μὲν παρωνύμιον ὁ Βερρούκωσος· εἶχε γὰρ ἀκροχορδόνα μικρὰν ἐπάνω τοῦ χείλους ἐπιπεφυκυῖαν ὁ δὲ Ὀουικούλας σημαίνει μὲν τὸ προβάτων, ἐτέθη δὲ πρὸς τὴν πρᾳότητα καὶ βαρύτητα τοῦ ἤθους ἔτι παιδὸς ὄντος. τὸ γὰρ ἡσύχιον αὐτοῦ καὶ σιωπηλὸν καὶ μετὰ πολλῆς εὐλαβείας τῶν παιδικῶν ἁπτόμενον ἡδονῶν, βραδέως δὲ καὶ διαπόνως δεχόμενον τὰς μαθήσεις, εὔκολον δὲ πρὸς τοὺς συνήθεις καὶ κατήκοον ἀβελτερίας τινὸς καὶ νωθρότητος ὑπόνοιαν εἶχε παρὰ τοῖς ἐκτός· ὀλίγοι δʼ ἦσαν οἱ τὸ δυσκίνητον ὑπὸ βάθους καὶ τὸ μεγαλόψυχον καὶ λεοντῶδες ἐν τῇ φύσει καθορῶντες αὐτοῦ. \n ταχὺ δὲ τοῦ χρόνου προϊόντος ὑπὸ τῶν πραγμάτων ἐγειρόμενος διεσήμαινε καὶ τοῖς πολλοῖς ἀπάθειαν μὲν οὖσαν τὴν δοκοῦσαν ἀπραγίαν, εὐβουλίαν δὲ τὴν εὐλάβειαν, τὸ δὲ πρὸς μηδὲν ὀξὺ μηδʼ εὐκίνητον ἐν πᾶσι μόνιμον καὶ βέβαιον, ὁρῶν δὲ καὶ τῆς πολιτείας τὸ μέγεθος καὶ τῶν πολέμων τὸ πλῆθος, ἤσκει τὸ μὲν σῶμα πρὸς τοὺς πολέμους, ὥσπερ ὅπλον σύμφυτον, τὸν δὲ λόγον ὄργανον πειθοῦς πρὸς τὸν δῆμον, εὖ μάλα πρεπόντως τῷ βίῳ κατακεκοσμημένον. \n οὐ γὰρ ἐπῆν ὡραϊσμὸς οὐδὲ κενὴ καὶ ἀγοραῖος χάρις, ἀλλὰ νοῦς ἴδιον καὶ περιττὸν ἐν γνωμολογίαις σχῆμα καὶ βάθος ἔχων, ἃς μάλιστα ταῖς Θουκυδίδου προσεοικέναι λέγουσι. διασῴζεται γὰρ αὐτοῦ λόγος, ὃν εἶπεν ἐν τῷ δήμῳ, τοῦ παιδὸς αὐτοῦ μεθʼ ὑπατείαν ἀποθανόντος ἐγκώμιον."

        text: "πέντε δʼ ὑπατειῶν ἃς ὑπάτευσεν, ἡ πρώτη τὸν ἀπὸ Λιγύων θρίαμβον ἔσχεν, ἡττηθέντες γὰρ ὑπʼ αὐτοῦ μάχῃ καὶ πολλοὺς ἀποβαλόντες εἰς τὰς Ἄλπεις ἀνεστάλησαν, καὶ τὴν πρόσοικον ἐπαύσαντο τῆς Ἰταλίας ληϊζόμενοι καὶ κακῶς ποιοῦντες. \n ἐπεὶ δʼ Ἀννίβας ἐμβαλὼν εἰς Ἰταλίαν καὶ μάχῃ πρῶτον περὶ τὸν Τρεβίαν ποταμὸν ἐπικρατήσας αὐτὸς μὲν ἤλαυνε διὰ Τυρρηνίας πορθῶν τὴν χώραν, ἔκπληξιν δὲ δεινὴν καὶ φόβον εἰς τὴν Ῥώμην ἐνέβαλλε, σημεῖα δὲ τὰ μὲν συνήθη Ῥωμαίοις ἀπὸ κεραυνῶν, τὰ δʼ ὅλως ἐξηλλαγμένα καὶ πολλὴν ἀτοπίαν ἔχοντα προσέπιπτε \n (θυρεούς τε γὰρ ἀφʼ αὑτῶν αἵματι γενέσθαι διαβρόχους ἐλέχθη, καὶ θέρη σταχύων περὶ Ἄντιον ἔναιμα κείρεσθαι, καὶ λίθους μὲν ἐκ τοῦ ἀέρος διαπύρους καὶ φλεγομένους φέρεσθαι, τοῦ δʼ ὑπὲρ Φαλερίους οὐρανοῦ ῥαγῆναι δόξαντος ἐκπίπτειν καὶ διασπείρεσθαι πολλὰ γραμματεῖα, καὶ τούτων ἐν ἑνὶ γεγραμμένον φανῆναι κατὰ λέξιν Ἄρης τὰ ἑαυτοῦ ὅπλα σαλεύει), \n τὸν μὲν ὕπατον Γάιον Φλαμίνιον οὐδὲν ἤμβλυνε τούτων, ἄνδρα πρὸς τῷ φύσει θυμοειδεῖ καὶ φιλοτίμῳ μεγάλαις ἐπαιρόμενον εὐτυχίαις, ἃς πρόσθεν εὐτύχησε παραλόγως, τῆς τε βουλῆς ἀπᾳδούσης καὶ τοῦ συνάρχοντος ἐνισταμένου βίᾳ συμβαλὼν τοῖς Γαλάταις καὶ κρατήσας, Φάβιον δὲ τὰ μὲν σημεῖα, καίπερ ἁπτόμενα πολλῶν, ἧττον ὑπέθραττε διὰ τὴν ἀλογίαν· \n τὴν δʼ ὀλιγότητα τῶν πολεμίων καὶ τὴν ἀχρηματίαν πυνθανόμενος καρτερεῖν παρεκάλει τοὺς Ῥωμαίους καὶ μὴ μάχεσθαι πρὸς ἄνθρωπον ἐπʼ αὐτῷ τούτῳ διὰ πολλῶν ἀγώνων ἠσκημένῃ στρατιᾷ χρώμενον, ἀλλὰ τοῖς συμμάχοις ἐπιπέμποντας βοηθείας καὶ τὰς πόλεις διὰ χειρὸς ἔχοντας αὐτὴν ἐᾶν περὶ αὑτῇ μαραίνεσθαι τὴν ἀκμὴν τοῦ Ἀννίβου, καθάπερ φλόγα λάμψασαν ἀπὸ μικρᾶς καὶ κούφης δυνάμεως."

        text: "οὐ μὴν ἔπεισε τὸν Φλαμίνιον, ἀλλὰ φήσας οὐκ ἀνέξεσθαι προσιόντα τῇ Ῥώμῃ τὸν πόλεμον οὐδʼ, ὥσπερ ὁ παλαιὸς Κάμιλλος, ἐν τῇ πόλει διαμαχεῖσθαι περὶ αὐτῆς, τὸν μὲν στρατὸν ἐξάγειν ἐκέλευσε τοὺς χιλιάρχους, αὐτὸς ἐπὶ τὸν ἵππον ἀλλόμενος ἐξ οὐδενὸς αἰτίου προδήλου παραλόγως ἐντρόμου τοῦ ἵππου γενομένου καὶ πτυρέντος ἐξέπεσε καὶ κατενεχθεὶς ἐπὶ κεφαλὴν ὅμως οὐδὲν ἔτρεψε τῆς γνώμης, ἀλλʼ ὡς ὥρμησεν ἐξ ἀρχῆς ἀπαντῆσαι τῷ Ἀννίβᾳ, περὶ τὴν καλουμένην Θρασυμένην λίμνην τῆς Τυρρηνίας παρετάξατο. \n τῶν δὲ στρατιωτῶν συμβαλόντων εἰς χεῖρας ἅμα τῷ καιρῷ τῆς μάχης συνέπεσε σεισμός, ὑφʼ οὗ καὶ πόλεις ἀνετράπησαν καὶ ῥεύματα ποταμῶν ἐξ ἕδρας μετέστη καὶ κρημνῶν ὑπώρειαι περιρράγησαν. ἀλλὰ, καίπερ οὕτω γενομένου βιαίου τοῦ πάθους οὐδεὶς τὸ παράπαν ᾔσθετο τῶν μαχομένων, \n αὐτὸς μὲν οὖν ὁ Φλαμίνιος πολλὰ καὶ τόλμης ἔργα καὶ ῥώμης ἐπιδεικνύμενος ἔπεσε, καὶ περὶ αὐτὸν οἱ κράτιστοι· τῶν δʼ ἄλλων τραπέντων πολὺς ἦν φόνος, καὶ πεντακισχίλιοι πρὸς μυρίοις κατεκόπησαν, καὶ ἑάλωσαν ἕτεροι τοσοῦτοι, τὸ δὲ Φλαμινίου σῶμα φιλοτιμούμενος θάψαι καὶ κοσμῆσαι διʼ ἀρετὴν ὁ Ἀννίβας οὐχ εὗρεν ἐν τοῖς νεκροῖς, ἀλλʼ ἠγνοεῖτο τὸ παράπαν ὅπως ἠφανίσθη. \n τὴν μὲν οὖν ἐπὶ τοῦ Τρεβίου γενομένην ἧτταν οὔθʼ ὁ γράψας στρατηγὸς οὔθʼ ὁ πεμφθεὶς ἄγγελος ἀπʼ εὐθείας ἔφρασεν, ἀλλʼ ἐψεύσατο τὴν νίκην ἐπίδικον αὐτοῖς καὶ ἀμφίδοξον γενέσθαι· περὶ δὲ ταύτης ὡς πρῶτον ἤκουσεν ὁ στρατηγὸς Πομπώνιος, συναγαγὼν εἰς ἐκκλησίαν τὸν δῆμον οὐ περιπλοκὰς οὐδὲ παραγωγὰς ἀλλʼ ἄντικρυς ἔφη προσελθών Νενικήμεθα, ὦ ἄνδρες Ῥωμαῖοι, μεγάλῃ μάχῃ, καὶ διέφθαρται τὸ στρατόπεδον, καὶ Φλαμίνιος ὕπατος ἀπόλωλεν. ἀλλὰ βουλεύεσθε περὶ σωτηρίας αὑτῶν καὶ ἀσφαλείας. \n οὗτος μὲν οὖν ὥσπερ πνεῦμα τὸν λόγον ἐμβαλὼν εἰς πέλαγος τοσούτου δῆμου συνετάραξε τὴν πόλιν, οὐδʼ ἑστάναι πρὸς τοσαύτην ἔκπληξιν οἱ λογισμοὶ καὶ διαμένειν ἐδύναντο. πάντες δʼ εἰς μίαν γνώμην συνήχθησαν ἀνυπευθύνου δεῖσθαι τὰ πράγματα μοναρχίας, ἣν δικτατορίαν καλοῦσι, καὶ τοῦ μεταχειριουμένου ταύτην ἀθρύπτως καὶ ἀδεῶς ἀνδρός· \n εἶναι δὲ τοῦτον ἕνα Φάβιον Μάξιμον, ἰσόρροπον ἔχοντα, τῷ μεγέθει τῆς ἀρχῆς τὸ φρόνημα καὶ τὸ ἀξίωμα τοῦ ἤθους, ἡλικίας τε κατὰ τοῦτο γεγενημένον ἐν ᾧ συνέστηκεν ἔτι πρὸς τὰ τῆς ψυχῆς βουλεύματα τὸ σῶμα τῇ ῥώμῃ καὶ συγκέκραται τῷ φρονίμῳ τὸ θαρραλέον."

        text: "μετὰ ταῦτα γίνεται διαμαρτία τὸν Ἀννίβου. βουλόμενος γὰρ ἀποσπάσαι τὸν Φαβίου πορρωτέρω τὸ στράτευμα καὶ πεδίων ἐπιλαβέσθαι προνομὰς ἐχόντων, ἐκέλευσε τοὺς ὁδηγοὺς μετὰ δεῖπνον εὐθὺς ἡγεῖσθαι πρὸς τὸ Κασινάτον. οἱ δὲ τῆς φωνῆς διὰ βαρβαρισμὸν οὐκ ἐξακούσαντες ἀκριβῶς, ἐμβάλλουσιν αὐτοῦ τὴν δύναμιν φέροντες εἰς τὰ καταλήγοντα τῆς Καμπανίας εἰς πόλιν Κασιλῖνον, ἣν τέμνει ῥέων διὰ μέσης ποταμὸς, ὃν Οὐουλτοῦρνον οἱ Ῥωμαῖοι καλοῦσιν. \n ἔστι δʼ ἡ χώρα τὰ μὲν ἄλλα περιστεφὴς ὄρεσιν αὐλὼν δʼ ἀναπέπταται πρὸς τὴν θάλατταν, ἔνθα τὰ ἕλη καταδίδωσι τοῦ ποταμοῦ περιχεομένου, καὶ θῖνας ἄμμου βαθείας ἔχει, καὶ τελευτᾷ πρὸς αἰγιαλὸν κυματώδη καὶ δύσορμον. ἐνταῦθα καταβαίνοντος τοῦ Ἀννίβου περιελθὼν ἐμπειρίᾳ τῶν ὁδῶν ὁ Φάβιος τὴν μὲν διέξοδον ὁπλίτας τετρακισχιλίους ἐπιστήσας ἐνέφραξε, τὸν δʼ ἄλλον στρατὸν ὑπὲρ τῶν ἄλλων ἄκρων ἐν καλῷ καθίσας διὰ τῶν ἐλαφροτάτων καὶ προχειροτάτων ἐνέβαλε τοῖς ἐσχάτοις τῶν πολεμίων, καὶ συνετάραξεν ἅπαν τὸ στράτευμα, διέφθειρε δὲ περὶ ὀκτακοσίους. \n ἐκ τούτου βουλόμενος Ἀννίβας ἀπαγαγεῖν τὸ στράτευμα, καὶ τὴν διαμαρτίαν τοῦ τόπου νοήσας καὶ τὸν κίνδυνον, ἀνεσταύρωσε μὲν τοὺς ὁδηγούς, ἐκβιάζεσθαι δὲ τοὺς πολεμίους καὶ προσμάχεσθαι τῶν ὑπερβολῶν ἐγκρατεῖς ὄντας ἀπεγίνωσκε. δυσθύμως δὲ καὶ περιφόβως διακειμένων ἁπάντων, καὶ περιεστάναι σφᾶς πανταχθεν ἀφύκτους ἡγουμένων ἀπορίας, ἔγνω δολοῦν ἀπάτῃ τοὺς πολεμίους, ἦν δὲ τοιόνδε. \n βοῦς ὅσον δισχιλίας ἐκ τῶν αἰχμαλώτων ἐκέλευσε συλλαβόντας ἀναδῆσαι δᾷδα πρὸς ἕκαστον κέρας ἢ λύγων ἢ φρυγάνων αὔων φάκελον· εἶτα νυκτὸς, ὅταν ἀρθῇ σημεῖον, ἀνάψαντας ἐλαύνειν ἐπὶ τὰς ὑπερβολὰς παρὰ τὰ στενὰ καὶ τὰς φυλακὰς τῶν πολεμίων, ἅμα δὲ ταῦτα παρεσκεύαζον οἷς προσετέτακτο, καὶ τὸν ἄλλον αὐτὸς ἀναστήσας στρατὸν ἤδη σκότους ὄντος ἦγε σχολαίως. \n αἱ δὲ βόες, ἄχρι μὲν τὸ πῦρ ὀλίγον ἦν καὶ περιέκαιε τὴν ὕλην, ἀτρέμα προσεχώρουν ἐλαυνόμεναι πρὸς τὴν ὑπώρειαν, καὶ θαῦμα τοῖς καθορῶσι νομεῦσιν ἀπὸ τῶν ἄκρων καὶ βουκόλοις ἦσαν αἱ φλόγες ἄκροις ἐπιλάμπουσαι τοῖς κέρασιν, ὡς στρατοπέδου καθʼ ἕνα κόσμον ὑπὸ λαμπάδων πολλῶν βαδίζοντος. \n ἐπεὶ δὲ πυρούμενον τὸ κέρας ἄχρι ῥίζης διέδωκε τῇ σαρκὶ τὴν αἴσθησιν, καὶ πρὸς τὸν πόνον διαφέρουσαι καὶ τινάσσουσαι τὰς κεφαλὰς ἀνεπίμπλαντο πολλῆς ἀπʼ ἀλλήλων φλογός, οὐκ ἐνέμειναν τῇ τάξει τῆς πορείας, ἀλλʼ ἔκφοβοι καὶ περιαλγεῖς οὖσαι δρόμῳ κατὰ τῶν ὀρῶν ἐφέροντο, λαμπόμεναι μὲν οὐρὰς ἄκρας καὶ μέτωπα, πολλὴν δὲ τῆς ὕλης, διʼ ἧς ἔφευγον, ἀνάπτουσαι. \n δεινὸν οὖν ἧς θέαμα τοῖς παραφυλάττουσι τὰς ὑπερβολὰς Ῥωμαίοις· καὶ γὰρ αἱ φλόγες ἐῴκεσαν ὑπʼ ἀνθρώπων θεόντων διαφερομέναις λαμπάσι, καὶ θόρυβος ἧς ἐν αὐτοῖς πολὺς καὶ φόβος, ἀλλαχόθεν ἄλλους ἐπιφέρεσθαι τῶν πολεμίων σφίσι καὶ κυκλοῦσθαι πανταχόθεν ἡγουμένων, διὸ μένειν οὐκ ἐτόλμων, ἀλλὰ πρὸς τὸ μεῖζον ἀνεχώρουν στρατόπεδον προέμενοι τὰ στενά. καὶ κατὰ τοῦτο δὲ καιροῦ προσμίξαντες οἱ ψιλοὶ τοῦ Ἀννίβου τὰς ὑπερβολὰς κατέσχον, ἡ δʼ ἄλλη δύναμις ἤδη προσέβαινεν ἀδεῶς πολλὴν καὶ βαρεῖαν ἐφελκομένη λείαν."

        text: "τῷ δὲ Φαβίῳ συνέβη μὲν ἔτι νυκτὸς αἰσθέσθαι τὸν δόλον φεύγουσαι γὰρ ἔνιαι τῶν βοῶν σποράδες ἧκον αὐτῶν εἰς χεῖρας, ἐνέδρας δὲ δεδιὼς σκοταίους ἀτρέμα τὴν δύναμιν ἐν τοῖς ὅπλοις εἶχεν. ὡς δʼ ἦν ἡμέρα, διώκων ἐξήπτετο τῶν ἐσχάτων, καὶ συμπλοκαὶ περὶ τὰς δυσχωρίας ἐγίνοντο καὶ θόρυβος ἦν πολύς, ἕως παρʼ Ἀννίβου τῶν ὀρειβατεῖν δεινῶν Ἰβήρων ἄνδρες ἐλαφροὶ καὶ ποδώκεις πεμφθέντες ἀπὸ τοῦ στόματος εἰς βαρεῖς ὁπλίτας τοὺς Ῥωμαίους ἐνέβαλον, καὶ διαφθείραντες οὐκ ὀλίγους ἀπέστρεψαν τὸν Φάβιον. \n τότε δὴ μάλιστα κακῶς ἀκοῦσαι καὶ καταφρονηθῆναι συνέβη τὸν Φάβιον. τῆς γὰρ ἐν τοῖς ὅπλοις τόλμης ὑφιέμενος, ὡς γνώμῃ καὶ προνοίᾳ καταπολεμήσων τὸν Ἀννίβαν, αὐτὸς ἡττημένος τούτοις καὶ κατεστρατηγημένος ἐφαίνετο. βουλόμενος δὲ μᾶλλον ἐκκαῦσαι τὴν πρὸς αὐτὸν ὀργὴν τῶν Ῥωμαίων ὁ Ἀννίβας, ὡς ἦλθεν ἐπὶ τοὺς ἀγροὺς αὐτοῦ, τὰ μὲν ἄλλα πάντα καίειν καὶ διαφθείρειν ἐκέλευσεν, ἐκείνων δʼ ἀπεῖπεν ἅπτεσθαι μόνων, καὶ παρακατέστησε φυλακὴν οὐδὲν ἐῶσαν ἀδικεῖν οὐδὲ λαμβάνειν ἐκεῖθεν. \n ταῦτα προσδιέβαλε τὸν Φάβιον εἰς Ῥώμην ἀγγελθέντα· καὶ πολλὰ μὲν αὐτοῦ πρὸς τὸν ὄχλον οἱ δήμαρχοι κατεβόων, ἐπάγοντος μάλιστα Μετιλίου καὶ παροξύνοντος, οὐ κατὰ τὴν πρὸς Φάβιον ἔχθραν, ἀλλʼ οἰκεῖος ὢν Μινουκίου τοῦ ἱππάρχου τιμὴν ᾤετο καὶ δόξαν ἐκείνῳ φέρειν τὰς τούτου διαβολάς· ἐγεγόνει δὲ καὶ τῇ βουλῇ διʼ ὀργῆς οὐχ ἥκιστα μεμφομένῃ τὰς περὶ τῶν αἰχμαλώτων πρὸς Ἀννίβαν ὁμολογίας. \n ὡμολογήκεισαν γὰρ αὑτοῖς ἄνδρα μὲν ἀνδρὶ λύεσθαι τῶν ἁλισκομένων, εἰ δὲ πλείους οἱ ἕτεροι γένοιντο, διδόναι δραχμὰς ὑπὲρ ἑκάστου τὸν κομιζόμενον πεντήκοντα καὶ διακοσίας. ὡς οὖν γενομένης τῆς κατʼ ἄνδρα διαμείψεως εὑρέθησαν ὑπόλοιποι Ῥωμαίων παρʼ Ἀννίβᾳ τεσσαράκοντα καὶ διακόσιοι, τούτων ἡ σύγκλητος ἔγνω τὰ λύτρα μὴ πέμπειν, καὶ προσῃτιᾶτο τὸν Φάβιον ὡς οὐ πρεπόντως οὐδὲ λυσιτελῶς ἄνδρας ὑπὸ δειλίας πολεμίων ἄγραν γενομένους ἀνακομιζόμενον. \n ταῦτʼ ἀκούσας ὁ Φάβιος τὴν μὲν ὀργὴν ἔφερε πρᾴως τῶν πολιτῶν, χρήματα δʼ οὐκ ἔχων, διαψεύσασθαι δὲ τὸν Ἀννίβαν καὶ προέσθαι τοὺς πολίτας οὐχ ὑπομένων, ἔπεμψε τὸν υἱὸν εἰς Ῥώμην κελεύσας ἀποδόσθαι τοὺς ἀγροὺς καὶ τὸ ἀργύριον εὐθὺς ὡς αὐτὸν ἐπὶ τὸ στρατόπεδον κομίζειν. ἀποδομένου δὲ τοῦ νεανίσκου τὰ χωρία καὶ ταχέως ἐπανελθόντος ἀπέπεμψε τὰ λύτρα τῷ Ἀννίβᾳ καὶ τοὺς αἰχμαλώτους ἀπέλαβε· καὶ πολλῶν ἀποδιδόντων ὕστερον παρʼ οὐδενὸς ἔλαβεν, ἀλλʼ ἀφῆκε πᾶσι."

        text: "ὁ δὲ ταῦτα μὲν εἰρωνείαν ἡγεῖτο γεροντικήν· παραλαβὼν δὲ τὴν ἀποκληρωθεῖσαν δύναμιν ἰδίᾳ καὶ χωρὶς ἐστρατοπέδευσεν, οὐδὲν ἀγνοοῦντος τοῦ Ἀννίβου τῶν γινομένων, ἀλλὰ πᾶσιν ἐφεδρεύοντος. ἦν δὲ λόφος κατὰ μέσον καταληφθῆναι μὲν οὐ χαλεπός, ὀχυρὸς δὲ καταληφθεὶς στρατοπέδῳ καὶ διαρκὴς εἰς ἅπαντα, τὸ δὲ πέριξ πεδίον ὀφθῆναι μὲν ἄπωθεν ὁμαλὸν διὰ ψιλότητα καὶ λεῖον, ἔχον δέ τινας οὐ μεγάλας τάφρους ἐν αὑτῷ καὶ κοιλότητας ἄλλας. \n διὸ καὶ τὸν λόφον ἐκ τοῦ ῥᾴστου κρύφα κατασχεῖν παρόν οὐκ ἠθέλησεν ὁ Ἀννίβας, ἀλλʼ ἀπέλιπε μάχης ἐν μέσῳ πρόφασιν. ὡς δʼ εἶδε κεχωρισμένον τοῦ Φαβίου τὸν Μινούκιον, νυκτὸς μὲν εἰς τὰς τάφρους καὶ τὰς κοιλότητας κατέσπειρε τῶν στρατιωτῶν τινας, ἅμα δὲ τῇ ἡμέρᾳ φανερῶς ἔπεμψεν οὐ πολλοὺς καταληψομένους τὸν λόφον, ὡς ἐπαγάγοιτο συμπεσεῖν περὶ τοῦ τόπου τὸν Μινούκιον. \n ὃ δὴ καὶ συνέβη, πρῶτον μὲν γὰρ ἀπέστειλε τὴν κούφην στρατιάν, ἔπειτα τοὺς ἱππεῖς, τέλος δʼ ὁρῶν τὸν Ἀννίβαν παραβοηθοῦντα τοῖς ἐπὶ τοῦ λόφου πάσῃ κατέβαινε τῇ δυνάμει συντεταγμένος, καὶ μάχην καρτερὰν θέμενος ἠμύνετο τοὺς ἀπὸ τοῦ λόφου βάλλοντας, συμπλεκόμενος καὶ ἴσα φερόμενος, ἄχρι οὗ καλῶς ἠπατημένον ὁρῶν ὁ Ἀννίβας καὶ γυμνὰ παρέχοντα τοῖς ἐνεδρεύουσι τὰ νῶτα τὸ σημεῖον αἴρει. \n πρὸς δὲ τοῦτο πολλαχόθεν ἐξανισταμένων ἅμα καὶ μετὰ κραυγῆς προσφερομένων καὶ τοὺς ἐσχάτους ἀποκτιννύντων ἀδιήγητος κατεῖχε ταραχὴ καὶ πτοία τοὺς Ῥωμαίους, αὐτοῦ τε τοῦ Μινουκίου τὸ θράσος κατακέκλαστο, καὶ πρὸς ἄλλον ἄλλοτε τῶν ἡγεμόνων διεπάπταινεν, οὐδενὸς ἐν χώρᾳ μένειν τολμῶντος, ἀλλὰ πρὸς φυγὴν ὠθουμένων οὐ σωτήριον. οἱ γὰρ Νομάδες ἤδη κρατοῦντες κύκλῳ περιήλαυνον τὸ πεδίον καὶ τοὺς ἀποσκιδναμένους ἔκτεινον."

        text: "μετὰ δὲ τὴν μάχην Φάβιος μὲν ὅσους ἔκτεινε τῶν πολεμίων σκυλεύσας ἀνεχώρησεν, οὐδὲν ὑπερήφανον οὐδʼ ἐπαχθὲς εἰπὼν περὶ τοῦ συνάρχοντος· Μινούκιος δὲ τὴν αὑτοῦ στρατιὰν ἀθροίσας, ἄνδρες, ἔφη, συστρατιῶται, τὸ μ?ὲν ἁμαρτεῖν μηδὲν ἐν πράγμασι μεγάλοις μεῖζον ἢ κατʼ ἄνθρωπόν ἐστι, τὸ δʼ ἁμαρτόντα χρήσασθαι τοῖς πταίσμασι διδάγμασι πρὸς τὸ λοιπὸν ἀνδρὸς ἀγαθοῦ καὶ νοῦν ἔχοντος. \n ἐγὼ μὲν οὖν ὁμολογῶ μικρὰ μεμφόμενος τὴν τύχην περὶ μειζόνων ἐπαινεῖν. ἃ γὰρ οὐκ ᾐσθόμην χρόνον τοσοῦτον, ἡμέρας μέρει μικρῷ πεπαίδευμαι, γνοὺς ἐμαυτὸν οὐκ ἄρχειν ἑτέρων δυνάμενον, ἀλλʼ ἄρχοντος ἑτέρου δεόμενον καὶ φιλοτιμούμενον νικᾶν ὑφʼ ὧν ἡττᾶσθαι κάλλιον. ὑμῖν δὲ τῶν μὲν ἄλλων ἐστὶν ἄρχων ὁ δικτάτωρ, τῆς δὲ πρὸς ἐκεῖνον εὐχαριστίας αὐτὸς ἡγεμὼν ἔσομαι, πρῶτον ἐμαυτὸν εὐπειθῆ καὶ ποιοῦντα τὸ κελευόμενον ὑπʼ ἐκείνου παρεχόμενος. \n ταῦτʼ εἰπὼν καὶ τοὺς ἀετοὺς ἄρασθαι κελεύσας καὶ πάντας ἀκολουθεῖν, ἦγε πρὸς τὸν χάρακα τοῦ Φαβίου. καὶ παρελθὼν ἐντὸς ἐβάδιζεν ἐπὶ τὴν στρατηγικὴν σκηνήν, ὥστε θαυμάζειν καὶ διαπορεῖν πάντας. προελθόντος δὲ τοῦ Φαβίου θέμενος ἔμπροσθεν τὰς σημαίας αὐτὸς μὲν ἐκεῖνον πατέρα μεγάλῃ φωνῇ, οἱ δὲ στρατιῶται τοὺς στρατιώτας πάτρωνας ἠσπάζοντο. τοῦτο δʼ ἔστι τοῖς ἀπελευθέροις προσφώνημα πρὸς τοὺς ἀπελευθερώσαντας. \n ἡσυχίας δὲ γενομένης ὁ Μινούκιος εἶπε· δύο νίκας, ὦ δίκτατορ, τῇ σήμερον ἡμέρᾳ νενίκηκας, ἀνδρείᾳ μὲν Ἀννίβαν, εὐβουλίᾳ δὲ καὶ χρηστότητι τὸν συνάρχοντα· καὶ διʼ ἧς μὲν σέσωκας ἡμᾶς, διʼ ἧς δὲ πεπαίδευκας, ἡττωμένους αἰσχρὰν μὲν ἧτταν ὑπʼ ἐκείνου, καλὴν δὲ καὶ σωτήριον ὑπὸ σοῦ. \n πατέρα δή σε χρηστὸν προσαγορεύω, τιμιωτέραν οὐκ ἔχων προσηγορίαν, ἐπεὶ τῆς γε τοῦ τεκόντος χάριτος μείζων ἡ παρὰ σοῦ χάρις αὕτη. ἐγεννήθην μὲν γὰρ ὑπʼ ἐκείνου μόνος, σῴζομαι δὲ ὑπὸ σοῦ μετὰ τοσούτων ταῦτʼ εἰπὼν καὶ περιβαλὼν τὸν Φάβιον ἠσπάζετο. τὸ δʼ αὐτὸ καὶ τοὺς στρατιώτας ἦν ὁρᾶν πράττοντας· ἐνεφύοντο γὰρ ἀλλήλοις καὶ κατεφίλουν, ὥστε μεστὸν εἶναι χαρᾶς καὶ δακρύων ἡδίστων τὸ στρατόπεδον."

. ταύτην ἔχων τὴν προαίρεσιν ὁ Παῦλος ἐξῆλθεν ἐπὶ τὸν πόλεμον."

        label: "제 16장",
        text: "ἐν δὲ τῇ μάχῃ στρατηγήμασιν ἐχρήσατο, πρώτῳ μὲν τῷ ἀπὸ τοῦ τόπου, ποιησάμενος κατὰ νώτου τὸν ἄνεμον πρηστῆρι γὰρ ἐοικὼς φλέγοντι κατερρήγνυτο, καὶ τραχὺν ἐκ πεδίων ὑφάμμων καὶ ἀναπεπταμένων αἴρων κονιορτὸν ὑπὲρ τὴν φάλαγγα τῶν Καρχηδονίων ἐπὶ τοὺς Ῥωμαίους ἐώθει, καὶ προσέβαλλε τοῖς προσώποις ἀποστρεφομένοις καὶ συνταραττομένοις. \n δευτέρῳ δὲ τῷ περὶ τὴν τάξιν ὃ γὰρ ἦν ἰσχυρότατον αὐτῷ καὶ μαχιμώτατον τῆς δυνάμεως ἑκατέρωσε τοῦ μέσου τάξας, τὸ μέσον αὐτὸ συνεπλήρωσεν ἐκ τῶν ἀχρειοτάτων, ἐμβόλῳ τούτῳ προέχοντι πολὺ τῆς ἄλλης φάλαγγος χρησόμενος· εἴρητο δὲ τοῖς κρατίστοις, ὅταν τούτους διακόψαντες οἱ Ῥωμαῖοι καὶ φερόμενοι πρός τὸ εἶκον ἐκφερομένου τοῦ μέσου καὶ κόλπον λαμβάνοντος ἐντὸς γένωνται τῆς φάλαγγος, ὀξέως ἑκατέρωθεν ἐπιστρέψαντας ἐμβαλεῖν τε πλαγίοις καὶ περιπτύσσειν ὄπισθεν συγκλείοντας. \n ὃ δὴ καὶ δοκεῖ τὸν πλεῖστον ἀπεργάσασθαι φόνον. ὡς γὰρ ἐνέδωκε τὸ μέσον καὶ τοὺς Ῥωμαίους ἐδέξαντο διώκοντας, ἡ δὲ φάλαγξ τοῦ Ἀννίβου μεταβαλοῦσα τὸ σχῆμα μηνοειδὴς ἐγεγόνει καὶ τῶν ἐπιλέκτων οἱ ταξίαρχοι ταχὺ τοὺς μὲν ἐπʼ ἀσπίδα, τοὺς δʼ ἐπὶ δόρυ κλίναντες προσέπεσον κατὰ τὰ γυμνά, πάντας, ὅσοι μὴ τὴν κύκλωσιν ὑπεκκλίναντες ἔφθασαν, ἐν μέσῳ κατειργάσαντο καὶ διέφθειραν. \n λέγεται δὲ καὶ τοῖς ἱππεῦσι τῶν Ῥωμαίων σύμπτωμα παράλογον γενέσθαι, τὸν γὰρ Παῦλον, ὡς ἔοικε, τρωθεὶς ὁ ἵππος ἀπεσείσατο, καὶ τῶν περὶ αὐτὸν ἄλλος καὶ ἄλλος ἀπολιπὼν τὸν ἵππον πεζὸς τῷ ὑπάτῳ προσήμυνε. τοῦτο δʼ οἱ ἱππεῖς ἰδόντες, ὡς παραγγέλματος κοινοῦ δεδομένου, πάντες ἀποπηδήσαντες πεζοὶ συνεπλέκοντο τοῖς πολεμίοις. ἰδὼν δʼ ὁ Ἀννίβας, τοῦτ, ἔφη, μᾶλλον ἠβουλόμην ἢ εἰ δεδεμένους παρέλαβον. \n ἀλλὰ ταῦτα μὲν οἱ τὰς διεξοδικὰς γράψαντες ἱστορίας ἀπηγγέλκασι. τῶν δʼ ὑπάτων ὁ μὲν Βάρρων ὀλιγοστὸς ἀφίππευσεν εἰς Οὐενουσίαν πόλιν, ὁ δὲ Παῦλος ἐν τῷ βυθῷ καὶ κλύδωνι τῆς φυγῆς ἐκείνης βελῶν τε πολλῶν ἐπὶ τοῖς τραύμασιν ἐγκειμένων ἀνάπλεως, τὸ σῶμα καὶ τὴν ψυχὴν πένθει τοσούτῳ βαρυνόμενος, πρός τινι λίθῳ καθῆστο, τὸν ἐπισφάξοντα τῶν πολεμίων ἀναμένων. \n ἦν δὲ διʼ αἵματος πλῆθος, ᾧ συνεπέφυρτο τὴν κεφαλὴν καὶ τὸ πρόσωπον, οὐ πολλοῖς διάδηλος, ἀλλὰ καὶ φίλοι καὶ θεράποντες αὑτὸν ὑπʼ ἀγνοίας παρῆλθον. μόνος δὲ Κορνήλιος Λέντλος, εὐπατρίδης νέος, ἰδὼν καὶ προνοήσας ἀπεπήδησε τοῦ ἵππου, καὶ προσαγαγὼν παρεκάλει χρῆσθαι καὶ σῴζειν αὑτὸν τοῖς πολίταις ἄρχοντος ἀγαθοῦ τότε μάλιστα χρῄζουσιν. \n ὁ δὲ ταύτην μὲν ἀπετρίψατο τὴν δέησιν, καὶ τὸ μειράκιον αὖθις ἠνάγκασεν ἐπὶ τὸν ἵππον ἀναβῆναι δακρῦον, εἶτα δὲ τὴν δεξιὰν ἐμβαλὼν καὶ συνεξαναστάς, ἀπάγγελλε, εἶπεν, ὦ Λέντλε, Φαβίῳ Μαξίμῳ καὶ γενοῦ μάρτυς αὐτός, ὅτι Παῦλος Αἰμίλιος ἐνέμεινεν αὐτοῦ τοῖς λογισμοῖς ἄχρι τέλους καὶ τῶν ὁμολογηθέντων πρός ἐκεῖνον οὐδὲν ἔλυσεν, ἀλλʼ ἐνικήθη πρότερον ὑπὸ Βάρρωνος, εἶθʼ ὑπὸ Ἀννίβου. \n τοσαῦτʼ ἐπιστείλας τὸν μὲν Λέντλον ἀπέπεμψεν, αὐτὸς δὲ ῥίψας ἑαυτὸν εἰς τοὺς φονευομένους ἀπέθανε, λέγονται δὲ πεσεῖν μὲν ἐν τῇ μάχῃ Ῥωμαίων πεντακισμύριοι, ζῶντες δʼ ἁλῶναι τετρακισχίλιοι, καὶ μετὰ τὴν μάχην οἱ ληφθέντες ἐπʼ ἀμφοτέροις τοῖς στρατοπέδοις μυρίων οὐκ ἐλάττους."

τι τῆς στρατιᾶς ἔμελλεν ὁρμήσειν διὰ νυκτός· εἶτα χρησάμενος ὄρνισιν οὐκ αἰσίοις ἀπετράπη, καὶ μετὰ μικρὸν ἐπεγνώσθη τὰ γράμματα πρὸς αὐτὸν ὑπʼ Ἀννίβου δόλῳ συντεθέντα κἀκεῖνος ἐνεδρεύων αὐτὸν ὑπὸ τὴν πόλιν. ἀλλὰ ταῦτα μὲν ἄν τις εὐνοίᾳ θεῶν ἀναθείη."

αθημένοις, τὸ δὲ λοιπὸν ἐφʼ ἑτέρῳ ποιήσομαι τὴν φρουράν. \n θαυμάζοντος δὲ τοῦ στρατιώτου προαγαγὼν τὴν ἄνθρωπον ἐνεχείρισεν αὐτῷ καὶ εἶπεν αὕτη μὲν ἐγγυᾶταί σε μενεῖν ἐν τῷ στρατοπέδῳ μεθʼ ἡμῶν σὺ δʼ ἔργῳ δείξεις, εἰ μὴ διʼ ἄλλην τινὰ μοχθηρίαν ἀπέλειπες, ὁ δʼ ἔρως καὶ αὕτη πρόφασις ἦν λεγομένη ταῦτα μὲν περὶ τούτων ἱστοροῦσι."

        text: "ἀλλὰ Σκηπίων μὲν οὐ μετὰ πολὺν χρόνον αὐτόν τε νικήσας μάχῃ κατὰ κράτος Ἀννίβαν καὶ καταβαλὼν τὸ φρόνημα καὶ καταπατήσας τῆς Καρχηδόνος ὑποπεσούσης, ἀπέδωκε μείζονα χαρὰν ἁπάσης ἐλπίδος τοῖς πολίταις, καὶ τὴν ἡγεμονίαν ὡς ἀληθῶς πολλῷ σάλῳ σεισθεῖσαν ὤρθωσε πάλιν· Φάβιος δὲ Μάξιμος οὐ διήρκεσε τῷ βίῳ πρὸς τὸ τοῦ πολέμου τέλος, οὐδʼ ἤκουσεν Ἀννίβαν ἡττημένον, οὐδὲ τὴν μεγάλην καὶ βέβαιον εὐτυχίαν τῆς πατρίδος ἐπεῖδεν, ἀλλὰ περὶ ὃν χρόνον Ἀννίβας ἀπῆρεν ἐξ Ἰταλίας νόσῳ καμὼν ἐτελεύτησεν. \n Ἐπαμεινώνδαν μὲν οὖν Θηβαῖοι δημοσίᾳ διὰ πενίαν, ἣν ἀπέλιπεν ὁ ἀνὴρ, ἔθαψαν οὐδὲν γὰρ οἴκοι τελευτήσαντος εὑρεθῆναι πλὴν ὀβελίσκον σιδηροῦν λέγουσι· Φάβιον δὲ Ῥωμαῖοι δημοσίᾳ μὲν οὐκ ἐκήδευσαν, ἰδίᾳ ὁ ἑκάστου τὸ σμικρότατον αὐτῷ τῶν νομισμάτων ἐπενεγκόντος, οὐχ ὡς διʼ ἔνδειαν προσαρκούντων, ἀλλʼ ὡς πατέρα τοῦ δήμου θάπτοντος, ἔσχε τιμὴν καὶ δόξαν ὁ θάνατος αὐτοῦ τῷ βίῳ πρέπουσαν."

    sections: [

        n: "1",
        label: "1장",
        text: "1 ΕΝ ΑΡΧΗ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.\n2 Οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.\n3 πάντα διʼ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν.\n4 ὃ γέγονεν ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·\n5 καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.\n6 Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάνης·\n7 οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν διʼ αὐτοῦ.\n8 οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλʼ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.\n9 Ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.\n10 ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος διʼ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.\n11 Εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.\n12 ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,\n13 οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλʼ ἐκ θεοῦ ἐγεννήθησαν.\n14 Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·\n15 (Ἰωάνης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων — οὗτος ἦν ὁ εἰπών — Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν)·\n16 ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·\n17 ὅτι ὁ νόμος διὰ Μωυσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.\n18 θεὸν οὐδεὶς ἑώρακεν πώποτε· μονογενὴς θεὸς ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.\n19 Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάνου ὅτε ἀπέστειλαν πρὸς αὐτὸν οἱ Ἰουδαῖοι ἐξ Ἰεροσολύμων ἱερεῖς καὶ Λευείτας ἵνα ἐρωτήσωσιν αὐτόν Σὺ τίς εἶ;\n20 καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι Ἐγὼ οὐκ εἰμὶ ὁ χριστός.\n21 καὶ ἠρώτησαν αὐτόν Τί οὖν; [σὺ] Ἠλείας εἶ; καὶ λέγει Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη Οὔ.\n22 εἶπαν οὖν αὐτῷ Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;\n23 ἔφη Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ Εὐθύνατε τὴν ὁδὸν Κυρίου, καθὼς εἶπεν Ἠσαίας ὁ προφήτης.\n24 Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.\n25 καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς οὐδὲ Ἠλείας οὐδὲ ὁ προφήτης;\n26 ἀπεκρίθη αὐτοῖς ὁ Ἰωάνης λέγων Ἐγὼ βαπτίζω ἐν ὕδατι· μέσος ὑμῶν στήκει ὃν ὑμεῖς οὐκ οἴδατε,\n27 ὀπίσω μου ἐρχόμενος, οὗ οὐκ εἰμὶ [ἐγὼ] ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.\n28 Ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ὁ Ἰωάνης βαπτίζων.\n29 Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.\n30 οὗτός ἐστιν ὑπὲρ οὗ ἐγὼ εἶπον Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·\n31 κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλʼ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ἐν ὕδατι βαπτίζων.\n32 Καὶ ἐμαρτύρησεν Ἰωάνης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπʼ αὐτόν·\n33 κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλʼ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν Ἐφʼ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπʼ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·\n34 κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.\n35 Τῇ ἐπαύριον πάλιν ἱστήκει Ἰωάνης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,\n36 καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.\n37 καὶ ἤκουσαν οἱ δύο μαθηταὶ αὐτοῦ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.\n38 στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ Ῥαββεί, (ὃ λέγεται μεθερμηνευόμενον Διδάσκαλε,) ποῦ μένεις;\n39 λέγει αὐτοῖς Ἔρχεσθε καὶ ὄψεσθε. ἦλθαν οὖν καὶ εἶδαν ποῦ μένει, καὶ παρʼ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.\n40 Ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάνου καὶ ἀκολουθησάντων αὐτῷ·\n41 εὑρίσκει οὗτος πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον Χριστός).\n42 ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάνου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).\n43 Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς Ἀκολούθει μοι.\n44 ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαιδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.\n45 εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ Ὃν ἔγραψεν Μωυσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.\n46 καὶ εἶπεν αὐτῷ Ναθαναήλ Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ὁ Φίλιππος Ἔρχου καὶ ἴδε.\n47 εἶδεν Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ Ἴδε ἀληθῶς Ἰσραηλείτης ἐν ᾧ δόλος οὐκ ἔστιν.\n48 λέγει αὐτῷ Ναθαναήλ Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.\n49 ἀπεκρίθη αὐτῷ Ναθαναήλ Ῥαββεί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ βασιλεὺς εἶ τοῦ Ἰσραήλ.\n50 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ Ὅτι εἶπόν σοι ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ὄψῃ.\n51 καὶ λέγει αὐτῷ Ἀμὴν ἀμὴν λέγω ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου."

      {
        n: "2",
        label: "2장",
        text: "1 Καὶ τῇ ἡμέρᾳ τῇ τρίτῃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·\n2 ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.\n3 καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν Οἶνον οὐκ ἔχουσιν.\n4 καὶ λέγει αὐτῇ ὁ Ἰησοῦς Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.\n5 λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις Ὅτι ἂν λέγῃ ὑμῖν ποιήσατε.\n6 ἦσαν δὲ ἐκεῖ λίθιναι ὑδρίαι ἓξ κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.\n7 λέγει αὐτοῖς ὁ Ἰησοῦς Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.\n8 καὶ λέγει αὐτοῖς Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· οἱ δὲ ἤνεγκαν.\n9 ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος\n10 καὶ λέγει αὐτῷ Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.\n11 Ταύτην ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.\n12 ΜΕΤΑ ΤΟΥΤΟ κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.\n13 Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἰεροσόλυμα ὁ Ἰησοῦς.\n14 καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,\n15 καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν τὰ κέρματα καὶ τὰς τραπέζας ἀνέτρεψεν,\n16 καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.\n17 Ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.\n18 Ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;\n19 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς Λύσατε τὸν ναὸν τοῦτον καὶ [ἐν] τρισὶν ἡμέραις ἐγερῶ αὐτόν.\n20 εἶπαν οὖν οἱ Ἰουδαῖοι Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;\n21 ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.\n22 Ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ὃν εἶπεν ὁ Ἰησοῦς.\n23 Ὡς δὲ ἦν ἐν τοῖς Ἰεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·\n24 αὐτὸς δὲ Ἰησοῦς οὐκ ἐπίστευεν αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας\n25 καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ."

      {
        n: "3",
        label: "3장",
        text: "1 Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·\n2 οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ Ῥαββεί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ δύναται ταῦτα τὰ σημεῖα ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετʼ αὐτοῦ.\n3 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.\n4 λέγει πρὸς αὐτὸν [ὁ] Νικόδημος Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;\n5 ἀπεκρίθη [ὁ] Ἰησοῦς Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.\n6 τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.\n7 μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.\n8 τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλʼ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.\n9 ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ Πῶς δύναται ταῦτα γενέσθαι;\n10 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;\n11 ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.\n12 εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;\n13 καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ἀνθρώπου.\n14 καὶ καθὼς Μωυσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,\n15 ἵνα πᾶς ὁ πιστεύων ἐν αὐτῷ ἔχῃ ζωὴν αἰώνιον.\n16 Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.\n17 οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλʼ ἵνα σωθῇ ὁ κόσμος διʼ αὐτοῦ.\n18 ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται. ὁ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.\n19 αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ αὐτῶν πονηρὰ τὰ ἔργα.\n20 πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·\n21 ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστὶν εἰργασμένα.\n22 Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετʼ αὐτῶν καὶ ἐβάπτιζεν.\n23 ἦν δὲ καὶ [ὁ] Ἰωάνης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·\n24 οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν Ἰωάνης.\n25 Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάνου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.\n26 καὶ ἦλθαν πρὸς τὸν Ἰωάνην καὶ εἶπαν αὐτῷ Ῥαββεί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.\n27 ἀπεκρίθη Ἰωάνης καὶ εἶπεν Οὐ δύναται ἄνθρωπος λαμβάνειν οὐδὲν ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.\n28 αὐτοὶ ὑμεῖς μοι μαρτυρεῖτε ὅτι εἶπον [ἐγώ] Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλʼ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.\n29 ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου, ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.\n30 ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.\n31 Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστὶν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·\n32 ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.\n33 ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.\n34 ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου δίδωσιν τὸ πνεῦμα.\n35 ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.\n36 ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλʼ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπʼ αὐτόν."

        text: "1 Ὡς οὖν ἔγνω ὁ κύριος ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει [ἢ] Ἰωάνης,\n2 — καίτοιγε Ἰησοῦς αὐτὸς οὐκ ἐβάπτιζεν ἀλλʼ οἱ μαθηταὶ αὐτοῦ,\n3 — ἀφῆκεν τὴν Ἰουδαίαν καὶ ἀπῆλθεν πάλιν εἰς τὴν Γαλιλαίαν.\n4 Ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρίας.\n5 ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρίας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ [τῷ] Ἰωσὴφ τῷ υἱῷ αὐτοῦ·\n6 ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ὡς ἕκτη.\n7 ἔρχεται γυνὴ ἐκ τῆς Σαμαρίας ἀντλῆσαι ὕδωρ.\n8 λέγει αὐτῇ ὁ Ἰησοῦς Δός μοι πεῖν· οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.\n9 λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρεῖτις Πῶς σὺ Ἰουδαῖος ὢν παρʼ ἐμοῦ πεῖν αἰτεῖς γυναικὸς Σαμαρείτιδος οὔσης; [οὐ γὰρ συνχρῶνται Ἰουδαῖοι Σαμαρείταις.]\n10 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.\n11 λέγει αὐτῷ Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;\n12 μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;\n13 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·\n14 ὃς δʼ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.\n15 λέγει πρὸς αὐτὸν ἡ γυνή Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ διέρχωμαι ἐνθάδε ἀντλεῖν.\n16 λέγει αὐτῇ Ὕπαγε φώνησόν σου τὸν ἄνδρα καὶ ἐλθὲ ἐνθάδε.\n17 ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν [αὐτῷ] Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς Καλῶς εἶπες ὅτι Ἄνδρα οὐκ ἔχω·\n18 πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.\n19 λέγει αὐτῷ ἡ γυνή Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.\n20 οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἰεροσολύμοις ἐστὶν ὁ τόπος ὅπου προσκυνεῖν δεῖ.\n21 λέγει αὐτῇ ὁ Ἰησοῦς Πίστευέ μοι, γύναι, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἰεροσολύμοις προσκυνήσετε τῷ πατρί.\n22 ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·\n23 ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστίν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·\n24 πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.\n25 λέγει αὐτῷ ἡ γυνή Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος Χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ἅπαντα.\n26 λέγει αὐτῇ ὁ Ἰησοῦς Ἐγώ εἰμι, ὁ λαλῶν σοι.\n27 Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν Τί ζητεῖς; ἤ Τί λαλεῖς μετʼ αὐτῆς;\n28 ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις\n29 Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ἃ ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;\n30 ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.\n31 Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες Ῥαββεί, φάγε.\n32 ὁ δὲ εἶπεν αὐτοῖς Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.\n33 ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους Μή τις ἤνεγκεν αὐτῷ φαγεῖν;\n34 λέγει αὐτοῖς ὁ Ἰησοῦς Ἐμὸν βρῶμά ἐστιν ἵνα ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.\n35 οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν·\n36 ἤδη ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.\n37 ἐν γὰρ τούτῳ ὁ λόγος ἐστὶν ἀληθινὸς ὅτι ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·\n38 ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.\n39 Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαρειτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ἃ ἐποίησα.\n40 ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρεῖται, ἠρώτων αὐτὸν μεῖναι παρʼ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.\n41 καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,\n42 τῇ τε γυναικὶ ἔλεγον [ὅτι] Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ κόσμου.\n43 Μετὰ δὲ τας δύο ἡμέρας ἐξῆλθεν ἐκεῖθεν εἰς τὴν Γαλιλαίαν·\n44 αὐτὸς γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.\n45 ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ὅσα ἐποίησεν ἐν Ἰεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.\n46 Ἦλθεν οὖν πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. Καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ·\n47 οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνήσκειν.\n48 εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.\n49 λέγει πρὸς αὐτὸν ὁ βασιλικός Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.\n50 λέγει αὐτῷ ὁ Ἰησοῦς Πορεύου· ὁ υἱός σου ζῇ. ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.\n51 ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ὑπήντησαν αὐτῷ λέγοντες ὅτι ὁ παῖς αὐτοῦ ζῇ.\n52 ἐπύθετο οὖν τὴν ὥραν παρʼ αὐτῶν ἐν ᾗ κομψότερον ἔσχεν· εἶπαν οὖν αὐτῷ ὅτι Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.\n53 ἔγνω οὖν ὁ πατὴρ ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ Ἰησοῦς Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.\n54 Τοῦτο [δὲ] πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν."

        text: "1 ΜΕΤΑ ΤΑΥΤΑ ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ἀνέβη Ἰησοῦς εἰς Ἰεροσόλυμα.\n2 Ἔστιν δὲ ἐν τοῖς Ἰεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἐβραϊστὶ Βηθζαθά, πέντε στοὰς ἔχουσα·\n3 ἐν ταύταις κατέκειτο πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ξηρῶν.\n4 \n5 ἦν δέ τις ἄνθρωπος ἐκεῖ τριάκοντα [καὶ] ὀκτὼ ἔτη ἔχων ἐν τῇ ἀσθενείᾳ αὐτοῦ·\n6 τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ Θέλεις ὑγιὴς γενέσθαι;\n7 ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.\n8 λέγει αὐτῷ ὁ Ἰησοῦς Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.\n9 καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος, καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.\n10 ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ Σάββατόν ἐστιν, καὶ οὐκ ἔξεστίν σοι ἆραι τὸν κράβαττον.\n11 ὃς δὲ ἀπεκρίθη αὐτοῖς Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.\n12 ἠρώτησαν αὐτόν Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι Ἆρον καὶ περιπάτει;\n13 ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.\n14 Μετὰ ταῦτα εὑρίσκει αὐτὸν [ὁ] Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν σοί τι γένηται,\n15 ἀπῆλθεν ὁ ἄνθρωπος καὶ εἶπεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστὶν ὁ ποιήσας αὐτὸν ὑγιῆ.\n16 καὶ διὰ τοῦτο ἐδίωκον οἱ Ἰουδαῖοι τὸν Ἰησοῦν ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.\n17 ὁ δὲ ἀπεκρίνατο αὐτοῖς Ὁ πατήρ μου ἕως ἄρτι ἐργάζεται, κἀγὼ ἐργάζομαι.\n18 διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.\n19 Ἀπεκρίνατο οὖν [ὁ Ἰησοῦς] καὶ ἔλεγεν αὐτοῖς Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφʼ ἑαυτοῦ οὐδὲν ἂν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.\n20 ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.\n21 ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζωοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζωοποιεῖ.\n22 οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,\n23 ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.\n24 Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.\n25 ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστὶν ὅτε οἱ νεκροὶ ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ζήσουσιν.\n26 ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως καὶ τῷ υἱῷ ἔδωκεν ζωὴν ἔχειν ἐν ἑαυτῷ·\n27 καὶ ἐξουσίαν ἔδωκεν αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.\n28 μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ἀκούσουσιν τῆς φωνῆς αὐτοῦ\n29 καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.\n30 Οὐ δύναμαι ἐγὼ ποιεῖν ἀπʼ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με.\n31 Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·\n32 ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.\n33 ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάνην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·\n34 ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.\n35 ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·\n36 ἐγὼ δὲ ἔχω τὴν μαρτυρίαν μείζω τοῦ Ἰωάνου, τὰ γὰρ ἔργα ἃ δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,\n37 καὶ ὁ πέμψας με πατὴρ ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ πώποτε ἀκηκόατε οὔτε εἶδος αὐτοῦ ἑωράκατε,\n38 καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ἐν ὑμῖν μένοντα, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.\n39 ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·\n40 καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.\n41 Δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,\n42 ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.\n43 ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.\n44 πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρʼ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου [θεοῦ] οὐ ζητεῖτε;\n45 μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωυσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.\n46 εἰ γὰρ ἐπιστεύετε Μωυσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.\n47 εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;"

        label: "6장",
        text: "1 Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.\n2 ἠκολούθει δὲ αὐτῷ ὄχλος πολύς, ὅτι ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.\n3 ἀνῆλθεν δὲ εἰς τὸ ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.\n4 ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.\n5 ἐπάρας οὖν τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει πρὸς Φίλιππον Πόθεν ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;\n6 τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.\n7 ἀπεκρίθη αὐτῷ Φίλιππος Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ἕκαστος βραχὺ λάβῃ.\n8 λέγει αὐτῷ εἷς ἐκ τῶν μαθητῶν αὐτοῦ, Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου\n9 Ἔστιν παιδάριον ὧδε ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;\n10 εἶπεν ὁ Ἰησοῦς Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ὡς πεντακισχίλιοι.\n11 ἔλαβεν οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.\n12 ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.\n13 συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν.\n14 Οἱ οὖν ἄνθρωποι ἰδόντες ἃ ἐποίησεν σημεῖα ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.\n15 Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ποιήσωσιν βασιλέα ἀνεχώρησεν πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.\n16 Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,\n17 καὶ ἐμβάντες εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία\n18 ἤδη ἐγεγόνει καὶ οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς, ἥ τε θάλασσα ἀνέμου μεγάλου πνέοντος διεγείρετο.\n19 ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.\n20 ὁ δὲ λέγει αὐτοῖς Ἐγώ εἰμι, μὴ φοβεῖσθε.\n21 ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.\n22 Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·\n23 ἀλλὰ ἦλθεν πλοῖα ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.\n24 ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.\n25 καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ Ῥαββεί, πότε ὧδε γέγονας;\n26 ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλʼ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·\n27 ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.\n28 εἶπον οὖν πρὸς αὐτόν Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;\n29 ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.\n30 εἶπον οὖν αὐτῷ Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;\n31 οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.\n32 εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωυσῆς ἔδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλʼ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·\n33 ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστὶν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.\n34 εἶπον οὖν πρὸς αὐτόν Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.\n35 εἶπεν αὐτοῖς ὁ Ἰησοῦς Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ἐμὲ οὐ μὴ διψήσει πώποτε.\n36 ἀλλʼ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ [με] καὶ οὐ πιστεύετε.\n37 Πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός με οὐ μὴ ἐκβάλω ἔξω,\n38 ὅτι καταβέβηκα ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·\n39 τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.\n40 τοῦτο γάρ ἐστιν τὸ θέλημα τοῦ πατρός μου ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.\n41 Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ, καὶ ἔλεγον\n42 Οὐχὶ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς νῦν λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;\n43 ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς Μὴ γογγύζετε μετʼ ἀλλήλων.\n44 οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.\n45 ἔστιν γεγραμμένον ἐν τοῖς προφήταις Καὶ ἔσονται πάντες. διδακτοὶ θεοῦ· πᾶς ὁ ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ἐμέ.\n46 οὐχ ὅτι τὸν πατέρα ἑώρακέν τις εἰ μὴ ὁ ὢν παρὰ [τοῦ] θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.\n47 ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων ἔχει ζωὴν αἰώνιον.\n48 ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς·\n49 οἱ πατέρες ὑμῶν ἔφαγον ἐν τῇ ἐρήμῳ τὸ μάννα καὶ ἀπέθανον·\n50 οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·\n51 ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μου ἐστὶν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.\n52 Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα [αὐτοῦ] φαγεῖν;\n53 εἶπεν οὖν αὐτοῖς [ὁ] Ἰησοῦς Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.\n54 ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ·\n55 ἡ γὰρ σάρξ μου ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ἀληθής ἐστι πόσις.\n56 ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.\n57 καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ζήσει διʼ ἐμέ.\n58 οὗτός ἐστιν ὁ ἄρτος ὁ ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ζήσει εἰς τὸν αἰῶνα.\n59 Ταῦτα εἶπεν ἐν συναγωγῇ διδάσκων ἐν Καφαρναούμ.\n60 Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν Σκληρός ἐστιν ὁ λόγος οὗτος· τίς δύναται αὐτοῦ ἀκούειν;\n61 εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς Τοῦτο ὑμᾶς σκανδαλίζει;\n62 ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;\n63 τὸ πνεῦμά ἐστιν τὸ ζωοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν·\n64 ἀλλὰ εἰσὶν ἐξ ὑμῶν τινὲς οἳ οὐ πιστεύουσιν. Ἤιδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.\n65 καὶ ἔλεγεν Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ πατρός.\n66 Ἐκ τούτου πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ ἀπῆλθον εἰς τὰ ὀπίσω καὶ οὐκέτι μετʼ αὐτοῦ περιεπάτουν.\n67 Εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;\n68 ἀπεκρίθη αὐτῷ Σίμων Πέτρος Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,\n69 καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ἅγιος τοῦ θεοῦ.\n70 ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.\n71 ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν παραδιδόναι αὐτόν, εἷς ἐκ τῶν δώδεκα."

        text: "1 ΚΑΙ ΜΕΤΑ ΤΑΥΤΑ περιεπάτει [ὁ] Ἰησοῦς ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἰ Ἰουδαῖοι ἀποκτεῖναι.\n2 ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.\n3 εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου θεωρήσουσιν [σοῦ] τὰ ἔργα ἃ ποιεῖς·\n4 οὐδεὶς γάρ τι ἐν κρυπτῷ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.\n5 οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.\n6 λέγει οὖν αὐτοῖς ὁ Ἰησοῦς Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.\n7 οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.\n8 ὑμεῖς ἀνάβητε εἰς τὴν ἑορτήν· ἐγὼ οὔπω ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ἐμὸς καιρὸς οὔπω πεπλήρωται.\n9 ταῦτα δὲ εἰπὼν αὐτοῖς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.\n10 Ὡς δὲ ἀνέβησαν οἰ ἀδελφοὶ αὐτοῦ εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.\n11 οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον Ποῦ ἐστὶν ἐκεῖνος;\n12 καὶ γογγυσμὸς περὶ αὐτοῦ ἦν πολὺς ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι [δὲ] ἔλεγον Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.\n13 οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.\n14 Ἤδη δὲ τῆς ἑορτῆς μεσούσης ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.\n15 ἐθαύμαζον οὖν οἱ Ἰουδαῖοι λέγοντες Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;\n16 ἀπεκρίθη οὖν αὐτοῖς Ἰησοῦς καὶ εἶπεν Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·\n17 ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστὶν ἢ ἐγὼ ἀπʼ ἐμαυτοῦ λαλῶ.\n18 ὁ ἀφʼ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.\n19 οὐ Μωυσῆς ἔδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;\n20 ἀπεκρίθη ὁ ὄχλος Δαιμόνιον ἔχεις· τίς σε ζητεῖ\n21 ἀποκτεῖναι; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.\n22 διὰ τοῦτο Μωυσῆς δέδωκεν ὑμῖν τὴν περιτομήν, — οὐχ ὅτι ἐκ τοῦ Μωυσέως ἐστὶν ἀλλʼ ἐκ τῶν πατέρων, — καὶ [ἐν] σαββάτῳ περιτέμνετε ἄνθρωπον.\n23 εἰ περιτομὴν λαμβάνει [ὁ] ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωυσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;\n24 μὴ κρίνετε κατʼ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν κρίνετε.\n25 Ἔλεγον οὖν τινὲς ἐκ τῶν Ἰεροσολυμειτῶν Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;\n26 καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μή ποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ἐστιν ὁ χριστός;\n27 ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.\n28 Ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων [ὁ] Ἰησοῦς καὶ λέγων Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπʼ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλʼ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·\n29 ἐγὼ οἶδα αὐτόν, ὅτι παρʼ αὐτοῦ εἰμὶ κἀκεῖνός με ἀπέστειλεν.\n30 Ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπʼ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.\n31 Ἐκ τοῦ ὄχλου δὲ πολλοὶ ἐπίστευσαν εἰς αὐτόν, καὶ ἔλεγον Ὁ χριστὸς ὅταν ἔλθῃ μὴ πλείονα σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;\n32 Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας ἵνα πιάσωσιν αὐτόν.\n33 εἶπεν οὖν ὁ Ἰησοῦς Ἔτι χρόνον μικρὸν μεθʼ ὑμῶν εἰμὶ καὶ ὑπάγω πρὸς τὸν πέμψαντά με.\n34 ζητήσετέ με καὶ οὐχ εὑρήσετέ με, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.\n35 εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;\n36 τίς ἐστιν ὁ λόγος οὗτος ὃν εἶπε Ζητήσετέ με καὶ οὐχ εὑρήσετέ με καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;\n37 Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς ἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.\n38 ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.\n39 Τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος οὗ ἔμελλον λαμβάνειν οἱ πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν πνεῦμα, ὅτι Ἰησοῦς οὔπω ἐδοξάσθη.\n40 Ἐκ τοῦ ὄχλου οὖν ἀκούσαντες τῶν λόγων τούτων ἔλεγον [ὅτι] Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·\n41 ἄλλοι ἔλεγον Οὗτός ἐστιν ὁ χριστός· οἱ δὲ ἔλεγον Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;\n42 οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυείδ, καὶ ἀπὸ Βηθλεὲμ τῆς κώμης ὅπου ἦν Δαυείδ, ἔρχεται ὁ χριστός;\n43 σχίσμα οὖν ἐγένετο ἐν τῷ ὄχλῳ διʼ αὐτόν.\n44 τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλʼ οὐδεὶς ἔβαλεν ἐπʼ αὐτὸν τὰς χεῖρας.\n45 Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι Διὰ τί οὐκ ἠγάγετε αὐτόν;\n46 ἀπεκρίθησαν οἱ ὑπηρέται Οὐδέποτε ἐλάλησεν οὕτως ἄνθρωπος.\n47 ἀπεκρίθησαν οὖν [αὐτοῖς] οἱ Φαρισαῖοι Μὴ καὶ ὑμεῖς πεπλάνησθε;\n48 μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;\n49 ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ἐπάρατοί εἰσιν.\n50 λέγει Νικόδημος πρὸς αὐτούς, ὁ ἐλθὼν πρὸς αὐτὸν πρότερον, εἷς ὢν ἐξ αὐτῶν\n51 Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ πρῶτον παρʼ αὐτοῦ καὶ γνῷ τί ποιεῖ;\n52 ἀπεκρίθησαν καὶ εἶπαν αὐτῷ Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ἐκ τῆς Γαλιλαίας προφήτης οὐκ ἐγείρεται\n53 ⟦ΚΑΙ ΕΠΟΡΕΥΘΗΣΑΝ ἕκαστος εἰς τὸν οἶκον αὐτοῦ,"

        text: "ΣΩ. τί τηνικάδε ἀφῖξαι, ὦ Κρίτων; ἢ οὐ πρῲ ἔτι ἐστίν;\n ΚΡ. πάνυ μὲν οὖν.\n ΣΩ. πηνίκα μάλιστα;\n ΚΡ. ὄρθρος βαθύς.\n ΣΩ. θαυμάζω ὅπως ἠθέλησέ σοι ὁ τοῦ δεσμωτηρίου φύλαξ ὑπακοῦσαι.\n ΚΡ. συνήθης ἤδη μοί ἐστιν, ὦ Σώκρατες, διὰ τὸ πολλάκις δεῦρο φοιτᾶν, καί τι καὶ εὐεργέτηται ὑπʼ ἐμοῦ.\n ΣΩ. ἄρτι δὲ ἥκεις ἢ πάλαι;\n ΚΡ. ἐπιεικῶς πάλαι.\n\n ΣΩ. εἶτα πῶς οὐκ εὐθὺς ἐπήγειράς με, ἀλλὰ σιγῇ παρακάθησαι;\n ΚΡ. οὐ μὰ τὸν Δία, ὦ Σώκρατες, οὐδʼ ἂν αὐτὸς ἤθελον ἐν τοσαύτῃ τε ἀγρυπνίᾳ καὶ λύπῃ εἶναι, ἀλλὰ καὶ σοῦ πάλαι θαυμάζω αἰσθανόμενος ὡς ἡδέως καθεύδεις· καὶ ἐπίτηδές σε οὐκ ἤγειρον ἵνα ὡς ἥδιστα διάγῃς. καὶ πολλάκις μὲν δή σε καὶ πρότερον ἐν παντὶ τῷ βίῳ ηὐδαιμόνισα τοῦ τρόπου, πολὺ δὲ μάλιστα ἐν τῇ νῦν παρεστώσῃ συμφορᾷ, ὡς ῥᾳδίως αὐτὴν καὶ πρᾴως φέρεις.\n ΣΩ. καὶ γὰρ ἄν, ὦ Κρίτων, πλημμελὲς εἴη ἀγανακτεῖν τηλικοῦτον ὄντα εἰ δεῖ ἤδη τελευτᾶν.\n\n ΚΡ. καὶ ἄλλοι, ὦ Σώκρατες, τηλικοῦτοι ἐν τοιαύταις συμφοραῖς ἁλίσκονται, ἀλλʼ οὐδὲν αὐτοὺς ἐπιλύεται ἡ ἡλικία τὸ μὴ οὐχὶ ἀγανακτεῖν τῇ παρούσῃ τύχῃ.\n ΣΩ. ἔστι ταῦτα. ἀλλὰ τί δὴ οὕτω πρῲ ἀφῖξαι;\n ΚΡ. ἀγγελίαν, ὦ Σώκρατες, φέρων χαλεπήν, οὐ σοί, ὡς ἐμοὶ φαίνεται, ἀλλʼ ἐμοὶ καὶ τοῖς σοῖς ἐπιτηδείοις πᾶσιν καὶ χαλεπὴν καὶ βαρεῖαν, ἣν ἐγώ, ὡς ἐμοὶ δοκῶ, ἐν τοῖς βαρύτατʼ ἂν ἐνέγκαιμι.\n ΣΩ. τίνα ταύτην; ἢ τὸ πλοῖον ἀφῖκται ἐκ Δήλου, οὗ δεῖ ἀφικομένου τεθνάναι με;\n ΚΡ. οὔτοι δὴ ἀφῖκται, ἀλλὰ δοκεῖν μέν μοι ἥξει τήμερον ἐξ ὧν ἀπαγγέλλουσιν ἥκοντές τινες ἀπὸ Σουνίου καὶ καταλιπόντες ἐκεῖ αὐτό. δῆλον οὖν ἐκ τούτων ὅτι ἥξει τήμερον, καὶ ἀνάγκη δὴ εἰς αὔριον ἔσται, ὦ Σώκρατες, τὸν βίον σε τελευτᾶν.\n ΣΩ. ἀλλʼ, ὦ Κρίτων, τύχῃ ἀγαθῇ, εἰ ταύτῃ τοῖς θεοῖς φίλον, ταύτῃ ἔστω· οὐ μέντοι οἶμαι ἥξειν αὐτὸ τήμερον."
      },
      {
        n: "44",
        label: "§44",
        text: "ΚΡ. πόθεν τοῦτο τεκμαίρῃ;\n ΣΩ. ἐγώ σοι ἐρῶ. τῇ γάρ που ὑστεραίᾳ δεῖ με ἀποθνῄσκειν ἢ ᾗ ἂν ἔλθῃ τὸ πλοῖον.\n ΚΡ. φασί γέ τοι δὴ οἱ τούτων κύριοι.\n ΣΩ. οὐ τοίνυν τῆς ἐπιούσης ἡμέρας οἶμαι αὐτὸ ἥξειν ἀλλὰ τῆς ἑτέρας. τεκμαίρομαι δὲ ἔκ τινος ἐνυπνίου ὃ ἑώρακα ὀλίγον πρότερον ταύτης τῆς νυκτός· καὶ κινδυνεύεις ἐν καιρῷ τινι οὐκ ἐγεῖραί με.\n ΚΡ. ἦν δὲ δὴ τί τὸ ἐνύπνιον;\n ΣΩ. ἐδόκει τίς μοι γυνὴ προσελθοῦσα καλὴ καὶ εὐειδής, λευκὰ ἱμάτια ἔχουσα, καλέσαι με καὶ εἰπεῖν· ὦ Σώκρατες, \n\n ἤματί κεν τριτάτῳ Φθίην ἐρίβωλον ἵκοιο.\n\n ηομ. ιλ. 9.363\n\n ΚΡ. ἄτοπον τὸ ἐνύπνιον, ὦ Σώκρατες.\n ΣΩ. ἐναργὲς μὲν οὖν, ὥς γέ μοι δοκεῖ, ὦ Κρίτων.\n ΚΡ. λίαν γε, ὡς ἔοικεν. ἀλλʼ, ὦ δαιμόνιε Σώκρατες, ἔτι καὶ νῦν ἐμοὶ πιθοῦ καὶ σώθητι· ὡς ἐμοί, ἐὰν σὺ ἀποθάνῃς, οὐ μία συμφορά ἐστιν, ἀλλὰ χωρὶς μὲν τοῦ ἐστερῆσθαι τοιούτου ἐπιτηδείου οἷον ἐγὼ οὐδένα μή ποτε εὑρήσω, ἔτι δὲ καὶ πολλοῖς δόξω, οἳ ἐμὲ καὶ σὲ μὴ σαφῶς ἴσασιν, ὡς οἷός τʼ ὤν σε σῴζειν εἰ ἤθελον ἀναλίσκειν χρήματα, ἀμελῆσαι. καίτοι τίς ἂν αἰσχίων εἴη ταύτης δόξα ἢ δοκεῖν χρήματα περὶ πλείονος ποιεῖσθαι ἢ φίλους; οὐ γὰρ πείσονται οἱ πολλοὶ ὡς σὺ αὐτὸς οὐκ ἠθέλησας ἀπιέναι ἐνθένδε ἡμῶν προθυμουμένων.\n ΣΩ. ἀλλὰ τί ἡμῖν, ὦ μακάριε Κρίτων, οὕτω τῆς τῶν πολλῶν δόξης μέλει; οἱ γὰρ ἐπιεικέστατοι, ὧν μᾶλλον ἄξιον φροντίζειν, ἡγήσονται αὐτὰ οὕτω πεπρᾶχθαι ὥσπερ ἂν πραχθῇ.\n\n ΚΡ. ἀλλʼ ὁρᾷς δὴ ὅτι ἀνάγκη, ὦ Σώκρατες, καὶ τῆς τῶν πολλῶν δόξης μέλειν. αὐτὰ δὲ δῆλα τὰ παρόντα νυνὶ ὅτι οἷοί τʼ εἰσὶν οἱ πολλοὶ οὐ τὰ σμικρότατα τῶν κακῶν ἐξεργάζεσθαι ἀλλὰ τὰ μέγιστα σχεδόν, ἐάν τις ἐν αὐτοῖς διαβεβλημένος ᾖ.\n ΣΩ. εἰ γὰρ ὤφελον, ὦ Κρίτων, οἷοί τʼ εἶναι οἱ πολλοὶ τὰ μέγιστα κακὰ ἐργάζεσθαι, ἵνα οἷοί τʼ ἦσαν καὶ ἀγαθὰ τὰ μέγιστα, καὶ καλῶς ἂν εἶχεν. νῦν δὲ οὐδέτερα οἷοί τε· οὔτε γὰρ φρόνιμον οὔτε ἄφρονα δυνατοὶ ποιῆσαι, ποιοῦσι δὲ τοῦτο ὅτι ἂν τύχωσι.\n\n ΚΡ. ταῦτα μὲν δὴ οὕτως ἐχέτω· τάδε δέ, ὦ Σώκρατες, εἰπέ μοι. ἆρά γε μὴ ἐμοῦ προμηθῇ καὶ τῶν ἄλλων ἐπιτηδείων μή, ἐὰν σὺ ἐνθένδε ἐξέλθῃς, οἱ συκοφάνται ἡμῖν πράγματα παρέχωσιν ὡς σὲ ἐνθένδε ἐκκλέψασιν, καὶ ἀναγκασθῶμεν ἢ καὶ πᾶσαν τὴν οὐσίαν ἀποβαλεῖν ἢ συχνὰ χρήματα, ἢ καὶ ἄλλο τι πρὸς τούτοις παθεῖν;"
      },
      {
        n: "45",
        label: "§45",
        text: "ΚΡ. \n εἰ γάρ τι \n τοιοῦτον φοβῇ, ἔασον αὐτὸ χαίρειν· ἡμεῖς γάρ που δίκαιοί ἐσμεν σώσαντές σε κινδυνεύειν τοῦτον τὸν κίνδυνον καὶ ἐὰν δέῃ ἔτι τούτου μείζω. ἀλλʼ ἐμοὶ πείθου καὶ μὴ ἄλλως ποίει.\n ΣΩ. καὶ ταῦτα προμηθοῦμαι, ὦ Κρίτων, καὶ ἄλλα πολλά.\n ΚΡ. μήτε τοίνυν ταῦτα φοβοῦ—καὶ γὰρ οὐδὲ πολὺ τἀργύριόν ἐστιν ὃ θέλουσι λαβόντες τινὲς σῶσαί σε καὶ ἐξαγαγεῖν ἐνθένδε. ἔπειτα οὐχ ὁρᾷς τούτους τοὺς συκοφάντας ὡς εὐτελεῖς, καὶ οὐδὲν ἂν δέοι ἐπʼ αὐτοὺς πολλοῦ ἀργυρίου; σοὶ δὲ ὑπάρχει μὲν τὰ ἐμὰ χρήματα, ὡς ἐγὼ οἶμαι, ἱκανά· ἔπειτα καὶ εἴ τι ἐμοῦ κηδόμενος οὐκ οἴει δεῖν ἀναλίσκειν τἀμά, ξένοι οὗτοι ἐνθάδε ἕτοιμοι ἀναλίσκειν· εἷς δὲ καὶ κεκόμικεν ἐπʼ αὐτὸ τοῦτο ἀργύριον ἱκανόν, Σιμμίας ὁ Θηβαῖος, ἕτοιμος δὲ καὶ Κέβης καὶ ἄλλοι πολλοὶ πάνυ. ὥστε, ὅπερ λέγω, μήτε ταῦτα φοβούμενος ἀποκάμῃς σαυτὸν σῶσαι, μήτε, ὃ ἔλεγες ἐν τῷ δικαστηρίῳ, δυσχερές σοι γενέσθω ὅτι οὐκ ἂν ἔχοις ἐξελθὼν ὅτι χρῷο σαυτῷ· πολλαχοῦ μὲν γὰρ καὶ ἄλλοσε ὅποι ἂν ἀφίκῃ ἀγαπήσουσί σε· ἐὰν δὲ βούλῃ εἰς Θετταλίαν ἰέναι, εἰσὶν ἐμοὶ ἐκεῖ ξένοι οἵ σε περὶ πολλοῦ ποιήσονται καὶ ἀσφάλειάν σοι παρέξονται, ὥστε σε μηδένα λυπεῖν τῶν κατὰ Θετταλίαν.ἔτι δέ, ὦ Σώκρατες, οὐδὲ δίκαιόν μοι δοκεῖς ἐπιχειρεῖν πρᾶγμα, σαυτὸν προδοῦναι, ἐξὸν σωθῆναι, καὶ τοιαῦτα σπεύδεις περὶ σαυτὸν γενέσθαι ἅπερ ἂν καὶ οἱ ἐχθροί σου σπεύσαιέν τε καὶ ἔσπευσαν σὲ διαφθεῖραι βουλόμενοι. πρὸς δὲ τούτοις καὶ τοὺς ὑεῖς τοὺς σαυτοῦ ἔμοιγε δοκεῖς προδιδόναι, οὕς σοι ἐξὸν καὶ ἐκθρέψαι καὶ ἐκπαιδεῦσαι οἰχήσῃ καταλιπών, καὶ τὸ σὸν μέρος ὅτι ἂν τύχωσι τοῦτο πράξουσιν· τεύξονται δέ, ὡς τὸ εἰκός, τοιούτων οἷάπερ εἴωθεν γίγνεσθαι ἐν ταῖς ὀρφανίαις περὶ τοὺς ὀρφανούς. ἢ γὰρ οὐ χρὴ ποιεῖσθαι παῖδας ἢ συνδιαταλαιπωρεῖν καὶ τρέφοντα καὶ παιδεύοντα, σὺ δέ μοι δοκεῖς τὰ ῥᾳθυμότατα αἱρεῖσθαι. χρὴ δέ, ἅπερ ἂν ἀνὴρ ἀγαθὸς καὶ ἀνδρεῖος ἕλοιτο, ταῦτα αἱρεῖσθαι, φάσκοντά γε δὴ ἀρετῆς διὰ παντὸς τοῦ βίου ἐπιμελεῖσθαι· ὡς ἔγωγε καὶ ὑπὲρ σοῦ καὶ ὑπὲρ ἡμῶν τῶν σῶν ἐπιτηδείων αἰσχύνομαι μὴ δόξῃ ἅπαν τὸ πρᾶγμα τὸ περὶ σὲ ἀνανδρίᾳ τινὶ τῇ ἡμετέρᾳ πεπρᾶχθαι, καὶ ἡ εἴσοδος τῆς δίκης εἰς τὸ δικαστήριον ὡς εἰσῆλθεν ἐξὸν μὴ εἰσελθεῖν, καὶ αὐτὸς ὁ ἀγὼν τῆς δίκης ὡς ἐγένετο, καὶ τὸ τελευταῖον δὴ τουτί, ὥσπερ κατάγελως τῆς πράξεως, κακίᾳ τινὶ καὶ ἀνανδρίᾳ τῇ ἡμετέρᾳ διαπεφευγέναι ἡμᾶς δοκεῖν, οἵτινές σε οὐχὶ ἐσώσαμεν οὐδὲ σὺ σαυτόν, οἷόν τε ὂν καὶ δυνατὸν εἴ τι καὶ μικρὸν ἡμῶν ὄφελος ἦν."
      },
      {
        n: "46",
        label: "§46",
        text: "ΚΡ. ταῦτα οὖν, ὦ Σώκρατες, ὅρα μὴ ἅμα τῷ κακῷ καὶ αἰσχρὰ ᾖ σοί τε καὶ ἡμῖν. ἀλλὰ βουλεύου—μᾶλλον δὲ οὐδὲ βουλεύεσθαι ἔτι ὥρα ἀλλὰ βεβουλεῦσθαι—μία δὲ βουλή· τῆς γὰρ ἐπιούσης νυκτὸς πάντα ταῦτα δεῖ πεπρᾶχθαι, εἰ δʼ ἔτι περιμενοῦμεν, ἀδύνατον καὶ οὐκέτι οἷόν τε. ἀλλὰ παντὶ τρόπῳ, ὦ Σώκρατες, πείθου μοι καὶ μηδαμῶς ἄλλως ποίει.\n\n ΣΩ. ὦ φίλε Κρίτων, ἡ προθυμία σου πολλοῦ ἀξία εἰ μετά τινος ὀρθότητος εἴη· εἰ δὲ μή, ὅσῳ μείζων τοσούτῳ χαλεπωτέρα. σκοπεῖσθαι οὖν χρὴ ἡμᾶς εἴτε ταῦτα πρακτέον εἴτε μή· ὡς ἐγὼ οὐ νῦν πρῶτον ἀλλὰ καὶ ἀεὶ τοιοῦτος οἷος τῶν ἐμῶν μηδενὶ ἄλλῳ πείθεσθαι ἢ τῷ λόγῳ ὃς ἄν μοι λογιζομένῳ βέλτιστος φαίνηται. τοὺς δὴ λόγους οὓς ἐν τῷ ἔμπροσθεν ἔλεγον οὐ δύναμαι νῦν ἐκβαλεῖν, ἐπειδή μοι ἥδε ἡ τύχη γέγονεν, ἀλλὰ σχεδόν τι ὅμοιοι φαίνονταί μοι, καὶ τοὺς αὐτοὺς πρεσβεύω καὶ τιμῶ οὕσπερ καὶ πρότερον· ὧν ἐὰν μὴ βελτίω ἔχωμεν λέγειν ἐν τῷ παρόντι, εὖ ἴσθι ὅτι οὐ μή σοι συγχωρήσω, οὐδʼ ἂν πλείω τῶν νῦν παρόντων ἡ τῶν πολλῶν δύναμις ὥσπερ παῖδας ἡμᾶς μορμολύττηται, δεσμοὺς καὶ θανάτους ἐπιπέμπουσα καὶ χρημάτων ἀφαιρέσεις. πῶς οὖν ἂν μετριώτατα σκοποίμεθα αὐτά; εἰ πρῶτον μὲν τοῦτον τὸν λόγον ἀναλάβοιμεν, ὃν σὺ λέγεις περὶ τῶν δοξῶν. πότερον καλῶς ἐλέγετο ἑκάστοτε ἢ οὔ, ὅτι ταῖς μὲν δεῖ τῶν δοξῶν προσέχειν τὸν νοῦν, ταῖς δὲ οὔ; ἢ πρὶν μὲν ἐμὲ δεῖν ἀποθνῄσκειν καλῶς ἐλέγετο, νῦν δὲ κατάδηλος ἄρα ἐγένετο ὅτι ἄλλως ἕνεκα λόγου ἐλέγετο, ἦν δὲ παιδιὰ καὶ φλυαρία ὡς ἀληθῶς; ἐπιθυμῶ δʼ ἔγωγʼ ἐπισκέψασθαι, ὦ Κρίτων, κοινῇ μετὰ σοῦ εἴ τί μοι ἀλλοιότερος φανεῖται, ἐπειδὴ ὧδε ἔχω, ἢ ὁ αὐτός, καὶ ἐάσομεν χαίρειν ἢ πεισόμεθα αὐτῷ. ἐλέγετο δέ πως, ὡς ἐγᾦμαι, ἑκάστοτε ὧδε ὑπὸ τῶν οἰομένων τὶ λέγειν, ὥσπερ νυνδὴ ἐγὼ ἔλεγον, ὅτι τῶν δοξῶν ἃς οἱ ἄνθρωποι δοξάζουσιν δέοι τὰς μὲν περὶ πολλοῦ ποιεῖσθαι, τὰς δὲ μή. τοῦτο πρὸς θεῶν, ὦ Κρίτων, οὐ δοκεῖ καλῶς σοι λέγεσθαι;"
      },
      {
        n: "47",
        label: "§47",
        text: "ΣΩ. —σὺ γάρ, ὅσα γε τἀνθρώπεια, ἐκτὸς εἶ τοῦ μέλλειν ἀποθνῄσκειν\n\n αὔριον, καὶ οὐκ ἂν σὲ παρακρούοι ἡ παροῦσα συμφορά· σκόπει δή—οὐχ ἱκανῶς δοκεῖ σοι λέγεσθαι ὅτι οὐ πάσας χρὴ τὰς δόξας τῶν ἀνθρώπων τιμᾶν ἀλλὰ τὰς μέν, τὰς δʼ οὔ, οὐδὲ πάντων ἀλλὰ τῶν μέν, τῶν δʼ οὔ; τί φῄς; ταῦτα οὐχὶ καλῶς λέγεται;\n ΚΡ. καλῶς.\n ΣΩ. οὐκοῦν τὰς μὲν χρηστὰς τιμᾶν, τὰς δὲ πονηρὰς μή;\n ΚΡ. ναί.\n ΣΩ. χρησταὶ δὲ οὐχ αἱ τῶν φρονίμων, πονηραὶ δὲ αἱ τῶν ἀφρόνων;\n ΚΡ. πῶς δʼ οὔ;\n ΣΩ. φέρε δή, πῶς αὖ τὰ τοιαῦτα ἐλέγετο; γυμναζόμενος ἀνὴρ καὶ τοῦτο πράττων πότερον παντὸς ἀνδρὸς ἐπαίνῳ καὶ ψόγῳ καὶ δόξῃ τὸν νοῦν προσέχει, ἢ ἑνὸς μόνου ἐκείνου ὃς ἂν τυγχάνῃ ἰατρὸς ἢ παιδοτρίβης ὤν;\n ΚΡ. ἑνὸς μόνου.\n ΣΩ. οὐκοῦν φοβεῖσθαι χρὴ τοὺς ψόγους καὶ ἀσπάζεσθαι τοὺς ἐπαίνους τοὺς τοῦ ἑνὸς ἐκείνου ἀλλὰ μὴ τοὺς τῶν πολλῶν.\n ΚΡ. δῆλα δή.\n ΣΩ. ταύτῃ ἄρα αὐτῷ πρακτέον καὶ γυμναστέον καὶ ἐδεστέον γε καὶ ποτέον, ᾗ ἂν τῷ ἑνὶ δοκῇ, τῷ ἐπιστάτῃ καὶ ἐπαΐοντι, μᾶλλον ἢ ᾗ σύμπασι τοῖς ἄλλοις.\n ΚΡ. ἔστι ταῦτα.\n\n ΣΩ. εἶεν. ἀπειθήσας δὲ τῷ ἑνὶ καὶ ἀτιμάσας αὐτοῦ τὴν δόξαν καὶ τοὺς ἐπαίνους, τιμήσας δὲ τοὺς τῶν πολλῶν καὶ μηδὲν ἐπαϊόντων, ἆρα οὐδὲν κακὸν πείσεται;\n ΚΡ. πῶς γὰρ οὔ;\n ΣΩ. τί δʼ ἔστι τὸ κακὸν τοῦτο, καὶ ποῖ τείνει, καὶ εἰς τί τῶν τοῦ ἀπειθοῦντος;\n ΚΡ. δῆλον ὅτι εἰς τὸ σῶμα· τοῦτο γὰρ διόλλυσι.\n ΣΩ. καλῶς λέγεις. οὐκοῦν καὶ τἆλλα, ὦ Κρίτων, οὕτως, ἵνα μὴ πάντα διΐωμεν, καὶ δὴ καὶ περὶ τῶν δικαίων καὶ ἀδίκων καὶ αἰσχρῶν καὶ καλῶν καὶ ἀγαθῶν καὶ κακῶν, περὶ ὧν νῦν ἡ βουλὴ ἡμῖν ἐστιν, πότερον τῇ τῶν πολλῶν δόξῃ δεῖ ἡμᾶς ἕπεσθαι καὶ φοβεῖσθαι αὐτὴν ἢ τῇ τοῦ ἑνός, εἴ τίς ἐστιν ἐπαΐων, ὃν δεῖ καὶ αἰσχύνεσθαι καὶ φοβεῖσθαι μᾶλλον ἢ σύμπαντας τοὺς ἄλλους; ᾧ εἰ μὴ ἀκολουθήσομεν, διαφθεροῦμεν ἐκεῖνο καὶ λωβησόμεθα, ὃ τῷ μὲν δικαίῳ βέλτιον ἐγίγνετο τῷ δὲ ἀδίκῳ ἀπώλλυτο. ἢ οὐδέν ἐστι τοῦτο;\n ΚΡ. οἶμαι ἔγωγε, ὦ Σώκρατες.\n ΣΩ. φέρε δή, ἐὰν τὸ ὑπὸ τοῦ ὑγιεινοῦ μὲν βέλτιον γιγνόμενον, ὑπὸ τοῦ νοσώδους δὲ διαφθειρόμενον διολέσωμεν πειθόμενοι μὴ τῇ τῶν ἐπαϊόντων δόξῃ, ἆρα βιωτὸν ἡμῖν ἐστιν διεφθαρμένου αὐτοῦ; ἔστι δέ που τοῦτο σῶμα· ἢ οὐχί;\n ΚΡ. ναί.\n ΣΩ. ἆρʼ οὖν βιωτὸν ἡμῖν ἐστιν μετὰ μοχθηροῦ καὶ διεφθαρμένου σώματος;\n ΚΡ. οὐδαμῶς.\n ΣΩ. ἀλλὰ μετʼ ἐκείνου ἄρʼ ἡμῖν βιωτὸν διεφθαρμένου, ᾧ τὸ ἄδικον μὲν λωβᾶται, τὸ δὲ δίκαιον ὀνίνησιν; ἢ φαυλότερον ἡγούμεθα εἶναι τοῦ σώματος ἐκεῖνο, ὅτι ποτʼ ἐστὶ τῶν ἡμετέρων, περὶ ὃ ἥ τε ἀδικία καὶ ἡ δικαιοσύνη ἐστίν;"
      },

        n: "48",
        label: "§48",
        text: "ΚΡ. οὐδαμῶς.\n ΣΩ. ἀλλὰ τιμιώτερον;\n ΚΡ. πολύ γε.\n ΣΩ. οὐκ ἄρα, ὦ βέλτιστε, πάνυ ἡμῖν οὕτω φροντιστέον τί ἐροῦσιν οἱ πολλοὶ ἡμᾶς, ἀλλʼ ὅτι ὁ ἐπαΐων περὶ τῶν δικαίων καὶ ἀδίκων, ὁ εἷς καὶ αὐτὴ ἡ ἀλήθεια. ὥστε πρῶτον μὲν ταύτῃ οὐκ ὀρθῶς εἰσηγῇ, εἰσηγούμενος τῆς τῶν πολλῶν δόξης δεῖν ἡμᾶς φροντίζειν περὶ τῶν δικαίων καὶ καλῶν καὶ ἀγαθῶν καὶ τῶν ἐναντίων. ἀλλὰ μὲν δή, φαίη γʼ ἄν τις, οἷοί τέ εἰσιν ἡμᾶς οἱ πολλοὶ ἀποκτεινύναι.\n\n ΚΡ. δῆλα δὴ καὶ ταῦτα· φαίη γὰρ ἄν, ὦ Σώκρατες. ἀληθῆ λέγεις.\n ΣΩ. ἀλλʼ, ὦ θαυμάσιε, οὗτός τε ὁ λόγος ὃν διεληλύθαμεν ἔμοιγε δοκεῖ ἔτι ὅμοιος εἶναι καὶ πρότερον· καὶ τόνδε δὲ αὖ σκόπει εἰ ἔτι μένει ἡμῖν ἢ οὔ, ὅτι οὐ τὸ ζῆν περὶ πλείστου ποιητέον ἀλλὰ τὸ εὖ ζῆν.\n ΚΡ. ἀλλὰ μένει.\n ΣΩ. τὸ δὲ εὖ καὶ καλῶς καὶ δικαίως ὅτι ταὐτόν ἐστιν, μένει ἢ οὐ μένει;\n ΚΡ. μένει.\n ΣΩ. οὐκοῦν ἐκ τῶν ὁμολογουμένων τοῦτο σκεπτέον, πότερον δίκαιον ἐμὲ ἐνθένδε πειρᾶσθαι ἐξιέναι μὴ ἀφιέντων Ἀθηναίων ἢ οὐ δίκαιον· καὶ ἐὰν μὲν φαίνηται δίκαιον, πειρώμεθα, εἰ δὲ μή, ἐῶμεν. ἃς δὲ σὺ λέγεις τὰς σκέψεις περί τε ἀναλώσεως χρημάτων καὶ δόξης καὶ παίδων τροφῆς, μὴ ὡς ἀληθῶς ταῦτα, ὦ Κρίτων, σκέμματα ᾖ τῶν ῥᾳδίως ἀποκτεινύντων καὶ ἀναβιωσκομένων γʼ ἄν, εἰ οἷοί τʼ ἦσαν, οὐδενὶ ξὺν νῷ, τούτων τῶν πολλῶν. ἡμῖν δʼ, ἐπειδὴ ὁ λόγος οὕτως αἱρεῖ, μὴ οὐδὲν ἄλλο σκεπτέον ᾖ ἢ ὅπερ νυνδὴ ἐλέγομεν, πότερον δίκαια πράξομεν καὶ χρήματα τελοῦντες τούτοις τοῖς ἐμὲ ἐνθένδε ἐξάξουσιν καὶ χάριτας, καὶ αὐτοὶ ἐξάγοντές τε καὶ ἐξαγόμενοι, ἢ τῇ ἀληθείᾳ ἀδικήσομεν πάντα ταῦτα ποιοῦντες· κἂν φαινώμεθα ἄδικα αὐτὰ ἐργαζόμενοι, μὴ οὐ δέῃ ὑπολογίζεσθαι οὔτʼ εἰ ἀποθνῄσκειν δεῖ παραμένοντας καὶ ἡσυχίαν ἄγοντας, οὔτε ἄλλο ὁτιοῦν πάσχειν πρὸ τοῦ ἀδικεῖν.\n ΚΡ. καλῶς μέν μοι δοκεῖς λέγειν, ὦ Σώκρατες, ὅρα δὲ τί δρῶμεν.\n ΣΩ. σκοπῶμεν, ὦ ἀγαθέ, κοινῇ, καὶ εἴ πῃ ἔχεις ἀντιλέγειν ἐμοῦ λέγοντος, ἀντίλεγε καί σοι πείσομαι· εἰ δὲ μή, παῦσαι ἤδη, ὦ μακάριε, πολλάκις μοι λέγων τὸν αὐτὸν λόγον, ὡς χρὴ ἐνθένδε ἀκόντων Ἀθηναίων ἐμὲ ἀπιέναι· ὡς ἐγὼ περὶ πολλοῦ ποιοῦμαι πείσας σε ταῦτα πράττειν, ἀλλὰ μὴ ἄκοντος. ὅρα δὲ δὴ τῆς σκέψεως τὴν ἀρχὴν ἐάν σοι \n ἱκανῶς λέγηται, καὶ πειρῶ ἀποκρίνεσθαι τὸ ἐρωτώμενον ᾗ ἂν μάλιστα οἴῃ."
      },
      {
        n: "49",
        label: "§49",
        text: "ΚΡ. ἀλλὰ πειράσομαι.\n ΣΩ. οὐδενὶ τρόπῳ φαμὲν ἑκόντας ἀδικητέον εἶναι, ἢ τινὶ μὲν ἀδικητέον τρόπῳ τινὶ δὲ οὔ; ἢ οὐδαμῶς τό γε ἀδικεῖν οὔτε ἀγαθὸν οὔτε καλόν, ὡς πολλάκις ἡμῖν καὶ ἐν τῷ ἔμπροσθεν χρόνῳ ὡμολογήθη; ἢ πᾶσαι ἡμῖν ἐκεῖναι αἱ πρόσθεν ὁμολογίαι ἐν ταῖσδε ταῖς ὀλίγαις ἡμέραις ἐκκεχυμέναι εἰσίν, καὶ πάλαι, ὦ Κρίτων, ἄρα τηλικοίδε ἄνδρες πρὸς ἀλλήλους σπουδῇ διαλεγόμενοι ἐλάθομεν ἡμᾶς αὐτοὺς παίδων οὐδὲν διαφέροντες; ἢ παντὸς μᾶλλον οὕτως ἔχει ὥσπερ τότε ἐλέγετο ἡμῖν· εἴτε φασὶν οἱ πολλοὶ εἴτε μή, καὶ εἴτε δεῖ ἡμᾶς ἔτι τῶνδε χαλεπώτερα πάσχειν εἴτε καὶ πρᾳότερα, ὅμως τό γε ἀδικεῖν τῷ ἀδικοῦντι καὶ κακὸν καὶ αἰσχρὸν τυγχάνει ὂν παντὶ τρόπῳ; φαμὲν ἢ οὔ;\n ΚΡ. φαμέν.\n ΣΩ. οὐδαμῶς ἄρα δεῖ ἀδικεῖν.\n ΚΡ. οὐ δῆτα.\n ΣΩ. οὐδὲ ἀδικούμενον ἄρα ἀνταδικεῖν, ὡς οἱ πολλοὶ οἴονται, ἐπειδή γε οὐδαμῶς δεῖ ἀδικεῖν.\n\n ΚΡ. οὐ φαίνεται.\n ΣΩ. τί δὲ δή; κακουργεῖν δεῖ, ὦ Κρίτων, ἢ οὔ;\n ΚΡ. οὐ δεῖ δήπου, ὦ Σώκρατες.\n ΣΩ. τί δέ; ἀντικακουργεῖν κακῶς πάσχοντα, ὡς οἱ πολλοί φασιν, δίκαιον ἢ οὐ δίκαιον;\n ΚΡ. οὐδαμῶς.\n ΣΩ. τὸ γάρ που κακῶς ποιεῖν ἀνθρώπους τοῦ ἀδικεῖν οὐδὲν διαφέρει.\n ΚΡ. ἀληθῆ λέγεις.\n ΣΩ. οὔτε ἄρα ἀνταδικεῖν δεῖ οὔτε κακῶς ποιεῖν οὐδένα ἀνθρώπων, οὐδʼ ἂν ὁτιοῦν πάσχῃ ὑπʼ αὐτῶν. καὶ ὅρα, ὦ Κρίτων, ταῦτα καθομολογῶν, ὅπως μὴ παρὰ δόξαν ὁμολογῇς· οἶδα γὰρ ὅτι ὀλίγοις τισὶ ταῦτα καὶ δοκεῖ καὶ δόξει. οἷς οὖν οὕτω δέδοκται καὶ οἷς μή, τούτοις οὐκ ἔστι κοινὴ βουλή, ἀλλὰ ἀνάγκη τούτους ἀλλήλων καταφρονεῖν ὁρῶντας ἀλλήλων τὰ βουλεύματα. σκόπει δὴ οὖν καὶ σὺ εὖ μάλα πότερον κοινωνεῖς καὶ συνδοκεῖ σοι καὶ ἀρχώμεθα ἐντεῦθεν βουλευόμενοι, ὡς οὐδέποτε ὀρθῶς ἔχοντος οὔτε τοῦ ἀδικεῖν οὔτε τοῦ ἀνταδικεῖν οὔτε κακῶς πάσχοντα ἀμύνεσθαι ἀντιδρῶντα κακῶς, ἢ ἀφίστασαι καὶ οὐ κοινωνεῖς τῆς ἀρχῆς; ἐμοὶ μὲν γὰρ καὶ πάλαι οὕτω καὶ νῦν ἔτι δοκεῖ, σοὶ δὲ εἴ πῃ ἄλλῃ δέδοκται, λέγε καὶ δίδασκε. εἰ δʼ ἐμμένεις τοῖς πρόσθε, τὸ μετὰ τοῦτο ἄκουε.\n ΚΡ. ἀλλʼ ἐμμένω τε καὶ συνδοκεῖ μοι· ἀλλὰ λέγε.\n ΣΩ. λέγω δὴ αὖ τὸ μετὰ τοῦτο, μᾶλλον δʼ ἐρωτῶ· πότερον ἃ ἄν τις ὁμολογήσῃ τῳ δίκαια ὄντα ποιητέον ἢ ἐξαπατητέον;\n ΚΡ. ποιητέον."

      {
        n: "50",
        label: "§50",
        text: "ΣΩ. ἐκ τούτων δὴ ἄθρει. ἀπιόντες ἐνθένδε ἡμεῖς μὴ πείσαντες τὴν πόλιν πότερον κακῶς τινας ποιοῦμεν, καὶ ταῦτα οὓς ἥκιστα δεῖ, ἢ οὔ; καὶ ἐμμένομεν οἷς ὡμολογήσαμεν δικαίοις οὖσιν ἢ οὔ;\n ΚΡ. οὐκ ἔχω, ὦ Σώκρατες, ἀποκρίνασθαι πρὸς ὃ ἐρωτᾷς· οὐ γὰρ ἐννοῶ.\n ΣΩ. ἀλλʼ ὧδε σκόπει. εἰ μέλλουσιν ἡμῖν ἐνθένδε εἴτε ἀποδιδράσκειν, εἴθʼ ὅπως δεῖ ὀνομάσαι τοῦτο, ἐλθόντες οἱ νόμοι καὶ τὸ κοινὸν τῆς πόλεως ἐπιστάντες ἔροιντο· εἰπέ μοι, ὦ Σώκρατες, τί ἐν νῷ ἔχεις ποιεῖν; ἄλλο τι ἢ τούτῳ τῷ ἔργῳ ᾧ ἐπιχειρεῖς διανοῇ τούς τε νόμους ἡμᾶς ἀπολέσαι καὶ σύμπασαν τὴν πόλιν τὸ σὸν μέρος; ἢ δοκεῖ σοι οἷόν τε ἔτι ἐκείνην τὴν πόλιν εἶναι καὶ μὴ ἀνατετράφθαι, ἐν ᾗ ἂν αἱ γενόμεναι δίκαι μηδὲν ἰσχύωσιν ἀλλὰ ὑπὸ ἰδιωτῶν ἄκυροί τε γίγνωνται καὶ διαφθείρωνται; τί ἐροῦμεν, ὦ Κρίτων, πρὸς ταῦτα καὶ ἄλλα τοιαῦτα; πολλὰ γὰρ ἄν τις ἔχοι, ἄλλως τε καὶ ῥήτωρ, εἰπεῖν ὑπὲρ τούτου τοῦ νόμου ἀπολλυμένου ὃς τὰς δίκας τὰς δικασθείσας προστάττει κυρίας εἶναι. ἢ ἐροῦμεν πρὸς αὐτοὺς ὅτι ἠδίκει γὰρ ἡμᾶς ἡ πόλις καὶ οὐκ ὀρθῶς τὴν δίκην ἔκρινεν; ταῦτα ἢ τί ἐροῦμεν;\n ΚΡ. ταῦτα νὴ Δία, ὦ Σώκρατες.\n ΣΩ. τί οὖν ἂν εἴπωσιν οἱ νόμοι· ὦ Σώκρατες, ἦ καὶ ταῦτα ὡμολόγητο ἡμῖν τε καὶ σοί, ἢ ἐμμενεῖν ταῖς δίκαις αἷς ἂν ἡ πόλις δικάζῃ; εἰ οὖν αὐτῶν θαυμάζοιμεν λεγόντων, ἴσως ἂν εἴποιεν ὅτι ὦ Σώκρατες, μὴ θαύμαζε τὰ λεγόμενα ἀλλʼ ἀποκρίνου, ἐπειδὴ καὶ εἴωθας χρῆσθαι τῷ ἐρωτᾶν τε καὶ ἀποκρίνεσθαι. φέρε γάρ, τί ἐγκαλῶν\n ἡμῖν καὶ τῇ πόλει ἐπιχειρεῖς ἡμᾶς ἀπολλύναι; οὐ πρῶτον μέν σε ἐγεννήσαμεν ἡμεῖς, καὶ διʼ ἡμῶν ἔλαβε τὴν μητέρα σου ὁ πατὴρ καὶ ἐφύτευσέν σε; φράσον οὖν, τούτοις ἡμῶν, τοῖς νόμοις τοῖς περὶ τοὺς γάμους, μέμφῃ τι ὡς οὐ καλῶς ἔχουσιν; οὐ μέμφομαι, φαίην ἄν. ἀλλὰ τοῖς περὶ τὴν τοῦ γενομένου τροφήν τε καὶ παιδείαν ἐν ᾗ καὶ σὺ ἐπαιδεύθης; ἢ οὐ καλῶς προσέταττον ἡμῶν οἱ ἐπὶ τούτῳ τεταγμένοι νόμοι, παραγγέλλοντες τῷ πατρὶ τῷ σῷ σε ἐν\n μουσικῇ καὶ γυμναστικῇ παιδεύειν; καλῶς, φαίην ἄν. εἶεν. ἐπειδὴ δὲ ἐγένου τε καὶ ἐξετράφης καὶ ἐπαιδεύθης, ἔχοις ἂν εἰπεῖν πρῶτον μὲν ὡς οὐχὶ ἡμέτερος ἦσθα καὶ ἔκγονος καὶ δοῦλος, αὐτός τε καὶ οἱ σοὶ πρόγονοι; καὶ εἰ τοῦθʼ οὕτως ἔχει, ἆρʼ ἐξ ἴσου οἴει εἶναι σοὶ τὸ δίκαιον καὶ ἡμῖν, καὶ ἅττʼ ἂν ἡμεῖς σε ἐπιχειρῶμεν ποιεῖν, καὶ σοὶ ταῦτα ἀντιποιεῖν οἴει δίκαιον εἶναι;"
      },
      {
        n: "51",
        label: "§51",
        text: "ΣΩ. ἢ πρὸς μὲν ἄρα σοι τὸν πατέρα οὐκ ἐξ ἴσου ἦν τὸ δίκαιον καὶ πρὸς δεσπότην, εἴ σοι ὢν ἐτύγχανεν, ὥστε ἅπερ πάσχοις ταῦτα καὶ ἀντιποιεῖν, οὔτε κακῶς ἀκούοντα ἀντιλέγειν οὔτε τυπτόμενον ἀντιτύπτειν οὔτε ἄλλα τοιαῦτα πολλά· πρὸς δὲ τὴν πατρίδα ἄρα καὶ τοὺς νόμους ἐξέσται σοι, ὥστε, ἐάν σε ἐπιχειρῶμεν ἡμεῖς ἀπολλύναι δίκαιον ἡγούμενοι εἶναι, καὶ σὺ δὲ ἡμᾶς τοὺς νόμους καὶ τὴν πατρίδα καθʼ ὅσον δύνασαι ἐπιχειρήσεις ἀνταπολλύναι, καὶ φήσεις ταῦτα ποιῶν δίκαια πράττειν, ὁ τῇ ἀληθείᾳ τῆς ἀρετῆς ἐπιμελόμενος; ἢ οὕτως εἶ σοφὸς ὥστε λέληθέν σε ὅτι μητρός τε καὶ πατρὸς καὶ τῶν ἄλλων προγόνων ἁπάντων τιμιώτερόν ἐστιν πατρὶς καὶ σεμνότερον καὶ ἁγιώτερον\n καὶ ἐν μείζονι μοίρᾳ καὶ παρὰ θεοῖς καὶ παρʼ ἀνθρώποις τοῖς νοῦν ἔχουσι, καὶ σέβεσθαι δεῖ καὶ μᾶλλον ὑπείκειν καὶ θωπεύειν πατρίδα χαλεπαίνουσαν ἢ πατέρα, καὶ ἢ πείθειν ἢ ποιεῖν ἃ ἂν κελεύῃ, καὶ πάσχειν ἐάν τι προστάττῃ παθεῖν ἡσυχίαν ἄγοντα, ἐάντε τύπτεσθαι ἐάντε δεῖσθαι, ἐάντε εἰς πόλεμον ἄγῃ τρωθησόμενον ἢ ἀποθανούμενον, ποιητέον ταῦτα, καὶ τὸ δίκαιον οὕτως ἔχει, καὶ οὐχὶ ὑπεικτέον οὐδὲ ἀναχωρητέον οὐδὲ λειπτέον τὴν τάξιν, ἀλλὰ καὶ ἐν πολέμῳ καὶ ἐν δικαστηρίῳ καὶ πανταχοῦ ποιητέον ἃ ἂν κελεύῃ ἡ\n πόλις καὶ ἡ πατρίς, ἢ πείθειν αὐτὴν ᾗ τὸ δίκαιον πέφυκε· βιάζεσθαι δὲ οὐχ ὅσιον οὔτε μητέρα οὔτε πατέρα, πολὺ δὲ τούτων ἔτι ἧττον τὴν πατρίδα; τί φήσομεν πρὸς ταῦτα, ὦ Κρίτων; ἀληθῆ λέγειν τοὺς νόμους ἢ οὔ;\n ΚΡ. ἔμοιγε δοκεῖ.\n ΣΩ. σκόπει τοίνυν, ὦ Σώκρατες, φαῖεν ἂν ἴσως οἱ νόμοι, εἰ ἡμεῖς ταῦτα ἀληθῆ λέγομεν, ὅτι οὐ δίκαια ἡμᾶς ἐπιχειρεῖς δρᾶν ἃ νῦν ἐπιχειρεῖς. ἡμεῖς γάρ σε γεννήσαντες, ἐκθρέψαντες, παιδεύσαντες, μεταδόντες ἁπάντων ὧν οἷοί τʼ\n ἦμεν καλῶν σοὶ καὶ τοῖς ἄλλοις πᾶσιν πολίταις, ὅμως προαγορεύομεν τῷ ἐξουσίαν πεποιηκέναι Ἀθηναίων τῷ βουλομένῳ, ἐπειδὰν δοκιμασθῇ καὶ ἴδῃ τὰ ἐν τῇ πόλει πράγματα καὶ ἡμᾶς τοὺς νόμους, ᾧ ἂν μὴ ἀρέσκωμεν ἡμεῖς, ἐξεῖναι λαβόντα τὰ αὑτοῦ ἀπιέναι ὅποι ἂν βούληται. καὶ οὐδεὶς ἡμῶν τῶν νόμων ἐμποδών ἐστιν οὐδʼ ἀπαγορεύει, ἐάντε τις βούληται ὑμῶν εἰς ἀποικίαν ἰέναι, εἰ μὴ ἀρέσκοιμεν ἡμεῖς τε καὶ ἡ πόλις, ἐάντε μετοικεῖν ἄλλοσέ ποι ἐλθών, ἰέναι ἐκεῖσε ὅποι\n ἂν βούληται, ἔχοντα τὰ αὑτοῦ. ὃς δʼ ἂν ὑμῶν παραμείνῃ, ὁρῶν ὃν τρόπον ἡμεῖς τάς τε δίκας δικάζομεν καὶ τἆλλα τὴν πόλιν διοικοῦμεν, ἤδη φαμὲν τοῦτον ὡμολογηκέναι ἔργῳ ἡμῖν ἃ ἂν ἡμεῖς κελεύωμεν ποιήσειν ταῦτα, καὶ τὸν μὴ πειθόμενον τριχῇ φαμεν ἀδικεῖν, ὅτι τε γεννηταῖς οὖσιν ἡμῖν οὐ πείθεται, καὶ ὅτι τροφεῦσι, καὶ ὅτι ὁμολογήσας ἡμῖν πείσεσθαι οὔτε πείθεται οὔτε πείθει ἡμᾶς, εἰ μὴ καλῶς τι ποιοῦμεν,προτιθέντων ἡμῶν καὶ οὐκ ἀγρίως ἐπιταττόντων ποιεῖν ἃ ἂν κελεύωμεν, ἀλλὰ ἐφιέντων δυοῖν θάτερα, ἢ πείθειν ἡμᾶς ἢ ποιεῖν, τούτων οὐδέτερα ποιεῖ."

        n: "52",
        label: "§52",
        text: "ΣΩ. ταύταις δή φαμεν καὶ σέ, ὦ Σώκρατες, ταῖς αἰτίαις ἐνέξεσθαι, εἴπερ ποιήσεις ἃ ἐπινοεῖς, καὶ οὐχ ἥκιστα Ἀθηναίων σέ, ἀλλʼ ἐν τοῖς μάλιστα. εἰ οὖν ἐγὼ εἴποιμι· διὰ τί δή; ἴσως ἄν μου δικαίως καθάπτοιντο λέγοντες ὅτι ἐν τοῖς μάλιστα Ἀθηναίων ἐγὼ αὐτοῖς ὡμολογηκὼς τυγχάνω ταύτην τὴν ὁμολογίαν. φαῖεν γὰρ ἂν ὅτι \n ὦ Σώκρατες, μεγάλα ἡμῖν τούτων τεκμήριά ἐστιν, ὅτι σοι καὶ ἡμεῖς ἠρέσκομεν καὶ ἡ πόλις· οὐ γὰρ ἄν ποτε τῶν ἄλλων Ἀθηναίων ἁπάντων διαφερόντως ἐν αὐτῇ ἐπεδήμεις εἰ μή σοι διαφερόντως ἤρεσκεν, καὶ οὔτʼ ἐπὶ θεωρίαν πώποτʼ ἐκ τῆς πόλεως ἐξῆλθες, ὅτι μὴ ἅπαξ εἰς Ἰσθμόν, οὔτε ἄλλοσε οὐδαμόσε, εἰ μή ποι στρατευσόμενος, οὔτε ἄλλην ἀποδημίαν ἐποιήσω πώποτε ὥσπερ οἱ ἄλλοι ἄνθρωποι, οὐδʼ ἐπιθυμία σε ἄλλης πόλεως οὐδὲ ἄλλων νόμων ἔλαβεν εἰδέναι, ἀλλὰ ἡμεῖς\n σοι ἱκανοὶ ἦμεν καὶ ἡ ἡμετέρα πόλις· οὕτω σφόδρα ἡμᾶς ᾑροῦ καὶ ὡμολόγεις καθʼ ἡμᾶς πολιτεύσεσθαι, τά τε ἄλλα καὶ παῖδας ἐν αὐτῇ ἐποιήσω, ὡς ἀρεσκούσης σοι τῆς πόλεως. ἔτι τοίνυν ἐν αὐτῇ τῇ δίκῃ ἐξῆν σοι φυγῆς τιμήσασθαι εἰ ἐβούλου, καὶ ὅπερ νῦν ἀκούσης τῆς πόλεως ἐπιχειρεῖς, τότε ἑκούσης ποιῆσαι. σὺ δὲ τότε μὲν ἐκαλλωπίζου ὡς οὐκ ἀγανακτῶν εἰ δέοι τεθνάναι σε, ἀλλὰ ᾑροῦ, ὡς ἔφησθα, πρὸ τῆς φυγῆς θάνατον· νῦν δὲ οὔτʼ ἐκείνους τοὺς λόγους αἰσχύνῃ, οὔτε ἡμῶν τῶν νόμων ἐντρέπῃ, ἐπιχειρῶν διαφθεῖραι, πράττεις\n τε ἅπερ ἂν δοῦλος ὁ φαυλότατος πράξειεν, ἀποδιδράσκειν ἐπιχειρῶν παρὰ τὰς συνθήκας τε καὶ τὰς ὁμολογίας καθʼ ἃς ἡμῖν συνέθου πολιτεύεσθαι. πρῶτον μὲν οὖν ἡμῖν τοῦτʼ αὐτὸ ἀπόκριναι, εἰ ἀληθῆ λέγομεν φάσκοντές σε ὡμολογηκέναι πολιτεύσεσθαι καθʼ ἡμᾶς ἔργῳ ἀλλʼ οὐ λόγῳ, ἢ οὐκ ἀληθῆ. τί φῶμεν πρὸς ταῦτα, ὦ Κρίτων; ἄλλο τι ἢ ὁμολογῶμεν;\n ΚΡ. ἀνάγκη, ὦ Σώκρατες.\n ΣΩ. ἄλλο τι οὖν, ἂν φαῖεν, ἢ συνθήκας τὰς πρὸς\n ἡμᾶς αὐτοὺς καὶ ὁμολογίας παραβαίνεις, οὐχ ὑπὸ ἀνάγκης ὁμολογήσας οὐδὲ ἀπατηθεὶς οὐδὲ ἐν ὀλίγῳ χρόνῳ ἀναγκασθεὶς βουλεύσασθαι, ἀλλʼ ἐν ἔτεσιν ἑβδομήκοντα, ἐν οἷς ἐξῆν σοι ἀπιέναι, εἰ μὴ ἠρέσκομεν ἡμεῖς μηδὲ δίκαιαι ἐφαίνοντό σοι αἱ ὁμολογίαι εἶναι."
